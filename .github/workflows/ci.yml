name: CI

# CI 分层（WDSP P1-04 R3 §6.1）PR / 推送层：
#   - 全部核心安全集无条件执行——本工作流刻意不配置 paths/paths-ignore 过滤，
#     任何 PR 都无法跳过 server/gateway/嵌套 Go 模块/前端检查与安全 smoke；
#     后续如需路径过滤，只能在「增加相关集」方向使用，不得用于跳过本文件任何 job。
#   - corpus-schema-check：回归语料/schema 校验 + 语料工具单测 + 签名工具构建测试；
#   - nested-go-modules：嵌套 Go 模块 vet+test+build（任务书限制 5：嵌套模块
#     不得漏跑；模块清单与 test/regression/p1 S0 冻结一致，新增 go.mod 必须补入）；
#   - smoke-waf / smoke-wdsp：固定安全 smoke 核心集（仓内 Dockerfile 真实构建）。
# 定期完整回归层见 .github/workflows/regression-nightly.yml（cron 触发；
# 强制项缺环境标 BLOCKED 且汇总不变绿）。
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---- 回归语料/schema 校验（WDSP P1-04 R3 §6.1：PR 层固定执行，无路径过滤）----
  corpus-schema-check:
    name: Corpus & Schema Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate P1 regression corpus (schema v1 + content hashes)
        run: |
          cd test/regression/p1
          python3 -m p1reg.cli validate-corpus --manifest corpus/manifest.json

      - name: Run P1 regression tool tests
        run: python3 -m unittest discover -s test/regression/p1/tests

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # 证据签名小工具（tools/regsign）为发布门禁信任链的一部分，纳入 PR 层构建+测试
      - name: Build & vet regression sign tool
        working-directory: ./tools/regsign
        run: |
          go vet ./...
          go build ./...

      - name: Run regression evidence package unit tests
        working-directory: ./server
        run: go test -count=1 ./internal/regression/...

  # ---- 嵌套 Go 模块（任务书限制 5：嵌套模块不得漏跑；清单与 S0 冻结一致，
  #      新增 go.mod 必须同步补入本 matrix）----
  nested-go-modules:
    name: Nested Go Module (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway/modules/jiuzhang_guard
          - gateway/dynamic_security
          - wdsp-agent
          - tools/apisrc
          - tools/regsign
          - deployment/stage1/testorigin
          - test/security-apm-demo/services
          - test/wdsp-agent-e2e/poptool
          - test/wdsp-agent-e2e/envoy-tap/harness
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-nested-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-nested-

      - name: go vet
        working-directory: ./${{ matrix.module }}
        run: go vet ./...

      - name: go test
        working-directory: ./${{ matrix.module }}
        run: go test -count=1 ./...

      - name: go build
        working-directory: ./${{ matrix.module }}
        run: go build ./...

  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    # server/tests 集成测试依赖真实 PostgreSQL/Valkey（helper_test.go 读取
    # POSTGRES_HOST/POSTGRES_PORT/POSTGRES_USER/POSTGRES_PASSWORD、
    # VALKEY_HOST/VALKEY_PORT/VALKEY_PASSWORD；无凭据则 t.Skip）。
    # 镜像与 deployment/docker-compose.stage5.yml 同一 minor 系列锁定。
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          # 仅 CI 临时服务使用的占位口令（runner 即弃，无保密价值）
          POSTGRES_USER: jiuzhang
          POSTGRES_PASSWORD: ci-only-postgres-pwd
          POSTGRES_DB: jiuzhang_waf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiuzhang -d jiuzhang_waf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Valkey 必须带 --requirepass 启动（helper 要求 VALKEY_PASSWORD 非空且服务端鉴权），
      # 而 GHA services 不支持覆盖容器启动命令，故用 docker run 拉起等效服务
      # （同镜像 minor tag、健康检查齐备；口令同上为 CI 占位口令）。
      - name: Start Valkey (CI service)
        run: |
          docker run -d --name ci-valkey \
            -p 6379:6379 \
            --health-cmd "valkey-cli -a ci-only-valkey-pwd --no-auth-warning ping | grep -q PONG" \
            --health-interval 10s --health-timeout 5s --health-retries 5 \
            valkey/valkey:8.1.8-alpine \
            valkey-server --requirepass ci-only-valkey-pwd
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ci-valkey 2>/dev/null || echo starting)"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "valkey failed to become healthy" >&2
          docker logs ci-valkey || true
          exit 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run go vet
        working-directory: ./server
        run: go vet ./...

      - name: Run go vet (linux/arm64)
        working-directory: ./server
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go vet ./...

      - name: Run tests
        working-directory: ./server
        env:
          # helper_test.go 实际读取的环境变量（默认值与此一致，显式注入以固定接线）
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_USER: jiuzhang
          POSTGRES_PASSWORD: ci-only-postgres-pwd
          VALKEY_HOST: 127.0.0.1
          VALKEY_PORT: '6379'
          VALKEY_PASSWORD: ci-only-valkey-pwd
        # 集成套件（约百个 TestStage8* 用例）逐个重建测试库并全量迁移，
        # 超出 go test 默认 10m 包级超时，放宽到 45m；不能用 -short
        # （helper 在 short 模式全量 Skip，违反不得静默缺失的要求）
        run: go test -v -race -timeout 45m ./...

      - name: Build
        working-directory: ./server
        run: go build -o ../bin/jiuzhang-server ./cmd/server

      - name: Cross-compile check (linux/arm64)
        working-directory: ./server
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...

  gateway-test:
    name: Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run go vet
        working-directory: ./gateway
        run: go vet ./...

      - name: Run go vet (linux/arm64)
        working-directory: ./gateway
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go vet ./...

      - name: Run tests
        working-directory: ./gateway
        run: go test -v -race ./...

      - name: Build
        working-directory: ./gateway
        run: go build -o ../bin/jiuzhang-gateway ./cmd/gateway

      - name: Cross-compile check (linux/arm64)
        working-directory: ./gateway
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...

  web-test:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run typecheck
        working-directory: ./web
        run: npm run typecheck

      - name: Run lint
        working-directory: ./web
        run: npm run lint

      - name: Run tests
        working-directory: ./web
        run: npm test

      - name: Build
        working-directory: ./web
        run: npm run build

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        env:
          POSTGRES_PASSWORD: compose-validation-only
          VALKEY_PASSWORD: compose-validation-only
        run: docker compose -f docker-compose.yml config

  # ---- CI edition 冒烟矩阵（阶段8 任务书退出条件 #92，PR 必绿门禁）----
  # smoke-waf（API 关闭态）与 smoke-wdsp（API 开启态）共用同一脚本
  # test/e2e/ci-edition-smoke.sh，以 EDITION 区分断言集：
  #   waf  ：api-security 命名空间 404 + 核心防护冒烟（正常 200 / SQLi 403）
  #   wdsp ：api-security 可认证访问 + 一次请求产生 API 运行时事件
  # 镜像用仓内 Dockerfile 构建（server/Dockerfile、gateway/Dockerfile、
  # deployment/stage1/testorigin/Dockerfile），经 build-push-action + type=gha
  # 缓存控制时长；GOPROXY 覆盖为 proxy.golang.org（默认 goproxy.cn 面向国内构建机）。
  smoke-waf:
    name: Edition Smoke (waf, API 关闭)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          tags: jiuzhang-server:stage5
          load: true
          build-args: GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=jiuzhang-server
          cache-to: type=gha,mode=max,scope=jiuzhang-server

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          tags: jiuzhang-gateway:stage5
          load: true
          build-args: GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=jiuzhang-gateway
          cache-to: type=gha,mode=max,scope=jiuzhang-gateway

      - name: Build testorigin image
        uses: docker/build-push-action@v6
        with:
          context: deployment/stage1/testorigin
          tags: jiuzhang-testorigin:stage1
          load: true
          build-args: GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=jiuzhang-testorigin
          cache-to: type=gha,mode=max,scope=jiuzhang-testorigin

      - name: Run edition smoke (waf)
        run: EDITION=waf bash test/e2e/ci-edition-smoke.sh

  smoke-wdsp:
    name: Edition Smoke (wdsp, API 开启)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          tags: jiuzhang-server:stage5
          load: true
          build-args: GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=jiuzhang-server
          cache-to: type=gha,mode=max,scope=jiuzhang-server

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          tags: jiuzhang-gateway:stage5
          load: true
          build-args: GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=jiuzhang-gateway
          cache-to: type=gha,mode=max,scope=jiuzhang-gateway

      - name: Build testorigin image
        uses: docker/build-push-action@v6
        with:
          context: deployment/stage1/testorigin
          tags: jiuzhang-testorigin:stage1
          load: true
          build-args: GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=jiuzhang-testorigin
          cache-to: type=gha,mode=max,scope=jiuzhang-testorigin

      - name: Run edition smoke (wdsp)
        run: EDITION=wdsp bash test/e2e/ci-edition-smoke.sh
