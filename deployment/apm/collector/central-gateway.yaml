# 九章 APM 阶段2 —— 中央 Collector Gateway（数据面汇聚侧）
# 适配版本：otel/opentelemetry-collector-contrib:0.154.0
#   （镜像 tag + digest 锁定见 deployment/docker-compose.apm.yml 与 docs/DEPENDENCIES.md）
# 角色（设计 §5.1）：mTLS 认证、租户绑定、限流、二次脱敏、采样、路由和背压。
#   不信任客户端自报租户；不参与业务请求；ClickHouse schema 由 deployment/apm/clickhouse
#   维护，本进程禁止自动建表（create_schema: false，设计 §15.2）。

receivers:
  otlp:
    protocols:
      # 仅 gRPC + mTLS 接收本地 Collector 上报；HTTP 入口不对外开放。
      # mTLS 说明（contrib v0.154.0 / configtls.ServerConfig）：设置 client_ca_file
      # 即将 TLS ClientAuth 置为 RequireAndVerifyClientCert，无证书连接一律拒绝；
      # 该版本无独立 require_client_cert 键。
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /etc/jiuzhang-apm/tls/server.crt      # 占位：服务端证书
          key_file: /etc/jiuzhang-apm/tls/server.key       # 占位：服务端私钥（0600）
          client_ca_file: /etc/jiuzhang-apm/tls/ca.crt     # 占位：私有 CA（设置即强制 mTLS）
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /etc/jiuzhang-apm/tls/server.crt
          key_file: /etc/jiuzhang-apm/tls/server.key
          client_ca_file: /etc/jiuzhang-apm/tls/ca.crt

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # 每证书限流（设计 §12.3"OTLP 洪泛/高基数攻击"、§13.3 配额）：
  # contrib v0.154.0 无内建"按客户端证书身份限流"的 processor。当前兜底为
  # 全局 memory_limiter + 有界队列背压；按证书（CN/SAN ↔ 租户）的 spans/s、bytes/s
  # 配额拟在 APM Ingest 层或自研 processor 实现（绑定 include_metadata 读取
  # client 证书 CN），上线前须在测试计划 §24 覆盖洪泛用例。
  # 临时缓解：可在 receiver 上加 include_metadata: true，把证书属性落入 metadata 供下游判断。

  # 二层脱敏（设计 §12.2）：重复删除首层清单，防止错误 Agent 配置绕过头层。
  attributes/forbidden:
    actions:
      - {key: authorization, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.proxy-authorization, action: delete}
      - {key: cookie, action: delete}
      - {key: http.request.header.cookie, action: delete}
      - {key: set-cookie, action: delete}
      - {key: http.response.header.set-cookie, action: delete}
      - {key: http.request.header.x-api-key, action: delete}
      - {key: api_key, action: delete}
      - {key: jwt, action: delete}
      - {key: client_cert.private_key, action: delete}
      - {key: http.request.body, action: delete}
      - {key: http.response.body, action: delete}
      - {key: messaging.message.body, action: delete}
      - {key: db.statement.bind_values, action: delete}
      - {key: db.connection_string, action: delete}
      - {key: url.query, action: delete}
      - {key: http.target, action: delete}
      - {key: process.command_line, action: delete}
      - {key: process.command_args, action: delete}
      - {key: process.environment_variable, action: delete}

  # 二层正则脱敏示例（设计 §12.2"正则脱敏"）：对残留值做模式化打码。
  # blocked_values 命中即把值替换为 ****；清单按安全评审扩充，并配测试语料回归。
  redaction:
    allow_all_keys: true
    blocked_values:
      - (?i)bearer\s+[a-z0-9\-._~+/]+=*          # Bearer/JWT 形态令牌
      - \b1[3-9]\d{9}\b                          # 手机号（中国大陆号段）
      - \b\d{17}[\dXx]\b                         # 身份证号
      - \b\d{16,19}\b                            # 银行卡号（连号）
      - (?i)(password|passwd|pwd|secret|token)\s*[:=]\s*\S+   # key=value 形态秘密
    summary: silent

  # 尾采样（设计 §13.1/§13.2）：决策在中央做，错误 100%、慢请求全留、正常 5% 基线。
  # 多实例部署警告（§13.2）：tail_sampling 按实例内存中的 trace 状态决策，
  # 横向扩容时必须在前级用 loadbalancing exporter 按 trace ID 一致性路由
  # （routing_key: traceID），保证同一 trace 的 span 到达同一决策实例；
  # 单实例 compose 示例无需此项。
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    expected_new_traces_per_sec: 1000
    policies:
      - name: errors-keep-all            # 错误 trace 尽量 100%（受全局硬配额保护，不宣称绝对）
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: slow-keep-all              # 慢请求阈值 2000ms，与 ClickHouse 慢 TTL 阈值一致
        type: latency
        latency: {threshold_ms: 2000}
      - name: waf-high-risk              # WAF 阻断/高风险 trace 优先保留（网关埋点写入属性）
        type: string_attribute
        string_attribute: {key: jiuzhang.waf_action, values: [BLOCK]}
      - name: baseline-5pct              # 正常流量 5% 基线
        type: probabilistic
        probabilistic: {sampling_percentage: 5}

  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  # 写入 ClickHouse 数据面。schema 由 deployment/apm/clickhouse 维护（本包 001/002），
  # create_schema 必须为 false（设计 §15.2：不依赖 Collector 启动时自动建表）。
  clickhouse:
    endpoint: tcp://clickhouse:9000      # compose 内网服务名；生产按实际地址改
    database: apm
    traces_table_name: otel_traces
    create_schema: false
    async_insert: true                   # 服务端异步聚合小批量插入，降低 parts 压力
    username: ${env:CLICKHOUSE_APM_WRITER_USER}
    password: ${env:CLICKHOUSE_APM_WRITER_PASSWORD}
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 600s   # ClickHouse 不可用时限量缓存，超过即按优先级丢弃（§19.4/§20）
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133   # compose 仅映射到回环；外部健康检查探测该端口

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/forbidden, redaction, tail_sampling, batch]
      exporters: [clickhouse]
    # 运行时指标管道（阶段3）：保持与 traces 相同的限幅/二层脱敏/有界批量纪律；
    # 不接 tail_sampling（仅 traces 处理器，metrics 全量保留——
    # 指标体量远小于 span 且靠 7 天 TTL 兜底，设计 §14.2）。
    # 写入 apm.otel_metrics_* 五表（exporter 默认表名；schema 见
    # deployment/apm/clickhouse/003_metrics.sql，create_schema: false 不自动建表）。
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/forbidden, redaction, batch]
      exporters: [clickhouse]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0            # 自监控 Prometheus 端口（仅暴露在内网/管理网段）
                port: 8888
    logs:
      level: info
