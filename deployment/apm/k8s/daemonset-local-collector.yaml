# 九章 APM 阶段5 —— K8s 形态：本地 Collector DaemonSet（设计 §19.3）
# 适配版本：otel/opentelemetry-collector-contrib:0.154.0（tag + digest 锁定，
#   与 deployment/docker-compose.apm.yml / docs/DEPENDENCIES.md 同一值）。
#
# 与裸机/compose 形态（deployment/apm/collector/local-collector.yaml）的差异：
#   1) 接收端绑定 0.0.0.0（Pod 网络命名空间）+ hostPort 暴露到节点 IP；
#      业务 Pod 经 Downward API 注入节点 IP 连接本机 Collector：
#        env: OTEL_EXPORTER_OTLP_ENDPOINT=http://$(K8S_NODE_IP):4318
#        （K8S_NODE_IP 取自 fieldRef status.hostIP）
#      裸机形态的 127.0.0.1 回环纪律（设计 §19.1）在 K8s 下以
#      「hostPort + NetworkPolicy 限定业务命名空间」等效实现；
#   2) 自监控 Prometheus 绑定 0.0.0.0:9888 供 Pod 注解抓取（裸机形态为回环）；
#   3) 处理器链、脱敏清单、批量/重试/队列参数与 local-collector.yaml 完全一致
#      （fail-open 纪律不变：内存限幅首位、有界队列、有界重试、无磁盘队列）。
#   ⚠ 脱敏清单（attributes/forbidden）必须与 local-collector.yaml 保持同步，
#     任一变更须经安全评审并同步 docs/BUSINESS_PERFORMANCE_APM_DESIGN.md §12.1。
#
# 前置准备：
#   kubectl create namespace jiuzhang-apm
#   kubectl -n jiuzhang-apm create secret generic apm-local-collector-tls \
#     --from-file=client.crt=../pki/client.crt \
#     --from-file=client.key=../pki/client.key \
#     --from-file=ca.crt=../pki/ca.crt
#
# 说明：DaemonSet 不附 PodDisruptionBudget——PDB 约束的是主动驱逐（drain），
#   DaemonSet Pod 由控制器按节点重建，PDB 对其无意义（PDB 见中央层清单）。

apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-local-collector-config
  namespace: jiuzhang-apm
  labels:
    app.kubernetes.io/part-of: jiuzhang-apm
    app.kubernetes.io/component: local-collector
data:
  local-collector.yaml: |
    # 内嵌自 ../collector/local-collector.yaml（v0.154.0），差异仅文件头所列三项；
    # 脱敏清单/队列/重试参数变更必须双向同步并经安全评审。
    receivers:
      otlp:
        protocols:
          # Pod 内绑定 0.0.0.0，经 hostPort 暴露到节点 IP；仅业务命名空间可访问
          # （由 NetworkPolicy/安全组保证，等效裸机回环纪律）。
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # 内存限幅必须放在 pipeline 第一位，防止遥测洪泛拖垮节点（fail-open 纪律）。
      memory_limiter:
        check_interval: 1s
        limit_percentage: 70        # 相对容器 limits.memory=512Mi
        spike_limit_percentage: 20

      # 宿主/容器属性：system 提供 host.name/os 等；env 从 OTEL_RESOURCE_ATTRIBUTES 注入。
      # 如需 k8s 节点属性可追加 k8snode detector，但须配套 RBAC（本样例不引入）。
      resourcedetection:
        detectors: [env, system]
        timeout: 5s
        override: false

      # 首层脱敏（设计 §12.1 默认禁止采集清单）：与 local-collector.yaml 逐条一致。
      attributes/forbidden:
        actions:
          # 凭据与会话类
          - {key: authorization, action: delete}
          - {key: http.request.header.authorization, action: delete}
          - {key: http.request.header.proxy-authorization, action: delete}
          - {key: cookie, action: delete}
          - {key: http.request.header.cookie, action: delete}
          - {key: set-cookie, action: delete}
          - {key: http.response.header.set-cookie, action: delete}
          - {key: http.request.header.x-api-key, action: delete}
          - {key: api_key, action: delete}
          - {key: jwt, action: delete}
          - {key: client_cert.private_key, action: delete}
          # 正文类
          - {key: http.request.body, action: delete}
          - {key: http.response.body, action: delete}
          - {key: messaging.message.body, action: delete}
          # SQL 绑定值与连接串
          - {key: db.statement.bind_values, action: delete}
          - {key: db.connection_string, action: delete}
          # 高基数/敏感标识、命令行与环境变量
          - {key: url.query, action: delete}
          - {key: http.target, action: delete}
          - {key: process.command_line, action: delete}
          - {key: process.command_args, action: delete}
          - {key: process.environment_variable, action: delete}

      batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 1024

    exporters:
      # 出口到中央路由层 Service（mTLS）。证书来自 apm-local-collector-tls Secret，
      # 身份绑定租户（§12.3），不得复用其他用途证书。
      otlphttp/central:
        endpoint: https://apm-central-router.jiuzhang-apm.svc.cluster.local:4318
        tls:
          cert_file: /etc/jiuzhang-apm/tls/client.crt
          key_file: /etc/jiuzhang-apm/tls/client.key
          ca_file: /etc/jiuzhang-apm/tls/ca.crt
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
          max_elapsed_time: 300s   # 有界重试：5 分钟后放弃，由队列丢弃计数兜底
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 2000         # 有界内存队列；满即丢弃并计数（不使用磁盘队列）

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133   # readiness/liveness 探测该端口

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, attributes/forbidden, batch]
          exporters: [otlphttp/central]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, attributes/forbidden, batch]
          exporters: [otlphttp/central]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0    # 供 Pod 注解 prometheus.io/scrape 抓取
                    port: 9888
        logs:
          level: info
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: apm-local-collector
  namespace: jiuzhang-apm
  labels:
    app.kubernetes.io/part-of: jiuzhang-apm
    app.kubernetes.io/component: local-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: local-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1        # 逐节点滚动；遥测 fail-open，节点短暂无 Collector 不影响业务
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: jiuzhang-apm
        app.kubernetes.io/component: local-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9888"
    spec:
      # 如需覆盖污点节点（如控制面/网关节点）按需追加 tolerations。
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.154.0@sha256:b3079f45e19bdb7326bf49cdddce6cf60dfd865138db39f2733ea48ab17bc4cb
          args: ["--config=/etc/otelcol-contrib/local-collector.yaml"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532        # contrib distroless 镜像默认非 root 用户
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            # hostPort：业务 Pod 经节点 IP 访问本机 Collector（见文件头）
            - {name: otlp-grpc, containerPort: 4317, hostPort: 4317, protocol: TCP}
            - {name: otlp-http, containerPort: 4318, hostPort: 4318, protocol: TCP}
            - {name: metrics, containerPort: 9888, protocol: TCP}
            - {name: health, containerPort: 13133, protocol: TCP}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi        # memory_limiter 70%+20% spike 以此为基线
          readinessProbe:
            httpGet: {path: /, port: 13133}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 13133}
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol-contrib, readOnly: true}
            - {name: tls, mountPath: /etc/jiuzhang-apm/tls, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: apm-local-collector-config
        - name: tls
          secret:
            secretName: apm-local-collector-tls
            defaultMode: 0440      # 私钥最小可读范围（容器内非 root 用户经 fsGroup 组只读）
