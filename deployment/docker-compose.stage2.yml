# 九章阶段2 管理系统完整编排
# 用法（仓库根目录）：
#   docker compose -f deployment/docker-compose.stage2.yml --env-file .env.example up -d
# 包含：PostgreSQL + Valkey + 管理API + 管理前端（静态托管）

name: jiuzhang-stage2

services:
  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    container_name: jiuzhang-stage2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jiuzhang_waf}
      POSTGRES_USER: ${POSTGRES_USER:-jiuzhang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - stage2-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jiuzhang} -d ${POSTGRES_DB:-jiuzhang_waf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - stage2-net

  valkey:
    image: valkey/valkey:8.1.8-alpine@sha256:94365b275456ae14621001c03556c732b1d93a0cdeacc317d1bdd52eba680885
    container_name: jiuzhang-stage2-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - stage2-valkey-data:/data
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    networks:
      - stage2-net

  api:
    image: jiuzhang-server:stage2
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: jiuzhang-stage2-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-jiuzhang_waf}
      POSTGRES_USER: ${POSTGRES_USER:-jiuzhang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      COOKIE_SECURE: "false"
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-jiuzhang_admin}
      # INITIAL_ADMIN_PASSWORD: 不设置则由服务生成一次性随机密码（首次启动stdout打印）
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "127.0.0.1:${API_PORT:-18081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stage2-net

  web:
    image: jiuzhang-web:stage2
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: jiuzhang-stage2-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    depends_on:
      api:
        condition: service_healthy
    # Caddy 官方镜像需写入 /config 与 /data，且二进制带 cap_net_bind_service，
    # 因此不做 read_only 根文件系统与 cap_drop ALL；保留 no-new-privileges
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - stage2-net

volumes:
  stage2-postgres-data:
    driver: local
  stage2-valkey-data:
    driver: local

networks:
  stage2-net:
    driver: bridge
