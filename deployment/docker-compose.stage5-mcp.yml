# NG-MCP G1 批次 C 联调 overlay：MCP 测试源站（侵入最小——新增独立服务
# 不动既有 stage5 服务定义；grpc-testorigin overlay 同纪律；
# 镜像构建见 deployment/stage1/mcp-testorigin/Dockerfile）。
# 用法（仓库根目录）：
#   docker compose --env-file .env -f deployment/docker-compose.stage5.yml \
#     -f deployment/docker-compose.wdsp.yml -f deployment/docker-compose.stage5-grpc.yml \
#     -f deployment/docker-compose.stage5-mcp.yml up -d
name: jiuzhang-stage5

services:
  mcp-testorigin:
    build:
      context: ../deployment/stage1/mcp-testorigin
      dockerfile: Dockerfile
    image: jiuzhang-mcp-testorigin:stage5
    container_name: jiuzhang-stage5-mcp-testorigin
    restart: unless-stopped
    expose:
      - "18572"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18572/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - stage5-net
