# 九章 HTTP/3（QUIC）旁路验证实验编排（P2-06 诚实子集）
# 设计依据：docs/HTTP3_SUPPORT.md
#
# 目的：在独立 compose 项目中验证「HTTP/3 请求经 Caddy 终止 QUIC → 统一 guard 管线
# （headers → jiuzhang_guard → waf → reverse_proxy）→ 源站」全链路可用，
# 且事件/访问日志的协议版本字段正确记录 HTTP/3.0。
#
# 与 stage5 在用环境完全隔离：独立项目名（http3lab）、独立端口（18443）、独立卷，
# 不修改、不重启 stage5 任何容器；验证后 down -v 即无残留。
#
# 镜像锁定：与 docker-compose.mirror-lab.yml 同一约定——Docker Hub 在本实验环境
# 不可达，镜像统一按本机已有镜像的 RepoDigest 锁定（即 stage5 在用网关镜像，
# Caddy v2.11.4 + coraza-caddy v2.5.0 + jiuzhang_guard）。
#
# 用法（仓库根目录）：
#   bash deployment/http3-lab/gen-cert.sh        # 生成自签证书到 .runtime/（仅实验用）
#   docker compose -f deployment/http3-lab/docker-compose.http3-lab.yml up -d
#   # ... 验证（见 docs/HTTP3_SUPPORT.md §验证证据）...
#   docker compose -f deployment/http3-lab/docker-compose.http3-lab.yml down -v

name: http3lab

services:
  gateway:
    image: jiuzhang-gateway@sha256:145e27c98420265313ebfbddcd1d15f8cb62fe4fbe81e2cfca84c940ab60283b
    container_name: http3lab-gateway
    restart: unless-stopped
    # HTTP/3 关键：HTTPS 监听端口必须同时发布 UDP（QUIC）与 TCP（h1/h2 回退）。
    # docker compose 端口映射缺省仅 TCP——这是启用 HTTP/3 唯一必须的编排变更。
    ports:
      - "127.0.0.1:18443:8443"
      - "127.0.0.1:18443:8443/udp"
    volumes:
      # JSON 配置（与 server/internal/gatewayconfig 发布产物同构；见 caddy-lab.json 头注）
      - ./caddy-lab.json:/etc/caddy/caddy-lab.json:ro
      # 自签证书（gen-cert.sh 生成；仅本实验使用，禁止复用到其他环境）
      - ./.runtime/tls.crt:/etc/caddy/lab/tls.crt:ro
      - ./.runtime/tls.key:/etc/caddy/lab/tls.key:ro
      # CRS 规则集（waf 处理器 DetectionOnly，与发布链默认一致）
      - ../../gateway/rules:/etc/caddy/rules:ro
      - http3lab-gateway-logs:/var/log/caddy
      - http3lab-gateway-admin:/var/run/caddy
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["run", "--config", "/etc/caddy/caddy-lab.json"]
    depends_on:
      testorigin:
        condition: service_healthy
    networks:
      - http3lab-net

  testorigin:
    image: jiuzhang-testorigin@sha256:670887ef1dc10268fbc9eeb3203c6791cb7fa525196b5a7e417c4bd763375149
    container_name: http3lab-testorigin
    restart: unless-stopped
    expose:
      - "8081"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - http3lab-net

volumes:
  http3lab-gateway-logs:
    driver: local
  http3lab-gateway-admin:
    driver: local

networks:
  http3lab-net:
    driver: bridge
