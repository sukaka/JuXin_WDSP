apiVersion: v1
kind: ConfigMap
metadata:
  name: wdsp-agent-defaults
  namespace: wdsp-system
data:
  agent-defaults.json: |
    {
      "k8s": {"enabled": "auto"},
      "capture_backend": "auto",
      "policy": {
        "capture": {
          "interfaces": [],
          "direction": "both",
          "protocols": ["tcp"],
          "ports": [80, 443, 8000, 8001, 8080, 8081, 8443, 8888, 9000, 9443]
        },
        "output": {"mode": "FLOW"},
        "limits": {"outbound_mbps": 100}
      }
    }
