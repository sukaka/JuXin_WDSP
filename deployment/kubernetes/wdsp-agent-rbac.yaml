apiVersion: v1
kind: Namespace
metadata:
  name: wdsp-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wdsp-agent
  namespace: wdsp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wdsp-agent-metadata-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wdsp-agent-metadata-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wdsp-agent-metadata-reader
subjects:
  - kind: ServiceAccount
    name: wdsp-agent
    namespace: wdsp-system
