<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 14px; font-weight: 400; fill: #94a3b8; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .name { font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .label { font-size: 12px; font-weight: 600; fill: #e2e8f0; }
      .small { font-size: 10px; font-weight: 400; fill: #94a3b8; }
      .tiny { font-size: 9px; font-weight: 500; fill: #cbd5e1; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .flowCyan { fill: none; stroke: #22d3ee; stroke-width: 2.2; marker-end: url(#arrowCyan); }
      .flowAmber { fill: none; stroke: #fbbf24; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrowAmber); }
      .flowViolet { fill: none; stroke: #a78bfa; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrowViolet); }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2436"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0,11 4,0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowCyan" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0,11 4,0 8" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0,11 4,0 8" fill="#fbbf24"/>
    </marker>
    <marker id="arrowViolet" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0,11 4,0 8" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0f172a"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)" opacity="0.55"/>

  <text x="52" y="58" class="title">九章 WDSP · 统一 Web / API 动态防护架构</text>
  <text x="54" y="86" class="subtitle">一条流量链 · 一次解析 · 统一请求上下文 · 多信号决策 · 请求与响应双向防护</text>
  <g transform="translate(1270,42)">
    <rect width="278" height="48" rx="24" fill="#082f49" stroke="#22d3ee" stroke-width="1.3"/>
    <circle cx="26" cy="24" r="7" fill="#22d3ee" filter="url(#cyanGlow)"/>
    <text x="47" y="20" class="tiny" fill="#67e8f9">WDSP RUNTIME</text>
    <text x="47" y="35" class="small">Web + API · Unified Protection</text>
  </g>

  <!-- Data plane boundary -->
  <rect x="250" y="124" width="1084" height="506" rx="18" fill="#0b1426" fill-opacity="0.78" stroke="#22d3ee" stroke-width="1.3" stroke-dasharray="10 6"/>
  <text x="270" y="151" class="section" fill="#22d3ee">数据面 · CADDY + JIUZHANG_GUARD + CORAZA / CRS</text>

  <!-- Main traffic arrows behind components -->
  <path d="M212 337H282" class="flowCyan"/>
  <path d="M456 337H500" class="flowCyan"/>
  <path d="M704 337H746" class="flowCyan"/>
  <path d="M1088 337H1130" class="flowCyan"/>
  <path d="M1292 337H1380" class="flowCyan"/>
  <path d="M1465 406V588H1054" class="flow"/>
  <path d="M1054 588H513" class="flow"/>

  <!-- Clients -->
  <g filter="url(#shadow)">
    <rect x="42" y="274" width="170" height="126" rx="14" fill="#0f172a"/>
    <rect x="42" y="274" width="170" height="126" rx="14" fill="#083344" fill-opacity="0.72" stroke="#22d3ee" stroke-width="1.6"/>
    <circle cx="75" cy="307" r="16" fill="#164e63" stroke="#22d3ee"/>
    <path d="M67 306h16M75 298v16" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
    <text x="104" y="311" class="name">业务访问</text>
    <text x="62" y="342" class="small">Web 浏览器</text>
    <text x="62" y="362" class="small">移动端 / 小程序</text>
    <text x="62" y="382" class="small">API / Agent 客户端</text>
  </g>

  <!-- Edge -->
  <g filter="url(#shadow)">
    <rect x="282" y="241" width="174" height="192" rx="12" fill="#0f172a"/>
    <rect x="282" y="241" width="174" height="192" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="369" y="271" class="name" text-anchor="middle">接入与标准化</text>
    <line x1="304" y1="287" x2="434" y2="287" stroke="#334155"/>
    <g class="small">
      <text x="309" y="313">TLS / HTTP 协议</text>
      <text x="309" y="339">Request ID</text>
      <text x="309" y="365">真实客户端 IP</text>
      <text x="309" y="391">请求解析与标准化</text>
      <text x="309" y="417">资源限制</text>
    </g>
  </g>

  <!-- Shared context -->
  <g filter="url(#shadow)">
    <rect x="500" y="213" width="204" height="248" rx="14" fill="#0f172a"/>
    <rect x="500" y="213" width="204" height="248" rx="14" fill="#064e3b" fill-opacity="0.5" stroke="#34d399" stroke-width="1.8"/>
    <rect x="520" y="231" width="164" height="38" rx="19" fill="#065f46" stroke="#34d399"/>
    <text x="602" y="255" class="label" text-anchor="middle">统一 RequestContext</text>
    <text x="602" y="291" class="small" text-anchor="middle">同一请求只解析一次</text>
    <line x1="524" y1="306" x2="680" y2="306" stroke="#065f46"/>
    <g class="small">
      <text x="528" y="330">Header / Cookie / Query</text>
      <text x="528" y="353">JSON / XML / GraphQL</text>
      <text x="528" y="376">身份 · API · 对象 · 行为</text>
      <text x="528" y="399">请求与响应结构</text>
      <text x="528" y="422">检测 Finding 与证据</text>
    </g>
    <text x="602" y="447" class="tiny" fill="#6ee7b7" text-anchor="middle">共享上下文 · 数据最小化</text>
  </g>

  <!-- Detectors region -->
  <g>
    <rect x="746" y="174" width="342" height="326" rx="14" fill="#111827" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="766" y="200" class="section" fill="#fb7185">并行检测器 · 只产出信号</text>
    <g class="label" text-anchor="middle">
      <g><rect x="768" y="220" width="94" height="64" rx="9" fill="#4c1d95" fill-opacity="0.38" stroke="#a78bfa"/><text x="815" y="247">Coraza / CRS</text><text x="815" y="266" class="tiny">Web 攻击</text></g>
      <g><rect x="870" y="220" width="94" height="64" rx="9" fill="#083344" fill-opacity="0.7" stroke="#22d3ee"/><text x="917" y="247">API 发现</text><text x="917" y="266" class="tiny">识别 · 归一化</text></g>
      <g><rect x="972" y="220" width="94" height="64" rx="9" fill="#064e3b" fill-opacity="0.55" stroke="#34d399"/><text x="1019" y="247">Schema</text><text x="1019" y="266" class="tiny">偏离 · 资源</text></g>
      <g><rect x="768" y="296" width="94" height="64" rx="9" fill="#78350f" fill-opacity="0.4" stroke="#fbbf24"/><text x="815" y="323">身份认证</text><text x="815" y="342" class="tiny">Token · 指纹</text></g>
      <g><rect x="870" y="296" width="94" height="64" rx="9" fill="#881337" fill-opacity="0.38" stroke="#fb7185"/><text x="917" y="323">授权风险</text><text x="917" y="342" class="tiny">BOLA · BFLA</text></g>
      <g><rect x="972" y="296" width="94" height="64" rx="9" fill="#78350f" fill-opacity="0.4" stroke="#fbbf24"/><text x="1019" y="323">敏感数据</text><text x="1019" y="342" class="tiny">发现 · 泄露</text></g>
      <g><rect x="768" y="372" width="94" height="64" rx="9" fill="#064e3b" fill-opacity="0.55" stroke="#34d399"/><text x="815" y="399">行为模型</text><text x="815" y="418" class="tiny">流程 · 速率</text></g>
      <g><rect x="870" y="372" width="94" height="64" rx="9" fill="#083344" fill-opacity="0.7" stroke="#22d3ee"/><text x="917" y="399">访问控制</text><text x="917" y="418" class="tiny">ACL · CC</text></g>
      <g><rect x="972" y="372" width="94" height="64" rx="9" fill="#4c1d95" fill-opacity="0.38" stroke="#a78bfa"/><text x="1019" y="399">生命周期</text><text x="1019" y="418" class="tiny">Shadow · Zombie</text></g>
    </g>
    <rect x="768" y="452" width="298" height="30" rx="15" fill="#312e81" fill-opacity="0.62" stroke="#818cf8"/>
    <text x="917" y="472" class="tiny" text-anchor="middle">Finding：风险分 · 置信度 · 证据 · 建议动作</text>
  </g>

  <!-- Decision -->
  <g filter="url(#shadow)">
    <rect x="1130" y="222" width="162" height="230" rx="14" fill="#0f172a"/>
    <rect x="1130" y="222" width="162" height="230" rx="14" fill="#78350f" fill-opacity="0.38" stroke="#fbbf24" stroke-width="1.8"/>
    <circle cx="1211" cy="263" r="25" fill="#92400e" stroke="#fbbf24"/>
    <path d="M1198 263l9 9 17-20" fill="none" stroke="#fde68a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1211" y="307" class="name" text-anchor="middle">统一风险决策</text>
    <text x="1211" y="331" class="small" text-anchor="middle">多信号聚合 · 策略模式</text>
    <line x1="1154" y1="347" x2="1268" y2="347" stroke="#92400e"/>
    <g class="tiny" text-anchor="middle">
      <text x="1211" y="371">ALLOW · OBSERVE</text>
      <text x="1211" y="391">BLOCK · RATE_LIMIT</text>
      <text x="1211" y="411">TEMP_BLOCK</text>
      <text x="1211" y="431">MASK_RESPONSE</text>
    </g>
  </g>

  <!-- Origin -->
  <g filter="url(#shadow)">
    <rect x="1380" y="274" width="170" height="132" rx="14" fill="#0f172a"/>
    <rect x="1380" y="274" width="170" height="132" rx="14" fill="#1e293b" fill-opacity="0.75" stroke="#94a3b8" stroke-width="1.6"/>
    <path d="M1412 306h38v30h-38zM1419 299h24" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1470" y="320" class="name" text-anchor="middle">受保护源站</text>
    <text x="1465" y="355" class="small" text-anchor="middle">Web 应用 · API 服务</text>
    <text x="1465" y="377" class="small" text-anchor="middle">微服务 · 业务系统</text>
  </g>

  <!-- Response lane -->
  <g>
    <rect x="500" y="554" width="554" height="66" rx="11" fill="#0f172a"/>
    <rect x="500" y="554" width="554" height="66" rx="11" fill="#4c1d95" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="522" y="580" class="label">响应侧动态防护</text>
    <text x="522" y="603" class="small">响应解析 · Response Schema · 敏感数据泄露 · 错误信息 · 脱敏 / 哈希 / 移除</text>
  </g>
  <text x="1326" y="575" class="tiny" text-anchor="end">响应回流</text>

  <!-- Control plane arrows behind boxes -->
  <path d="M656 758V646H1197V454" class="flowAmber"/>
  <path d="M917 500V671H532" class="flowViolet"/>

  <!-- Control plane -->
  <rect x="42" y="670" width="1508" height="180" rx="18" fill="#111827" fill-opacity="0.82" stroke="#a78bfa" stroke-width="1.3" stroke-dasharray="10 6"/>
  <text x="62" y="699" class="section" fill="#a78bfa">管理与控制面</text>

  <g filter="url(#shadow)">
    <rect x="70" y="724" width="186" height="94" rx="11" fill="#083344" fill-opacity="0.7" stroke="#22d3ee"/>
    <text x="163" y="756" class="label" text-anchor="middle">管理控制台</text>
    <text x="163" y="779" class="small" text-anchor="middle">React · TypeScript</text>
    <text x="163" y="799" class="small" text-anchor="middle">资产 · 策略 · 事件 · 态势</text>

    <rect x="290" y="724" width="210" height="94" rx="11" fill="#064e3b" fill-opacity="0.55" stroke="#34d399"/>
    <text x="395" y="756" class="label" text-anchor="middle">管理服务</text>
    <text x="395" y="779" class="small" text-anchor="middle">Go 模块化单体</text>
    <text x="395" y="799" class="small" text-anchor="middle">认证 · 三权 · API 能力域</text>

    <rect x="534" y="724" width="244" height="94" rx="11" fill="#78350f" fill-opacity="0.38" stroke="#fbbf24"/>
    <text x="656" y="756" class="label" text-anchor="middle">配置发布控制器</text>
    <text x="656" y="779" class="small" text-anchor="middle">生成 · 校验 · 发布 · 验证</text>
    <text x="656" y="799" class="small" text-anchor="middle">版本 · 回滚 · 多节点同步</text>
  </g>

  <g>
    <rect x="828" y="716" width="676" height="110" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="848" y="740" class="tiny" fill="#a78bfa">数据与运营底座</text>
    <g text-anchor="middle">
      <g><ellipse cx="914" cy="759" rx="60" ry="11" fill="#4c1d95" fill-opacity="0.48" stroke="#a78bfa"/><rect x="854" y="759" width="120" height="40" fill="#4c1d95" fill-opacity="0.48"/><ellipse cx="914" cy="799" rx="60" ry="11" fill="#4c1d95" fill-opacity="0.48" stroke="#a78bfa"/><line x1="854" y1="759" x2="854" y2="799" stroke="#a78bfa"/><line x1="974" y1="759" x2="974" y2="799" stroke="#a78bfa"/><text x="914" y="784" class="label">PostgreSQL</text></g>
      <g><rect x="1000" y="748" width="122" height="62" rx="10" fill="#4c1d95" fill-opacity="0.4" stroke="#a78bfa"/><text x="1061" y="774" class="label">Valkey</text><text x="1061" y="794" class="tiny">状态 · 锁 · 行为</text></g>
      <g><rect x="1148" y="748" width="146" height="62" rx="10" fill="#4c1d95" fill-opacity="0.4" stroke="#a78bfa"/><text x="1221" y="774" class="label">文件与日志</text><text x="1221" y="794" class="tiny">证书 · 备份 · 报表</text></g>
      <g><rect x="1320" y="748" width="158" height="62" rx="10" fill="#881337" fill-opacity="0.34" stroke="#fb7185"/><text x="1399" y="774" class="label">AI 安全运营</text><text x="1399" y="794" class="tiny">研判 · 建议 · 报告</text></g>
    </g>
  </g>

  <!-- Small labels -->
  <text x="228" y="327" class="tiny" fill="#67e8f9">请求</text>
  <text x="1343" y="327" class="tiny" fill="#67e8f9">代理</text>
  <text x="680" y="661" class="tiny" fill="#fcd34d">不可变策略版本 / Unix Socket</text>
  <text x="708" y="686" class="tiny" fill="#c4b5fd">统一事件 · 学习样本 · 运行遥测</text>
</svg>
