name: jiuzhang-waf

services:
  postgres:
    # multi-arch index digest（含 amd64 + arm64）；Docker 按宿主机/--platform 自动选层。
    # 海光 C86、兆芯 KX/KH 走 amd64。详见 docs/DEPENDENCIES.md「多架构镜像锁定」。
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    container_name: jiuzhang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jiuzhang_waf}
      POSTGRES_USER: ${POSTGRES_USER:-jiuzhang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    # 防止并行查询/大 shared_buffers 触发 Docker 默认 64MB /dev/shm 报错；
    # 缺省参数按 8G 云主机混部安全档兜底，16G/32G/64G 可用 ops/lib/pg-tune.sh --format env 写入 .env
    shm_size: ${POSTGRES_SHM_SIZE:-512mb}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-150}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1536MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - wal_buffers=${POSTGRES_WAL_BUFFERS:-16MB}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-512MB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-4}
      - -c
      - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-2}
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - jit=off
      - -c
      - autovacuum_max_workers=${POSTGRES_AUTOVACUUM_MAX_WORKERS:-3}
      - -c
      - autovacuum_vacuum_scale_factor=${POSTGRES_AUTOVACUUM_VACUUM_SCALE_FACTOR:-0.02}
      - -c
      - autovacuum_analyze_scale_factor=${POSTGRES_AUTOVACUUM_ANALYZE_SCALE_FACTOR:-0.02}
      - -c
      - autovacuum_vacuum_insert_scale_factor=${POSTGRES_AUTOVACUUM_INSERT_SCALE_FACTOR:-0.05}
      - -c
      - autovacuum_vacuum_cost_limit=${POSTGRES_AUTOVACUUM_COST_LIMIT:-600}
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-500}
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jiuzhang} -d ${POSTGRES_DB:-jiuzhang_waf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - jiuzhang-internal

  valkey:
    # multi-arch index digest（含 amd64 + arm64）；Docker 按宿主机/--platform 自动选层。
    # 海光 C86、兆芯 KX/KH 走 amd64。详见 docs/DEPENDENCIES.md「多架构镜像锁定」。
    image: valkey/valkey:8.1.8-alpine@sha256:94365b275456ae14621001c03556c732b1d93a0cdeacc317d1bdd52eba680885
    container_name: jiuzhang-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
      - --save
      - "900 1"
    volumes:
      - valkey-data:/data
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    networks:
      - jiuzhang-internal

volumes:
  postgres-data:
    driver: local
  valkey-data:
    driver: local

networks:
  jiuzhang-internal:
    driver: bridge
    internal: false
