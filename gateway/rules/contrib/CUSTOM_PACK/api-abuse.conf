# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— API 滥用与注入兜底检测
#
# 来源：阶段8 规则量扩展任务 L3。全部规则由本团队依据 GraphQL 官方规范、
#       RFC 7519（JWT）、OWASP API Security Top 10、RFC 2616 等公开资料
#       自行编写，未复制任何第三方 WAF 产品的规则、文案或结构。
#
# 规则 ID 段：1000400-1000499。
# 评分与阻断策略同 cve-emergency.conf 头部说明。
# =============================================================================


# -- GraphQL introspection 探测 -------------------------------------------------------
# 来源：GraphQL 官方规范，__schema 为 introspection 查询根字段，
# 生产环境通常关闭 introspection，探测即信息收集行为。
SecRule ARGS|REQUEST_BODY "@rx __schema" \
    "id:1000401,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'GraphQL introspection __schema probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：GraphQL 官方规范，标准 introspection 查询体
# （IntrospectionQuery 操作名或 __schema { 开头）。
SecRule REQUEST_BODY "@rx (?:IntrospectionQuery|__schema\s*\{)" \
    "id:1000402,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'GraphQL IntrospectionQuery body',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：GraphQL 官方规范，__type(name: ...) 类型探测字段。
SecRule REQUEST_BODY|ARGS "@rx __type\s*\(\s*name\s*:" \
    "id:1000403,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'GraphQL __type introspection probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：GET 请求 query 参数中携带 __schema 的 introspection 探测
# （经 URL 解码后检测，覆盖编码变体）。
SecRule REQUEST_URI "@rx [?&]query=[^&]{0,1000}__schema" \
    "id:1000404,\
    phase:1,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'GraphQL introspection via GET query parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：GraphQL 批量查询滥用（请求体为查询数组，绕过单查询限流/审计）。
SecRule REQUEST_BODY "@rx ^\s*\[\s*\{\s*\"(?:query|operationName)\"" \
    "id:1000405,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'GraphQL batched query array abuse',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：GraphQL 端点路径探测（/graphql、/graphiql 等常见端点名，仅标记）。
SecRule REQUEST_URI "@rx ^/(?:graphql|gql|api/graphql|v1/graphql)/?$" \
    "id:1000406,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'GraphQL endpoint discovery probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'NOTICE',\
    setvar:'tx.inbound_anomaly_score=+%{tx.notice_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"

# 来源：GraphQL 官方规范规定 mutation 必须经 POST 执行，GET 携带 mutation
# 属协议滥用（可能用于绕过仅审计 POST 的防护）。
SecRule REQUEST_URI "@rx [?&]query=[^&]{0,400}\bmutation\b" \
    "id:1000407,\
    phase:1,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'GraphQL mutation over GET',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -- JWT alg=none ----------------------------------------------------------------------
# 来源：RFC 7519 与公开 JWT 攻击研究，alg=none 令牌签名为空
# （三段式 JWT 第三段为空），用于绕过签名校验。
SecRule REQUEST_HEADERS:Authorization "@rx eyJ[A-Za-z0-9_\x2d-]{2,}\.eyJ[A-Za-z0-9_\x2d-]{2,}\.?\s*$" \
    "id:1000410,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'JWT with empty signature (alg=none)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：JWT header {"alg":"none"/"None"/"NONE"} 的 base64url 编码前缀
# eyJhbGciOiJub25l / eyJhbGciOiJOb25l / eyJhbGciOiJOT05F
# （已通过 base64 工具实际计算验证），出现在 Authorization 头或 Cookie 中。
SecRule REQUEST_HEADERS:Authorization|REQUEST_COOKIES "@rx eyJhbGciOiJ(?:ub25l|Ob25l|OT05F)" \
    "id:1000411,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'JWT alg=none header in Authorization/cookie',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：alg=none 令牌经 URL 参数传递（token=/jwt=/access_token= 场景）。
SecRule ARGS "@rx eyJhbGciOiJ(?:ub25l|Ob25l|OT05F)" \
    "id:1000412,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'JWT alg=none header in parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- 批量赋值（Mass Assignment）-------------------------------------------------------------
# 来源：OWASP API Security Top 10 API6:2023 Mass Assignment，
# role 参数被直接赋管理角色为典型提权手法。
SecRule ARGS:role|ARGS:roles|ARGS:user_role|ARGS:group "@rx ^(?:admin|administrator|root|superuser|super_admin)$" \
    "id:1000420,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Mass assignment: role escalation value',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-mass-assignment',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：批量赋值黑名单字段名（任务要求覆盖 role/isAdmin/is_admin/debug），
# 字段名本身出现即提示越权赋值尝试，WARNING 计分。
SecRule ARGS_NAMES "@rx ^(?:is_?admin|isadmin|is_?staff|is_?superuser|privilege|permissions|acl|user_type)$" \
    "id:1000421,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Mass assignment: sensitive field name',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-mass-assignment',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：isAdmin/is_admin/admin 字段被赋真值（任务要求覆盖 isAdmin/is_admin=1）。
SecRule ARGS:isAdmin|ARGS:is_admin|ARGS:isadmin|ARGS:admin "@rx ^(?:1|true|yes|on)$" \
    "id:1000422,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Mass assignment: admin flag set true',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-mass-assignment',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：debug 模式参数开启尝试（任务要求覆盖 debug=true）。
SecRule ARGS:debug|ARGS:debug_mode|ARGS:debugMode "@rx ^(?:1|true|on)$" \
    "id:1000423,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Debug mode enable attempt',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-mass-assignment',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：JSON 请求体中的批量赋值黑名单字段（application/json 场景）。
SecRule REQUEST_BODY "@rx \"(?:isAdmin|is_admin|is_superuser|role|roles|privileges|permissions)\"\s*:\s*(?:true|1|\"admin|\"administrator|\"root)" \
    "id:1000424,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Mass assignment: sensitive field in JSON body',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-mass-assignment',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：JavaScript 原型链污染（__proto__/constructor/prototype 键），
# 常用于污染后端对象属性实现提权或 RCE。
SecRule REQUEST_BODY|ARGS "@rx \"(?:__proto__|constructor|prototype)\"\s*:" \
    "id:1000425,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Prototype pollution key in request',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- CRLF 注入 ---------------------------------------------------------------------------
# 来源：OWASP CRLF Injection，重定向/回调类参数中的 CR/LF 用于响应拆分与
# 会话固定。限定 URL 类参数，避免误伤多行文本输入。
SecRule ARGS:url|ARGS:uri|ARGS:redirect|ARGS:redirect_uri|ARGS:redirect_url|ARGS:next|ARGS:return|ARGS:returnUrl|ARGS:return_url|ARGS:continue|ARGS:dest|ARGS:destination|ARGS:target|ARGS:callback|ARGS:location "@rx [\x0d\x0a]" \
    "id:1000430,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'CRLF injection in redirect parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：任务要求覆盖 %0d%0a 编码形态；请求行原始形态中的 %0d%0a 组合
# （在 URI 原始串上匹配，不做 URL 解码，避免解码后特征消失）。
SecRule REQUEST_URI "@rx %0d%0a|%0a%0d" \
    "id:1000431,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'CRLF injection encoded in URI',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：双重编码 CRLF（%250d%250a 经一次解码后残留 %0d%0a），弱特征 WARNING。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx %0[da]" \
    "id:1000432,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'CRLF double-encoded residue in parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -- XXE（与引擎 XML 检测互补的网络层兜底）----------------------------------------------------------
# 来源：OWASP XXE Prevention Cheat Sheet，DOCTYPE 内部子集声明为
# XXE 利用的必要条件（网络层文本兜底，不依赖 XML 解析器）。
SecRule REQUEST_BODY "@rx <!DOCTYPE\s+[\w:\x2d-]+\s*\[" \
    "id:1000440,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'XXE DOCTYPE with internal subset',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：OWASP XXE，实体声明 <!ENTITY 为 XXE 利用特征。
SecRule REQUEST_BODY "@rx <!ENTITY\s+" \
    "id:1000441,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'XXE ENTITY declaration',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：OWASP XXE，SYSTEM 外部实体指向 file/php/expect 等伪协议。
SecRule REQUEST_BODY "@rx SYSTEM\s+[\"'](?:file|php|expect|gopher|dict|ftp):" \
    "id:1000442,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'XXE external entity with dangerous URI',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：OWASP XXE，参数实体 <!ENTITY % 用于盲打/DTD 外带。
SecRule REQUEST_BODY "@rx <!ENTITY\s+%" \
    "id:1000443,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'XXE parameter entity declaration',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：XInclude 攻击（无法使用 DOCTYPE 时的 XXE 替代手法），
# xi:include href 指向 file/php 伪协议。
SecRule REQUEST_BODY "@rx <xi:include\s+[^>]{0,200}href\s*=\s*[\"'](?:file|php):" \
    "id:1000444,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'XInclude attack with dangerous href',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- 路径穿越编码变体 ---------------------------------------------------------------------------
# 来源：任务要求覆盖 %2e%2e%2f；在 URI/请求体原始形态匹配编码变体
# （不做 URL 解码，避免解码后特征消失），含 %5c 反斜杠形态。
SecRule REQUEST_URI|REQUEST_BODY|ARGS "@rx %2e%2e(?:%2f|%5c)" \
    "id:1000450,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Path traversal encoded (%2e%2e%2f)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：任务要求覆盖 ..%c0%af；超长 UTF-8 编码（overlong）穿越变体
# （%c0%ae%c0%ae%c0%af、..%c1%9c 等，IIS/旧容器解析差异利用）。
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?:\.\.%c0%af|%c0%ae%c0%ae|\.\.%c1%9c|%e0%80%ae)" \
    "id:1000451,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Path traversal overlong UTF-8 encoding',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：解码后形态的目录穿越序列（../ 或 ..\ 连续两级以上）。
SecRule ARGS|REQUEST_BODY "@rx (?:\.\./|\.\.\x5c){2,}" \
    "id:1000452,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Path traversal sequence in parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：双重编码穿越（%252e%252e%252f 一次解码后还原为 %2e%2e%2f）。
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx %252e%252e" \
    "id:1000453,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Path traversal double encoding',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Tomcat 路径规范化绕过（..;/ 可穿越至上一级并保留映射）。
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx \.\.(?:;|;/|%3b)" \
    "id:1000454,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Path traversal Tomcat semicolon bypass',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：文件类参数中的绝对路径（/etc/passwd、C:\、/proc 等），
# 限定文件语义参数名，WARNING 计分。
SecRule ARGS:file|ARGS:path|ARGS:filepath|ARGS:filename|ARGS:dir|ARGS:folder|ARGS:template|ARGS:page|ARGS:include|ARGS:doc|ARGS:document "@rx ^(?:[a-z]:[\x5c/]|/(?:etc|proc|sys|windows|winnt|boot|root)\b|/dev/)" \
    "id:1000455,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Absolute path in file parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# ================================ END api-abuse.conf ================================
