    tag:'cve/CVE-2012-1823',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：SSI（Server Side Include）注入，<!--#exec cmd= 等指令出现在
# 用户输入中（OWASP SSI Injection），可执行命令或读取文件。
SecRule ARGS|REQUEST_BODY "@rx <!--#(?:exec|include|config|echo|fsize|flastmod)\b" \
    "id:1001150,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SSI injection directive in parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：PHP filter chain RCE 公开研究（iconv 字符集转换链构造任意内容），
# php://filter 本身由 1000106 覆盖，本条补充 convert.iconv 链特征。
SecRule ARGS|REQUEST_BODY "@rx convert\.iconv\.[a-z0-9.\x2d-]{2,}/" \
    "id:1001151,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'PHP filter chain convert.iconv RCE technique',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

