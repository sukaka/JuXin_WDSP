# -- JWT 攻击（alg=none 由 api-abuse.conf 1000410-1000412 覆盖，此处补充其余手法）-----

# 来源：RFC 7515 JOSE Header kid 参数注入（路径穿越/SQLi 读密钥），
# 下列 base64url 前缀对应 {"alg":"HS256","kid": 等常见键序
# （已通过 base64 工具实际计算验证）。
SecRule REQUEST_HEADERS:Authorization|REQUEST_COOKIES|ARGS "@rx eyJ(?:hbGciOiJIUzI1NiIs|hbGciOiJSUzI1NiIs|0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiIs|0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs)ImtpZCI6" \
    "id:1001116,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'JWT header contains kid parameter (injection surface)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：RFC 7515 JOSE Header jku/x5u 参数指向攻击者控制的 JWK/证书 URL
# （JWT 密钥替换攻击），base64url 前缀经实际计算验证。
SecRule REQUEST_HEADERS:Authorization|REQUEST_COOKIES|ARGS "@rx eyJ(?:hbGciOiJIUzI1NiIs|hbGciOiJSUzI1NiIs|0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIs)Im(?:prdSI6|ng1dSI6)" \
    "id:1001117,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'JWT header contains jku/x5u remote key URL',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：alg=none 令牌经 Cookie 传递（第三段签名为空），
# 与 1000410（Authorization 头）同特征不同载体。
SecRule REQUEST_COOKIES "@rx eyJ[A-Za-z0-9_\x2d-]{2,}\.eyJ[A-Za-z0-9_\x2d-]{2,}\.\s*$" \
    "id:1001118,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'JWT with empty signature in cookie (alg=none)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：alg=none 头前缀出现在 JSON 请求体（"token":"eyJhbGciOiJub25l..." 场景），
# 与 1000412（表单参数）互补。
SecRule REQUEST_BODY "@rx eyJhbGciOiJ(?:ub25l|Ob25l|OT05F)" \
    "id:1001119,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'JWT alg=none header in request body',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：完整签名 JWT 经 URL 参数传递（access_token=/jwt= 等），
# 令牌会被记入访问日志与代理日志造成泄露，NOTICE 仅提示。
SecRule ARGS "@rx ^eyJ[A-Za-z0-9_\x2d-]{10,}\.eyJ[A-Za-z0-9_\x2d-]{10,}\.[A-Za-z0-9_\x2d-]{5,}$" \
    "id:1001120,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Signed JWT passed via URL parameter (log leakage risk)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'NOTICE',\
    setvar:'tx.inbound_anomaly_score=+%{tx.notice_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"


# -- SSRF 变形补充（云元数据 IP/协议锚定检测见 cloud-abuse.conf 10003xx）------------

# 来源：SSRF 绕过公开手法，回环地址的十进制（2130706433）、十六进制
# （0x7f000001/0x7f.0.0.1）、八进制（0177.0.0.1）与短格式（127.1）写法；
# 必须带 URL scheme，避免误伤文本内容。
SecRule ARGS "@rx ^https?://(?:2130706433|0x7f000001|0x7f\.0\.0\.1|0177\.0\.0\.1|127\.1)(?::\d{1,5})?(?:/|$)" \
    "id:1001121,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SSRF obfuscated loopback address (decimal/hex/octal/short)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：URL userinfo 混淆（http://trusted@127.0.0.1/）绕过基于主机名的
# SSRF 黑名单（公开绕过手法，RFC 3986 userinfo 语法）。
SecRule ARGS "@rx ^https?://[^/@\s]{1,120}@(?:127\.|0\.0\.0\.0|localhost|\[::1\]|169\.254\.|10\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.)" \
    "id:1001122,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SSRF userinfo confusion to internal address',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：IPv4 映射 IPv6 回环写法（[::ffff:127.0.0.1]/[::ffff:7f00:1]），
# RFC 4291 定义，常用于绕过仅匹配 127.0.0.1 文本的过滤。
SecRule ARGS "@rx \[::ffff:(?:127\.0\.0\.1|7f00:0*1)\]" \
    "id:1001123,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SSRF IPv4-mapped IPv6 loopback',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
