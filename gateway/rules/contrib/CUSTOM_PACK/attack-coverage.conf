# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 攻击覆盖面扩充（SSTI/JWT/SSRF变形/NoSQL/LDAP/CVE补充）
#
# 来源：依据公开漏洞情报（CVE 公告、厂商安全通告、公开 PoC 特征）、
#       OWASP Cheat Sheet（SSTI/SSRF/LDAP/NoSQL Injection）、RFC 7519（JWT）
#       及各模板引擎官方文档自行编写，未复制任何第三方 WAF 产品的规则、
#       文案或结构。
#
# 规则 ID 段：1001100-1001199。
#
# 与包内其他文件的边界（避免重复）：
#   - SSTI：deserialization-rce.conf（10006xx）仅有 {{config/self/request}}
#     与 #{...} 等泛化弱特征；本文件补充引擎级高置信特征（Jinja2 对象图、
#     Freemarker 危险内建、Smarty/Velocity/Thymeleaf/ERB/EJS 等）。
#   - JWT：api-abuse.conf（10004xx）已覆盖 alg=none 的 Authorization/ARGS
#     场景；本文件补充 kid/jku/x5u 头注入、Cookie 空签名与 URL 令牌泄露。
#   - SSRF：cloud-abuse.conf（10003xx）已覆盖云元数据 IP/主机名与锚定
#     协议；本文件补充混淆回环地址、userinfo 混淆、泛解析域名与非锚定场景。
#   - CVE：cve-emergency.conf（10000xx）与 cve-recent.conf（10008xx）、
#     oss-webapps-cve.conf（10009xx）未覆盖的高危 CVE 应急特征。
#
# 评分模型（与 CRS 异常评分一致，同 cve-emergency.conf 头部说明）：
#   - CRITICAL(5) 单条命中即达阻断阈值；
#   - ERROR(4)/WARNING(3)/NOTICE(2) 用于弱特征叠加与审计。
# =============================================================================


# -- SSTI 服务端模板注入 --------------------------------------------------------

# 来源：OWASP SSTI 检测方法学，多引擎通用探针为算术表达式求值
# （{{7*7}} Jinja2/Twig、${7*7} Freemarker/EL、#{7*7} Thymeleaf、<%= 7*7 %> ERB），
# 纯数字算术在业务输入中几乎无正常用途。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?:\{\{|\$\{|#\{|<%=)\s*\d{1,6}\s*[*/+\x2d]\s*\d{1,6}\s*(?:\}\}|\}|%>)" \
    "id:1001101,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'SSTI polyglot arithmetic evaluation probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Jinja2/Tornado 沙箱逃逸公开利用，经 {{...__class__.__mro__...}} 遍历
# Python 对象图读取 __globals__/__builtins__ 执行代码（PayloadsAllTheThings 公开字典）。
SecRule ARGS|REQUEST_BODY "@rx \{\{[^}]{0,250}(?:__class__|__mro__|__subclasses__|__globals__|__builtins__|__import__|__init__)" \
    "id:1001102,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Jinja2 SSTI python object graph traversal',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Jinja2 属性过滤器绕过公开手法 {{...|attr("__class__")}}，
# 用于绕过对 __ 开头属性名的字符串过滤。
SecRule ARGS|REQUEST_BODY "@rx \{\{[^}]{0,250}\|attr\s*\(" \
    "id:1001103,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Jinja2 SSTI attr filter sandbox bypass',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Twig（PHP）SSTI 公开利用，{{_self.env}} 读取环境、
# registerUndefinedFilterCallback 注册回调执行任意函数（Symfony 公开研究）。
SecRule ARGS|REQUEST_BODY "@rx \{\{[^}]{0,250}(?:_self\.env|registerUndefinedFilterCallback|app\.request\.)" \
    "id:1001104,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Twig SSTI environment/callback abuse',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Freemarker 官方文档载明 Execute/ObjectConstructor/JythonRuntime 三个
# 危险内建类（freemarker.template.utility.*），可执行系统命令；
# 与 1000007 的 Confluence 场景互补（本规则不限 ${} 上下文，覆盖请求体）。
SecRule ARGS|REQUEST_BODY "@rx freemarker\.template\.utility\.(?:Execute|ObjectConstructor|JythonRuntime)" \
    "id:1001105,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Freemarker dangerous utility class (Execute/ObjectConstructor)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Freemarker ?new() 内建实例化任意类（公开利用 <#assign value="..."?new()>）。
SecRule ARGS|REQUEST_BODY "@rx (?:<#assign[^>]{0,200}|\$\{[^}]{0,200})\?new\s*\(\s*\)" \
    "id:1001106,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Freemarker ?new() class instantiation',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Velocity（Apache）SSTI 公开利用，#set 结合 $class.inspect/$rt.getRuntime
# 反射执行命令（Solr Velocity RCE CVE-2019-17558 同类手法）。
SecRule ARGS|REQUEST_BODY "@rx (?:\$class\.inspect\s*\(|#set\s*\([^)]{0,120}(?:forName|getRuntime|ProcessBuilder))" \
    "id:1001107,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Velocity SSTI class tool reflection',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'cve/CVE-2019-17558',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Smarty（PHP）模板 {php}...{/php} 标签直接执行 PHP 代码（官方文档特性，
# 模板注入即 RCE）。
SecRule ARGS|REQUEST_BODY "@rx \{php\}[\s\S]{1,500}?\{/php\}" \
    "id:1001108,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Smarty SSTI {php} code block',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Smarty {if} 条件内直接调用 PHP 危险函数（公开利用 {if phpinfo()}{/if}）。
SecRule ARGS|REQUEST_BODY "@rx \{if\s+[^}]{0,120}(?:phpinfo|system|exec|shell_exec|passthru|eval|assert)\s*\(" \
    "id:1001109,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Smarty SSTI dangerous function in {if}',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Thymeleaf 预处理语法 __${...}__（双下划线包裹），公开利用经预处理
# 执行 SpEL（官方文档特性，业务输入不应出现）。
SecRule ARGS|REQUEST_BODY "@rx __\$\{[^}]{0,200}\}__" \
    "id:1001110,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Thymeleaf preprocessing __${...}__ expression',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：ERB/eRuby（Ruby）SSTI，<%= 内调用 system/IO.popen/Kernel 等（公开利用）。
SecRule ARGS|REQUEST_BODY "@rx <%[=\x2d]?[^%]{0,200}(?:system\s*\(|exec\s*\(|IO\.popen|Kernel\.|`|%x\[)" \
    "id:1001111,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'ERB/eRuby SSTI command execution',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Node.js EJS/Pug 模板注入公开利用，经 process.mainModule.require
# /process.binding 取得 child_process 执行命令。
SecRule ARGS|REQUEST_BODY "@rx process\.(?:mainModule|binding)\b" \
    "id:1001112,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Node.js template injection process object access',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：JSF/JSP 统一表达式语言（EL）隐式对象（facesContext/pageContext/
# servletContext 等，Jakarta EL 官方规范），出现在客户端输入即 EL 注入。
SecRule ARGS|REQUEST_BODY "@rx #\{\s*(?:facesContext|pageContext|servletContext|applicationScope|sessionScope|externalContext|view)\." \
    "id:1001113,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'EL injection implicit object access',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Mako（Python）模板 ${...} 内 Python 代码执行（__import__/os.popen/
# subprocess），公开利用字典。
SecRule ARGS|REQUEST_BODY "@rx \$\{[^}]{0,200}(?:__import__|os\.popen|os\.system|subprocess\.(?:Popen|call|run))" \
    "id:1001114,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Mako SSTI python code execution',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
