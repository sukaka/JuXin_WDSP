# 来源：AngularJS/Handlebars 等 JS 沙箱逃逸经典链 constructor.constructor(...)
# （公开研究，客户端模板注入升级 RCE/XSS）。
SecRule ARGS|REQUEST_BODY "@rx constructor\.constructor\s*\(" \
    "id:1001115,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'JS template sandbox escape constructor.constructor',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
