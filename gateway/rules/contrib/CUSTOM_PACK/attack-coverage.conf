    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：MongoDB $where/$function 操作符执行服务端 JavaScript（MongoDB 官方
# 文档载明），JSON 请求体中出现即高危。
SecRule REQUEST_BODY "@rx \"\$(?:where|function|accumulator)\"\s*:" \
