# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 攻击变种 / 编码绕过 / 混淆增强
#
# 来源：依据公开绕过手法、PayloadsAllTheThings 公开字典分类、OWASP 测试指南
#       与厂商/社区披露的变形 payload 自行归纳编写，未复制第三方 WAF 产品规则。
#
# 规则 ID 段：1001200-1001299（当前 1001201–1001299，共 99 条）。
# 版本：CUSTOM_PACK/1.4.0
#
# 边界（避免与已有包简单重复）：
#   - 本包侧重「同一攻击类的变形写法」：双编码、注释插入、关键字拆分、
#     Unicode/全角、空字节、协议混淆、时间盲注变形、XSS 事件/SVG 变体等；
#   - Log4j/Struts 在 cve-emergency 已有主规则，此处仅补「更深绕过变种」。
#   - 章节：A 通用编码 → B SQLi → C XSS → D RCE → E LFI/RFI → F Log4j →
#     G Struts → H XXE/SSRF/LDAP/NoSQL → I CRLF/协议 → J WebShell 上传 →
#     K 综合探测 → L 更深编码 → M SQLi 深变种 → N XSS 深变种 → O RCE 深变种 →
#     P SSTI/EL → Q SSRF → R XXE/反序列化/走私 → S Log4j/Struts 补强 →
#     T 上传/头部 → U NoSQL/GraphQL/JWT/Cookie。
#
# 注意 Coraza v3.7 变量语义：FILES 为上传文件名集合，FILES_NAMES 为上传
# 表单字段名集合；文件名类检测须以 FILES 为目标（与 CRS 933110/944140/932180 一致）。
# =============================================================================


# =============================================================================
# A. 通用编码 / 绕过层
# =============================================================================

# 双重 URL 编码的路径穿越 / 斜杠（%252e %252f）
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?:%252e|%252f|%255c|%c0%ae|%c0%af|%c1%9c)" \
    "id:1001201,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Double/overlong URL encoding traversal or slash',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# Unicode 全角斜杠/点（常用于 WAF 绕过）
SecRule REQUEST_URI|ARGS "@rx (?:\xef\xbc\x8f|\xef\xbc\x8e|\xe2\x80\x8b|\xe2\x80\x8e|\xe2\x81\xa0)" \
    "id:1001202,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Unicode slash/dot/zero-width evasion characters',\
    logdata:'Matched Data: unicode evasion sequence',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 空字节截断变种
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?:%00|\\x00|\\u0000).{0,40}(?:\.php|\.jsp|\.asp|/etc/passwd)" \
    "id:1001203,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Null-byte truncation near sensitive extension/path',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Tab/换行/注释拆分关键字（sele/**/ct、un/**/ion）
SecRule ARGS|REQUEST_BODY "@rx (?:uni(?:/\*.*?\*/|\s|%09|%0a|%0d|\+)+on|sele(?:/\*.*?\*/|\s|%09)+ct|inf(?:/\*.*?\*/|\s)+o(?:rmation)?_schema)" \
    "id:1001204,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SQL keyword split with comments/whitespace (union/select)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'evasion/comment',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 大小写混排 + 内联注释（SeLeCt/**/）
SecRule ARGS|REQUEST_BODY "@rx (?:s(?:e|E)(?:l|L)(?:e|E)(?:c|C)(?:t|T)|u(?:n|N)(?:i|I)(?:o|O)(?:n|N)|i(?:n|N)(?:s|S)(?:e|E)(?:r|R)(?:t|T))\s*/\*!" \
    "id:1001205,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'SQL keyword with MySQL versioned comment after mixed case',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'evasion/comment',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 科学计数/JSON 类型混淆注入（少见但扫描器会用）
SecRule ARGS|REQUEST_BODY "@rx (?:1e(?:\d){1,4}\s*(?:or|and|union)|true\s*,\s*true\s*,\s*true)" \
    "id:1001206,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SQL/NoSQL type-juggling style probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# =============================================================================
# B. SQL 注入变种
# =============================================================================

# 时间盲注变种（sleep/benchmark/pg_sleep/waitfor）
SecRule ARGS|REQUEST_BODY "@rx (?:sleep\s*\(\s*\d|benchmark\s*\(\s*\d|pg_sleep\s*\(|waitfor\s+delay\s+['\"]|dbms_pipe\.receive_message)" \
    "id:1001207,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Time-based SQLi variant (sleep/benchmark/waitfor)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 布尔盲注变种（and 1=1 / or 'a'='a' / xor）
SecRule ARGS|REQUEST_BODY "@rx (?:'\s*(?:and|or|xor|&&|\|\|)\s*(?:'|\d)|(?:and|or)\s+\d+\s*[=<>]+\s*\d+|'\s*=\s*')" \
    "id:1001208,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Boolean-based SQLi tautology variant',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# UNION 变形（union all select / union/**/select / uNiOn）
SecRule ARGS|REQUEST_BODY "@rx (?:union(?:\s|/\*.*?\*/|%09|%0a|\+)+all(?:\s|/\*.*?\*/)+select|union(?:\s|/\*.*?\*/|%09)+select)" \
    "id:1001209,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'UNION SELECT with whitespace/comment variants',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 报错注入变种（extractvalue/updatexml/floor(rand)）
SecRule ARGS|REQUEST_BODY "@rx (?:extractvalue\s*\(|updatexml\s*\(|floor\s*\(\s*rand\s*\(|exp\s*\(\s*~\s*\(|gtid_subset\s*\()" \
    "id:1001210,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Error-based SQLi function variants',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 堆叠查询变种
SecRule ARGS|REQUEST_BODY "@rx ;\s*(?:select|insert|update|delete|drop|create|alter|truncate|exec|declare)\b" \
    "id:1001211,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Stacked query SQLi variant',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# ORDER BY 数字探测
SecRule ARGS|REQUEST_BODY "@rx order\s+by\s+\d{1,3}\b" \
    "id:1001212,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'ORDER BY column-count probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# JSON/XML 内嵌 SQL 关键字
SecRule REQUEST_BODY "@rx [\"'](?:query|sql|filter|where)[\"']\s*:\s*[\"'][^\"']{0,80}\b(?:union|select|sleep\()\b" \
    "id:1001213,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SQLi keywords inside JSON field values',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# =============================================================================
# C. XSS 变种
# =============================================================================

# 事件处理器变种（onerror/onload/onfocus 等 + 编码）
SecRule ARGS|REQUEST_BODY "@rx (?:on(?:error|load|click|mouseover|focus|blur|toggle|pointerenter|animationend)\s*=|on\w{3,20}\s*=\s*(?:[\"']|javascript:))" \
    "id:1001214,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XSS event-handler attribute variant',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# SVG/MathML 向量
SecRule ARGS|REQUEST_BODY "@rx (?:<svg[\s/]|<math[\s/]|xlink:href\s*=|animate\s+onbegin)" \
    "id:1001215,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XSS SVG/MathML vector variant',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# javascript: / data:text/html 协议
SecRule ARGS|REQUEST_BODY "@rx (?:javascript\s*:|data\s*:\s*text/html|vbscript\s*:)" \
    "id:1001216,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XSS dangerous URI scheme variant',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# HTML 实体 / 十六进制编码脚本标签
SecRule ARGS|REQUEST_BODY "@rx (?:&#x0*(?:3c|60)\s*script|&#0*60\s*script|%3c%73%63%72%69%70%74)" \
    "id:1001217,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'XSS encoded script tag variant',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# template 注入 + XSS 混合（Angular/Vue 表达式）
SecRule ARGS|REQUEST_BODY "@rx (?:\{\{constructor\.constructor|ng-bind|v-html\s*=|\[innerhtml\])" \
    "id:1001218,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Client-side template/XSS framework injection variant',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# =============================================================================
# D. 命令注入 / RCE 变种
# =============================================================================

# 管道与逻辑连接符变种
SecRule ARGS|REQUEST_BODY "@rx (?:\|\s*(?:id|whoami|uname|cat|ls|nc|bash|sh|curl|wget)\b|&&\s*(?:id|whoami|cat|curl)|;\s*(?:id|whoami|uname)\b)" \
    "id:1001219,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'OS command chaining variant (| && ;)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# $IFS / ${IFS} / $'...' bash 变种
SecRule ARGS|REQUEST_BODY "@rx (?:\$\{?IFS\}?|\$'\\x[0-9a-f]{2}'|\$'\w')" \
    "id:1001220,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Bash IFS / ANSI-C quoting command injection variant',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 反引号与 $() 嵌套
SecRule ARGS|REQUEST_BODY "@rx (?:`\s*(?:id|whoami|uname|cat|ls)\b|\$\(\s*(?:id|whoami|curl|wget)\b)" \
    "id:1001221,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Command substitution with reconnaissance binaries',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# PowerShell 编码变种（-enc / FromBase64String）
SecRule ARGS|REQUEST_BODY "@rx (?:powershell(?:\.exe)?[^\n]{0,40}(?:-enc|-encodedcommand|-e\s+[A-Za-z0-9+/]{20,})|FromBase64String\s*\()" \
    "id:1001222,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'PowerShell encoded command variant',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.4.0',\
