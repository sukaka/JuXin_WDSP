SecRule ARGS|REQUEST_BODY "@rx (?:\$\w+\s*=\s*['\"](?:ass|eva|sys|pas|cre|exe)['\"]\s*\.\s*['\"]|\$\w+\s*\(\s*\$_(?:GET|POST|REQUEST|COOKIE))" \
