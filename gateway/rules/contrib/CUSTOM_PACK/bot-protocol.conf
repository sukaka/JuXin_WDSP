    ver:'CUSTOM_PACK/1.1.0',\
    severity:'NOTICE'"


# -- 上传与异常 Content-Type -------------------------------------------------------
SecRule REQUEST_HEADERS:Content-Type|ARGS|REQUEST_BODY "@rx (?:application/x-msdownload|application/x-msdos-program|application/x-sh|application/x-csh)" \
    "id:1000719,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Executable or shell Content-Type',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

SecRule REQUEST_BODY|ARGS "@rx filename\s*=\s*[\"']?[^\"']*\.(?:php\d?|phtml|phar|jspx?|asp|aspx|exe|dll|bat|cmd|ps1|vbs|js|sh|cgi)[\"']?" \
    "id:1000720,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Multipart upload of executable/script extension',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
