    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

SecRule REQUEST_HEADERS:Content-Length "@rx ^0\d+" \
    "id:1000704,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Content-Length with leading zero (smuggling hint)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
