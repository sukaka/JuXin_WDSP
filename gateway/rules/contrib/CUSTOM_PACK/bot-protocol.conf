    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- 可疑 Cookie / 会话 ------------------------------------------------------------
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES "@rx (?:\$\{jndi:|<\?php|eval\(|base64_decode)" \
    "id:1000722,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Malicious payload in Cookie',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# RE2 重复计数上限为 1000 且禁止嵌套重复；改写为平铺四段（1000×3+96，≥4096）保持原语义
SecRule REQUEST_HEADERS:Cookie "@rx [^;]{1000}[^;]{1000}[^;]{1000}[^;]{96,}" \
    "id:1000723,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Extremely large Cookie header segment',\
    logdata:'Matched Data: oversized cookie segment',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -- 异常 Accept / Range -----------------------------------------------------------
SecRule REQUEST_HEADERS:Range "@rx bytes\s*=\s*\d+\s*-\s*\d+.*," \
    "id:1000724,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Multi-range header (Apache CVE-2011-3192 style)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
