SecRule REQUEST_HEADERS:X-Forwarded-For "@rx (?:127\.0\.0\.1|0\.0\.0\.0|::1|localhost)" \
    "id:1000709,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'X-Forwarded-For spoofing loopback address',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

SecRule REQUEST_HEADERS:X-Original-URL|REQUEST_HEADERS:X-Rewrite-URL "@rx ." \
    "id:1000710,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Path override headers X-Original-URL/X-Rewrite-URL present',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- 恶意 / 扫描类 User-Agent ------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@rx (?:nikto|nmap|masscan|zgrab|dirbuster|gobuster|ffuf|wfuzz|wpscan|joomscan|acunetix|nessus|openvas|appscan|burpsuite|owasp.?zap|whatweb|httprint)" \
    "id:1000711,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Known security scanner user-agent',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-scanner',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

SecRule REQUEST_HEADERS:User-Agent "@rx (?:python-requests/|Go-http-client/|Java/|libwww-perl|lwp-trivial|PHP/|curl/|Wget/|scrapy|httpclient|okhttp)" \
    "id:1000712,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,\
    msg:'Automated client library user-agent (pass+log)',\
    tag:'attack-scanner',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'NOTICE'"

# 注意：分号(;)已从元字符类中移除——主流浏览器 UA 的平台注释段均含分号
# （如 "Windows NT 10.0; Win64; x64"），纳入会导致全量浏览器误拦（实测复现）。
SecRule REQUEST_HEADERS:User-Agent "@rx (?:<|>|'|\"|\||\`)" \
    "id:1000713,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'User-Agent contains injection metacharacters',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:1000714,\
    phase:1,\
    pass,\
    log,\
    t:none,\
    msg:'Missing User-Agent header (pass+log)',\
    tag:'attack-scanner',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'NOTICE'"


