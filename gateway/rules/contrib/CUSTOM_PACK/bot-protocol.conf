# -- Host / Header 注入 ------------------------------------------------------------
SecRule REQUEST_HEADERS:Host "@rx [\r\n]" \
    "id:1000707,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'CRLF in Host header',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
