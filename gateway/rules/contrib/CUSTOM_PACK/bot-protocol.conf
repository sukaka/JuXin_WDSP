# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 协议滥用、恶意 Bot 与异常请求结构
#
# 来源：依据 RFC 7230/9112、公开 Bot 指纹与常见 HTTP 攻击手法自行编写，
#       未复制任何第三方 WAF 产品规则。
#
# 规则 ID 段：1000700-1000799。
# =============================================================================


# -- 危险/异常 HTTP 方法 ----------------------------------------------------------
SecRule REQUEST_METHOD "@rx ^(?:TRACE|TRACK|DEBUG|CONNECT)$" \
    "id:1000701,\
    phase:1,\
    block,\
    capture,\
    t:none,t:uppercase,\
    msg:'Dangerous or uncommon HTTP method',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

SecRule REQUEST_METHOD "@rx ^(?:PROPFIND|PROPPATCH|MKCOL|COPY|MOVE|LOCK|UNLOCK)$" \
    "id:1000702,\
    phase:1,\
    block,\
    capture,\
    t:none,t:uppercase,\
    msg:'WebDAV method probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-protocol',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -- HTTP 请求走私 / 异常 Content-Length ------------------------------------------
SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?:chunked.*chunked|identity|compress|deflate)" \
    "id:1000703,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Suspicious Transfer-Encoding value',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
