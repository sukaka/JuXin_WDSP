SecRule ARGS|ARGS_NAMES|REQUEST_BODY|REQUEST_URI "@rx /(?:var/run/docker\.sock|run/containerd/containerd\.sock)" \
    "id:1000315,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'docker.sock container runtime socket probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Docker Remote API 未授权访问（官方 API 路径 /containers/json 等）。
SecRule REQUEST_URI "@rx ^/(?:v1\.\d{2}/)?(?:containers/json|images/json|_ping)$" \
    "id:1000316,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Docker Remote API unauthenticated probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：Docker Registry V2 API /v2/_catalog 仓库枚举（官方 API 文档）。
SecRule REQUEST_URI "@rx ^/v2/_catalog" \
    "id:1000317,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Docker registry catalog probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -- Elasticsearch 未授权访问 --------------------------------------------------------------------
# 来源：Elasticsearch 官方 REST API，/_search /_cat /_cluster /_nodes 等
# 管理与查询端点未授权暴露。
SecRule REQUEST_URI "@rx ^/(?:_search|_sql|_cat|_cluster/health|_nodes|_mapping)" \
    "id:1000318,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Elasticsearch unauthenticated API probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：Elasticsearch 索引级搜索 /<index>/_search（官方 API 路径格式）。
SecRule REQUEST_URI "@rx ^/[a-z0-9_\x2d-]+/_search" \
    "id:1000319,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Elasticsearch index search probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'NOTICE',\
    setvar:'tx.inbound_anomaly_score=+%{tx.notice_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"


# -- Spring Actuator / 运维端点 ----------------------------------------------------------------------
# 来源：Spring Boot Actuator 官方文档端点，env/heapdump 泄露环境变量与内存
# 快照（常含数据库口令、AK/SK），未授权暴露即高危。
SecRule REQUEST_URI "@rx ^/(?:actuator/)?(?:env|heapdump|jolokia)(?:/|$)" \
    "id:1000320,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Spring Actuator env/heapdump exposure',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Spring Actuator 信息类端点（mappings/configprops/beans/threaddump）。
SecRule REQUEST_URI "@rx ^/(?:actuator/)?(?:mappings|configprops|beans|threaddump)(?:/|$)" \
    "id:1000321,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Spring Actuator info endpoint probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：Spring Actuator shutdown 端点（可直接关闭应用）。
SecRule REQUEST_URI "@rx ^/(?:actuator/)?shutdown$" \
    "id:1000322,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Spring Actuator shutdown endpoint access',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Spring Cloud Gateway actuator 路由端点（CVE-2022-22947 利用入口，
# 可新增路由执行 SpEL）。
SecRule REQUEST_URI "@rx ^/actuator/gateway/routes" \
    "id:1000323,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Spring Cloud Gateway actuator routes (CVE-2022-22947)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'cve/CVE-2022-22947',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -- API 文档暴露（INFO 级，仅标记不阻断）------------------------------------------------------------------
# 来源：Swagger UI 页面暴露（任务要求 INFO 级）；swagger-ui 为开发自测常用，
# 仅提示收敛暴露面。Coraza 原生支持 severity INFO。
SecRule REQUEST_URI "@rx ^/(?:swagger-ui(?:\.html|/)|swagger/)" \
    "id:1000324,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'Swagger UI exposed',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'INFO',\
    setvar:'tx.inbound_anomaly_score=+%{tx.notice_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"

# 来源：OpenAPI/Swagger 接口文档 JSON 暴露（/v2/api-docs、/v3/api-docs、
# openapi.json、swagger-resources），INFO 级仅标记。
SecRule REQUEST_URI "@rx ^/(?:v[23]/api-docs|swagger-resources|openapi\.json|api-docs)" \
    "id:1000325,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'OpenAPI/Swagger api-docs exposed',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'INFO',\
    setvar:'tx.inbound_anomaly_score=+%{tx.notice_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"

# 来源：GraphQL 调试台暴露（GraphiQL/Playground/Altair），INFO 级仅标记。
SecRule REQUEST_URI "@rx ^/(?:graphql-playground|graphiql|altair|graphql/voyager)" \
    "id:1000326,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'GraphQL IDE exposed',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'INFO',\
    setvar:'tx.inbound_anomaly_score=+%{tx.notice_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"


