# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 云环境滥用与组件未授权访问检测
#
# 来源：阶段8 规则量扩展任务 L3。全部规则由本团队依据各云厂商公开文档
#       （元数据服务地址）、Kubernetes/Docker/Elasticsearch 等组件公开
#       API 路径与公开安全研究报告自行编写，未复制任何第三方 WAF 产品。
#
# 规则 ID 段：1000300-1000399。
#
# 评分与阻断策略：
#   - SSRF 云元数据窃取等确定攻击特征 CRITICAL，单条即达阻断阈值；
#   - 组件未授权访问路径多为探测行为，WARNING/ERROR 计分叠加；
#   - swagger-ui/api-docs 等信息泄露仅 INFO 级（pass+log，NOTICE 分值），
#     由运营侧评估是否收敛暴露面，不直接阻断；
#   注：Coraza 支持 INFO 严重度；管理端 wafrules 解析器会将 INFO 归一化为
#   NOTICE 入库（见 server/internal/wafrules/sync.go normalizeSeverity）。
# =============================================================================


# -- SSRF 云元数据 ----------------------------------------------------------------------
# 来源：AWS/阿里云(旧)/华为云等云厂商公开文档，实例元数据服务固定地址
# 169.254.169.254。出现在请求参数中即 SSRF 窃取元数据特征。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx 169\.254\.169\.254" \
    "id:1000301,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'SSRF cloud metadata endpoint 169.254.169.254',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：GCP 公开文档，元数据服务主机名 metadata.google.internal。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx metadata\.google\.internal" \
    "id:1000302,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'SSRF GCP metadata endpoint',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：阿里云公开文档，元数据服务固定地址 100.100.100.200。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx 100\.100\.100\.200" \
    "id:1000303,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'SSRF Aliyun metadata endpoint 100.100.100.200',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：AWS ECS 任务元数据端点 169.254.170.2（AWS 官方文档）。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx 169\.254\.170\.2" \
    "id:1000304,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'SSRF AWS ECS task metadata endpoint',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：腾讯云公开文档，元数据地址 169.254.0.23 与 metadata.tencentyun.com。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?:169\.254\.0\.23|metadata\.tencentyun\.com)" \
    "id:1000305,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'SSRF Tencent Cloud metadata endpoint',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：云元数据通用路径 /latest/meta-data|user-data|dynamic（AWS 文档路径结构），
# 单独出现可能为同云应用自用，WARNING 计分。
SecRule ARGS|REQUEST_URI "@rx /latest/(?:meta-data|user-data|dynamic)" \
    "id:1000306,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Cloud metadata path probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：SSRF 绕过手法，将 169.254.169.254 写成十进制整数 2852039166
# 或十六进制 0xa9fea9fe（各云厂商安全白皮书公开绕过样例）。
SecRule ARGS "@rx ^(?:https?://)?(?:2852039166|0xa9fea9fe)(?::\d+)?/?" \
    "id:1000307,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SSRF obfuscated metadata IP (decimal/hex)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：SSRF 通用特征，参数值为指向回环地址的 URL（含 IPv6 [::1]）。
SecRule ARGS "@rx ^(?:https?|gopher|dict|file|ftp|ldap)://(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])(?::\d+)?(?:/|$)" \
    "id:1000308,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SSRF loopback target in parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：SSRF 危险协议（gopher/dict/file/ldap 等常用于打内网服务与 Redis）。
SecRule ARGS "@rx ^(?:gopher|dict|file|ldap|tftp|sftp)://" \
    "id:1000309,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SSRF dangerous URL scheme',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：SSRF 指向 RFC1918 内网地址（内网应用回调可能命中，WARNING 计分）。
SecRule ARGS "@rx ^https?://(?:10\.\d+\.\d+\.\d+|172\.(?:1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+)(?::\d+)?/" \
    "id:1000310,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SSRF RFC1918 internal target in parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-ssrf',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -- Kubernetes API 未授权访问 -------------------------------------------------------------
# 来源：Kubernetes 官方 API 文档，/api/v1/namespaces 为集群资源枚举入口，
# 经 WAF 反代直连该路径即 API Server 暴露特征。
SecRule REQUEST_URI "@beginsWith /api/v1/namespaces" \
    "id:1000311,\
    phase:1,\
    block,\
    t:none,t:lowercase,\
    msg:'Kubernetes API namespaces probe',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：Kubernetes 官方 API 文档，核心资源路径
# （pods/secrets/serviceaccounts/nodes 与 apps API 组）。
SecRule REQUEST_URI "@rx ^/(?:api/v1/(?:pods|secrets|serviceaccounts|nodes)|apis/apps/v1)" \
    "id:1000312,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Kubernetes API resource probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：Kubernetes exec/portforward/attach 子资源（官方 API 文档），
# 未授权访问可直接进入容器执行命令。
SecRule REQUEST_URI "@rx ^/(?:api|apis)/[\w./\x2d-]+/(?:exec|portforward|attach)" \
    "id:1000313,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Kubernetes exec/portforward endpoint access',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Kubernetes ServiceAccount 令牌固定路径
# /run/secrets/kubernetes.io/serviceaccount（官方文档），出现在请求中多为
# 目录穿越/文件读取的目标，WARNING 计分。
SecRule ARGS|REQUEST_BODY|REQUEST_URI "@rx /run/secrets/kubernetes\.io/serviceaccount" \
    "id:1000314,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Kubernetes serviceaccount token path reference',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -- Docker / 镜像仓库 ------------------------------------------------------------------------
