    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：etcd V2 API /v2/keys/ 未授权暴露（官方 API 文档）。
SecRule REQUEST_URI "@rx ^/v2/keys/" \
    "id:1000329,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'etcd API unauthenticated probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：Prometheus /metrics 与查询 API 暴露（自身监控也可能命中，NOTICE 级）。
SecRule REQUEST_URI "@rx ^/(?:metrics|api/v1/query|api/datasources)" \
    "id:1000330,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Prometheus/metrics endpoint probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'NOTICE',\
    setvar:'tx.inbound_anomaly_score=+%{tx.notice_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.notice_anomaly_score}'"

# =============================== END cloud-abuse.conf ===============================
