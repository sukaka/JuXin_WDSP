# -- Java 序列化魔数编码形态补充（1000601 的编码面补强）--------------------------------
# 来源：Java 原生序列化魔数 \xac\xed\x00\x05 的 hex 字符串（aced0005，任意大小写）
# 与 base64 字符串（rO0AB）出现在参数、请求体或 Cookie 中；补充 1000601
# （t:none 区分大小写且未覆盖 Cookie），t:lowercase 后统一小写匹配。
SecRule ARGS|REQUEST_BODY|REQUEST_COOKIES "@rx (?:aced0005|ro0ab)" \
    "id:1000631,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Java serialization magic hex/base64 in args/body/cookie (case-insensitive)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'attack-java',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：魔数的转义书写形态（JSON/JS 字符串内的 \xac\xed 或 \u00ac\u00ed 文本），
# 为反序列化 payload 放入 JSON 字段时的常见写法；\x5c 匹配字面反斜杠。
SecRule ARGS|REQUEST_BODY "@rx (?:\x5cxac\x5cxed|\x5cu00ac\x5cu00ed)" \
    "id:1000632,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
