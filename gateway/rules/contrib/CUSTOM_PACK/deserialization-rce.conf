# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 反序列化与跨语言 RCE 特征
#
# 来源：依据公开反序列化漏洞研究（Java/PHP/Python/.NET/YAML/OGNL 等）
#       自行编写，未复制任何第三方 WAF 产品规则。
#
# 规则 ID 段：1000600-1000699。
#
# 扩充（1000631-1000648，BAS 入侵攻击模拟差距分析分片）：Java 序列化魔数
#       编码形态补充、XMLDecoder 标签组合（WebLogic 类）、Shiro rememberMe
#       长度异常、.NET ViewState 未加密迹象与 ysoserial.net gadget、pickle
#       转义形态与新增模块 opcode、phar/phpggc gadget 命名空间、fastjson
#       autoType 补丁绕过变种。全部依据公开漏洞研究自研编写，
#       未复制任何第三方 WAF 产品规则。
# =============================================================================


