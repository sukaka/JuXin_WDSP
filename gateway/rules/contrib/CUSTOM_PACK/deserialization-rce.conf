    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- Shiro rememberMe 长度异常 -------------------------------------------------------
# 来源：Shiro 反序列化攻击的 rememberMe Cookie 为 AES 密文 base64，长度远超正常
# "记住我"值；本条覆盖 200-255 字符区间且限定纯 base64 字符集（^...$ 锚定），
# 与 1000013（>=256 任意字符）互补；长度特征存在误报可能，ERROR 计分。
SecRule REQUEST_COOKIES:rememberMe "@rx ^[A-Za-z0-9+/=]{200,}$" \
    "id:1000635,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Shiro rememberMe oversized base64 value (200-255 chars band)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'attack-java',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- .NET ViewState 未加密与 ysoserial.net gadget --------------------------------------
# 来源：__VIEWSTATE 存在但缺少 __VIEWSTATEENCRYPTED 字段，说明 ViewState 仅做
# MAC 校验未加密，验证密钥泄露时可直接反序列化 RCE（CVE-2020-0688 等公开利用
# 前提）；属配置风险弱特征，链式判断（字段计数为 0），WARNING 计分。
SecRule ARGS_NAMES "@rx ^__VIEWSTATE$" \
    "id:1000636,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'ASP.NET ViewState without __VIEWSTATEENCRYPTED (unencrypted, MAC-only)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'WARNING',\
    chain,\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"
    SecRule &ARGS:__VIEWSTATEENCRYPTED "@eq 0" "t:none"

# 来源：ysoserial.net 公开 gadget 链的 .NET 类型名（LosFormatter/ObjectStateFormatter
# 反序列化器本体已由 1000612 覆盖，本条补充具体 gadget 链类型）。
SecRule ARGS|REQUEST_BODY "@rx (?:ActivitySurrogateSelector|ActivitySurrogateDisableTypeCheck|TextFormattingRunProperties|SessionViewStateHistoryItem|ToolboxItemContainer|ObjectDataProvider|Microsoft\.Workflow\.Compiler|System\.IdentityModel\.Tokens\.SessionSecurityToken)" \
    "id:1000637,\
    phase:2,\
