# 来源：转义 @type 键与已知 gadget 类名（JdbcRowSetImpl/TemplatesImpl 等）同时
# 出现，为 autoType 绕过的实际利用形态，强特征 CRITICAL。
# 说明：后一个 ^ 分支面向经 JSON 解析后的参数值（TemplatesImpl/BCEL/xbean/c3p0
# 类名作参数值无正常业务用途；JdbcRowSetImpl 值形态已由 1000602 覆盖）。
SecRule ARGS|REQUEST_BODY "@rx (?:[\"'](?:\x5cu0040type|@\x5cu0074ype|@t\x5cu0079pe|@ty\x5cu0070e|@typ\x5cu0065)[\"']\s*:\s*[\"'][^\"']{0,200}(?:jdbcrowsetimpl|templatesimpl|basicdatasourcefactory|rowsetimpl|bcel|xbean|jndi)|^(?:com\.sun\.org\.apache\.xalan\.internal\.xsltc\.trax\.templatesimpl|com\.sun\.org\.apache\.bcel\.internal|org\.apache\.xbean|com\.mchange\.v2\.c3p0))" \
    "id:1000644,\
