# -- XMLDecoder 反序列化（WebLogic CVE-2017-3506/10271 类）-----------------------------
# 来源：java.beans.XMLDecoder 文档模型的公开利用结构：<java> 根元素内出现
# <object class="..."> 实例化标签（CVE-2017-3506/10271 公开 PoC 通用形态）；
# <java 后以空白或 > 界定，避免误伤 <javascript> 文本。
# 说明：同时匹配 ARGS，覆盖表单编码提交的 payload（引擎对 XML 请求体仅提供
# XML 集合，原始文本不可见，故目标取 ARGS|REQUEST_BODY）。
SecRule ARGS|REQUEST_BODY "@rx <java[\s>][\s\S]{0,800}<object\s+class\s*=" \
    "id:1000633,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XMLDecoder java/object class payload (WebLogic style)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'attack-java',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：同一模型的 <void method=/property=/index= 与 <array class=/length= 成员
# 调用标签，用于调用 ProcessBuilder.start 等方法（公开 PoC 通用形态）。
SecRule ARGS|REQUEST_BODY "@rx <java[\s>][\s\S]{0,800}<(?:void|array)\s+(?:method|property|index|class|length)\s*=" \
    "id:1000634,\
    phase:2,\
