# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 主流搜索引擎爬虫 UA 声称标记
#
# 来源：本团队依据各搜索引擎官方文档公布的爬虫 User-Agent 标识自行编写
#       （Google、Bing、百度、Yandex、DuckDuckGo、搜狗、360、神马、
#       字节跳动、Apple、Yahoo、Seznam、华为花瓣搜索等公开资料），
#       未复制任何第三方 WAF 产品的规则、文案或结构。
#
# 规则 ID 段：1010201-1010299。
#
# 用途与边界（重要）：
#   本包只做「UA 自称是主流搜索引擎爬虫」的【标记】，供安全运营在事件中心
#   快速透视此类流量并与攻击命中交叉分析（真爬虫一般不会触发攻击规则；
#   声称是 Googlebot 却命中攻击规则是高价值线索）。
#   本包【不做真假判定】：真假鉴别依赖 rDNS 反查，属离线路径能力
#   （替代被移除的 CRS fake-bot-plugin，见其移除说明：
#   docs/WAF_RULE_ENRICHMENT_DESIGN.md §3 P1 表注）。
#
# 处置策略：全部 pass + log 只标记（OBSERVE），不阻断、不累加异常评分。
# =============================================================================

SecRule REQUEST_HEADERS:User-Agent "@contains Googlebot" \
    "id:1010201,phase:1,pass,log,t:none,msg:'Search engine bot UA claim: Googlebot',tag:'bot-claim/google',tag:'CUSTOM_PACK',ver:'CUSTOM_PACK/1.0.0',severity:'NOTICE'"

