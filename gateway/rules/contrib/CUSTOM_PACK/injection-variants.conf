# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— SQL 注入 / 命令注入 / XSS 绕过变种增强
#
# 来源：BAS 入侵攻击模拟差距分析分片任务。全部规则由本团队依据公开漏洞知识
#       与公开绕过手法（MySQL 官方注释语法文档、PayloadsAllTheThings 公开
#       分类、OWASP WSTG 测试指南、公开 GBK 宽字节注入分析等）自行归纳编写，
#       未复制任何第三方 WAF 产品的规则、文案或结构。
#
# 规则 ID 段：1001701-1001759（当前 1001701–1001733，共 33 条）。
# 版本：CUSTOM_PACK/1.0.0
# 评分与阻断策略同 webshell.conf 头部说明：
#   CRITICAL(5) 单条即达阻断阈值；ERROR(4)/WARNING(3) 弱特征叠加。
#
# 边界（与现有覆盖的关系，避免重复基础特征）：
#   - CRS 942500（PL1）已覆盖闭合的 /*!...*/ 内联注释、942440（PL2）覆盖
#     独立 /*! 与注释序列；本包 1001701 只补「版本数字 + 任意内容」弱信号。
#   - attack-variants-evasion.conf 1001207/1001210/1001220/1001261/1001262/
#     1001272/1001274 已覆盖 sleep(数字 直写、updatexml/extractvalue 直写、
#     $IFS 与 ${IFS} 裸写、/*!+枚举关键字、注释拆分关键字、{cmd, 大括号、
#     /???/ 通配与 ${PATH:0:1} 固定写法；本包仅补其变形（注释隔断、关键字
#     双写、截取偏移泛化、引号/反斜杠穿插、宽字节等），不重复基础特征。
#   - CRS 942410（PL2）函数名表已含 elt/field/position 裸调用；本包对应
#     规则均带盲注上下文（比较运算 / IN 元数据函数），与 PL1 部署互补。
# =============================================================================


# =============================================================================
# ① SQL 注入绕过变种（1001701-1001711）
# =============================================================================

# 来源：MySQL 版本化内联注释 /*!12345...*/ 语法（官方文档），攻击者用任意
# 版本数字包裹 SQL 片段绕过关键字检测。闭合形态已由 CRS 942500、枚举关键字
# 形态已由 1001261 覆盖；此处补「版本数字 + 任意内容」弱信号，ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx /\*!\d{4,6}\s*[a-z_]{2,}" \
    "id:1001701,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'MySQL versioned inline comment with arbitrary content',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'evasion/comment',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：等价截取函数互换（mid/substr/substring/left/right 可互相替换）直接
# 作用于 user()/version()/database()/@@ 等元数据，为盲注取值的强特征。
SecRule ARGS|REQUEST_BODY "@rx (?:mid|substr|substring|left|right)\s*\(\s*(?:@@|(?:user|version|database|schema|current_user|session_user|system_user)\s*\()" \
    "id:1001702,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Equivalent substring function on SQL metadata',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：concat_ws 以十六进制分隔符合并元数据（concat_ws(0x3a,user(),...)）、
# group_concat 内嵌 0x 常量，为联合查询/报错注入数据外带的常见写法。
SecRule ARGS|REQUEST_BODY "@rx (?:concat_ws\s*\(\s*0x[0-9a-f]{2}|group_concat\s*\([^)]{0,80}0x[0-9a-f]{2})" \
    "id:1001703,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'concat_ws/group_concat with hex separator exfiltration',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：报错注入函数名的注释隔断变形（update/**/xml、extract/**/value）及
# 函数名与括号之间插入注释（updatexml/**/(），绕过按完整函数名匹配的规则
# （1001210 仅覆盖函数名直写形态）。
SecRule ARGS|REQUEST_BODY "@rx (?:update(?:/\*[^*]{0,20}\*/\s*)+xml|extract(?:/\*[^*]{0,20}\*/\s*)+value|updatexml\s*/\*[^*]{0,20}\*/\s*\(|extractvalue\s*/\*[^*]{0,20}\*/\s*\()" \
    "id:1001704,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Error-based SQLi function name split by comments',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'evasion/comment',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：关键字双写对抗单次替换过滤（uniunionon/selselectect 等，WAF 删除
# 一次关键字后剩余字符重新拼成关键字），公开过滤绕过手法，正常文本不会出现。
SecRule ARGS|REQUEST_BODY "@rx \b(?:uniunionon|ununionion|selselectect|seleselectct|selecselectt|anandd|aandnd|oorr|whwhereere|llikeike)\b" \
    "id:1001705,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SQL keyword double-writing filter bypass',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：生僻函数盲注（elt/make_set/field 首参为数字比较式，如 elt(1=1,a,b)），
# 用于在不出现 sleep/if 的情况下构造布尔通道；裸函数名 PL2 已由 942410 覆盖。
SecRule ARGS|REQUEST_BODY "@rx (?:elt|make_set|field)\s*\(\s*\d+\s*[=<>!]+\s*\d" \
    "id:1001706,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Blind SQLi via rare function elt/make_set/field',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：POSITION(x IN user()) / LOCATE(x,user()) / INSTR(user(),x) 形式的
# 子串定位盲注（等价 substr 取值的另一种公开写法）。
SecRule ARGS|REQUEST_BODY "@rx (?:position\s*\([^)]{0,40}\bin\s+(?:user|version|database|schema)\s*\(|(?:locate|instr)\s*\(\s*(?:0x[0-9a-f]{2,}|'[^']{0,16}')\s*,\s*(?:user|version|database|schema)\s*\()" \
    "id:1001707,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'POSITION/LOCATE/INSTR substring blind SQLi',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：GBK 等宽字节编码注入（%bf%27 等高位前导字节吃掉转义反斜杠使引号
# 逃逸），公开宽字节注入分析中的经典载荷；UTF-8 合法序列第二字节不可能为
# %27/%22，故只匹配前导字节紧邻引号编码的原始形态，ERROR 计分。
SecRule REQUEST_URI|ARGS "@rx %(bf|df|a1|a3|b1|d4|dc|e0)%2[27]" \
    "id:1001708,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'GBK wide-byte quote injection (%bf%27 etc.)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：时间盲注函数名与括号之间插入注释（sleep/**/(5）绕过
# sleep\s*\(\s*\d 直写匹配（1001207）；以及函数名中部注释隔断变形。
SecRule ARGS|REQUEST_BODY "@rx (?:sleep|benchmark)\s*/\*[^*]{0,30}\*/\s*\(\s*\d|(?:sle/\*[^*]{0,10}\*/ep|benchmar/\*[^*]{0,10}\*/k)\s*\(" \
    "id:1001709,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Time-based SQLi function broken by comment',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'evasion/comment',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Oracle/MySQL 锁等待型时间盲注（dbms_lock.sleep、get_lock('x',秒)），
# 为 sleep/benchmark 之外的公开延时通道（1001207 未含这两种）。
SecRule ARGS|REQUEST_BODY "@rx (?:dbms_lock\.sleep\s*\(|get_lock\s*\(\s*['\"][^'\"]{0,32}['\"]\s*,\s*\d)" \
    "id:1001710,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Lock-wait time-based SQLi (dbms_lock/get_lock)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：HAVING/GROUP BY 列数与恒真探测（having 1=1、group by x having），
# 为注入点枚举的弱特征，正常业务文本可能出现，WARNING 计分。
SecRule ARGS|REQUEST_BODY "@rx (?:\bhaving\s+\d+\s*=\s*\d+|\bgroup\s+by\s+[\w.-]{1,40}\s+having\b)" \
    "id:1001711,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'HAVING/GROUP BY column probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# =============================================================================
# ② 命令注入绕过变种（1001712-1001721）
# =============================================================================

# 来源：$IFS$9 位置参数后缀与 ${IFS:0:1}/${IFS%%x} 等参数展开变形（bash 公开
# 语法），1001220 仅覆盖 $IFS/${IFS} 裸写，此处补带截取/替换修饰的形态。
SecRule ARGS|REQUEST_BODY "@rx (?:\$IFS\$[1-9]|\$\{IFS[:%#/][^}]{0,12}\})" \
    "id:1001712,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Bash IFS positional/expansion variant ($IFS$9, ${IFS:..})',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：环境变量子串截取构造命令（${HOME:0:1}${PATH:1:1} 逐字符拼路径），
# 1001274 仅覆盖 ${PATH:0:1} 固定写法，此处泛化到常见变量与任意偏移。
SecRule ARGS|REQUEST_BODY "@rx \$\{(?:PATH|HOME|PWD|SHELL|USER|OLDPWD|HOSTNAME|BASH|RANDOM):-?\d" \
    "id:1001713,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Environment variable substring slicing for command build',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：bash 大括号扩展包含绝对路径（{cat,/etc/passwd}、{/bin,/sbin}/sh），
# 1001272 仅覆盖 {id|whoami|cat|ls|curl|wget, 开头形态，此处要求括号内
# 出现敏感目录路径以泛化检测并控制误报。
SecRule ARGS|REQUEST_BODY "@rx \{[^{}]{0,50}/(?:etc|bin|sbin|usr|var|tmp|home|opt|proc|root|dev)[^{}]{0,50}\}" \
    "id:1001714,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Bash brace expansion with absolute path',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：通配符路径绕过（/?in/?s 等价 /bin/ls），1001274 仅覆盖 /???/ 与
# /b?in/(ba)sh 两种，此处泛化为「单问号目录段」组合。
SecRule ARGS|REQUEST_BODY "@rx /\?[a-z0-9]{1,4}/\?[a-z0-9]{1,4}" \
    "id:1001715,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Glob wildcard path command (/?in/?s style)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：反斜杠拼接绕过（c\at、\cat，shell 视反斜杠为字面量后还原命令），
# 公开 WAF 绕过手法；不使用 urlDecodeUni 以保留反斜杠原貌。
SecRule ARGS|REQUEST_BODY "@rx (?:\\(?:cat|whoami|uname|curl|wget|bash|tac|rev|echo|head|tail|grep|awk|sed|chmod|chown|nslookup|ifconfig|netstat)\b|\b(?:c\\at|wh\\oami|un\\ame|cu\\rl|wg\\et|ba\\sh|ec\\ho|ta\\c|r\\ev|n\\c|p\\wd|i\\d|l\\s)\b)" \
    "id:1001716,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Backslash-spliced command evasion (c\\at, \\cat)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：单/双引号穿插拼接绕过（c'a't、c"a"t，shell 去掉引号后还原命令），
# 仅枚举常见命令名的逐字符穿插形态以控制误报。
SecRule ARGS|REQUEST_BODY "@rx (?:c[\"']a[\"']t|wh[\"']o[\"']ami|cu[\"']r[\"']l|wg[\"']e[\"']t|ba[\"']s[\"']h|ec[\"']h[\"']o|un[\"']a[\"']me|ta[\"']c|r[\"']ev|n[\"']c\b)" \
    "id:1001717,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Quote-interleaved command evasion (c'"'"'a'"'"'t style)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：ANSI-C 八进制转义执行（$'\143\141\164'）、printf 八进制还原命令
# 及 eval "$(printf ...)" 组合，1001220 仅覆盖 $'\xNN 十六进制形态；
# 不使用 urlDecodeUni 以保留反斜杠转义序列原貌。
SecRule ARGS|REQUEST_BODY "@rx (?:\$'\\[0-7]{3}|printf\s+[\"']?\\[0-7]{3}|eval\s+[\"']?\$\(printf)" \
    "id:1001718,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'ANSI-C octal / printf octal command execution',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：base64 解码管道入 shell（base64 -d ... | sh），下载执行与反弹
# shell 的常见链路，HTTP 参数中出现即高置信攻击。
SecRule ARGS|REQUEST_BODY "@rx \bbase64\s+(?:-d|-D|--decode)\b[^|;]{0,80}\|\s*(?:sudo\s+)?(?:ba|z|k|c)?sh\b" \
    "id:1001719,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'base64 decode piped to shell',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：tac/rev 反向读取文件（tac /etc/passwd、rev ./flag），用于绕过
# 按 cat/head/tail 枚举命令名的检测，ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx \b(?:tac|rev)\s+(?:/[a-z]|\./|\.\.)" \
    "id:1001720,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Reverse file read via tac/rev',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：大括号扩展回显 base64 再解码执行（{echo,aGVsbG8=}|base64 -d），
# 1001272 大括号列表未含 echo/printf，此处补「扩展+解码管道」组合。
SecRule ARGS|REQUEST_BODY "@rx \{\s*(?:echo|printf)\s*,[A-Za-z0-9+/=]{4,48}\}\s*\|\s*(?:base64\b|(?:ba|z|k)?sh\b)" \
    "id:1001721,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Brace expansion echo piped to decoder/shell',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# =============================================================================
# ③ XSS 现代绕过变种（1001722-1001733）
# =============================================================================

# 来源：<template> 标签注入（配合声明式 Shadow DOM 可逃逸常规 HTML 过滤），
# 现代前端模板注入公开手法；富文本业务可能合法提交模板，ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx <\s*template[\s>/]" \
    "id:1001722,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'HTML template tag injection',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：危险标签内无引号事件处理器（<svg onload=alert(1)> 无括号可写形态
# 的前半结构），1001214 仅覆盖引号包裹或 javascript: 形态及 9 个枚举事件，
# 此处要求标签上下文 + 任意 on* 事件 + 非引号取值以泛化检测。
SecRule ARGS|REQUEST_BODY "@rx <(?:svg|img|body|input|details|select|marquee|video|audio|iframe|object|embed|form|button|textarea)\b[^>]{0,160}?\son[a-z]{2,20}\s*=\s*[^\"'\x60<>\s]" \
    "id:1001723,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Unquoted event handler in dangerous tag',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：事件处理器取值内含反引号（onerror=alert`1`，反引号替代引号调用），
# 公开无括号 XSS 手法，普通文本中 on*=...` 组合罕见，ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx on[a-z]{2,20}\s*=\s*[^<>\s]{0,60}?\x60" \
    "id:1001724,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Event handler with backtick invocation',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：标签模板调用（alert`1`、setTimeout`...`，反引号替代括号/引号），
# 要求反引号后紧跟标识符字符以排除 Markdown 代码标记（`alert`）误报。
SecRule ARGS|REQUEST_BODY "@rx \b(?:alert|confirm|prompt|eval|print|setTimeout|setInterval)\x60[\w$]" \
    "id:1001725,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Tagged-template JS invocation (alert`1`)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：剪切板/鼠标/触摸类冷门事件（oncopy/oncut/onmousedown/ontouchstart
# 等）无引号或任意引号形态；1001214 枚举事件列表未含这些，941 同名单规则
# 为 PL2，此处按 PL1 补充。
SecRule ARGS|REQUEST_BODY "@rx on(?:copy|cut|paste|mousedown|mouseup|contextmenu|auxclick|dragstart|dragenter|dragover|drop|focusin|focusout|dblclick|pointerdown|pointerup|touchstart|touchend|beforeinput|scroll|wheel|input|search|selectstart)\s*=" \
    "id:1001726,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XSS clipboard/mouse/touch event handler variant',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：连续 4 个以上数字型 HTML 实体（&#106;&#97;&#118;&#97; 即 "java"），
# 实体编码拼 javascript:/onerror= 等关键串绕过标签过滤；普通文本极少连续
# 书写数字实体，ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx (?:&#x?[0-9a-f]{1,4};?){4,}" \
    "id:1001727,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Long run of numeric HTML entities (encoded payload)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：连续 4 个以上 JS 十六进制/八进制转义（\x61\x6c...、\141\154...），
# 用于字符串内还原 alert 等关键字；不使用 urlDecodeUni 以免转义被提前
# 解码。不含  形态（JSON 中文转义为正常业务，避免误报），WARNING 计分。
SecRule ARGS|REQUEST_BODY "@rx (?:\\x[0-9a-f]{2}){4,}|(?:\\[0-7]{2,3}){4,}" \
    "id:1001728,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Long run of JS hex/octal escapes',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：GBK 宽字节 XSS（%bf%3c 等高位前导字节紧邻 < 编码，宽字节上下文
# 中吃掉转义后拼接标签）；与 1001708 同理只匹配原始编码形态，ERROR 计分。
SecRule REQUEST_URI|ARGS "@rx %(bf|df|a1|a3|b1|d4|dc|e0)%3c" \
    "id:1001729,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'GBK wide-byte XSS lead byte before %3c',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：嵌套双写 script 标签（<scr<script>ipt>，过滤一次 <script> 后剩余
# 字符重新拼成标签）及 <<script 双尖括号变形，为明确的过滤绕过特征。
SecRule ARGS|REQUEST_BODY "@rx (?:<\s*scr[a-z]{0,3}\s*<\s*/?\s*script[a-z]{0,3}\s*>|<\s*<\s*script)" \
    "id:1001730,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Nested double-written script tag (<scr<script>ipt>)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：DocumentFragment 系 DOM XSS 接收点（createContextualFragment/
# importNode/adoptNode/createHTMLDocument），1001269 未含这些 API；
# JS 大小写敏感，故不做 lowercase 变换按原样匹配。
SecRule ARGS|REQUEST_BODY "@rx \b(?:createDocumentFragment|importNode|adoptNode|createContextualFragment|createHTMLDocument)\s*\(" \
    "id:1001731,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'DOM XSS sink (DocumentFragment/importNode family)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：onerror/onload 直接写函数名并以标签闭合结尾（onerror=alert>），
# 无括号无分号探测形态；单独不必然触发执行，属弱特征，WARNING 计分。
SecRule ARGS|REQUEST_BODY "@rx on(?:error|load)\s*=\s*(?:alert|confirm|prompt|print)\s*/?\s*>" \
    "id:1001732,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Bare onerror/onload probe at tag close',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：String.fromCharCode 以 4 个以上字符码还原脚本关键字，编码型 XSS
# 常见手法；JS 大小写敏感按原样匹配，WARNING 计分。
SecRule ARGS|REQUEST_BODY "@rx \bString\.fromCharCode\s*\(\s*\d{2,3}(?:\s*,\s*\d{2,3}){3,}" \
    "id:1001733,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'String.fromCharCode payload reconstruction',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xss',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

