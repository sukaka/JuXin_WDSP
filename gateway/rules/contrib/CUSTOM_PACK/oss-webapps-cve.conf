# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 开源 Web 系统 / 组件利用特征
#
# 来源：依据 CNNVD/NVD/厂商安全公告中公开的 CVE 编号、官方修复说明与公开
#       PoC 路径特征自行编写；未复制任何第三方 WAF 产品规则或文案。
#       CNNVD 与 CVE 多数同源，以下以公开 CVE 编号标注，便于运营对照。
#
# 规则 ID 段：1000900-1000999。
# 评分：CRITICAL/ERROR 用于确定利用路径；WARNING 用于弱探测。
# =============================================================================


# -- WordPress / 插件（CNNVD 高频 PHP CMS）--------------------------------------
SecRule REQUEST_URI "@rx /wp-admin/(?:admin-ajax|load-scripts|load-styles)\.php" \
    "id:1000901,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'WordPress admin-ajax/load-scripts access (pass+log)',\
    tag:'app/wordpress',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.2.0',\
    severity:'NOTICE'"

SecRule REQUEST_URI|ARGS "@rx /wp-content/plugins/[^/]+/(?:filemanager|elfinder|uploadify|timthumb)" \
    "id:1000902,\
