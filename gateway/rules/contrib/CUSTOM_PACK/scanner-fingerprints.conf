# -- 经典敏感路径扫描 ---------------------------------------------------------------------
# 来源：Git 源码泄露扫描（任务要求覆盖 /.git/HEAD）。
SecRule REQUEST_URI "@beginsWith /.git/" \
    "id:1000220,\
    phase:1,\
    pass,\
    log,\
    t:none,t:lowercase,\
    msg:'Sensitive path probe: .git repository',\
    tag:'attack-scanner',\
    tag:'path/.git',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING'"

# 来源：隐藏配置/版本控制文件探测（任务要求覆盖 /.env）。
SecRule REQUEST_URI "@rx ^/\.(?:env|svn/entries|hg/|bzr/|DS_Store|htpasswd|npmrc|ssh|aws/credentials)" \
    "id:1000221,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'Sensitive path probe: hidden config file',\
    tag:'attack-scanner',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING'"

# 来源：配置备份文件探测（任务要求覆盖 /wp-config.php.bak 等）。
SecRule REQUEST_URI "@rx /(?:wp-config\.php|config\.php|configuration\.php|settings\.php)\.(?:bak|save|swp|old|orig|backup|dist|txt)|/(?:wp-config\.php~|\.env\.(?:bak|save|old|backup))$" \
    "id:1000222,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'Sensitive path probe: config backup file',\
    tag:'attack-scanner',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING'"

# 来源：数据库管理后台探测（任务要求覆盖 /phpmyadmin）。
SecRule REQUEST_URI "@rx ^/(?:phpmyadmin|pma|myadmin|mysql-admin|dbadmin|adminer)(?:/|\.php|$)" \
    "id:1000223,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'Sensitive path probe: database admin console',\
    tag:'attack-scanner',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'NOTICE'"

# 来源：通用备份/压缩包后缀探测（站点可能正常提供下载，NOTICE 级仅记录）。
SecRule REQUEST_URI "@rx \.(?:bak|backup|old|orig|save|swp|swo|sql|dump|tar\.gz|tgz|7z)$" \
