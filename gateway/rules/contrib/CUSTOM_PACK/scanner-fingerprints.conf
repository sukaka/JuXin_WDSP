# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 扫描器指纹与敏感路径探测检测
#
# 来源：阶段8 规则量扩展任务 L3。全部规则由本团队依据各扫描工具公开的
#       默认指纹（User-Agent、注入标记、回调域名、默认路径字典）自行编写，
#       未复制任何第三方 WAF 产品的规则、文案或结构。
#
# 规则 ID 段：1000200-1000299。
#
# 处置策略（重要）：本文件全部为"只标记"规则 —— pass + log，
#   不使用 block、不累加异常评分，避免扫描器特征误伤正常运维流量
#   （如运维使用 curl/脚本、健康检查 UA 等）。严重度仅 NOTICE/WARNING。
# =============================================================================


# -- sqlmap ----------------------------------------------------------------------
# 来源：sqlmap 默认 User-Agent（sqlmap/1.x.x），见 sqlmap 公开源码。
SecRule REQUEST_HEADERS:User-Agent "@rx ^sqlmap/" \
    "id:1000201,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'Scanner fingerprint: sqlmap user agent',\
    tag:'attack-scanner',\
    tag:'scanner/sqlmap',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING'"

# 来源：sqlmap 注入 payload 惯用 MySQL 版本注释 /*!50000 ...*/ 包裹关键词。
SecRule ARGS|REQUEST_BODY "@rx /\*!\d{5}" \
    "id:1000202,\
    phase:2,\
    pass,\
    log,\
    capture,\
    t:none,\
    msg:'Scanner fingerprint: sqlmap versioned comment payload',\
    tag:'attack-scanner',\
    tag:'scanner/sqlmap',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING'"


# -- nuclei ----------------------------------------------------------------------
# 来源：nuclei 默认 User-Agent 含 nuclei/projectdiscovery 字样
# （projectdiscovery/nuclei 公开源码默认请求头）。
SecRule REQUEST_HEADERS:User-Agent "@rx (?:nuclei|projectdiscovery)" \
    "id:1000203,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'Scanner fingerprint: nuclei user agent',\
    tag:'attack-scanner',\
    tag:'scanner/nuclei',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING'"

# 来源：nuclei 模板路径/CVE yaml 探测路径特征。
SecRule REQUEST_URI "@rx /(?:nuclei-templates/|cve-20\d\d-\d{4,7}\.ya?ml)" \
    "id:1000204,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'Scanner fingerprint: nuclei template path probe',\
    tag:'attack-scanner',\
    tag:'scanner/nuclei',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'NOTICE'"

# 来源：nuclei/sqlmap 等带外（OOB）检测公共回调域名
# （interactsh、oast、dnslog.cn、ceye.io、burpcollaborator）。
SecRule ARGS|REQUEST_HEADERS:Referer "@rx (?:oast\.(?:fun|live|online|pro|site)|interact\.sh|interactsh\.com|dnslog\.cn|ceye\.io|burpcollaborator\.net)" \
    "id:1000205,\
    phase:2,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'Out-of-band callback domain (scanner canary)',\
    tag:'attack-scanner',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING'"


