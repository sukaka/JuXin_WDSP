    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_URI "@rx /(?:metrics|prometheus|grafana)(?:/|$|\?)" \
    "id:1000537,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Sensitive path: metrics or monitoring endpoint probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

SecRule REQUEST_URI "@rx /(?:\.well-known/openid-configuration|oauth/token|oauth/authorize)$" \
    "id:1000538,\
    phase:1,\
    pass,\
    log,\
    capture,\
    t:none,t:lowercase,\
    msg:'Info: OAuth/OIDC endpoint access (pass+log)',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'NOTICE'"

SecRule REQUEST_URI "@rx /(?:cgi-bin/|etc/passwd|proc/self)" \
    "id:1000539,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Sensitive path: classic LFI/system path probe in URI',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

SecRule REQUEST_URI "@rx /(?:\.pem|\.key|\.p12|\.pfx|\.jks|\.keystore)$" \
    "id:1000540,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Sensitive path: certificate or private key file',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# ============================ END sensitive-exposure.conf ============================
