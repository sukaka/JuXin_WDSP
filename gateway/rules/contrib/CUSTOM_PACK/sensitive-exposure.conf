# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 敏感路径与信息暴露检测
#
# 来源：依据公开路径字典、常见误配暴露面（.git/.env/备份/管理端点）
#       自行编写，未复制任何第三方 WAF 产品规则。
#
# 规则 ID 段：1000500-1000599。
# 评分：CRITICAL/ERROR 用于高价值暴露；WARNING/NOTICE 用于探测与弱特征。
# =============================================================================


# -- 版本控制 / 依赖目录 ----------------------------------------------------------
SecRule REQUEST_URI "@rx /\.git(?:/|$)" \
    "id:1000501,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Sensitive path: .git repository exposure',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.1.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

