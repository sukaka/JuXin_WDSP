# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— SSTI 服务端模板注入专项
#
# 来源：阶段8 规则量扩展任务（BAS 入侵攻击模拟覆盖基线）。全部规则由本团队
#       依据公开漏洞知识（OWASP SSTI 检测方法学、PayloadsAllTheThings SSTI
#       公开字典、PortSwigger SSTI 公开研究）与各模板引擎官方文档
#       （Freemarker ?api/?new 内建、Velocity ClassTool、Thymeleaf 预处理、
#       Twig 过滤器回调、Groovy GString、Jakarta EL 隐式对象、Mako <%! %>
#       模块级代码块）自行编写，未复制任何第三方 WAF 产品的规则、文案或结构。
#
# 规则 ID 段：1001801-1001859。
#
# 与包内既有规则的边界（避免重复）：
#   - attack-coverage.conf（1001101-1001115）已覆盖：{{7*7}}/${7*7}/#{7*7}/
#     <%= 7*7 %> 探针、{{...}} 内 Jinja2 对象图与 |attr 过滤器、Twig
#     {{_self.env}}/registerUndefinedFilterCallback、Freemarker
#     freemarker.template.utility.* 类名与 <#assign/${ 语境 ?new()、
#     Velocity #set(...forName 与 $class.inspect、Smarty/ERB 命令执行、
#     Thymeleaf __${...}__、Mako ${...}、EL #{隐式对象}。
#   - deserialization-rce.conf（1000615-1000617）已覆盖：裸 T(java.lang.)/
#     Runtime.getRuntime()/ProcessBuilder、{{config/self/request/lipsum/
#     cycler}}、{%...%} 与 #{...} 泛化弱特征。
#   - attack-variants-evasion.conf（1001275-1001277）已覆盖：{% 指令、
#     #{}/${}/*{ 内 T( 调用、${jndi/env/sys/java:} 等表达式变种。
#   本文件只补充上述未覆盖形态：Freemarker ?api 内建与方括号指令语法、
#   Velocity ClassTool 与动态指令、SpEL new java.io/nio/net 实例化、
#   Thymeleaf __*{...}__/__#{...}__ 预处理变体、无 {{}} 包裹的 Python
#   dunder 属性链与 attr("__dunder__")、Twig 字符串回调过滤器、
#   Mako <%! %> 模块块、Groovy 引号 .execute()、Java .getClass().forName()
#   反射链、EL ${隐式对象}、以及 *{7*7}/{%= 7*7 %}/${7*'7'} 探针形态。
#
# 评分与阻断策略同 cve-emergency.conf 头部说明：
#   CRITICAL(5) 单条即达阻断阈值；ERROR(4) 弱特征叠加。
# =============================================================================


# -- Freemarker ----------------------------------------------------------------
# 来源：Freemarker 官方文档 ?api 内建可暴露底层 Java 对象并调用其方法
# （如 ${"freemarker.template.utility.Execute"?api.newInstance()}），
# 业务输入几乎不会出现 ?api.方法( 形态；URL 参数值带 ?api. 的边角场景
# 有误报可能，故 ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx \?api\s*\.\s*\w{1,30}\s*\(" \
    "id:1001801,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Freemarker ?api builtin reflection access',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Freemarker 方括号替代语法 [#assign ...]（官方文档，等价 <#assign>），
# 用于绕过对 <# 开头的字符串过滤；1001106 仅覆盖 <#assign/${ 语境。
SecRule ARGS|REQUEST_BODY "@rx \[#(?:assign|if|list|attempt|escape|switch)\s" \
    "id:1001802,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Freemarker square-bracket directive syntax',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- Velocity ------------------------------------------------------------------
# 来源：Velocity Tools ClassTool 公开利用面，$class.tool/$class.type/
# $class.forName 反射助手（Solr Velocity RCE 同类手法）；1001107 仅覆盖
# $class.inspect( 与 #set(...forName，未覆盖 ClassTool 其余入口。
SecRule ARGS|REQUEST_BODY "@rx \$class\.(?:tool|type|forName)\b" \
    "id:1001803,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Velocity ClassTool reflection helper',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Velocity 动态指令 #evaluate($x)（字符串求值即 RCE）、#parse/#include
# 加载运行时指定模板、#define 定义可复用块；参数为变量或字符串字面量时
# 在业务输入中无正常用途（Velocity 官方文档指令集）。
SecRule ARGS|REQUEST_BODY "@rx #(?:evaluate|parse|include|define)\s*\(\s*[\$\"']" \
    "id:1001804,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Velocity dynamic directive with runtime argument',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- Thymeleaf / SpEL ------------------------------------------------------------
# 来源：SpEL 支持 new 全限定类名实例化（官方文档），new java.io.File/
# java.net.URL/java.util.Scanner 等常用于文件读写与 SSRF 的公开利用；
# java.lang 下 Runtime/ProcessBuilder 已由 1000615/1001102 等覆盖，
# 此处只补 io/nio/net/util/lang.reflect；代码讨论文本有误报可能，ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx new\s+java\.(?:io|nio|net|util|lang\.reflect)\." \
    "id:1001805,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'SpEL new java.io/nio/net instantiation',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Thymeleaf 预处理 __...__ 除 __${...}__（1001110 已覆盖）外，
# 同样适用于选择器表达式 *{...} 与消息表达式 #{...}（官方文档），
# 公开利用 __*{T(java.lang.Runtime)...}__ 即此形态。
SecRule ARGS|REQUEST_BODY "@rx __[\*#]\{[^}]{0,200}\}__" \
    "id:1001806,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Thymeleaf preprocessing variant __*{...}__/__#{...}__',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- Jinja2 / Python 对象图 --------------------------------------------------------
# 来源：Python 对象图遍历的 dunder 属性链（__class__.__mro__、
# __subclasses__()、__globals__[ 等），不依赖 {{}} 定界符，覆盖定界符
# 被拆分/混淆及表达式求值端点场景；1001102 仅覆盖 {{...}} 包裹形态。
SecRule ARGS|REQUEST_BODY "@rx (?:__(?:class|mro|bases?|subclasses|globals|builtins|import|init|reduce(?:_ex)?|getattribute|getitem|dict)__\s*\.\s*__\w|__(?:subclasses|import|reduce(?:_ex)?|getattribute|getitem)__\s*\(|__(?:globals|builtins|dict)__\s*\[)" \
    "id:1001807,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Python dunder attribute chain (template object graph)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Jinja2 |attr("__class__") 过滤器绕过公开手法（1001103 仅覆盖
# {{...|attr( 包裹形态），本规则不限定界符，直接匹配 attr("__dunder__")
# 字符串取属性写法，正常业务代码几乎不会以字符串取 dunder 属性。
SecRule ARGS|REQUEST_BODY "@rx \battr\s*\(\s*[\"']__\w{2,30}__[\"']\s*\)" \
    "id:1001808,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'attr() access to dunder attribute',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Mako（Python）<%! %> 模块级代码块（官方文档，模板渲染时直接执行
# Python 语句），1001114 仅覆盖 ${...} 内调用；<%! import os %> 等形态
# 即 SSTI 即 RCE。
SecRule ARGS|REQUEST_BODY "@rx <%![^%]{0,200}(?:import\s+os|__import__|subprocess|eval\s*\()" \
    "id:1001809,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Mako <%! %> module-level code block',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- Twig ------------------------------------------------------------------------
# 来源：Twig（PHP）公开利用 {{["id"]|filter("system")}}，filter/map/sort/
# reduce 过滤器接受字符串回调名从而执行任意 PHP 函数（Symfony 公开研究）；
# 1001104 仅覆盖 _self.env/registerUndefinedFilterCallback。
SecRule ARGS|REQUEST_BODY "@rx \|\s*(?:filter|map|sort|reduce)\s*\(\s*[\"'](?:system|exec|passthru|shell_exec|popen|proc_open|phpinfo|assert)[\"']\s*\)" \
    "id:1001810,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Twig string-callable filter RCE',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- ERB / Groovy / 通用反射链 ------------------------------------------------------
# 来源：ERB/eRuby（Ruby）SSTI 公开利用，<%= 内 eval/instance_eval/send 等
# 动态求值（1001111 已覆盖 system/exec/IO.popen/Kernel/反引号/%x，
# 未覆盖 eval 系）。
SecRule ARGS|REQUEST_BODY "@rx <%[=\x2d]?[^%]{0,200}\b(?:eval|instance_eval|public_send|send)\s*\(" \
    "id:1001811,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'ERB eval/send code execution',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Groovy 模板（GString/GRails）公开利用 ${"id".execute()}，字符串
# 字面量直接点调 execute()/getText()；属 Groovy 特有写法，ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx [\"']\s*\.\s*(?:execute|getText)\s*\(" \
    "id:1001812,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Groovy quoted string execute()/getText()',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Java 反射链 .getClass().forName(...) 为 Velocity/EL/SpEL SSTI 的
# 公共载荷写法（如 $e.getClass().forName("java.lang.Runtime")），
# 正常业务代码惯用 Class.forName 而非实例取类再 forName；1000615 仅覆盖
# 裸 Class.forName(/getRuntime 关键字，未覆盖该链式写法。
SecRule ARGS|REQUEST_BODY "@rx \.getClass\s*\(\s*\)\s*\.forName\s*\(" \
    "id:1001813,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Java getClass().forName() reflection chain',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Jakarta/JSF 统一表达式语言（EL）隐式对象（facesContext/pageContext/
# servletContext 等，官方规范），1001113 已覆盖 #{...} 形态，本规则补充
# ${...} 形态（Spring/JSP 配置文本偶有出现，ERROR 计分）。
SecRule ARGS|REQUEST_BODY "@rx \$\{\s*(?:facesContext|pageContext|servletContext|applicationScope|sessionScope|externalContext|view)\." \
    "id:1001814,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'EL injection implicit object access (${...})',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- 通用探针形态补充 -----------------------------------------------------------------
# 来源：OWASP SSTI 检测方法学的算术求值探针，1001101 已覆盖 {{/${/#{/<%=
# 四种定界符；本规则补充 Thymeleaf 选择器 *{7*7} 与 ERB/Twig 打印块
# {%= 7*7 %} 两种未覆盖形态（纯数字算术在业务输入中几乎无正常用途）。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?:\*\{|\{%=)\s*\d{1,6}\s*[*/+\x2d]\s*\d{1,6}\s*(?:\}|%\})" \
    "id:1001815,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'SSTI probe alternate delimiters (*{...}/{%= ...%})',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：字符串乘法探针（如 ${7*'7'} 在 Freemarker/EL 下求值为 "7777777"，
# 用于区分引擎，PayloadsAllTheThings 公开字典）；{{7*'7'}} 与 #{7*'7'}
# 已由 CRS 934200 覆盖，此处只补 ${...} 与 *{...} 形态。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?:\$\{|\*\{)\s*\d{1,4}\s*\*\s*[\"']\d{1,4}[\"']\s*\}" \
    "id:1001816,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'SSTI string-multiplication probe (${...}/*{...})',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-injection-generic',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

