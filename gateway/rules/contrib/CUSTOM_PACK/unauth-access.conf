# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 未授权访问 / 信息泄露 / 拖库检测规则
#
# 来源：阶段8 规则量扩展任务（BAS 入侵攻击模拟测试报告覆盖基线补全）。
#       全部规则由本团队依据公开漏洞知识（H2/Docker/Zabbix/CouchDB/Kibana
#       等组件官方文档中的管理与调试端点、MySQL/PostgreSQL/SQL Server
#       公开拖库利用方式、国内开源 CMS 默认后台路径等公开资料）自行编写，
#       未复制任何第三方 WAF 产品的规则、文案或结构。
#
# 规则 ID 段：1001901-1001959。
# 评分策略：本包全部为 OBSERVE 级计分（ERROR(4)/WARNING(3) 叠加），
#   不单条 CRITICAL 阻断——未授权访问路径在部分业务中可能是正常路径，
#   拖库弱特征亦可能出现在正常文本中，仅靠单条命中不直接阻断，
#   由叠加计分与运营研判处置。
#
# 去重说明（以下特征本库既有规则已覆盖，本包不再重复检测）：
#   - /.git/ /.svn/ /.env：sensitive-exposure.conf（1000501/1000502/1000506）
#   - /actuator 及 env/heapdump/configprops 端点：sensitive-exposure.conf
#     （1000516）与 cloud-abuse.conf（1000320/1000321）
#   - /swagger /v2/api-docs：cloud-abuse.conf（1000324/1000325，INFO 级）
#   - /druid/（含 *.json）：cve-emergency.conf（1000025/1000026）
#     与 cve-recent.conf（1000830）
#   - /jolokia：cloud-abuse.conf（1000320）与 oss-webapps-cve.conf
#   - /WEB-INF/web.xml：scanner-fingerprints.conf（1000226）
#   - Docker /containers/json、ES /_cat/_nodes/_cluster、/solr/admin：
#     cloud-abuse.conf（1000316/1000318）与 cve-recent.conf（1000817）、
#     sensitive-exposure.conf（1000520）
#   - INTO OUTFILE/DUMPFILE、load_file()、xp_dirtree/xp_fileexist：
#     CRS 942190 与 attack-variants-evasion.conf（1001260）
#   - /console /phpmyadmin 等通用后台路径：sensitive-exposure.conf（1000519）
# =============================================================================


# -- 未授权管理面与配置泄露 --------------------------------------------------------
# 来源：H2 Database 控制台默认路径 /h2-console（官方文档），未授权暴露可经
# JDBC URL 配置造成 RCE（公开利用方式），路径特征性强，ERROR 计分。
SecRule REQUEST_URI "@rx ^/h2-console(?:/|\?|$)" \
    "id:1001901,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'H2 database console unauthorized access probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Tomcat tomcat-users.xml、Resin resin-users/users.xml 等容器用户
# 凭据文件（各组件官方文档默认文件名），Web 可直接访问即凭据泄露。
SecRule REQUEST_URI "@rx /(?:users\.xml|tomcat-users\.xml|resin-users\.xml|realm\.xml)(?:\?|$)" \
    "id:1001902,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Container user credentials file probe (users.xml)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Java META-INF 下 MANIFEST.MF/context.xml/persistence.xml（Java EE
# 规范固定文件名），persistence.xml 常含数据库连接口令，属弱特征 WARNING。
SecRule REQUEST_URI "@rx /META-INF/(?:MANIFEST\.MF|context\.xml|persistence\.xml)(?:\?|$)" \
    "id:1001903,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Java META-INF config file probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：Git 仓库元信息文件 .gitignore/.gitattributes/.gitmodules（Git 官方
# 文档文件名）。sensitive-exposure 1000501 仅覆盖 /.git/ 目录，裸文件名
# 不匹配该规则，此处单独覆盖，WARNING 计分。
SecRule REQUEST_URI "@rx /(?:\.gitignore|\.gitattributes|\.gitmodules|\.mailmap)(?:\?|$)" \
    "id:1001904,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Git metadata file probe (.gitignore/.gitattributes)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-disclosure',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -- 中间件未授权访问 ----------------------------------------------------------------
# 来源：Docker Remote API 官方端点 /version 与 /info（2375 未授权暴露语义）。
# cloud-abuse 1000316 已覆盖 /containers/json 等，此处补齐 /version、/info，
# 锚定精确路径减少误报，WARNING 计分。
SecRule REQUEST_URI "@rx ^/(?:v1\.\d{1,2}/)?(?:version|info)(?:\?|$)" \
    "id:1001905,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Docker Remote API version/info probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
