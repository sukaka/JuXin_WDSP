# 来源：PostgreSQL COPY ... TO '/path' 写文件拖库与 COPY ... TO PROGRAM
# 命令执行（官方文档语法），ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx \bcopy\s+(?:\([^)]{1,300}\)|[\w.]{1,80})\s+to\s+(?:program\b|'/)" \
    "id:1001916,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
