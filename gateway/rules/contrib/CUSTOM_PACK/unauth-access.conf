# 来源：SQL Server 经典拖库链 xp_cmdshell 调用 bcp 导出数据（queryout/out
# 写文件，Microsoft 官方文档命令格式）。CRS 942190 仅覆盖 exec..xp_cmdshell
# 形式，本规则检测 xp_cmdshell 与 bcp 导出近距离共现的组合特征，ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx \bxp_cmdshell\b[\s\S]{0,300}?\bbcp\b[\s\S]{0,160}?\b(?:queryout|out)\b" \
    "id:1001913,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'MSSQL xp_cmdshell + bcp data exfiltration chain',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：bcp 工具独立导出形态 bcp <表|带引号查询> (queryout|out|format) <文件>
# （Microsoft 官方文档），弱特征 WARNING。
SecRule ARGS|REQUEST_BODY "@rx \bbcp\b\s+(?:\"[^\"]{1,150}\"|'[^']{1,150}'|\S{1,150})\s+(?:queryout|out|format)(?:\s|$)" \
    "id:1001914,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'MSSQL bcp bulk export utility in request',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：MySQL LOAD DATA [LOCAL] INFILE 读取服务器/客户端文件（官方文档
