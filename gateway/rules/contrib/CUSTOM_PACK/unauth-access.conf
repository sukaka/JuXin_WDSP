SecRule ARGS|REQUEST_BODY "@rx \bload\s+data\s+(?:local\s+)?infile\b" \
    "id:1001915,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
