# -- 拖库 / 脱库特征（请求体与参数） ----------------------------------------------------
# 来源：mysqldump 官方工具拖库标志（--all-databases/-A/--single-transaction/
# --lock-all-tables/--master-data/--hex-blob 等，MySQL 官方文档），出现在
# Web 请求中即命令注入拖库特征，ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx \bmysqldump[\s\S]{0,170}?(?:--(?:all-databases|single-transaction|lock-all-tables|master-data|hex-blob|dump-slave|add-drop-database)\b|\s-a(?:\s|$))" \
    "id:1001910,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'mysqldump exfiltration flags in request',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：pg_dump/pg_dumpall 官方工具拖库标志（--format=/--file=/--clean/
# --schema-only/--data-only，PostgreSQL 官方文档），弱特征 WARNING。
SecRule ARGS|REQUEST_BODY "@rx \bpg_dump(?:all)?\s+.{0,120}?(?:--format=|--file=|--clean\b|--schema-only\b|--data-only\b)" \
    "id:1001911,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'pg_dump exfiltration flags in request',\
