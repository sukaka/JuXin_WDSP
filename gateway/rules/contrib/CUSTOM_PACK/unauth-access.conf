# 来源：大批量拖库弱特征——select * from <表> 后无 WHERE 直接结束
# （分号/注释/串尾）。正常业务参数极少出现完整 SQL 语句，WARNING 计分。
SecRule ARGS|REQUEST_BODY "@rx \bselect\s+\*\s+from\s+[a-z_][\w$#]{0,63}\s*(?:;|--\s|#|/\*|$)" \
    "id:1001919,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Bulk select without WHERE clause (weak dump pattern)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-sqli',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


