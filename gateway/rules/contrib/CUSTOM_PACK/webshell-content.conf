# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— WebShell 文件内容特征检测（跨语言）
#
# 来源：阶段8 规则量扩展任务 —— BAS 入侵攻击模拟测试（4553 条用例）防护覆盖
#       基线的差距补齐。webshell.conf / webshell-obfuscation.conf 以 PHP 与
#       加密流量为主，本文件补齐 JSP/Java、ASP/VBScript、ASPX/ASHX、CFM、
#       PERL/CGI、Python、SH 及跨语言一句话木马的文件内容特征。全部规则由
#       本团队依据公开的 WebShell 样本与利用代码分析（Tomcat 内存马、
#       CreateObject 马、Process.Start 马、CGI 反弹 shell 等公开特征）
#       自行编写，未复制任何第三方 WAF 产品的规则、文案或结构。
#
# 规则 ID 段：1001401-1001459（本文件使用 1001401-1001430）。
#
# 匹配目标说明：Coraza 中 multipart/form-data 上传的文件内容不落入
#       REQUEST_BODY（FILES 集合仅保存文件名），故本包以 ARGS|REQUEST_BODY
#       为目标，覆盖表单字段提交、urlencoded 及经 CRS 901340 强制解码的
#       RAW 请求体场景；变换统一带 t:urlDecodeUni（宽字符 %uXXXX）与
#       t:htmlEntityDecode（HTML 实体伪装），正则按 t:lowercase 后的小写
#       形态编写。
#
# 评分与阻断策略同 webshell.conf 头部说明：
#   CRITICAL(5) 单条即达阻断阈值；ERROR(4) 弱特征叠加。
# =============================================================================


# -- JSP / Java 命令执行与内存马 ---------------------------------------------------
# 来源：JSP 命令马公开样本中 Runtime.getRuntime().exec 常夹带空格/换行规避
# 字面匹配（1000124 仅覆盖 exec(request.getParameter 紧邻写法），本条覆盖
# <% %> 脚本片段内的空格变体。
SecRule ARGS|REQUEST_BODY "@rx <%[\s\S]{0,300}?runtime\s*\.\s*getruntime\s*\(\s*\)\s*\.\s*exec\s*\(" \
    "id:1001401,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'JSP Runtime exec with whitespace variant in scriptlet',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-java',\
    tag:'webshell/content',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：JSP 命令马以命令字面量直接构造 ProcessBuilder（cmd.exe//bin/sh），
# 与 1000125（ProcessBuilder+request.getParameter 组合）互补。
SecRule ARGS|REQUEST_BODY "@rx new\s+processbuilder\s*\([^)]{0,120}?(?:cmd(?:\.exe)?|/bin/(?:ba)?sh|powershell)" \
    "id:1001402,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'JSP ProcessBuilder with shell command literal',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-java',\
    tag:'webshell/content',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

