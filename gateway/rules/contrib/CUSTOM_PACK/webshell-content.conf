    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Perl 反弹/命令马 system("/bin/sh")、exec("/bin/bash") 直接以 shell
# 为执行目标。
SecRule ARGS|REQUEST_BODY "@rx (?:system|exec)\s*\(\s*[\"']\s*(?:/bin/(?:ba)?sh|cmd(?:\.exe)?)" \
    "id:1001423,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'Perl system/exec invoking shell binary',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'webshell/content',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Perl CGI 马将表单参数直接送入 system/exec（param("...") 出现在
# 命令执行调用内），弱特征 ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx (?:system|exec)\s*\([^)]{0,100}?param\s*\(\s*[\"']" \
    "id:1001424,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'Perl system/exec bound to CGI param',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'webshell/content',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- Python Web 一句话/命令马 --------------------------------------------------------------
# 来源：Python Web 一句话（Flask/Django 公开样本）：os.system/os.popen 直接
# 执行请求参数（1001243 覆盖裸 os.system( 命令注入形态，本条为绑定
# request 对象的文件内容形态）。
SecRule ARGS|REQUEST_BODY "@rx os\s*\.\s*(?:system|popen)\s*\(\s*request\s*\.\s*(?:args|form|values|data|cookies|headers|get|post)" \
    "id:1001425,\
