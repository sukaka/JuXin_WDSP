# -- SH 反弹 shell 后门 --------------------------------------------------------------------
# 来源：SH 反弹 shell 后门公开写法：nc/ncat -e /bin/sh 或 socat EXEC:/bin/sh
# （attack-variants-evasion 1001227 覆盖 /dev/tcp 与花括号形态，本条覆盖
# 工具管道形态）。
SecRule ARGS|REQUEST_BODY "@rx (?:\b(?:nc|ncat|netcat)\s+[\w.\x2d-][^\n;]{0,60}?-e\s+[\"']?/bin/(?:ba)?sh|socat\s+[^\n]{0,80}?exec:\s*/bin/(?:ba)?sh)" \
    "id:1001428,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'SH reverse shell nc/socat pipe to /bin/sh',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'webshell/content',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- 跨语言一句话木马 ----------------------------------------------------------------------
# 来源：跨语言一句话通用形态：eval 直接作用于请求对象（Node req.body/query、
# ASPX Request[、ASP Request.Form 等公开一句话写法）。
SecRule ARGS|REQUEST_BODY "@rx eval\s*\(\s*(?:req\s*\.\s*(?:body|query|params)|request\s*\.\s*(?:form|querystring)|request\s*\[)" \
    "id:1001429,\
