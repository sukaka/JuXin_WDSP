    "id:1001010,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'OpenSSL/AES decrypt patterns typical of encrypted webshells',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/encrypted',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.2.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

SecRule ARGS|REQUEST_BODY "@rx (?:openssl_decrypt\s*\([^)]{0,80}base64_decode|base64_decode\s*\([^)]{0,40}openssl_decrypt)" \
    "id:1001011,\
