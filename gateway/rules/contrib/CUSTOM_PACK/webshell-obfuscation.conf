# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— 加密 / 混淆 / 变种 WebShell 检测
#
# 来源：依据公开 WebShell 样本分析结论（China Chopper/蚁剑/冰蝎/哥斯拉及
#       各类编码混淆写法）自行归纳特征，未复制任何第三方 WAF 产品规则。
#
# 规则 ID 段：1001000-1001099。
# 说明：强加密流量（随机二进制 body）难以单靠特征 100% 检出；本包覆盖
#       常见编码链、动态调用、密钥参数与工具协议痕迹，配合行为/CC 更有效。
#
# 注意 Coraza v3.7 变量语义：FILES 为上传文件名集合，FILES_NAMES 为上传
# 表单字段名集合；文件名类检测须以 FILES 为目标（与 CRS 933110/944140/932180 一致）。
# =============================================================================


# -- 多层编码 / 压缩混淆链 --------------------------------------------------------
SecRule ARGS|REQUEST_BODY "@rx (?:eval|assert|system|passthru|shell_exec|create_function)\s*\(\s*(?:base64_decode|gzinflate|gzuncompress|str_rot13|rawurldecode|urldecode|hex2bin)\s*\(" \
    "id:1001001,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'WebShell eval chain with decode function',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'webshell/obfuscated',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.2.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule ARGS|REQUEST_BODY "@rx (?:base64_decode\s*\(\s*gzinflate|gzinflate\s*\(\s*base64_decode|str_rot13\s*\(\s*base64_decode|gzuncompress\s*\(\s*base64_decode)" \
    "id:1001002,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Classic double-encode webshell packer chain',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'webshell/obfuscated',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.2.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule ARGS|REQUEST_BODY "@rx (?:gzinflate\s*\(\s*str_rot13\s*\(\s*base64_decode|base64_decode\s*\(\s*str_rot13\s*\(\s*gzinflate)" \
    "id:1001003,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Triple packer chain rot13/base64/gzinflate',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'webshell/obfuscated',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.2.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule ARGS|REQUEST_BODY "@rx (?:\\\\x[0-9a-f]{2}){12,}" \
    "id:1001004,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Long hex-escaped string (obfuscated shell payload)',\
    logdata:'Matched Data: long hex escape sequence',\
    tag:'webshell/obfuscated',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.2.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

SecRule ARGS|REQUEST_BODY "@rx (?:chr\s*\(\s*\d+\s*\)\s*\.){8,}" \
    "id:1001005,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'chr() concatenation obfuscation chain',\
    logdata:'Matched Data: repeated chr() concat',\
    tag:'webshell/obfuscated',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.2.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


