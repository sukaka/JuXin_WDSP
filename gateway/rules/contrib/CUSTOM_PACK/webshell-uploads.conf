# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— WebShell 上传通道检测规则
#
# 来源：阶段8 BAS 入侵攻击模拟差距分析分片（上传通道专项）。全部规则由本团队
#       依据公开漏洞知识（Unrestricted File Upload 利用、双扩展名/%00 截断/
#       图片马/压缩包投递/multipart 解析差异等公开技术资料）自行编写，
#       未复制任何第三方 WAF 产品的规则、文案或结构。
#
# 覆盖缺口（相对 OWASP CRS 4.28.0 与已有自建包）：
#   1. CRS 933110/944140（PL1）仅覆盖 php 系与 .jsp/.jspx 扩展名，CRS 932180
#      的 restricted-upload.data 只含敏感配置文件/dotfile；asp/aspx/ashx/asmx/
#      asa/cer/cdx、jspf/jsw/jspa/jhtml、shtml、war/jar 等可执行扩展名在
#      文件名与 X-Filename 头层面均无 PL1 覆盖（真实缺口）。
#      注意 Coraza v3.7 变量语义：FILES 为上传文件名集合（非文件内容），
#      FILES_NAMES 为上传表单字段名，故文件名类检测以 FILES 为目标
#      （与 CRS 933110/944140/932180 的变量选择一致）。
#   2. 双扩展名：文件名层面已有自建 1000119/1000120/1001289 覆盖，
#      本包只补 X-Filename 系列头层面（CRS 933111 为 PL3，PL1 不生效）。
#   3. CRS 922 multipart 检测基于 MULTIPART_PART_HEADERS 变量（Coraza v3.7
#      已填充该集合，part 头逐条 "Key: Value"），但其覆盖限于 part
#      Content-Type charset/_charset_/Content-Transfer-Encoding/头名非法
#      字符；boundary 缺失/重复/超长/异常/空值、Content-Disposition 形态
#      异常（双 filename/无参数/无引号）、part 声明脚本 MIME 等形态无覆盖，
#      本包补齐。文件内容（图片马魔数/压缩包内容）在 Coraza v3.7 无可用
#      变量（FILES_TMP_CONTENT 未实现），本包内容类规则覆盖 REQUEST_BODY
#      可达通道（urlencoded/raw 提交），multipart 内容形态待引擎实现后受益。
#
# 规则 ID 段：1001301-1001359（当前使用 1001301-1001326）。
# 评分与阻断策略同 webshell.conf 头部说明：
#   CRITICAL(5) 单条即达阻断阈值；ERROR(4)/WARNING(3) 弱特征叠加。
# =============================================================================


# -- 危险可执行扩展名上传 ------------------------------------------------------------
# 来源：上传 jspf/jsw/jspa/jhtml（JSP 家族冷门后缀）、asmx/cdx（ASP 家族）、
# shtml/shtm/stm（SSI 可执行）、war/jar（Java 部署包）可直接落地执行或部署
# WebShell。FILES（上传文件名）层面 1001289 未覆盖该扩展名集合，本条补齐。
SecRule FILES|ARGS:filename|ARGS:file "@rx \.(?:jspf|jsw|jspa|jhtml|asmx|cdx|shtml|shtm|stm|war|jar)$" \
    "id:1001301,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,t:removeWhitespace,\
    msg:'Executable extension upload (jspf/asmx/shtml/war/jar)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：部分 AJAX 上传组件以非标准头 X-Filename/X_File_Name/X.Filename/X-File-Name
# 传递文件名（CRS 933110/944140 同样检测这些头，但仅覆盖 php 系与 jsp/jspx）。
# 本条补齐头层面其余可执行扩展名（asp 家族/jsp 冷门后缀/shtml/war/jar）。
SecRule REQUEST_HEADERS:X-Filename|REQUEST_HEADERS:X_Filename|REQUEST_HEADERS:X.Filename|REQUEST_HEADERS:X-File-Name "@rx \.(?:jspf|jsw|jspa|jhtml|asp|aspx|ashx|asmx|asa|cer|cdx|shtml|shtm|stm|war|jar)\.*$" \
    "id:1001302,\
    phase:1,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,t:removeWhitespace,\
    msg:'Executable extension in X-Filename header',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：X-Filename 头层面双扩展名伪装（evil.jpg.aspx 图片在前）。头层面
# CRS 仅 933110/944140 按结尾扩展名检测，中间夹图片扩展名的形态无覆盖；
# php 系与 jsp/jspx 结尾已被 933110/944140 覆盖，本条集合不含二者。
SecRule REQUEST_HEADERS:X-Filename|REQUEST_HEADERS:X_Filename|REQUEST_HEADERS:X.Filename|REQUEST_HEADERS:X-File-Name "@rx \.(?:jpg|jpeg|png|gif|bmp)\.(?:jspf|jsw|jspa|jhtml|asp|aspx|ashx|asmx|asa|cer|cdx|shtml|war|jar)\.*$" \
    "id:1001303,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Double extension in X-Filename header (image first)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：X-Filename 头层面双扩展名伪装（evil.jsp.png 脚本在前）。php 系脚本在前
# 的头层面形态由 CRS 933111（PL3）覆盖，本条集合不含 php 系避免层间重叠。
SecRule REQUEST_HEADERS:X-Filename|REQUEST_HEADERS:X_Filename|REQUEST_HEADERS:X.Filename|REQUEST_HEADERS:X-File-Name "@rx \.(?:jsp|jspx|jspf|jsw|jspa|jhtml|asp|aspx|ashx|asmx|asa|cer|cdx|shtml|war|jar)\.(?:jpg|jpeg|png|gif|bmp|txt|pdf)$" \
    "id:1001304,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Double extension in X-Filename header (script first)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- 文件名 %00 截断 ------------------------------------------------------------------
# 来源：evil.php%00.jpg 空字节截断（早期 PHP/Java 组件按 C 字符串处理文件名，
# NUL 之后内容被丢弃，实际保存为 evil.php）。multipart 文件名不做 URL 解码，
# 本条经 urlDecodeUni 变换后匹配真实 NUL 字节。
SecRule FILES|ARGS:filename|ARGS:file|REQUEST_HEADERS:X-Filename|REQUEST_HEADERS:X_Filename|REQUEST_HEADERS:X.Filename|REQUEST_HEADERS:X-File-Name "@rx \.(?:php\d?|phtml|phar|pht|jsp|jspx|jspf|asp|aspx|ashx|asmx|asa|cer|shtml|war|jar)\x00\." \
    "id:1001305,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Null byte truncation in upload filename',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：%2500 双重编码截断（evil.php%2500.jpg，经两层解码后还原为 %00）。
# 与 1001305 区分：本条不做 URL 解码，只匹配字面双重编码形态。
SecRule FILES|ARGS:filename|ARGS:file|REQUEST_HEADERS:X-Filename|REQUEST_HEADERS:X_Filename|REQUEST_HEADERS:X.Filename|REQUEST_HEADERS:X-File-Name "@rx \.(?:php\d?|phtml|phar|jsp|jspx|asp|aspx|ashx|asmx|shtml|war|jar)%2500\." \
    "id:1001306,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Double-encoded null byte truncation in upload filename',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- 图片马（文件内容魔数后紧跟脚本标签） -------------------------------------------------
# 来源：GIF89a 图片马（魔数后紧跟 <?php/<?=/<% 脚本标签），配合解析漏洞或
# 文件包含执行。变换不可用 lowercase（会破坏二进制魔数），PHP 标签大小写
# 形态在正则内枚举。引擎可达性说明：Coraza v3.7 无变量持有 multipart 文件
# 内容（FILES_TMP_CONTENT 未实现，FILES 为文件名而非内容），故本条覆盖
# REQUEST_BODY 可达通道（urlencoded/raw 直接提交图片马，如编辑器/WebDAV
# 写入接口），multipart 内容形态依赖引擎后续实现后自动受益。
SecRule REQUEST_BODY "@rx GIF8[79]a[\s\S]{0,1000}?(?:<\?[Pp][Hh][Pp]|<\?=|<%)" \
    "id:1001307,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'GIF image with embedded script tag (image webshell)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：PNG 魔数（\x89PNG\x0d\x0a\x1a\x0a）后紧跟脚本标签的图片马。
# 引擎说明：Coraza v3.7 对模式中含非 UTF-8 字节转义（如 \x89）的 @rx 自动
# 启用 binaryregexp 按字节匹配（operators/rx.go matchesArbitraryBytes 机制），
# 故直接按原始字节书写魔数。
SecRule REQUEST_BODY "@rx \x89PNG\x0d\x0a\x1a\x0a[\s\S]{0,1000}?(?:<\?[Pp][Hh][Pp]|<\?=|<%)" \
    "id:1001308,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'PNG image with embedded script tag (image webshell)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：JPEG 魔数（\xff\xd8\xff，binaryregexp 按字节匹配，见 1001308 注释）
# 后紧跟脚本标签的图片马。
SecRule REQUEST_BODY "@rx \xff\xd8\xff[\s\S]{0,1000}?(?:<\?[Pp][Hh][Pp]|<\?=|<%)" \
    "id:1001309,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'JPEG image with embedded script tag (image webshell)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：图片魔数（GIF/PNG/JPEG/BMP）后紧跟 <script> 标签的 polyglot 文件，
# 用于存储型 XSS 或配合内容嗅探绕过。弱特征，ERROR 计分叠加。
SecRule REQUEST_BODY "@rx (?:GIF8[79]a|\x89PNG\x0d\x0a\x1a\x0a|\xff\xd8\xff|BM)[\s\S]{0,1000}?<[Ss][Cc][Rr][Ii][Pp][Tt]" \
    "id:1001310,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Image magic bytes with embedded script tag (polyglot)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- 压缩包投递 WebShell ----------------------------------------------------------------
# 来源：evil.php.gz 形态（脚本扩展名+压缩扩展名双尾），gzip/bzip2/7z/tar/xz/zst
# 系列；zip/rar 双尾已由 1000119 覆盖，本条集合不含 zip/rar 避免重复。
SecRule FILES|ARGS:filename|ARGS:file|REQUEST_HEADERS:X-Filename|REQUEST_HEADERS:X_Filename|REQUEST_HEADERS:X.Filename|REQUEST_HEADERS:X-File-Name "@rx \.(?:php\d?|phtml|phar|pht|jsp|jspx|jspf|asp|aspx|ashx|asmx|asa|cer|shtml|war|jar)\.(?:gz|bz2|7z|tar|xz|zst|lz4?)$" \
    "id:1001311,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Script filename inside archive double extension',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：zip 本地文件头（PK\x03\x04，固定头 30 字节）后文件名区域明文出现
# 脚本扩展名，即压缩包内投递 WebShell。合法业务（如插件包）可能含脚本文件，
# 属弱特征，ERROR 计分叠加。
SecRule REQUEST_BODY "@rx PK\x03\x04[\s\S]{26}[\w./\x2d\x5c]{1,150}?\.(?:php\d?|phtml|phar|jsp|jspx|jspf|asp|aspx|ashx|asmx|asa|cer|shtml)" \
    "id:1001312,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Script filename inside uploaded ZIP archive',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：RAR 魔数（Rar!\x1a\x07）后窗口内出现脚本扩展名（RAR 文件名明文存储
# 但偏移不定，窗口较宽），弱特征 ERROR 计分。
SecRule REQUEST_BODY "@rx Rar!\x1a\x07[\s\S]{0,1000}?\.(?:php\d?|phtml|jsp|jspx|asp|aspx|ashx|asmx|shtml)" \
    "id:1001313,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Script filename inside uploaded RAR archive',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：gzip 头（\x1f\x8b\x08，固定 10 字节头，binaryregexp 按字节匹配，
# 见 1001308 注释）后 FNAME 字段明文为脚本扩展名（压缩前原始文件名，
# \x00 结尾），即压缩投递 WebShell，弱特征 ERROR 计分。
SecRule REQUEST_BODY "@rx \x1f\x8b\x08[\s\S]{7}[\w./\x2d\x5c]{1,150}?\.(?:php\d?|phtml|phar|jsp|jspx|asp|aspx|ashx|asmx|shtml|war|jar)\x00" \
    "id:1001314,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Script filename in gzip original-name field',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- multipart 反规避（boundary 形态查 Content-Type 头，part 形态查 MULTIPART_PART_HEADERS） ---
# 来源：multipart/form-data 缺少 boundary 参数（RFC 2046 必需），缺失时服务端
# 无法解析 part，常被用于走私混淆。链式规则：Content-Type 声明 multipart 但
# 不含 boundary= 参数。弱特征 ERROR 计分。
SecRule REQUEST_HEADERS:Content-Type "@rx ^multipart/form-data(?:\s*;|\s*$)" \
    "id:1001315,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Multipart form-data missing boundary parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    chain"
    SecRule REQUEST_HEADERS:Content-Type "!@rx [\s;]boundary\s*=" \
        "t:none,\
        setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：同一 Content-Type 头中重复出现 boundary 参数（解析器取前者或后者的
# 差异可绕过基于 boundary 的内容检查）。弱特征 ERROR 计分。
SecRule REQUEST_HEADERS:Content-Type "@rx boundary\s*=\s*[^;\r\n]+;[^\r\n]*boundary\s*=" \
    "id:1001316,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Duplicate boundary parameter in multipart Content-Type',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：boundary 超过 RFC 2046 规定的 70 字符上限（超长 boundary 可触发解析器
# 缓冲区差异或绕过按长度截断的检查）。弱特征 ERROR 计分。
SecRule REQUEST_HEADERS:Content-Type "@rx boundary\s*=\s*\"?[^\";\s]{71,}" \
    "id:1001317,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Multipart boundary exceeds RFC2046 70-char limit',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：boundary 值含 RFC 2046 bchars 之外的异常字符（! # $ % & @ ^ ~ 反斜杠），
# 用于触发解析器容错差异。弱特征 ERROR 计分。
SecRule REQUEST_HEADERS:Content-Type "@rx boundary\s*=\s*\"?[^\";\s\r\n]{0,69}[!#$%&@^~\x5c]" \
    "id:1001318,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Multipart boundary contains invalid characters',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：part 头中 filename 参数未加引号的脚本扩展名（filename=evil.php），
# 浏览器与主流库总是加引号，无引号 token 是解析器取值差异的利用点。
# 检测目标为 MULTIPART_PART_HEADERS（Coraza 已填充 part 头集合，
# 逐条 "Key: Value" 格式）。弱特征 ERROR 计分。
SecRule MULTIPART_PART_HEADERS "@rx ^content-disposition:[^\r\n]{0,300}filename=[^\"\s;][^\";\s]{0,150}?\.(?:php\d?|phtml|phar|jsp|jspx|jspf|asp|aspx|ashx|asmx|war|jar)(?:[;\s]|$)" \
    "id:1001319,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Unquoted filename with script extension in Content-Disposition',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：同一 Content-Disposition 行内重复 filename 参数（解析器取第一个或
# 最后一个的差异可使检查与实际落盘文件名不一致）。检测目标为
# MULTIPART_PART_HEADERS（part 头逐条 "Key: Value"，单条值内可观察整行）。
# 弱特征 ERROR 计分。
SecRule MULTIPART_PART_HEADERS "@rx ^content-disposition:[^\r\n]{0,600}filename=[^\r\n]{0,300}filename=" \
    "id:1001320,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Duplicate filename parameter in Content-Disposition',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：multipart part 直接声明可执行脚本 MIME 类型（application/x-httpd-php、
# text/x-jsp 等），服务端按 Content-Type 信任分发时可直接执行；正常文件上传
# 不会声明此类 MIME，强特征。检测目标为 MULTIPART_PART_HEADERS（CRS 922110
# 仅校验 part Content-Type 的 charset 参数，不覆盖脚本 MIME 主类型）。
SecRule MULTIPART_PART_HEADERS "@rx ^content-type:\s*(?:application/x-httpd-php|application/x-php|text/x-php|application/x-jsp|text/x-jsp|application/x-asp)" \
    "id:1001321,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Multipart part declares executable script MIME type',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：补充扩展名集合的点号/空格结尾伪装（shell.war.、shell.war␣），利用
# Windows/IIS 对尾随点与空格的容忍绕过扩展名黑名单；1001289 已覆盖其自身
# 扩展名集合的同类形态，本条集合与其不重叠。弱特征 ERROR 计分。
SecRule FILES|ARGS:filename|ARGS:file|REQUEST_HEADERS:X-Filename|REQUEST_HEADERS:X_Filename|REQUEST_HEADERS:X.Filename|REQUEST_HEADERS:X-File-Name "@rx \.(?:jspf|jsw|jspa|jhtml|asmx|cdx|shtml|shtm|stm|war|jar)[\s.]+$" \
    "id:1001322,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Executable extension with trailing dot/space bypass',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：part 的 Content-Disposition 文件名为脚本扩展名但 part Content-Type
# 伪装为 image/*（绕过仅按 MIME 类型校验的服务端检查）。正常业务不会以此
# 形态上传脚本文件，强特征。链式规则基于 MULTIPART_PART_HEADERS
# （part 头逐条 "Key: Value"，两条分别观察同一上传中的两类头）。
SecRule MULTIPART_PART_HEADERS "@rx ^content-disposition:[^\r\n]{0,300}filename=\"[^\"\r\n]{1,200}\.(?:php\d?|phtml|phar|jsp|jspx|jspf|asp|aspx|ashx|asmx|asa|cer|shtml|war|jar)\"" \
    "id:1001323,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Script filename with forged image Content-Type',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    chain"
    SecRule MULTIPART_PART_HEADERS "@rx ^content-type:\s*image/" \
        "t:none,t:lowercase,\
        setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：上传文件名含路径穿越（../../evil.jsp），配合脚本扩展名将 WebShell
# 写出上传目录（如 Tomcat 任意路径写）。覆盖 FILES（Coraza 中为上传文件
# 名集合）与 X-Filename 系列头两种通道。
SecRule FILES|REQUEST_HEADERS:X-Filename|REQUEST_HEADERS:X_Filename|REQUEST_HEADERS:X.Filename|REQUEST_HEADERS:X-File-Name "@rx \.\.[/\x5c][^\r\n]{0,150}\.(?:php\d?|phtml|jsp|jspx|asp|aspx|ashx|asmx|war|jar)" \
    "id:1001324,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Path traversal in upload filename',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：boundary 参数为空值（boundary= 或 boundary=""），解析器对空 boundary
# 的容错差异可绕过 part 切分检查。弱特征 ERROR 计分。
SecRule REQUEST_HEADERS:Content-Type "@rx boundary\s*=\s*(?:\"\"|;|$)" \
    "id:1001325,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Multipart boundary parameter is empty',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Content-Disposition: form-data 后不带任何参数（缺 name=），正常浏览器
# 提交的 part 必有 name，该形态用于触发解析器容错差异。检测目标为
# MULTIPART_PART_HEADERS（part 头逐条 "Key: Value"）。弱特征 ERROR 计分。
SecRule MULTIPART_PART_HEADERS "@rx ^content-disposition:\s*form-data\s*$" \
    "id:1001326,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Content-Disposition form-data without parameters',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'webshell/upload',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# ========================= END webshell-uploads.conf =========================
