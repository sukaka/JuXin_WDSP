    msg:'ASPX command shell pattern',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：知名 WebShell（WSO/c99/r57/b374k）的公开标志字符串。
SecRule ARGS|REQUEST_BODY|REQUEST_COOKIES "@rx (?:__wso|c99sh|r57sh|b374k|wso_version)" \
    "id:1000128,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Known WebShell marker (WSO/c99/r57/b374k)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- 配置文件上传绕过 --------------------------------------------------------------------------
# 来源：上传 .htaccess 修改目录解析配置（可将图片目录变为 PHP 可执行）。
SecRule FILES|ARGS:filename "@rx ^\.htaccess$" \
    "id:1000129,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'.htaccess upload attempt',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：.htaccess 内容中将普通扩展映射为 PHP 解析（AddType application/x-httpd-php）。
SecRule REQUEST_BODY "@rx AddType\s+application/x-httpd-php" \
    "id:1000130,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'htaccess PHP handler mapping upload',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：上传 .user.ini（PHP  per-directory 配置，auto_prepend_file 挂马）。
SecRule FILES|ARGS:filename "@rx ^\.user\.ini$" \
    "id:1000131,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'.user.ini upload attempt',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- 远程 Shell 拉取与脚本代码 ------------------------------------------------------------------
# 来源：参数值为指向脚本文件的 URL（远程包含/下载 WebShell）。
SecRule ARGS "@rx ^(?:https?|ftp|gopher)://[\w.\x2d-]+/[\w./\x2d-]*\.(?:php\d?|phtml|jsp|jspx|war|asp|aspx)(?:\?\S*)?$" \
    "id:1000132,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Remote WebShell URL in parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Perl/Python 反弹 shell 常见代码片段出现在请求体中（弱特征 WARNING）。
SecRule REQUEST_BODY "@rx (?:use\s+Socket|IO::Socket::INET|socket\.socket\(\s*socket\.AF_INET)" \
    "id:1000133,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Perl/Python reverse shell code in body',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rce',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：preg_replace 使用 /e 修饰符执行代码（PHP<=5.5 经典 WebShell 写法）。
SecRule ARGS|REQUEST_BODY "@rx preg_replace\s*\(\s*[\"'].{1,100}?/[a-z]*e[a-z]*[\"']" \
    "id:1000134,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'preg_replace /e code execution pattern',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

