# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— WebShell 通信与上传检测规则
#
# 来源：阶段8 规则量扩展任务 L3。全部规则由本团队依据公开的 WebShell
#       样本分析（China Chopper/蚁剑/哥斯拉/冰蝎等工具公开特征）
#       自行编写，未复制任何第三方 WAF 产品的规则、文案或结构。
#
# 规则 ID 段：1000100-1000199。
# 评分与阻断策略同 cve-emergency.conf 头部说明：
#   CRITICAL(5) 单条即达阻断阈值；ERROR(4)/WARNING(3) 弱特征叠加。
#
# 注意 Coraza v3.7 变量语义：FILES 为上传文件名集合，FILES_NAMES 为上传
# 表单字段名集合；文件名类检测须以 FILES 为目标（与 CRS 933110/944140/932180 一致）。
# =============================================================================


# -- 危险函数调用（POST 参数）-----------------------------------------------------
# 来源：WebShell 通用特征，eval/assert 直接执行超全局数组或解码后的输入。
SecRule ARGS|REQUEST_BODY "@rx \b(?:eval|assert)\s*\(\s*(?:\$_(?:post|get|request|cookie)|base64_decode|gzinflate|gzuncompress|str_rot13)" \
    "id:1000101,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'WebShell eval/assert on dynamic input',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：命令执行函数（system/exec/shell_exec/passthru/popen 等）出现在参数中，
# 为 WebShell 命令下发与反弹 shell 的常见写法。
SecRule ARGS|REQUEST_BODY "@rx \b(?:system|exec|shell_exec|passthru|popen|proc_open|pcntl_exec)\s*\(\s*(?:\$|\"|'|`)" \
    "id:1000102,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'PHP command execution function in request',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：回调函数滥用（call_user_func/create_function/array_map 等以超全局
# 数组为参数），常用于绕过 eval 关键词检测。
SecRule ARGS|REQUEST_BODY "@rx \b(?:call_user_func(?:_array)?|create_function|register_shutdown_function|register_tick_function|forward_static_call|array_map|array_filter|usort|uasort)\s*\(\s*\$_" \
    "id:1000103,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'PHP callback abuse with superglobal input',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：eval/assert 执行字符串字面量的弱特征（正常业务也可能出现讨论代码的
# 文本，故 WARNING 计分不直接阻断）。
SecRule ARGS "@rx \b(?:eval|assert)\s*\(\s*[\"']" \
    "id:1000104,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'PHP eval/assert on string literal',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：PHP 反引号命令执行弱特征（Markdown 文本可能误报，WARNING 计分）。
SecRule ARGS "@rx `[a-z0-9_./ \x2d-]{2,64}`" \
    "id:1000105,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'PHP backtick command execution pattern',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# -- PHP 伪协议读入 ------------------------------------------------------------------
# 来源：文件包含/文件写入型 WebShell 常用 php://input 读取原始请求体、
# php://filter 读取源码（任务要求覆盖"php://input 读入"特征）。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY|REQUEST_URI "@rx php://(?:input|filter)" \
    "id:1000106,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'PHP wrapper php://input or php://filter access',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：expect:// 伪协议可直接执行系统命令（PHP expect 扩展），无正常业务用途。
SecRule ARGS|REQUEST_BODY "@rx expect://" \
    "id:1000107,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'PHP expect:// wrapper command execution',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- China Chopper（中国菜刀）----------------------------------------------------------
# 来源：中国菜刀客户端特征，@eval(base64_decode(...)) 组合（任务要求覆盖）。
SecRule ARGS|REQUEST_BODY "@rx @eval\s*\(\s*base64_decode\s*\(" \
    "id:1000108,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'China Chopper @eval(base64_decode()) payload',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：菜刀/一句话木马经典写法 @eval($_POST[x]) 及 assert 变体。
SecRule ARGS|REQUEST_BODY "@rx (?:@eval|assert)\s*\(\s*\$_(?:post|request|get|cookie)\s*\[" \
    "id:1000109,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'One-line WebShell eval on superglobal',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：菜刀 payload 全 base64 编码时的固定前缀指纹，
# ZXZhbChiYXNlNjRfZGVjb2Rl 为字符串 eval(base64_decode 的 base64 编码前缀
# （已通过 base64 工具实际计算验证）。
SecRule ARGS|REQUEST_BODY "@rx ZXZhbChiYXNlNjRfZGVjb2Rl" \
    "id:1000110,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Base64 encoded eval(base64_decode()) fingerprint',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- 蚁剑（AntSword）--------------------------------------------------------------------
