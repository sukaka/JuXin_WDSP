    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：蚁剑/菜刀 payload 公共前导 @ini_set("display_errors","0")，
# 用于关闭错误回显，正常业务参数几乎不会出现。
SecRule ARGS|REQUEST_BODY "@rx @ini_set\s*\(\s*[\"']display_errors[\"']\s*,\s*[\"']0" \
    "id:1000112,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'WebShell payload prelude @ini_set display_errors',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：蚁剑/菜刀 payload 公共前导 @set_time_limit(0)，解除执行时间限制。
SecRule ARGS|REQUEST_BODY "@rx @set_time_limit\s*\(\s*0\s*\)" \
    "id:1000113,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'WebShell payload prelude @set_time_limit(0)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- 哥斯拉（Godzilla）--------------------------------------------------------------------
# 来源：哥斯拉 JSP Shell 公开模板的标志类 class U extends ClassLoader
# （动态加载 AES 加密字节码的内部类）。
SecRule REQUEST_BODY "@rx class\s+U\s+extends\s+ClassLoader" \
    "id:1000114,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Godzilla JSP shell classloader template',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-java',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：哥斯拉密钥交换/AES 通信特征，SecretKeySpec 与 Cipher.getInstance("AES")
# 在请求体中近距离共现（Java 加密 shell 模板）。
SecRule REQUEST_BODY "@rx SecretKeySpec[\s\S]{0,300}Cipher\.getInstance\(\s*\"AES" \
    "id:1000115,\
    phase:2,\
    block,\
    capture,\
    t:none,\
    msg:'Godzilla AES key exchange pattern in body',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-java',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- 冰蝎（Behinder）----------------------------------------------------------------------
# 来源：冰蝎早期版本默认 Java 原生 User-Agent（公开分析报告），
# 正常浏览器不会以 Java/1.x 为 UA；属弱特征，WARNING 计分。
SecRule REQUEST_HEADERS:User-Agent "@rx ^Java/1\.[0-9._]+$" \
    "id:1000116,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Behinder default Java user agent',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：冰蝎默认 Accept 头特征（text/html,image/gif,image/jpeg,*; q=.2,*/*; q=.2，
# 逗号后带空格且 q=.2 为其固定写法，公开流量分析报告），WARNING 计分。
SecRule REQUEST_HEADERS:Accept "@rx \*;\s?q=\.2" \
    "id:1000117,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Behinder default Accept header fingerprint',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score=+%{tx.warning_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# 来源：动态函数名调用 $func($_POST[...])（WebShell 变形常用绕过写法）。
SecRule ARGS|REQUEST_BODY "@rx \$_(?:get|post|request|cookie)\s*\[[^\]]{1,64}\]\s*\(\s*\$_" \
    "id:1000118,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Dynamic function call on superglobal input',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# -- 双扩展名与解析绕过上传 -----------------------------------------------------------------
# 来源：上传绕过常见双扩展名（shell.php.jpg），任务要求覆盖 .jsp/.php 双扩展名。
SecRule FILES|ARGS:filename "@rx \.(?:php\d?|phtml|phar|jsp|jspx|asp|aspx|asa|cer|cdx|ashx|asmx|war)\.(?:jpg|jpeg|png|gif|bmp|txt|pdf|docx?|xlsx?|zip|rar)$" \
    "id:1000119,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'WebShell double extension upload (script first)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：双扩展名反向形态（image.jpg.php），利用中间件解析差异执行脚本。
SecRule FILES|ARGS:filename "@rx \.(?:jpg|jpeg|png|gif|bmp)\.(?:php\d?|phtml|phar|jsp|jspx|asp|aspx|war)$" \
    "id:1000120,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'WebShell double extension upload (image first)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：文件名末尾点号绕过（shell.php.），Windows/IIS 解析差异利用。
SecRule FILES|ARGS:filename "@rx \.(?:php\d?|phtml|jsp|jspx|asp|aspx)\.$" \
    "id:1000121,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Script filename with trailing dot bypass',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# -- 上传内容中的 WebShell 代码 --------------------------------------------------------------
