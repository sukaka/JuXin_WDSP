SecRule REQUEST_HEADERS:User-Agent "@rx antsword" \
    "id:1000111,\
    phase:1,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'AntSword WebShell client user agent',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
