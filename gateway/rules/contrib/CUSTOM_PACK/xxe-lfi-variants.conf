# =============================================================================
# 九章自建规则包（CUSTOM_PACK）— XXE 与文件包含/目录穿越变种检测规则
#
# 来源：阶段8 规则量扩展任务 XXE/LFI 分片。全部规则由本团队依据公开漏洞
#       知识（OWASP XXE Prevention Cheat Sheet、PayloadsAllTheThings 公开的
#       LFI/PHP wrapper 利用字典、公开披露的编码绕过手法）自行编写，
#       未复制任何第三方 WAF 产品的规则、文案或结构。
#
# 规则 ID 段：1001601-1001659（当前使用 1001601-1001629，共 29 条）。
# 评分与阻断策略同 cve-emergency.conf 头部说明：
#   CRITICAL(5) 单条即达阻断阈值；ERROR(4)/WARNING(3) 弱特征叠加。
#
# 边界（避免与已有包重复检测同一特征）：
#   - XXE 基础形（<!ENTITY 声明、SYSTEM "file:/http:、参数实体声明、
#     xi:include 泛形、%3c 编码形）已由 api-abuse.conf(1000440-1000444) 与
#     attack-variants-evasion.conf(1001237/1001281/1001282) 覆盖；
#     本包只补：参数实体引用、计数/组合启发式、SVG/SOAP/CDATA 包裹形、
#     双重编码形、ARGS(GET 参数) 目标与冷门协议方案。
#   - 穿越基础形（%2e%2e%2f、%252e、%c0%ae、..;/、../ 与反斜杠序列）已由
#     api-abuse.conf(1000450-1000454) 与 attack-variants-evasion.conf
#     (1001201/1001224/1001244/1001258/1001259) 覆盖；
#     本包只补：%%32%65 半双重编码、3/4 字节 overlong、全角点序列、
#     JSON \u 转义形与路径尾坠。
#   - php://input|filter 泛形、expect://、phar://、zip://、compress.zlib://、
#     data://text* 已由 webshell.conf(1000106/1000107)、
#     attack-variants-evasion.conf(1001226)、deserialization-rce.conf(1000607)
#     覆盖；本包只补：filter 高危过滤链（iconv/rot13/zlib/quoted-printable）、
#     data:// 通用 ;base64 形、php://stdin/fd 与 URI 目标。
#   - /etc/passwd、/proc/self/environ 等基础目标已由
#     attack-variants-evasion.conf(1001225) 与 CRS 930120(ARGS) 覆盖；
#     本包补 Windows 盘符/IIS 目标、/proc 扩展项、/etc 扩展项与 file:// 形。
#
# 注意 Coraza v3.7 变量语义：FILES 为上传文件名集合，FILES_NAMES 为上传
# 表单字段名集合；文件名类检测须以 FILES 为目标（与 CRS 933110/944140/932180 一致）。
# =============================================================================


# =============================================================================
# A. XXE 变种（引用/启发式/包裹/编码/ARGS 目标）
# =============================================================================

# 来源：参数实体「声明+引用」成对出现（OOB 盲打外带 DTD 的必要结构），
# 1000443/1001281 仅覆盖声明本身，本条覆盖 %name; 引用动作。
SecRule REQUEST_BODY "@rx <!entity\s+%[\s\S]{1,500}?%\s*[a-z_][\w.-]{0,40}\s*;" \
    "id:1001601,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XXE parameter entity declaration and reference pair',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：billion-laughs 启发式——单文档内连续 4 个以上 ENTITY 字面量声明
# （计数型正则近似，正常业务 XML 极少出现），ERROR 计分叠加。
SecRule REQUEST_BODY "@rx (?:<!entity\s+[a-z_][\w.-]{0,40}\s+\"[^\"<>]{0,200}\"\s*>\s*){4,}" \
    "id:1001602,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XXE billion-laughs heuristic (many ENTITY declarations)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：billion-laughs 递归展开签名——实体声明的值内引用 2 个以上其他实体
# （指数级膨胀结构），ERROR 计分叠加。
SecRule REQUEST_BODY "@rx <!entity\s+[a-z_][\w.-]{0,40}\s+\"(?:[^\"]{0,60}&[a-z_][\w.-]{0,40};){2,}[^\"]*\"" \
    "id:1001603,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XXE billion-laughs recursive entity reference value',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：SVG 内嵌 XXE（SVG 文档中的外部实体声明，利用 XML 解析差异读取
# 本地文件），覆盖 <svg> 元素与 <!DOCTYPE svg 两种上下文。
SecRule ARGS|REQUEST_BODY "@rx (?:<svg\b[\s\S]{0,600}<!entity\s+[a-z_][\w.-]{0,40}\s+system|<!doctype\s+svg\b[\s\S]{0,200}<!entity)" \
    "id:1001604,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XXE payload embedded in SVG document',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：XInclude href 指向本地伪协议（file/php/expect）。1000444 覆盖
# REQUEST_BODY 明文 file/php 形，本条补 ARGS 目标、URL 编码形与 expect 方案。
SecRule ARGS|REQUEST_BODY "@rx xi:include\b[^>]{0,300}?href\s*=\s*[\"']\s*(?:file|php|expect):" \
    "id:1001605,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XInclude href to local wrapper (file/php/expect)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：CDATA 包裹实体引用（<![CDATA[&xxe;]]>，利用解析器差异的读取/外带
# 形态；1001282 仅覆盖 CDATA 内声明形）。弱特征，ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx <!\[cdata\[\s*&[a-z_][\w.-]{0,40}\s*;\s*\]\]>" \
    "id:1001606,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XXE entity reference wrapped in CDATA',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：SOAP Envelope/带命名空间前缀的 Body 元素内嵌 DOCTYPE（SOAP 消息
# 不应含 DOCTYPE，出现即为 XXE 注入；普通 HTML <body> 无前缀不匹配）。
SecRule ARGS|REQUEST_BODY "@rx (?:<[a-z][\w.-]{0,20}:)?envelope\b[^>]{0,200}>[\s\S]{0,900}?<!doctype\s+[a-z]|<[a-z][\w.-]{1,20}:body\b[^>]{0,200}>[\s\S]{0,900}?<!doctype\s+[a-z]" \
    "id:1001607,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'DOCTYPE embedded inside SOAP Envelope/Body',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：DOCTYPE PUBLIC 引用外部 DTD（无内部子集也可触发外部解析，
# 1000440 只覆盖带 [ 子集形）。XHTML 等合法文档偶有使用，ERROR 计分。
SecRule REQUEST_BODY "@rx <!doctype\s+[a-z][\w:.-]{0,60}\s+public\s+[\"'][^\"']{0,150}[\"']\s+[\"'](?:https?|ftp)://" \
    "id:1001608,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'DOCTYPE PUBLIC with external DTD URL',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：XXE 冷门协议方案（netdoc/ldap/rmi/nfs/iiop/corba，Java 等解析器
# 支持的额外 scheme，可绕过 file/http 关键词检测；http/file/php/expect/
# gopher/dict/ftp/jar 已由 1000442/1001281 覆盖）。
SecRule REQUEST_BODY "@rx system\s+[\"'](?:netdoc|ldap|rmi|nfs|iiop|corba):" \
    "id:1001609,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XXE external entity with exotic URI scheme',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：XXE 双重 URL 编码（%253c%21entity 一次解码后还原为 %3c!entity）
# 与 HTML 实体编码（&lt;!ENTITY，穿透转义层）形态；不做 URL 解码，
# 在原始文本上匹配编码特征。
SecRule ARGS|REQUEST_BODY "@rx (?:%253c%21(?:entity|doctype)|&lt;!(?:entity|doctype))" \
    "id:1001610,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'XXE double-URL-encoded or HTML-entity-encoded form',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：GET/表单参数中的 XXE（现有 XXE 规则均只查 REQUEST_BODY，
# 查询参数解码后的 <!ENTITY x SYSTEM 形态无覆盖，本条补 ARGS 目标）。
SecRule ARGS "@rx <!entity\s+[a-z%][\w.-]{0,40}\s+system\s+[\"']" \
    "id:1001611,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'XXE external entity declaration in request parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-xxe',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# =============================================================================
# B. PHP 伪协议变种
# =============================================================================

# 来源：php://filter 高危过滤链（convert.iconv.* / string.rot13 /
# zlib.deflate|inflate / convert.quoted-printable*，用于源码读取与
# php_filter_chain RCE；convert.base64 已由 1001226 覆盖，泛形由 1000106 兜底）。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY|REQUEST_URI "@rx php://filter/[a-z0-9_.%|/,=+?-]{0,200}?(?:convert\.iconv\.[a-z0-9*./-]{1,80}|string\.rot13|zlib\.(?:deflate|inflate)|convert\.quoted-printable(?:-decode)?)" \
    "id:1001612,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'php://filter dangerous chain (iconv/rot13/zlib/quoted-printable)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：data:// 通用 base64 形态（空 MIME 或非 text/* MIME；1001226 仅
# 覆盖 data://text 前缀，1000607 仅覆盖 data://text/plain;base64）。
SecRule ARGS|REQUEST_BODY|REQUEST_URI "@rx data://[a-z0-9.+-]{0,40}(?:/[a-z0-9.+-]{0,40})?(?:;[a-z0-9=+.-]{1,30}){0,2};\s*base64\s*," \
    "id:1001613,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'data:// wrapper with base64 payload (generic MIME)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：php://stdin 与 php://fd/N 输入流包装器（CGI/FPM 环境下可替代
# php://input 读取原始请求体；1000106 仅覆盖 input|filter）。
SecRule ARGS|ARGS_NAMES|REQUEST_BODY|REQUEST_URI "@rx php://(?:stdin|fd/[0-9]{1,3})" \
    "id:1001614,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'PHP wrapper php://stdin or php://fd access',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：归档/压缩/expect 伪协议出现在 URI 路径中（RESTful 路由把文件参数
# 放进路径时的包含形态；1001226/1000607 只查 ARGS|REQUEST_BODY）。
SecRule REQUEST_URI|REQUEST_FILENAME "@rx (?:phar|zip|expect|rar|compress\.(?:zlib|bzip2))://" \
    "id:1001615,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Archive/compress/expect wrapper in request URI',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'attack-php',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：jar:/netdoc: 嵌套 URL（Java 体系 RFI/XXE 外带常用，jar:http://...!/
# 不以 http 开头，可绕过 1001227 的 ^https?:// 锚定检测）。ERROR 计分。
SecRule ARGS|REQUEST_BODY "@rx (?:jar|netdoc):https?://[\w.:-]{1,80}" \
    "id:1001616,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'jar/netdoc nested URL (Java RFI/XXE exfil)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-rfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# =============================================================================
# C. 本地敏感文件目标（Windows 与编码形态补充）
# =============================================================================

# 来源：Windows 盘符+敏感系统路径（正反斜杠混用编码形态；1001225 仅覆盖
# c:/windows/ 与 /windows/win.ini 正斜杠形）。SAM 配置、IIS 目录、
# drivers/etc 为凭证与配置重灾区。
SecRule ARGS|REQUEST_BODY|REQUEST_URI "@rx [a-z]:[/\\](?:windows|winnt)[/\\](?:win\.ini|system\.ini|boot\.ini|repair[/\\]sam|system32[/\\](?:config|inetsrv|drivers[/\\]etc))" \
    "id:1001617,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Windows drive path to sensitive system file',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：IIS 配置库文件（IIS6 MetaBase.xml / IIS7+ applicationHost.config，
# 含站点凭据与配置，不在 CRS lfi-os-files.data 列表内），边界匹配防误报。
SecRule ARGS|REQUEST_BODY|REQUEST_URI "@rx (?:^|[\s\"'/\\;,=:>])(?:metabase\.xml|applicationhost\.config)(?:[\s\"'<;,]|$)" \
    "id:1001618,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'IIS metabase/applicationHost.config read attempt',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：/proc 扩展敏感项（version/cpuinfo/mounts/meminfo/net 连接表与
# self/maps|cwd|exe|root 等；1001225 仅覆盖 self/environ|cmdline|fd）。
SecRule ARGS|REQUEST_BODY|REQUEST_URI "@rx /proc/(?:version|cpuinfo|mounts|meminfo|net/(?:tcp|tcp6|udp|udp6|arp|route)|self/(?:maps|mounts|cwd|exe|stat|status|root|net))" \
    "id:1001619,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Linux /proc extended sensitive entry read',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：file:// 方案直读本地敏感路径（etc/proc/盘符/windows 目录；
# 1001227 仅对参数开头绝对 URL 记 ERROR，本条为方案+敏感目标组合）。
SecRule ARGS|REQUEST_BODY|REQUEST_URI "@rx file:///?(?:etc/|proc/|[a-z]:|windows[/\\]|winnt[/\\]|boot\.ini)" \
    "id:1001620,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'file:// scheme read of local sensitive path',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：/etc 扩展高危文件（gshadow/sudoers/ssh 私钥目录/ssl 私钥/
# security 目录与 passwd|shadow 备份文件；1001225 仅覆盖基础四项）。
SecRule ARGS|REQUEST_BODY|REQUEST_URI "@rx /etc/(?:passwd[-.~]|shadow[-.~]|gshadow|sudoers|ssh/|ssl/private|security/)" \
    "id:1001621,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Extended /etc sensitive file read (keys/sudoers/backups)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：Windows 系统 ini 裸文件名（boot.ini/win.ini/system.ini，带边界；
# CRS 930120 已覆盖 ARGS，本条补 REQUEST_BODY 目标与文本边界形态）。
SecRule ARGS|REQUEST_BODY "@rx (?:^|[\s\"'/\\;,=:>])(?:boot|win|system)\.ini(?:[\s\"'<;,.]|$)" \
    "id:1001622,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Windows system ini filename in parameter/body',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# =============================================================================
# D. 目录穿越编码变体（已有基础形之外的补充）
# =============================================================================

# 来源：半双重编码（%%32%65 解码得 %2e 再解码得 .；%25%32%65 为其全百分号
# 写法），用于穿透只解码一次的链路。不做 URL 解码，匹配原始编码文本。
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?:%%(?:32%6[56]|35%63)|%25%32%6[56]|%25%35%63)" \
    "id:1001623,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Half-double-encoded traversal (%%32%65 style)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：3/4 字节 overlong UTF-8 编码的斜杠/反斜杠/点（%e0%80%af、
# %f0%80%80%ae 等；2 字节 %c0%ae 与 3 字节点 %e0%80%ae 已由
# 1001201/1000451/1001258 覆盖，本条补斜杠与 4 字节形）。
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx %(?:e0%80%af|e0%81%9c|f0%80%80%(?:af|ae)|f0%80%81%9c)" \
    "id:1001624,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Overlong UTF-8 encoded slash/backslash/dot (3-4 byte)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：Unicode 全角点+斜杠穿越序列（．．／；1001202 只对原始全角单字符
# 记 WARNING 且不解码，本条经 URL 解码后匹配「两点+斜杠」穿越语义）。
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx \x{ff0e}\x{ff0e}[/\\\x{ff0f}\x{ff3c}]" \
    "id:1001625,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Fullwidth dot traversal sequence',\
    logdata:'Matched Data: fullwidth traversal sequence',\
    tag:'attack-lfi',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：JSON Unicode 转义穿越（"file":"..\/" 形式，URL 解码不还原
# \u 转义，可穿透解码型检测；在原始文本上匹配转义序列）。
SecRule ARGS|REQUEST_BODY "@rx \\u002e\\u002e(?:\\u002f|\\u005c|[/\\])" \
    "id:1001626,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'JSON unicode-escape path traversal',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# 来源：路径尾坠「/..」或纯「..」参数（目录逃逸探测，CRS 930110 要求
# ../ 后跟斜杠故不覆盖收尾形）。弱特征，ERROR 计分。
SecRule ARGS "@rx (?:^|[/\\])\.\.$" \
    "id:1001627,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Trailing parent-directory path probe',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# =============================================================================
# E. 空字节截断变种
# =============================================================================

# 来源：%00 截断后接静态资源扩展名（shell.php%00.jpg 反向形态，绕过后缀
# 白名单；1001203 仅覆盖 %00 后接脚本扩展或 /etc/passwd 的方向）。
SecRule FILES|ARGS|REQUEST_BODY|REQUEST_URI "@rx (?:%00|\x00|\\x00)\.(?:jpg|jpeg|png|gif|bmp|pdf|txt|csv|zip|docx?)" \
    "id:1001628,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Null-byte truncation before static extension',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# 来源：参数尾部空字节（file=/etc/passwd%00 截断应用强制追加的后缀，
# 即 include%00 形态；1001203 要求空字节后跟随敏感目标故不覆盖收尾形）。
SecRule ARGS|ARGS_NAMES "@rx (?:%00|\x00|\\x00)$" \
    "id:1001629,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Trailing null-byte truncation in parameter',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
    tag:'attack-lfi',\
    tag:'evasion/encoding',\
    tag:'CUSTOM_PACK',\
    ver:'CUSTOM_PACK/1.0.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score=+%{tx.error_anomaly_score}',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# ================================ END xxe-lfi-variants.conf ================================
