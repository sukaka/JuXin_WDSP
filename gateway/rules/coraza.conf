# 九章防护网关 Coraza 基础配置
# 基于 coraza.conf-recommended (coraza v3.7.0) 定制
# 注意：SecRuleEngine 不在此文件设置，由 Caddyfile 通过环境变量注入，
#       以支持 关闭(Off)/观察(DetectionOnly)/防护(On) 三种模式。

# -- 请求体处理 ---------------------------------------------------------------

SecRequestBodyAccess On

# XML 请求体解析器
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
     "id:'200000',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"

# JSON 请求体解析器
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
     "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# +json 子类型解析器
SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" \
     "id:'200006',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

SecRequestBodyJsonDepthLimit 1024

# 最大请求体 12.5MB（支持常规文件上传）
SecRequestBodyLimit 13107200

# 内存中缓冲的最大请求体，超出部分落盘
SecRequestBodyInMemoryLimit 131072

# 超过请求体限制时的动作：Reject（防护模式生效）
SecRequestBodyLimitAction Reject

# 请求体解析失败校验
SecRule REQBODY_ERROR "!@eq 0" \
    "id:'200002', phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

# multipart 严格校验
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:'200003',phase:2,t:none,log,deny,status:400, \
    msg:'Multipart request body failed strict validation.'"

# -- 响应体处理 ---------------------------------------------------------------

SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# -- 持久化目录 ---------------------------------------------------------------

SecDataDir /tmp/coraza

# -- 审计日志配置 -------------------------------------------------------------

# On：记录所有事务。
# ⚠ 本取值（On）与下方 SecAuditLogParts 含 C（完整请求体落盘）均为【阶段1 POC 专用】：
# POC 需要 go-ftw 的日志标记（log marker）机制定位每个测试产生的日志范围，
# marker 请求本身不命中规则，RelevantOnly 下不产生审计记录，因此 POC 统一使用 On。
# 生产配置不由本文件的取值决定：server/internal/gatewayconfig 生成器在 Include 本文件
# 之后写入 SecAuditEngine RelevantOnly + SecAuditLogParts ABIJDEFHZ（不含 C）覆盖本节
# （SecLang 单值指令顺序求值、后写覆盖）。gateway/configs/Caddyfile 的实验室/FTW 环境
# 不经生成器，仍按本文件 POC 默认执行——修改本节时须保持 go-ftw marker 可用。
SecAuditEngine On
SecAuditLogRelevantStatus "^(?:(5|4)(0|1)[0-9])$"

# 审计日志组成：A(摘要) B(请求头) C(完整请求体) I(精简请求体) J(规则信息)
# D(中断响应头) E(中断响应体) F(响应头) H(尾部) Z(边界)
# C/E 用于安全事件溯源取证；采集侧负责敏感头脱敏与头体截断（各 64KB），
# 请求体本身受 SecRequestBodyLimit 12.5MB 限制。
SecAuditLogParts ABCIJDEFHZ

SecAuditLogType Serial
SecAuditLog /var/log/caddy/coraza-audit.log

# JSON 格式审计日志，供九章事件解析器采集
SecAuditLogFormat JSON
