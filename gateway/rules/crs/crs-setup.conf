# 九章防护网关 CRS 4.28.0 setup 配置（标准策略模板）
# 本文件基于 crs-setup.conf.example 定制，属于 CRS 官方推荐的使用方式，
# 未修改 crs/rules/ 下任何上游规则文件。
#
# 三套策略模板映射（后续由配置发布系统生成）：
#   宽松策略：blocking_paranoia_level=1，入站阈值 15
#   标准策略：blocking_paranoia_level=1，入站阈值 5（本文件）
#   严格策略：blocking_paranoia_level=2，入站阈值 3

# -- 默认动作（Anomaly Scoring 模式，必须覆盖 phase 1~5）---------------------
# Coraza 仅对 phase:2 内置默认动作（phase:2,log,auditlog,pass），若此处缺失
# phase:1/3/4/5 的 SecDefaultAction，CRS 与扩展规则包中仅写 block 而未显式写
# log 的 phase:1/3/4 规则虽正常计分却不会写入审计日志 messages，导致事件缺少
# 真实命中规则、攻击类型退化为「其他」（见 crs-setup.conf.example L97-101）。
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"
SecDefaultAction "phase:3,log,auditlog,pass"
SecDefaultAction "phase:4,log,auditlog,pass"
SecDefaultAction "phase:5,log,auditlog,pass"

# -- Paranoia Level -----------------------------------------------------------
# 标准策略：PL1 执行 + PL1 阻断
SecAction \
    "id:900000,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.28.0',\
    setvar:tx.blocking_paranoia_level=1"

# -- 异常评分阈值 --------------------------------------------------------------
# 标准策略：入站阈值 5，出站阈值 4
SecAction \
    "id:900100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.28.0',\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# -- CRS 版本标记（必须与所加载 CRS 版本一致，否则 CRS 拒绝运行）--------------
SecAction \
    "id:900990,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.28.0',\
    setvar:tx.crs_setup_version=4280"
