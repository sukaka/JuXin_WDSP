# 九章运行时例外（在 CRS 规则之前加载）
# 用途：误报例外、运行时排除。
# CRS 官方建议：运行时例外放在 CRS 之前（ctl 动作排除特定变量），
# 配置时例外放在 CRS 之后（见 after-crs.conf）。
#
# 编写原则：精确例外 —— 指定应用＋指定路径＋指定规则＋指定参数。
# 禁止生成宽泛例外（如关闭整个 SQLi/XSS 规则分类、对全部 URL 移除高风险规则）。
#
# 示例（默认全部注释，不生效）：
#
# 对 /api/richtext 路径的 ARGS:content 参数禁用规则 941100：
# SecRule REQUEST_URI "@beginsWith /api/richtext" \
#     "id:11001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=941100;ARGS:content"
