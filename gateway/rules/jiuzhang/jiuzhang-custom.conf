# 九章自定义规则
# 规则 ID 规划：9000000-9000999 为九章 POC 自定义规则段，
# 避免与 CRS (900xxx-999xxx) 及 coraza.conf (200000-200006) 冲突。

# -- 自定义规则加载自验 ---------------------------------------------------------
# 用于 POC 验证自定义规则链路真实生效：
# 访问 /jiuzhang-rule-selftest 时命中本规则并被阻断（防护模式）或记录（观察模式）。
SecRule REQUEST_URI "@streq /jiuzhang-rule-selftest" \
    "id:9000001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'JiuZhang custom rule self-test triggered',\
    tag:'jiuzhang-custom',\
    severity:'WARNING'"

# -- 扫描器特征补充检测 ----------------------------------------------------------
# 对明显恶意扫描器 UA 记录（与 CRS 913 互补，低分记录不直接阻断）
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|masscan|acunetix|nessus)" \
    "id:9000002,\
    phase:1,\
    pass,\
    log,\
    msg:'JiuZhang: known scanner user agent',\
    tag:'jiuzhang-custom',\
    severity:'NOTICE'"
