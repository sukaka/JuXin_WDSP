# 九章二次阻断评估（post-contrib blocking evaluation）
#
# 背景：CRS 的阻断评估 REQUEST-949 位于 crs/rules/ 内部，而 contrib 规则包、
# CRS 插件 after、exclusions/after-crs 以及管理面自定义规则都在 949 之后才执行。
# 这些后置规则命中（block 动作）只累加异常分数并产生事件，永远不会再次进入
# 阈值评估，导致 CUSTOM_PACK 等自研/三方规则包的 CRITICAL 命中在防护模式下仍被放行。
#
# 本文件在全部计分规则之后重新汇总 tx.inbound_anomaly_score_pl1..pl4，
# 对汇总分执行一次独立的阈值评估并阻断，不改动 CRS 任何文件。
# 加载位置约束：本文件必须是 WAF 指令链中最后一条 Include，
# 任何新增计分规则包都必须早于本文件加载（见 docs/RULE_PACKS.md）。
#
# 规则 ID：9000101-9000104（九章 9000xxx 段；
# 已核对与 crs-setup 900000/900100/900990、生成器 900001、
# jiuzhang-custom 9000001/9000002、CRS 900xxx-999xxx、coraza.conf 200000 段无冲突）。
#
# 观察模式（SecRuleEngine DetectionOnly）下引擎自动将 deny 降级为仅记录，
# 无需在本文件内写死模式判断。

# -- phase:1 汇总与评估 ---------------------------------------------------------
# 未设置的 per-PL 变量按 0 处理（与 CRS 949 的 +=%{...} 写法一致）。
SecAction \
    "id:9000101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.jz_blocking_inbound_score=0,\
    setvar:'tx.jz_blocking_inbound_score=+%{tx.inbound_anomaly_score_pl1}',\
    setvar:'tx.jz_blocking_inbound_score=+%{tx.inbound_anomaly_score_pl2}',\
    setvar:'tx.jz_blocking_inbound_score=+%{tx.inbound_anomaly_score_pl3}',\
    setvar:'tx.jz_blocking_inbound_score=+%{tx.inbound_anomaly_score_pl4}'"

SecRule TX:JZ_BLOCKING_INBOUND_SCORE "@ge %{tx.inbound_anomaly_score_threshold}" \
    "id:9000102,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'九章二次阻断评估：阶段 1 入站异常评分超过阈值（总分：%{TX.JZ_BLOCKING_INBOUND_SCORE}）',\
    tag:'jiuzhang-custom',\
    tag:'anomaly-evaluation',\
    severity:'CRITICAL'"

# -- phase:2 汇总与评估 ---------------------------------------------------------
# per-PL 分数跨阶段累计，故 phase:2 先归零再重算，避免重复计数（同 CRS 949059）。
SecAction \
    "id:9000103,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.jz_blocking_inbound_score=0,\
    setvar:'tx.jz_blocking_inbound_score=+%{tx.inbound_anomaly_score_pl1}',\
    setvar:'tx.jz_blocking_inbound_score=+%{tx.inbound_anomaly_score_pl2}',\
    setvar:'tx.jz_blocking_inbound_score=+%{tx.inbound_anomaly_score_pl3}',\
    setvar:'tx.jz_blocking_inbound_score=+%{tx.inbound_anomaly_score_pl4}'"

SecRule TX:JZ_BLOCKING_INBOUND_SCORE "@ge %{tx.inbound_anomaly_score_threshold}" \
    "id:9000104,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'九章二次阻断评估：入站异常评分超过阈值（总分：%{TX.JZ_BLOCKING_INBOUND_SCORE}）',\
    tag:'jiuzhang-custom',\
    tag:'anomaly-evaluation',\
    severity:'CRITICAL'"
