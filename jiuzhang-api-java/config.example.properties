server.listen=127.0.0.1:18090
server.admin_listen=127.0.0.1:19091
server.upstream=http://127.0.0.1:23090
server.request_timeout=PT15S
protection.mode=observe
protection.max_body_bytes=1048576
protection.max_response_bytes=2097152
protection.events_path=var/api-security-events.jsonl
protection.rate_limit=120
protection.rate_window=PT1M
protection.tracked_clients=10000
protection.response_mask_fields=password,token,secret
schemas.location=schemas.example.json
