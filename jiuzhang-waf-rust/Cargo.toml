[package]
name = "jiuzhang-native-waf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
axum = { version = "=0.8.4", features = ["http1", "json", "tokio"] }
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.5.41", features = ["derive"] }
ipnet = { version = "=2.11.0", features = ["serde"] }
percent-encoding = "=2.3.1"
regex = "=1.11.1"
reqwest = { version = "=0.12.22", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.12"
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "=0.8.23"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "=1.17.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.20.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
