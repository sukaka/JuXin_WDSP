  /system-settings:
    get:
      operationId: settingList
      tags: [system-settings]
      summary: 系统设置列表
      description: >-
        按分组列出系统设置（可按 group 过滤），敏感设置（is_sensitive=true）的值恒脱敏为 "********"。
        权限：system_settings.read。
      parameters:
        - name: group
          in: query
          schema: { type: string, enum: [password, login, session, display, logging] }
          description: 按设置分组过滤（缺省返回全部）
      responses:
        '200':
          description: 设置列表（敏感值已脱敏）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: settingUpdate
      tags: [system-settings]
      summary: 更新系统设置（乐观锁）
      description: >-
        更新单条系统设置。权限：system_settings.update。
        需 CSRF：请求头须携带 X-CSRF-Token。
        仅允许白名单内的设置键（password/login/session/display/logging 组）；setting_value 的 JSON 类型
        须与该设置的 value_type 一致，否则返回 400。乐观锁：version 须与当前一致，否则返回 409。
        更新成功会写入操作审计（模块 system_settings）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdateRequest'
      responses:
        '200':
          description: 设置已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: 不支持的设置项或值类型与 value_type 不符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 设置项不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 设置已被其他人修改（乐观锁冲突），请刷新后重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /system-settings/syslog-test:
    post:
      operationId: settingSyslogTest
      tags: [system-settings]
      summary: 发送 syslog 测试消息
      description: >-
        使用当前系统设置立即向 syslog 服务器发送一条测试消息，用于验证外发配置（logging.syslog_*）。
        权限：logging.syslog_test。需 CSRF：请求头须携带 X-CSRF-Token。
        无论成功失败均写入操作审计；未启用、地址为空或网络错误时返回 400，message 为失败原因。
      responses:
        '200':
          description: 测试消息已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: 发送失败（message 为失败原因：未启用/地址为空/网络错误等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  schemas:
    AuthCaptchaResponse:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: 验证码是否启用；false 时无其余字段，登录可不传验证码
        captcha_id:
          type: string
          description: 验证码标识（登录时随 captcha_code 提交）
        image:
          type: string
          description: 验证码图片（data:image/png;base64 数据 URL）
        expires_in:
          type: integer
          description: 验证码有效期，单位秒（login.captcha_expire_seconds，默认 120）

    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          format: password
          description: 密码
        captcha_id:
          type: string
          description: 验证码标识（验证码启用时必填）
        captcha_code:
          type: string
          description: 验证码字符（验证码启用时必填）

    AuthCurrentUser:
      type: object
      required: [id, username, display_name, status, roles, permissions, must_change_password]
      properties:
        id:
          type: string
          format: uuid
          description: 用户 ID
        username:
          type: string
          description: 用户名
        display_name:
          type: string
          description: 显示名称
        status:
          type: string
          enum: [ACTIVE, DISABLED, LOCKED, DELETED]
          description: 用户状态
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleBrief'
          description: 用户角色（三权互斥，至多一个内置管理角色）
        permissions:
          type: array
          items: { type: string }
          description: 权限点编码列表（经角色聚合）
        must_change_password:
          type: boolean
          description: 是否必须修改密码（首次登录或密码被重置后为 true）
        totp_enabled:
          type: boolean
          description: 是否已开启双因子认证（TOTP）
        last_login_at:
          type: string
          format: date-time
          nullable: true
          description: 最近登录时间
        last_login_ip:
          type: string
          description: 最近登录来源 IP（无记录时为空字符串）

    AuthLoginResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: '#/components/schemas/AuthCurrentUser'
        csrf_token:
          type: string
          description: CSRF Token，写操作须在请求头 X-CSRF-Token 携带
        password_expiring:
          type: boolean
          description: 密码是否即将过期（进入提醒窗口期）
        password_expires_at:
          type: string
          format: date-time
          nullable: true
          description: 密码过期时间（null 表示永不过期）

    AuthTOTPChallengeResponse:
      type: object
      required: [challenge_token]
      description: >-
        登录业务分支（信封 code=TOTP_REQUIRED，HTTP 200）：密码校验通过且账号已开启双因子认证，
        未创建会话，须凭挑战令牌调用 /auth/totp-verify 完成第二步验证
      properties:
        challenge_token:
          type: string
          description: 一次性挑战令牌（32 字节随机 hex，5 分钟有效，验证成功即失效）

    AuthTOTPVerifyRequest:
      type: object
      required: [challenge_token, code]
      properties:
        challenge_token:
          type: string
          description: /auth/login 返回的挑战令牌
        code:
          type: string
          description: 6 位动态令牌，或一次性恢复码（xxxx-xxxx，不区分大小写）

    AuthTOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6 位动态令牌；关闭双因子时也可使用一次性恢复码（xxxx-xxxx）

    AuthTOTPSetupResponse:
      type: object
      required: [secret, otpauth_url, recovery_codes]
      properties:
        secret:
          type: string
          description: Base32 编码的 TOTP 密钥（明文仅本次返回，服务端只存密文）
        otpauth_url:
          type: string
          description: otpauth:// 链接，供令牌 App 扫码绑定
        recovery_codes:
          type: array
          items: { type: string }
          description: 10 个一次性恢复码（xxxx-xxxx），仅本次返回，服务端只存 SHA-256 哈希
        notice:
          type: string
          description: 保存提示

    AuthChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
          description: 原密码
        new_password:
          type: string
          format: password
          description: 新密码（须符合密码安全策略）

    AuthChangePasswordResponse:
      type: object
      required: [message, relogin_required]
      properties:
        message:
          type: string
          description: 提示信息
        relogin_required:
          type: boolean
          description: 是否须重新登录（恒为 true，改密后当前会话已撤销）

    AuthSession:
      type: object
      required: [id, session_hash, is_current]
      properties:
        id:
          type: string
          format: uuid
          description: 会话摘要 ID（撤销会话时作为路径参数）
        session_hash:
          type: string
          description: 会话标识哈希（非原始会话 ID）
        source_ip:
          type: string
          description: 登录来源 IP（可为空字符串）
        user_agent_summary:
          type: string
          description: User-Agent 摘要（截断至 500 字符）
        created_at:
          type: string
          format: date-time
          description: 会话创建时间
        last_seen_at:
          type: string
          format: date-time
          description: 最近活跃时间
        expires_at:
          type: string
          format: date-time
          description: 会话过期时间（绝对过期）
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: 撤销时间（未撤销为 null）
        revoke_reason:
          type: string
          description: 撤销原因（如 logout、user_revoke_self、password_changed；未撤销为空字符串）
        is_current:
          type: boolean
          description: 是否为当前请求所用会话

    AuthSessionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthSession'

    RoleBrief:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: 角色编码（如 SYSTEM_ADMIN）
        name:
          type: string
          description: 角色中文名称

    User:
      type: object
      required: [id, username, display_name, status, must_change_password, roles, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
          description: 用户 ID
        username:
          type: string
          description: 用户名
        display_name:
          type: string
          description: 显示名称
        status:
          type: string
          enum: [ACTIVE, DISABLED, LOCKED, DELETED]
          description: 用户状态
        must_change_password:
          type: boolean
          description: 是否必须修改密码
        password_expires_at:
          type: string
          format: date-time
          nullable: true
          description: 密码过期时间（null 表示永不过期）
        locked_until:
          type: string
          format: date-time
          nullable: true
          description: 锁定截止时间（未锁定为 null）
        last_login_at:
          type: string
          format: date-time
          nullable: true
          description: 最近登录时间
        last_login_ip:
          type: string
          description: 最近登录来源 IP（无记录时为空字符串）
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleBrief'
          description: 用户角色
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        version:
          type: integer
          description: 乐观锁版本号（更新时需回传）

    UserListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          description: 当前页码
        page_size:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总条数

    UserCreateRequest:
      type: object
      required: [username, role_code]
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 64
          description: 用户名（仅字母/数字/下划线/短横线，不区分大小写唯一）
        display_name:
          type: string
          maxLength: 128
          description: 显示名称（缺省同用户名）
        role_code:
          type: string
          enum: [SYSTEM_ADMIN, SECURITY_ADMIN, AUDIT_ADMIN]
          description: 内置角色编码（仅允许三权角色）

    UserCreateResponse:
      type: object
      required: [user, temporary_password]
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporary_password:
          type: string
          description: 一次性临时密码（仅本次返回，须立即告知用户）
        notice:
          type: string
          description: 提示文案

    UserUpdateRequest:
      type: object
      required: [display_name, version]
      properties:
        display_name:
          type: string
          maxLength: 128
          description: 显示名称（为空时回退为用户名）
        role_code:
          type: string
          enum: [SYSTEM_ADMIN, SECURITY_ADMIN, AUDIT_ADMIN]
          description: 新角色编码（缺省/空表示不变更角色）
        version:
          type: integer
          description: 乐观锁版本号（须与当前用户 version 一致）

    UserResetPasswordResponse:
      type: object
      required: [temporary_password]
      properties:
        temporary_password:
          type: string
          description: 一次性临时密码（仅本次返回）
        notice:
          type: string
          description: 提示文案

    Role:
      type: object
      required: [id, code, name, description, is_builtin]
      properties:
        id:
          type: string
          format: uuid
          description: 角色 ID
        code:
          type: string
          description: 角色编码（如 SYSTEM_ADMIN）
        name:
          type: string
          description: 角色中文名称
        description:
          type: string
          description: 角色描述
        is_builtin:
          type: boolean
          description: 是否内置角色

    RoleListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    RolePermission:
      type: object
      required: [id, code, name, module, description]
      properties:
        id:
          type: string
          format: uuid
          description: 权限 ID
        code:
          type: string
          description: 权限点编码（如 users.read）
        name:
          type: string
          description: 权限中文名称
        module:
          type: string
          description: 所属模块
        description:
          type: string
          description: 权限描述

    RolePermissionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RolePermission'

    RoleDetailResponse:
      type: object
      required: [role, permissions, user_count]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/RolePermission'
          description: 该角色的权限点清单
        user_count:
          type: integer
          description: 关联该角色的用户数量

    ProfilePermissionDetail:
      type: object
      required: [code, name, module]
      properties:
        code:
          type: string
          description: 权限点编码
        name:
          type: string
          description: 权限中文名称
        module:
          type: string
          description: 所属模块

    ProfileResponse:
      type: object
      required: [id, username, display_name, status, must_change_password, roles, created_at, updated_at, version, permissions]
      properties:
        id:
          type: string
          format: uuid
          description: 用户 ID
        username:
          type: string
          description: 用户名
        display_name:
          type: string
          description: 显示名称
        status:
          type: string
          enum: [ACTIVE, DISABLED, LOCKED, DELETED]
          description: 用户状态
        must_change_password:
          type: boolean
          description: 是否必须修改密码
        password_expires_at:
          type: string
          format: date-time
          nullable: true
          description: 密码过期时间
        locked_until:
          type: string
          format: date-time
          nullable: true
          description: 锁定截止时间
        last_login_at:
          type: string
          format: date-time
          nullable: true
          description: 最近登录时间
        last_login_ip:
          type: string
          description: 最近登录来源 IP（无记录时为空字符串）
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleBrief'
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        version:
          type: integer
          description: 乐观锁版本号（修改资料时需回传）
        permissions:
          type: array
          items: { type: string }
          description: 权限点编码列表（经角色聚合）
        permission_details:
          type: array
          items:
            $ref: '#/components/schemas/ProfilePermissionDetail'
          description: 权限点中文明细（与 permissions 对应）

    ProfileUpdateRequest:
      type: object
      required: [display_name, version]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
          description: 显示名称
        version:
          type: integer
          description: 乐观锁版本号（须与当前资料 version 一致）

    LoginLogEntry:
      type: object
      required: [id, occurred_at, username, event_type, result]
      properties:
        id:
          type: string
          format: uuid
          description: 日志 ID
        occurred_at:
          type: string
          format: date-time
          description: 事件发生时间
        username:
          type: string
          description: 登录用户名
        user_id:
          type: string
          format: uuid
          nullable: true
          description: 用户 ID（登录失败且用户不存在时为 null）
        source_ip:
          type: string
          description: 来源 IP（识别真实客户端后的 IP，可为空字符串）
        connection_ip:
          type: string
          description: 直连 IP（TCP 对端，可为空字符串）
        user_agent_summary:
          type: string
          description: User-Agent 摘要（截断至 500 字符）
        event_type:
          type: string
          enum: [LOGIN_SUCCESS, LOGIN_FAILURE, CAPTCHA_FAILURE, ACCOUNT_LOCKED, LOGOUT, FORCE_LOGOUT, SESSION_EXPIRED, PASSWORD_CHANGE, PASSWORD_RESET, FIRST_CHANGE_PASSWORD]
          description: 事件类型
        result:
          type: string
          enum: [SUCCESS, FAILURE]
          description: 结果
        failure_code:
          type: string
          description: 失败原因码（如 CAPTCHA_REQUIRED、PASSWORD_EXPIRED；成功时为空字符串）
        request_id:
          type: string
          description: 请求 ID（链路追踪）

    LoginLogListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LoginLogEntry'
        page:
          type: integer
          description: 当前页码
        page_size:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总条数

    AuditEntry:
      type: object
      required: [id, occurred_at, username, module, action, result, risk_level]
      properties:
        id:
          type: string
          format: uuid
          description: 审计记录 ID
        occurred_at:
          type: string
          format: date-time
          description: 发生时间（UTC，微秒精度）
        user_id:
          type: string
          format: uuid
          nullable: true
          description: 操作人用户 ID
        username:
          type: string
          description: 操作人用户名
        source_ip:
          type: string
          description: 来源 IP（可为空字符串）
        connection_ip:
          type: string
          description: 直连 IP（可为空字符串）
        user_agent_summary:
          type: string
          description: User-Agent 摘要（截断至 500 字符）
        module:
          type: string
          description: 模块（如 users、system_settings）
        action:
          type: string
          description: 操作动作（如 create、update、delete、assign_role）
        object_type:
          type: string
          description: 操作对象类型（如 user、setting）
        object_id:
          type: string
          description: 操作对象标识
        object_name:
          type: string
          description: 操作对象名称
        before_summary:
          type: string
          description: 变更前摘要（JSON 字符串，敏感字段已脱敏为 ********；可为空字符串）
        after_summary:
          type: string
          description: 变更后摘要（JSON 字符串，敏感字段已脱敏为 ********；可为空字符串）
        result:
          type: string
          enum: [SUCCESS, FAILURE]
          description: 操作结果
        failure_reason:
          type: string
          description: 失败原因（成功时为空字符串）
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          description: 风险等级
        request_id:
          type: string
          description: 请求 ID（链路追踪）
        previous_hash:
          type: string
          description: 上一条审计记录哈希（链起点为空字符串）
        record_hash:
          type: string
          description: 本记录哈希（SHA-256，十六进制）

    AuditListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          type: integer
          description: 当前页码
        page_size:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总条数

    AuditVerifyChainResponse:
      type: object
      required: [valid, mismatch_count, mismatch_ids]
      properties:
        valid:
          type: boolean
          description: 哈希链是否完整（mismatch_count 为 0 时 true）
        mismatch_count:
          type: integer
          description: 不一致记录数量
        mismatch_ids:
          type: array
          items: { type: string, format: uuid }
          description: 不一致记录 ID 列表

    Setting:
      type: object
      required: [id, setting_group, setting_key, setting_value, value_type, is_sensitive, description, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
          description: 设置记录 ID
        setting_group:
          type: string
          enum: [password, login, session, display, logging]
          description: 设置分组
        setting_key:
          type: string
          description: 设置键（如 min_length）
        setting_value:
          description: 设置值（JSON 任意类型，与 value_type 一致；敏感设置恒为 "********"）
        value_type:
          type: string
          enum: [string, integer, boolean]
          description: 值类型（服务端据此校验 setting_value 的 JSON 类型）
        is_sensitive:
          type: boolean
          description: 是否敏感设置（敏感设置读取时值被脱敏）
        description:
          type: string
          description: 设置项描述
        updated_at:
          type: string
          format: date-time
          description: 最近更新时间
        version:
          type: integer
          description: 乐观锁版本号（更新时需回传）

    SettingListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Setting'

    SettingUpdateRequest:
      type: object
      required: [setting_group, setting_key, setting_value, version]
      properties:
        setting_group:
          type: string
          description: 设置分组（须为白名单内的组合，如 password、login）
        setting_key:
          type: string
          description: 设置键（如 min_length）
        setting_value:
          description: 新值（JSON 类型须与该设置的 value_type 一致，如 integer 组传 8、boolean 组传 true、string 组传 "文本"）
        version:
          type: integer
          description: 乐观锁版本号（须与当前设置 version 一致）
