      operationId: userDisable
      tags: [users]
      summary: 停用用户
      description: >-
        将用户状态置为 DISABLED 并撤销其全部会话。权限：users.disable。
        需 CSRF：请求头须携带 X-CSRF-Token。
        不能停用当前登录账号或最后一个可用系统管理员（返回 409）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 用户 ID
      responses:
        '200':
          description: 用户已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 不能停用当前登录账号或最后一个系统管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/unlock:
    post:
      operationId: userUnlock
      tags: [users]
      summary: 解锁用户
      description: >-
        解除登录失败锁定（清零失败计数、清除 locked_until，状态恢复 ACTIVE）。
        权限：users.unlock。需 CSRF：请求头须携带 X-CSRF-Token。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 用户 ID
      responses:
        '200':
          description: 用户已解锁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/reset-password:
    post:
      operationId: userResetPassword
      tags: [users]
      summary: 重置密码（返回临时密码）
      description: >-
        重置为 16 位随机临时密码并撤销该用户全部会话，重置后 must_change_password=true。
        权限：users.reset_password。需 CSRF：请求头须携带 X-CSRF-Token。
        临时密码仅在响应中返回一次（不落日志与审计）。
        限流：按来源 IP 10 次/分钟，超限返回 429。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 用户 ID
      responses:
        '200':
          description: 重置成功（temporary_password 仅本次返回）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResetPasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/totp/reset:
    post:
      operationId: userResetTOTP
      tags: [users]
      summary: 重置用户双因子认证（高危）
      description: >-
        清空指定用户的 TOTP 密钥、待启用密钥与全部恢复码（用于令牌丢失等账号访问恢复场景）。
        权限：users.reset_password。需 CSRF：请求头须携带 X-CSRF-Token。
        操作审计记录为高危（HIGH）。限流：按来源 IP 10 次/分钟，超限返回 429。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 用户 ID
      responses:
        '200':
          description: 双因子认证已重置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该用户未开启双因子认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

