        权限：login_logs.export。导出接口按来源 IP 限流 5 次/分钟，超限返回 429。
        CSV 列：occurred_at,username,source_ip,event_type,result,failure_code,request_id。
      parameters:
        - name: username
          in: query
          schema: { type: string }
          description: 用户名关键字（模糊匹配）
        - name: source_ip
          in: query
          schema: { type: string }
          description: 来源 IP（精确匹配）
        - name: result
          in: query
          schema: { type: string, enum: [SUCCESS, FAILURE] }
          description: 按结果过滤
        - name: event_type
          in: query
          schema:
            type: string
            enum: [LOGIN_SUCCESS, LOGIN_FAILURE, CAPTCHA_FAILURE, ACCOUNT_LOCKED, LOGOUT, FORCE_LOGOUT, SESSION_EXPIRED, PASSWORD_CHANGE, PASSWORD_RESET, FIRST_CHANGE_PASSWORD]
          description: 按事件类型过滤
        - name: request_id
          in: query
          schema: { type: string }
          description: 按请求 ID 精确过滤
        - name: start_time
          in: query
          schema: { type: string, format: date-time }
          description: 起始时间（RFC3339，含边界）
        - name: end_time
          in: query
          schema: { type: string, format: date-time }
          description: 截止时间（RFC3339，含边界）
      responses:
        '200':
          description: CSV 文件下载
          content:
            text/csv:
              schema: { type: string }
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

