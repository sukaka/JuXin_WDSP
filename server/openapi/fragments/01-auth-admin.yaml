paths:
  /auth/captcha:
    get:
      operationId: authCaptcha
      tags: [auth]
      summary: 获取图形验证码
      description: >-
        生成登录用图形验证码（4 位字符）。权限：无（公开）。
        当系统设置关闭验证码（login.captcha_enabled=false）时仅返回 enabled=false，无其余字段。
        限流：按来源 IP 限制，阈值动态读取登录策略 login.rate_limit_per_minute（默认 10 次/分钟），超限返回 429。
      responses:
        '200':
          description: 验证码信息（image 为 data:image/png;base64 数据）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCaptchaResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: 用户登录
      description: >-
        用户名密码登录。权限：无（公开）。
        成功后通过 Set-Cookie 下发 HttpOnly 会话 Cookie（jiuzhang_session），响应 data 中返回 csrf_token，
        后续写操作须在请求头 X-CSRF-Token 中携带。验证码未关闭时 captcha_id/captcha_code 必填。
        失败统一提示「用户名或密码错误」，不区分用户不存在与密码错误；
        连续失败达到阈值（login.max_failed_attempts，默认 5 次）账号将被锁定。
        限流：按来源 IP 限制，阈值动态读取 login.rate_limit_per_minute（默认 10 次/分钟），超限返回 429。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: >-
            登录成功（同时 Set-Cookie 下发会话）；若账号已开启双因子认证，则返回业务分支码
            TOTP_REQUIRED（HTTP 200，未下发会话），data.challenge_token 为一次性挑战令牌
            （5 分钟有效），须凭它调用 /auth/totp-verify 完成第二步验证
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthLoginResponse'
                  - $ref: '#/components/schemas/AuthTOTPChallengeResponse'
        '400':
          description: 参数缺失或验证码错误/已过期（错误码 CAPTCHA_INVALID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 用户名或密码错误（统一提示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 账号不可用/已锁定（ACCOUNT_LOCKED）或密码已过期（PASSWORD_EXPIRED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/totp-verify:
    post:
      operationId: authTOTPVerify
      tags: [auth]
      summary: 登录第二步：双因子认证验证
      description: >-
        凭 /auth/login 返回的 challenge_token 与 6 位动态令牌（或一次性恢复码 xxxx-xxxx）完成登录。
        权限：无（公开）。挑战令牌一次性使用：验证成功即失效；动态令牌错误（TOTP_INVALID）可在
        5 分钟 TTL 内重试，连续失败计入账号锁定（login.max_failed_attempts）。恢复码命中即消费，不可复用。
        成功响应与 /auth/login 一致（Set-Cookie 下发会话、data 返回 csrf_token）。
        限流：与登录同一桶，按来源 IP 限制（login.rate_limit_per_minute，默认 10 次/分钟），超限返回 429。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTOTPVerifyRequest'
      responses:
        '200':
          description: 验证通过，登录成功（同时 Set-Cookie 下发会话）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: 参数缺失或格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 挑战令牌无效/已过期（UNAUTHENTICATED）或动态令牌/恢复码错误（TOTP_INVALID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 账号不可用/已锁定（ACCOUNT_LOCKED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: 退出登录
      description: >-
        注销当前会话并清除会话 Cookie。权限：登录即可访问。
        需 CSRF：请求头须携带 X-CSRF-Token。
      responses:
        '200':
          description: 已退出登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: 当前登录用户信息
      description: >-
        返回当前登录用户及其角色、权限点，并幂等签发新的 CSRF Token。
        权限：登录即可访问（must_change_password 状态下也可访问）。
      responses:
        '200':
          description: 用户信息与新 CSRF Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      operationId: authChangePassword
      tags: [auth]
      summary: 修改密码
      description: >-
        修改当前用户密码。权限：登录即可访问（must_change_password 状态下也可访问）。
        需 CSRF：请求头须携带 X-CSRF-Token。
        新密码须符合密码安全策略（长度/复杂度/历史不重复），不符时返回 400 且 details 为原因列表。
        成功后当前会话被撤销、Cookie 被清除，客户端须重新登录。
        限流：按来源 IP 10 次/分钟，超限返回 429。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChangePasswordRequest'
      responses:
        '200':
          description: 密码修改成功（需重新登录）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChangePasswordResponse'
        '400':
          description: 原密码错误、新密码与近期密码重复或不符合密码策略（details 含具体原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/sessions:
    get:
      operationId: authSessionList
      tags: [auth]
      summary: 当前用户会话列表
      description: >-
        返回当前登录用户的会话摘要列表（最多 20 条，含已撤销会话），is_current 标记当前会话。
        权限：登录即可访问（仅能看到自己的会话）。
      responses:
        '200':
          description: 会话摘要列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sessions/{id}:
    delete:
      operationId: authSessionRevoke
      tags: [auth]
      summary: 结束指定会话
      description: >-
        结束当前用户的指定会话（仅能操作自己的会话）。权限：登录即可访问。
        需 CSRF：请求头须携带 X-CSRF-Token。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话摘要 ID（来自 GET /auth/sessions 返回的 id 字段）
      responses:
        '200':
          description: 会话已结束
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 会话不存在或已结束
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/totp/setup:
    post:
      operationId: authTOTPSetup
      tags: [auth]
      summary: 生成双因子密钥与恢复码
      description: >-
        为当前登录用户生成待启用 TOTP 密钥（Base32）与 10 个一次性恢复码。权限：登录即可访问。
        需 CSRF：请求头须携带 X-CSRF-Token。明文密钥与恢复码仅本次响应返回（服务端只存
        AES-256-GCM 密文与恢复码 SHA-256 哈希），须立即保存；重复调用覆盖旧的待启用密钥。
        已开启双因子时返回 409，须先关闭再重新设置。限流：按来源 IP 10 次/分钟，超限返回 429。
      responses:
        '200':
          description: 待启用密钥与恢复码（明文仅本次返回）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTOTPSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 已开启双因子认证，须先关闭后再重新设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/totp/enable:
    post:
      operationId: authTOTPEnable
      tags: [auth]
      summary: 启用双因子认证
      description: >-
        用 /auth/totp/setup 生成的待启用密钥验证 6 位动态令牌，通过后正式开启双因子认证
        （pending 密钥转正）。权限：登录即可访问。需 CSRF：请求头须携带 X-CSRF-Token。
        无待启用密钥时返回 409（请先调用 setup）。限流：按来源 IP 10 次/分钟，超限返回 429。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTOTPCodeRequest'
      responses:
        '200':
          description: 双因子认证已开启
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: 动态令牌格式错误或校验失败（TOTP_INVALID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 无待启用密钥（须先 setup）或已开启双因子认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/totp/disable:
    post:
      operationId: authTOTPDisable
      tags: [auth]
      summary: 关闭双因子认证（高危）
      description: >-
        验证 6 位动态令牌或一次性恢复码（xxxx-xxxx）后关闭双因子认证，并清除密钥与全部恢复码。
        权限：登录即可访问。需 CSRF：请求头须携带 X-CSRF-Token。操作审计记录为高危（HIGH）。
        限流：按来源 IP 10 次/分钟，超限返回 429。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTOTPCodeRequest'
      responses:
        '200':
          description: 双因子认证已关闭
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: 动态令牌或恢复码错误（TOTP_INVALID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 未开启双因子认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profile:
    get:
      operationId: profileGet
      tags: [profile]
      summary: 获取个人资料
      description: >-
        返回当前登录用户的资料、角色、权限点及权限中文明细（permission_details）。
        权限：登录即可访问。
      responses:
        '200':
          description: 个人资料与权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: profileUpdate
      tags: [profile]
      summary: 修改个人资料（显示名称）
      description: >-
        修改当前用户的显示名称（仅 display_name，1-128 字符），采用乐观锁：
        version 须与当前资料版本一致，否则返回 409。权限：登录即可访问。
        需 CSRF：请求头须携带 X-CSRF-Token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: 修改成功，返回更新后的资料（不含 permissions 字段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 资料已被其他操作修改（乐观锁冲突），请刷新后重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profile/login-logs:
    get:
      operationId: profileLoginLogList
      tags: [profile]
      summary: 我的登录记录
      description: >-
        分页查询当前登录用户自己的登录日志。权限：登录即可访问。
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页条数（超过 100 按 20 处理）
      responses:
        '200':
          description: 分页登录记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      operationId: userList
      tags: [users]
      summary: 用户列表
      description: >-
        分页查询用户（不含已逻辑删除用户），支持用户名/显示名模糊搜索、状态与角色过滤。
        权限：users.read。
      parameters:
        - name: username
          in: query
          schema: { type: string }
          description: 用户名或显示名关键字（模糊匹配，不区分大小写）
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, DISABLED, LOCKED, DELETED] }
          description: 按状态过滤
        - name: role_code
          in: query
          schema: { type: string, enum: [SYSTEM_ADMIN, SECURITY_ADMIN, AUDIT_ADMIN] }
          description: 按内置角色编码过滤
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页条数（超过 100 按 20 处理）
      responses:
        '200':
          description: 分页用户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: userCreate
      tags: [users]
      summary: 创建用户（返回一次性临时密码）
      description: >-
        创建管理用户并分配一个内置三权角色。权限：users.create。
        需 CSRF：请求头须携带 X-CSRF-Token。
        用户名规则：4-64 位，仅字母/数字/下划线/短横线，不区分大小写唯一，不得为保留名（root/system/anonymous/null/undefined）。
        服务端生成 16 位临时密码，仅在创建响应中返回一次（不落日志与审计）；
        新用户 must_change_password=true，首次登录必须修改密码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: 创建成功（temporary_password 仅本次返回）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 用户名已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      operationId: userGet
      tags: [users]
      summary: 用户详情
      description: >-
        查询指定用户详情（含角色）。权限：users.read。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 用户 ID
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: userUpdate
      tags: [users]
      summary: 修改用户（含角色变更，乐观锁）
      description: >-
        修改用户显示名称，可选变更角色（三权互斥，一个用户仅一个内置管理角色）。
        权限：users.update。需 CSRF：请求头须携带 X-CSRF-Token。
        乐观锁：version 须与当前一致，否则返回 409。
        role_code 为空表示不变更角色；角色变更后该用户全部会话失效，
        且不允许移除最后一个可用系统管理员的角色（返回 409）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 用户 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 修改成功，返回更新后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本冲突或不能移除最后一个系统管理员的角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: userDelete
      tags: [users]
      summary: 删除用户（逻辑删除）
      description: >-
        逻辑删除用户并撤销其全部会话。权限：users.update（注意：删除复用 users.update 权限点）。
        需 CSRF：请求头须携带 X-CSRF-Token。
        不能删除当前登录账号或最后一个可用系统管理员（返回 409）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 用户 ID
      responses:
        '200':
          description: 用户已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 不能删除当前登录账号或最后一个系统管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/enable:
    post:
      operationId: userEnable
      tags: [users]
      summary: 启用用户
      description: >-
        将用户状态置为 ACTIVE。权限：users.disable（启用/停用共用同一权限点）。
        需 CSRF：请求头须携带 X-CSRF-Token。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 用户 ID
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
