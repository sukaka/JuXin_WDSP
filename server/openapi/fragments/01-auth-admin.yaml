  /login-logs:
    get:
      operationId: loginLogList
      tags: [login-logs]
      summary: 登录日志查询
      description: >-
        分页查询登录日志。权限：登录即可访问；
        持有 login_logs.read 权限（审计管理员）可查询全部用户，否则强制仅返回本人记录。
      parameters:
        - name: username
          in: query
          schema: { type: string }
          description: 用户名关键字（模糊匹配）
        - name: source_ip
          in: query
          schema: { type: string }
          description: 来源 IP（精确匹配）
        - name: result
          in: query
          schema: { type: string, enum: [SUCCESS, FAILURE] }
          description: 按结果过滤
        - name: event_type
          in: query
          schema:
            type: string
            enum: [LOGIN_SUCCESS, LOGIN_FAILURE, CAPTCHA_FAILURE, ACCOUNT_LOCKED, LOGOUT, FORCE_LOGOUT, SESSION_EXPIRED, PASSWORD_CHANGE, PASSWORD_RESET, FIRST_CHANGE_PASSWORD]
          description: 按事件类型过滤
        - name: request_id
          in: query
          schema: { type: string }
          description: 按请求 ID 精确过滤（用于链路追踪）
        - name: start_time
          in: query
          schema: { type: string, format: date-time }
          description: 起始时间（RFC3339，含边界）
        - name: end_time
          in: query
          schema: { type: string, format: date-time }
          description: 截止时间（RFC3339，含边界）
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页条数（超过 100 按 20 处理）
      responses:
        '200':
          description: 分页登录日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

