        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /custom-rules/{id}/validate:
    post:
      operationId: customRuleValidate
      tags: [custom-rules]
      summary: 校验自定义规则（不保存）
      description: |
        按创建相同的规则校验请求体并试生成 SecLang，但不写库、不校验规则 ID 冲突，
        路径中的 id 不被解析（新建场景前端可传 `new` 占位）。校验失败仍返回 200 且 valid=false。
