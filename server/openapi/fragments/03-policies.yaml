# 九章 WDSP 管理 API 片段：WAF 防护策略域（阶段4）
# 路由源：server/internal/app/app.go 第 530-571 行
# 覆盖：/protection-policies（含 /copy /applications）、/waf-rules（含 /categories /versions /sync）、
#       /rule-overrides、/custom-rules（含 /validate /enable /disable）、/exceptions（含 /enable /disable /preview）

paths:
  # ==================== 防护策略 ====================
  /protection-policies:
    get:
      operationId: policyList
      tags: [protection-policies]
      summary: 防护策略列表
      description: |
        分页查询 WAF 防护策略，支持关键字（编码/名称模糊匹配）与防护模式过滤，
        按内置优先、创建时间倒序排列。权限：`protection_policies.read`
      parameters:
        - name: keyword
          in: query
          required: false
          schema: { type: string }
          description: 关键字，模糊匹配策略编码或名称
        - name: protection_mode
          in: query
          required: false
          schema: { type: string, enum: [OFF, OBSERVE, PROTECT] }
          description: 按防护模式过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码，默认 1
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页条数，默认 20，最大 100
      responses:
        '200':
          description: 策略分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: policyCreate
      tags: [protection-policies]
      summary: 创建防护策略
      description: |
        创建 WAF 防护策略。未提供的可选字段使用服务端默认值：protection_mode=OBSERVE、
        paranoia_level=1、inbound_anomaly_threshold=5、outbound_anomaly_threshold=4、
        request_body_access=true、response_body_access=false；请求体/响应体大小限制、
        解析器开关、审计日志与阻断页面等高级字段由服务端按内置基线设置（如 request_body_limit=13107200、
        blocking_status_code=403）。策略编码全局唯一。记录操作审计（风险：中）。
        权限：`protection_policies.create`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpsertRequest'
      responses:
        '200':
          description: 创建成功，返回新策略（usage_count 为 0）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 策略编码已存在（RESOURCE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /protection-policies/{id}:
    get:
      operationId: policyGet
      tags: [protection-policies]
      summary: 防护策略详情
      description: |
        查询单个防护策略详情，附加当前绑定的应用 ID 列表（application_ids）。
        权限：`protection_policies.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 策略 ID
      responses:
        '200':
          description: 策略详情（含 application_ids）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: policyUpdate
      tags: [protection-policies]
      summary: 更新防护策略
      description: |
        更新防护策略，采用乐观锁：请求体 version 必须与当前版本一致，否则返回 409。
        内置策略（is_builtin=true）不允许修改，返回 403。记录操作审计（风险：中）。
        权限：`protection_policies.update`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 策略 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpsertRequest'
      responses:
        '200':
          description: 更新成功，返回更新后的策略（version 已递增）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无权限，或内置策略不允许修改（PERMISSION_DENIED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本冲突，策略已被其他人修改（RESOURCE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: policyDelete
      tags: [protection-policies]
      summary: 删除防护策略
      description: |
        删除防护策略（软删除）。内置策略不可删除（403）；仍被应用引用的策略不可删除（409）。
        记录操作审计（风险：高）。权限：`protection_policies.delete`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 策略 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 无权限，或内置策略不允许删除（PERMISSION_DENIED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 策略正在被应用引用，无法删除（RESOURCE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /protection-policies/{id}/copy:
    post:
      operationId: policyCopy
      tags: [protection-policies]
      summary: 复制防护策略
      description: |
        以现有策略为模板创建副本：新编码为「原编码-copy」（冲突时追加序号），名称追加「（副本）」，
        副本一律为非内置策略。无请求体。记录操作审计（风险：低）。
        权限：`protection_policies.create`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 源策略 ID
      responses:
        '200':
          description: 复制成功，返回新策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /protection-policies/{id}/applications:
    get:
      operationId: policyListApplications
      tags: [protection-policies]
      summary: 查询策略绑定的应用
      description: |
        返回当前绑定该策略（is_active）的应用 ID 列表与数量。
        权限：`protection_policies.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 策略 ID
      responses:
        '200':
          description: 应用 ID 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyApplicationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: policyBindApplication
      tags: [protection-policies]
      summary: 绑定策略到应用
      description: |
        将策略绑定到指定应用。一个应用同时只有一个活动策略：绑定新策略会将该应用原有绑定置为失效，
        同一（应用, 策略）重复绑定幂等（ON CONFLICT 重新激活）。绑定后需发布配置方可生效。
        记录操作审计（风险：中）。权限：`protection_policies.update`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 策略 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyBindRequest'
      responses:
        '200':
          description: 绑定成功（提示发布配置后生效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /protection-policies/{id}/applications/{app_id}:
    delete:
      operationId: policyUnbindApplication
      tags: [protection-policies]
      summary: 解绑应用上的防护策略
      description: |
        解除指定应用与该策略的绑定。仅当应用当前活动策略确为本策略时才执行解绑，
        否则返回 404。解绑后需发布配置方可生效。记录操作审计（风险：中）。
        权限：`protection_policies.update`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 策略 ID
        - name: app_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 应用 ID
      responses:
        '200':
          description: 解绑成功（提示发布配置后生效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 策略不存在，或应用未绑定该策略（RESOURCE_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== WAF 规则（元数据） ====================
  /waf-rules:
    get:
      operationId: wafRuleList
      tags: [waf-rules]
      summary: WAF 规则列表
      description: |
        分页查询 WAF 规则元数据（OWASP CRS 主包/插件、第三方与自建规则包、九章内置、用户自定义），
        按规则 ID 升序排列。权限：`waf_rules.read`
      parameters:
        - name: rule_id
          in: query
          required: false
          schema: { type: integer }
          description: 按 SecRule 规则 ID 精确过滤
        - name: keyword
          in: query
          required: false
          schema: { type: string }
          description: 关键字，模糊匹配规则名称或消息
        - name: attack_type
          in: query
          required: false
          schema:
            type: string
            enum: [SQL_INJECTION, XSS, COMMAND_INJECTION, LOCAL_FILE_INCLUSION, REMOTE_FILE_INCLUSION, PHP_INJECTION, JAVA_INJECTION, PROTOCOL_VIOLATION, SESSION_FIXATION, SCANNER_DETECTION, INFORMATION_DISCLOSURE, REMOTE_CODE_EXECUTION, SSRF, XXE_INJECTION, WEBSHELL, FILE_UPLOAD, DESERIALIZATION, SSTI, DOS, MASS_ASSIGNMENT, EXCLUSION, OTHER]
          description: 按攻击类型过滤
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [CRITICAL, ERROR, WARNING, NOTICE] }
          description: 按严重级别过滤
        - name: rule_source
          in: query
          required: false
          schema:
            type: string
            enum: [OWASP_CRS, CRS_PLUGIN, THIRD_PARTY, CUSTOM_PACK, JIUZHANG_BUILTIN, USER_CUSTOM]
          description: 按规则来源过滤
        - name: tag
          in: query
          required: false
          schema: { type: string }
          description: 按标签模糊过滤（匹配 tags JSON 文本）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码，默认 1
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页条数，默认 20，最大 100
      responses:
        '200':
          description: 规则分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WafRuleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /waf-rules/categories:
    get:
      operationId: wafRuleCategories
      tags: [waf-rules]
      summary: 规则分类统计
      description: |
        按攻击类型统计规则数量，按数量降序排列。权限：`waf_rules.read`
      responses:
        '200':
          description: 分类统计列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WafRuleCategoriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /waf-rules/versions:
    get:
      operationId: wafRuleVersions
      tags: [waf-rules]
      summary: CRS 规则版本列表
      description: |
        返回已入库的 OWASP_CRS 来源规则的 crs_version 去重列表，按版本倒序排列。
        权限：`waf_rules.read`
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WafRuleVersionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /waf-rules/{rule_id}:
    get:
      operationId: wafRuleGet
      tags: [waf-rules]
      summary: WAF 规则详情
      description: |
        按 SecRule 规则 ID 查询单条规则元数据；同一规则 ID 存在多个 CRS 版本时返回最新版本。
        权限：`waf_rules.read`
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: { type: integer }
          description: SecRule 规则 ID（非数据库主键）
      responses:
        '200':
          description: 规则详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WafRule'
        '400':
          description: 规则 ID 格式非法（须为整数）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /waf-rules/sync:
    post:
      operationId: wafRuleSync
      tags: [waf-rules]
      summary: 同步规则元数据
      description: |
        从本地规则目录解析并同步规则元数据到数据库，来源包括：CRS 主包、CRS 插件目录
        （<crs_root>/plugins/*/plugins）以及 contrib 分包目录（THIRD_PARTY、CUSTOM_PACK，
        目录不存在时自动跳过）。按内容哈希做增量新增/更新，各来源独立去重
        （rule_id + rule_source + crs_version 唯一）。无请求体。同步完成后需发布配置方可生效。
        记录操作审计（风险：中）。权限：`waf_rules.sync`
      responses:
        '200':
          description: 同步完成，返回同步报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WafRuleSyncReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== 规则覆盖 ====================
  /rule-overrides:
    get:
      operationId: ruleOverrideList
      tags: [rule-overrides]
      summary: 规则覆盖列表
      description: |
        分页查询 CRS/WAF 规则覆盖，按规则 ID、作用域类型、创建时间倒序排列。
        权限：`rule_overrides.manage`
      parameters:
        - name: rule_id
          in: query
          required: false
          schema: { type: integer }
          description: 按目标规则 ID 过滤
        - name: scope_type
          in: query
          required: false
          schema: { type: string, enum: [GLOBAL, POLICY, APPLICATION] }
          description: 按作用域类型过滤
        - name: scope_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按作用域对象（策略/应用）ID 过滤；非 UUID 返回 400
        - name: action
          in: query
          required: false
          schema: { type: string, enum: [DISABLE, ENABLE, SEVERITY_OVERRIDE, ACTION_OVERRIDE] }
          description: 按覆盖动作过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码，默认 1
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页条数，默认 20，最大 100
      responses:
        '200':
          description: 覆盖分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleOverrideListResponse'
        '400':
          description: scope_id 格式非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: ruleOverrideCreate
      tags: [rule-overrides]
      summary: 创建规则覆盖
      description: |
        创建规则覆盖。同一（rule_id + scope_type + scope_id）仅允许一条覆盖，冲突返回 409。
        生效优先级：APPLICATION > POLICY > GLOBAL；ENABLE 可覆盖同层/下层的 DISABLE。
        当前发布管线仅对 DISABLE 动作生成 ctl:ruleRemoveById 指令，其余动作可入库但暂不生效。
        创建后需发布配置方可生效。记录操作审计（风险：中）。权限：`rule_overrides.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleOverrideUpsertRequest'
      responses:
        '200':
          description: 创建成功（提示发布配置后生效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleOverrideResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 同范围下该规则已有覆盖（RESOURCE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /rule-overrides/{id}:
    get:
      operationId: ruleOverrideGet
      tags: [rule-overrides]
      summary: 规则覆盖详情
      description: |
        查询单条规则覆盖。权限：`rule_overrides.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 覆盖 ID
      responses:
        '200':
          description: 覆盖详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleOverrideDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: ruleOverrideUpdate
      tags: [rule-overrides]
      summary: 更新规则覆盖
      description: |
        更新规则覆盖。请求体 version 非 0 时启用乐观锁校验，与当前版本不一致返回 409；
