      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: 占位参数，服务端不解析；新建时传 new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRuleUpsertRequest'
      responses:
        '200':
          description: 校验结果（valid=false 时 error 给出原因；valid=true 时 generated_rule 给出 SecLang）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRuleValidateResult'
        '400':
          description: 请求体不是合法 JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

