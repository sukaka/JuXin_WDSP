        更新自定义规则，采用乐观锁：请求体 version 必须与当前版本一致，否则返回 409。
        rule_id 不可修改（请求体中的 rule_id 被忽略）；其余字段重新校验并重新生成 SecLang。
        更新后需发布配置方可生效。记录操作审计（风险：中）。权限：`custom_rules.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 规则记录 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRuleUpsertRequest'
      responses:
        '200':
          description: 更新成功，返回更新后的规则（version 已递增）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本冲突，规则已被其他人修改（RESOURCE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: customRuleDelete
      tags: [custom-rules]
      summary: 删除自定义规则
      description: |
        删除自定义规则（物理删除）。删除后需发布配置方可生效。
        记录操作审计（风险：高）。权限：`custom_rules.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 规则记录 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
