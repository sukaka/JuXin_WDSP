      summary: 自定义规则列表
      description: |
        分页查询九章自定义 WAF 规则，按规则 ID 升序排列。权限：`custom_rules.manage`
      parameters:
        - name: keyword
          in: query
          required: false
          schema: { type: string }
          description: 关键字，模糊匹配规则名称、描述或规则 ID
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ENABLED, DISABLED] }
          description: 按状态过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码，默认 1
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页条数，默认 20，最大 100
      responses:
        '200':
          description: 自定义规则分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRuleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: customRuleCreate
      tags: [custom-rules]
      summary: 创建自定义规则
      description: |
        创建自定义 WAF 规则：服务端按白名单校验操作符/检测变量/动作，禁止危险内容
        （命令执行、文件读取、命令替换等），rx 操作符额外校验正则语法，并生成对应 SecLang 文本。
        规则 ID 必须在 7100000-7199999 区间且全库唯一；新规则默认 ENABLED、GLOBAL 作用域。
        创建后需发布配置方可生效。记录操作审计（风险：中）。权限：`custom_rules.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRuleUpsertRequest'
      responses:
        '200':
          description: 创建成功，返回新规则（含 generated_rule）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRule'
        '400':
          description: 校验失败（含规则 ID 越界/冲突、非法操作符、危险内容、正则语法错误等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

