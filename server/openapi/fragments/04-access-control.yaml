        - { name: action, in: query, schema: { type: string, enum: [LOG, OBSERVE, REJECT, TEMP_BLOCK] }, description: 按触发动作筛选 }
        - { name: keyword, in: query, schema: { type: string }, description: 关键字（模糊匹配名称） }
        - { name: application_id, in: query, schema: { type: string, format: uuid }, description: 按应用筛选 }
        - { name: page, in: query, schema: { type: integer, default: 1 }, description: 页码 }
