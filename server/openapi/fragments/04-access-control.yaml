  # ==================== 事件→黑名单联动（阶段5 §十一） ====================
  /security-events/{id}/blacklist-prefill:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 安全事件 ID
    get:
      operationId: securityEventBlacklistPrefill
      tags: [access-rules]
      summary: 从安全事件预填「加入黑名单」数据
      description: |-
        只读不落库、不审计。按事件 client_ip 聚合近 24h 相关事件数/最近攻击时间/命中规则（Top10），
        检查该 IP 是否命中保护地址、是否疑似共享出口/代理（同 IP 近 24h 关联身份数 ≥2；无任何身份数据时省略该项），
        并给出建议封禁时长（HIGH→24h、MEDIUM→6h、LOW→2h、INFO→1h；相关事件 ≥10 升一档、≥50 直接 72h；上限 72h）。
        管理员确认后走 POST /access-rules 并携带 source_type=SECURITY_EVENT + source_event_id。权限：`access_rules.manage`
      responses:
        '200':
          description: 预填数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlacklistPrefillResponse' }
        '400': { description: 事件 ID 无效或事件无客户端 IP }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

