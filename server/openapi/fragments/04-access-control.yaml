# 片段：访问控制与 CC 防护（阶段5）+ 威胁情报导入（WDSP P2-C1）
# 路由源：server/internal/app/app.go 第 1166-1232 行
# 域：可信代理 / 保护地址 / IP黑白名单 / 威胁情报导入 / CC防护策略 / 临时封禁 / 访问控制事件 / 配置版本
paths:
  # ==================== 可信代理 ====================
  /trusted-proxies:
    get:
      operationId: trustedProxyList
      tags: [trusted-proxies]
      summary: 可信代理分页列表
      description: 按状态/代理头类型/关键字筛选可信代理，按优先级升序、创建时间倒序排列。权限：`trusted_proxies.read`
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ENABLED, DISABLED] }, description: 按状态筛选 }
        - { name: header_type, in: query, schema: { type: string, enum: [X_FORWARDED_FOR, X_REAL_IP, FORWARDED, CUSTOM] }, description: 按代理头类型筛选 }
        - { name: keyword, in: query, schema: { type: string }, description: 关键字（模糊匹配名称或 CIDR） }
        - { name: page, in: query, schema: { type: integer, default: 1 }, description: 页码 }
        - { name: page_size, in: query, schema: { type: integer, default: 20 }, description: 每页条数（最大 100） }
      responses:
        '200':
          description: 分页可信代理列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustedProxyListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: trustedProxyCreate
      tags: [trusted-proxies]
      summary: 创建可信代理
      description: 创建可信代理（初始状态 ENABLED；CIDR 入库前规范化并派生 IP 版本）。相同地址与节点的代理已存在时返回 409。记录中风险审计。权限：`trusted_proxies.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrustedProxyCreateRequest' }
      responses:
        '200':
          description: 创建成功，返回完整代理对象
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustedProxyDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 相同地址与节点的可信代理已存在 }
        '500': { $ref: '#/components/responses/InternalError' }

  /trusted-proxies/test:
    post:
      operationId: trustedProxyTest
      tags: [trusted-proxies]
      summary: 可信代理命中测试
      description: 纯计算不落库、不审计：返回每个测试 IP 是否被输入的 CIDR 命中，以及当前库中全部启用代理对该 IP 的匹配结果。测试 IP 数量须为 1-100。权限：`trusted_proxies.read`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrustedProxyTestRequest' }
      responses:
        '200':
          description: 命中测试结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustedProxyTestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /trusted-proxies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 可信代理 ID
    get:
      operationId: trustedProxyGet
      tags: [trusted-proxies]
      summary: 可信代理详情
      description: 按 ID 查询可信代理。权限：`trusted_proxies.read`
      responses:
        '200':
          description: 可信代理详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustedProxyDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: trustedProxyUpdate
      tags: [trusted-proxies]
      summary: 更新可信代理（乐观锁）
      description: 全量更新可信代理，`version` 与当前版本不一致返回 409。记录中风险审计。权限：`trusted_proxies.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrustedProxyUpdateRequest' }
      responses:
        '200':
          description: 更新成功，返回更新后的代理对象
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustedProxyDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 版本冲突（已被他人修改）或相同地址与节点的代理已存在 }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: trustedProxyDelete
      tags: [trusted-proxies]
      summary: 删除可信代理（软删除）
      description: 软删除可信代理。记录中风险审计。权限：`trusted_proxies.manage`
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /trusted-proxies/{id}/enable:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 可信代理 ID
    post:
      operationId: trustedProxyEnable
      tags: [trusted-proxies]
      summary: 启用可信代理
      description: 将可信代理置为 ENABLED。记录低风险审计。权限：`trusted_proxies.manage`
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /trusted-proxies/{id}/disable:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 可信代理 ID
    post:
      operationId: trustedProxyDisable
      tags: [trusted-proxies]
      summary: 停用可信代理
      description: 将可信代理置为 DISABLED（改变真实 IP 识别信任边界）。记录中风险审计。权限：`trusted_proxies.manage`
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 保护地址 ====================
  /protected-addresses:
    get:
      operationId: protectedAddrList
      tags: [protected-addresses]
      summary: 保护地址分页列表
      description: 返回启用中（ENABLED）的保护地址，可按地址类型筛选，按创建时间升序排列。权限：`protected_addresses.read`
      parameters:
        - { name: address_type, in: query, schema: { type: string, enum: [GATEWAY, MANAGEMENT, UPSTREAM, DATABASE, CACHE, TRUSTED_PROXY, LOOPBACK, LINK_LOCAL, CUSTOM] }, description: 按地址类型筛选 }
        - { name: page, in: query, schema: { type: integer, default: 1 }, description: 页码 }
        - { name: page_size, in: query, schema: { type: integer, default: 20 }, description: 每页条数（最大 100） }
      responses:
        '200':
          description: 分页保护地址列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedAddrListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: protectedAddrCreate
      tags: [protected-addresses]
      summary: 创建自定义保护地址
      description: 创建 source_type=MANUAL、address_type=CUSTOM 的保护地址；`address` 与 `cidr` 必须且只能填写一个。相同地址已存在返回 409。记录中风险审计。权限：`protected_addresses.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtectedAddrCreateRequest' }
      responses:
        '200':
          description: 创建成功，返回完整保护地址对象
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedAddrDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 相同地址的保护地址已存在 }
        '500': { $ref: '#/components/responses/InternalError' }

  /protected-addresses/refresh:
    post:
      operationId: protectedAddrRefresh
      tags: [protected-addresses]
      summary: 自动登记系统保护地址（幂等）
      description: 扫描回环/链路本地地址、环境变量中的组件地址、活动源站与启用中的可信代理，自动登记 SYSTEM 保护地址；已存在同地址记录则跳过，可安全重复调用。记录低风险审计。权限：`protected_addresses.manage`
      responses:
        '200':
          description: 登记结果（新增数与跳过数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtectedAddrRefreshResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /protected-addresses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 保护地址 ID
    delete:
      operationId: protectedAddrDelete
      tags: [protected-addresses]
      summary: 删除保护地址
      description: 仅 MANUAL 来源的保护地址可删除；尝试删除 SYSTEM 地址返回 409 并记录高风险失败审计。成功删除记录中风险审计。权限：`protected_addresses.manage`
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 系统自动登记的保护地址不可删除 }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== IP 黑白名单 ====================
  /access-rules:
    get:
      operationId: accessRuleList
      tags: [access-rules]
      summary: IP 黑白名单规则分页列表
      description: 按类型/范围/状态/来源/关键字/地址筛选规则。权限：`access_rules.read`
      parameters:
        - { name: rule_type, in: query, schema: { type: string, enum: [ALLOW, DENY] }, description: 规则类型（ALLOW 白名单 / DENY 黑名单） }
        - { name: scope_type, in: query, schema: { type: string, enum: [GLOBAL, APPLICATION] }, description: 生效范围 }
        - { name: application_id, in: query, schema: { type: string, format: uuid }, description: 按应用筛选 }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, ACTIVE, DISABLED, EXPIRED] }, description: 按状态筛选 }
        - { name: source_type, in: query, schema: { type: string, enum: [MANUAL, SECURITY_EVENT, IMPORT, AUTO_BLOCK, SYSTEM] }, description: 按来源筛选 }
        - { name: keyword, in: query, schema: { type: string }, description: 关键字（模糊匹配名称或地址） }
        - { name: address, in: query, schema: { type: string }, description: 地址精确匹配（先规范化再匹配） }
        - { name: page, in: query, schema: { type: integer, default: 1 }, description: 页码 }
        - { name: page_size, in: query, schema: { type: integer, default: 20 }, description: 每页条数（最大 100） }
      responses:
        '200':
          description: 分页规则列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRuleListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: accessRuleCreate
      tags: [access-rules]
      summary: 创建 IP 黑白名单规则
      description: |
        创建规则（初始状态 ACTIVE）。DENY 规则地址命中保护地址时拒绝（400）并记录高风险失败审计。
        相同范围下同地址同类型规则冲突返回 409。记录中风险审计。权限：`access_rules.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRuleCreateRequest' }
      responses:
        '200':
          description: 创建成功，返回完整规则对象
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRuleDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 相同范围下已存在同地址同类型规则 }
        '500': { $ref: '#/components/responses/InternalError' }

  /access-rules/validate:
    post:
      operationId: accessRuleValidate
      tags: [access-rules]
      summary: 校验规则输入（不落库）
      description: 校验规则字段、保护地址冲突与同范围重复，返回错误列表；不产生任何写入。权限：`access_rules.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRuleCreateRequest' }
      responses:
        '200':
          description: 校验结果（valid=false 时 errors 给出原因）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRuleValidateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /access-rules/import:
    post:
      operationId: accessRuleImport
      tags: [access-rules]
      summary: 批量导入规则（JSON 携带 CSV/纯文本内容）
      description: |
        JSON 请求体携带导入内容（非文件上传）：`content` 为 CSV（含表头，必须含 address 列，识别列
        address,rule_type,scope_type,application_code,effective_until,reason）或纯文本（每行一个地址），
        内容 ≤1MB、行数 ≤10000。`dry_run=true` 时只校验并返回前 50 条预览，不落库。
        ALL_OR_NOTHING 模式存在错误行时整体不导入并返回 400（details 为行级错误）；
        SKIP_ERRORS 模式跳过错误行逐条插入。正式导入成功的规则统一落 DRAFT 草稿状态：不参与发布快照、
        不在网关生效，需逐条调用启用接口进入 ACTIVE。记录审计（含保护地址错误时高风险）。权限：`access_rules.import`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRuleImportRequest' }
      responses:
        '200':
          description: 导入结果（dry_run 时含 preview；正式导入含 imported）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRuleImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: ALL_OR_NOTHING 模式批量落库时存在冲突规则 }
        '500': { $ref: '#/components/responses/InternalError' }

  /access-rules/export:
    get:
      operationId: accessRuleExport
      tags: [access-rules]
      summary: 导出规则 CSV
      description: |
        按筛选条件导出规则 CSV（含表头，防公式注入，最多 10000 条），
        列为 id,name,rule_type,scope_type,application_code,address,ip_version,priority,status,validity_type,
        effective_from,effective_until,reason,source_type,hit_count,last_hit_at,created_at。
        响应头 Content-Disposition 附件文件名形如 ip_access_rules_YYYYMMDD.csv。
        限流：每 IP 5 次/分钟（导出类接口共享）。记录低风险审计。权限：`access_rules.read`
      parameters:
        - { name: rule_type, in: query, schema: { type: string, enum: [ALLOW, DENY] }, description: 规则类型 }
        - { name: scope_type, in: query, schema: { type: string, enum: [GLOBAL, APPLICATION] }, description: 生效范围 }
        - { name: application_id, in: query, schema: { type: string, format: uuid }, description: 按应用筛选 }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, ACTIVE, DISABLED, EXPIRED] }, description: 按状态筛选 }
        - { name: source_type, in: query, schema: { type: string, enum: [MANUAL, SECURITY_EVENT, IMPORT, AUTO_BLOCK, SYSTEM] }, description: 按来源筛选 }
        - { name: keyword, in: query, schema: { type: string }, description: 关键字（模糊匹配名称或地址） }
        - { name: address, in: query, schema: { type: string }, description: 地址精确匹配 }
      responses:
        '200':
          description: CSV 文件流（text/csv; charset=utf-8）
          content:
            text/csv:
              schema: { type: string, description: CSV 文本（含表头） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: 导出频率超限（每 IP 5 次/分钟） }
        '500': { $ref: '#/components/responses/InternalError' }

  /access-rules/publish:
    post:
      operationId: accessRulePublish
      tags: [access-rules]
      summary: 发布访问控制配置到网关
      description: |
        将当前访问控制配置发布到防护网关（与配置发布共用发布任务模型，同步执行并返回任务结果）。
        `idempotency_key` 用于幂等去重，重复键返回原任务。记录高风险审计。
        注意：该路由仅在网关发布器装配时注册，未装配时返回 404。权限：`access_rules.publish`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRulePublishRequest' }
      responses:
        '200':
          description: 发布任务结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRulePublishTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /threat-intel/import:
    post:
      operationId: threatIntelImport
      tags: [access-rules]
      summary: 威胁情报对账导入（WDSP P2-C1，Feodo C2 → IP 黑名单）
      description: |
        解析情报快照（`format=text` 纯文本一行一个 IPv4、# 注释忽略、可剥 :port；`format=csv`
        Feodo CSV，按表头自适应取 dst_ip/ip 列与 malware/c2_family 列），与本功能历史导入集合
        （`source_type=IMPORT` 且 reason 以「威胁情报 <feed> 批次」开头的 GLOBAL DENY 行）做集合对账：
        新 IP 新建 ACTIVE 规则（ttl_days>0 时 TEMPORARY+effective_until=now+TTL，0 为 PERMANENT）；
        仍在册刷新有效期与 reason 批次号（EXPIRED 复活、DISABLED 人工停用不动）；本批次消失标记
        EXPIRED 保留历史。绝不触碰 MANUAL/SECURITY_EVENT/AUTO_BLOCK/SYSTEM 及其他 reason 前缀的
        IMPORT 行；同址已存在人工黑名单时跳过新建。content ≤1MB、有效 IP ≤5000，坏行跳过计数
        （明细前 50 条）。生效集变化时触发网关配置发布（异步任务）。记录中风险审计。
        权限：`access_rules.import`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThreatIntelImportRequest' }
      responses:
        '200':
