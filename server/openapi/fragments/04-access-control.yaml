      operationId: rateLimitCreate
      tags: [rate-limit-policies]
      summary: 创建 CC 防护策略
      description: 创建策略（初始状态 ACTIVE）；校验未通过返回 400 且 details 为字段级错误列表。记录中风险审计。权限：`rate_limits.manage`
