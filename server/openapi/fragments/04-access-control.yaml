        将当前 CC 防护配置发布到防护网关（与配置发布共用发布任务模型，同步执行并返回任务结果）。
        `idempotency_key` 用于幂等去重，重复键返回原任务。记录高风险审计。
        注意：该路由仅在网关发布器装配时注册，未装配时返回 404。权限：`rate_limits.publish`
