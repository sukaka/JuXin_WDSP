        schema: { type: string, format: uuid }
        description: 规则 ID
    get:
      operationId: accessRuleEvents
      tags: [access-rules]
      summary: 规则关联事件分页列表
      description: |
        查询该规则命中的访问控制事件（按 access_control_events.access_rule_id 过滤：
        IP 黑白名单命中 IP_ALLOW_MATCH/IP_DENY_MATCH 与 L7 规则命中 L7_RULE_* 事件均写入规则 ID）。
        支持通用事件筛选参数（时间范围/事件类型/动作/客户端IP 等），规则不存在时返回空分页（列表过滤语义）。
        记录低风险审计。权限：`access_rules.read`
      parameters:
        - { name: start_time, in: query, schema: { type: string, format: date-time }, description: 起始时间（RFC3339） }
        - { name: end_time, in: query, schema: { type: string, format: date-time }, description: 截止时间（RFC3339，必须晚于 start_time） }
        - { name: application_id, in: query, schema: { type: string, format: uuid }, description: 按应用筛选 }
        - { name: client_ip, in: query, schema: { type: string }, description: 按客户端 IP 筛选 }
        - { name: event_type, in: query, schema: { type: string }, description: 按事件类型筛选 }
        - { name: action, in: query, schema: { type: string, enum: [LOG, OBSERVE, REJECT, TEMP_BLOCK] }, description: 按动作筛选 }
        - { name: request_id, in: query, schema: { type: string }, description: 按请求 ID 筛选 }
        - { name: gateway_node_id, in: query, schema: { type: string }, description: 按网关节点筛选 }
        - { name: page, in: query, schema: { type: integer, default: 1 }, description: 页码 }
        - { name: page_size, in: query, schema: { type: integer, default: 20 }, description: 每页条数（最大 100） }
      responses:
        '200':
          description: 分页事件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ACEventListResponse' }
        '400': { description: 参数错误（规则 ID 非法、时间格式无效或时间范围颠倒） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /access-rules/{id}/enable:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 规则 ID
    post:
      operationId: accessRuleEnable
      tags: [access-rules]
      summary: 启用规则
      description: |
        将规则置为 ACTIVE。合法来源状态：DRAFT（草稿启用）/ DISABLED（重新启用）/ ACTIVE（幂等）；
        EXPIRED 规则需先延期再启用，非法流转返回 400。记录低风险审计。权限：`access_rules.manage`
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /access-rules/{id}/disable:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 规则 ID
    post:
      operationId: accessRuleDisable
      tags: [access-rules]
      summary: 停用规则
      description: |
        将规则置为 DISABLED。合法来源状态：ACTIVE / DISABLED（幂等）/ EXPIRED；
        DRAFT 草稿尚未生效不可停用（可启用或删除），非法流转返回 400。记录低风险审计。权限：`access_rules.manage`
      responses:
        '200':
