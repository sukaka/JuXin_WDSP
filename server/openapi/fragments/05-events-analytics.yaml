  # ==================== 统计分析 ====================
  /analytics/request-trend:
    get:
      operationId: analyticsRequestTrend
      tags: [analytics]
      summary: 请求趋势
      description: >-
        请求量与耗时分位数趋势。series 键：requests（总量）、status_2xx/status_4xx/status_5xx（按状态分类）、
        p50_ms/p95_ms/p99_ms（毫秒）。另含 method_distribution（请求方法分布）、
        content_type_distribution（请求 Content-Type 主类型分布，去参数小写化，空值归入“(无)”）、
        client_ip_source_distribution（客户端 IP 识别来源分布，口径
        CONNECTION/X_FORWARDED_FOR/X_REAL_IP/FORWARDED/CUSTOM_HEADER，空值归入“(未知)”）与
        trusted_proxy_distribution（可信代理来源分布，键为命中的可信代理名，未经过可信代理归入“(直连)”），
        数据源为全量访问日志 access_logs 实时聚合（来源两列为迁移 000144 起由网关上报），值降序各最多 20 项。
        start_time/end_time 均缺省时取最近 24 小时；仅给 end_time 时向前推 24 小时；
        跨度上限 366 天。权限：analytics.security.read。
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 起始时间（RFC3339），必须早于 end_time }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 结束时间（RFC3339，右开区间） }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid }, description: 应用 ID（按应用 code 聚合标签过滤；应用不存在返回 400） }
      responses:
        '200':
          description: 请求趋势数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsTrendData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

