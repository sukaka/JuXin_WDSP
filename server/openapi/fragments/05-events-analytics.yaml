# 域片段：安全事件、日志与态势分析
# 路由源：server/internal/app/app.go 574-591 行（security-events / access-logs）、660-690 行（dashboard / analytics / system-health / system-alerts）
# 约定：所有响应 data 负载按实际 JSON 字段文档化；分页列表统一 {items, page, page_size, total}

paths:
  # ==================== 安全事件 ====================
  /security-events:
    get:
      operationId: secEventList
      tags: [security-events]
      summary: 安全事件分页列表
      description: >-
        按时间倒序返回 WAF 安全事件（Coraza/CRS 检测结果）。权限：security_events.read。
        page_size 上限 100，超出按 20 处理；列表项不含请求/响应头体留痕（为 null/空值），详情见 GET /security-events/{id}。
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 起始时间（RFC3339），按 occurred_at 过滤 }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 结束时间（RFC3339，含边界） }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid }, description: 应用 ID 精确过滤 }
        - { name: domain, in: query, required: false, schema: { type: string }, description: 域名模糊匹配（ILIKE） }
        - { name: client_ip, in: query, required: false, schema: { type: string }, description: 客户端 IP 精确匹配 }
        - { name: uri, in: query, required: false, schema: { type: string }, description: 请求 URI 模糊匹配（ILIKE） }
        - { name: method, in: query, required: false, schema: { type: string }, description: 请求方法精确匹配（如 GET/POST） }
        - { name: attack_type, in: query, required: false, schema: { type: string }, description: 攻击类型，取值见 SecEvent.attack_type }
        - { name: severity, in: query, required: false, schema: { type: string, enum: [HIGH, MEDIUM, LOW, INFO] }, description: 严重等级 }
        - { name: action, in: query, required: false, schema: { type: string, enum: [BLOCK, OBSERVE] }, description: WAF 动作 }
        - { name: disposition_status, in: query, required: false, schema: { type: string, enum: [UNPROCESSED, ANALYZING, CONFIRMED_ATTACK, CONFIRMED_FALSE_POSITIVE, IGNORED, RESOLVED] }, description: 处置状态 }
        - { name: request_id, in: query, required: false, schema: { type: string }, description: 请求 ID 精确匹配 }
        - { name: gateway_node, in: query, required: false, schema: { type: string }, description: 网关节点 ID 精确匹配 }
        - { name: rule_id, in: query, required: false, schema: { type: integer }, description: 按命中规则 ID 过滤（关联 security_event_matches） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码 }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20 }, description: 每页条数（上限 100） }
      responses:
        '200':
          description: 分页安全事件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecEventListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/export:
    get:
      operationId: secEventExport
      tags: [security-events]
      summary: 导出安全事件（CSV）
      description: >-
        导出筛选后的安全事件为 CSV 文件（security-events.csv，UTF-8 含 BOM，防公式注入），
        中文表头：发生时间,客户端 IP,域名,请求方法,请求路径,攻击类型,严重级别,异常评分,动作,响应状态码,处置状态,请求 ID
        （攻击类型、严重级别、动作与处置状态已映射为中文）。
        导出总量上限 10000 行。权限：security_events.export。导出行为记录操作审计（中风险）。
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 起始时间（RFC3339） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 结束时间（RFC3339，含边界） }
        - { name: domain, in: query, required: false, schema: { type: string }, description: 域名模糊匹配 }
        - { name: attack_type, in: query, required: false, schema: { type: string }, description: 攻击类型 }
        - { name: severity, in: query, required: false, schema: { type: string, enum: [HIGH, MEDIUM, LOW, INFO] }, description: 严重等级 }
      responses:
        '200':
          description: "CSV 文件（text/csv; charset=utf-8，Content-Disposition: attachment）"
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/{id}:
    get:
      operationId: secEventGet
      tags: [security-events]
      summary: 安全事件详情
      description: >-
        返回事件完整字段（含请求/响应头体留痕，敏感头已掩码、体超 64KB 截断）、规则匹配明细、备注、处置记录与相关事件（最多 10 条）。
        权限：security_events.read。matches/notes/actions/related 无数据时为 null。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 事件 ID }
      responses:
        '200':
          description: 事件详情聚合
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecEventDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/{id}/related:
    get:
      operationId: secEventRelated
      tags: [security-events]
      summary: 相关安全事件
      description: >-
        返回与当前事件同客户端 IP、同攻击类型或同域名的其他事件（按时间倒序，最多 20 条）。权限：security_events.read。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 事件 ID }
      responses:
        '200':
          description: 相关事件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecEventRelatedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/{id}/remediation:
    get:
      operationId: secEventRemediation
      tags: [security-events]
      summary: 事件修复建议（处置知识库）
      description: >-
        按事件攻击类型返回处置知识库内容：分析步骤、修复建议与加固建议；未知攻击类型返回通用建议。权限：security_events.read。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 事件 ID }
      responses:
        '200':
          description: 修复建议与事件摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecEventRemediationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/{id}/notes:
    post:
      operationId: secEventAddNote
      tags: [security-events]
      summary: 添加事件备注
      description: 为事件添加分析备注（1-1000 字符）。权限：security_events.disposition。记录操作审计（低风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 事件 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecEventNoteRequest' }
      responses:
        '200':
          description: 备注已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/{id}/confirm-attack:
    post:
      operationId: secEventConfirmAttack
      tags: [security-events]
      summary: 确认攻击（处置）
      description: >-
        将事件处置状态置为 CONFIRMED_ATTACK。result 缺省时取目标状态值；note 非空时追加为事件备注并拼接进处置记录。
        权限：security_events.disposition。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 事件 ID }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecEventDispositionRequest' }
      responses:
        '200':
          description: 处置完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/{id}/confirm-false-positive:
    post:
      operationId: secEventConfirmFalsePositive
      tags: [security-events]
      summary: 确认误报（处置）
      description: 将事件处置状态置为 CONFIRMED_FALSE_POSITIVE。语义同 confirm-attack。权限：security_events.disposition。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 事件 ID }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecEventDispositionRequest' }
      responses:
        '200':
          description: 处置完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/{id}/ignore:
    post:
      operationId: secEventIgnore
      tags: [security-events]
      summary: 忽略事件（处置）
      description: 将事件处置状态置为 IGNORED。语义同 confirm-attack。权限：security_events.disposition。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 事件 ID }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecEventDispositionRequest' }
      responses:
        '200':
          description: 处置完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/{id}/resolve:
    post:
      operationId: secEventResolve
      tags: [security-events]
      summary: 标记已处置
      description: 将事件处置状态置为 RESOLVED。语义同 confirm-attack。权限：security_events.disposition。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 事件 ID }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecEventDispositionRequest' }
      responses:
        '200':
          description: 处置完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/{id}/mark-analyzing:
    post:
      operationId: secEventMarkAnalyzing
      tags: [security-events]
      summary: 标记分析中（处置）
      description: 将事件处置状态置为 ANALYZING。语义同 confirm-attack。权限：security_events.disposition。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 事件 ID }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecEventDispositionRequest' }
      responses:
        '200':
          description: 处置完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /security-events/{id}/create-exception:
    post:
      operationId: secEventCreateException
      tags: [security-events]
      summary: 从事件创建例外草稿
      description: >-
        基于事件命中信息创建例外策略草稿（DRAFT 状态，自动排除 949110 等异常评分汇总规则）。
        支持空请求体（默认 30 分钟临时、仅限事件客户端 IP）或可选偏好体（名称、原因、是否限定本次 IP、有效期及命中检测规则子集）；
        应用、域名、路径、方法与来源事件均由服务端从事件记录提取，客户端不可覆盖。
        权限：exceptions.manage。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 事件 ID }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecEventCreateExceptionRequest' }
      responses:
        '200':
          description: 例外草稿已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecEventCreateExceptionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 例外服务未配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ==================== 全量访问日志 ====================
  /access-logs:
    get:
      operationId: accessLogList
      tags: [access-logs]
      summary: 访问日志分页列表
      description: >-
        启用全量访问日志后按时间倒序分页查询。权限：access_logs.read。时间范围左闭右开。
        page_size 上限 100；列表不返回请求/响应头体留痕（字段缺省），详情见 GET /access-logs/{id}。
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 起始时间（RFC3339，含边界） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 结束时间（RFC3339，不含边界） }
        - { name: domain, in: query, required: false, schema: { type: string, maxLength: 255 }, description: 域名模糊匹配（ILIKE） }
        - { name: client_ip, in: query, required: false, schema: { type: string }, description: 客户端 IP 精确匹配 }
        - { name: method, in: query, required: false, schema: { type: string, maxLength: 16 }, description: 请求方法精确匹配 }
        - { name: uri, in: query, required: false, schema: { type: string, maxLength: 2048 }, description: 请求 URI 模糊匹配（ILIKE） }
        - { name: status, in: query, required: false, schema: { type: integer, minimum: 100, maximum: 599 }, description: 响应状态码精确匹配 }
        - { name: waf_action, in: query, required: false, schema: { type: string, maxLength: 32 }, description: 实际 WAF 动作（如 ALLOW/BLOCK） }
        - { name: request_id, in: query, required: false, schema: { type: string, maxLength: 64 }, description: 请求 ID 精确匹配 }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid }, description: 应用 ID 精确匹配 }
        - { name: trace_id, in: query, required: false, schema: { type: string, pattern: '^[0-9a-f]{32}$' }, description: W3C Trace ID（非全零）精确匹配 }
        - { name: identity_fingerprint, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 通过同一请求的运行事件精确匹配身份指纹 }
        - { name: rule_id, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 通过同一请求的运行事件 details_json 精确匹配命中规则 }
        - { name: endpoint_key, in: query, required: false, schema: { type: string, maxLength: 600 }, description: 规范化API精确匹配 }
        - { name: field_path, in: query, required: false, schema: { type: string, maxLength: 512 }, description: 敏感字段结构化路径，不含字段值 }
        - { name: data_type, in: query, required: false, schema: { type: string, maxLength: 64 }, description: 敏感数据类型标签 }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [REQUEST, RESPONSE] }, description: 敏感字段方向 }
        - { name: request_ids, in: query, required: false, schema: { type: string, maxLength: 6500 }, description: 图下钻的逗号分隔请求ID集合，最多100个；不与request_id混用 }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码 }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20 }, description: 每页条数（上限 100） }
      responses:
        '200':
          description: 分页访问日志列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLogListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /access-logs/trend:
    get:
      operationId: accessLogTrend
      tags: [access-logs]
      summary: 访问日志真实趋势
      description: >-
        按访问日志时间桶聚合请求数、WAF阻断数和5xx数，权限：access_logs.read。
        与列表共用筛选条件；默认最近24小时，最长31天；不读取报文正文或PCAP。
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 起始时间（RFC3339，含边界） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 结束时间（RFC3339，不含边界） }
        - { name: bucket_seconds, in: query, required: false, schema: { type: integer, enum: [60, 300, 900, 3600, 86400] }, description: 时间桶秒数；缺省按时间窗自动选择 }
        - { name: domain, in: query, required: false, schema: { type: string, maxLength: 255 } }
        - { name: client_ip, in: query, required: false, schema: { type: string } }
        - { name: method, in: query, required: false, schema: { type: string, maxLength: 16 } }
        - { name: uri, in: query, required: false, schema: { type: string, maxLength: 2048 } }
        - { name: status, in: query, required: false, schema: { type: integer, minimum: 100, maximum: 599 } }
        - { name: waf_action, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: request_id, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: trace_id, in: query, required: false, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
        - { name: identity_fingerprint, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: rule_id, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: 真实访问日志趋势；无数据时items为空数组，不生成虚假计数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLogTrendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /access-logs/export:
    get:
      operationId: accessLogExport
      tags: [access-logs]
      summary: 导出访问日志（CSV）
      description: >-
        导出筛选后的访问日志为 CSV 文件（access-logs.csv，UTF-8 含 BOM，防公式注入），
        中文表头：发生时间,客户端 IP,域名,请求方法,请求路径,响应状态码,WAF 动作,请求大小（字节）,响应大小（字节）,耗时（ms）,网关节点,请求 ID
        （WAF 动作已映射为中文）。上限 10000 行。
        权限：access_logs.export。限流：每 IP 5 次/分钟（超限返回 429）。导出行为记录操作审计（中风险）。
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 起始时间（RFC3339，含边界） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 结束时间（RFC3339，不含边界） }
        - { name: domain, in: query, required: false, schema: { type: string, maxLength: 255 }, description: 域名模糊匹配 }
        - { name: client_ip, in: query, required: false, schema: { type: string }, description: 客户端 IP 精确匹配 }
        - { name: method, in: query, required: false, schema: { type: string, maxLength: 16 }, description: 请求方法 }
        - { name: uri, in: query, required: false, schema: { type: string, maxLength: 2048 }, description: 请求 URI 模糊匹配 }
        - { name: status, in: query, required: false, schema: { type: integer, minimum: 100, maximum: 599 }, description: 响应状态码 }
        - { name: waf_action, in: query, required: false, schema: { type: string, maxLength: 32 }, description: 实际WAF动作 }
        - { name: request_id, in: query, required: false, schema: { type: string, maxLength: 64 }, description: 请求 ID }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid }, description: 应用 ID }
        - { name: trace_id, in: query, required: false, schema: { type: string, pattern: '^[0-9a-f]{32}$' }, description: W3C Trace ID（非全零） }
        - { name: identity_fingerprint, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 身份指纹 }
        - { name: rule_id, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 命中规则 ID }
      responses:
        '200':
          description: "CSV 文件（text/csv; charset=utf-8，Content-Disposition: attachment）"
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

