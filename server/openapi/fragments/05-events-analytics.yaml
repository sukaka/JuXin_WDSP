        直查 access_logs 按应用聚合访问趋势：以 applications 为准 LEFT JOIN，含零流量应用；
        series 为补桶后的完整时间轴（范围内空桶补 0），按总访问量降序（相同按应用编码升序）。
        桶粒度按跨度自适应：≤1h 分钟桶，≤7d 小时桶，更大为天桶；因访问日志保留期约 7 天，跨度上限 7 天（超限返回 400）。
        start_time/end_time 均缺省时取最近 24 小时；仅给 end_time 时向前推 24 小时。权限：analytics.security.read。
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 起始时间（RFC3339），必须早于 end_time }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 结束时间（RFC3339，右开区间） }
      responses:
        '200':
          description: 应用维度访问趋势
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsSiteAccessTrendsData' }
