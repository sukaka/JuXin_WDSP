        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /ha/groups:
    get:
      operationId: haGroupList
      tags: [ha]
      summary: 主备组列表
      description: >-
        列出全部主备高可用组，并透传 havipd 回写的运行状态（status 为 ha-vip-status.json 内容，
        节点未上报时为 null）。权限：`ha.read`。
      responses:
        '200':
          description: 主备组列表与运行状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HaGroupListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: haGroupCreate
      tags: [ha]
      summary: 创建主备组
      description: >-
        创建主备高可用组（恰 2 个成员节点，priority 大者倾向 MASTER）；保存 DB 后原子下发
        sidecars/ha-vip.json 由 havipd 执行。组名冲突返回 409。高危操作，全程操作审计。
        权限：`ha.manage`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HaGroupUpsertRequest'
      responses:
        '200':
          description: 创建成功，返回主备组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HaGroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /ha/groups/{id}:
    get:
      operationId: haGroupGet
      tags: [ha]
      summary: 主备组详情
      description: 按 ID 查询主备组详情，并透传 havipd 运行状态。权限：`ha.read`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          description: 主备组 ID
      responses:
        '200':
          description: 主备组详情与运行状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HaGroupDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: haGroupUpdate
      tags: [ha]
      summary: 更新主备组
      description: >-
        更新主备组配置（version 乐观锁，冲突返回 409）；auth_pass：不传=不变更、空串=清除、其他=设置
        （VRRPv2 上限 8 字符，加密落库）。保存后重新下发边车配置。高危操作，全程操作审计。
        权限：`ha.manage`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          description: 主备组 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HaGroupUpsertRequest'
      responses:
        '200':
          description: 更新成功，返回主备组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HaGroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: haGroupDelete
      tags: [ha]
      summary: 删除主备组
      description: >-
        收回主备能力：先删边车配置（havipd 停止实例释放 VIP），再删 DB 记录。高危操作，全程操作审计。
        权限：`ha.manage`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          description: 主备组 ID
      responses:
        '200':
          description: 删除成功，VIP 已随配置收回释放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /ha/groups/{id}/failback:
    post:
      operationId: haGroupFailback
      tags: [ha]
      summary: 主备组人工回切
      description: >-
        人工回切（nopreempt 场景把 MASTER 倾向切到指定节点）：请求体 node_id 为期望持有 VIP 的节点。
        幂等判定以「目标节点已实际持有 VIP」为准：目标已持有 VIP 时直接返回、不做变更；
        目标优先级低于对端时交换两成员优先级并重新下发，VIP 随选举回切；
        目标已是高优先级但确认未持有 VIP（nopreempt 故障转移后的典型场景）时，
        微调对端优先级强制其 keepalived 重载让位，仍可执行回切；
        目标已是高优先级且无法确认 VIP 实际持有方（havipd 未上报或状态过期）时不做变更。
        高危操作，全程操作审计。权限：`ha.manage`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          description: 主备组 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HaFailbackRequest'
      responses:
        '200':
          description: >-
            回切已受理并重新下发（交换优先级或微调对端优先级强制让位），
            或目标节点已持有 VIP / 无法确认持有方而未做变更
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HaGroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- 系统控制（重启/关机/恢复出厂） ----------
  /system/reboot:
    post:
      operationId: systemReboot
      tags: [system-ops]
      summary: 系统重启
      description: >-
        重启系统。高危操作：要求当前用户密码二次确认（错误返回 400 并记 FAILURE 审计），
        校验通过后在宿主控制目录（HOSTCTL_DIR）原子写入指令标志文件，由宿主侧 hostctl 消费执行，
        全程 CRITICAL 级审计。权限：`system.reboot`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOpsControlRequest'
      responses:
        '202':
          description: 指令已受理，系统将在数秒后执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOpsAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /system/shutdown:
    post:
      operationId: systemShutdown
      tags: [system-ops]
      summary: 系统关机
      description: >-
        关闭系统。高危操作：要求当前用户密码二次确认（错误返回 400 并记 FAILURE 审计），
        校验通过后在宿主控制目录（HOSTCTL_DIR）原子写入指令标志文件，由宿主侧 hostctl 消费执行，
        全程 CRITICAL 级审计。权限：`system.shutdown`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOpsControlRequest'
      responses:
        '202':
          description: 指令已受理，系统将在数秒后执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOpsAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /system/factory-reset:
    post:
      operationId: systemFactoryReset
      tags: [system-ops]
      summary: 恢复出厂设置
      description: >-
        恢复出厂设置。高危操作：除密码二次确认外，还要求 confirmText 严格等于「恢复出厂」
        （不匹配返回 400 并记 FAILURE 审计）；校验通过后在宿主控制目录（HOSTCTL_DIR）
        原子写入指令标志文件，由宿主侧 hostctl 消费执行，全程 CRITICAL 级审计。
        权限：`system.factory_reset`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOpsFactoryResetRequest'
      responses:
        '202':
          description: 指令已受理，系统将在数秒后执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOpsAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    # ---------- 系统控制 ----------
    SystemOpsControlRequest:
      type: object
      required: [password]
      properties:
        password: {type: string, description: 当前登录用户密码（二次确认）}

    SystemOpsFactoryResetRequest:
      type: object
      required: [password, confirmText]
      properties:
        password: {type: string, description: 当前登录用户密码（二次确认）}
        confirmText: {type: string, description: 确认文本，必须严格等于「恢复出厂」}

    SystemOpsAcceptedResponse:
      type: object
      properties:
        message: {type: string, description: 受理提示（指令已受理，系统将在数秒后执行）}
        action: {type: string, enum: [reboot, shutdown, factory_reset], description: 已受理的控制动作}

    # ---------- 报告 ----------
    ReportTemplate:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: 模板名称}
        is_builtin: {type: boolean, description: 是否内置模板（内置模板禁止修改/删除）}
        company_name: {type: string, description: 公司名称}
        product_name: {type: string, description: 产品名称}
        logo_text: {type: string, description: Logo 文本}
        header_text: {type: string, description: 页眉文本}
        footer_text: {type: string, description: 页脚文本}
        report_no_format: {type: string, description: 报告编号格式}
        prepared_by: {type: string, description: 编制人}
        reviewed_by: {type: string, description: 审核人}
        description: {type: string, description: 模板描述}
        sections:
          type: object
          additionalProperties: {type: boolean}
          description: 章节开关，key 为章节标识（cover/period/scope/summary/traffic/events_overview/risk_level/attack_types/attack_trend/source_ips/applications/rule_hits/cc_protection/ip_lists/disposition/false_positives/upstream_health/certificates/publish_tasks/system_health/conclusions），true 为纳入报告
        created_by: {type: string, format: uuid, nullable: true, description: 创建人用户 ID}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, description: 模板版本号}

    ReportTemplateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, description: 模板名称}
        company_name: {type: string, description: 公司名称}
        product_name: {type: string, description: 产品名称}
        logo_text: {type: string, description: Logo 文本}
        header_text: {type: string, description: 页眉文本}
        footer_text: {type: string, description: 页脚文本}
        report_no_format: {type: string, description: 报告编号格式}
        prepared_by: {type: string, description: 编制人}
        reviewed_by: {type: string, description: 审核人}
        description: {type: string, description: 模板描述}
        sections:
          type: object
          additionalProperties: {type: boolean}
          description: 章节开关，key 为章节标识，true 为纳入报告

    ReportTemplateResponse:
      type: object
      properties:
        template:
          $ref: '#/components/schemas/ReportTemplate'

    ReportTemplateListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportTemplate'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    ReportJob:
      type: object
      properties:
        id: {type: string, format: uuid}
        report_type: {type: string, enum: [DAILY, WEEKLY, MONTHLY, CUSTOM], description: 报告类型}
        time_range_start: {type: string, format: date-time, description: 统计时间范围起点}
        time_range_end: {type: string, format: date-time, description: 统计时间范围终点}
        application_ids:
          type: array
          items: {type: string, format: uuid}
          description: 统计范围应用 ID 列表（空为全部）
        template_id: {type: string, format: uuid, nullable: true, description: 使用的报告模板 ID}
        status:
          type: string
          enum: [PENDING, COLLECTING, AGGREGATING, RENDERING, SUCCESS, FAILED, CANCELLED]
          description: 任务状态机
        progress: {type: integer, description: 进度百分比（0-100）}
        requested_by: {type: string, format: uuid, nullable: true, description: 创建人用户 ID}
        requested_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        file_reference: {type: string, description: "报告文件名（report-{id}.{ext}）"}
        file_hash: {type: string, description: 报告文件 sha256}
        file_format: {type: string, enum: [html, pdf, docx], description: 导出格式}
        file_size: {type: integer, format: int64, description: 文件大小（字节）}
        report_no: {type: string, description: 报告编号}
        failure_code:
          type: string
          enum: ['', COLLECT_FAILED, RENDER_FAILED, WRITE_FAILED, FILE_TOO_LARGE, TIMEOUT, FONT_UNAVAILABLE, TEMPLATE_NOT_FOUND, INVALID_STATE]
          description: 失败码（空表示无失败）
        failure_message: {type: string, description: 失败原因}
        request_id: {type: string, description: 请求追踪 ID}

    ReportJobResponse:
      type: object
      properties:
        report:
          $ref: '#/components/schemas/ReportJob'

    ReportJobListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportJob'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    ReportCreateRequest:
      type: object
      required: [report_type]
      properties:
        report_type: {type: string, enum: [DAILY, WEEKLY, MONTHLY, CUSTOM], description: 报告类型}
        start_time: {type: string, format: date-time, nullable: true, description: 统计起点（RFC3339；CUSTOM 必填）}
        end_time: {type: string, format: date-time, nullable: true, description: 统计终点（RFC3339；CUSTOM 必填）}
        application_ids:
          type: array
          items: {type: string, format: uuid}
          description: 统计范围应用 ID 列表（空为全部应用）
        template_id: {type: string, format: uuid, nullable: true, description: 报告模板 ID（不填使用默认模板）}
        format: {type: string, enum: [html, pdf, docx], default: html, description: 导出格式}

    ReportArchiveItem:
      type: object
      properties:
        archive_id: {type: string, format: uuid, description: 归档记录 ID}
        report_job_id: {type: string, format: uuid, description: 关联报告任务 ID}
        report_no: {type: string, description: 报告编号}
        report_type: {type: string, enum: [DAILY, WEEKLY, MONTHLY, CUSTOM]}
        status: {type: string, description: 报告任务状态}
        archived_at: {type: string, format: date-time, description: 归档时间}
        note: {type: string, description: 归档备注}
        archived_by: {type: string, description: 归档人用户名（无则为空串）}

    ReportArchiveListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportArchiveItem'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    # ---------- 备份 ----------
    BackupJob:
      type: object
      properties:
        id: {type: string, format: uuid}
        backup_type: {type: string, enum: [FULL, CONFIG_ONLY], description: 备份类型}
        status:
          type: string
          enum: [PENDING, RUNNING, VERIFYING, SUCCESS, FAILED, CANCELLED]
          description: 任务状态
        include_logs: {type: boolean, description: 是否包含审计归档段}
        file_reference: {type: string, description: "备份文件名（backup-{id}.jzbk）"}
        file_size: {type: integer, format: int64, description: 文件大小（字节）}
        file_hash: {type: string, description: 文件 sha256}
        manifest:
          type: object
          nullable: true
          description: 备份清单（manifest.json 原始 JSON）
        requested_by: {type: string, format: uuid, nullable: true, description: 创建人用户 ID}
        requested_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        verified: {type: boolean, description: 是否已通过完整性验证}
        verified_at: {type: string, format: date-time, nullable: true}
        failure_code:
          type: string
          enum: ['', EXPORT_FAILED, SIZE_LIMIT, VERIFY_FAILED, HASH_MISMATCH, SCHEMA_MISMATCH, FILE_MISSING, ENCRYPTION_UNAVAILABLE]
          description: 失败码（空表示无失败）
        failure_message: {type: string, description: 失败原因}
        request_id: {type: string, description: 请求追踪 ID}

    BackupJobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/BackupJob'

    BackupJobListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackupJob'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    BackupCreateRequest:
      type: object
      required: [backup_type]
      properties:
        backup_type:
          type: string
          enum: [FULL, CONFIG_ONLY]
          description: 备份类型（FULL=配置表+审计归档最近100万行，CONFIG_ONLY=仅配置表）

    BackupVerifyResult:
      type: object
      properties:
        manifest:
          type: object
          nullable: true
          description: 备份清单（格式/版本/schema 版本/加密参数/表统计等）
        checked_at: {type: string, format: date-time, description: 验证时间}
        tables_ok: {type: integer, description: 校验通过的表数量}
        total_rows: {type: integer, format: int64, description: 校验总行数}
        file_intact: {type: boolean, description: 文件是否完整}

    BackupVerifyResponse:
      type: object
      properties:
        verified: {type: boolean, description: 是否验证通过}
        result:
          $ref: '#/components/schemas/BackupVerifyResult'

    # ---------- 恢复 ----------
    RestoreJob:
      type: object
      properties:
        id: {type: string, format: uuid}
        backup_job_id: {type: string, format: uuid, nullable: true, description: 关联备份任务 ID}
        restore_scope:
          type: string
          enum: [FULL, CONFIG, DATABASE, CERTIFICATE]
          description: 恢复范围
        status:
          type: string
          enum: [PENDING, VALIDATING, ISOLATED_RESTORE, VERIFYING, AWAITING_CONFIRM, RESTORING, SUCCESS, FAILED, CANCELLED]
          description: 任务状态机
        preview:
          type: object
          nullable: true
          description: 恢复预览（RestorePreview 结构原始 JSON）
        confirmed_by: {type: string, format: uuid, nullable: true, description: 确认人用户 ID}
        confirmed_at: {type: string, format: date-time, nullable: true}
        requested_by: {type: string, format: uuid, nullable: true, description: 创建人用户 ID}
        requested_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        failure_code:
          type: string
          enum: ['', BACKUP_NOT_READY, VALIDATE_FAILED, ISOLATED_RESTORE_FAILED, VERIFY_FAILED, MAINTENANCE_FAILED, PRIVILEGE_REQUIRED, RESTORE_FAILED, EMPTY_SCOPE, ACTIVE_RESTORE_EXISTS]
          description: 失败码（空表示无失败）
        failure_message: {type: string, description: 失败原因}
        request_id: {type: string, description: 请求追踪 ID}

    RestoreJobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/RestoreJob'

    RestoreJobListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestoreJob'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    RestoreValidateRequest:
      type: object
      required: [backup_job_id]
      properties:
        backup_job_id: {type: string, format: uuid, description: 备份任务 ID}

    RestoreCreateRequest:
      type: object
      required: [backup_job_id, scope]
      properties:
        backup_job_id: {type: string, format: uuid, description: 备份任务 ID}
        scope:
          type: string
          enum: [FULL, CONFIG, DATABASE, CERTIFICATE]
          description: 恢复范围

    RestoreConfirmRequest:
      type: object
      properties:
        reason: {type: string, description: 确认理由（可选，写入审计）}

    RestoreTablePreview:
      type: object
      properties:
        name: {type: string, description: 表名}
        group: {type: string, description: 表分组（config/database/certificate）}
        backup_rows: {type: integer, format: int64, description: 备份中的行数}
        restored_rows: {type: integer, format: int64, description: 隔离恢复后的行数（仅恢复任务预览中出现）}
        match: {type: boolean, description: 备份行数与恢复行数是否一致}
        in_scope: {type: boolean, description: 是否在所选恢复范围内}

    RestorePreview:
      type: object
      properties:
        backup_id: {type: string, format: uuid}
        backup_type: {type: string, enum: [FULL, CONFIG_ONLY]}
        scope: {type: string, description: 恢复范围（仅恢复任务预览中出现）}
        backup_time: {type: string, format: date-time, description: 备份创建时间}
        schema_version: {type: integer, description: 备份时的 schema 版本}
        current_schema_version: {type: integer, description: 当前系统 schema 版本}
        compatible: {type: boolean, description: schema 是否兼容}
        tables:
          type: array
          items:
            $ref: '#/components/schemas/RestoreTablePreview'
        total_rows: {type: integer, format: int64, description: 备份总行数}
        note: {type: string, description: 备注说明}

    RestorePreviewResponse:
      type: object
      properties:
        preview:
          $ref: '#/components/schemas/RestorePreview'

    RestoreConfirmResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/RestoreJob'
        post_verify:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: 恢复后验证摘要（表名 → 行数）

    # ---------- 升级 ----------
    UpgradePackage:
      type: object
      properties:
        id: {type: string, format: uuid}
        file_name: {type: string, description: 升级包文件名（纯文件名，不含路径）}
        version_from: {type: string, description: 起始版本（MAJOR.MINOR.PATCH）}
        version_to: {type: string, description: 目标版本（须高于起始版本）}
        file_hash: {type: string, description: 文件 sha256（64 位小写十六进制）}
        file_size: {type: integer, format: int64, description: 文件大小（字节）}
        manifest:
          type: object
          nullable: true
          description: 升级包清单（原始 JSON）
        status:
          type: string
          enum: [REGISTERED, VERIFIED, REJECTED]
          description: 升级包状态（登记校验自洽即 VERIFIED，否则 REJECTED）
        uploaded_by: {type: string, format: uuid, nullable: true, description: 登记人用户 ID}
        uploaded_at: {type: string, format: date-time, description: 登记时间}

    UpgradePackageResponse:
      type: object
      properties:
        package:
          $ref: '#/components/schemas/UpgradePackage'

    UpgradePackageListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpgradePackage'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    UpgradeRegisterPackageRequest:
      type: object
      required: [file_name, version_from, version_to, file_hash, file_size]
      properties:
        file_name: {type: string, description: 升级包文件名（不超过 255 字符，不允许路径分隔符）}
        version_from: {type: string, description: 起始版本（MAJOR.MINOR.PATCH，可带 v 前缀）}
        version_to: {type: string, description: 目标版本（须高于起始版本）}
        file_hash: {type: string, description: 文件 sha256（64 位小写十六进制）}
        file_size: {type: integer, format: int64, description: 文件大小（字节，须大于 0）}
        manifest:
          type: object
          nullable: true
          description: 升级包清单（可选，须为合法 JSON）

    UpgradeRegisterPackageResponse:
      type: object
      properties:
        package:
          $ref: '#/components/schemas/UpgradePackage'
        message: {type: string, description: 校验未通过时的原因说明（包以 REJECTED 状态登记）}

    UpgradePrecheckItem:
      type: object
      properties:
        name: {type: string, description: 检查项名称}
        result: {type: string, enum: [PASS, WARNING, FAIL], description: 检查结果}
        message: {type: string, description: 结果说明}

    UpgradePrecheckRequest:
      type: object
      required: [package_id]
      properties:
        package_id: {type: string, format: uuid, description: 升级包 ID}

    UpgradePrecheckResponse:
      type: object
      properties:
        precheck:
          type: array
          items:
            $ref: '#/components/schemas/UpgradePrecheckItem'
        passed: {type: boolean, description: 整体是否通过（无 FAIL 项）}

    UpgradeExecuteRequest:
      type: object
      required: [package_id]
      properties:
        package_id: {type: string, format: uuid, description: 升级包 ID（须为 VERIFIED 状态）}

    UpgradeJob:
      type: object
      properties:
        id: {type: string, format: uuid}
        package_id: {type: string, format: uuid, nullable: true, description: 升级包 ID}
        status:
          type: string
          enum: [PENDING, PRECHECK, BACKUP, APPLYING, MIGRATING, VERIFYING, SUCCESS, FAILED, ROLLING_BACK, ROLLED_BACK]
          description: 任务状态机
        precheck:
          type: object
          nullable: true
          description: 升级前检查结果（原始 JSON）
        backup_job_id: {type: string, format: uuid, nullable: true, description: 升级前自动创建的备份任务 ID（回滚依据）}
        requested_by: {type: string, format: uuid, nullable: true, description: 创建人用户 ID}
        requested_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        failure_code:
          type: string
          enum: ['', PRECHECK_FAILED, BACKUP_FAILED, APPLY_FAILED, MIGRATE_FAILED, VERIFY_FAILED, ROLLBACK_FAILED]
          description: 失败码（空表示无失败）
        failure_message: {type: string, description: 失败原因}
        request_id: {type: string, description: 请求追踪 ID}

    UpgradeJobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/UpgradeJob'

    UpgradeJobListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpgradeJob'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    # ---------- 交付检查 ----------
    DeliveryCheckRun:
      type: object
      properties:
        id: {type: string, format: uuid}
        overall_result:
          type: string
          enum: [PENDING, PASS, WARNING, FAIL]
          description: 整体结果（任一关键项 FAIL → FAIL；存在 WARNING 或非关键 FAIL → WARNING；否则 PASS）
        total: {type: integer, description: 检查项总数}
        pass_count: {type: integer}
        warning_count: {type: integer}
        fail_count: {type: integer}
        requested_by: {type: string, format: uuid, nullable: true, description: 执行人用户 ID}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}

    DeliveryCheckItemResult:
      type: object
      properties:
        item_key: {type: string, description: 检查项标识}
        item_name: {type: string, description: 检查项名称}
        category:
          type: string
          enum: [运行状态, 安全配置, 账号权限, 防护能力, 合规交付, 质量保障]
          description: 检查类别
        critical: {type: boolean, description: 是否关键项（关键项 FAIL 直接判整体 FAIL）}
        result: {type: string, enum: [PASS, WARNING, FAIL, NOT_APPLICABLE], description: 检查结果}
        message: {type: string, description: 结果说明}
        details:
          type: object
          nullable: true
          description: 检查细节（可选）

    DeliveryCheckResultResponse:
      type: object
      properties:
        check:
          $ref: '#/components/schemas/DeliveryCheckRun'
        results:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryCheckItemResult'

    DeliveryCheckListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryCheckRun'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    # ---------- 离线授权 ----------
    LicenseQuotas:
      type: object
      properties:
        max_applications: {type: integer, description: Web 应用数量上限（0 = 不限制）}
        max_api_endpoints: {type: integer, description: API 端点数量上限（0 = 不限制）}
        max_qps: {type: integer, description: QPS 上限（0 = 不限制）}

    LicenseUsage:
      type: object
      properties:
        applications: {type: integer, description: 当前 Web 应用用量}
        api_endpoints: {type: integer, description: 当前 API 端点用量}

    LicenseProtectionState:
      type: object
      required: [schema_version, protection_form, commercial_authorization, artifact_integrity, gateway_protection, confidential_computing, recovery]
      properties:
        schema_version: {type: string, description: 状态模型版本}
        protection_form:
          type: string
          enum: [STANDARD_OFFLINE, CONFIDENTIAL_COMPUTING, UNKNOWN]
          description: 当前交付/保护形态；不代表商业授权本身有效
        commercial_authorization:
          type: string
          enum: [AUTHORIZED, NOT_IMPORTED, EXPIRED, DEVICE_MISMATCH, INVALID, UNKNOWN]
          description: 商业授权事实状态
        artifact_integrity:
          type: string
          enum: [VERIFIED, PENDING_MIGRATION, UNVERIFIABLE, FAILED, UNKNOWN]
          description: 交付物/授权原文完整性事实状态
        gateway_protection:
          type: string
          enum: [PROTECTED, BYPASS, UNAVAILABLE, PRESERVE_EXISTING, UNKNOWN]
          description: 网关实际保护状态；授权有效不自动推导为 PROTECTED
        confidential_computing:
          type: string
          enum: [DISABLED, VERIFIED, FAILED, UNSUPPORTED, UNAVAILABLE, UNKNOWN]
          description: 机密计算启用与验证状态
        recovery:
          type: string
          enum: [NONE, IMPORT_LICENSE, REVALIDATE_PACKAGE, KEEP_LAST_CONFIG, SUPPORT_REQUIRED, UNKNOWN]
          description: 当前状态对应的恢复动作
        reason: {type: string, nullable: true, description: 面向运维的事实说明}

    LicenseState:
      type: object
      properties:
        valid: {type: boolean, description: 授权是否有效}
        product: {type: string, enum: [waf, wdsp, api, ''], description: 生效产品形态；无有效授权时为空串}
        quotas:
          $ref: '#/components/schemas/LicenseQuotas'
        features:
          type: array
          items: {type: string}
          description: 授权特性列表
        expires_at: {type: string, format: date-time, nullable: true, description: 到期时间；null = 永久或无授权}
        license_id: {type: string, description: 授权编号}
        customer: {type: string, description: 客户名称}
        license_type: {type: string, enum: [FORMAL, TRIAL, ''], description: 授权类型；无授权时为空串}
        reason: {type: string, description: 无效原因（中文）；有效时为空串}
        integrity_status:
          type: string
          enum: [NOT_IMPORTED, VERIFIED, ORIGINAL_MISSING, ENCRYPTION_UNAVAILABLE, DECRYPTION_FAILED, SIGNATURE_INVALID, DB_INCONSISTENT, EXPIRED, DEVICE_MISMATCH, DATABASE_UNAVAILABLE]
          description: 授权原文与数据库缓存的复核状态
        protection_state:
          $ref: '#/components/schemas/LicenseProtectionState'
        host_fingerprint: {type: string, description: 本机指纹（sha256:...；未采集时为空串）}
        usage:
          $ref: '#/components/schemas/LicenseUsage'

    LicenseImportRequest:
      type: object
      required: [file_content]
      properties:
        file_content: {type: string, description: .lic 授权文件原文（≤64KB）}

    LicenseHistoryItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        license_id: {type: string, description: 授权编号}
        license_type: {type: string, enum: [FORMAL, TRIAL], description: 授权类型}
        product: {type: string, enum: [waf, wdsp, api], description: 产品形态}
        customer: {type: string, description: 客户名称}
        status:
          type: string
          enum: [ACTIVE, EXPIRED, FINGERPRINT_MISMATCH, SUPERSEDED, INVALID]
          description: 记录状态（生效中/已到期/指纹不匹配/被取代/数据非法）
        imported_by: {type: string, format: uuid, nullable: true, description: 导入操作人用户 ID；null = 系统}
        imported_at: {type: string, format: date-time, description: 导入时间}
        expires_at: {type: string, format: date-time, nullable: true, description: 到期日；null = 永久授权}
        perpetual: {type: boolean, description: 是否永久授权}
        machine_fingerprint: {type: string, description: 绑定的机器指纹}
        quotas:
          $ref: '#/components/schemas/LicenseQuotas'
        features:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}

    LicenseHistoryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LicenseHistoryItem'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    # ---------- 定时报告计划 ----------
    ReportSchedule:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: 计划名称（≤64 字符）}
        report_type: {type: string, enum: [DAILY, WEEKLY, MONTHLY], description: 周期类型}
        content_scope: {type: string, enum: [WAF, API, WAF_API], description: 内容范围}
        application_ids:
          type: array
          items: {type: string, format: uuid}
          nullable: true
          description: 限定应用 ID 列表（空 = 全部）
        template_id: {type: string, format: uuid, nullable: true, description: 报告模板 ID}
        file_format: {type: string, enum: [html, pdf, docx], description: 导出格式}
        include_api_assets: {type: boolean, description: 是否包含全量 API 资产清单}
        page_orientation: {type: string, enum: [P, L], description: 纸张方向（P 竖向 / L 横向，PDF/Word 生效）}
        time_of_day: {type: string, description: '执行时刻 HH:MM（UTC）'}
        day_of_week: {type: integer, description: 每周执行的星期（1=周一..7=周日；WEEKLY 必填）}
        day_of_month: {type: integer, description: 每月执行的日期（1-28；MONTHLY 必填）}
        send_email: {type: boolean, description: 是否邮件发送}
        emails:
          type: array
          items: {type: string}
          nullable: true
          description: 收件邮箱（send_email=true 时至少 1 个，至多 10 个）
        enabled: {type: boolean, description: 是否启用}
        next_run_at: {type: string, format: date-time, nullable: true, description: 下次执行时间}
        last_run_at: {type: string, format: date-time, nullable: true, description: 最近执行时间}
        last_job_id: {type: string, format: uuid, nullable: true, description: 最近生成的报告任务 ID}
        last_email_status: {type: string, description: 最近邮件发送状态（SENT/FAILED）}
        last_email_error: {type: string, description: 最近邮件发送错误信息}
        created_by: {type: string, format: uuid, nullable: true, description: 创建人用户 ID}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ReportScheduleRequest:
      type: object
      required: [name, report_type, content_scope, file_format, page_orientation, time_of_day]
      properties:
        name: {type: string, description: 计划名称（必填，≤64 字符）}
        report_type: {type: string, enum: [DAILY, WEEKLY, MONTHLY], description: 周期类型}
        content_scope: {type: string, enum: [WAF, API, WAF_API], description: 内容范围（含 API 需环境启用 API 动态防护）}
        application_ids:
          type: array
          items: {type: string, format: uuid}
          description: 限定应用 ID 列表（空 = 全部）
        template_id: {type: string, format: uuid, nullable: true, description: 报告模板 ID（须已存在）}
        file_format: {type: string, enum: [html, pdf, docx], description: 导出格式}
        include_api_assets: {type: boolean, description: 是否包含全量 API 资产清单}
        page_orientation: {type: string, enum: [P, L], description: 纸张方向（P 竖向 / L 横向）}
        time_of_day: {type: string, description: '执行时刻 HH:MM（UTC，00:00-23:59）'}
        day_of_week: {type: integer, minimum: 1, maximum: 7, description: 每周执行的星期（1=周一；WEEKLY 时必填）}
        day_of_month: {type: integer, minimum: 1, maximum: 28, description: 每月执行的日期（MONTHLY 时必填）}
        send_email: {type: boolean, description: 是否邮件发送}
        emails:
          type: array
          items: {type: string}
          description: 收件邮箱（send_email=true 时至少 1 个，至多 10 个）
        enabled: {type: boolean, description: 是否启用（缺省 true）}

    ReportScheduleResponse:
      type: object
      properties:
        schedule:
          $ref: '#/components/schemas/ReportSchedule'

    ReportScheduleListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportSchedule'
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}

    # ---------- 主备高可用 ----------
    HaGroupMember:
      type: object
      properties:
        node_id: {type: string, description: 网关节点 ID}
        node_name: {type: string, description: 节点名称（下发时解析回填）}
        priority: {type: integer, minimum: 1, maximum: 254, description: VRRP 优先级（大者倾向 MASTER；组内唯一）}

    HaGroup:
      type: object
      properties:
        id: {type: string, description: 主备组 ID}
        name: {type: string, description: 组名（1~64 位字母数字开头，仅含 ._-）}
        state: {type: string, enum: [ENABLED, DISABLED], description: 启用状态}
        vrid: {type: integer, minimum: 1, maximum: 255, description: VRRP 虚拟路由 ID}
        iface: {type: string, description: VIP 绑定网卡名}
        vips:
          type: array
          items: {type: string}
          description: 虚拟 IP 列表（CIDR，如 192.168.31.100/24；1~8 个）
        preempt: {type: boolean, description: 是否抢占模式}
        advert_int_ms: {type: integer, minimum: 200, maximum: 10000, description: VRRP 通告间隔（毫秒，缺省 1000）}
        unicast: {type: boolean, description: 是否单播 VRRP}
        unicast_peers:
          type: array
          items: {type: string}
          description: 单播对端地址（unicast=true 时必填，至多 8 个）
        has_auth_pass: {type: boolean, description: 是否已配置 VRRP 认证串（明文永不出参）}
        members:
          type: array
          items:
            $ref: '#/components/schemas/HaGroupMember'
          description: 成员节点（恰 2 个）
        version: {type: integer, description: 乐观锁版本号}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    HaGroupUpsertRequest:
      type: object
      required: [name, vrid, iface, vips, members]
      properties:
        name: {type: string, description: 组名（1~64 位字母数字开头，仅含 ._-）}
        state: {type: string, enum: [ENABLED, DISABLED], description: 启用状态（缺省 ENABLED）}
        vrid: {type: integer, minimum: 1, maximum: 255, description: VRRP 虚拟路由 ID}
        iface: {type: string, description: VIP 绑定网卡名}
        vips:
          type: array
          items: {type: string}
          description: 虚拟 IP 列表（CIDR；1~8 个）
        preempt: {type: boolean, description: 是否抢占模式}
        advert_int_ms: {type: integer, minimum: 200, maximum: 10000, description: 通告间隔毫秒（0 = 缺省 1000）}
        unicast: {type: boolean, description: 是否单播 VRRP}
        unicast_peers:
          type: array
          items: {type: string}
          description: 单播对端地址（unicast=true 时必填）
        auth_pass: {type: string, description: VRRP 认证串（≤8 字符；不传=不变更、空串=清除、其他=设置，加密落库）}
        members:
          type: array
          items:
            $ref: '#/components/schemas/HaGroupMember'
          description: 成员节点（恰 2 个，优先级互异）
        version: {type: integer, description: 乐观锁版本号（修改时必填；创建忽略）}

    HaVipEvent:
      type: object
      properties:
        at: {type: string, format: date-time, description: 事件时间}
        from: {type: string, description: 原状态}
        to: {type: string, description: 新状态}
        detail: {type: string, description: 事件说明}

    HaVipStatus:
      type: object
      nullable: true
      description: havipd 运行状态（ha-vip-status.json 只读透传；null = 节点未上报）
      properties:
        group: {type: string, description: 主备组名}
        node: {type: string, description: 上报节点名}
        state: {type: string, enum: [MASTER, BACKUP, FAULT, DISABLED, STOPPED], description: VRRP 状态}
        keepalived_running: {type: boolean, description: keepalived 进程是否运行}
        vips_present:
          type: array
          items: {type: string}
          description: 当前已生效的 VIP
        priority: {type: integer, description: 当前优先级}
        last_transition_at: {type: string, format: date-time, description: 最近状态迁移时间}
        applied_at: {type: string, format: date-time, description: 最近配置应用时间}
        message: {type: string, description: 状态说明}
        events:
          type: array
          items:
            $ref: '#/components/schemas/HaVipEvent'
          description: 漂移/状态迁移事件

    HaGroupListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HaGroup'
        status:
          $ref: '#/components/schemas/HaVipStatus'

    HaGroupDetailResponse:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/HaGroup'
        status:
          $ref: '#/components/schemas/HaVipStatus'

    HaGroupResponse:
      type: object
      properties:
        message: {type: string, description: 操作结果提示（部分接口返回）}
        group:
          $ref: '#/components/schemas/HaGroup'

    HaFailbackRequest:
      type: object
      required: [node_id]
      properties:
        node_id: {type: string, description: 期望持有 VIP 的成员节点 ID}
