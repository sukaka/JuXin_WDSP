        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: reportScheduleCreate
      tags: [reports]
      summary: 创建定时报告计划
      description: >-
        创建定时报告计划（按 每天/每周/每月 固定 UTC 时刻自动创建报告任务，可选邮件发送）。
        内容范围含 API 时要求当前环境已启用 API 动态防护，否则 400。权限：`reports.create`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportScheduleRequest'
      responses:
        '200':
          description: 创建成功，返回计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportScheduleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /report-schedules/{id}:
    get:
      operationId: reportScheduleGet
      tags: [reports]
      summary: 定时报告计划详情
      description: 按 ID 查询定时报告计划详情。权限：`reports.read`、`reports.read_audit` 任一。
      parameters:
        - name: id
          in: path
