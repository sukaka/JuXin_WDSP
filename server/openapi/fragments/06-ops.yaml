                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: reportScheduleDelete
      tags: [reports]
      summary: 删除定时报告计划
      description: 删除定时报告计划（不再自动创建报告任务）。权限：`reports.create`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 计划 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /report-schedules/{id}/run-now:
    post:
      operationId: reportScheduleRunNow
      tags: [reports]
      summary: 立即执行定时报告计划
      description: >-
        立即触发一次计划执行（标记到期，交调度器下一轮拾取；报告生成后按计划发送邮件）。无请求体。
        权限：`reports.create`。
      parameters:
        - name: id
          in: path
          required: true
