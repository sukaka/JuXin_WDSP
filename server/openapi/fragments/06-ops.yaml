# 报表与系统运维域：报告模板/报告任务/报告归档、备份、恢复、升级、交付检查、系统控制。
# 路由源：server/internal/reports/handler.go（13 条）、server/internal/upgrades/handler.go（8 条）、
# server/internal/delivery/handler.go（4 条）、server/internal/app/app.go 第 693-705 行（backups/restores 13 条）、
# server/internal/systemops/handler.go（3 条）。

paths:
  # ---------- 报告模板 ----------
  /report-templates:
    get:
      operationId: reportTemplateList
      tags: [reports]
      summary: 报告模板列表
      description: 分页查询报告模板。权限：`report_templates.manage`、`reports.read`、`reports.create` 任一。
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
          description: 页码，从 1 开始
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20}
          description: 每页条数
      responses:
        '200':
          description: 模板分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTemplateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: reportTemplateCreate
      tags: [reports]
      summary: 创建报告模板
      description: 创建自定义报告模板并写入操作审计。权限：`report_templates.manage`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportTemplateRequest'
      responses:
        '200':
          description: 创建成功，返回模板
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /report-templates/{id}:
    get:
      operationId: reportTemplateGet
      tags: [reports]
      summary: 报告模板详情
      description: 按 ID 查询模板详情。权限：`report_templates.manage`、`reports.read`、`reports.create` 任一。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 模板 ID
      responses:
        '200':
          description: 模板详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: reportTemplateUpdate
      tags: [reports]
      summary: 更新报告模板
      description: 更新模板；内置模板（is_builtin=true）禁止修改，返回 400。写操作审计。权限：`report_templates.manage`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 模板 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportTemplateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: reportTemplateDelete
      tags: [reports]
      summary: 删除报告模板
      description: 删除模板；内置模板禁止删除，返回 400。写操作审计。权限：`report_templates.manage`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 模板 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- 报告任务 ----------
  /reports:
    get:
      operationId: reportList
      tags: [reports]
      summary: 报告任务列表
      description: 分页查询报告生成任务。权限：`reports.read`、`reports.read_audit` 任一。
      parameters:
        - name: report_type
          in: query
          required: false
          schema: {type: string, enum: [DAILY, WEEKLY, MONTHLY, CUSTOM]}
          description: 按报告类型过滤
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [PENDING, COLLECTING, AGGREGATING, RENDERING, SUCCESS, FAILED, CANCELLED]}
          description: 按任务状态过滤
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
          description: 页码，从 1 开始
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20}
          description: 每页条数
      responses:
        '200':
          description: 任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportJobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: reportCreate
      tags: [reports]
      summary: 创建报告任务
      description: >-
        创建异步报告生成任务（状态 PENDING，由后台 Worker 执行）。时间范围：DAILY=昨天全天、
        WEEKLY=上周一至周日、MONTHLY=上月、CUSTOM 必须提供 RFC3339 起止时间（跨度上限 366 天）。
        权限：`reports.create`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
      responses:
        '200':
          description: 创建成功，返回任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /report-archives:
    get:
      operationId: reportArchiveList
      tags: [reports]
      summary: 报告归档列表
      description: 分页查询报告归档记录（report_archives 关联报告任务与归档人）。权限：`reports.read`、`reports.read_audit` 任一。
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
          description: 页码，从 1 开始
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20}
          description: 每页条数
      responses:
        '200':
          description: 归档分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportArchiveListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/{id}:
    get:
      operationId: reportGet
      tags: [reports]
      summary: 报告任务详情
      description: 按 ID 查询报告任务详情（含进度与失败原因）。权限：`reports.read`、`reports.read_audit` 任一。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 报告任务 ID
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: reportDelete
      tags: [reports]
      summary: 删除报告
      description: 删除报告任务及报告文件；仅可删除本人创建的报告，持 `reports.delete_all` 的管理者可删除任意报告，否则 403。写操作审计。权限：`reports.delete_own`（路由）+ 归属或 `reports.delete_all`（归属校验，迁移 000084）。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 报告任务 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/{id}/retry:
    post:
      operationId: reportRetry
      tags: [reports]
      summary: 重试报告任务
      description: 将 FAILED / CANCELLED 状态的任务重置为 PENDING 等待 Worker 重新执行；其他状态返回 409。权限：`reports.create`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 报告任务 ID
      responses:
        '200':
          description: 任务已重新排队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务状态不允许重试（仅失败或已取消可重试）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/{id}/preview:
    get:
      operationId: reportPreview
      tags: [reports]
      summary: 预览报告
      description: >-
        预览已生成完成的报告。HTML 报告直接返回原始 HTML 内容（Content-Type: text/html，
        非 JSON 信封，前端以 sandbox iframe 渲染）；PDF 报告返回 JSON 提示，请改用下载接口。
        任务未成功时返回 409。权限：`reports.read`、`reports.read_audit` 任一。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 报告任务 ID
      responses:
        '200':
          description: HTML 报告正文；PDF 报告时为 JSON 提示
          content:
            text/html:
              schema: {type: string, description: 报告 HTML 正文}
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 报告尚未生成完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/{id}/download:
    get:
      operationId: reportDownload
      tags: [reports]
      summary: 下载报告文件
      description: >-
        下载报告文件流（HTML 为 text/html，PDF 为 application/pdf，Word 为
        application/vnd.openxmlformats-officedocument.wordprocessingml.document，Content-Disposition: attachment）。
        仅任务创建者本人或持有 reports.download_audit 的用户可下载；下载前校验文件名与 sha256 完整性，
        并记录下载审计。任务未成功返回 409。权限：`reports.download`、`reports.download_audit` 任一。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 报告任务 ID
      responses:
        '200':
          description: 报告文件流
          content:
            text/html:
              schema: {type: string, format: binary}
            application/pdf:
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 报告尚未生成完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- 备份 ----------
  /backups:
    get:
      operationId: backupList
      tags: [backups]
      summary: 备份任务列表
      description: 分页查询备份任务。权限：`backups.read`。
      parameters:
        - name: backup_type
          in: query
          required: false
          schema: {type: string, enum: [FULL, CONFIG_ONLY]}
          description: 按备份类型过滤（FULL=配置表+审计归档，CONFIG_ONLY=仅配置表）
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [PENDING, RUNNING, VERIFYING, SUCCESS, FAILED, CANCELLED]}
          description: 按任务状态过滤
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
          description: 页码，从 1 开始
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20}
          description: 每页条数
      responses:
        '200':
          description: 任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupJobListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: backupCreate
      tags: [backups]
      summary: 创建备份任务
      description: >-
        创建异步加密备份任务（AES-256-GCM；Worker 导出后自动验证，SUCCESS 仅当 verified=true）。
        加密服务未配置时返回 503。写操作审计。权限：`backups.create`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupCreateRequest'
      responses:
        '200':
          description: 创建成功，返回任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 加密服务未配置，无法创建加密备份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /backups/{id}:
    get:
      operationId: backupGet
      tags: [backups]
      summary: 备份任务详情
      description: 按 ID 查询备份任务详情（含失败原因）。权限：`backups.read`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 备份任务 ID
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: backupDelete
      tags: [backups]
      summary: 删除备份
      description: >-
        删除备份文件与记录；执行中（RUNNING/VERIFYING）的任务返回 400，
        存在关联恢复任务的返回 409。写操作审计。权限：`backups.delete`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 备份任务 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 存在关联恢复任务，不可删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /backups/{id}/verify:
    post:
      operationId: backupVerify
      tags: [backups]
      summary: 验证备份完整性
      description: >-
        手动重新解密并逐表校验备份文件（全文件哈希 → 清单 → schema 兼容 → 解密解压 → 行数/哈希比对），
        结果落库并审计。验证未通过返回 400 及原因；任务执行中返回 400；加密服务未配置返回 503。
        权限：`backups.verify`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 备份任务 ID
      responses:
        '200':
          description: 验证通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 加密服务未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /backups/{id}/download:
    get:
      operationId: backupDownload
      tags: [backups]
      summary: 下载备份文件
      description: >-
        下载加密的备份文件流（application/octet-stream，文件名固定为 backup-{id}.jzbk，
        Content-Disposition: attachment）。仅 SUCCESS 状态的备份可下载，否则 400；记录下载审计。
        权限：`backups.read`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 备份任务 ID
      responses:
        '200':
          description: 备份文件流（.jzbk，AES-256-GCM 加密）
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- 恢复 ----------
  /restores:
    get:
      operationId: restoreList
      tags: [restores]
      summary: 恢复任务列表
      description: 分页查询恢复任务。权限：`backups.read`、`restore_records.read` 任一。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, VALIDATING, ISOLATED_RESTORE, VERIFYING, AWAITING_CONFIRM, RESTORING, SUCCESS, FAILED, CANCELLED]
          description: 按任务状态过滤
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
          description: 页码，从 1 开始
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20}
          description: 每页条数
      responses:
        '200':
          description: 任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreJobListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: restoreCreate
      tags: [restores]
      summary: 创建恢复任务
      description: >-
        创建异步恢复任务：备份先恢复到隔离 schema（绝不直接触碰正式表），完成后进入 AWAITING_CONFIRM 等待管理员确认。
        存在进行中的恢复任务时返回 409。高危操作，全程审计。权限：`backups.restore`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreCreateRequest'
      responses:
        '200':
          description: 创建成功，返回任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 存在进行中的恢复任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 维护模式存储或加密服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /restores/validate:
    post:
      operationId: restoreValidate
      tags: [restores]
      summary: 校验备份并生成恢复预览
      description: 校验指定备份并输出恢复预览（表清单、行数、schema 兼容性），不创建任务、不修改数据。权限：`backups.restore`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreValidateRequest'
      responses:
        '200':
          description: 校验通过，返回恢复预览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestorePreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 加密服务未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /restores/import:
    post:
      operationId: restoreImport
      tags: [restores]
      summary: 导入外部备份文件
      description: >-
        以 multipart/form-data 上传 .jzbk 备份文件（字段名 file，上限 2GB），落临时目录后经全量验证登记为备份任务，
        用于全新环境恢复入口。验证失败返回 400。高危操作，全程审计。权限：`backups.restore`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 备份文件（仅接受 .jzbk 后缀）
      responses:
        '200':
          description: 导入成功，返回登记后的备份任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /restores/{id}:
    get:
      operationId: restoreGet
      tags: [restores]
      summary: 恢复任务详情
      description: 按 ID 查询恢复任务详情（含恢复预览与失败原因）。权限：`backups.read`、`restore_records.read` 任一。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 恢复任务 ID
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /restores/{id}/confirm:
    post:
      operationId: restoreConfirm
      tags: [restores]
      summary: 确认执行正式恢复
      description: >-
        管理员二次确认后执行正式恢复：进入维护模式 → 事务内替换正式表 → 恢复后验证。
        仅 AWAITING_CONFIRM 状态可确认；审计归档段（operation_audits）永不恢复写回。
        请求体可选，可附确认理由。高危操作（审计风险等级 CRITICAL）。权限：`backups.restore`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 恢复任务 ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreConfirmRequest'
      responses:
        '200':
          description: 正式恢复完成，返回任务与恢复后验证摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreConfirmResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 维护模式存储不可用，拒绝正式恢复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /restores/{id}/cancel:
    post:
      operationId: restoreCancel
      tags: [restores]
      summary: 取消恢复任务
      description: 取消等待确认（AWAITING_CONFIRM）的恢复任务并删除隔离环境；其他状态返回 400。权限：`backups.restore`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 恢复任务 ID
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- 升级 ----------
  /upgrade-packages:
    get:
      operationId: upgradePackageList
      tags: [upgrades]
      summary: 升级包列表
      description: 分页查询已登记的升级包。权限：`upgrades.read`、`upgrade_records.read` 任一。
      parameters:
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [REGISTERED, VERIFIED, REJECTED]}
          description: 按升级包状态过滤
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
          description: 页码，从 1 开始
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20}
          description: 每页条数
      responses:
        '200':
          description: 升级包分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradePackageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /upgrade-packages/{id}:
    get:
      operationId: upgradePackageGet
      tags: [upgrades]
      summary: 升级包详情
      description: 按 ID 查询升级包详情。权限：`upgrades.read`、`upgrade_records.read` 任一。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 升级包 ID
      responses:
        '200':
          description: 升级包详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradePackageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /upgrades/packages:
    post:
      operationId: upgradePackageRegister
      tags: [upgrades]
      summary: 登记升级包
      description: >-
        登记升级包元数据（升级包文件经离线介质拷贝到服务端指定目录，本接口只登记元数据）。
        校验版本号、目标版本高于起始版本、sha256 哈希格式与文件名安全性：全部通过则状态 VERIFIED，
        否则以 REJECTED 状态登记并在 message 中给出原因（保留证据）。写操作审计。权限：`upgrades.execute`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeRegisterPackageRequest'
      responses:
        '200':
          description: 登记成功（校验未通过时包状态为 REJECTED 且 message 说明原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeRegisterPackageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /upgrades/packages/upload:
    post:
      operationId: upgradePackageUpload
      tags: [upgrades]
      summary: 上传升级包
      description: >-
        multipart 上传升级包文件（字段 `file`），服务端流式落盘到升级包目录（`UPGRADE_PACKAGES_DIR`，
        默认数据目录下 `upgrade-packages/`）并自算 SHA-256 与大小后登记；
        附加表单字段 `version_from`、`version_to` 必填，`manifest` 可选（JSON 字符串）。
        上传大小上限默认 4GiB（`UPGRADE_PACKAGE_MAX_BYTES` 可覆盖）。
        同名文件已存在且内容不同、或相同哈希已登记时返回 409。
        版本校验未通过仍以 REJECTED 状态登记（保留证据）并删除已落盘文件。写操作审计。权限：`upgrades.execute`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, version_from, version_to]
              properties:
                file:
                  type: string
                  format: binary
                  description: 升级包文件（如 jiuzhang-wdsp-offline-2.6.0-amd64.tar.gz）
                version_from:
                  type: string
                  description: 起始版本（须与当前系统版本一致）
                  example: '2.5.5'
                version_to:
                  type: string
                  description: 目标版本（须高于起始版本）
                  example: '2.6.0'
                manifest:
                  type: string
                  description: 可选 manifest（JSON 字符串，可声明 target_schema_version）
      responses:
        '200':
          description: 上传并登记成功（校验未通过时包状态为 REJECTED 且 message 说明原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeRegisterPackageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /upgrades/precheck:
    post:
      operationId: upgradePrecheck
      tags: [upgrades]
      summary: 升级前检查
      description: >-
        对指定升级包执行升级前检查（版本匹配、磁盘空间、依赖可达性、进行中任务、迁移版本、主密钥、
        最近已验证备份、未决 CRITICAL 告警、升级包文件完整性（服务端目录中文件存在且 SHA-256/大小与登记一致，
        缺失或不一致即 FAIL）等），返回逐项结果与整体是否通过。权限：`upgrades.precheck`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradePrecheckRequest'
      responses:
        '200':
          description: 预检结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradePrecheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /upgrades:
    get:
      operationId: upgradeList
      tags: [upgrades]
      summary: 升级任务列表
      description: 分页查询升级任务。权限：`upgrades.read`、`upgrade_records.read` 任一。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, PRECHECK, BACKUP, APPLYING, MIGRATING, VERIFYING, SUCCESS, FAILED, ROLLING_BACK, ROLLED_BACK]
          description: 按任务状态过滤
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
          description: 页码，从 1 开始
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20}
          description: 每页条数
      responses:
        '200':
          description: 任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeJobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: upgradeExecute
      tags: [upgrades]
      summary: 执行升级
      description: >-
        以指定升级包创建异步升级任务（PRECHECK → BACKUP → APPLYING → MIGRATING → VERIFYING；
        升级前自动创建 FULL 加密备份，失败自动回滚）。升级包必须为 VERIFIED 状态，否则 409；
        已有进行中的升级任务时返回 409。高危操作，全程审计。权限：`upgrades.execute`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeExecuteRequest'
      responses:
        '200':
          description: 任务已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 升级包未通过校验或已有进行中的升级任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /upgrades/{id}:
    get:
      operationId: upgradeGet
      tags: [upgrades]
      summary: 升级任务详情
      description: 按 ID 查询升级任务详情（含预检结果与失败原因）。权限：`upgrades.read`、`upgrade_records.read` 任一。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 升级任务 ID
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /upgrades/{id}/rollback:
    post:
      operationId: upgradeRollback
      tags: [upgrades]
      summary: 回滚升级任务
      description: >-
        显式回滚已完成（SUCCESS）或失败（FAILED）的升级任务，恢复其升级前备份。
        任务无升级前备份或状态不允许时返回 409。高危操作，全程审计。权限：`upgrades.rollback`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 升级任务 ID
      responses:
        '200':
          description: 回滚已启动，返回任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务无升级前备份或状态不允许回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- 交付检查 ----------
  /delivery-checks:
    get:
      operationId: deliveryCheckList
      tags: [delivery-checks]
      summary: 交付检查记录列表
      description: 分页查询交付检查执行记录。权限：`delivery_checks.read`。
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
          description: 页码，从 1 开始
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20}
          description: 每页条数
      responses:
        '200':
          description: 检查记录分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryCheckListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /delivery-checks/run:
    post:
      operationId: deliveryCheckRun
      tags: [delivery-checks]
      summary: 执行交付检查
      description: >-
        同步执行全量交付检查项（≥20 项，分关键/非关键）并落库：任一关键项 FAIL → 整体 FAIL；
        无关键 FAIL 但存在 WARNING 或非关键 FAIL → 整体 WARNING；否则 PASS。写操作审计。
        权限：`delivery_checks.run`。
      responses:
        '200':
          description: 检查完成，返回检查记录与逐项结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryCheckResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /delivery-checks/{id}:
    get:
      operationId: deliveryCheckGet
      tags: [delivery-checks]
      summary: 交付检查详情
      description: 按 ID 查询交付检查记录与逐项结果明细。权限：`delivery_checks.read`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 检查记录 ID
      responses:
        '200':
          description: 检查详情（含结果明细）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryCheckResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /delivery-checks/{id}/export:
    get:
      operationId: deliveryCheckExport
      tags: [delivery-checks]
      summary: 导出交付检查结果
      description: >-
        导出检查结果文件（format=json 默认，返回 application/json 附件；format=csv 返回 text/csv 附件，
        均为 Content-Disposition: attachment）。记录导出审计。权限：`delivery_checks.read`。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
          description: 检查记录 ID
        - name: format
          in: query
          required: false
          schema: {type: string, enum: [json, csv], default: json}
          description: 导出格式
      responses:
        '200':
          description: 导出文件（json 或 csv）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryCheckResultResponse'
            text/csv:
              schema: {type: string, description: 'CSV 文本，表头：item_key,item_name,category,critical,result,message'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /license/status:
    get:
      operationId: licenseStatus
      tags: [license]
      summary: 当前授权状态
      description: >-
        返回当前离线授权内存状态快照（含本机指纹与配额用量）。
        权限：登录即可访问（授权锁定状态下前端仍需查询，故不挂权限点）。
      responses:
        '200':
          description: 授权状态快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /license/import:
    post:
      operationId: licenseImport
      tags: [license]
      summary: 导入离线授权文件
      description: >-
        导入 .lic 离线授权文件：支持 multipart/form-data（字段名 file）或 JSON body `{file_content}` 两种方式，
        文件上限 64KB。解析失败 400、验签失败 422、指纹不匹配/重复导入 409。
        成功响应返回导入后的最新授权状态（与 GET /license/status 同结构）。
        写操作记操作审计（高风险）。权限：`license.manage`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .lic 授权文件（≤64KB）
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseImportRequest'
      responses:
        '200':
          description: 导入成功，返回最新授权状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 机器指纹不匹配或重复导入（license_id 已存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 授权文件验签失败（错误码 LICENSE_INVALID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /license/history:
    get:
      operationId: licenseHistory
      tags: [license]
      summary: 授权导入历史
      description: >-
        分页查询授权导入历史（imported_at 倒序；不含 payload/signature/raw_file 敏感原文）。
        权限：`license.read`。
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
          description: 页码，从 1 开始
        - name: page_size
          in: query
          required: false
          schema: {type: integer, default: 20}
          description: 每页条数
      responses:
        '200':
          description: 导入历史分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseHistoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /report-schedules:
    get:
      operationId: reportScheduleList
      tags: [reports]
      summary: 定时报告计划列表
      description: 分页查询定时报告计划。权限：`reports.read`、`reports.read_audit` 任一。
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1}
          description: 页码，从 1 开始
        - name: page_size
          in: query
