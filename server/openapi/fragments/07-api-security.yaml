      description: >-
        列出已吊销凭据清单（阶段8 §35「已吊销凭据使用」数据源；指纹级，无凭据明文）。
        credential_type / active（当前生效窗口内）过滤可选。权限：`api_credential.read`。
      parameters:
        - { name: credential_type, in: query, required: false, schema: { type: string, enum: [auth, key, sess] }, description: 按凭据来源上下文过滤 }
        - { name: active, in: query, required: false, schema: { type: boolean }, description: 按当前生效窗口过滤 }
      responses:
        '200':
          description: 已吊销凭据列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiRevokedCredentialListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiRevokedCredentialCreate
      tags: [api-security]
      summary: 登记吊销凭据
      description: >-
        登记一条已吊销凭据（指纹级，不存凭据明文）。凭据身份沿用项目统一口径：
        credential_type 与网关身份指纹前缀（auth:/key:/sess:）一致，fingerprint 为
        加盐 HMAC-SHA256 截断 16 字节的 32 位 hex（不含前缀）。吊销人由服务端取自
        登录主体。同类型同指纹重复登记 409；同指纹不同来源类型允许分别登记。
        登记即进入下次发布载荷（当前生效窗口内的行才下发网关）。写操作审计。
        权限：`api_credential.manage`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiRevokedCredentialCreateRequest' }
      responses:
        '201':
          description: 登记成功，返回完整记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiRevokedCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/revoked-credentials/{id}:
    get:
      operationId: apiRevokedCredentialGet
      tags: [api-security]
      summary: 已吊销凭据详情
      description: 读取单条已吊销凭据记录。权限：`api_credential.read`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 吊销记录 ID }
      responses:
        '200':
          description: 已吊销凭据详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiRevokedCredential' }
