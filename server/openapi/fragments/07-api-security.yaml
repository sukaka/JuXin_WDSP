        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiMachineIdentityBindingCreate
      tags: [api-security]
      summary: 创建机器身份绑定
      description: >-
        创建绑定（path_exact|path_prefix 二选一（jwt selector 同形——/ 开头、≤512、不含
        query/fragment）；同（应用,path）恰一条——重复 409；application_id 引用必须存在
        （400）；mode 缺省 OBSERVE；proof_required=true 时绑定命中且未签名请求拒绝 401）。
        变更触发整站发布链热生效。HIGH 审计。权限：`jwt_trust.manage`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiMachineIdentityBindingInput' }
      responses:
        '200':
          description: 创建的绑定
          content:
