      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 规则 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecMaskingRuleRequest' }
      responses:
        '200':
          description: 更新后的规则（data 即规则对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecMaskingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecMaskingRuleDelete
      tags: [api-security]
      summary: 删除脱敏规则
      description: 删除脱敏规则。写操作审计（高风险）。权限：`api_data.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 规则 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/sensitive/overview:
    get:
      operationId: apiSecSensitiveOverview
      tags: [api-security]
      summary: 敏感数据态势总览
      description: >-
        涉敏 API 数、敏感字段行数、按数据类型分布与近 N 天敏感检测趋势
        （api_sensitive_fields + api_runtime_events 聚合；趋势零值日补齐，
        days 缺省 7、上限 30；data 即态势对象本身）。权限：`api_data.read`
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 趋势天数（1-30，非法值归一为 7）
      responses:
        '200':
          description: 敏感数据态势
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 防护策略（apisecurity，模式 db>env>default） ====================
  /api-security/policy:
    get:
      operationId: apiSecPolicyGet
      tags: [api-security]
      summary: API 动态防护策略视图
      description: >-
        返回产品形态、能力开关、生效防护模式与来源（settings 表覆盖 > 环境变量 > 内置默认 OBSERVE，
        fail-safe）及网关解析限制（data 即策略对象本身）。权限：`api_policy.read`
      responses:
        '200':
          description: 防护策略视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: apiSecPolicyUpdate
      tags: [api-security]
      summary: 更新 API 动态防护模式
      description: >-
        覆盖写入 settings 表 api_protection.mode（仅接受 OFF/OBSERVE/PROTECT，自动转大写），
        发布后与 env/默认值形成 db>env>default 取值顺序；需调用发布接口后下发网关生效。写操作审计。
        权限：`api_policy.edit`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecPolicyUpdateRequest' }
      responses:
        '200':
          description: 更新后的防护策略视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecPolicyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 设置服务未配置（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api-security/policy/publish:
    post:
      operationId: apiSecPolicyPublish
      tags: [api-security]
      summary: 发布 API 动态防护策略
      description: >-
        触发一次配置发布（同步等待最终状态），使防护模式与正式模型约束下发网关。无请求体。写操作审计。
        权限：`api_policy.publish`
      responses:
        '200':
          description: 发布任务结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecPolicyPublishResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 发布能力未配置（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ==================== AUTHZ-01 可信对象关系与 OBSERVE 决策 ====================
  /api-security/authz/relations/candidates:
    get:
      operationId: apiSecAuthzRelationCandidateList
      tags: [api-security]
      summary: 对象授权关系候选分页列表
      description: 仅展示脱敏对象引用；历史指纹或冻结候选不可确认。权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, REJECTED, FROZEN, CONFIRMED] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 候选分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzRelationCandidateListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/relations/candidates/{id}/confirm:
    post:
      operationId: apiSecAuthzRelationCandidateConfirm
      tags: [api-security]
      summary: 确认对象授权关系候选
      description: 将可信主体候选确认为 OWNER 关系并记录审计；历史指纹、冻结或已审核候选返回冲突。权限：`api_authorization.relation_manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzCandidateConfirmRequest' }
      responses:
        '200':
          description: 已确认的对象关系
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 候选不可确认或关系冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/relations/candidates/{id}/reject:
    post:
      operationId: apiSecAuthzRelationCandidateReject
      tags: [api-security]
      summary: 拒绝对象授权关系候选
      description: 拒绝待审核候选并记录原因和操作审计。权限：`api_authorization.relation_manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzCandidateRejectRequest' }
      responses:
        '200':
          description: 已拒绝的候选
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzRelationCandidate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 候选已经完成审核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/relations:
    get:
      operationId: apiSecAuthzObjectRelationList
      tags: [api-security]
      summary: 可信对象授权关系分页列表
      description: 按应用、对象类型和状态查询对象授权关系。权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: object_type, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [CONFIRMED, REVOKED, EXPIRED] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 对象关系分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelationListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecAuthzObjectRelationCreate
      tags: [api-security]
      summary: 人工创建可信对象授权关系
      description: 人工创建 OWNER 或 SHARED_WITH；SHARED_WITH 方向为 object_ref 对象共享给 principal_id 接收人，且仅 source=MANUAL；候选确认与权威导入不支持共享。对象引用必须为服务端 HMAC 脱敏引用。权限：`api_authorization.relation_manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelationRequest' }
      responses:
        '200':
          description: 创建成功的对象关系
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 关系已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/relations/{id}/revoke:
    post:
      operationId: apiSecAuthzObjectRelationRevoke
      tags: [api-security]
      summary: 撤销对象授权关系
      description: 将已确认的对象授权关系撤销，保留历史记录并触发授权配置重新发布；权限：`api_authorization.relation_manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzRelationRevokeRequest' }
      responses:
        '200':
          description: 已撤销的对象关系
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 关系已撤销或过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/relations/{id}/reauthorize:
    post:
      operationId: apiSecAuthzObjectRelationReauthorize
      tags: [api-security]
      summary: 重新授权对象授权关系
      description: 仅允许 REVOKED/EXPIRED 关系显式恢复为 CONFIRMED；刷新确认人和有效期，写入操作审计并触发授权配置重新发布。普通创建和重复导入不会自动恢复关系；权限：`api_authorization.relation_manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzRelationReauthorizeRequest' }
      responses:
        '200':
          description: 已重新授权的对象关系
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 关系当前状态不允许重新授权
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/decisions:
    get:
      operationId: apiSecAuthzDecisionList
      tags: [api-security]
      summary: 授权决策分页列表
      description: >-
        查询 ALLOW、OBSERVE_VIOLATION、UNKNOWN、VERIFIED_VIOLATION（NG-AZ-03 D1 第四值：
        违规事实经显式资格判定成立）决策链。UNKNOWN 表示证据不足，不计作违规且永不阻断；
        VERIFIED_VIOLATION 行的 evidence 内嵌 authz_enforcement 实断证据（仅 PROTECT 端点产生）。
        仅具有 `api_authorization.evidence_read` 的用户收到 evidence。权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: decision, in: query, required: false, schema: { type: string, enum: [ALLOW, OBSERVE_VIOLATION, UNKNOWN, VERIFIED_VIOLATION] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 授权决策分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzDecisionListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/decisions/{id}:
    get:
      operationId: apiSecAuthzDecisionGet
      tags: [api-security]
      summary: 查看授权决策详情
      description: >-
        按决策 ID 查看单条授权决策及脱敏证据链（VERIFIED_VIOLATION 行含 authz_enforcement
        实断证据）。需要同时具备 `api_authorization.read` 与 `api_authorization.evidence_read`；
        指定 application_id 且不匹配时返回 404，避免跨应用枚举。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 授权决策详情（含脱敏 evidence）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/coverage:
    get:
      operationId: apiSecAuthzCoverageGet
      tags: [api-security]
      summary: 对象授权覆盖率
      description: 返回 VERIFIED 身份、对象模型、已确认关系和 UNKNOWN 决策比例及原始计数。权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 授权覆盖率
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzCoverage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== NG-AZ-04 PROTECT 切换向导（apiauthzwizard） ====================
  /api-security/authz/enforcement-readiness:
    get:
      operationId: apiSecAuthzEnforcementReadinessList
      tags: [api-security]
      summary: 端点级实断资格（readiness）派生
      description: >-
        「当前能否实断」服务端派生（NG-AZ-04 §1.2，唯一事实源——前端只渲染徽章与 reasons）：
        READY / PROTECT_ACTIVE（展示态）/ NOT_PUBLISHABLE / BLOCKED_BY_NO_RELATION /
        BLOCKED_BY_CONFLICT / BLOCKED_BY_STALE / BLOCKED_BY_NODE 六态，reasons 全列
        （全部不真因子原文，而非仅首个；含 UNKNOWN 永不阻断语义注记）。派生输入：
        对象模型资格字段、有效 OWNER 关系、OPEN 冲突、快照/租约/时钟时效、节点 ACK 与
        能力自报（az/3）。权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: endpoint_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: readiness 派生列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzEnforcementReadinessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/enforcement-impact:
    post:
      operationId: apiSecAuthzEnforcementImpactEvaluate
      tags: [api-security]
      summary: PROTECT 切换影响评估（切换前预览）
      description: >-
        只读评估（NG-AZ-04 §1.3；不产生任何写副作用，评估结果不入库）：该端点近 N 天
        OBSERVE_VIOLATION 命中数（切换后将被 403 的请求量近似）、UNKNOWN 分桶（永不阻断）、
        涉及主体数、最近命中样本（≤5，仅 `api_authorization.evidence_read` 返回）、
        readiness 复用派生。window_days 词表 1~30（词表外 400 不夹紧猜义）；端点多对象模型
        行时须指定 object_segment。`api_authorization.read` 可评估；
        `api_authorization.manage` 评估同时签发一次性 confirm_token（15 分钟 TTL，
        绑定端点×对象段——PATCH enforcement=PROTECT 的强制引用）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzEnforcementImpactRequest' }
      responses:
        '200':
          description: 影响评估结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzEnforcementImpact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/enforcement-confirmations:
    get:
      operationId: apiSecAuthzEnforcementConfirmationList
      tags: [api-security]
      summary: 业务确认单分页查询
      description: >-
        PROTECT 切换业务确认单（NG-AZ-04 §1.4）查询：签发（影响评估）→ 签署 → PATCH 消费
        全生命周期状态（signed_at/consumed_at/consumed_audit_id 溯源）。确认单留存不删
        （历史事实，与「回滚不回退事实」同纪律）。权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: endpoint_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 确认单分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzEnforcementConfirmationListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/enforcement-confirmations/{confirm_token}/sign:
    post:
      operationId: apiSecAuthzEnforcementConfirmationSign
      tags: [api-security]
      summary: 业务确认单签署
      description: >-
        向导第 4 步签署动作（NG-AZ-04 §1.4/§1.5）：按 confirm_token 列查找更新
        （向导/前端只持有令牌——影响评估响应无行 id，路径参数即 confirm_token 语义）；
        四要素随签署同批回填（enforcement_owner 非空 ≤128 / evidence_source 词表 /
        on_unknown 首批仅 ALLOW_UNKNOWN），冻结确认文案 v1 按确认单影响摘要生成落库；
        不存在 404，已消费/已过期/已签署 400 精确区分。权限：`api_authorization.manage`；HIGH 审计。
      parameters:
        - { name: confirm_token, in: path, required: true, schema: { type: string, format: uuid }, description: 一次性签署令牌（影响评估响应签发） }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzEnforcementSignRequest' }
      responses:
        '200':
          description: 签署后的确认单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzEnforcementConfirmation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/conflicts:
    get:
      operationId: apiSecAuthzConflictList
      tags: [api-security]
      summary: 授权冲突对象独立分页查询
      description: >-
        OPEN 冲突对象按应用过滤的独立分页查询（NG-AZ-04 D1 注：不再只嵌 authorities
        status 且不受其 50 条上限约束；D7 语义——冲突不可信，UNKNOWN 不阻断）。
        权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [OPEN, RESOLVED], default: OPEN } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 冲突对象分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzConflictListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== NG-FLOW-01 强流程定义（strongflow） ====================
  /api-security/strong-flows/definitions:
    get:
      operationId: apiSecStrongFlowDefinitionList
      tags: [api-security]
      summary: 强流程定义分页列表
      description: 强流程定义（NG-FLOW-01；与既有流程观察 api_flow_baselines 物理隔离）分页查询，按 application_id/status 过滤。权限：`api_flow.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, ACTIVE, RETIRED] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 定义分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecStrongFlowDefinitionListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecStrongFlowDefinitionCreate
      tags: [api-security]
      summary: 新建强流程定义（或同名新草稿版本递进）
      description: >-
        新建定义（同应用同名不存在 → version=1 DRAFT；已存在 → version=max+1 新草稿——
        D1「编辑产新草稿」承载）。载荷校验逐条按 §1.1（词表外 400 不降级猜义；
        success_rule 白名单键未知键拒收）。权限：`api_flow.manage`；HIGH 审计。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecStrongFlowDefinitionInput' }
      responses:
        '200':
          description: 新建的定义（DRAFT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecStrongFlowDefinitionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/strong-flows/definitions/{id}:
    get:
      operationId: apiSecStrongFlowDefinitionGet
      tags: [api-security]
      summary: 强流程定义详情（含步骤）
      description: 按 ID 读定义与步骤（sequence 升序）。权限：`api_flow.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 定义详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecStrongFlowDefinitionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: apiSecStrongFlowDefinitionUpdate
      tags: [api-security]
      summary: 编辑强流程定义（仅 DRAFT；激活即冻结）
      description: >-
        整体替换语义（步骤全量给出）；仅 DRAFT 可编辑——ACTIVE/RETIRED 409
        （激活即冻结不可变，D1）。权限：`api_flow.manage`；HIGH 审计。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecStrongFlowDefinitionInput' }
      responses:
        '200':
          description: 更新后的定义
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecStrongFlowDefinitionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/strong-flows/definitions/{id}/activate:
    post:
      operationId: apiSecStrongFlowDefinitionActivate
      tags: [api-security]
      summary: 激活强流程定义（激活即冻结）
      description: >-
        activate 前全量校验（载荷重校 + 步骤端点归属核对：endpoint_key 须属于绑定前缀
        下本应用已 CONFIRMED 端点，非法 400 不降级放行）；同事务 DRAFT→ACTIVE 且同
        （应用,名称）旧 ACTIVE→RETIRED（恰一个 ACTIVE 由部分唯一索引兜底）。
        权限：`api_flow.manage`；HIGH 审计。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 激活后的定义
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecStrongFlowDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/strong-flows/definitions/{id}/retire:
    post:
      operationId: apiSecStrongFlowDefinitionRetire
      tags: [api-security]
      summary: 停用强流程定义（RETIRED 单向终态）
      description: >-
        ACTIVE/DRAFT→RETIRED；RETIRED 单向终态（重复停用 409）。存量实例按旧版本走完
        （NG-T-F06，实例语义属 FLOW-02）。权限：`api_flow.manage`；HIGH 审计。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 停用结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [RETIRED] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/strong-flows/instances:
    get:
      operationId: apiSecStrongFlowInstanceList
      tags: [api-security]
      summary: 强流程实例分页列表（NG-FLOW-02 最小面）
      description: >-
        强流程实例（api_strong_flow_instances；迁移 000177）按应用/状态/创建时间过滤分页；
        五态 ACTIVE/CONFIRMED/INDETERMINATE/CANCELLED/FAILED（INDETERMINATE=未知待对账，
        不显示安全通过）；instance_key 为 sfref: 前缀域隔离 HMAC 脱敏形态。详情与管理恢复
        属 FLOW-03。权限：`api_flow.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, CONFIRMED, INDETERMINATE, CANCELLED, FAILED] } }
        - { name: created_since, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 实例分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecStrongFlowInstanceListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/strong-flows/instances/{id}:
    get:
      operationId: apiSecStrongFlowInstanceGet
      tags: [api-security]
      summary: 强流程实例详情（步骤轨迹全链 + 状态语义 + 证据按 evidence_read 裁剪）
      description: >-
        实例行 + 步骤事件轨迹（api_strong_flow_step_events 按 occurred_at 全链升序）+
        状态语义字段（status_semantics/status_message：INDETERMINATE=「未知，不显示安全通过」
        逐字不美化，§9.4 红线，前端不得映射为成功态）。证据明细档
        （fencing_token/reason_code/request_id）仅持 `api_authorization.evidence_read`
        者带出（无该权限键缺席——D9 零新增权限点，复用授权域已种 evidence_read）；
        摘要档四字段（step_key/action/result/occurred_at）随读权限可见。
        权限：`api_flow.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 实例详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecStrongFlowInstanceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/strong-flows/instances/{id}/resolve:
    post:
      operationId: apiSecStrongFlowInstanceResolve
      tags: [api-security]
      summary: 强流程实例管理恢复（对账：CONFIRM_SUCCEEDED / CONFIRM_NOT_EXECUTED / KEEP_UNKNOWN）
      description: >-
        人工对账恢复（NG-FLOW-03 §1.5/D5）：CONFIRM_SUCCEEDED 确认业务已执行 → 实例推
        CONFIRMED；CONFIRM_NOT_EXECUTED 确认未执行 → 推 FAILED（明确证据进入终态）；
        KEEP_UNKNOWN 不推进状态（保持未知，绝不美化成通过），仅落 RESOLVE 留痕事件。
        CONFIRM_* 推进终态并落状态事件（reason_code=FLOW-RESOLVE-001 与网关执行侧区分），
        实例行 version+1。reason 必填（400）；expected_version 乐观锁（不匹配 409）；
        终态实例（CONFIRMED/CANCELLED/FAILED）拒绝重复恢复（409 幂等不误伤）。
        权限：`api_flow.manage`；HIGH 审计（after 含 action/reason/前后状态全值）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecStrongFlowResolveInput' }
      responses:
        '200':
          description: 恢复后的实例详情（证据裁剪同详情端点纪律）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecStrongFlowInstanceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== API 专项指标（metrics，app.go 挂载） ====================
  /api-security/metrics:
    get:
      operationId: apiSecMetricsGet
      tags: [api-security]
      summary: API 专项指标（Prometheus 文本）
      description: >-
        输出 15 项 API 专项指标（端点资产/新发现/学习任务与样本/候选与正式模型/运行时编译与失败/
        五类风险发现/响应脱敏决策，详见 metrics.apiMetricDocs）及采集器自指标
        （api_metrics_collect_errors_total、api_metrics_last_collect_timestamp_seconds）的
        Prometheus 文本 exposition；无值指标取 0 以保证抓取方时序连续。
        内嵌强流程运行指标段（NG-FLOW-04 §1.9，per-app labeled 序列）：
        strong_flow_instances{application_id,status} 五态分桶、
        strong_flow_indeterminate_backlog / _ratio（INDETERMINATE 当前积压与占实例比）、
        strong_flow_indeterminate_age_avg_seconds / _max_seconds（对账滞留时延=采集时刻-updated_at 的 avg/max）、
        strong_flow_reserve_conflict_ratio（近 24h RESERVE 动作 CONFLICT+REJECTED 占比，窗口无样本=0 不外推）；
        无强流程实例时整段省略（无强流程活动即零输出，Prometheus absent 语义）。
        注意：本接口响应为 `text/plain; version=0.0.4`，非 JSON 统一信封。
        权限：`api_runtime.read`
      responses:
        '200':
          description: Prometheus 文本格式指标（text/plain; version=0.0.4; charset=utf-8）
          content:
            text/plain:
              schema: { type: string, description: Prometheus exposition 文本（HELP/TYPE/样本行） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 授权基线（apiauthz：BFLA/BOLA/字段越权，迁移 000048 权限点） ====================
  /api-security/authz/role-baselines:
    get:
      operationId: apiSecAuthzRoleBaselineList
      tags: [api-security]
      summary: 角色基线分页列表
      description: >-
        分页列出角色功能级基线（api_role_baselines，BFLA 防护基线，随发布通道下发网关）。
        method/source 自动转大写且非白名单返回 400；endpoint_id 非法 UUID、confirmed 非布尔取值均返回 400。
        权限：`api_authorization.read`
      parameters:
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按接口资产过滤
        - name: role
          in: query
          required: false
          schema: { type: string }
          description: 按角色码过滤
        - name: method
          in: query
          required: false
          schema: { type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS] }
          description: 按 HTTP 方法过滤（自动转大写）
        - name: source
          in: query
          required: false
          schema: { type: string, enum: [MANUAL, SPEC, OBSERVED, IMPORTED] }
          description: 按基线来源过滤（自动转大写）
        - name: confirmed
          in: query
          required: false
          schema: { type: boolean }
          description: 按确认状态过滤（true=正式基线 / false=候选）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页角色基线列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRoleBaselineListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecAuthzRoleBaselineCreate
      tags: [api-security]
      summary: 新增角色基线
      description: >-
        新增角色基线：endpoint_id/role/method/action 必填；source 缺省 MANUAL、confidence 缺省 0、
        allowed 缺省 false；新建为候选（confirmed=false），生效需走确认接口。
        同端点相同角色/方法/动作的基线已存在返回 409；引用的端点资产不存在返回 400。
        写操作审计。权限：`api_authorization.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecRoleBaselineRequest' }
      responses:
        '200':
          description: 创建成功的基线（data 即基线对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRoleBaseline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 相同角色/方法/动作的基线已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/role-baselines/{id}:
    get:
      operationId: apiSecAuthzRoleBaselineGet
      tags: [api-security]
      summary: 角色基线详情
      description: 按 ID 读取角色基线。权限：`api_authorization.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 基线 ID
      responses:
        '200':
          description: 基线详情（data 即基线对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRoleBaseline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: apiSecAuthzRoleBaselineUpdate
      tags: [api-security]
      summary: 编辑角色基线
      description: >-
        部分更新（仅更新请求中出现的字段）；endpoint_id 不可改（换端点 = 删除后重建），
        confirmed 不随编辑变更（只能经确认接口变更）。写操作审计。
        权限：`api_authorization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 基线 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecRoleBaselineRequest' }
      responses:
        '200':
          description: 更新后的基线（data 即基线对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRoleBaseline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 相同角色/方法/动作的基线已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecAuthzRoleBaselineDelete
      tags: [api-security]
