  # ==================== 弱点中心（apiweakness，P0-13 补全） ====================
  # 状态机：NEW → CONFIRMED → TO_FIX → FIXED →（复测 PASS）ARCHIVED /（复测 FAIL）REPRODUCED；
  # IGNORED（接受风险/误报，NEW/CONFIRMED/TO_FIX/REPRODUCED 可入）；ARCHIVED 终态。
  # 非法迁移返回 400；FIXED 后再被派生扫描命中自动回 REPRODUCED；IGNORED/ARCHIVED 不复活。
  /api-security/weaknesses:
    get:
      operationId: apiSecWeaknessList
      tags: [api-security]
      summary: 弱点分页列表
      description: >-
        分页列出 API 弱点（api_weaknesses，由派生扫描 SweepOnce 从运行时事件/违例/敏感字段归集），
        按 last_seen 倒序；status/severity/category 自动转大写，非白名单取值返回 400；
        endpoint_id 非法 UUID 返回 400。权限：`api_weakness.read`
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [NEW, CONFIRMED, TO_FIX, FIXED, REPRODUCED, IGNORED, ARCHIVED] }
          description: 生命周期状态过滤（自动转大写）
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL] }
          description: 严重级别过滤（自动转大写）
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [AUTHN, LIFECYCLE, SENSITIVE, SCHEMA] }
          description: 弱点分类过滤（自动转大写）
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按接口过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页弱点列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecWeaknessListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/weaknesses/{id}:
    get:
      operationId: apiSecWeaknessDetail
      tags: [api-security]
      summary: 弱点详情
      description: >-
        弱点详情 + 整改/复测历史（api_weakness_actions，按创建时间倒序，最多返回 100 条）。
        权限：`api_weakness.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 弱点 ID
      responses:
        '200':
          description: 弱点详情与动作历史
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecWeaknessDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/weaknesses/{id}/confirm:
    post:
      operationId: apiSecWeaknessConfirm
      tags: [api-security]
      summary: 确认弱点
      description: >-
        确认弱点为真实问题（NEW → CONFIRMED）；当前状态不允许时返回 400。
        请求体可空（仅备注，≤512 字符）。写操作审计。权限：`api_weakness.handle`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 弱点 ID
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecWeaknessNoteRequest' }
      responses:
        '200':
          description: 更新后的弱点（data 为 {weakness}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecWeaknessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/weaknesses/{id}/assign:
    post:
      operationId: apiSecWeaknessAssign
      tags: [api-security]
      summary: 指派弱点整改
      description: >-
        指派/改派整改负责人（CONFIRMED/TO_FIX/REPRODUCED → TO_FIX）；owner 必填且 ≤128 字符，
        due_date 可空；当前状态不允许时返回 400。写操作审计。权限：`api_weakness.handle`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 弱点 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecWeaknessAssignRequest' }
      responses:
        '200':
          description: 更新后的弱点（data 为 {weakness}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecWeaknessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/weaknesses/{id}/fixed:
    post:
      operationId: apiSecWeaknessFixed
      tags: [api-security]
      summary: 标记弱点整改完成
      description: >-
        标记整改完成待复测（TO_FIX → FIXED，记录 fixed_at）；当前状态不允许时返回 400。
        请求体可空（仅备注）。写操作审计。权限：`api_weakness.handle`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 弱点 ID
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecWeaknessNoteRequest' }
      responses:
        '200':
          description: 更新后的弱点（data 为 {weakness}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecWeaknessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/weaknesses/{id}/retest:
    post:
      operationId: apiSecWeaknessRetest
      tags: [api-security]
      summary: 弱点复测
      description: >-
        复测整改结果：result=PASS → ARCHIVED（复测通过关闭）；result=FAIL → REPRODUCED（复测未通过，
        可重新指派整改）；仅 FIXED 状态可复测，记录 retested_at；result 取值外返回 400。
        写操作审计。权限：`api_weakness.handle`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 弱点 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecWeaknessRetestRequest' }
      responses:
        '200':
          description: 更新后的弱点（data 为 {weakness}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecWeaknessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/weaknesses/{id}/ignore:
    post:
      operationId: apiSecWeaknessIgnore
      tags: [api-security]
      summary: 忽略弱点
      description: >-
        接受风险或判定误报（NEW/CONFIRMED/TO_FIX/REPRODUCED → IGNORED）；忽略后派生扫描不再复活该弱点
        （仅累计触发次数与刷新证据），需人工另行处置；当前状态不允许时返回 400。
        请求体可空（仅备注）。写操作审计。权限：`api_weakness.handle`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 弱点 ID
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecWeaknessNoteRequest' }
      responses:
        '200':
          description: 更新后的弱点（data 为 {weakness}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecWeaknessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/weaknesses/{id}/archive:
    post:
      operationId: apiSecWeaknessArchive
      tags: [api-security]
      summary: 归档弱点
      description: >-
        人工归档关闭（CONFIRMED/TO_FIX/FIXED/REPRODUCED/IGNORED → ARCHIVED，终态）；
        当前状态不允许时返回 400。请求体可空（仅备注）。写操作审计。权限：`api_weakness.handle`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 弱点 ID
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecWeaknessNoteRequest' }
      responses:
        '200':
          description: 更新后的弱点（data 为 {weakness}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecWeaknessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 敏感数据管理面（apidata，P0-19 补全） ====================
  /api-security/sensitive-types:
    get:
      operationId: apiSecSensitiveTypeList
      tags: [api-security]
      summary: 敏感数据类型分页列表
      description: >-
        分页列出敏感数据类型（api_sensitive_data_types，含内置与自定义），按创建时间排序返回；
        status/level 自动转大写，非白名单取值返回 400；keyword 按名称子串过滤。
        权限：`api_data.read`
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ENABLED, DISABLED] }
          description: 状态过滤（自动转大写）
        - name: level
          in: query
          required: false
          schema: { type: string, enum: [NON_SENSITIVE, GENERAL, SENSITIVE, IMPORTANT, CORE] }
          description: 五级敏感等级过滤（自动转大写）
        - name: category
          in: query
          required: false
          schema: { type: string }
          description: 分类过滤（如 个人身份/金融账户，自定义词）
        - name: keyword
          in: query
          required: false
          schema: { type: string }
          description: 名称子串过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页敏感数据类型列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecSensitiveTypeCreate
      tags: [api-security]
      summary: 新增敏感数据类型
      description: >-
        新增敏感数据类型：name 与 data_type 必填（data_type 为与网关证据标签对齐的键），
        level 缺省 GENERAL、status 缺省 ENABLED；regex 需可编译，validator 仅支持空或 luhn，
        locations 取值白名单 query/json/form/xml/header/cookie/path/response_body（小写归一）。
        同名返回 409。写操作审计。权限：`api_data.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeRequest' }
      responses:
        '200':
          description: 创建成功的类型（data 即类型对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveDataType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 类型名称已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/sensitive-types/export:
    get:
      operationId: apiSecSensitiveTypeExport
      tags: [api-security]
      summary: 导出敏感数据类型
      description: >-
        导出全量类型（内置 + 自定义）为 JSON 文档（format=jiuzhang-api-sensitive-data-types），
        与导入格式对称可回灌。权限：`api_data.read`
      responses:
        '200':
          description: 类型导出文档（data 即导出对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeExportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/sensitive-types/import:
    post:
      operationId: apiSecSensitiveTypeImport
      tags: [api-security]
      summary: 导入敏感数据类型
      description: >-
        批量导入类型（与导出格式对称）：按 name upsert——存在则更新（version+1，内置身份保持），
        不存在则创建；条目的 id/version/is_builtin/时间戳一律忽略，由服务端重新授予。
        单次最多 500 条；全量校验通过后单事务应用（任一条非法整体 400，不产生部分写入）。
        写操作审计。权限：`api_data.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeImportRequest' }
      responses:
        '200':
          description: 导入结果（新建/更新计数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/sensitive-types/{id}:
    get:
      operationId: apiSecSensitiveTypeGet
      tags: [api-security]
      summary: 敏感数据类型详情
      description: 按 ID 读取敏感数据类型。权限：`api_data.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 类型 ID
      responses:
        '200':
          description: 类型详情（data 即类型对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveDataType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: apiSecSensitiveTypeUpdate
      tags: [api-security]
      summary: 编辑敏感数据类型
      description: >-
        部分更新（仅更新请求中出现的字段），编辑后 version 自增；
        内置类型（is_builtin）名称不可修改（与网关证据标签对齐键），其余字段可改；
        status 取 ENABLED/DISABLED 即启用/禁用。同名冲突返回 409。写操作审计。
        权限：`api_data.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 类型 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeUpdateRequest' }
      responses:
        '200':
          description: 更新后的类型（data 即类型对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveDataType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 类型名称已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecSensitiveTypeDelete
      tags: [api-security]
      summary: 删除敏感数据类型
      description: >-
        删除敏感数据类型；内置类型（is_builtin，与网关词表对齐的基线）禁止删除，返回 400。
        写操作审计。权限：`api_data.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 类型 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/masking-rules:
    get:
      operationId: apiSecMaskingRuleList
      tags: [api-security]
      summary: 脱敏规则分页列表
      description: >-
        分页列出响应脱敏规则（api_masking_rules，随发布通道下发网关执行 MASK/HASH/REMOVE），
        按创建时间倒序；scope 自动转大写且非白名单返回 400；application_id 非法 UUID、
        enabled 非布尔取值均返回 400。权限：`api_data.read`
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [GLOBAL, APPLICATION, ENDPOINT] }
          description: 作用域过滤（自动转大写）
        - name: application_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按站点（应用）过滤
        - name: endpoint_key
          in: query
          required: false
          schema: { type: string }
          description: 按接口键精确匹配（「METHOD 路径模板」）
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
          description: 按启用状态过滤（true/false）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页脱敏规则列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecMaskingRuleListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecMaskingRuleCreate
      tags: [api-security]
      summary: 新增脱敏规则
      description: >-
        新增脱敏规则：name 必填；enabled 缺省 true、scope 缺省 GLOBAL、algorithm 缺省 MASK；
        field_path 与 data_type 至少设置其一；作用域一致性校验（APPLICATION 必须带 application_id、
        ENDPOINT 必须带 endpoint_key、GLOBAL 两者均不允许）；exclusions_json 仅支持
        identity/role/ip 键（ip 项须为合法 IP 或 CIDR）。写操作审计。权限：`api_data.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecMaskingRuleRequest' }
      responses:
        '200':
          description: 创建成功的规则（data 即规则对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecMaskingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/masking-rules/{id}:
    get:
      operationId: apiSecMaskingRuleGet
      tags: [api-security]
      summary: 脱敏规则详情
      description: 按 ID 读取脱敏规则。权限：`api_data.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 规则 ID
      responses:
        '200':
          description: 规则详情（data 即规则对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecMaskingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: apiSecMaskingRuleUpdate
      tags: [api-security]
      summary: 编辑脱敏规则
      description: >-
        部分更新（仅更新请求中出现的字段）；可空字段（application_id/endpoint_key/data_type）
        显式传空串表示清除为 NULL——修改 scope 时需同时把不再适用的可空字段置空串
        （如 GLOBAL←APPLICATION 须带 application_id:""），否则合并后状态校验失败返回 400。
        写操作审计。权限：`api_data.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 规则 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecMaskingRuleRequest' }
      responses:
        '200':
          description: 更新后的规则（data 即规则对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecMaskingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecMaskingRuleDelete
      tags: [api-security]
      summary: 删除脱敏规则
      description: 删除脱敏规则。写操作审计（高风险）。权限：`api_data.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 规则 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/sensitive/overview:
    get:
      operationId: apiSecSensitiveOverview
      tags: [api-security]
      summary: 敏感数据态势总览
      description: >-
        涉敏 API 数、敏感字段行数、按数据类型分布与近 N 天敏感检测趋势
        （api_sensitive_fields + api_runtime_events 聚合；趋势零值日补齐，
        days 缺省 7、上限 30；data 即态势对象本身）。权限：`api_data.read`
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 趋势天数（1-30，非法值归一为 7）
      responses:
        '200':
          description: 敏感数据态势
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 防护策略（apisecurity，模式 db>env>default） ====================
  /api-security/policy:
    get:
      operationId: apiSecPolicyGet
      tags: [api-security]
      summary: API 动态防护策略视图
      description: >-
        返回产品形态、能力开关、生效防护模式与来源（settings 表覆盖 > 环境变量 > 内置默认 OBSERVE，
        fail-safe）及网关解析限制（data 即策略对象本身）。权限：`api_policy.read`
      responses:
        '200':
          description: 防护策略视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: apiSecPolicyUpdate
      tags: [api-security]
      summary: 更新 API 动态防护模式
      description: >-
        覆盖写入 settings 表 api_protection.mode（仅接受 OFF/OBSERVE/PROTECT，自动转大写），
        发布后与 env/默认值形成 db>env>default 取值顺序；需调用发布接口后下发网关生效。写操作审计。
        权限：`api_policy.edit`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecPolicyUpdateRequest' }
      responses:
        '200':
          description: 更新后的防护策略视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecPolicyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 设置服务未配置（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api-security/policy/publish:
    post:
      operationId: apiSecPolicyPublish
      tags: [api-security]
      summary: 发布 API 动态防护策略
      description: >-
        触发一次配置发布（同步等待最终状态），使防护模式与正式模型约束下发网关。无请求体。写操作审计。
        权限：`api_policy.publish`
      responses:
        '200':
          description: 发布任务结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecPolicyPublishResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 发布能力未配置（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ==================== AUTHZ-01 可信对象关系与 OBSERVE 决策 ====================
  /api-security/authz/relations/candidates:
    get:
      operationId: apiSecAuthzRelationCandidateList
      tags: [api-security]
      summary: 对象授权关系候选分页列表
      description: 仅展示脱敏对象引用；历史指纹或冻结候选不可确认。权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, REJECTED, FROZEN, CONFIRMED] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 候选分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzRelationCandidateListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/relations/candidates/{id}/confirm:
    post:
      operationId: apiSecAuthzRelationCandidateConfirm
      tags: [api-security]
      summary: 确认对象授权关系候选
      description: 将可信主体候选确认为 OWNER 关系并记录审计；历史指纹、冻结或已审核候选返回冲突。权限：`api_authorization.relation_manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzCandidateConfirmRequest' }
      responses:
        '200':
          description: 已确认的对象关系
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 候选不可确认或关系冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/relations/candidates/{id}/reject:
    post:
      operationId: apiSecAuthzRelationCandidateReject
      tags: [api-security]
      summary: 拒绝对象授权关系候选
      description: 拒绝待审核候选并记录原因和操作审计。权限：`api_authorization.relation_manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzCandidateRejectRequest' }
      responses:
        '200':
          description: 已拒绝的候选
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzRelationCandidate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 候选已经完成审核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/relations:
    get:
      operationId: apiSecAuthzObjectRelationList
      tags: [api-security]
      summary: 可信对象授权关系分页列表
      description: 按应用、对象类型和状态查询对象授权关系。权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: object_type, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [CONFIRMED, REVOKED, EXPIRED] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 对象关系分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelationListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecAuthzObjectRelationCreate
      tags: [api-security]
      summary: 人工创建可信对象授权关系
      description: 首期仅允许 OWNER；对象引用必须为服务端 HMAC 脱敏引用。权限：`api_authorization.relation_manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelationRequest' }
      responses:
        '200':
          description: 创建成功的对象关系
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 关系已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/relations/{id}/revoke:
    post:
      operationId: apiSecAuthzObjectRelationRevoke
      tags: [api-security]
      summary: 撤销对象授权关系
      description: 将已确认的对象授权关系撤销，保留历史记录并触发授权配置重新发布；权限：`api_authorization.relation_manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzRelationRevokeRequest' }
      responses:
        '200':
          description: 已撤销的对象关系
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzObjectRelation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 关系已撤销或过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/decisions:
    get:
      operationId: apiSecAuthzDecisionList
      tags: [api-security]
      summary: OBSERVE 授权决策分页列表
      description: >-
        查询 ALLOW、OBSERVE_VIOLATION、UNKNOWN 决策链。UNKNOWN 表示证据不足，不计作违规；
        仅具有 `api_authorization.evidence_read` 的用户收到 evidence。权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: decision, in: query, required: false, schema: { type: string, enum: [ALLOW, OBSERVE_VIOLATION, UNKNOWN] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 授权决策分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzDecisionListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/decisions/{id}:
    get:
      operationId: apiSecAuthzDecisionGet
      tags: [api-security]
      summary: 查看 OBSERVE 授权决策详情
      description: >-
        按决策 ID 查看单条授权决策及脱敏证据链。需要同时具备
        `api_authorization.read` 与 `api_authorization.evidence_read`；指定
        application_id 且不匹配时返回 404，避免跨应用枚举。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 授权决策详情（含脱敏 evidence）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/coverage:
    get:
      operationId: apiSecAuthzCoverageGet
      tags: [api-security]
      summary: 对象授权覆盖率
      description: 返回 VERIFIED 身份、对象模型、已确认关系和 UNKNOWN 决策比例及原始计数。权限：`api_authorization.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 授权覆盖率
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzCoverage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== API 专项指标（metrics，app.go 挂载） ====================
  /api-security/metrics:
    get:
      operationId: apiSecMetricsGet
      tags: [api-security]
      summary: API 专项指标（Prometheus 文本）
      description: >-
        输出 15 项 API 专项指标（端点资产/新发现/学习任务与样本/候选与正式模型/运行时编译与失败/
        五类风险发现/响应脱敏决策，详见 metrics.apiMetricDocs）及采集器自指标
        （api_metrics_collect_errors_total、api_metrics_last_collect_timestamp_seconds）的
        Prometheus 文本 exposition；无值指标取 0 以保证抓取方时序连续。
        注意：本接口响应为 `text/plain; version=0.0.4`，非 JSON 统一信封。
        权限：`api_runtime.read`
      responses:
        '200':
          description: Prometheus 文本格式指标（text/plain; version=0.0.4; charset=utf-8）
          content:
            text/plain:
              schema: { type: string, description: Prometheus exposition 文本（HELP/TYPE/样本行） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 授权基线（apiauthz：BFLA/BOLA/字段越权，迁移 000048 权限点） ====================
  /api-security/authz/role-baselines:
    get:
      operationId: apiSecAuthzRoleBaselineList
      tags: [api-security]
      summary: 角色基线分页列表
      description: >-
        分页列出角色功能级基线（api_role_baselines，BFLA 防护基线，随发布通道下发网关）。
        method/source 自动转大写且非白名单返回 400；endpoint_id 非法 UUID、confirmed 非布尔取值均返回 400。
        权限：`api_authorization.read`
      parameters:
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按接口资产过滤
        - name: role
          in: query
          required: false
          schema: { type: string }
          description: 按角色码过滤
        - name: method
          in: query
          required: false
          schema: { type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS] }
          description: 按 HTTP 方法过滤（自动转大写）
        - name: source
          in: query
          required: false
          schema: { type: string, enum: [MANUAL, SPEC, OBSERVED, IMPORTED] }
          description: 按基线来源过滤（自动转大写）
        - name: confirmed
          in: query
          required: false
          schema: { type: boolean }
          description: 按确认状态过滤（true=正式基线 / false=候选）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页角色基线列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRoleBaselineListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecAuthzRoleBaselineCreate
      tags: [api-security]
      summary: 新增角色基线
      description: >-
        新增角色基线：endpoint_id/role/method/action 必填；source 缺省 MANUAL、confidence 缺省 0、
        allowed 缺省 false；新建为候选（confirmed=false），生效需走确认接口。
        同端点相同角色/方法/动作的基线已存在返回 409；引用的端点资产不存在返回 400。
        写操作审计。权限：`api_authorization.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecRoleBaselineRequest' }
      responses:
        '200':
          description: 创建成功的基线（data 即基线对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRoleBaseline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 相同角色/方法/动作的基线已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/role-baselines/{id}:
    get:
      operationId: apiSecAuthzRoleBaselineGet
      tags: [api-security]
      summary: 角色基线详情
      description: 按 ID 读取角色基线。权限：`api_authorization.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 基线 ID
      responses:
        '200':
          description: 基线详情（data 即基线对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRoleBaseline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: apiSecAuthzRoleBaselineUpdate
      tags: [api-security]
      summary: 编辑角色基线
      description: >-
        部分更新（仅更新请求中出现的字段）；endpoint_id 不可改（换端点 = 删除后重建），
        confirmed 不随编辑变更（只能经确认接口变更）。写操作审计。
        权限：`api_authorization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 基线 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecRoleBaselineRequest' }
      responses:
        '200':
          description: 更新后的基线（data 即基线对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRoleBaseline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 相同角色/方法/动作的基线已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecAuthzRoleBaselineDelete
      tags: [api-security]
      summary: 删除角色基线
      description: 删除角色基线。写操作审计（中风险）。权限：`api_authorization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 基线 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/role-baselines/{id}/confirm:
    post:
      operationId: apiSecAuthzRoleBaselineConfirm
      tags: [api-security]
      summary: 确认/撤回角色基线
      description: >-
        候选 → 正式基线（confirmed=true，随发布通道下发网关生效）；传 false 可撤回确认回到候选。
        写操作审计。权限：`api_authorization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 基线 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecRoleBaselineConfirmRequest' }
      responses:
        '200':
          description: 确认后的基线（data 即基线对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRoleBaseline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/ownership:
    get:
      operationId: apiSecAuthzOwnershipList
      tags: [api-security]
      summary: 对象权属分页列表
      description: >-
        分页列出对象权属基线（api_object_ownership，BOLA 判定基线；由权属清扫任务生产，只读查询），
        按最近访问（last_seen）倒序。endpoint_id 非法 UUID、identity/object_id 超长均返回 400。
        权限：`api_authorization.read`
      parameters:
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按接口资产过滤
        - name: identity
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: 按身份指纹过滤
        - name: object_type
          in: query
          required: false
          schema: { type: string }
          description: 按对象类型过滤
        - name: object_id
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
          description: 按对象 ID 过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页对象权属列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecOwnershipListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/field-permissions:
    get:
      operationId: apiSecAuthzFieldPermissionList
      tags: [api-security]
      summary: 字段权限分页列表
      description: >-
        分页列出字段权限（api_field_permissions，Mass Assignment / 字段越权管控，
        随发布通道下发网关）。direction/attribute 自动转大写且非白名单返回 400；
        endpoint_id 非法 UUID、defaults_only 非布尔取值均返回 400。
        权限：`api_authorization.read`
      parameters:
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按接口资产过滤
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [REQUEST, RESPONSE] }
          description: 按字段方向过滤（自动转大写）
        - name: attribute
          in: query
          required: false
          schema: { type: string, enum: [READABLE, WRITABLE, READ_ONLY, ADMIN_WRITABLE, SERVER_GENERATED, SENSITIVE, FORBIDDEN] }
          description: 按字段属性过滤（自动转大写）
        - name: role
          in: query
          required: false
          schema: { type: string }
          description: 按角色码过滤
        - name: tenant
          in: query
          required: false
          schema: { type: string }
          description: 按租户码过滤
        - name: defaults_only
          in: query
          required: false
          schema: { type: boolean }
          description: 仅看默认行（true = role/tenant 均为 NULL 的行）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页字段权限列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFieldPermissionListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecAuthzFieldPermissionCreate
      tags: [api-security]
      summary: 新增字段权限
      description: >-
        新增字段权限：endpoint_id/field_path/direction/attribute 必填；role/tenant 可空
        （缺省为 NULL = 默认行，非空 = 角色/租户覆盖行）。同端点相同字段/方向/角色/租户的权限
        已存在返回 409；引用的端点资产不存在返回 400。写操作审计。
        权限：`api_authorization.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecFieldPermissionRequest' }
      responses:
        '200':
          description: 创建成功的字段权限（data 即字段权限对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFieldPermission' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 相同字段/方向/角色/租户的权限已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/field-permissions/{id}:
    get:
      operationId: apiSecAuthzFieldPermissionGet
      tags: [api-security]
      summary: 字段权限详情
      description: 按 ID 读取字段权限。权限：`api_authorization.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 字段权限 ID
      responses:
        '200':
          description: 字段权限详情（data 即字段权限对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFieldPermission' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: apiSecAuthzFieldPermissionUpdate
      tags: [api-security]
      summary: 编辑字段权限
      description: >-
        部分更新（仅更新请求中出现的字段）；endpoint_id 不可改；role/tenant 显式传空串
        清除为 NULL（回到默认行语义）。写操作审计。权限：`api_authorization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 字段权限 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecFieldPermissionRequest' }
      responses:
        '200':
          description: 更新后的字段权限（data 即字段权限对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFieldPermission' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 相同字段/方向/角色/租户的权限已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecAuthzFieldPermissionDelete
      tags: [api-security]
      summary: 删除字段权限
      description: 删除字段权限。写操作审计（高风险）。权限：`api_authorization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 字段权限 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/evaluate:
    get:
      operationId: apiSecAuthzEvaluateBola
      tags: [api-security]
      summary: BOLA 五档评估
      description: >-
        对「身份访问对象」做一次 BOLA 五档评估（只读）：有权属记录且匹配=POLICY_CONFIRMED（允许）；
        对象已有属主且访问者非属主=HIGH_CONFIDENCE（越权，高置信）；无对象权属但身份有基线/历史=
        LIKELY（倾向允许）；端点已有权属画像但身份与对象均无记录=POSSIBLE（倾向可疑）；
        无任何证据=INSUFFICIENT_EVIDENCE（无法判定，allowed 为 null）。
        纪律：不仅凭 ID 变化定罪。identity 可空（空 = 匿名身份，不做权属匹配，只走对象侧信号）。
        权限：`api_authorization.read`
      parameters:
        - name: endpoint_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: 接口资产 ID（必填，非法 UUID 返回 400）
        - name: object_id
          in: query
          required: true
          schema: { type: string, maxLength: 256 }
          description: 被访问对象 ID（必填，≤256）
        - name: identity
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: 身份指纹（可空，空 = 匿名身份）
      responses:
        '200':
          description: 评估结果（data 即评估结果对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzEvaluateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 端点资产不存在（错误码 RESOURCE_NOT_FOUND）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== API 主动扫描（apiscan，P1-07，迁移 000053/000054/000056） ====================
  # 定位：对已纳管 API 资产的经授权有限主动验证（非 DAST）。授权先于一切执行——任务必须凭一张
  # 未撤销且未过期的授权单运行；双人分离（建目标 api_scan.manage / 授权签发与撤销 api_scan.execute，
  # 建标人不得自授权）；撤销/紧急停止联动停止该授权下全部在跑任务。settings 组 api_scan.enabled
  # 默认关（关闭时发起任务/复测返回 403）。
  /api-security/scans/targets:
    get:
      operationId: apiScanTargetList
      tags: [api-security]
      summary: 扫描目标分页列表
      description: >-
        分页列出主动扫描目标（api_scan_targets）。支持 application_id/status 过滤；
        非法取值返回 400。权限：`api_scan.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid }, description: 按已纳管应用过滤；非法 UUID 返回 400 }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ENABLED, DISABLED] }, description: 目标状态（自动转大写） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码 }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20 }, description: 每页条数 }
      responses:
        '200':
          description: 分页扫描目标列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanTargetListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiScanTargetCreate
      tags: [api-security]
      summary: 创建扫描目标
      description: >-
        创建扫描目标：靶标仅来自已纳管应用（application_id 外键 applications），
        base_url 必须为合法 http/https 地址，allowed_paths 为允许探测的路径白名单
        （每项以 / 开头，≤64 条；空 = 不探测任何路径）。application_id 不存在返回 400。
        权限：`api_scan.manage`。记录操作审计（中风险）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanTargetCreateRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanTargetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/targets/{id}:
    get:
      operationId: apiScanTargetGet
      tags: [api-security]
      summary: 扫描目标详情
      description: >-
        返回单个扫描目标。权限：`api_scan.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目标 ID }
      responses:
        '200':
          description: 目标详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanTargetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: apiScanTargetUpdate
      tags: [api-security]
      summary: 更新扫描目标
      description: >-
        维护/停用扫描目标（name/base_url/allowed_paths/status 全量更新；application_id 不可改）。
        status 取值 ENABLED/DISABLED；停用后不能发起新扫描。权限：`api_scan.manage`。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目标 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanTargetUpdateRequest' }
      responses:
        '200':
          description: 更新后的目标
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanTargetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/targets/{id}/authorize:
    post:
      operationId: apiScanTargetAuthorize
      tags: [api-security]
      summary: 签发扫描授权
      description: >-
        为目标签发扫描授权单（双人分离：建标人不得自授权，违反返回 403）。
        expires_at 必填且须为未来时间；max_qps 1~100（缺省 5）、max_concurrency 1~16（缺省 1）；
        window_start/window_end 为可选扫描时间窗；allowlist 为允许出包的域名/IP 白名单
        （空 = 仅 base_url 主机自身）；test_profile 为逗号分隔探针集画像（词表见 ApiScanFinding.template，空 = 全部内置探针集）。
        权限：`api_scan.execute`。记录操作审计（高风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目标 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanAuthorizeRequest' }
      responses:
        '201':
          description: 授权单已签发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanAuthorizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无权限，或建标人与授权人为同一人（双人分离）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/targets/{id}/authorizations:
    get:
      operationId: apiScanAuthorizationList
      tags: [api-security]
      summary: 目标授权单分页列表
      description: >-
        分页列出目标下的扫描授权单（按创建时间倒序）。权限：`api_scan.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目标 ID }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码 }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20 }, description: 每页条数 }
      responses:
        '200':
          description: 分页授权单列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanAuthorizationListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/authorizations/{id}/revoke:
    post:
      operationId: apiScanAuthorizationRevoke
      tags: [api-security]
      summary: 撤销扫描授权
      description: >-
        撤销授权单（撤销即停：联动停止该授权下全部在跑任务，返回 stopped_jobs 计数；
        执行侧每批发包前重查授权，撤销即刻停发）。无请求体。
        权限：`api_scan.execute`。记录操作审计（高风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 授权单 ID }
      responses:
        '200':
          description: 授权已撤销（含联动停止的任务数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanRevokeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/jobs:
    get:
      operationId: apiScanJobList
      tags: [api-security]
      summary: 扫描任务分页列表
      description: >-
        分页列出扫描任务（api_scan_jobs）。支持 target_id/status 过滤；非法取值返回 400。
        权限：`api_scan.read`
      parameters:
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid }, description: 按目标过滤；非法 UUID 返回 400 }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, RUNNING, PAUSED, STOPPED, COMPLETED, FAILED] }, description: 任务状态（自动转大写） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码 }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20 }, description: 每页条数 }
      responses:
        '200':
          description: 分页扫描任务列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanJobListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiScanJobCreate
      tags: [api-security]
      summary: 发起扫描任务
      description: >-
        凭授权单发起扫描任务（初始状态 PENDING）。强校验：主动扫描能力须启用
        （settings api_scan.enabled，未启用返回 403）；目标须 ENABLED；授权单须属于该目标且
        未撤销/未过期/在时间窗内；目标主机须在授权 allowlist 内；probe_set 逗号分隔探针集
        必须是授权 test_profile 白名单子集（空 = 授权画像全集）。权限：`api_scan.manage`。记录操作审计（中风险）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanJobCreateRequest' }
      responses:
        '201':
          description: 任务已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无权限，或主动扫描能力未启用（settings api_scan.enabled）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/jobs/{id}:
    get:
      operationId: apiScanJobGet
      tags: [api-security]
      summary: 扫描任务详情
      description: >-
        返回单个扫描任务（含 progress 进度与计数；失败原因落 progress.last_error）。
        权限：`api_scan.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 任务 ID }
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/jobs/{id}/start:
    post:
      operationId: apiScanJobStart
      tags: [api-security]
      summary: 启动扫描任务
      description: >-
        手动启动任务（置 RUNNING 并后台执行；仅 PENDING/PAUSED 可启动，其余状态返回 400）。
        扫描执行器未装配时返回 503。无请求体。权限：`api_scan.manage`。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 任务 ID }
      responses:
        '200':
          description: 任务已启动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 调度冲突（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 扫描执行器未装配（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api-security/scans/jobs/{id}/stop:
    post:
      operationId: apiScanJobStop
      tags: [api-security]
      summary: 停止扫描任务
      description: >-
        停止任务（置 STOPPED 并取消执行上下文；授权单保留）。终态任务返回 400。无请求体。
        权限：`api_scan.manage`。记录操作审计（高风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 任务 ID }
      responses:
        '200':
          description: 任务已停止
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/jobs/{id}/emergency-stop:
    post:
      operationId: apiScanJobEmergencyStop
      tags: [api-security]
      summary: 紧急停止扫描任务
      description: >-
        紧急停止：停止本任务 + 撤销其授权单 + 停止该授权下全部在跑任务
        （返回被撤销的授权单与联动停止任务数 stopped_jobs）。无请求体。
        权限：`api_scan.execute`。记录操作审计（高风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 任务 ID }
      responses:
        '200':
          description: 已紧急停止（授权已撤销）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanRevokeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/findings:
    get:
      operationId: apiScanFindingList
      tags: [api-security]
      summary: 扫描发现分页列表
      description: >-
        分页列出扫描发现（api_scan_findings；样本均已脱敏截断，敏感探针不落响应原文）。
        支持 job_id/status/severity/template 过滤；非法取值返回 400。权限：`api_scan.read`
      parameters:
        - { name: job_id, in: query, required: false, schema: { type: string, format: uuid }, description: 按任务过滤；非法 UUID 返回 400 }
        - { name: status, in: query, required: false, schema: { type: string, enum: [NEW, CONFIRMED, FALSE_POSITIVE, RETIRED] }, description: 发现状态（自动转大写） }
        - { name: severity, in: query, required: false, schema: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL] }, description: 严重级别 }
        - { name: template, in: query, required: false, schema: { type: string, enum: [AUTH_REQUIRED, DEPRECATED_ALIVE, SENSITIVE_EXPOSURE, SCHEMA_CONFORM, BOLA_COMPARE, METHOD_ENUM] }, description: 探针集过滤（词表外返回 400） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码 }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20 }, description: 每页条数 }
      responses:
        '200':
          description: 分页扫描发现列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanFindingListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/findings/{id}/confirm:
    post:
      operationId: apiScanFindingConfirm
      tags: [api-security]
      summary: 确认扫描发现
      description: >-
        人工确认发现为真实问题（NEW → CONFIRMED）；可携带 weakness_id 关联弱点中心弱点
        （关联后方可复测）。仅 NEW 状态可处置，其余状态返回 400。权限：`api_scan.manage`。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 发现 ID }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanFindingConfirmRequest' }
      responses:
        '200':
          description: 发现已确认
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanFindingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/findings/{id}/false-positive:
    post:
      operationId: apiScanFindingFalsePositive
      tags: [api-security]
      summary: 扫描发现标记误报
      description: >-
        人工判定误报（NEW → FALSE_POSITIVE）。仅 NEW 状态可处置，其余状态返回 400。无请求体。
        权限：`api_scan.manage`。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 发现 ID }
      responses:
        '200':
          description: 发现已标记误报
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanFindingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/findings/{id}/retest:
    post:
      operationId: apiScanFindingRetest
      tags: [api-security]
      summary: 扫描发现定向复测
      description: >-
        对发现关联的弱点做定向复测并回写弱点中心状态机：按原探针集真实重探该端点
        （复现 → RETEST_FAIL / 未复现 → RETEST_PASS，结果落 result 字段）。
        前置：发现须已 confirm 并关联 weakness_id；授权须仍有效；复测端点须仍在目标允许路径内；
        主动扫描能力须启用（未启用 403）；执行器未装配返回 503；探测执行失败返回 502；
        弱点非 FIXED 等回写失败返回 400（如实报错，不伪造复测结论）。
        note 可选（≤512 字符，缺省自动生成）。权限：`api_scan.execute`。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 发现 ID }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanRetestRequest' }
      responses:
        '200':
          description: 复测完成（result=PASS/FAIL）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanRetestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无权限，或主动扫描能力未启用（settings api_scan.enabled）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: 复测探测执行失败（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 扫描复测执行器未装配（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ==================== 文件资产（apifiles，§106/§107，迁移 000061） ====================
  /api-security/file-compliance-rules:
    get:
      operationId: apiSecFileComplianceRuleList
      tags: [api-security]
      summary: 文件合规规则分页列表
      description: >-
        分页列出文件合规规则（api_file_compliance_rules，迁移 000071）：按 direction/action/enabled 过滤。
        enabled 规则经发布通道下发网关，在请求相位（multipart 上传观测点）与响应相位（Content-Disposition
        下载观测点）执行匹配；action=BLOCK 在 PROTECT 模式下上传 403 / 下载缓冲抑制 403，OBSERVE 恒记录。
        权限：`api_data.read`
      parameters:
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [UPLOAD, DOWNLOAD] }
        - name: action
          in: query
          required: false
          schema: { type: string, enum: [OBSERVE, BLOCK] }
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 规则分页列表（data 为统一分页信封）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileComplianceRuleListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecFileComplianceRuleCreate
      tags: [api-security]
      summary: 新建文件合规规则
      description: >-
        新建合规规则。match_value 校验：EXT 归一为小写剥前导点（`^[a-z0-9][a-z0-9_+-]{0,15}$`）；
        MIME 为 type/subtype（小写、剥参数）；FILENAME_REGEX 须可编译（RE2）。
        同 (direction, match_type, match_value) 去重（冲突 409）。权限：`api_data.manage`；操作审计留痕。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecFileComplianceRuleRequest' }
      responses:
        '200':
          description: 创建成功（data 为 {rule}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileComplianceRuleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-compliance-rules/{id}:
    patch:
      operationId: apiSecFileComplianceRuleUpdate
      tags: [api-security]
      summary: 更新文件合规规则
      description: 部分字段更新（指针字段合并后整体校验，口径同新建）。权限：`api_data.manage`；操作审计留痕。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecFileComplianceRulePatchRequest' }
      responses:
        '200':
          description: 更新成功（data 为 {rule}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileComplianceRuleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecFileComplianceRuleDelete
      tags: [api-security]
      summary: 删除文件合规规则
      description: 删除规则（下一次发布后网关不再执行该规则）。权限：`api_data.manage`；操作审计留痕。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 删除成功（data 为 {deleted:true}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-signature/verify:
    post:
      operationId: apiSecFileSignatureVerify
      tags: [api-security]
      summary: 验证文件签名 token
      description: >-
        复算 HMAC-SHA256(key, kid|filename|content_sha256_hex|unixts|identity_fp) 校验文本族下载嵌入的
        `jzsig1.{kid}.{unixts}.{hmac_hex}` 签名（P2-02）。结论经 valid 字段表达（伪造/kid 不符/过期均 200）；
        有效期 api_data.file_signature_max_age_days（默认 30 天）；密钥未配置返回 503。
        权限：`api_data.read`；验证操作审计（不含 token 与密钥材料）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_sha256_hex, token]
              properties:
                filename: { type: string, maxLength: 128, description: 文件名（签名绑定精确字节，不 trim） }
                content_sha256_hex: { type: string, description: 文件内容 SHA-256 hex（大小写不敏感，归一小写） }
                token: { type: string, description: "jzsig1.{kid}.{unixts}.{hmac_hex} 签名串" }
                identity_fp: { type: string, description: 可选：签名时身份指纹（缺省空串参与复算） }
      responses:
        '200':
          description: 验证结论（data 为 {valid, kid, signed_at, identity_fp_prefix?, reason}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileSignatureVerifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api-security/file-signature/key:
    get:
      operationId: apiSecFileSignatureKeyGet
      tags: [api-security]
      summary: 查询当前文件签名 kid
      description: 返回当前签名密钥标识 kid（不返回密钥本体；密钥未配置时如实返回空/未配置标记）。权限：`api_data.read`
      responses:
        '200':
          description: 当前 kid（data 为 {kid}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileSignatureKeyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-signature/key/rotate:
    post:
      operationId: apiSecFileSignatureKeyRotate
      tags: [api-security]
      summary: 轮换文件签名密钥
      description: >-
        生成新密钥并加密落库（gateway_runtime.api_file_signature_key 密文），kid 正整数递增。
        轮换后旧 kid 签名一律验证不过（预期收紧）。权限：`api_data.manage`；操作审计留痕。
      responses:
        '200':
          description: 轮换成功（data 为 {kid}，不含密钥）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileSignatureKeyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-assets:
    get:
      operationId: apiSecFileAssetList
      tags: [api-security]
      summary: 文件资产明细分页列表
      description: >-
        分页列出文件传输资产（api_file_assets：请求侧 multipart 上传 / 响应侧下载，
        按 last_seen 口径的时间窗过滤）。direction 自动转大写，非法枚举/超长键/非法布尔返回 400；
        days 缺省 7、上限 30（越界归一）；page_size 大于 100 时归一为 100。
        只读接口。权限：`api_data.read`
      parameters:
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [UPLOAD, DOWNLOAD] }
          description: 传输方向过滤（自动转大写；非法取值返回 400）
        - name: mime
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: MIME 精确匹配（入库已归一：主类型小写无参数；超过 128 字符返回 400）
        - name: extension
          in: query
          required: false
          schema: { type: string, maxLength: 16 }
          description: 扩展名精确匹配（小写，前导点自动去除；超过 16 字符返回 400）
        - name: endpoint_key
          in: query
          required: false
          schema: { type: string, maxLength: 560 }
          description: 接口键精确匹配（「METHOD 路径模板」；超过 560 字符返回 400）
        - name: sensitive_only
          in: query
          required: false
          schema: { type: boolean }
          description: 为 true 时仅查敏感文件（sensitive_types 非空；非法取值返回 400）
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 时间窗天数（按 last_seen 口径，缺省 7；非正数归一 7，大于 30 归一 30）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数归一 20，大于 100 归一 100）
      responses:
        '200':
          description: 分页文件资产列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileAssetListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-assets/stats:
    get:
      operationId: apiSecFileAssetStats
      tags: [api-security]
      summary: 文件资产统计看板
      description: >-
        §106 文件统计（data 即统计对象本身）：上传/下载计数（资产数与传输次数双口径）、
        敏感文件计数，以及 File/IP/Account/API 四个 TOP10 榜单（按传输次数聚合）。
        窗口按 last_seen 口径与列表明细一致；days 缺省 7、上限 30（越界归一）。
        只读接口。权限：`api_data.read`
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 时间窗天数（缺省 7；非正数归一 7，大于 30 归一 30）
      responses:
        '200':
          description: 文件资产统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileAssetStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 数据出境看板（apigeo，GeoIP 归属观测） ====================
  /api-security/cross-border:
    get:
      operationId: apiSecCrossBorderGet
      tags: [api-security]
      summary: 数据出境看板与明细分页
      description: >-
        单端点返回数据出境聚合看板 + 明细分页（api_cross_border_events：OUT=涉敏数据流向境外客户端，
        IN=境外客户端提交涉敏数据）。days 作用于看板与明细（缺省 7、上限 30，越界归一）；
        country/direction/risk_level/endpoint_key 仅过滤明细，country 自动转大写且须为两位
        ISO 3166-1 alpha-2 国家码，direction/risk_level 自动转大写，非法取值返回 400；
        page_size 大于 100 时归一为 100。geo_enabled=false 表示 GeoIP 数据源未加载，
        看板可能为历史数据；home_regions 为当前本土地区判定基准（系统设置 api_data 组）。
        只读接口。权限：`api_data.read`
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 时间窗天数（看板与明细同窗口，缺省 7；非正数归一 7，大于 30 归一 30）
        - name: country
          in: query
          required: false
          schema: { type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$' }
          description: 国家/地区过滤（两位 ISO 3166-1 alpha-2 国家码，自动转大写；非法取值返回 400）
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [OUT, IN] }
          description: 方向过滤（自动转大写；非法取值返回 400）
        - name: risk_level
          in: query
