        application_id 与 device_fingerprint 均必填，防止跨应用或无范围枚举；仅接收 32 位小写
        十六进制 HMAC 主体记录，异常或原始账号形态不参与且不返回。权限：`api_runtime.read`。
        返回数据仍是观察线索，不证明主体协同行为；data_scope=NOTABLE_SECURITY_EVENTS、partial=true。
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date-time }
          description: 起始时间（RFC3339，含）；缺省为当前时间前 24 小时，与 end 最大跨度 31 天
        - name: end
          in: query
          schema: { type: string, format: date-time }
          description: 结束时间（RFC3339，不含）；缺省为当前时间，必须晚于 start
        - name: application_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: 应用 UUID
        - name: device_fingerprint
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
          description: 32 位小写十六进制被动设备指纹
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1, maximum: 1000000 }
          description: 页码
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
