      summary: 扫描任务详情
      description: >-
        返回单个扫描任务（含 progress 进度与计数；失败原因落 progress.last_error）。
        权限：`api_scan.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 任务 ID }
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/jobs/{id}/start:
    post:
      operationId: apiScanJobStart
      tags: [api-security]
      summary: 启动扫描任务
      description: >-
        手动启动任务（置 RUNNING 并后台执行；仅 PENDING/PAUSED 可启动，其余状态返回 400）。
        扫描执行器未装配时返回 503。无请求体。权限：`api_scan.manage`。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 任务 ID }
      responses:
        '200':
          description: 任务已启动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 调度冲突（错误码 RESOURCE_CONFLICT）
