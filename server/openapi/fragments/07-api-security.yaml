      summary: 共享设备群控观察趋势
      description: >-
        按 UTC 小时或天聚合达到账号阈值的共享设备分组数、群控信号数及关联安全事件数。
        账号阈值在每个时间桶内独立应用；只返回有真实观测的时间桶，不补零、不伪造历史覆盖。
        缺省 bucket 在范围不超过 48 小时时为 hour，否则为 day；最大范围 31 天。
        数据源仅为已采集安全事件，不是全量流量。权限：`api_runtime.read`。
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date-time }
          description: 起始时间（RFC3339，含）；缺省为当前时间前 24 小时
        - name: end
          in: query
          schema: { type: string, format: date-time }
          description: 结束时间（RFC3339，不含）；缺省为当前时间，必须晚于 start
        - name: application_id
          in: query
          schema: { type: string, format: uuid }
          description: 可选应用 UUID 过滤
        - name: device_fingerprint
          in: query
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
          description: 可选设备指纹精确过滤
        - name: min_accounts
          in: query
          schema: { type: integer, default: 3, minimum: 2, maximum: 1000 }
          description: 每个时间桶内共享设备所需的最少可信账号数
        - name: bucket
          in: query
          schema: { type: string, enum: [hour, day] }
          description: UTC 时间桶；缺省按时间范围自动选择
      responses:
        '200':
          description: 有真实观测的群控趋势时间桶
