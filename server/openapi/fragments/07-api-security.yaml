  # ==================== 弱点中心（apiweakness，P0-13 补全） ====================
  # 状态机：NEW → CONFIRMED → TO_FIX → FIXED →（复测 PASS）ARCHIVED /（复测 FAIL）REPRODUCED；
  # IGNORED（接受风险/误报，NEW/CONFIRMED/TO_FIX/REPRODUCED 可入）；ARCHIVED 终态。
  # 非法迁移返回 400；FIXED 后再被派生扫描命中自动回 REPRODUCED；IGNORED/ARCHIVED 不复活。
  /api-security/weaknesses:
    get:
      operationId: apiSecWeaknessList
      tags: [api-security]
      summary: 弱点分页列表
      description: >-
        分页列出 API 弱点（api_weaknesses，由派生扫描 SweepOnce 从运行时事件/违例/敏感字段归集），
        按 last_seen 倒序；status/severity/category 自动转大写，非白名单取值返回 400；
        endpoint_id 非法 UUID 返回 400。权限：`api_weakness.read`
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [NEW, CONFIRMED, TO_FIX, FIXED, REPRODUCED, IGNORED, ARCHIVED] }
          description: 生命周期状态过滤（自动转大写）
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL] }
          description: 严重级别过滤（自动转大写）
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [AUTHN, AUTHZ, LIFECYCLE, SENSITIVE, SCHEMA] }
          description: 弱点分类过滤（自动转大写）
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按接口过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页弱点列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecWeaknessListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/weaknesses/{id}:
    get:
      operationId: apiSecWeaknessDetail
      tags: [api-security]
      summary: 弱点详情
      description: >-
        弱点详情 + 整改/复测历史（api_weakness_actions，按创建时间倒序，最多返回 100 条）。
        权限：`api_weakness.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 弱点 ID
      responses:
        '200':
          description: 弱点详情与动作历史
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecWeaknessDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
