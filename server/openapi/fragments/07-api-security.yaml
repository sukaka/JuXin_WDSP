            application/json:
              schema: { $ref: '#/components/schemas/ApiScanRevokeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/findings:
    get:
      operationId: apiScanFindingList
      tags: [api-security]
      summary: 扫描发现分页列表
      description: >-
        分页列出扫描发现（api_scan_findings；样本均已脱敏截断，敏感探针不落响应原文）。
        支持 job_id/status/severity/template 过滤；非法取值返回 400。权限：`api_scan.read`
      parameters:
        - { name: job_id, in: query, required: false, schema: { type: string, format: uuid }, description: 按任务过滤；非法 UUID 返回 400 }
        - { name: status, in: query, required: false, schema: { type: string, enum: [NEW, CONFIRMED, FALSE_POSITIVE, RETIRED] }, description: 发现状态（自动转大写） }
        - { name: severity, in: query, required: false, schema: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL] }, description: 严重级别 }
        - { name: template, in: query, required: false, schema: { type: string, enum: [AUTH_REQUIRED, DEPRECATED_ALIVE, SENSITIVE_EXPOSURE, SCHEMA_CONFORM, BOLA_COMPARE, METHOD_ENUM] }, description: 探针集过滤（词表外返回 400） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码 }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20 }, description: 每页条数 }
      responses:
        '200':
          description: 分页扫描发现列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanFindingListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/findings/{id}/confirm:
    post:
      operationId: apiScanFindingConfirm
      tags: [api-security]
      summary: 确认扫描发现
      description: >-
        人工确认发现为真实问题（NEW → CONFIRMED）；可携带 weakness_id 关联弱点中心弱点
        （关联后方可复测）。仅 NEW 状态可处置，其余状态返回 400。权限：`api_scan.manage`。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 发现 ID }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanFindingConfirmRequest' }
      responses:
        '200':
          description: 发现已确认
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanFindingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/findings/{id}/false-positive:
    post:
      operationId: apiScanFindingFalsePositive
      tags: [api-security]
      summary: 扫描发现标记误报
      description: >-
        人工判定误报（NEW → FALSE_POSITIVE）。仅 NEW 状态可处置，其余状态返回 400。无请求体。
        权限：`api_scan.manage`。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 发现 ID }
      responses:
        '200':
          description: 发现已标记误报
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanFindingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/findings/{id}/retest:
    post:
      operationId: apiScanFindingRetest
      tags: [api-security]
      summary: 扫描发现定向复测
      description: >-
        对发现关联的弱点做定向复测并回写弱点中心状态机：按原探针集真实重探该端点
        （复现 → RETEST_FAIL / 未复现 → RETEST_PASS，结果落 result 字段）。
        前置：发现须已 confirm 并关联 weakness_id；授权须仍有效；复测端点须仍在目标允许路径内；
        主动扫描能力须启用（未启用 403）；执行器未装配返回 503；探测执行失败返回 502；
        弱点非 FIXED 等回写失败返回 400（如实报错，不伪造复测结论）。
        note 可选（≤512 字符，缺省自动生成）。权限：`api_scan.execute`。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 发现 ID }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanRetestRequest' }
      responses:
        '200':
          description: 复测完成（result=PASS/FAIL）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanRetestResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无权限，或主动扫描能力未启用（settings api_scan.enabled）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: 复测探测执行失败（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: 扫描复测执行器未装配（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ==================== 文件资产（apifiles，§106/§107，迁移 000061） ====================
  /api-security/file-compliance-rules:
    get:
      operationId: apiSecFileComplianceRuleList
      tags: [api-security]
      summary: 文件合规规则分页列表
      description: >-
        分页列出文件合规规则（api_file_compliance_rules，迁移 000071）：按 direction/action/enabled 过滤。
        enabled 规则经发布通道下发网关，在请求相位（multipart 上传观测点）与响应相位（Content-Disposition
        下载观测点）执行匹配；action=BLOCK 在 PROTECT 模式下上传 403 / 下载缓冲抑制 403，OBSERVE 恒记录。
        权限：`api_data.read`
      parameters:
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [UPLOAD, DOWNLOAD] }
        - name: action
          in: query
          required: false
          schema: { type: string, enum: [OBSERVE, BLOCK] }
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 规则分页列表（data 为统一分页信封）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileComplianceRuleListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecFileComplianceRuleCreate
      tags: [api-security]
      summary: 新建文件合规规则
      description: >-
        新建合规规则。match_value 校验：EXT 归一为小写剥前导点（`^[a-z0-9][a-z0-9_+-]{0,15}$`）；
        MIME 为 type/subtype（小写、剥参数）；FILENAME_REGEX 须可编译（RE2）。
        同 (direction, match_type, match_value) 去重（冲突 409）。权限：`api_data.manage`；操作审计留痕。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecFileComplianceRuleRequest' }
      responses:
        '200':
          description: 创建成功（data 为 {rule}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileComplianceRuleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-compliance-rules/{id}:
    patch:
      operationId: apiSecFileComplianceRuleUpdate
      tags: [api-security]
      summary: 更新文件合规规则
      description: 部分字段更新（指针字段合并后整体校验，口径同新建）。权限：`api_data.manage`；操作审计留痕。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecFileComplianceRulePatchRequest' }
      responses:
        '200':
          description: 更新成功（data 为 {rule}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileComplianceRuleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecFileComplianceRuleDelete
      tags: [api-security]
      summary: 删除文件合规规则
      description: 删除规则（下一次发布后网关不再执行该规则）。权限：`api_data.manage`；操作审计留痕。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 删除成功（data 为 {deleted:true}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-signature/verify:
    post:
      operationId: apiSecFileSignatureVerify
      tags: [api-security]
      summary: 验证文件签名 token
      description: >-
        复算 HMAC-SHA256(key, kid|filename|content_sha256_hex|unixts|identity_fp) 校验下载文件嵌入的
        `jzsig1.{kid}.{unixts}.{hmac_hex}` 签名（P2-02）。支持文本族哈希+token，以及
        `content_format=ooxml_zip` + `content_base64`（原始 DOCX/XLSX/PPTX 不超过 2 MiB）直接验证；
        文件载荷从 ZIP 注释提取 token 并恢复签名前精确字节，不能与哈希/token 混用。
        结论经 valid 字段表达（伪造/kid 不符/过期均 200）；有效期 api_data.file_signature_max_age_days（默认 30 天）；
        密钥未配置返回 503。权限：`api_data.read`；验证操作审计不含文件内容、token 与密钥材料。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              oneOf:
                - required: [content_sha256_hex, token]
                - required: [content_format, content_base64]
              properties:
                filename: { type: string, maxLength: 128, description: 文件名（签名绑定精确字节，不 trim） }
                content_sha256_hex: { type: string, description: 文本族文件内容 SHA-256 hex（大小写不敏感，归一小写；与 token 搭配） }
                token: { type: string, description: "jzsig1.{kid}.{unixts}.{hmac_hex} 签名串（与 content_sha256_hex 搭配）" }
                content_format: { type: string, enum: [ooxml_zip], description: OOXML ZIP 注释签名文件；必须搭配 content_base64 }
                content_base64: { type: string, format: byte, description: Base64 编码的 DOCX/XLSX/PPTX 文件，原始内容不超过 2 MiB；不得同时传哈希或 token }
                identity_fp: { type: string, description: 可选：签名时身份指纹（缺省空串参与复算） }
      responses:
        '200':
          description: 验证结论（data 为 {valid, kid, signed_at, identity_fp_prefix?, reason}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileSignatureVerifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api-security/file-signature/key:
    get:
      operationId: apiSecFileSignatureKeyGet
      tags: [api-security]
      summary: 查询当前文件签名 kid
      description: 返回当前签名密钥标识 kid（不返回密钥本体；密钥未配置时如实返回空/未配置标记）。权限：`api_data.read`
      responses:
        '200':
          description: 当前 kid（data 为 {kid}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileSignatureKeyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-signature/key/rotate:
    post:
      operationId: apiSecFileSignatureKeyRotate
      tags: [api-security]
      summary: 轮换文件签名密钥
      description: >-
        生成新密钥并加密落库（gateway_runtime.api_file_signature_key 密文），kid 正整数递增。
        轮换后旧 kid 签名一律验证不过（预期收紧）。权限：`api_data.manage`；操作审计留痕。
      responses:
        '200':
          description: 轮换成功（data 为 {kid}，不含密钥）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileSignatureKeyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-assets:
    get:
      operationId: apiSecFileAssetList
      tags: [api-security]
      summary: 文件资产明细分页列表
      description: >-
        分页列出文件传输资产（api_file_assets：请求侧 multipart 上传 / 响应侧下载，
        按 last_seen 口径的时间窗过滤）。direction 自动转大写，非法枚举/超长键/非法布尔返回 400；
        days 缺省 7、上限 30（越界归一）；page_size 大于 100 时归一为 100。
        只读接口。权限：`api_data.read`
      parameters:
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [UPLOAD, DOWNLOAD] }
          description: 传输方向过滤（自动转大写；非法取值返回 400）
        - name: mime
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: MIME 精确匹配（入库已归一：主类型小写无参数；超过 128 字符返回 400）
        - name: extension
          in: query
          required: false
          schema: { type: string, maxLength: 16 }
          description: 扩展名精确匹配（小写，前导点自动去除；超过 16 字符返回 400）
        - name: endpoint_key
          in: query
          required: false
          schema: { type: string, maxLength: 560 }
          description: 接口键精确匹配（「METHOD 路径模板」；超过 560 字符返回 400）
        - name: sensitive_only
          in: query
          required: false
          schema: { type: boolean }
          description: 为 true 时仅查敏感文件（sensitive_types 非空；非法取值返回 400）
        - name: sha256
          in: query
          required: false
          schema: { type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-fA-F]{64}$' }
          description: 完整文件内容 SHA-256 精确过滤（hex 大小写不敏感；截断/流式观测无指纹）
        - name: identity_fingerprint
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: 身份指纹精确匹配（trim 后空串或缺省不过滤；超过 128 字符返回 400）
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 时间窗天数（按 last_seen 口径，缺省 7；非正数归一 7，大于 30 归一 30）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数归一 20，大于 100 归一 100）
      responses:
        '200':
          description: 分页文件资产列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileAssetListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-assets/lineage:
    get:
      operationId: apiSecFileAssetLineage
      tags: [api-security]
      summary: 按文件内容指纹关联上传与下载
      description: >-
        按完整文件内容 SHA-256 查询相同字节内容的实际上传/下载资产，返回方向、文件名、
        端点、时间与传输次数等既有元数据。不包含文件正文，不推断所有者或业务来源。
        days 缺省 7、上限 30；结果最多 100 条，超出时 truncated=true 且 total 保留真实总数。
        截断/流式观测没有内容指纹，不参与关联。只读接口。权限：`api_data.read`。
      parameters:
        - name: sha256
          in: query
          required: true
          schema: { type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-fA-F]{64}$' }
          description: 完整内容 SHA-256（hex 大小写不敏感；缺失或非法输入返回 400）
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 时间窗天数（按 last_seen 口径，缺省 7；越界归一）
      responses:
        '200':
          description: 文件内容关联结果（data 含方向资产数、真实总数及截断标记）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileLineageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/file-assets/stats:
    get:
      operationId: apiSecFileAssetStats
      tags: [api-security]
      summary: 文件资产统计看板
      description: >-
        §106 文件统计（data 即统计对象本身）：上传/下载计数（资产数与传输次数双口径）、
        敏感文件计数，以及 File/IP/Account/API 四个 TOP10 榜单（按传输次数聚合）。
        窗口按 last_seen 口径与列表明细一致；days 缺省 7、上限 30（越界归一）。
        只读接口。权限：`api_data.read`
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 时间窗天数（缺省 7；非正数归一 7，大于 30 归一 30）
      responses:
        '200':
          description: 文件资产统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFileAssetStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 数据出境看板（apigeo，GeoIP 归属观测） ====================
  /api-security/cross-border:
    get:
      operationId: apiSecCrossBorderGet
      tags: [api-security]
      summary: 数据出境看板与明细分页
      description: >-
        单端点返回数据出境聚合看板 + 明细分页（api_cross_border_events：OUT=涉敏数据流向境外客户端，
        IN=境外客户端提交涉敏数据）。days 作用于看板与明细（缺省 7、上限 30，越界归一）；
        country/direction/risk_level/endpoint_key 仅过滤明细，country 自动转大写且须为两位
        ISO 3166-1 alpha-2 国家码，direction/risk_level 自动转大写，非法取值返回 400；
        page_size 大于 100 时归一为 100。geo_enabled=false 表示 GeoIP 数据源未加载，
        看板可能为历史数据；home_regions 为当前本土地区判定基准（系统设置 api_data 组）。
        只读接口。权限：`api_data.read`
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 时间窗天数（看板与明细同窗口，缺省 7；非正数归一 7，大于 30 归一 30）
        - name: country
          in: query
          required: false
          schema: { type: string, minLength: 2, maxLength: 2, pattern: '^[A-Z]{2}$' }
          description: 国家/地区过滤（两位 ISO 3166-1 alpha-2 国家码，自动转大写；非法取值返回 400）
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [OUT, IN] }
          description: 方向过滤（自动转大写；非法取值返回 400）
        - name: risk_level
          in: query
          required: false
          schema: { type: string, enum: [LOW, MEDIUM, HIGH] }
          description: 风险等级过滤（自动转大写；非法取值返回 400）
        - name: endpoint_key
          in: query
          required: false
          schema: { type: string, maxLength: 560 }
          description: 接口键精确匹配（超过 560 字符返回 400）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 明细分页页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 明细分页每页条数（非正数归一 20，大于 100 归一 100）
      responses:
        '200':
          description: 看板聚合 + 明细分页组合响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecCrossBorderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== AI 定时运营任务（apiops，迁移 000062/000063） ====================
  /api-security/ai-ops/task-types:
    get:
      operationId: apiSecAIOpsTaskTypeList
      tags: [api-security]
      summary: AI 运营任务类型词表
      description: >-
        返回内置五种任务类型的词表与说明（API_ASSET_DIGEST 资产变化摘要 / SHADOW_REVIEW Shadow API 运营 /
        WEAKNESS_FOLLOW 弱点整改跟进 / RISK_DIGEST 高风险发现摘要 / SENSITIVE_DIGEST 涉敏概览变化；
        与迁移 000062 CHECK 一致，非自由文本）。任务只产出报告与建议文本，不执行任何业务变更。
        权限：`api_ai.read`
      responses:
        '200':
          description: 任务类型清单（data 为 {items} 包装）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsTaskTypeListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/ai-ops/schedules:
    get:
      operationId: apiSecAIOpsScheduleList
      tags: [api-security]
      summary: AI 运营计划分页列表
      description: >-
        分页列出 AI 运营定时计划（api_ai_schedules），支持 task_type（自动转大写，非法取值返回 400）
        与 enabled（非法取值返回 400）过滤。权限：`api_ai.read`
      parameters:
        - name: task_type
          in: query
          required: false
          schema: { type: string, enum: [API_ASSET_DIGEST, SHADOW_REVIEW, WEAKNESS_FOLLOW, RISK_DIGEST, SENSITIVE_DIGEST] }
          description: 任务类型过滤（自动转大写；非法取值返回 400）
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
          description: 启用状态过滤（true/false，缺省不过滤；非法取值返回 400）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数归一 20）
      responses:
        '200':
          description: 分页计划列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsScheduleListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecAIOpsScheduleCreate
      tags: [api-security]
      summary: 创建 AI 运营计划
      description: >-
        创建定时计划：task_type 必填且须为内置五种之一（自动转大写）；name 必填且不超过 128 字符；
        cron_expr 必填且可解析（五段「分 时 日 月 周」或宏）；config 为白名单键任务入参
        （未知键拒绝、越界拒绝，缺省字段自动填充，见 ApiSecAIOpsTaskConfig）。
        enabled 缺省 false；为 true 时按 cron 计算 next_run_at 游标。
        请求体未知字段拒绝（DisallowUnknownFields）。写操作审计（低风险）。权限：`api_ai.execute`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAIOpsScheduleRequest' }
      responses:
        '201':
          description: 计划已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsScheduleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/ai-ops/schedules/{id}:
    get:
      operationId: apiSecAIOpsScheduleGet
      tags: [api-security]
      summary: AI 运营计划详情
      description: >-
        返回单个定时计划（data 为 {schedule} 包装）。权限：`api_ai.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 计划 ID
      responses:
        '200':
          description: 计划详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsScheduleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: apiSecAIOpsScheduleUpdate
      tags: [api-security]
      summary: 更新 AI 运营计划
      description: >-
        更新计划的 name/cron_expr/config（校验口径同创建）；task_type 不可变
        （传入与原值不一致返回 400）；enabled 字段被忽略，启停走专用接口。
        cron 变更影响排期：启用中的计划按新表达式重算 next_run_at 游标，停用计划保持无游标。
        写操作审计（低风险）。权限：`api_ai.execute`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 计划 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAIOpsScheduleRequest' }
      responses:
        '200':
          description: 更新后的计划
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsScheduleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecAIOpsScheduleDelete
      tags: [api-security]
      summary: 删除 AI 运营计划
      description: >-
        删除定时计划并级联删除其执行记录。写操作审计（中风险）。权限：`api_ai.execute`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 计划 ID
      responses:
        '200':
          description: '删除成功（data 为 {deleted: true}）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsScheduleDeleteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/ai-ops/schedules/{id}/enable:
    post:
      operationId: apiSecAIOpsScheduleEnable
      tags: [api-security]
      summary: 启用 AI 运营计划
      description: >-
        启用计划并按 cron 重算 next_run_at 到期游标（cron 不可解析返回 400）。无请求体。
        手动启用同时复位连续失败熔断状态（consecutive_failures 清零、清空 circuit_opened_at/circuit_reason），
        熔断计划的复位事实写入操作审计。写操作审计（低风险）。权限：`api_ai.execute`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 计划 ID
      responses:
        '200':
          description: 计划已启用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsScheduleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/ai-ops/schedules/{id}/disable:
    post:
      operationId: apiSecAIOpsScheduleDisable
      tags: [api-security]
      summary: 停用 AI 运营计划
      description: >-
        停用计划（立即生效，下轮不再触发）并清空 next_run_at 游标。无请求体。
        写操作审计（低风险）。权限：`api_ai.execute`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 计划 ID
      responses:
        '200':
          description: 计划已停用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsScheduleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/ai-ops/schedules/{id}/run:
    post:
      operationId: apiSecAIOpsScheduleRun
      tags: [api-security]
      summary: 立即执行 AI 运营计划
      description: >-
        手动触发一次执行（不改变排期），同步执行并返回执行记录。
        AI 运营定时任务总开关未启用（系统设置 api_ai_ops.schedules_enabled）返回 503；
        该计划已有执行中运行返回 409；调度器未装配返回 503。
        写操作审计（中风险）。权限：`api_ai.execute`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 计划 ID
      responses:
        '200':
          description: 执行完成（data 为 {run} 包装，含结构化报告）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsRunResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 该计划已有正在执行中的运行（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 调度器未装配，或 AI 运营定时任务总开关未启用（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api-security/ai-ops/schedules/{id}/runs:
    get:
      operationId: apiSecAIOpsRunList
      tags: [api-security]
      summary: AI 运营计划执行记录分页列表
      description: >-
        分页列出指定计划的执行记录（api_ai_schedule_runs，每次触发一行，含手动立即执行）。
        计划不存在返回 404。权限：`api_ai.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 计划 ID
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数归一 20）
      responses:
        '200':
          description: 分页执行记录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsRunListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/ai-ops/runs/{id}:
    get:
      operationId: apiSecAIOpsRunGet
      tags: [api-security]
      summary: AI 运营执行记录详情
      description: >-
        返回单条执行记录（data 为 {run} 包装）：摘要 + 结构化报告（report，
        报告内容为确定性查询结果，摘要可经 LLM 润色、失败时回退模板文本）。
        权限：`api_ai.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 执行记录 ID
      responses:
        '200':
          description: 执行记录详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsRunResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 网关节点版本校验（apinodes，多节点遥测） ====================
  /api-security/nodes:
    get:
      operationId: apiSecNodeList
      tags: [api-security]
      summary: 网关节点列表（状态+版本+同步登记/结果+一致性标记）
      description: >-
        W12 多节点版本校验 v1 + W18-SYNC 配置面同步登记：列出 api_gateway_nodes 节点视图
        （SweepOnce 按 api_runtime_events.gateway_node 增量聚合，绝对值覆盖幂等；
        W17-HB 起节点活性/策略版本另有网关心跳写入方，取新不回退），
        逐项 version_consistent 标记该节点策略版本是否与活跃多数派一致
        （null = 未参与判定：SILENT 离线或未上报版本）；响应总体 consistent/evaluated_nodes
        与 /nodes/consistency 同一判定口径。节点行另带出配置面同步登记与结果列
        （admin_addr/sync_enabled/last_sync_*，迁移 000074；登记编辑走 PATCH /nodes/{id}）。
        状态词表：ACTIVE（5 分钟内有事件）/STALE（5 分钟~1 小时）/SILENT（超 1 小时）。
        权限：`api_runtime.read`
      responses:
        '200':
          description: 节点列表与总体一致性标记
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecNodeListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/nodes/consistency:
    get:
      operationId: apiSecNodeConsistency
      tags: [api-security]
      summary: 节点版本一致性对比报告
      description: >-
        活跃（非 SILENT）节点按 last_policy_version 分组对比，consistent 字段明确回答
        「所有节点版本是否一致」：参与判定节点（非 SILENT 且已上报版本）版本去重 ≤ 1 即为一致；
        参与节点为 0 时无版本数据可比，consistent 如实为 true 且 evaluated_nodes=0；
        未上报版本（空串）的活跃节点单列一组但不参与判定；SILENT 离线节点不参与判定、
        如实列入 silent_nodes。权限：`api_runtime.read`
      responses:
        '200':
          description: 版本一致性报告
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecNodeConsistencyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/nodes/{id}:
    patch:
      operationId: apiSecNodeSyncRegistrationUpdate
      tags: [api-security]
      summary: 节点同步登记编辑（admin_addr / sync_enabled）
      description: >-
        W18-SYNC §200 配置面主动同步 v2 登记入口：编辑节点 Caddy Admin 通道标识与扇出开关。
        admin_addr 支持 unix socket 绝对路径 / unix:///path / http(s)://host[:port]
        （仅内网管理面地址：回环/私网/链路本地单播，主机名逐一解析校验；拒绝 userinfo、
        非根路径、查询与片段；超过 255 字符拒绝），空串 = 清除登记；
        sync_enabled 控制该节点是否参与发布扇出（默认关闭，登记后须显式开启）。
        两字段均可选但至少提供一项，均未提供返回 400；地址非法返回 400；节点不存在返回 404。
        登记后主节点发布成功时将同一份最终配置扇出到全部登记次要节点（/load + 规范化哈希比对），
        逐节点回填 last_sync_*，次要节点失败不阻断主发布（落库并产系统告警）。
        写操作审计（api_security / update / api_gateway_node，风险中）。
        权限：`api_policy.publish`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 节点行 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecNodeSyncUpdateRequest' }
      responses:
        '200':
          description: 更新后的节点视图行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecGatewayNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== LLM API 观测（apillm，P2-04） ====================
  /api-security/llm/observations:
    get:
      operationId: apiSecLLMObservationList
      tags: [api-security]
      summary: LLM API 观测明细分页列表
      description: >-
        分页列出 LLM 观测（api_llm_observations：网关 LLM 端点识别后的请求/响应观测，
        不落 prompt 原文；findings 为 llm.* 检测明细，证据不含原文）。
        model/endpoint_key 精确过滤（超长返回 400），findings_only=true 仅查命中观测；
        days 按 occurred_at 口径，缺省 7、大于 30 归一 30；page_size 大于 100 归一 100。
        权限：`api_runtime.read`
      parameters:
        - name: model
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: 模型名精确匹配（超过 128 字符返回 400）
        - name: endpoint_key
          in: query
          required: false
          schema: { type: string, maxLength: 560 }
          description: 接口键精确匹配（「METHOD 路径模板」；超过 560 字符返回 400）
        - name: findings_only
          in: query
          required: false
          schema: { type: boolean }
          description: 为 true 时仅查 findings 非空的命中观测（非法取值返回 400）
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 时间窗天数（按 occurred_at 口径，缺省 7；非正数归一 7，大于 30 归一 30）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数归一 20，大于 100 归一 100）
      responses:
        '200':
          description: 分页 LLM 观测列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLLMObservationListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/llm/stats:
    get:
      operationId: apiSecLLMStats
      tags: [api-security]
      summary: LLM API 观测统计看板
      description: >-
        LLM 观测统计（data 即统计对象本身）：汇总（观测数/带命中观测数/token 合计/
        流式调用数/涉及模型数）+ 模型分布 Top10（空串 = 未声明模型单列一组）+
        按天 token 用量趋势 + 命中规则分布（findings 按 rule_id 计数）。
        窗口与列表明细同口径（occurred_at）；days 缺省 7、大于 30 归一 30。
        权限：`api_runtime.read`
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 统计窗口天数（缺省 7；非正数归一 7，大于 30 归一 30）
      responses:
        '200':
          description: LLM 观测统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLLMStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== LLM 输入输出保护策略（apillm WP3-A） ====================
  /api-security/llm/security-policies:
    get:
      operationId: apiSecLLMSecurityPolicyList
      tags: [api-security]
      summary: LLM 输入输出保护策略列表
      description: 列出全部应用的 AI 输入输出保护策略，包含模式、注入/PII 开关、受限话题、提示词体量与单次输出 Token 预算、版本。权限：api_llm_security.read。
      responses:
        '200':
          description: 策略列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLLMSecurityPolicyListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecLLMSecurityPolicyCreate
      tags: [api-security]
      summary: 新建 LLM 输入输出保护策略
      description: 每应用仅允许一条策略；保存后生成 v1 快照，需经整站配置发布生效。写操作审计，权限：api_llm_security.manage。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecLLMSecurityPolicyInput' }
      responses:
        '200':
          description: 新建策略
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLLMSecurityPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/llm/security-policies/{id}:
    patch:
      operationId: apiSecLLMSecurityPolicyUpdate
      tags: [api-security]
      summary: 更新 LLM 输入输出保护策略
      description: 部分更新策略并生成递增版本快照；需经整站配置发布生效。写操作审计，权限：api_llm_security.manage。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecLLMSecurityPolicyInput' }
      responses:
        '200':
          description: 更新后的策略
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLLMSecurityPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecLLMSecurityPolicyDelete
      tags: [api-security]
      summary: 删除 LLM 输入输出保护策略
      description: 删除策略及其版本快照；删除后仍需发布配置才能停用网关策略。写操作审计，权限：api_llm_security.manage。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [deleted] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/llm/security-policies/{id}/versions:
    get:
      operationId: apiSecLLMSecurityPolicyVersionList
      tags: [api-security]
      summary: LLM 输入输出保护策略版本快照
      description: 按版本倒序返回不可变策略快照，不含 Prompt 或敏感内容原文。权限：api_llm_security.read。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 版本快照列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLLMSecurityPolicyVersionListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/grpc-descriptors:
    post:
      operationId: apiGrpcDescriptorUpload
      tags: [api-security]
      summary: 上传 gRPC 描述符集
      description: >-
        以 multipart/form-data 上传 protoset 描述符集文件（表单字段 file，FileDescriptorSet 字节，≤1MiB，
        由 protoc --descriptor_set_out 生成）；可选表单字段 name 指定名称（缺省取上传文件名去
        .pb/.protoset/.bin/.fds 后缀；1-128 字符，限字母/数字/._- 与空白）。线格式非法 400、同名 409。
        上传即 ENABLED（v1 无启停接口，删除即下线）。写操作审计。权限：`api_spec.manage`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: protoset 描述符集文件（≤1MiB）
                name:
                  type: string
                  description: 描述符集名称（可选；缺省取文件名去后缀）
      responses:
        '201':
          description: 上传成功，返回登记的描述符集（含服务/方法摘要，不携带 content 字节）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiGrpcDescriptor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: apiGrpcDescriptorList
      tags: [api-security]
      summary: gRPC 描述符集列表
      description: 列出全部 gRPC 描述符集（含服务/方法摘要，不携带 content 字节；不分页）。权限：`api_spec.manage`。
      responses:
        '200':
          description: 描述符集列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiGrpcDescriptorListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/grpc-descriptors/{id}:
    delete:
      operationId: apiGrpcDescriptorDelete
      tags: [api-security]
      summary: 删除 gRPC 描述符集
      description: 删除描述符集（删除即下线；不存在的 ID 返回 404）。写操作审计。权限：`api_spec.manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 描述符集 ID }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, description: 固定为 deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/grpc-bindings:
    get:
      operationId: apiGrpcBindingList
      tags: [api-security]
      summary: gRPC 描述符绑定列表
      description: >-
        gRPC 描述符 per-app 绑定列表（NG-GRPC G1 批次 B1；应用×服务×描述符集×模式；
        空绑定=全局可见，应用存在任一绑定行时该应用深检只用其绑定集（同名服务跨应用隔离））。
        application_id 可选过滤。权限：`api_spec.read`。
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 绑定列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiGrpcBindingListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiGrpcBindingCreate
      tags: [api-security]
      summary: 创建 gRPC 描述符绑定
      description: >-
        创建绑定（同（应用,服务）恰一条——重复 409；service 须为 pkg.Service 点路径形态
        （^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$，≤256 字符）；descriptor_name 引用的描述符集
        必须存在（400）；mode 缺省 OBSERVE）。HIGH 审计。权限：`api_spec.manage`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiGrpcBindingInput' }
      responses:
        '200':
          description: 创建的绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiGrpcBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/grpc-bindings/undocumented-services:
    get:
      operationId: apiGrpcUndocumentedServiceList
      tags: [api-security]
      summary: 未登记 gRPC 服务清单
      description: >-
        流量观测到（api_endpoints protocol_type=GRPC）但按绑定语义未覆盖描述符的
        service/method 差集（D3 红线管理面可见性——缺描述符不称完整深检）：绑定应用
        按其绑定集判定、无绑定应用按全局 ENABLED 描述符集判定。只读。权限：`api_spec.read`。
      responses:
        '200':
          description: 未登记服务清单（按应用+服务分桶）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiGrpcUndocumentedServiceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/grpc-bindings/{id}:
    put:
      operationId: apiGrpcBindingUpdate
      tags: [api-security]
      summary: 更新 gRPC 描述符绑定
      description: >-
        更新绑定的 mode/descriptor_name（绑定身份维度（应用/服务）不可改——改即删建）；
        version 乐观锁（不匹配 409）。HIGH 审计。权限：`api_spec.manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiGrpcBindingUpdateInput' }
      responses:
        '200':
          description: 更新后的绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiGrpcBinding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiGrpcBindingDelete
      tags: [api-security]
      summary: 删除 gRPC 描述符绑定
      description: 删除绑定（不存在 404）；删除后该应用回退全局注册表语义。HIGH 审计。权限：`api_spec.manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, description: 固定为 deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/mcp/tool-catalogs:
    post:
      operationId: apiMcpToolCatalogCreate
      tags: [api-security]
      summary: 导入 MCP 工具目录
      description: >-
        显式导入 MCP 工具目录（NG-MCP G1 批次 B1；工具集整体提交——新工具与语义变更行
        恒落 PENDING_REVIEW（旧审批不继承），tool_hash=五元组（名称/版本/规范化描述全文/
        双 schema）域分隔 sha256 审批绑定不可变摘要）。同名 409。HIGH 审计。
