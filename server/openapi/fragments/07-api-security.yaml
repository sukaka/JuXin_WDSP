    post:
      operationId: apiMachineIdentityKeyRotate
      tags: [api-security]
      summary: 轮换机器身份公钥
      description: >-
        轮换（§1.6 状态机：原子=新键 ACTIVE+旧键 RETIRED+重叠窗口终点
        retire_overlap_until（overlap_hours 缺省 24、上限 168——窗口内新旧两键均可验证，
        窗口外旧键拒验）；仅 ACTIVE 键可轮换（否则 409）；新 kid 与身份内既有冲突 409）。
        变更触发整站发布链热生效。HIGH 审计。权限：`jwt_trust.manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiMachineIdentityKeyInput' }
      responses:
        '200':
          description: 轮换结果（新键 ACTIVE+旧键 RETIRED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiMachineIdentityRotateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/machine-identities/{id}/keys/{keyId}/revoke:
    post:
      operationId: apiMachineIdentityKeyRevoke
      tags: [api-security]
      summary: 撤销机器身份公钥
      description: >-
        撤销（§1.6：即时生效——撤销事实与撤销水位 seq+1 同一事务原子提交，revoked_seq
        落键行溯源；已 REVOKED 键重复撤销 409；水位单调不下降——发布快照水位低于网关
        已应用水位拒载 fail-closed，普通策略回滚不复活已撤销密钥）。变更触发整站发布链
        热生效。HIGH 审计。权限：`jwt_trust.manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 撤销后的公钥行（REVOKED+revoked_seq 回填）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiMachineIdentityKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/machine-identity-bindings:
    get:
      operationId: apiMachineIdentityBindingList
      tags: [api-security]
      summary: 机器身份绑定列表
      description: >-
        机器身份 per-app 绑定列表（应用×path selector×mode×proof_required；绑定驱动
        识别——请求命中绑定路径才进入机器身份签名评估；绑定不引用身份（登记册全局生效）；
        空绑定=零行为）。application_id 可选过滤。权限：`jwt_trust.read`。
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 绑定列表
          content:
            application/json:
