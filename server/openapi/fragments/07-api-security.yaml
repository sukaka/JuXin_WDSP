  /api-security/machine-identities/{id}/keys:
    post:
      operationId: apiMachineIdentityKeyImport
      tags: [api-security]
      summary: 导入机器身份公钥
      description: >-
        公钥静态离线导入（§1.3 纪律：唯一来源=管理面静态导入；PEM 解析校验算法词表
        （ed25519|ecdsa-p256-sha256|rsa-pss-sha512）与密钥形态——声明 alg 与 PEM 实际
        键型不一致 400；kid 身份内唯一（重复 409）；落库即 ACTIVE）。变更触发整站发布链
        热生效。HIGH 审计（指纹引用不落 PEM 原文）。权限：`jwt_trust.manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiMachineIdentityKeyInput' }
      responses:
        '200':
          description: 导入的公钥行（ACTIVE+key_fingerprint 现算）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiMachineIdentityKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

