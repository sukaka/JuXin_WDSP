        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/ownership:
    get:
      operationId: apiSecAuthzOwnershipList
      tags: [api-security]
      summary: 对象权属分页列表
      description: >-
        分页列出对象权属基线（api_object_ownership，BOLA 判定基线；由权属清扫任务生产，只读查询），
        按最近访问（last_seen）倒序。endpoint_id 非法 UUID、identity/object_id 超长均返回 400。
        权限：`api_authorization.read`
      parameters:
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按接口资产过滤
        - name: identity
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: 按身份指纹过滤
        - name: object_type
          in: query
          required: false
          schema: { type: string }
          description: 按对象类型过滤
        - name: object_id
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
          description: 按对象 ID 过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页对象权属列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecOwnershipListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/field-permissions:
    get:
      operationId: apiSecAuthzFieldPermissionList
      tags: [api-security]
      summary: 字段权限分页列表
      description: >-
        分页列出字段权限（api_field_permissions，Mass Assignment / 字段越权管控，
        随发布通道下发网关）。direction/attribute 自动转大写且非白名单返回 400；
        endpoint_id 非法 UUID、defaults_only 非布尔取值均返回 400。
        权限：`api_authorization.read`
      parameters:
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按接口资产过滤
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [REQUEST, RESPONSE] }
          description: 按字段方向过滤（自动转大写）
        - name: attribute
          in: query
          required: false
          schema: { type: string, enum: [READABLE, WRITABLE, READ_ONLY, ADMIN_WRITABLE, SERVER_GENERATED, SENSITIVE, FORBIDDEN] }
          description: 按字段属性过滤（自动转大写）
        - name: role
          in: query
          required: false
          schema: { type: string }
          description: 按角色码过滤
        - name: tenant
          in: query
          required: false
          schema: { type: string }
          description: 按租户码过滤
        - name: defaults_only
          in: query
          required: false
          schema: { type: boolean }
          description: 仅看默认行（true = role/tenant 均为 NULL 的行）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页字段权限列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFieldPermissionListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecAuthzFieldPermissionCreate
      tags: [api-security]
      summary: 新增字段权限
      description: >-
        新增字段权限：endpoint_id/field_path/direction/attribute 必填；role/tenant 可空
        （缺省为 NULL = 默认行，非空 = 角色/租户覆盖行）。同端点相同字段/方向/角色/租户的权限
        已存在返回 409；引用的端点资产不存在返回 400。写操作审计。
        权限：`api_authorization.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecFieldPermissionRequest' }
      responses:
        '200':
          description: 创建成功的字段权限（data 即字段权限对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFieldPermission' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 相同字段/方向/角色/租户的权限已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/field-permissions/{id}:
    get:
      operationId: apiSecAuthzFieldPermissionGet
      tags: [api-security]
      summary: 字段权限详情
      description: 按 ID 读取字段权限。权限：`api_authorization.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 字段权限 ID
      responses:
        '200':
          description: 字段权限详情（data 即字段权限对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFieldPermission' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: apiSecAuthzFieldPermissionUpdate
      tags: [api-security]
      summary: 编辑字段权限
      description: >-
        部分更新（仅更新请求中出现的字段）；endpoint_id 不可改；role/tenant 显式传空串
        清除为 NULL（回到默认行语义）。写操作审计。权限：`api_authorization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 字段权限 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecFieldPermissionRequest' }
      responses:
        '200':
          description: 更新后的字段权限（data 即字段权限对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFieldPermission' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 相同字段/方向/角色/租户的权限已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecAuthzFieldPermissionDelete
      tags: [api-security]
      summary: 删除字段权限
      description: 删除字段权限。写操作审计（高风险）。权限：`api_authorization.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 字段权限 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/evaluate:
    get:
      operationId: apiSecAuthzEvaluateBola
      tags: [api-security]
      summary: BOLA 五档评估
      description: >-
        对「身份访问对象」做一次 BOLA 五档评估（只读）：有权属记录且匹配=POLICY_CONFIRMED（允许）；
        对象已有属主且访问者非属主=HIGH_CONFIDENCE（越权，高置信）；无对象权属但身份有基线/历史=
        LIKELY（倾向允许）；端点已有权属画像但身份与对象均无记录=POSSIBLE（倾向可疑）；
        无任何证据=INSUFFICIENT_EVIDENCE（无法判定，allowed 为 null）。
        纪律：不仅凭 ID 变化定罪。identity 可空（空 = 匿名身份，不做权属匹配，只走对象侧信号）。
        权限：`api_authorization.read`
      parameters:
        - name: endpoint_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: 接口资产 ID（必填，非法 UUID 返回 400）
        - name: object_id
          in: query
          required: true
          schema: { type: string, maxLength: 256 }
          description: 被访问对象 ID（必填，≤256）
        - name: identity
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: 身份指纹（可空，空 = 匿名身份）
      responses:
        '200':
          description: 评估结果（data 即评估结果对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzEvaluateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 端点资产不存在（错误码 RESOURCE_NOT_FOUND）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== API 主动扫描（apiscan，P1-07，迁移 000053/000054/000056） ====================
  # 定位：对已纳管 API 资产的经授权有限主动验证（非 DAST）。授权先于一切执行——任务必须凭一张
  # 未撤销且未过期的授权单运行；双人分离（建目标 api_scan.manage / 授权签发与撤销 api_scan.execute，
  # 建标人不得自授权）；撤销/紧急停止联动停止该授权下全部在跑任务。settings 组 api_scan.enabled
  # 默认关（关闭时发起任务/复测返回 403）。
  /api-security/scans/targets:
    get:
      operationId: apiScanTargetList
      tags: [api-security]
      summary: 扫描目标分页列表
      description: >-
        分页列出主动扫描目标（api_scan_targets）。支持 application_id/status 过滤；
        非法取值返回 400。权限：`api_scan.read`
      parameters:
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid }, description: 按已纳管应用过滤；非法 UUID 返回 400 }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ENABLED, DISABLED] }, description: 目标状态（自动转大写） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码 }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20 }, description: 每页条数 }
      responses:
        '200':
          description: 分页扫描目标列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanTargetListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiScanTargetCreate
      tags: [api-security]
      summary: 创建扫描目标
      description: >-
        创建扫描目标：靶标仅来自已纳管应用（application_id 外键 applications），
        base_url 必须为合法 http/https 地址，allowed_paths 为允许探测的路径白名单
        （每项以 / 开头，≤64 条；空 = 不探测任何路径）。application_id 不存在返回 400。
        权限：`api_scan.manage`。记录操作审计（中风险）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanTargetCreateRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanTargetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/targets/{id}:
    get:
      operationId: apiScanTargetGet
      tags: [api-security]
      summary: 扫描目标详情
      description: >-
        返回单个扫描目标。权限：`api_scan.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目标 ID }
      responses:
        '200':
          description: 目标详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanTargetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: apiScanTargetUpdate
      tags: [api-security]
      summary: 更新扫描目标
      description: >-
        维护/停用扫描目标（name/base_url/allowed_paths/status 全量更新；application_id 不可改）。
        status 取值 ENABLED/DISABLED；停用后不能发起新扫描。权限：`api_scan.manage`。记录操作审计（中风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目标 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanTargetUpdateRequest' }
      responses:
        '200':
          description: 更新后的目标
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanTargetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/targets/{id}/authorize:
    post:
      operationId: apiScanTargetAuthorize
      tags: [api-security]
      summary: 签发扫描授权
      description: >-
        为目标签发扫描授权单（双人分离：建标人不得自授权，违反返回 403）。
        expires_at 必填且须为未来时间；max_qps 1~100（缺省 5）、max_concurrency 1~16（缺省 1）；
        window_start/window_end 为可选扫描时间窗；allowlist 为允许出包的域名/IP 白名单
        （空 = 仅 base_url 主机自身）；test_profile 为逗号分隔探针集画像（词表见 ApiScanFinding.template，空 = 全部内置探针集）。
        权限：`api_scan.execute`。记录操作审计（高风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目标 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanAuthorizeRequest' }
      responses:
        '201':
          description: 授权单已签发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanAuthorizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无权限，或建标人与授权人为同一人（双人分离）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/targets/{id}/authorizations:
    get:
      operationId: apiScanAuthorizationList
      tags: [api-security]
      summary: 目标授权单分页列表
      description: >-
        分页列出目标下的扫描授权单（按创建时间倒序）。权限：`api_scan.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目标 ID }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码 }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20 }, description: 每页条数 }
      responses:
        '200':
          description: 分页授权单列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanAuthorizationListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/authorizations/{id}/revoke:
    post:
      operationId: apiScanAuthorizationRevoke
      tags: [api-security]
      summary: 撤销扫描授权
      description: >-
        撤销授权单（撤销即停：联动停止该授权下全部在跑任务，返回 stopped_jobs 计数；
        执行侧每批发包前重查授权，撤销即刻停发）。无请求体。
        权限：`api_scan.execute`。记录操作审计（高风险）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 授权单 ID }
      responses:
        '200':
          description: 授权已撤销（含联动停止的任务数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanRevokeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/jobs:
    get:
      operationId: apiScanJobList
      tags: [api-security]
      summary: 扫描任务分页列表
      description: >-
        分页列出扫描任务（api_scan_jobs）。支持 target_id/status 过滤；非法取值返回 400。
        权限：`api_scan.read`
      parameters:
        - { name: target_id, in: query, required: false, schema: { type: string, format: uuid }, description: 按目标过滤；非法 UUID 返回 400 }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, RUNNING, PAUSED, STOPPED, COMPLETED, FAILED] }, description: 任务状态（自动转大写） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码 }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20 }, description: 每页条数 }
      responses:
        '200':
          description: 分页扫描任务列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanJobListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiScanJobCreate
      tags: [api-security]
      summary: 发起扫描任务
      description: >-
        凭授权单发起扫描任务（初始状态 PENDING）。强校验：主动扫描能力须启用
        （settings api_scan.enabled，未启用返回 403）；目标须 ENABLED；授权单须属于该目标且
        未撤销/未过期/在时间窗内；目标主机须在授权 allowlist 内；probe_set 逗号分隔探针集
        必须是授权 test_profile 白名单子集（空 = 授权画像全集）。权限：`api_scan.manage`。记录操作审计（中风险）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiScanJobCreateRequest' }
      responses:
        '201':
          description: 任务已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScanJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无权限，或主动扫描能力未启用（settings api_scan.enabled）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/scans/jobs/{id}:
