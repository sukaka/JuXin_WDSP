  # ==================== 网关节点版本校验（apinodes，多节点遥测） ====================
  /api-security/nodes:
    get:
      operationId: apiSecNodeList
      tags: [api-security]
      summary: 网关节点列表（状态+版本+同步登记/结果+一致性标记）
      description: >-
        W12 多节点版本校验 v1 + W18-SYNC 配置面同步登记：列出 api_gateway_nodes 节点视图
        （SweepOnce 按 api_runtime_events.gateway_node 增量聚合，绝对值覆盖幂等；
        W17-HB 起节点活性/策略版本另有网关心跳写入方，取新不回退），
        逐项 version_consistent 标记该节点策略版本是否与活跃多数派一致
        （null = 未参与判定：SILENT 离线或未上报版本）；响应总体 consistent/evaluated_nodes
        与 /nodes/consistency 同一判定口径。节点行另带出配置面同步登记与结果列
        （admin_addr/sync_enabled/last_sync_*，迁移 000074；登记编辑走 PATCH /nodes/{id}）。
        状态词表：ACTIVE（5 分钟内有事件）/STALE（5 分钟~1 小时）/SILENT（超 1 小时）。
        权限：`api_runtime.read`
      responses:
        '200':
          description: 节点列表与总体一致性标记
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecNodeListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/nodes/consistency:
    get:
      operationId: apiSecNodeConsistency
      tags: [api-security]
      summary: 节点版本一致性对比报告
      description: >-
        活跃（非 SILENT）节点按 last_policy_version 分组对比，consistent 字段明确回答
        「所有节点版本是否一致」：参与判定节点（非 SILENT 且已上报版本）版本去重 ≤ 1 即为一致；
        参与节点为 0 时无版本数据可比，consistent 如实为 true 且 evaluated_nodes=0；
        未上报版本（空串）的活跃节点单列一组但不参与判定；SILENT 离线节点不参与判定、
        如实列入 silent_nodes。权限：`api_runtime.read`
      responses:
        '200':
          description: 版本一致性报告
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecNodeConsistencyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/nodes/{id}:
    patch:
      operationId: apiSecNodeSyncRegistrationUpdate
      tags: [api-security]
      summary: 节点同步登记编辑（admin_addr / sync_enabled）
      description: >-
        W18-SYNC §200 配置面主动同步 v2 登记入口：编辑节点 Caddy Admin 通道标识与扇出开关。
        admin_addr 支持 unix socket 绝对路径 / unix:///path / http(s)://host[:port]
        （仅内网管理面地址：回环/私网/链路本地单播，主机名逐一解析校验；拒绝 userinfo、
        非根路径、查询与片段；超过 255 字符拒绝），空串 = 清除登记；
        sync_enabled 控制该节点是否参与发布扇出（默认关闭，登记后须显式开启）。
        两字段均可选但至少提供一项，均未提供返回 400；地址非法返回 400；节点不存在返回 404。
        登记后主节点发布成功时将同一份最终配置扇出到全部登记次要节点（/load + 规范化哈希比对），
        逐节点回填 last_sync_*，次要节点失败不阻断主发布（落库并产系统告警）。
        写操作审计（api_security / update / api_gateway_node，风险中）。
        权限：`api_policy.publish`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 节点行 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecNodeSyncUpdateRequest' }
      responses:
        '200':
          description: 更新后的节点视图行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecGatewayNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== LLM API 观测（apillm，P2-04） ====================
  /api-security/llm/observations:
    get:
      operationId: apiSecLLMObservationList
      tags: [api-security]
      summary: LLM API 观测明细分页列表
      description: >-
        分页列出 LLM 观测（api_llm_observations：网关 LLM 端点识别后的请求/响应观测，
        不落 prompt 原文；findings 为 llm.* 检测明细，证据不含原文）。
        model/endpoint_key 精确过滤（超长返回 400），findings_only=true 仅查命中观测；
        days 按 occurred_at 口径，缺省 7、大于 30 归一 30；page_size 大于 100 归一 100。
        权限：`api_runtime.read`
      parameters:
        - name: model
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: 模型名精确匹配（超过 128 字符返回 400）
        - name: endpoint_key
          in: query
          required: false
          schema: { type: string, maxLength: 560 }
          description: 接口键精确匹配（「METHOD 路径模板」；超过 560 字符返回 400）
        - name: findings_only
          in: query
          required: false
          schema: { type: boolean }
          description: 为 true 时仅查 findings 非空的命中观测（非法取值返回 400）
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 时间窗天数（按 occurred_at 口径，缺省 7；非正数归一 7，大于 30 归一 30）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数归一 20，大于 100 归一 100）
      responses:
        '200':
          description: 分页 LLM 观测列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLLMObservationListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/llm/stats:
    get:
      operationId: apiSecLLMStats
      tags: [api-security]
      summary: LLM API 观测统计看板
      description: >-
        LLM 观测统计（data 即统计对象本身）：汇总（观测数/带命中观测数/token 合计/
        流式调用数/涉及模型数）+ 模型分布 Top10（空串 = 未声明模型单列一组）+
        按天 token 用量趋势 + 命中规则分布（findings 按 rule_id 计数）。
        窗口与列表明细同口径（occurred_at）；days 缺省 7、大于 30 归一 30。
        权限：`api_runtime.read`
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
          description: 统计窗口天数（缺省 7；非正数归一 7，大于 30 归一 30）
      responses:
        '200':
          description: LLM 观测统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLLMStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/grpc-descriptors:
    post:
      operationId: apiGrpcDescriptorUpload
      tags: [api-security]
      summary: 上传 gRPC 描述符集
      description: >-
        以 multipart/form-data 上传 protoset 描述符集文件（表单字段 file，FileDescriptorSet 字节，≤1MiB，
        由 protoc --descriptor_set_out 生成）；可选表单字段 name 指定名称（缺省取上传文件名去
        .pb/.protoset/.bin/.fds 后缀；1-128 字符，限字母/数字/._- 与空白）。线格式非法 400、同名 409。
        上传即 ENABLED（v1 无启停接口，删除即下线）。写操作审计。权限：`api_spec.manage`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: protoset 描述符集文件（≤1MiB）
                name:
                  type: string
                  description: 描述符集名称（可选；缺省取文件名去后缀）
      responses:
        '201':
          description: 上传成功，返回登记的描述符集（含服务/方法摘要，不携带 content 字节）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiGrpcDescriptor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: apiGrpcDescriptorList
      tags: [api-security]
      summary: gRPC 描述符集列表
      description: 列出全部 gRPC 描述符集（含服务/方法摘要，不携带 content 字节；不分页）。权限：`api_spec.manage`。
      responses:
        '200':
          description: 描述符集列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiGrpcDescriptorListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/grpc-descriptors/{id}:
    delete:
      operationId: apiGrpcDescriptorDelete
      tags: [api-security]
      summary: 删除 gRPC 描述符集
      description: 删除描述符集（删除即下线；不存在的 ID 返回 404）。写操作审计。权限：`api_spec.manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 描述符集 ID }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, description: 固定为 deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  schemas:
    # ---------- 接口资产（apiassets） ----------
    ApiSecEndpoint:
      type: object
      description: API 接口（api_endpoints；列表接口额外带出站点名称与主域名）
      required:
        - id
        - http_method
        - normalized_path
        - raw_path_example
        - directory_path
        - endpoint_key
        - api_confidence
        - asset_status
        - protocol_type
        - learning_status
        - classification_locked
        - is_api
        - hit_count
        - first_seen_at
        - last_seen_at
      properties:
        id: { type: string, format: uuid, description: 接口 ID }
        application_id:
          type: string
          format: uuid
          nullable: true
          description: 所属站点（应用）ID；未归属时缺省或为 null
        application_name: { type: string, description: 所属站点名称（仅列表带出，未归属为空串） }
        application_domain: { type: string, description: 所属站点主域名（仅列表带出，无域名记录为空串） }
        domain_id:
          type: string
          format: uuid
          nullable: true
          description: 命中的站点域名 ID（可空）
        http_method: { type: string, description: HTTP 方法（大写），如 GET/POST }
        normalized_path:
          type: string
          description: 归一化路径模板（如 /v1/users/{id}）
        raw_path_example: { type: string, description: 原始路径样例 }
        directory_path: { type: string, description: 归一化目录路径（normalized_path 去掉最后一段；未归类为空串） }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」，全局唯一） }
        api_confidence: { type: number, format: double, description: API 判定置信度（0-1） }
        asset_status:
          type: string
          enum: [DISCOVERED, CONFIRMED, IGNORED, DEPRECATED]
          description: 资产状态
        protocol_type: { type: string, description: 协议类型（如 HTTP/REST） }
        learning_status:
          type: string
          enum: [NOT_STARTED, LEARNING, PAUSED, LEARNED]
          description: 学习状态
        current_model_version_id:
          type: string
          format: uuid
          nullable: true
          description: 当前激活的模型版本 ID（可空）
        classification_locked: { type: boolean, description: 分类是否锁定（手动分类后锁定，防止自动分类覆盖） }
        is_api: { type: boolean, description: 是否判定为 API 接口 }
        hit_count: { type: integer, format: int64, description: 累计命中次数 }
        first_seen_at: { type: string, format: date-time, description: 首次发现时间 }
        last_seen_at: { type: string, format: date-time, description: 最近命中时间 }
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: 人工确认时间（未确认时缺省或为 null）
        business_type:
          type: string
          enum: [LOGIN, REGISTER, PASSWORD_RESET, SMS, EMAIL, ORDER, PAYMENT, EXPORT, DOWNLOAD, SEARCH, QUERY_PERSONAL_DATA, AI_INFERENCE, OTHER]
          description: 业务类型（仅列表带出，api_assets.business_type；无资产记录归一为 OTHER）
        asset:
          $ref: '#/components/schemas/ApiSecAsset'
      # asset 字段仅在详情/更新响应中附带，无记录时缺省

    ApiSecAsset:
      type: object
      description: 接口业务维度扩展（api_assets）
      required: [endpoint_id, purpose, exposure, data_classification, owner, tags, business_type, created_at, updated_at]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        purpose: { type: string, description: 业务用途说明（最长 128） }
        exposure:
          type: string
          enum: [INTERNAL, PARTNER, PUBLIC]
          description: 暴露面
        data_classification: { type: string, description: 数据分级（系统判定，只读） }
        owner: { type: string, description: 负责人（最长 128） }
        tags:
          type: array
          items: { type: string }
          description: 业务标签（最多 32 个，单个最长 64）
        business_type:
          type: string
          enum: [LOGIN, REGISTER, PASSWORD_RESET, SMS, EMAIL, ORDER, PAYMENT, EXPORT, DOWNLOAD, SEARCH, QUERY_PERSONAL_DATA, AI_INFERENCE, OTHER]
          description: 业务类型（敏感业务流标签，WDSP 设计 #12.1；默认 OTHER）
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecSiteSummaryItem:
      type: object
      description: 站点接口计数（站点列表角标）
      required: [application_name, application_domain, endpoint_count]
      properties:
        application_id:
          type: string
          format: uuid
          nullable: true
          description: 站点 ID
        application_name: { type: string, description: 站点名称 }
        application_domain: { type: string, description: 主域名（前端优先展示；无域名记录为空串） }
        endpoint_count: { type: integer, format: int64, description: 该站点接口数 }

    ApiSecSiteSummaryResponse:
      type: object
      required: [items, unassigned]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecSiteSummaryItem' }
        unassigned: { type: integer, format: int64, description: 未归属站点接口数 }

    ApiSecDirectoryCount:
      type: object
      description: 目录接口计数（目录树扁平节点）
      required: [directory_path, endpoint_count]
      properties:
        directory_path: { type: string, description: 目录路径，如 /test/php }
        endpoint_count: { type: integer, format: int64, description: 该目录接口数 }

    ApiSecDirectoryTreeResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecDirectoryCount' }

    ApiSecEndpointListResponse:
      type: object
      description: 接口分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecEndpoint' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecEndpointConfirmRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          maxItems: 100
          description: 待确认接口 ID 列表（单次最多 100 个）

    ApiSecConfirmFailedItem:
      type: object
      required: [id, reason]
      properties:
        id: { type: string, format: uuid, description: 确认失败的接口 ID }
        reason: { type: string, description: 失败原因 }

    ApiSecEndpointConfirmResponse:
      type: object
      required: [confirmed, confirmed_ids, failed]
      properties:
        confirmed: { type: integer, description: 确认成功数量 }
        confirmed_ids:
          type: array
          items: { type: string, format: uuid }
          description: 确认成功的接口 ID 列表
        failed:
          type: array
          items: { $ref: '#/components/schemas/ApiSecConfirmFailedItem' }
          description: 逐项失败明细

    ApiSecEndpointResponse:
      type: object
      required: [endpoint]
      properties:
        endpoint: { $ref: '#/components/schemas/ApiSecEndpoint' }

    ApiSecTrafficTrend:
      type: object
      description: 接口访问趋势（traffic-trend 响应 data 层；数据来自采集链路全量流量计数，留存 7 天）
      required: [endpoint_id, bucket_seconds, range, total, points]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        bucket_seconds: { type: integer, description: 桶宽（秒），固定 300（5 分钟，UTC 对齐） }
        range: { type: string, enum: [1h, 24h, 7d], description: 实际生效的统计窗口（缺省或非法输入回落 24h） }
        total: { type: integer, format: int64, description: 窗口内请求总量（points 计数合计） }
        points:
          type: array
          description: 连续 5 分钟桶点列（服务端补零，无数据桶 count=0），时间升序
          items: { $ref: '#/components/schemas/ApiSecTrafficPoint' }

    ApiSecTrafficPoint:
      type: object
      required: [time, count]
      properties:
        time: { type: string, format: date-time, description: 桶起点（UTC，5 分钟对齐） }
        count: { type: integer, format: int64, description: 桶内请求数 }

    ApiSecEndpointMutateResponse:
      type: object
      required: [endpoint, message]
      properties:
        endpoint: { $ref: '#/components/schemas/ApiSecEndpoint' }
        message: { type: string, description: 操作结果提示 }

    ApiSecEndpointUpdateRequest:
      type: object
      description: 资产信息全量替换（至少提交一个字段；未提交字段按空值覆盖）
      properties:
        purpose: { type: string, maxLength: 128, description: 业务用途说明 }
        exposure:
          type: string
          enum: [INTERNAL, PARTNER, PUBLIC]
          description: 暴露面（自动转大写；空值归一为 INTERNAL）
        owner: { type: string, maxLength: 128, description: 负责人 }
        tags:
          type: array
          items: { type: string, maxLength: 64 }
          maxItems: 32
          description: 业务标签（全量替换；不允许空串）
        business_type:
          type: string
          enum: [LOGIN, REGISTER, PASSWORD_RESET, SMS, EMAIL, ORDER, PAYMENT, EXPORT, DOWNLOAD, SEARCH, QUERY_PERSONAL_DATA, AI_INFERENCE, OTHER]
          description: 业务类型（自动转大写；空值归一为 OTHER；非法值返回 400）

    ApiSecEndpointMergeRequest:
      type: object
      required: [other_id]
      properties:
        other_id: { type: string, format: uuid, description: 待并入的接口 ID（不能与路径 id 相同） }

    ApiSecEndpointSplitRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 50
          description: 拆分目标路径列表（自动归一化，单次最多 50 个，不允许空串）

    ApiSecEndpointSplitResponse:
      type: object
      required: [endpoints, message]
      properties:
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/ApiSecEndpoint' }
          description: 新创建的接口列表
        message: { type: string, description: 操作结果提示 }

    ApiSecClassificationDimension:
      type: object
      description: 接口分类维度（apiassets 自动分类结果，api_classification_dimensions）
      required: [endpoint_id, dimension, value, source, confidence]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        dimension: { type: string, description: 分类维度（PURPOSE / EXPOSURE / ACCESS） }
        value: { type: string, description: 分类取值（如 AUTH / TRADE / FILE / ADMIN / USER_MGMT / QUERY / GENERAL；INTERNAL / PUBLIC；READ / WRITE） }
        source: { type: string, enum: [AUTO, MANUAL], description: 分类来源 }
        confidence: { type: number, format: double, description: 分类置信度（0-1） }

    ApiSecEndpointClassifyResponse:
      type: object
      required: [dimensions, message]
      properties:
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/ApiSecClassificationDimension' }
        message: { type: string, description: 操作结果提示 }

    # ---------- 学习任务（apiassets） ----------
    ApiSecLearningStartRequest:
      type: object
      description: 可选请求体（无体/无字段/null 均按缺省 100 处理）
      properties:
        sample_target:
          type: integer
          nullable: true
          minimum: 10
          maximum: 100000
          description: 有效样本目标（缺省 100；越界返回 400）

    ApiSecLearningJob:
      type: object
      description: 学习任务（api_learning_jobs）
      required:
        - id
        - endpoint_id
        - status
        - sample_target
        - collected_count
        - valid_count
        - excluded_count
        - started_at
        - created_at
      properties:
        id: { type: string, format: uuid, description: 任务 ID }
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        status:
          type: string
          enum: [RUNNING, STOPPED, COMPLETED]
          description: 任务状态（达阈值后由后台调度器置 COMPLETED）
        sample_target: { type: integer, description: 有效样本目标 }
        collected_count: { type: integer, description: 已采集样本数 }
        valid_count: { type: integer, description: 有效（采纳）样本数 }
        excluded_count: { type: integer, description: 已排除样本数 }
        last_error: { type: string, description: 最近一次错误信息（无则缺省） }
        started_at: { type: string, format: date-time, description: 启动时间 }
        stopped_at:
          type: string
          format: date-time
          nullable: true
          description: 停止/完成时间（运行中时缺省或为 null）
        created_by:
          type: string
          format: uuid
          nullable: true
          description: 启动人用户 ID（可空）
        created_at: { type: string, format: date-time }

    ApiSecLearningJobResponse:
      type: object
      required: [job, message]
      properties:
        job: { $ref: '#/components/schemas/ApiSecLearningJob' }
        message: { type: string, description: 操作结果提示 }

    ApiSecSampleStats:
      type: object
      description: 学习样本统计（api_learning_samples 聚合）
      required: [total, accepted, excluded]
      properties:
        total: { type: integer, format: int64, description: 样本总数 }
        accepted: { type: integer, format: int64, description: 采纳数 }
        excluded: { type: integer, format: int64, description: 排除数 }

    ApiSecLearningStatusResponse:
      type: object
      required: [endpoint_id, learning_status, job, samples]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        learning_status:
          type: string
          enum: [NOT_STARTED, LEARNING, PAUSED, LEARNED]
          description: 接口当前学习状态
        job:
          nullable: true
          $ref: '#/components/schemas/ApiSecLearningJob'
        samples: { $ref: '#/components/schemas/ApiSecSampleStats' }

    ApiSecLearningSample:
      type: object
      description: 学习样本（api_learning_samples；仅存样本哈希，不含完整敏感值）
      required:
        - id
        - endpoint_id
        - request_id
        - sample_hash
        - source_fingerprint
        - identity_fingerprint
        - accepted
        - exclude_reason
        - collected_at
      properties:
        id: { type: string, format: uuid, description: 样本 ID }
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        request_id: { type: string, description: 来源请求 ID }
        sample_hash: { type: string, description: 样本内容哈希 }
        source_fingerprint: { type: string, description: 来源指纹（客户端维度） }
        identity_fingerprint: { type: string, description: 身份指纹（调用方维度） }
        response_status:
          type: integer
          nullable: true
          description: 响应状态码（可空）
        accepted: { type: boolean, description: 是否被学习采纳 }
        exclude_reason: { type: string, description: 排除原因（采纳时为空串） }
        collected_at: { type: string, format: date-time, description: 采集时间 }

    ApiSecLearningSampleListResponse:
      type: object
      description: 学习样本分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecLearningSample' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecLifecycleEvent:
      type: object
      description: 接口生命周期事件（api_lifecycle_events）
      required: [id, endpoint_id, from_status, to_status, reason, actor, created_at]
      properties:
        id: { type: string, format: uuid, description: 事件 ID }
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        from_status: { type: string, description: 变更前状态（合并/拆分类事件为空串） }
        to_status: { type: string, description: 变更后状态（如 CONFIRMED / IGNORED / MERGED / SPLIT / PAUSED / LEARNED） }
        reason: { type: string, description: 变更原因 }
        actor: { type: string, description: 操作者（system 或用户名） }
        created_at: { type: string, format: date-time }

    ApiSecLifecycleEventListResponse:
      type: object
      description: 生命周期事件分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecLifecycleEvent' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    # ---------- 模型版本（apimodels，51.2） ----------
    ApiSecModelVersion:
      type: object
      description: >-
        模型版本（api_model_versions）。生命周期状态机：
        CANDIDATE → IN_REVIEW → FORMAL / REJECTED；FORMAL → SUPERSEDED（被新正式版本取代）；
        FORMAL / SUPERSEDED / REJECTED → ARCHIVED。正式模型内容不可变（仅状态迁移）。
      required:
        - id
        - api_endpoint_id
        - endpoint_key
        - version_number
        - status
        - schema
        - content_hash
        - change_summary
        - sample_count
        - valid_sample_count
        - excluded_sample_count
        - confidence
        - created_reason
        - created_at
      properties:
        id: { type: string, format: uuid, description: 模型版本 ID }
        api_endpoint_id: { type: string, format: uuid, description: 所属接口 ID }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」） }
        version_number: { type: integer, description: 版本号（创建时按接口序号分配，状态迁移不改变） }
        parent_version_id:
          type: string
          format: uuid
          nullable: true
          description: 父版本 ID（可空）
        request_schema_id:
          type: string
          format: uuid
          nullable: true
          description: 请求 Schema ID（可空）
        response_schema_set_id:
          type: string
          format: uuid
          nullable: true
          description: 响应 Schema 集 ID（可空）
        status:
          type: string
          enum: [CANDIDATE, IN_REVIEW, FORMAL, REJECTED, SUPERSEDED, ARCHIVED]
          description: 版本状态
        schema:
          type: object
          additionalProperties: { type: string }
          description: 字段路径 → 类型词汇映射（类型词与网关解析器粗类型对齐：string/number/bool/object/array/null）
        content_hash: { type: string, description: 内容哈希（SHA-256，十六进制） }
        change_summary: { type: string, description: 变更说明 }
        sample_count: { type: integer, description: 学习样本总数 }
        valid_sample_count: { type: integer, description: 有效样本数 }
        excluded_sample_count: { type: integer, description: 排除样本数 }
        confidence: { type: number, format: double, description: 置信度（0-1） }
        created_reason:
          type: string
          enum: [manual, learning_threshold]
          description: 创建来源（manual 手工创建；learning_threshold 学习达阈值自动生成）
        created_by:
          type: string
          format: uuid
          nullable: true
          description: 创建人用户 ID（可空）
        created_at: { type: string, format: date-time }
        confirmed_by:
          type: string
          format: uuid
          nullable: true
          description: 确认人用户 ID（可空）
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: 确认为正式版本时间（可空）
        activated_at:
          type: string
          format: date-time
          nullable: true
          description: 最近激活时间（可空）

    ApiSecModelVersionListResponse:
      type: object
      description: 模型版本分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecModelVersion' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecModelCreateRequest:
      type: object
      required: [schema]
      properties:
        schema:
          type: object
          additionalProperties: { type: string }
          minProperties: 1
          description: 字段路径 → 类型词汇映射（必填，不能为空对象）
        change_summary: { type: string, description: 可选变更说明 }

    ApiSecModelVersionResponse:
      type: object
      required: [version, message]
      properties:
        version: { $ref: '#/components/schemas/ApiSecModelVersion' }
        message: { type: string, description: 操作结果提示 }

    ApiSecModelReviewRequest:
      type: object
      description: 可选评审意见（空体视为无评论）
      properties:
        comment: { type: string, description: 评审意见 }

    ApiSecTypeChange:
      type: object
      description: 字段类型变化
      required: [field, from, to]
      properties:
        field: { type: string, description: 字段路径 }
        from: { type: string, description: 原类型 }
        to: { type: string, description: 新类型 }

    ApiSecSchemaDiff:
      type: object
      description: 两版本字段级差异（按字段名排序）
      required: [added, removed, type_changed]
      properties:
        added:
          type: array
          items: { type: string }
          description: 新增字段
        removed:
          type: array
          items: { type: string }
          description: 删除字段
        type_changed:
          type: array
          items: { $ref: '#/components/schemas/ApiSecTypeChange' }
          description: 类型变化字段

    ApiSecModelDiff:
      type: object
      description: 版本差异记录（api_model_diffs；diff 方向为 other_version_id → model_version_id）
      required: [id, model_version_id, other_version_id, diff, created_at]
      properties:
        id: { type: string, format: uuid, description: 差异记录 ID }
        model_version_id: { type: string, format: uuid, description: 目标模型版本 ID }
        other_version_id: { type: string, format: uuid, description: 对比基准版本 ID }
        diff: { $ref: '#/components/schemas/ApiSecSchemaDiff' }
        created_at: { type: string, format: date-time }

    # ---------- 参数模型（apimodels，51.3） ----------
    ApiSecParameter:
      type: object
      description: 参数模型（api_parameter_models；观测/推荐/确认三层约束）
      required:
        - id
        - model_version_id
        - direction
        - location
        - structured_path
        - parameter_name
        - base_type
        - semantic_type
        - required
        - nullable
        - empty_allowed
        - observed_constraints
        - recommended_constraints
        - confirmed_constraints
        - sensitivity_level
        - confidence
        - created_at
      properties:
        id: { type: string, format: uuid, description: 参数 ID }
        model_version_id: { type: string, format: uuid, description: 所属模型版本 ID }
        direction:
          type: string
          enum: [REQUEST, RESPONSE]
          description: 报文方向
        location:
          type: string
          enum: [QUERY, HEADER, BODY, PATH, COOKIE]
          description: 参数位置
        structured_path:
          type: string
          description: 结构化路径（BODY 点路径，如 items[].sku）
        parameter_name: { type: string, description: 参数名（结构化路径末段，去数组标记） }
        base_type:
          type: string
          enum: [string, number, bool, object, array, 'null']
          description: 基础类型（与网关解析器粗类型词表对齐）
        semantic_type: { type: string, description: 语义类型（可空串，如 phone/email） }
        required: { type: boolean, description: 是否必填（缺失产生 OBSERVE 级检测明细） }
        nullable: { type: boolean, description: 是否允许 null }
        empty_allowed: { type: boolean, description: 是否允许空值 }
        observed_constraints:
          type: object
          description: 观测约束（学习期观测，如 min_length/max_length/minimum/maximum/enum）
        recommended_constraints:
          type: object
          description: 推荐约束（系统推荐，确认时整体拷贝给 confirmed_constraints）
        confirmed_constraints:
          type: object
          description: 确认约束（人工确认后生效，经发布通道下发网关；确认态以非空为准）
        sensitivity_level: { type: string, description: 敏感级别（如 UNKNOWN / LOW / MEDIUM / HIGH） }
        confidence: { type: number, format: double, description: 置信度（0-1） }
        created_at: { type: string, format: date-time }

    ApiSecParameterListResponse:
      type: object
      description: 参数分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecParameter' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecParameterUpdateRequest:
      type: object
      description: 参数确认约束编辑输入（全量写库：布尔缺省 false，constraints 缺省 {}，sensitivity_level 缺省 UNKNOWN）
      properties:
        required: { type: boolean, description: 是否必填 }
        nullable: { type: boolean, description: 是否允许 null }
        empty_allowed: { type: boolean, description: 是否允许空值 }
        confirmed_constraints:
          type: object
          description: 确认约束（钉死词汇：min_length/max_length/minimum/maximum/enum）
        sensitivity_level: { type: string, description: 敏感级别 }

    ApiSecParameterResponse:
      type: object
      required: [parameter, message]
      properties:
        parameter: { $ref: '#/components/schemas/ApiSecParameter' }
        message: { type: string, description: 操作结果提示 }

    # ---------- 用途分类（apisecurity，51.4） ----------
    ApiSecClassificationItem:
      type: object
      description: 内置分类（api_classifications）
      required: [id, code, name, description, is_builtin, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: 分类编码 }
        name: { type: string, description: 分类名称 }
        description: { type: string, description: 分类说明 }
        is_builtin: { type: boolean, description: 是否内置 }
        created_at: { type: string, format: date-time }

    ApiSecCustomTaxonomy:
      type: object
      description: 自定义分类法条目（api_custom_taxonomies）
      required: [id, dimension, value, description, created_at]
      properties:
        id: { type: string, format: uuid }
        dimension: { type: string, description: 分类维度（1-64 字符） }
        value: { type: string, description: 分类取值（1-128 字符） }
        description: { type: string, description: 说明 }
        created_by:
          type: string
          format: uuid
          nullable: true
          description: 创建人用户 ID（可空）
        created_at: { type: string, format: date-time }

    ApiSecClassificationListResponse:
      type: object
      description: 内置分类与自定义分类法合并视图
      required: [builtin, custom]
      properties:
        builtin:
          type: array
          items: { $ref: '#/components/schemas/ApiSecClassificationItem' }
        custom:
          type: array
          items: { $ref: '#/components/schemas/ApiSecCustomTaxonomy' }

    ApiSecClassificationCreateRequest:
      type: object
      required: [dimension, value]
      properties:
        dimension: { type: string, minLength: 1, maxLength: 64, description: 分类维度 }
        value: { type: string, minLength: 1, maxLength: 128, description: 分类取值 }
        description: { type: string, description: 说明（可选） }

    ApiSecEndpointDimensionInput:
      type: object
      required: [dimension, value]
      properties:
        dimension: { type: string, minLength: 1, maxLength: 64, description: 分类维度（同一请求内不可重复） }
        value: { type: string, minLength: 1, maxLength: 128, description: 分类取值 }

    ApiSecEndpointClassificationRequest:
      type: object
      required: [dimensions]
      properties:
        dimensions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ApiSecEndpointDimensionInput' }
          description: 待覆盖的分类维度列表（非空）

    ApiSecEndpointDimension:
      type: object
      description: 接口当前分类维度（apisecurity 手动分类读取结果，api_classification_dimensions）
      required: [dimension, value, source, confidence]
      properties:
        dimension: { type: string, description: 分类维度 }
        value: { type: string, description: 分类取值 }
        source: { type: string, enum: [AUTO, MANUAL], description: 分类来源 }
        confidence: { type: number, format: double, description: 置信度（手动分类固定为 1） }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 最近更新时间（可空）

    ApiSecEndpointClassificationResponse:
      type: object
      required: [endpoint_id, classification_locked, dimensions]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        classification_locked: { type: boolean, description: 分类锁定标记（手动分类后固定为 true） }
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/ApiSecEndpointDimension' }

    # ---------- 调用图谱 / 拓扑（apisecurity，51.4） ----------
    ApiSecGraphNode:
      type: object
      description: 图谱节点（接口摘要）
      required: [id, endpoint_key, http_method, normalized_path, asset_status, learning_status, hit_count]
      properties:
        id: { type: string, format: uuid, description: 接口 ID }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」） }
        http_method: { type: string, description: HTTP 方法 }
        normalized_path: { type: string, description: 归一化路径模板 }
        application_id:
          type: string
          format: uuid
          nullable: true
          description: 所属站点 ID（未归属时缺省或为 null）
        asset_status:
          type: string
          enum: [DISCOVERED, CONFIRMED, IGNORED, DEPRECATED]
          description: 资产状态
        learning_status:
          type: string
          enum: [NOT_STARTED, LEARNING, PAUSED, LEARNED]
          description: 学习状态
        hit_count: { type: integer, format: int64, description: 累计命中次数 }
        open_findings_count: { type: integer, format: int64, description: 未闭环风险发现数（活动状态 NEW/CONFIRMED/IN_PROGRESS） }

    ApiSecGraphEdge:
      type: object
      description: 调用边（api_call_edges）
      required: [id, caller_fingerprint, target_endpoint_id, call_count, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid, description: 边 ID }
        caller_fingerprint: { type: string, description: 调用方指纹 }
        source_endpoint_id:
          type: string
          format: uuid
          nullable: true
          description: 源接口 ID（可空，外部调用无源接口）
        target_endpoint_id: { type: string, format: uuid, description: 目标接口 ID }
        call_count: { type: integer, format: int64, description: 调用次数 }
        identity_count: { type: integer, format: int64, description: 身份计数（近似下界：每 caller 首见该边计 1，重复经过不累加；迁移 000067） }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    ApiSecGraph:
      type: object
      description: API 调用图谱
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ApiSecGraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/ApiSecGraphEdge' }

    ApiSecTopologyGroup:
      type: object
      description: 按站点分组的接口树节点
      required: [application_name, endpoints]
      properties:
        application_id:
          type: string
          format: uuid
          nullable: true
          description: 站点 ID（未归属组缺省或为 null）
        application_name: { type: string, description: 站点名称（未归属组为「未分组」） }
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/ApiSecGraphNode' }

    ApiSecTopology:
      type: object
      description: API 调用拓扑（站点分组接口树 + 调用边）
      required: [applications, edges]
      properties:
        applications:
          type: array
          items: { $ref: '#/components/schemas/ApiSecTopologyGroup' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/ApiSecGraphEdge' }

    # ---------- 规范导入（apisecurity，51.5） ----------
    ApiSecSpecImportRequest:
      type: object
      description: >-
        两种形式二选一：① 规范文档原文（顶层含 openapi: "3.x" 或 swagger: "2.0" 字段，
        Swagger 2.0 自动转换为 OpenAPI 3）；② 包装形式（顶层无版本声明字段时按包装解析）：
        spec 为文档对象，file_name/name 可选。仅支持 JSON；请求体上限 16MiB。
      properties:
        openapi: { type: string, example: '3.0.3', description: 形式①：OpenAPI 版本声明（须为 3.x） }
        swagger: { type: string, example: '2.0', description: 形式①：Swagger 版本声明（须为 "2.0"） }
        paths: { type: object, description: 形式①：规范 paths 对象（非空） }
        spec: { type: object, description: 形式②：规范文档对象（包装形式时必填） }
        file_name: { type: string, description: 形式②：可选文件名 }
        name: { type: string, description: 形式②：可选规范名称（缺省取文件名/info.title/内容哈希兜底） }

    ApiSecImportSpec:
      type: object
      description: 导入的 API 规范（api_import_specs，同名版本链；列表/详情响应不含 spec_json 大字段）
      required: [id, name, version_no, status, format, file_name, content_hash, endpoint_count, created_at]
      properties:
        id: { type: string, format: uuid, description: 规范版本 ID }
        name: { type: string, description: 规范名称（同名构成版本链） }
        version_no: { type: integer, description: 版本号（同名链内自增） }
        status:
          type: string
          enum: [DRAFT, ACTIVE, HISTORICAL, INVALID, ARCHIVED]
          description: 版本状态（同名唯一 ACTIVE；被新版取代降 HISTORICAL；DRAFT/INVALID/ARCHIVED 为预留）
        parent_id: { type: string, format: uuid, nullable: true, description: 上一版本 ID（首版本为 null） }
        activated_at: { type: string, format: date-time, nullable: true, description: 激活时间（ACTIVE 版本） }
        format:
          type: string
          enum: [openapi3, swagger2]
          description: 规范格式（Swagger 2.0 导入后按 OpenAPI 3 规范化落库）
        file_name: { type: string, description: 文件名（未提供时为空串） }
        content_hash: { type: string, description: 规范化内容哈希（SHA-256，十六进制） }
        spec_json:
          type: object
          description: 规范化后的规范文档（仅导入响应附带；列表/详情不含）
        endpoint_count: { type: integer, description: 解析出的接口数 }
        imported_by:
          type: string
          format: uuid
          nullable: true
          description: 导入人用户 ID（可空）
        created_at: { type: string, format: date-time, description: 导入时间 }

    ApiSecSpecImportResponse:
      type: object
      required: [spec, missing_in_runtime, missing_in_spec, changed, registered_endpoints]
      properties:
        spec: { $ref: '#/components/schemas/ApiSecImportSpec' }
        missing_in_runtime: { type: integer, description: 规范有而运行时无的接口数 }
        missing_in_spec: { type: integer, description: 运行时有而规范无的接口数（潜在 Shadow API） }
        changed: { type: integer, description: 同名跨版本 CHANGED 级变化数（首版本为 0） }
        registered_endpoints: { type: integer, description: 本次幂等登记为候选的规范端点数 }

    ApiSecImportSpecListResponse:
      type: object
      description: 规范分页响应（统一分页结构；items 不含 spec_json）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecImportSpec' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecSpecDiff:
      type: object
      description: 规范与运行时对比差异（api_spec_diffs）
      required: [id, spec_id, diff_type, endpoint_key, detail, created_at]
      properties:
        id: { type: string, format: uuid, description: 差异记录 ID }
        spec_id: { type: string, format: uuid, description: 所属规范 ID }
        diff_type:
          type: string
          enum: [MISSING_IN_RUNTIME, MISSING_IN_SPEC, CHANGED]
          description: 差异类型（规范有而运行时无 / 运行时有而规范无 / 同名跨版本参数、类型或 required 变化）
        endpoint_key: { type: string, description: 接口键（「METHOD 路径」） }
        detail:
          type: object
          description: >-
            差异明细（MISSING_IN_RUNTIME 为 {method, path}；MISSING_IN_SPEC 为 {endpoint_key}；
            CHANGED 为 ApiSecSpecChange 对象）
        created_at: { type: string, format: date-time }

    ApiSecSpecDiffResponse:
      type: object
      required: [spec, diffs]
      properties:
        spec: { $ref: '#/components/schemas/ApiSecImportSpec' }
        diffs:
          type: array
          items: { $ref: '#/components/schemas/ApiSecSpecDiff' }

    # ---------- 风险与运行时（apisecurity，51.6） ----------
    ApiSecFinding:
      type: object
      description: >-
        运行时风险发现（api_runtime_findings）。列表响应仅含基础列；
        subject_type/subject_id/risk_score/risk_level/count/evidence/model_version/policy_version/updated_at
        为 000036 富化物化列，仅详情与处置流转响应返回
      required:
        - id
        - endpoint_key
        - request_id
        - finding_type
        - severity
        - status
        - title
        - detail
        - first_seen_at
        - last_seen_at
        - created_at
      properties:
        id: { type: string, format: uuid, description: 发现 ID }
        endpoint_id:
          type: string
          format: uuid
          nullable: true
          description: 关联接口 ID（接口已删除或未匹配时缺省或为 null）
        endpoint_key: { type: string, description: 关联接口键（LEFT JOIN 带出；未匹配时为空串） }
        request_id: { type: string, description: 首次命中请求 ID（dedup upsert 只保留首次，后续命中仅计数） }
        finding_type:
          type: string
          description: 发现类型（SHADOW / ZOMBIE / DEPRECATED / BOLA / BFLA / SCHEMA_DEVIATION / SENSITIVE_LEAK 等）
        severity:
          type: string
          enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
          description: 严重级别
        status:
          type: string
          enum: [NEW, CONFIRMED, IN_PROGRESS, RESOLVED, FALSE_POSITIVE, IGNORED, ARCHIVED]
          description: 处置状态（七态词表，见迁移 000042；ARCHIVED 为终态）
        title: { type: string, description: 标题 }
        detail: { type: object, description: 首次命中上下文（detector/rule_id 等）；处置后合并 detail.handling 处置记录 }
        subject_type: { type: string, description: 主体类型（如 IDENTITY / IP；无主体信息时为空串） }
        subject_id: { type: string, description: 主体标识（身份指纹或来源指纹，永不落明文） }
        risk_score:
          type: integer
          nullable: true
          description: 风险分（0-100；生产方未评分时缺省或为 null）
        risk_level: { type: string, description: 风险等级词表（与 api_runtime_events risk_level 同源） }
        count: { type: integer, description: 同指纹累计命中次数（dedup 计数） }
        evidence: { type: object, description: 证据（生产方落库时已脱敏：字段名/粗类型词表/约束名） }
        model_version: { type: string, description: 命中时模型版本号 }
        policy_version: { type: string, description: 命中时策略版本号 }
        first_seen_at: { type: string, format: date-time, description: 首次发现时间 }
