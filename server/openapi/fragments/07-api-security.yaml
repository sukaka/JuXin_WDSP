            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSharedDeviceTrendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api-security/object-models:
    get:
      operationId: apiSecObjectModelList
      tags: [api-security]
      summary: 对象模型分页列表
      description: >-
        分页列出对象模型（api_object_models，endpoint × object_segment 一行，BOLA 实体画像，
        由 apiauthz.SweepObjectModelsOnce 扫描 api_runtime_events 按路径占位段 / Query 对象参数
        形态 upsert 产出，迁移 000018/000073），按 last_seen 倒序；观测值只落 SHA-256 示例哈希，
        不落明文。发布状态字段（publishable/required_relation/required_relations/owner_exclusive/
        on_lease_expired）随列表带出；required_relations 仅 ANY_OF 返回，旧 OWNER 省略。
        变更走 PATCH /object-models/{id}。只读接口。
        权限：`api_runtime.read`
      parameters:
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按接口过滤；非法 UUID 返回 400
        - name: object_segment
          in: query
          required: false
          schema: { type: string }
          description: 按对象段键精确匹配（"path:<pos>" / "query:<参数名>"）；空串或缺省不过滤
        - name: identifier_type
          in: query
          required: false
          schema: { type: string, enum: [numeric, uuid, hash, mixed, unknown] }
          description: 按标识形态精确匹配；空串或缺省不过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数归一为 20）
      responses:
        '200':
          description: 分页对象模型列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecObjectModelListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/object-models/{id}:
    patch:
      operationId: apiSecObjectModelPatch
      tags: [api-security]
      summary: 对象模型发布状态管理
      description: >-
        变更对象模型发布状态：publishable（发布资格）/ required_relation（OWNER|ANY_OF）/
        required_relations（ANY_OF 必填，去重并规范化为 [OWNER,SHARED_WITH]）/
        owner_exclusive（排他所有权）/ on_lease_expired（strict|degraded，缺省 strict）。
        全部字段三分态（缺省不变更）；OWNER 模型不带非空 required_relations；
        ANY_OF 的 required_relation 与 required_relations 必须同请求变更，词表外取值 400；
        publishable=true 时 owner_exclusive 必须同批为 true，ANY_OF/PROTECT 既有资格不放松；
        行不存在 404；写操作审计（高风险——发布状态变更属授权事实管理）。
        权限：`api_authorization.manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 对象模型行 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecObjectModelPatchRequest' }
      responses:
        '200':
          description: 变更后的对象模型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecObjectModel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

