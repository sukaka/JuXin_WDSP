              schema: { $ref: '#/components/schemas/ApiSecParameterConfirmBatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/models/{id}/parameter-relations:
    get:
      operationId: apiSecParameterRelationList
      tags: [api-security]
      summary: 参数条件关系候选列表
      description: >-
        列出该模型版本的参数条件关系（api_parameter_relations），按 relation_type、confidence 降序。
        CO_OCCURS 共现候选由统计画像周期任务对同版本内样本量达标（≥10）的参数对生成；
        REQUIRES/MUTEX 关系可手工新建。只有 confirmed 的关系经发布通道下发网关进入强制检测（迁移 000068）。
        权限：`api_parameter.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 模型版本 ID
      responses:
        '200':
          description: 参数关系候选列表（data 为 {items}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecParameterRelationListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecParameterRelationCreate
      tags: [api-security]
      summary: 手工新建参数条件关系（REQUIRES/MUTEX）
      description: >-
        在同一模型版本的两个参数间手工新建 REQUIRES（A 存在则 B 必须存在）或 MUTEX（A 与 B 互斥）关系。
        新建为候选（confirmed=false），需经 confirm 确认后才下发网关参与强制检测。
        权限：`api_parameter.edit`；操作审计留痕。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 模型版本 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_parameter_id, target_parameter_id, relation_type]
              properties:
                source_parameter_id: { type: string, format: uuid, description: 源参数 ID（A） }
                target_parameter_id: { type: string, format: uuid, description: 目标参数 ID（B） }
                relation_type: { type: string, enum: [REQUIRES, MUTEX, EQUALS, NOT_EQUALS, GREATER_THAN, LESS_THAN, TIME_BEFORE, TIME_AFTER, COUNT_MATCHES, SUM_MATCHES], description: 关系类型（手工新建词表；CO_OCCURS 由统计候选产生不开放手工新建；COUNT_MATCHES 数量一致=A 整数须等于 B 数组长度，SUM_MATCHES 汇总=A 数值须等于 B 数组元素数值和，B 均须为 BODY 数组路径） }
      responses:
        '200':
          description: 创建成功（data 为 {relation, message}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecParameterRelationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/parameter-relations/{id}/confirm:
    post:
      operationId: apiSecParameterRelationConfirm
      tags: [api-security]
      summary: 确认参数条件关系
      description: >-
        将候选关系确认为 confirmed——确认后随下一次整站发布下发网关进入强制检测
        （REQUIRES/MUTEX 违例在 PROTECT 模式阻断、OBSERVE 模式仅观察）。
        重复确认返回 409。权限：`api_parameter.edit`；操作审计留痕。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 参数关系 ID
      responses:
        '200':
          description: 确认成功（data 为 {relation, message}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecParameterRelationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/parameter-relations/{id}/reject:
    post:
      operationId: apiSecParameterRelationReject
      tags: [api-security]
      summary: 撤回参数条件关系确认
      description: >-
        将已确认关系撤回为候选（不删除行；CO_OCCURS 候选删除会被周期任务重新生成）。
        撤回后下一次发布不再下发该关系。未确认的关系撤回返回 409。
        权限：`api_parameter.edit`；操作审计留痕。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 参数关系 ID
      responses:
        '200':
          description: 撤回成功（data 为 {relation, message}）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecParameterRelationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 运行时策略版本（apimodels，P0-03/P0-21 补全） ====================
  # 状态机：模型 Confirm(→FORMAL) 事务内编译产生 DRAFT；Activate 后 VALIDATED（待发布）；
  # 整站发布成功 → ACTIVE（同端点旧 ACTIVE 退为 ROLLED_BACK，作「已知良好版本」供回滚溯源）；
  # 发布失败 → FAILED（error 记录失败原因）；PUBLISHED 为预留中间态。
  /api-security/runtime-policies:
    get:
      operationId: apiSecRuntimePolicyList
      tags: [api-security]
      summary: 运行时策略版本分页列表
      description: >-
        分页列出端点级运行时策略版本（api_runtime_policies，模型确认后经 Compiler 编译产生），
        按创建时间倒序；endpoint_id 非法 UUID 返回 400，status 非白名单取值返回 400。
        权限：`api_model.read`
      parameters:
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按接口过滤
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, VALIDATED, PUBLISHED, ACTIVE, ROLLED_BACK, FAILED] }
          description: 策略状态过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页运行时策略列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRuntimePolicyListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 运行时策略存储未配置（错误码 INTERNAL_ERROR）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api-security/models/{id}/runtime:
    get:
      operationId: apiSecModelRuntimePolicyList
      tags: [api-security]
      summary: 模型版本 → 运行时策略溯源
      description: >-
        列出由该模型版本编译产生的全部运行时策略（source_model_version_id 反查），
        按创建时间倒序；用于回答「该模型版本编译出了哪些端点策略」。
        权限：`api_model.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 模型版本 ID
      responses:
        '200':
          description: 该模型版本编译产生的策略列表（data 为 {items}，不分页）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecModelRuntimePolicyListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 运行时策略存储未配置（错误码 INTERNAL_ERROR）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api-security/runtime-policies/{id}/rollback:
    post:
      operationId: apiSecRuntimePolicyRollback
      tags: [api-security]
      summary: 回滚端点运行时策略
      description: >-
        将端点回退到上一已知良好版本：仅 ACTIVE 或 FAILED 状态的策略允许回滚（否则 409）；
        取同端点最近一次曾生效后退出的策略（ROLLED_BACK 且 activated_at 非空）克隆其编译内容
        创建新 DRAFT（content_hash 与良好版本一致），随后重触发整站发布，发布成功后经
        发布结果回写落 ACTIVE。无上一已知良好版本返回 409。无请求体。写操作审计（高风险）。
        权限：`api_model.activate`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 运行时策略 ID
      responses:
        '200':
          description: 回滚创建的新 DRAFT 策略与发布任务摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecRuntimePolicyRollbackResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 无上一已知良好版本，或策略状态不允许回滚（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 运行时策略存储或发布通道未配置（错误码 INTERNAL_ERROR）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ==================== 用途分类 / 调用图谱（apisecurity，任务书 51.4） ====================
  /api-security/classifications:
    get:
      operationId: apiSecClassificationList
      tags: [api-security]
      summary: 分类法列表
      description: >-
        内置分类（api_classifications）与自定义分类法（api_custom_taxonomies）分组合并返回。
        权限：`api_classification.read`
      responses:
        '200':
          description: 内置与自定义分类法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecClassificationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecClassificationCreate
      tags: [api-security]
      summary: 新增自定义分类法条目
      description: >-
        新增自定义分类法条目（api_custom_taxonomies）；同 (dimension, value) 已存在时返回 409。
        写操作审计。权限：`api_classification.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecClassificationCreateRequest' }
      responses:
        '200':
          description: 自定义分类法条目已创建（data 即条目对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecCustomTaxonomy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 该维度下分类值已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/classification:
    put:
      operationId: apiSecEndpointClassificationPut
      tags: [api-security]
      summary: 手动设置接口分类
      description: >-
        手动覆盖接口分类维度（逐维 upsert，source=MANUAL、confidence=1）并锁定
        classification_locked，防止自动分类覆盖。dimensions 不能为空且 dimension 不可重复。写操作审计。
        权限：`api_classification.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecEndpointClassificationRequest' }
      responses:
        '200':
          description: 分类已设置（返回锁定标记与当前分类维度）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointClassificationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/graph:
    get:
      operationId: apiSecGraphGet
      tags: [api-security]
      summary: API 调用图谱
      description: >-
        返回全量接口节点与调用边（节点为接口摘要并附 open_findings_count 未闭环风险计数，
        边为 api_call_edges 调用关系——由 aggregations RunCallEdges 分钟级水位增量派生，按 call_count 倒序）。
        start/end/min_count 过滤仅作用于边，节点始终全量返回；非法取值返回 400。
        权限：`api_graph.read`
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: 边活跃窗口下界（RFC3339；last_seen_at 不早于 start；不能晚于 end）
        - name: end
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: 边活跃窗口上界（RFC3339；first_seen_at 不晚于 end）
        - name: min_count
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: 最小调用次数过滤（call_count >= min_count；需非负整数）
      responses:
        '200':
          description: 调用图谱（nodes + edges）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecGraph' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/topology:
    get:
      operationId: apiSecTopologyGet
      tags: [api-security]
      summary: API 拓扑视图
      description: >-
        接口按站点（应用）分组的拓扑视图（未归属接口归入「未分组」组，节点附 open_findings_count
        未闭环风险计数），附调用边。start/end/min_count 过滤仅作用于边（语义同 /graph），节点始终全量返回。
        权限：`api_graph.read`
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: 边活跃窗口下界（RFC3339；last_seen_at 不早于 start；不能晚于 end）
        - name: end
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: 边活跃窗口上界（RFC3339；first_seen_at 不晚于 end）
        - name: min_count
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: 最小调用次数过滤（call_count >= min_count；需非负整数）
      responses:
        '200':
          description: 拓扑视图（applications + edges）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecTopology' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 规范导入（apisecurity，任务书 51.5） ====================
  /api-security/specs/import:
    post:
      operationId: apiSecSpecImport
      tags: [api-security]
      summary: 导入 OpenAPI 规范
      description: >-
        导入 OpenAPI 3.x / Swagger 2.0 JSON 文档（Swagger 2.0 自动转换）并与运行时接口对比
        生成差异记录（api_spec_diffs，含 MISSING_* 与同名跨版本 CHANGED 两类）。
        请求体两种形式（均为 application/json，上限 16MiB）：
        ① 规范文档原文（含 `openapi: "3.x"` 或 `swagger: "2.0"` 字段）；
        ② 包装形式 `{"spec": {...}, "file_name": "...", "name": "..."}`。
        同名再导入 version_no 自增、旧 ACTIVE 降 HISTORICAL；规范端点幂等登记为候选。
        仅支持 JSON，YAML/非 JSON 输入返回 400；缺少版本声明或有效 paths 亦返回 400；
        同名最新版本内容未变化返回 409。
        写操作审计。权限：`api_spec.import`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecSpecImportRequest' }
      responses:
        '200':
          description: 导入结果（含双向差异计数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSpecImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 同名规范最新版本内容未变化（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/specs/import-url:
    post:
      operationId: apiSecSpecImportUrl
      tags: [api-security]
      summary: 从 URL 导入 OpenAPI 规范
      description: >-
        从给定 URL 拉取规范文档（OpenAPI 3.x / Swagger 2.0，仅 JSON）并导入，
        导入语义与粘贴导入一致（同名再导入 version_no 自增、旧 ACTIVE 降 HISTORICAL、
        生成 MISSING_* 与 CHANGED 差异、规范端点幂等登记为候选）。
        SSRF 防护：仅 http/https、拒绝内网/保留地址、大小上限 16MiB、超时 10s、重定向再校验；
        URL 被防护拒绝返回 400，拉取失败返回 502；同名最新版本内容未变化返回 409。
        写操作审计。权限：`api_spec.import`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecSpecImportUrlRequest' }
      responses:
        '200':
          description: 导入结果（含双向差异计数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSpecImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 同名规范最新版本内容未变化（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: 拉取规范文档失败（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api-security/specs:
    get:
      operationId: apiSecSpecList
      tags: [api-security]
      summary: 已导入规范分页列表
      description: >-
        分页列出已导入的 API 规范（同名版本链全部版本，按 created_at 倒序，不含 spec_json 大字段）。
        status 自动转大写且非白名单返回 400。权限：`api_spec.read`
      parameters:
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: 按规范名称过滤
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, ACTIVE, HISTORICAL, INVALID, ARCHIVED] }
          description: 按版本状态过滤（自动转大写）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页规范列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecImportSpecListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/specs/{id}/diff:
    get:
      operationId: apiSecSpecDiffGet
      tags: [api-security]
      summary: 规范差异明细
      description: >-
        返回指定导入规范的元信息及其与运行时接口的全部差异明细
        （非分页，按 diff_type、endpoint_key 排序）。权限：`api_spec.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 规范 ID
      responses:
        '200':
          description: 规范与差异明细
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSpecDiffResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/specs/{id}/audit:
    get:
      operationId: apiSecSpecAuditGet
      tags: [api-security]
      summary: 规范声明与鉴权安全审计
      description: >-
        按需读取指定规范的 spec_json，复用安全解析后只读执行八类确定性规则：
        PATH_PARAMETER_MISSING（HIGH，路径占位缺少 PATH 参数）、
        PATH_PARAMETER_NOT_REQUIRED（MEDIUM，PATH 参数 required 非 true）、
        PATH_PARAMETER_UNDECLARED（MEDIUM，PATH 参数不在路径占位中）、
        SENSITIVE_QUERY_PARAMETER（HIGH，GET/DELETE 的 QUERY 参数名为保守敏感词，
        匹配前忽略大小写及下划线、连字符、点、空白等分隔）、
        SUCCESS_RESPONSE_MISSING（HIGH，响应声明语义可判定时没有任何 2xx 或 2XX 声明）、
        ERROR_RESPONSE_MISSING（MEDIUM，响应声明语义可判定时没有 default、4xx/4XX 或 5xx/5XX 声明）、
        SECURITY_SCHEME_UNDEFINED（HIGH，操作有效安全要求引用不存在的 components.securitySchemes 方案名）、
        API_KEY_IN_QUERY（HIGH，操作实际引用的 apiKey 方案定义为 in=query）。
        操作未声明 security 时继承全局 security，显式 security: [] 表示公开并覆盖全局声明；
        公开、未配置 security 及未被操作引用的方案不产生鉴权发现。鉴权规则仅适用于认证目录可判定的 OpenAPI 3；
        Swagger 最小转换、Postman、GraphQL、JSON Schema 等目录未知或不适用的格式跳过两类规则，不把缺 components 当作空目录。
        响应规则仅适用于可解析 responses 对象的 OpenAPI/Swagger 操作；responses 缺失或类型不支持时语义未知，
        不产生响应规则发现，显式空对象则视为已解析但没有响应。default 仅计为错误响应，不属于明确成功响应；
        204/205 等空响应及缺少 schema/content 不影响状态声明判定，不读取实际运行时状态。
        结果按 endpoint_key、rule_id、param_name 稳定排序；issue_count/high_count/medium_count
        统计完整发现集，items 最多 500 条，truncated 表示是否有超出。
        仅返回参数名或认证方案名与定位元数据；响应规则发现的 param_in/param_name 为空字符串，
        SECURITY_SCHEME_UNDEFINED 的 param_name 为方案名且 param_in 为空，API_KEY_IN_QUERY 的 param_name 为方案名且 param_in 为 QUERY；
        不返回参数值、API Key 值或完整规范。权限：`api_spec.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 规范 ID
      responses:
        '200':
          description: 规范声明审计结果（无问题时 items 为空数组）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSpecAuditResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/specs/{id}/version-diff:
    get:
      operationId: apiSecSpecVersionDiff
      tags: [api-security]
      summary: 规范跨版本对比
      description: >-
        任意两个规范版本的 CHANGED 级对比（端点增删、参数增删、类型与 required 变化）：
        路径 id 为基准旧版，查询参数 other 为目标新版；只读计算不落库。
        两个版本 ID 相同返回 400。权限：`api_spec.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 基准（旧版）规范 ID
        - name: other
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: 目标（新版）规范 ID
      responses:
        '200':
          description: 跨版本变化明细（无变化时 changes 为空数组）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSpecVersionDiffResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/specs/{id}/activate:
    post:
      operationId: apiSecSpecActivate
      tags: [api-security]
      summary: 激活规范版本
      description: >-
        激活指定规范版本：同名当前 ACTIVE 版本降为 HISTORICAL，目标版本置 ACTIVE
        （同名唯一生效，部分唯一索引保证）。目标版本已是 ACTIVE 返回 409。无请求体。
        写操作审计。权限：`api_spec.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 待激活的规范版本 ID
      responses:
        '200':
          description: 激活后的规范版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSpecActivateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 该版本已是 ACTIVE（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 风险与运行时（apisecurity，任务书 51.6） ====================
  /api-security/findings:
    get:
      operationId: apiSecFindingList
      tags: [api-security]
      summary: 风险发现分页列表
      description: >-
        分页列出运行时风险发现（Shadow/Zombie/越权/Schema 偏离/敏感泄露等），按 last_seen_at 倒序；
        severity 与 status 自动转大写。权限：`api_runtime.read`
      parameters:
        - name: finding_type
          in: query
          required: false
          schema: { type: string }
          description: 发现类型（如 SHADOW / ZOMBIE / DEPRECATED / BOLA / BFLA / SCHEMA_DEVIATION / SENSITIVE_LEAK）
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL] }
          description: 严重级别过滤（自动转大写）
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [NEW, CONFIRMED, IN_PROGRESS, RESOLVED, FALSE_POSITIVE, IGNORED, ARCHIVED] }
          description: 处置状态过滤（自动转大写；七态词表见迁移 000042）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页风险发现列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFindingListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/findings/summary:
    get:
      operationId: apiSecFindingSummary
      tags: [api-security]
      summary: 风险发现降噪聚合汇总
      description: >-
        风险中心降噪聚合三视图（data 即汇总对象本身）：by_subject（主体）/ by_endpoint（端点）/
        by_finding_type（类型），各桶含 count（dedup 去重后条目数）、hits（累计命中次数）、
        max_severity（桶内最高严重度）、last_seen_at；各视图按最高严重度+累计命中排序取头部 100 桶。
        权限：`api_risk.read`
      responses:
        '200':
          description: 风险发现三视图聚合
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFindingSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 风险中心未装配（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api-security/findings/{id}:
    get:
      operationId: apiSecFindingDetail
      tags: [api-security]
      summary: 风险发现详情
      description: >-
        风险发现详情（api_runtime_findings 全列视图，含 000036 物化列：主体/风险分/证据/模型与策略版本）。
        evidence 为生产方落库时已脱敏的证据（字段名/粗类型词表/约束名），原样返回不再二次处理；
        related_request_ids 为同端点（IDENTITY 主体附带身份指纹）近期运行时事件的 request_id
        （occurred_at 倒序，最多 20 条）——dedup upsert 只保留首次 request_id，故为近似关联，
        非精确命中回放。权限：`api_risk.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 风险发现 ID
      responses:
        '200':
          description: 风险发现详情与关联请求
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecFindingDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: 风险中心未装配（错误码 SERVICE_UNAVAILABLE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------- 风险发现处置（七态状态机由服务端强制，见迁移 000042；非法迁移返回 400） ----------
  # confirm 确认风险成立（NEW → CONFIRMED）；start 开始处置（CONFIRMED → IN_PROGRESS）；
  # resolve 标记已解决（CONFIRMED/IN_PROGRESS → RESOLVED，resolution 必填）；
  # false-positive 标记误报（NEW/CONFIRMED/IN_PROGRESS → FALSE_POSITIVE，reason 必填）；
  # ignore 忽略/接受风险（NEW/CONFIRMED/IN_PROGRESS → IGNORED）；
  # archive 归档关闭（RESOLVED/FALSE_POSITIVE/IGNORED → ARCHIVED，终态）。
  # 处置记录（action/actor/note/at）落 detail.handling，与首次命中上下文共存。
  /api-security/findings/{id}/confirm:
    post:
      operationId: apiSecFindingConfirm
      tags: [api-security]
      summary: 确认风险发现
      description: >-
        确认风险成立（NEW → CONFIRMED）；当前状态不允许该操作时返回 400。
        请求体可空（仅备注，≤512 字符）。写操作审计。权限：`api_risk.handle`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 风险发现 ID
      requestBody:
        required: false
        content:
          application/json:
