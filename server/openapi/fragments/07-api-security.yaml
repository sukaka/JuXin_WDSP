  # ==================== 敏感数据管理面（apidata，P0-19 补全） ====================
  /api-security/sensitive-types:
    get:
      operationId: apiSecSensitiveTypeList
      tags: [api-security]
      summary: 敏感数据类型分页列表
      description: >-
        分页列出敏感数据类型（api_sensitive_data_types，含内置与自定义），按创建时间排序返回；
        status/level 自动转大写，非白名单取值返回 400；keyword 按名称子串过滤。
        权限：`api_data.read`
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [ENABLED, DISABLED] }
          description: 状态过滤（自动转大写）
        - name: level
          in: query
          required: false
          schema: { type: string, enum: [NON_SENSITIVE, GENERAL, SENSITIVE, IMPORTANT, CORE] }
          description: 五级敏感等级过滤（自动转大写）
        - name: category
          in: query
          required: false
          schema: { type: string }
          description: 分类过滤（如 个人身份/金融账户，自定义词）
        - name: keyword
          in: query
          required: false
          schema: { type: string }
          description: 名称子串过滤
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页敏感数据类型列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecSensitiveTypeCreate
      tags: [api-security]
      summary: 新增敏感数据类型
      description: >-
        新增敏感数据类型：name 与 data_type 必填（data_type 为与网关证据标签对齐的键），
        level 缺省 GENERAL、status 缺省 ENABLED；regex 需可编译，validator 仅支持空或 luhn，
        locations 取值白名单 query/json/form/xml/header/cookie/path/response_body/file（小写归一）。
        同名返回 409。写操作审计。权限：`api_data.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeRequest' }
      responses:
        '200':
          description: 创建成功的类型（data 即类型对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveDataType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 类型名称已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/sensitive-types/export:
    get:
      operationId: apiSecSensitiveTypeExport
      tags: [api-security]
      summary: 导出敏感数据类型
      description: >-
        导出全量类型（内置 + 自定义）为 JSON 文档（format=jiuzhang-api-sensitive-data-types），
        与导入格式对称可回灌。权限：`api_data.read`
      responses:
        '200':
          description: 类型导出文档（data 即导出对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeExportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/sensitive-types/import:
    post:
      operationId: apiSecSensitiveTypeImport
      tags: [api-security]
      summary: 导入敏感数据类型
      description: >-
        批量导入类型（与导出格式对称）：按 name upsert——存在则更新（version+1，内置身份保持），
        不存在则创建；条目的 id/version/is_builtin/时间戳一律忽略，由服务端重新授予。
        单次最多 500 条；全量校验通过后单事务应用（任一条非法整体 400，不产生部分写入）。
        写操作审计。权限：`api_data.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeImportRequest' }
      responses:
        '200':
          description: 导入结果（新建/更新计数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/sensitive-types/{id}:
    get:
      operationId: apiSecSensitiveTypeGet
      tags: [api-security]
      summary: 敏感数据类型详情
      description: 按 ID 读取敏感数据类型。权限：`api_data.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 类型 ID
      responses:
        '200':
          description: 类型详情（data 即类型对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveDataType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: apiSecSensitiveTypeUpdate
      tags: [api-security]
      summary: 编辑敏感数据类型
      description: >-
        部分更新（仅更新请求中出现的字段），编辑后 version 自增；
        内置类型（is_builtin）名称不可修改（与网关证据标签对齐键），其余字段可改；
        status 取 ENABLED/DISABLED 即启用/禁用。同名冲突返回 409。写操作审计。
        权限：`api_data.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 类型 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecSensitiveTypeUpdateRequest' }
      responses:
        '200':
          description: 更新后的类型（data 即类型对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSensitiveDataType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 类型名称已存在（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecSensitiveTypeDelete
      tags: [api-security]
      summary: 删除敏感数据类型
      description: >-
        删除敏感数据类型；内置类型（is_builtin，与网关词表对齐的基线）禁止删除，返回 400。
        写操作审计。权限：`api_data.manage`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 类型 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/masking-rules:
    get:
      operationId: apiSecMaskingRuleList
      tags: [api-security]
      summary: 脱敏规则分页列表
      description: >-
        分页列出响应脱敏规则（api_masking_rules，随发布通道下发网关执行 MASK/HASH/REMOVE/ENCRYPT/MAP），
        按创建时间倒序；scope 自动转大写且非白名单返回 400；application_id 非法 UUID、
        enabled 非布尔取值均返回 400。权限：`api_data.read`
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [GLOBAL, APPLICATION, ENDPOINT] }
          description: 作用域过滤（自动转大写）
        - name: application_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按站点（应用）过滤
        - name: endpoint_key
          in: query
          required: false
          schema: { type: string }
          description: 按接口键精确匹配（「METHOD 路径模板」）
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
          description: 按启用状态过滤（true/false）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页脱敏规则列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecMaskingRuleListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecMaskingRuleCreate
      tags: [api-security]
      summary: 新增脱敏规则
      description: >-
        新增脱敏规则：name 必填；enabled 缺省 true、scope 缺省 GLOBAL、algorithm 缺省 MASK；
        field_path 与 data_type 至少设置其一；作用域一致性校验（APPLICATION 必须带 application_id、
        ENDPOINT 必须带 endpoint_key、GLOBAL 两者均不允许）；exclusions_json 仅支持
        identity/role/ip 键（ip 项须为合法 IP 或 CIDR）。写操作审计。权限：`api_data.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecMaskingRuleRequest' }
      responses:
        '200':
          description: 创建成功的规则（data 即规则对象本身）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecMaskingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/masking-rules/decrypt:
    post:
      operationId: apiSecMaskingRuleDecrypt
      tags: [api-security]
      summary: 还原 ENCRYPT 脱敏密文
      description: >-
        校验 enc_<kid>_<base64> 密文格式及当前 kid，使用运行时脱敏密钥执行 AES-256-GCM 解密。
        kid 不符、格式或解密失败返回 400 且不泄露内部原因；密钥未配置或不可用返回 503。
        成功记录 HIGH 审计，审计不包含 plaintext、ciphertext 或密钥。权限：`api_data.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecMaskDecryptRequest' }
      responses:
        '200':
          description: 解密成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecMaskDecryptResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

