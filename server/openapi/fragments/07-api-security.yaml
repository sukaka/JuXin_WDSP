  /api-security/identity-profiles/detail:
    get:
      operationId: apiSecIdentityProfileDetail
      tags: [api-security]
      summary: 身份画像详情（含五级风险评估）
      description: >-
        按「身份指纹 × 端点」返回画像详情：画像行 + 风险评估 + 该指纹最近 10 条运行时事件（data 即详情对象本身）。
        风险评估映射 GB/T 31509 修订稿（5.2.3 威胁频率识别 / 5.3.3 定性矩阵法）：
        可能性（likelihood）= 高危事件（risk_level HIGH/CRITICAL）分档，近 24h 密集（≥20 事件）上调一档、
        威胁全数被拦截（BLOCK/TEMP_BLOCK，安全措施有效证据，5.2.4）下调一档；
        严重程度（severity）= 历史最高单事件风险分（0-100）五档；
        可能性 × 严重程度经 5×5 矩阵定级 VERY_LOW/LOW/MEDIUM/HIGH/VERY_HIGH。
        指标全部来自 api_runtime_events 真实计数，只产信号不阻断。推导规则见
        server/internal/apisecurity/identity.go。权限：`api_runtime.read`
      parameters:
        - name: identity_fingerprint
          in: query
          required: true
          schema: { type: string }
          description: 身份指纹（精确匹配，必填）
        - name: endpoint_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID（画像按指纹 × 端点定位，必填；非法 UUID 返回 400）
      responses:
        '200':
          description: 身份画像详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecIdentityProfileDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

