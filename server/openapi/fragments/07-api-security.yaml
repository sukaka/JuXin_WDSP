            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAIOpsTaskTypeListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/ai-ops/schedules:
    get:
      operationId: apiSecAIOpsScheduleList
      tags: [api-security]
      summary: AI 运营计划分页列表
