# 07-api-security.yaml — API 动态防护域（/api-security 命名空间，阶段8/WDSP 核心 + P0/P1 补全）
# 路由源：server/internal/apiassets/handler.go（19 条）、server/internal/apimodels/handler.go（19 条，含运行时策略版本 3 条与响应 Schema 学习查询 1 条）、
#         server/internal/apisecurity/routes.go（34 条，含风险中心 findings summary/详情/六个处置动作，
#         七态状态机见迁移 000042，权限点 api_risk.read/api_risk.handle；含 W9-P101 态势补齐 posture/overview 与 posture/trends）、
#         server/internal/apiweakness/routes.go（8 条）、
#         server/internal/apidata/handler.go（13 条）、
#         server/internal/apifiles/handler.go（2 条，文件资产明细/统计，迁移 000061，权限点 api_data.read）、
#         server/internal/apigeo/handler.go（1 条，数据出境看板+明细分页单端点，权限点 api_data.read）、
#         server/internal/apiops/routes.go（11 条，AI 定时运营任务：类型词表/计划 CRUD/启停/立即执行/执行记录，
#         迁移 000062/000063，权限点 api_ai.read/api_ai.execute）、
#         server/internal/apiscan/routes.go（17 条，主动扫描 v1：目标/授权/任务/发现/复测，迁移 000053/000054/000056）。
# 响应约定：所有成功响应外层为统一信封 {code, message, data, request_id}
# （见 server/internal/response/response.go Body）；本片段 200 响应的 schema 描述的是 data 载荷本身。
# 分页载荷统一为 {items, page, page_size, total}（response.PageData）。
# 错误响应引用最终骨架提供的公共 components（BadRequest/Unauthorized/Forbidden/NotFound/InternalError/Error）。
# 认证：全部路由位于会话认证链之后（含 CSRF 校验），权限点在路由层强制校验（middleware.RequirePermission）。

paths:
  # ==================== API 接口资产（apiassets，任务书 51.1） ====================
  /api-security/endpoints:
    get:
      operationId: apiSecEndpointList
      tags: [api-security]
      summary: API 接口分页列表
      description: >-
        分页列出网关运行时发现的 API 接口，按 last_seen_at 倒序。
        支持资产状态/学习状态/路径关键字/站点/目录前缀/未归属/业务类型过滤；
        asset_status 与 learning_status 自动转大写，非白名单取值按无匹配处理（不报错）。
        权限：`api_asset.read`
      parameters:
        - name: asset_status
          in: query
          required: false
          schema: { type: string, enum: [DISCOVERED, CONFIRMED, IGNORED, DEPRECATED] }
          description: 资产状态过滤（自动转大写）
        - name: learning_status
          in: query
          required: false
          schema: { type: string, enum: [NOT_STARTED, LEARNING, PAUSED, LEARNED] }
          description: 学习状态过滤（自动转大写）
        - name: keyword
          in: query
          required: false
          schema: { type: string }
          description: 路径关键字（normalized_path 模糊匹配）
        - name: application_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 按站点（应用）过滤；非法 UUID 返回 400
        - name: unassigned
          in: query
          required: false
          schema: { type: boolean }
          description: 为 true 时仅查未归属接口（application_id 为空）
        - name: directory_path
          in: query
          required: false
          schema: { type: string }
          description: 目录前缀过滤（含子目录，如 /test 命中 /test 与 /test/php）
        - name: business_type
          in: query
          required: false
          schema: { type: string, enum: [LOGIN, REGISTER, PASSWORD_RESET, SMS, EMAIL, ORDER, PAYMENT, EXPORT, DOWNLOAD, SEARCH, QUERY_PERSONAL_DATA, AI_INFERENCE, OTHER] }
          description: 业务类型过滤（api_assets.business_type，自动转大写；无资产记录接口按 OTHER 计；非法值返回 400）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数或大于 100 时归一为 20）
      responses:
        '200':
          description: 分页接口列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/site-summary:
    get:
      operationId: apiSecEndpointSiteSummary
      tags: [api-security]
      summary: 站点接口计数汇总
      description: >-
        返回各站点（应用）的接口计数与未归属接口计数，供接口资产站点列表角标使用。
        权限：`api_asset.read`
      responses:
        '200':
          description: 站点计数列表与未归属计数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSiteSummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/directory-tree:
    get:
      operationId: apiSecEndpointDirectoryTree
      tags: [api-security]
      summary: 目录聚合接口计数
      description: >-
        按目录（normalized_path 去掉最后一段）聚合接口计数，扁平列表返回，由前端组装目录层级。
        传 application_id 限定站点；unassigned=true 统计未归属接口；两者都不传统计全部。
        权限：`api_asset.read`
      parameters:
        - name: application_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 指定站点；非法 UUID 返回 400
        - name: unassigned
          in: query
          required: false
          schema: { type: boolean }
          description: 为 true 时仅统计未归属接口
      responses:
        '200':
          description: 目录计数扁平列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecDirectoryTreeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/confirm:
    post:
      operationId: apiSecEndpointConfirmBatch
      tags: [api-security]
      summary: 批量确认接口资产
      description: >-
        批量将接口确认为资产（asset_status=CONFIRMED 并记录 confirmed_at），单次最多 100 个；
        逐项处理，不存在的接口计入 failed 列表，其余照常确认。写操作审计。
        权限：`api_asset.confirm`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecEndpointConfirmRequest' }
      responses:
        '200':
          description: 批量确认结果（含逐项失败明细）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointConfirmResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}:
    get:
      operationId: apiSecEndpointGet
      tags: [api-security]
      summary: API 接口详情
      description: >-
        返回接口详情，附带 api_assets 业务维度扩展（asset 字段，无记录时缺省）。
        权限：`api_asset.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      responses:
        '200':
          description: 接口详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: apiSecEndpointUpdate
      tags: [api-security]
      summary: 更新接口资产信息
      description: >-
        全量替换接口的业务维度扩展（api_assets 的 purpose/exposure/owner/tags/business_type）；
        至少提交一个字段，未提交的字段按空值覆盖（exposure 空值归一为 INTERNAL，
        business_type 空值归一为 OTHER 且枚举校验，tags 空值归一空数组）。
        写操作审计。权限：`api_asset.edit`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecEndpointUpdateRequest' }
      responses:
        '200':
          description: 资产信息已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointMutateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/traffic-trend:
    get:
      operationId: apiSecEndpointTrafficTrend
      tags: [api-security]
      summary: 接口访问趋势波形图
      description: >-
        单个 API 接口的访问趋势：5 分钟桶（UTC 对齐）请求计数，服务端补零——
        从 range 起点到当前时刻输出连续时间升序点列，无数据桶 count=0；total 为窗口内请求总量。
        range 缺省 24h，非法值按 24h 处理。数据来自采集链路全量流量计数
        （api_endpoint_traffic_buckets，留存 7 天，聚合小时任务清理）。接口不存在返回 404。
        权限：`api_asset.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [1h, 24h, 7d], default: 24h }
          description: 统计窗口（缺省或非法值取 24h）
      responses:
        '200':
          description: 接口访问趋势（统一信封 data 层）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecTrafficTrend' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/merge:
    post:
      operationId: apiSecEndpointMerge
      tags: [api-security]
      summary: 合并接口
      description: >-
        将 other_id 接口并入当前接口：命中数累加、last_seen_at 取较大者、other 的历史接口键归档进
        api_endpoint_aliases 后删除 other，并写生命周期事件 MERGED（事务）。不能合并到自身。写操作审计。
        权限：`api_asset.merge`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 合并后保留的接口 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecEndpointMergeRequest' }
      responses:
        '200':
          description: 接口已合并（返回合并后的接口）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointMutateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/split:
    post:
      operationId: apiSecEndpointSplit
      tags: [api-security]
      summary: 拆分接口
      description: >-
        按给定路径从当前接口拆分出新接口：路径自动归一化，新接口继承
        站点/方法/协议/置信度等身份属性，asset_status=DISCOVERED；原接口写生命周期事件 SPLIT（事务）。
        单次最多 50 个路径；目标路径与现有接口键冲突时整体失败返回 409。写操作审计。
        权限：`api_asset.split`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 待拆分的接口 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecEndpointSplitRequest' }
      responses:
        '200':
          description: 接口已拆分（返回新创建的接口列表）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointSplitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 拆分目标路径与现有接口冲突（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/ignore:
    post:
      operationId: apiSecEndpointIgnore
      tags: [api-security]
      summary: 忽略接口
      description: >-
        将接口资产状态置为 IGNORED 并写生命周期事件。无请求体。写操作审计。
        权限：`api_asset.ignore`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      responses:
        '200':
          description: 接口已忽略
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointMutateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/classify:
    post:
      operationId: apiSecEndpointClassify
      tags: [api-security]
      summary: 自动分类接口
      description: >-
        按路径/方法启发式自动分类，写入分类维度（PURPOSE/EXPOSURE/ACCESS，source=AUTO，按维度 upsert）。
        接口分类已锁定（classification_locked=true）时返回 409。无请求体。写操作审计。
        权限：`api_asset.edit`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      responses:
        '200':
          description: 自动分类完成（返回写入的分类维度）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointClassifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 分类已锁定，需先解锁再执行自动分类（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/deprecate:
    post:
      operationId: apiSecEndpointDeprecate
      tags: [api-security]
      summary: 下线接口
      description: >-
        人工下线：接口资产状态 DISCOVERED/CONFIRMED → DEPRECATED，并写生命周期事件。
        当前状态不允许该流转时返回 409。无请求体。写操作审计。
        权限：`api_asset.edit`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      responses:
        '200':
          description: 接口已标记下线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointMutateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前资产状态不允许下线流转（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/restore:
    post:
      operationId: apiSecEndpointRestore
      tags: [api-security]
      summary: 恢复接口
      description: >-
        人工恢复：接口资产状态 DEPRECATED/ZOMBIE → CONFIRMED，并写生命周期事件。
        当前状态不允许该流转时返回 409。无请求体。写操作审计。
        权限：`api_asset.edit`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      responses:
        '200':
          description: 接口已恢复为已确认
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecEndpointMutateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前资产状态不允许恢复流转（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/response-schemas:
    get:
      operationId: apiSecEndpointResponseSchemaList
      tags: [api-security]
      summary: 接口响应 Schema 学习结果
      description: >-
        按接口查询运行时学习到的响应 Schema（P0-06）：网关响应相位对合法 JSON 响应生成结构观测
        （一级字段路径→类型标签，不落值），采集器按 端点×状态码 合并 UPSERT 为运行时学习行。
        返回运行时学习行（按状态码升序，一状态码一行）；模型确认时物化的版本快照行不在本接口返回。
        权限：`api_model.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID（非法 UUID 返回 400；接口不存在返回 404）
      responses:
        '200':
          description: 响应 Schema 学习结果列表（data 为 {items} 包装）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecResponseSchemaListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/service-assets:
    get:
      operationId: apiSecServiceAssetList
      tags: [api-security]
      summary: 服务资产分页列表
      description: >-
        服务资产聚合视图（任务书 §14）：按 upstreams 主机:端口 视角反聚端点归属，
        含承载应用数、归属 API 端点数、近 7 天请求量、涉敏端点数与未闭环风险发现数；
        按 host,port 升序，已软删应用的 upstreams 不计入。权限：`api_asset.read`
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页服务资产列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecServiceAssetListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/learning/start:
    post:
      operationId: apiSecLearningStart
      tags: [api-security]
      summary: 启动接口学习
      description: >-
        创建 RUNNING 学习任务并置接口 learning_status=LEARNING。
        请求体可选：`{"sample_target": N}`，N∈[10,100000]，缺省（无体/无字段/null）取 100；
        越界返回 400。接口已有运行中任务时返回 409。写操作审计。
        权限：`api_learning.start`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecLearningStartRequest' }
      responses:
        '200':
          description: 学习任务已启动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLearningJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 该接口已有运行中的学习任务（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/learning/stop:
    post:
      operationId: apiSecLearningStop
      tags: [api-security]
      summary: 停止接口学习
      description: >-
        停止运行中的学习任务（置 STOPPED），接口 learning_status=PAUSED 并写生命周期事件。
        无运行中任务时返回 409。无请求体。写操作审计。
        权限：`api_learning.stop`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      responses:
        '200':
          description: 学习任务已停止
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLearningJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前没有运行中的学习任务（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/learning/status:
    get:
      operationId: apiSecLearningStatus
      tags: [api-security]
      summary: 接口学习状态
      description: >-
        返回接口学习状态、最近一次学习任务（从未学习时 job 为 null）与样本统计。
        达样本阈值的任务由后台调度器自动完成（COMPLETED + 接口 LEARNED）并生成模型候选。
        权限：`api_learning.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      responses:
        '200':
          description: 学习状态与样本统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLearningStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/learning/samples:
    get:
      operationId: apiSecLearningSampleList
      tags: [api-security]
      summary: 接口学习样本分页列表
      description: >-
        分页列出接口学习样本（仅存样本哈希与指纹，不含完整敏感值），按 collected_at 倒序，
        可按 accepted 过滤。权限：`api_learning.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
        - name: accepted
          in: query
          required: false
          schema: { type: boolean }
          description: 是否被学习采纳（true/false，缺省不过滤；非法取值返回 400）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数或大于 100 时归一为 20）
      responses:
        '200':
          description: 分页学习样本列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLearningSampleListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/endpoints/{id}/lifecycle-events:
    get:
      operationId: apiSecLifecycleEventList
      tags: [api-security]
      summary: 接口生命周期事件分页列表
      description: >-
        接口生命周期判定轨迹（合并/拆分/资产状态变更/学习启停等），按 created_at 倒序分页。
        权限：`api_asset.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数或大于 100 时归一为 20）
      responses:
        '200':
          description: 分页生命周期事件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecLifecycleEventListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 模型版本与参数（apimodels，任务书 51.2 / 51.3） ====================
  /api-security/endpoints/{id}/models:
    get:
      operationId: apiSecModelList
      tags: [api-security]
      summary: 接口模型版本分页列表
      description: >-
        分页列出指定接口的模型版本，按 created_at 倒序。
        权限：`api_model.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数
      responses:
        '200':
          description: 分页模型版本列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecModelVersionListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecModelCreate
      tags: [api-security]
      summary: 创建候选模型版本
      description: >-
        为接口手工创建候选模型（status=CANDIDATE，created_reason=manual），
        version_number 按接口序号自动分配（同接口 max+1）。schema 为「字段路径 → 类型词汇」映射，必填且非空。
        写操作审计。权限：`api_model.edit`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 接口 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecModelCreateRequest' }
      responses:
        '200':
          description: 候选模型已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecModelVersionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/models/{id}:
    get:
      operationId: apiSecModelGet
      tags: [api-security]
      summary: 模型版本详情
      description: >-
        返回指定模型版本（data 即模型版本对象本身）。
        权限：`api_model.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 模型版本 ID
      responses:
        '200':
          description: 模型版本详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecModelVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/models/{id}/diff/{other_id}:
    get:
      operationId: apiSecModelDiff
      tags: [api-security]
      summary: 模型版本差异对比
      description: >-
        计算 other_id → id 的字段级差异（新增/删除/类型变化），结果 upsert 进 api_model_diffs 后返回
        （data 即差异记录对象本身）。权限：`api_model.read`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 目标模型版本 ID
        - name: other_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 对比基准模型版本 ID
      responses:
        '200':
          description: 版本差异记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecModelDiff' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/models/{id}/submit-review:
    post:
      operationId: apiSecModelSubmitReview
      tags: [api-security]
      summary: 提交模型评审
      description: >-
        将候选模型提交评审（CANDIDATE → IN_REVIEW），并写 api_model_reviews(SUBMIT) 评审记录。
        请求体可选 `{"comment": "..."}`（空体视为无评论）。仅 CANDIDATE 状态允许，否则 409。写操作审计。
        权限：`api_model.review`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 模型版本 ID
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecModelReviewRequest' }
      responses:
        '200':
          description: 已提交评审
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecModelVersionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不允许该操作（仅 CANDIDATE 可提交评审，错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/models/{id}/confirm:
    post:
      operationId: apiSecModelConfirm
      tags: [api-security]
      summary: 确认模型为正式版本
      description: >-
        将候选或评审中的模型确认为正式版本（→ FORMAL），同接口旧 FORMAL 版本降级为 SUPERSEDED，
        并同事务物化请求体参数行（供参数约束确认与下发）。仅 CANDIDATE/IN_REVIEW 状态允许，否则 409。
        无请求体。写操作审计。权限：`api_model.confirm`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 模型版本 ID
      responses:
        '200':
          description: 模型已确认为正式版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecModelVersionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 仅候选或评审中的版本可确认为正式模型（错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/models/{id}/reject:
    post:
      operationId: apiSecModelReject
      tags: [api-security]
      summary: 拒绝模型版本
      description: >-
        拒绝模型版本（CANDIDATE/IN_REVIEW → REJECTED），并写 api_model_reviews(REJECT) 评审记录。
        请求体可选 `{"comment": "..."}`（空体视为无评论）。其他状态返回 409。写操作审计。
        权限：`api_model.review`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 模型版本 ID
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecModelReviewRequest' }
      responses:
        '200':
          description: 模型已拒绝
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecModelVersionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不允许该操作（仅 CANDIDATE/IN_REVIEW 可拒绝，错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/models/{id}/activate:
    post:
      operationId: apiSecModelActivate
      tags: [api-security]
      summary: 激活模型版本
      description: >-
        将正式版本激活为接口当前模型（置 api_endpoints.current_model_version_id 并刷新 activated_at）。
        仅 FORMAL 状态允许，否则 409。无请求体。写操作审计。
        权限：`api_model.activate`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 模型版本 ID
      responses:
        '200':
          description: 模型已激活
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecModelVersionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不允许该操作（仅 FORMAL 可激活，错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/models/{id}/archive:
    post:
      operationId: apiSecModelArchive
      tags: [api-security]
      summary: 归档模型版本
      description: >-
        将模型版本归档（FORMAL/SUPERSEDED/REJECTED → ARCHIVED）。其他状态返回 409。
        无请求体。写操作审计。权限：`api_model.archive`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 模型版本 ID
      responses:
        '200':
          description: 模型已归档
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecModelVersionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前状态不允许该操作（仅 FORMAL/SUPERSEDED/REJECTED 可归档，错误码 RESOURCE_CONFLICT）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/models/{id}/parameters:
    get:
      operationId: apiSecModelParameterList
      tags: [api-security]
      summary: 模型版本参数分页列表
