      parameters:
        - name: task_type
          in: query
          required: false
          schema: { type: string, enum: [API_ASSET_DIGEST, SHADOW_REVIEW, WEAKNESS_FOLLOW, RISK_DIGEST, SENSITIVE_DIGEST] }
          description: 任务类型过滤（自动转大写；非法取值返回 400）
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
          description: 启用状态过滤（true/false，缺省不过滤；非法取值返回 400）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数归一 20）
