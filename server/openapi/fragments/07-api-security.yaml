    delete:
      operationId: apiMachineIdentityDelete
      tags: [api-security]
      summary: 删除机器身份
      description: >-
        删除身份（键 FK 级联；存在任一机器身份绑定时先决校验 409——先解绑再删除身份
        （绑定不引用身份、登记册全局生效，删除任一身份都改变全局登记册内容））。
        变更触发整站发布链热生效。HIGH 审计。权限：`jwt_trust.manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
