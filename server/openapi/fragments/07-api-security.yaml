        变更身份 = 删除后重新登记。effective_from 必填；effective_until 为空 = 永久吊销，
        且须晚于 effective_from。写操作审计。权限：`api_credential.manage`。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 吊销记录 ID }
