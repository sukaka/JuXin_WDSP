  /api-security/group-control/shared-devices:
    get:
      operationId: apiSecSharedDeviceGroupList
      tags: [api-security]
      summary: 同设备多账号群控观察聚合
      description: >-
        按应用与被动设备指纹聚合已采集的 API 安全事件，仅统计 JWT VERIFIED 且含可信主体指纹的事件。
        返回观察到的不同账号数、事件数、群控信号数、接口与网关节点覆盖；不返回主体标识或原始账号。
        data_scope=NOTABLE_SECURITY_EVENTS 且 partial=true：数据源不是全量请求，账号数不等于实际活跃账号总数。
        被动设备指纹是低熵群体特征，不是唯一设备标识；结果是观察线索，不是群控定罪或阻断决策。
        历史事件及未识别应用的事件没有 application_id，不参与本聚合。权限：`api_runtime.read`。
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date-time }
          description: 起始时间（RFC3339，含）；缺省为当前时间前 24 小时，与 end 的最大跨度为 31 天
        - name: end
          in: query
          schema: { type: string, format: date-time }
          description: 结束时间（RFC3339，不含）；缺省为当前时间，必须晚于 start
        - name: application_id
          in: query
          schema: { type: string, format: uuid }
          description: 按应用 UUID 精确过滤
        - name: device_fingerprint
          in: query
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
          description: 按 32 位小写十六进制被动设备指纹精确过滤
        - name: min_accounts
          in: query
          schema: { type: integer, default: 3, minimum: 2, maximum: 1000 }
          description: 最少观察到的不同可信账号数
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1, maximum: 1000000 }
          description: 页码
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页分组数
      responses:
        '200':
          description: 共享设备观察分组分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecSharedDeviceListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api-security/group-control/shared-devices/accounts:
    get:
      operationId: apiSecSharedDeviceAccountList
