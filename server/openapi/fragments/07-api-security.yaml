      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 吊销记录 ID }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, description: 固定为 deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/protection/coverage:
    get:
      operationId: apiSecProtectionCoverageGet
      tags: [api-security]
      summary: 统一执行覆盖查询（五态聚合 / 节点阶段计数）
      description: >-
        统一执行覆盖查询（NG-COV-02 查询侧，data 形状随 view）：
        view=agg（缺省）返回窗口内 coverage_minute_agg 按维度键汇总的 Metrics 行——
        E=FULL+PARTIAL+SKIPPED+ERROR，NOT_APPLICABLE 另计不进 E；比率查询侧计算，
        E=0 时 no_applicable_traffic=true 且比率为 0（绝不显示 100%）；
        data_incomplete=true 表示窗口内节点最新 cov_ingest 计数快照存在
        agg_overflow>0 或 agg_invalid>0（统计输入不完整如实披露）。
        view=stages 返回每节点最新一份 guard 链路阶段计数（total/rejected_*/
        intercepted_*/reached_*，阶段集合与顺序跨仓冻结，缺失阶段补零保序输出）。
        空数据返回空数组。窗口 window_minutes 缺省 60、上限 10080（7 天）——
        非数字返回 400，非正数归一 60，越界夹紧 10080。rows 上限 1000。
        权限：`api_protection.read`
      parameters:
        - name: application_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 应用 ID 精确过滤（非法 UUID 返回 400）
        - name: detector
          in: query
          required: false
          schema: { type: string, maxLength: 96 }
          description: 检测器精确过滤（如 graphql.cost_v1；超过 96 字符返回 400）
        - name: node_id
          in: query
          required: false
          schema: { type: string, maxLength: 96 }
          description: 网关节点精确过滤（超过 96 字符返回 400）
        - name: window_minutes
          in: query
          required: false
          schema: { type: integer, default: 60, minimum: 1, maximum: 10080 }
          description: 查询窗口（分钟，按 minute/captured_at 口径；非数字 400，非正数归一 60，越界夹紧 10080）
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [agg, stages], default: agg }
          description: 视图（agg 五态聚合 / stages 节点阶段计数；其他取值返回 400）
      responses:
        '200':
          description: 覆盖查询结果（data 形状随 view 参数）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiSecCoverageAggResponse'
                  - $ref: '#/components/schemas/ApiSecCoverageStagesResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/protection/validations:
    post:
      operationId: apiSecProtectionValidationCreate
      tags: [api-security]
      summary: 创建无副作用模拟报告
      description: >-
        冻结策略 + 脱敏 Finding 批次在隔离决策实例内重放（NG-COV-03 / RD_PLAN §5.3），
        产出「若启用将如何动作」的报告并与策略/语料/输入摘要绑定。
        输入为脱敏 Finding 批次：matches 仅 detector/rule_id/category/severity/score_delta
        等结构化字段，禁止携带 evidence 原文；批次 ≤100、matches/批 ≤200、单字段 ≤256 字符
        （违反返回 400）；服务端不解析原始请求体/凭据。
        模拟零副作用（不反代请求、不调用工具、不改真实状态）；
        verdicts[].would_block 为「模拟判定，非已执行」；
        模拟结果不是 PROTECT 实测，不能单独满足上线条件。
        权限：`api_protection.validate`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecValidationCreateRequest' }
      responses:
        '200':
          description: 完整模拟报告（创建时 status 恒 COMPLETED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecValidationReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: apiSecProtectionValidationList
      tags: [api-security]
      summary: 模拟报告分页列表
      description: >-
        按创建时间倒序分页列出模拟报告（data 为分页信封 items/page/page_size/total）。
        STALE 在读出时求值：与当前策略摘要（发布链当前生效版本 configuration_hash）比较，
        不一致则该项 status=STALE（不回写数据库）。权限：`api_protection.read`
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（非正数归一 20，大于 100 归一 100）
      responses:
        '200':
          description: 分页模拟报告列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecValidationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/protection/validations/{id}:
    get:
      operationId: apiSecProtectionValidationGet
      tags: [api-security]
      summary: 单份模拟报告
      description: >-
        按 ID 读单份模拟报告。STALE 在读出时求值（策略/语料摘要与当前值比较，
        不回写数据库——读出求值恒最新，免写路径）。id 非法 UUID 返回 400，不存在返回 404。
        权限：`api_protection.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 报告 ID }
      responses:
        '200':
          description: 单份模拟报告（读出时 STALE 求值）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecValidationReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/apps/{id}/graphql-policy:
    get:
      operationId: apiSecAppGraphQLPolicyGet
      tags: [api-security]
      summary: 读取应用 GraphQL 成本预算策略
      description: >-
        读取单应用 GraphQL 成本预算策略（NG-GQL-03，api_graphql_policies 表）。
        无策略行时返回 enabled=false、version=0 的默认视图（「无段=关闭」语义，非 404）。
        权限：`api_policy.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用 ID }
      responses:
        '200':
          description: 应用 GraphQL 策略视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecGraphQLPolicyView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: apiSecAppGraphQLPolicyPut
      tags: [api-security]
      summary: 写入应用 GraphQL 成本预算策略
      description: >-
        写入（upsert）单应用 GraphQL 成本预算策略，version 单调 +1；写操作审计。
        数值须非负且有上限（max_doc_bytes ≤ 64MiB，权重/预算 ≤ 2^40），
        trusted_doc_digests 须为 32 位小写 hex（gqlast.DigestDocument 口径）；
        应用不存在或已删除返回 404。策略经整站发布链生效（本端点只读写库，不隐式发布）。
        权限：`api_policy.edit`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecGraphQLPolicy' }
      responses:
        '200':
          description: 写入后的策略视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecGraphQLPolicyView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: apiSecAppGraphQLPolicyDelete
      tags: [api-security]
      summary: 删除应用 GraphQL 成本预算策略（→ 关闭）
      description: >-
        删除策略行即关闭该应用 GraphQL 成本预算（目标态幂等：本无行同样成功）。
        写操作审计。删除经整站发布链生效。权限：`api_policy.edit`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用 ID }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, description: 固定为 deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/authorities:
    get:
      operationId: apiSecAuthzAuthorityList
      tags: [api-security]
      summary: 权威关系来源列表
      description: >-
        列出全部权威关系来源（NG-AZ-01，api_authority_sources；含状态/范围授权/最大事件年龄/版本）。
        权限：`api_authorization.read`
      responses:
        '200':
          description: 来源列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiSecAuthzAuthoritySource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: apiSecAuthzAuthorityCreate
      tags: [api-security]
      summary: 登记权威关系来源
      description: >-
        登记权威关系来源（名称唯一；scopes 为范围授权白名单——空数组=不限该维度；
        keys 可同时登记验签公钥（Ed25519 32 字节 hex，与发布签名密钥不混用））。
        写操作审计。权限：`api_authorization.authority_manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzAuthorityCreateRequest' }
      responses:
        '200':
          description: 登记成功的来源
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzAuthoritySource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/authorities/{id}:
    get:
      operationId: apiSecAuthzAuthorityGet
      tags: [api-security]
      summary: 权威关系来源详情（含公钥）
      description: 单来源详情（含验签公钥列表，仅公钥——私钥不进管理面）。权限：`api_authorization.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 来源 ID }
      responses:
        '200':
          description: 来源详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzAuthorityDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: apiSecAuthzAuthorityPatch
      tags: [api-security]
      summary: 变更权威关系来源（启停/范围/钥匙轮换）
      description: >-
        变更来源状态（ACTIVE/DISABLED）/范围授权/最大事件年龄/验签钥匙轮换
        （add_keys 登记新公钥、retire_keys 退役旧公钥——RETIRED 键仅在轮换窗口内继续验签）。
        乐观锁 version（冲突返回 409）。写操作审计。权限：`api_authorization.authority_manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 来源 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzAuthorityPatchRequest' }
      responses:
        '200':
          description: 变更后的来源详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzAuthorityDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/authorities/{id}/imports:
    post:
      operationId: apiSecAuthzAuthorityImport
      tags: [api-security]
      summary: 导入权威关系离线签名批次
      description: >-
        导入离线签名批次（NG-AZ-01 §1/§2）：批次契约
        `{batch_id, source_id, mode: snapshot|delta, key_id, items[], batch_signature}`，
        事件字段（含 key_id）经规范化字节（键序字典序紧凑 JSON）Ed25519 验签。
        五步校验链（任一失败整批 REJECTED 并逐条展示原因，不部分应用）：
        ① 来源身份验签 ② 范围权限 ③ 重放幂等（event_id 已消费跳过计数；delta sequence
        严格大于水位且批内升序，乱序拒收；snapshot 批次最大 sequence 整体推进）
        ④ 大小/字段白名单（未知字段拒收不忽略）⑤ 字段语义（relation 仅 OWNER——
        共享/委托/组继承/批量对象/复合 ID 首批不支持拒收展示）。
        snapshot 原子切换（中断一行不动，绝不把未导入对象当撤销）；
        delta 缺口记 AUTHZ_SOURCE_GAP（补齐自动消除）；同对象两个不同有效 OWNER 记冲突
        （不按最后到达者覆盖）。HTTP 恒 200，业务结果看 status（APPLIED/REJECTED）。
        导入成功触发整站发布。权限：`api_authorization.authority_import`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 来源 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiSecAuthzAuthorityImportRequest' }
      responses:
        '200':
          description: 批次记录（status=APPLIED 带 counts / REJECTED 带逐条原因）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzAuthorityBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/authorities/{id}/status:
    get:
      operationId: apiSecAuthzAuthorityStatus
      tags: [api-security]
      summary: 权威来源状态（水位/缺口/冲突/批次历史）
      description: >-
        来源状态视图：watermark（last_sequence/last_event_id/revocation_watermark/gap_from）、
        gap_status（NO_DATA|OK|AUTHZ_SOURCE_GAP——gap_from 非空即缺口，补齐自动消除）、
        当前 OPEN 冲突列表、最近 20 批次历史。权限：`api_authorization.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 来源 ID }
      responses:
        '200':
          description: 来源状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzAuthorityStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/authz/node-acks:
    get:
      operationId: apiSecAuthzNodeAckList
      tags: [api-security]
      summary: 节点授权 ACK 视图（水位/租约/陈旧窗口/ack_state）
      description: >-
        全节点授权 ACK 视图（NG-AZ-02 D6，api_gateway_nodes LEFT JOIN
        api_node_authz_acks）：每节点 ack_state 五态派生——FRESH（水位≥管理面向量水位
        且 staleness≤lease）/ STALE_WITHIN_LEASE（staleness≤lease 或无租约但水位落后）/
        STALE_EXPIRED（staleness>lease）/ NEVER_ACKED（无 ACK 行：旧版网关或未启用授权
        快照，如实显示非报错）/ CLOCK_SKEW（|时钟漂移|>上限，默认 60s，系统设置
        authz.clock_skew_max_seconds 覆盖并夹紧 10~300s——漂移节点的时效判定不可信）。
        staleness_seconds = 视图生成时刻 − authz_applied_at（未应用过授权快照的节点为
        null 且不参与最大陈旧窗口；可为负：节点时钟超前）。顶层附
        max_staleness_seconds（全节点最大陈旧窗口，无参与节点为 null）与
        management_watermark（当前管理面向量水位：api_authz_manual_revocation_seq 单行
        manual_seq + api_authority_watermarks 逐来源 revocation_watermark 合并）。
        「必须显示未 ACK 节点及最大陈旧窗口」（§8.3-5）的直接载体。
        只读端点。权限：`api_authorization.read`
      responses:
        '200':
          description: 全节点 ACK 视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecAuthzNodeAckView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  schemas:
    # ---------- 接口资产（apiassets） ----------
    ApiSecEndpoint:
      type: object
      description: API 接口（api_endpoints；列表接口额外带出站点名称与主域名）
      required:
        - id
        - http_method
        - normalized_path
        - raw_path_example
        - directory_path
        - endpoint_key
        - api_confidence
        - asset_status
        - protocol_type
        - learning_status
        - classification_locked
        - is_api
        - hit_count
        - first_seen_at
        - last_seen_at
      properties:
        id: { type: string, format: uuid, description: 接口 ID }
        application_id:
          type: string
          format: uuid
          nullable: true
          description: 所属站点（应用）ID；未归属时缺省或为 null
        application_name: { type: string, description: 所属站点名称（仅列表带出，未归属为空串） }
        application_domain: { type: string, description: 所属站点主域名（仅列表带出，无域名记录为空串） }
        domain_id:
          type: string
          format: uuid
          nullable: true
          description: 命中的站点域名 ID（可空）
        http_method: { type: string, description: HTTP 方法（大写），如 GET/POST }
        normalized_path:
          type: string
          description: 归一化路径模板（如 /v1/users/{id}）
        raw_path_example: { type: string, description: 原始路径样例 }
        directory_path: { type: string, description: 归一化目录路径（normalized_path 去掉最后一段；未归类为空串） }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」，全局唯一） }
        api_confidence: { type: number, format: double, description: API 判定置信度（0-1） }
        asset_status:
          type: string
          enum: [DISCOVERED, CONFIRMED, IGNORED, DEPRECATED]
          description: 资产状态
        protocol_type: { type: string, description: 协议类型（如 HTTP/REST） }
        learning_status:
          type: string
          enum: [NOT_STARTED, LEARNING, PAUSED, LEARNED]
          description: 学习状态
        current_model_version_id:
          type: string
          format: uuid
          nullable: true
          description: 当前激活的模型版本 ID（可空）
        classification_locked: { type: boolean, description: 分类是否锁定（手动分类后锁定，防止自动分类覆盖） }
        is_api: { type: boolean, description: 是否判定为 API 接口 }
        hit_count: { type: integer, format: int64, description: 累计命中次数 }
        first_seen_at: { type: string, format: date-time, description: 首次发现时间 }
        last_seen_at: { type: string, format: date-time, description: 最近命中时间 }
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: 人工确认时间（未确认时缺省或为 null）
        business_type:
          type: string
          enum: [LOGIN, REGISTER, PASSWORD_RESET, SMS, EMAIL, ORDER, PAYMENT, EXPORT, DOWNLOAD, SEARCH, QUERY_PERSONAL_DATA, AI_INFERENCE, OTHER]
          description: 业务类型（仅列表带出，api_assets.business_type；无资产记录归一为 OTHER）
        tags:
          type: array
          items: { type: string }
          description: 自由标签（仅列表带出，api_assets.tags；无资产记录时缺省）
        asset:
          $ref: '#/components/schemas/ApiSecAsset'
      # asset 字段仅在详情/更新响应中附带，无记录时缺省

    ApiSecAsset:
      type: object
      description: 接口业务维度扩展（api_assets；owner 即系统负责人）
      required: [endpoint_id, purpose, exposure, data_classification, owner, tags, business_type, organization, business_system, technical_owner, data_owner, data_level, api_level, auth_type, created_at, updated_at]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        purpose: { type: string, description: 业务用途说明（最长 128） }
        exposure:
          type: string
          enum: [INTERNAL, PARTNER, PUBLIC]
          description: 暴露面
        data_classification: { type: string, description: 数据分级（系统判定，只读） }
        owner: { type: string, description: 系统负责人（最长 128） }
        tags:
          type: array
          items: { type: string }
          description: 自由标签（多值，最多 32 个，单个最长 64）
        business_type:
          type: string
          enum: [LOGIN, REGISTER, PASSWORD_RESET, SMS, EMAIL, ORDER, PAYMENT, EXPORT, DOWNLOAD, SEARCH, QUERY_PERSONAL_DATA, AI_INFERENCE, OTHER]
          description: 业务类型（敏感业务流标签，WDSP 设计 #12.1；默认 OTHER）
        organization: { type: string, description: 所属单位 }
        business_system: { type: string, description: 业务系统 }
        technical_owner: { type: string, description: 技术负责人 }
        data_owner: { type: string, description: 数据负责人 }
        data_level:
          type: string
          enum: [UNKNOWN, CORE, IMPORTANT, GENERAL]
          description: 数据等级（UNKNOWN=未标注）
        api_level:
          type: string
          enum: [UNKNOWN, LEVEL_1, LEVEL_2, LEVEL_3]
          description: API 等级（UNKNOWN=未标注）
        auth_type:
          type: string
          description: 认证方式（NONE/BASIC/API_KEY/TOKEN/JWT/OAUTH2/MTLS/SESSION/OTHER；空串=未标注）
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecSiteSummaryItem:
      type: object
      description: 站点接口计数（站点列表角标）
      required: [application_name, application_domain, endpoint_count]
      properties:
        application_id:
          type: string
          format: uuid
          nullable: true
          description: 站点 ID
        application_name: { type: string, description: 站点名称 }
        application_domain: { type: string, description: 主域名（前端优先展示；无域名记录为空串） }
        endpoint_count: { type: integer, format: int64, description: 该站点接口数 }

    ApiSecSiteSummaryResponse:
      type: object
      required: [items, unassigned]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecSiteSummaryItem' }
        unassigned: { type: integer, format: int64, description: 未归属站点接口数 }

    ApiSecDirectoryCount:
      type: object
      description: 目录接口计数（目录树扁平节点）
      required: [directory_path, endpoint_count]
      properties:
        directory_path: { type: string, description: 目录路径，如 /test/php }
        endpoint_count: { type: integer, format: int64, description: 该目录接口数 }

    ApiSecDirectoryTreeResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecDirectoryCount' }

    ApiSecEndpointListResponse:
      type: object
      description: 接口分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecEndpoint' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecEndpointExportMeta:
      type: object
      required: [export_version, kind, generated_at, generated_by, endpoint_id, content_sha256]
      properties:
        export_version: { type: integer, description: 导出结构版本（当前恒为 1） }
        kind: { type: string, description: 导出类型（api_endpoint_detail） }
        generated_at: { type: string, format: date-time, description: 导出生成时间（UTC） }
        generated_by: { type: string, description: 执行导出的用户名 }
        endpoint_id: { type: string, format: uuid, description: API 接口 ID }
        content_sha256: { type: string, description: 未含本字段时的档案内容 SHA-256（hex） }

    ApiSecEndpointExportClassification:
      type: object
      required: [is_api, confidence, level, signals, classified_at]
      properties:
        is_api: { type: boolean, description: 来源观测是否判定为 API }
        confidence: { type: number, format: double, description: 分类置信度（0-1） }
        level: { type: string, description: 四级识别标签或 LEGACY_V1 }
        signals:
          type: array
          items: { type: string }
          description: 命中的分类信号（如 content_type_json、response_json、grpc_metadata）
        classified_at: { type: string, format: date-time, description: 分类计算时间 }

    ApiSecEndpointExportAgentSource:
      type: object
      required: [agent_id, host, method, path_template, source_type, source_instance, source_epoch, association_state, first_seen_at, last_seen_at]
      properties:
        agent_id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid, nullable: true }
        host: { type: string }
        method: { type: string }
        path_template: { type: string }
        source_type: { type: string, enum: [PASSIVE_HTTP1, NGINX_MIRROR, ENVOY_TAP] }
        source_instance: { type: string }
        source_epoch: { type: integer, format: int64 }
        application_binding_id: { type: string, format: uuid, nullable: true }
        binding_version: { type: integer, format: int64, nullable: true }
        association_state: { type: string, enum: [LINKED, UNASSIGNED, QUOTA_REJECTED, FAILED] }
        last_error: { type: string }
        classification: { $ref: '#/components/schemas/ApiSecEndpointExportClassification' }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    ApiSecEndpointExportFinding:
      type: object
      required: [id, request_id, finding_type, severity, status, title, detail, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid, nullable: true }
        request_id: { type: string }
        finding_type: { type: string }
        severity: { type: string }
        status: { type: string }
        title: { type: string }
        detail:
          type: object
          additionalProperties: true
          description: 既有脱敏 Finding 摘要，不含请求正文
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    ApiSecEndpointExportWeakness:
      type: object
      required: [id, code, name, category, severity, status, evidence, first_seen, last_seen, trigger_count]
      properties:
        id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid, nullable: true }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        severity: { type: string }
        status: { type: string }
        evidence:
          type: object
          additionalProperties: true
          description: 既有脱敏弱点证据摘要
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        trigger_count: { type: integer }
        owner: { type: string }

    ApiSecEndpointExportSensitiveField:
      type: object
      required: [id, endpoint_id, direction, structured_path, data_type, confidence, detection_source, occurrence_count]
      properties:
        id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid }
        direction: { type: string, enum: [REQUEST, RESPONSE] }
        structured_path: { type: string, description: 字段路径（不含字段值） }
        data_type: { type: string }
        confidence: { type: number, format: double }
        detection_source: { type: string }
        first_seen: { type: string, format: date-time, nullable: true }
        last_seen: { type: string, format: date-time, nullable: true }
        occurrence_count: { type: integer }
        source_detail:
          type: object
          additionalProperties: true
          nullable: true
          description: 最近一次命中摘要（规则、请求/事件 ID 等，不含值）

    ApiSecEndpointExportBundle:
      type: object
      description: 单个 API 详细档案（各子集合有界；仅含脱敏摘要）
      required: [meta, endpoint, classification, models, learning, lifecycle, lifecycle_total, traffic, sources, sources_total, security]
      properties:
        meta: { $ref: '#/components/schemas/ApiSecEndpointExportMeta' }
        endpoint: { $ref: '#/components/schemas/ApiSecEndpoint' }
        classification:
          type: object
          required: [is_api, confidence, dimensions]
          properties:
            is_api: { type: boolean }
            confidence: { type: number, format: double }
            dimensions:
              type: array
              items: { $ref: '#/components/schemas/ApiSecClassificationDimension' }
        models:
          type: object
          required: [versions, versions_total, parameters, response_schemas]
          properties:
            current_version: { $ref: '#/components/schemas/ApiSecModelVersion', nullable: true }
            versions:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/ApiSecModelVersion' }
            versions_total: { type: integer, format: int64 }
            parameters:
              type: array
              items: { $ref: '#/components/schemas/ApiSecParameter' }
            response_schemas:
              type: array
              items: { $ref: '#/components/schemas/ApiSecResponseSchema' }
        learning:
          type: object
          required: [stats, recent_samples, recent_samples_total]
          properties:
            job: { $ref: '#/components/schemas/ApiSecLearningJob', nullable: true }
            stats:
              type: object
              required: [total, accepted, excluded]
              properties:
                total: { type: integer, format: int64 }
                accepted: { type: integer, format: int64 }
                excluded: { type: integer, format: int64 }
            recent_samples:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/ApiSecLearningSample' }
            recent_samples_total: { type: integer, format: int64 }
        lifecycle:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ApiSecLifecycleEvent' }
        lifecycle_total: { type: integer, format: int64 }
        traffic:
          type: object
          description: 1h/24h/7d 三档补零流量序列
          additionalProperties: { $ref: '#/components/schemas/ApiSecTrafficTrend' }
        sources:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ApiSecEndpointExportAgentSource' }
        sources_total: { type: integer, format: int64 }
        security:
          type: object
          required: [findings, findings_total, weaknesses, weaknesses_total, sensitive_fields, sensitive_fields_total]
          properties:
            findings:
              type: array
              maxItems: 50
              items: { $ref: '#/components/schemas/ApiSecEndpointExportFinding' }
            findings_total: { type: integer, format: int64 }
            weaknesses:
              type: array
              maxItems: 50
              items: { $ref: '#/components/schemas/ApiSecEndpointExportWeakness' }
            weaknesses_total: { type: integer, format: int64 }
            sensitive_fields:
              type: array
              maxItems: 500
              items: { $ref: '#/components/schemas/ApiSecEndpointExportSensitiveField' }
            sensitive_fields_total: { type: integer, format: int64 }

    ApiSecEndpointConfirmRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          maxItems: 100
          description: 待确认接口 ID 列表（单次最多 100 个）

    ApiSecConfirmFailedItem:
      type: object
      required: [id, reason]
      properties:
        id: { type: string, format: uuid, description: 确认失败的接口 ID }
        reason: { type: string, description: 失败原因 }

    ApiSecEndpointConfirmResponse:
      type: object
      required: [confirmed, confirmed_ids, failed]
      properties:
        confirmed: { type: integer, description: 确认成功数量 }
        confirmed_ids:
          type: array
          items: { type: string, format: uuid }
          description: 确认成功的接口 ID 列表
        failed:
          type: array
          items: { $ref: '#/components/schemas/ApiSecConfirmFailedItem' }
          description: 逐项失败明细

    ApiSecEndpointResponse:
      type: object
      required: [endpoint, daily_requests]
      properties:
        endpoint: { $ref: '#/components/schemas/ApiSecEndpoint' }
        daily_requests:
          type: integer
          format: int64
          description: 近 7 天日均调用量（api_endpoint_traffic_buckets 窗口和/7，与资产价值评分同口径）

    ApiSecTrafficTrend:
      type: object
      description: 接口访问趋势（traffic-trend 响应 data 层；数据来自采集链路全量流量计数，留存 7 天）
      required: [endpoint_id, bucket_seconds, range, total, points]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        bucket_seconds: { type: integer, description: 桶宽（秒），固定 300（5 分钟，UTC 对齐） }
        range: { type: string, enum: [1h, 24h, 7d], description: 实际生效的统计窗口（缺省或非法输入回落 24h） }
        total: { type: integer, format: int64, description: 窗口内请求总量（points 计数合计） }
        points:
          type: array
          description: 连续 5 分钟桶点列（服务端补零，无数据桶 count=0），时间升序
          items: { $ref: '#/components/schemas/ApiSecTrafficPoint' }

    ApiSecTrafficPoint:
      type: object
      required: [time, count]
      properties:
        time: { type: string, format: date-time, description: 桶起点（UTC，5 分钟对齐） }
        count: { type: integer, format: int64, description: 桶内请求数 }

    ApiSecEndpointMutateResponse:
      type: object
      required: [endpoint, message]
      properties:
        endpoint: { $ref: '#/components/schemas/ApiSecEndpoint' }
        message: { type: string, description: 操作结果提示 }

    ApiSecEndpointUpdateRequest:
      type: object
      description: 资产信息全量替换（至少提交一个字段；未提交字段按空值覆盖）
      properties:
        purpose: { type: string, maxLength: 128, description: 业务用途说明 }
        exposure:
          type: string
          enum: [INTERNAL, PARTNER, PUBLIC]
          description: 暴露面（自动转大写；空值归一为 INTERNAL）
        owner: { type: string, maxLength: 128, description: 系统负责人 }
        tags:
          type: array
          items: { type: string, maxLength: 64 }
          maxItems: 32
          description: 自由标签（多值，全量替换；不允许空串）
        business_type:
          type: string
          enum: [LOGIN, REGISTER, PASSWORD_RESET, SMS, EMAIL, ORDER, PAYMENT, EXPORT, DOWNLOAD, SEARCH, QUERY_PERSONAL_DATA, AI_INFERENCE, OTHER]
          description: 业务类型（自动转大写；空值归一为 OTHER；非法值返回 400）
        organization: { type: string, maxLength: 128, description: 所属单位（如 XX集团金融事业部） }
        business_system: { type: string, maxLength: 128, description: 业务系统（如 客户经营管理平台） }
        technical_owner: { type: string, maxLength: 128, description: 技术负责人 }
        data_owner: { type: string, maxLength: 128, description: 数据负责人 }
        data_level:
          type: string
          enum: [UNKNOWN, CORE, IMPORTANT, GENERAL]
          description: 数据等级（核心/重要/一般数据；自动转大写，空值归一 UNKNOWN；非法值返回 400）
        api_level:
          type: string
          enum: [UNKNOWN, LEVEL_1, LEVEL_2, LEVEL_3]
          description: API 等级（一级/二级/三级；自动转大写，空值归一 UNKNOWN；非法值返回 400）
        auth_type:
          type: string
          enum: ['', NONE, BASIC, API_KEY, TOKEN, JWT, OAUTH2, MTLS, SESSION, OTHER]
          description: 认证方式（自动转大写；空串或 UNKNOWN 归一为未标注；非法值返回 400）

    ApiSecEndpointMergeRequest:
      type: object
      required: [other_id]
      properties:
        other_id: { type: string, format: uuid, description: 待并入的接口 ID（不能与路径 id 相同） }

    ApiSecEndpointSplitRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 50
          description: 拆分目标路径列表（自动归一化，单次最多 50 个，不允许空串）

    ApiSecEndpointSplitResponse:
      type: object
      required: [endpoints, message]
      properties:
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/ApiSecEndpoint' }
          description: 新创建的接口列表
        message: { type: string, description: 操作结果提示 }

    ApiSecClassificationDimension:
      type: object
      description: 接口分类维度（apiassets 自动分类结果，api_classification_dimensions）
      required: [endpoint_id, dimension, value, source, confidence]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        dimension: { type: string, description: 分类维度（PURPOSE / EXPOSURE / ACCESS） }
        value: { type: string, description: 分类取值（如 AUTH / TRADE / FILE / ADMIN / USER_MGMT / QUERY / GENERAL；INTERNAL / PUBLIC；READ / WRITE） }
        source: { type: string, enum: [AUTO, MANUAL], description: 分类来源 }
        confidence: { type: number, format: double, description: 分类置信度（0-1） }

    ApiSecEndpointClassifyResponse:
      type: object
      required: [dimensions, message]
      properties:
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/ApiSecClassificationDimension' }
        message: { type: string, description: 操作结果提示 }

    # ---------- 暴露面判定（apiexposure，迁移 000190） ----------
    ApiSecExposureEvidenceItem:
      type: object
      required: [type, summary]
      properties:
        type:
          type: string
          enum: [manual, traffic_public, traffic_partner, traffic_internal, traffic_insufficient, config_listen, config_dns, config_dns_error, deployment_bypass, traffic_priority, insufficient]
          description: 证据类型
        summary: { type: string, description: 证据中文摘要（服务端生成，前端直接展示） }

    ApiSecExposureAssessment:
      type: object
      description: 一次暴露面评估明细（api_exposure_assessments）
      required: [verdict, source, confidence, evidence, assessed_at]
      properties:
        verdict:
          type: string
          enum: [INTERNAL, PARTNER, PUBLIC, UNKNOWN]
          description: 判定结论（内网 / 合作方 / 公网 / 未知）
        source:
          type: string
          enum: [MANUAL, TRAFFIC_OBSERVED, CONFIG]
          description: 判定来源（人工确认 / 流量观测 / 配置证据）
        confidence:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: 置信度
        evidence:
          type: array
          items: { $ref: '#/components/schemas/ApiSecExposureEvidenceItem' }
          description: 证据明细（有序，首条为主证据）
        assessed_at: { type: string, format: date-time, description: 评估时间 }

    ApiSecExposureDimension:
      type: object
      description: 当前 EXPOSURE 分类维度（api_classification_dimensions 实时口径；无维度行时 value/source 为空串、confidence 为 0）
      required: [value, source, confidence]
      properties:
        value: { type: string, description: 维度取值（INTERNAL / PARTNER / PUBLIC / UNKNOWN；空串 = 无维度行） }
        source: { type: string, description: 维度来源（MANUAL / AUTO / TRAFFIC_OBSERVED / CONFIG；空串 = 无维度行） }
        confidence: { type: number, format: double, description: 维度置信度数值（0-1） }

    ApiSecEndpointExposureResponse:
      type: object
      required: [endpoint_id, endpoint_key, locked, current, assessment]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        endpoint_key: { type: string, description: 接口键（方法 + 归一化路径） }
        locked: { type: boolean, description: 分类是否锁定（锁定或 MANUAL 来源时引擎不覆盖） }
        current: { $ref: '#/components/schemas/ApiSecExposureDimension' }
        assessment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiSecExposureAssessment'
          description: 最近一次评估明细（null = 从未评估）

    ApiSecEndpointExposureReassessResponse:
      type: object
      required: [assessment, applied, message]
      properties:
        assessment: { $ref: '#/components/schemas/ApiSecExposureAssessment' }
        applied: { type: boolean, description: 维度是否被本次判定更新（人工/锁定不更新） }
        message: { type: string, description: 操作结果提示 }

    # ---------- 学习任务（apiassets） ----------
    ApiSecLearningStartRequest:
      type: object
      description: 可选请求体（无体/无字段/null 均按缺省 100 处理）
      properties:
        sample_target:
          type: integer
          nullable: true
          minimum: 10
          maximum: 100000
          description: 有效样本目标（缺省 100；越界返回 400）

    ApiSecLearningJob:
      type: object
      description: 学习任务（api_learning_jobs）
      required:
        - id
        - endpoint_id
        - status
        - sample_target
        - collected_count
        - valid_count
        - excluded_count
        - started_at
        - created_at
      properties:
        id: { type: string, format: uuid, description: 任务 ID }
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        status:
          type: string
          enum: [RUNNING, STOPPED, COMPLETED]
          description: 任务状态（达阈值后由后台调度器置 COMPLETED）
        sample_target: { type: integer, description: 有效样本目标 }
        collected_count: { type: integer, description: 已采集样本数 }
        valid_count: { type: integer, description: 有效（采纳）样本数 }
        excluded_count: { type: integer, description: 已排除样本数 }
        last_error: { type: string, description: 最近一次错误信息（无则缺省） }
        started_at: { type: string, format: date-time, description: 启动时间 }
        stopped_at:
          type: string
          format: date-time
          nullable: true
          description: 停止/完成时间（运行中时缺省或为 null）
        created_by:
          type: string
          format: uuid
          nullable: true
          description: 启动人用户 ID（可空）
        created_at: { type: string, format: date-time }

    ApiSecLearningJobResponse:
      type: object
      required: [job, message]
      properties:
        job: { $ref: '#/components/schemas/ApiSecLearningJob' }
        message: { type: string, description: 操作结果提示 }

    ApiSecSampleStats:
      type: object
      description: 学习样本统计（api_learning_samples 聚合）
      required: [total, accepted, excluded]
      properties:
        total: { type: integer, format: int64, description: 样本总数 }
        accepted: { type: integer, format: int64, description: 采纳数 }
        excluded: { type: integer, format: int64, description: 排除数 }

    ApiSecLearningStatusResponse:
      type: object
      required: [endpoint_id, learning_status, job, samples]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        learning_status:
          type: string
          enum: [NOT_STARTED, LEARNING, PAUSED, LEARNED]
          description: 接口当前学习状态
        job:
          nullable: true
          $ref: '#/components/schemas/ApiSecLearningJob'
        samples: { $ref: '#/components/schemas/ApiSecSampleStats' }

    ApiSecLearningSample:
      type: object
      description: 学习样本（api_learning_samples；仅存样本哈希，不含完整敏感值）
      required:
        - id
        - endpoint_id
        - request_id
        - sample_hash
        - source_fingerprint
        - identity_fingerprint
        - accepted
        - exclude_reason
        - collected_at
      properties:
        id: { type: string, format: uuid, description: 样本 ID }
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        request_id: { type: string, description: 来源请求 ID }
        sample_hash: { type: string, description: 样本内容哈希 }
        source_fingerprint: { type: string, description: 来源指纹（客户端维度） }
        identity_fingerprint: { type: string, description: 身份指纹（调用方维度） }
        response_status:
          type: integer
          nullable: true
          description: 响应状态码（可空）
        accepted: { type: boolean, description: 是否被学习采纳 }
        exclude_reason: { type: string, description: 排除原因（采纳时为空串） }
        collected_at: { type: string, format: date-time, description: 采集时间 }

    ApiSecLearningSampleListResponse:
      type: object
      description: 学习样本分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecLearningSample' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecLifecycleEvent:
      type: object
      description: 接口生命周期事件（api_lifecycle_events）
      required: [id, endpoint_id, from_status, to_status, reason, actor, created_at]
      properties:
        id: { type: string, format: uuid, description: 事件 ID }
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        from_status: { type: string, description: 变更前状态（合并/拆分类事件为空串） }
        to_status: { type: string, description: 变更后状态（如 CONFIRMED / IGNORED / MERGED / SPLIT / PAUSED / LEARNED） }
        reason: { type: string, description: 变更原因 }
        actor: { type: string, description: 操作者（system 或用户名） }
        created_at: { type: string, format: date-time }

    ApiSecLifecycleEventListResponse:
      type: object
      description: 生命周期事件分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecLifecycleEvent' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    # ---------- 模型版本（apimodels，51.2） ----------
    ApiSecModelVersion:
      type: object
      description: >-
        模型版本（api_model_versions）。生命周期状态机：
        CANDIDATE → IN_REVIEW → FORMAL / REJECTED；FORMAL → SUPERSEDED（被新正式版本取代）；
        FORMAL / SUPERSEDED / REJECTED → ARCHIVED。正式模型内容不可变（仅状态迁移）。
      required:
        - id
        - api_endpoint_id
        - endpoint_key
        - version_number
        - status
        - schema
        - content_hash
        - change_summary
        - sample_count
        - valid_sample_count
        - excluded_sample_count
        - confidence
        - created_reason
        - created_at
      properties:
        id: { type: string, format: uuid, description: 模型版本 ID }
        api_endpoint_id: { type: string, format: uuid, description: 所属接口 ID }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」） }
        version_number: { type: integer, description: 版本号（创建时按接口序号分配，状态迁移不改变） }
        parent_version_id:
          type: string
          format: uuid
          nullable: true
          description: 父版本 ID（可空）
        request_schema_id:
          type: string
          format: uuid
          nullable: true
          description: 请求 Schema ID（可空）
        response_schema_set_id:
          type: string
          format: uuid
          nullable: true
          description: 响应 Schema 集 ID（可空）
        status:
          type: string
          enum: [CANDIDATE, IN_REVIEW, FORMAL, REJECTED, SUPERSEDED, ARCHIVED]
          description: 版本状态
        schema:
          type: object
          additionalProperties: { type: string }
          description: 字段路径 → 类型词汇映射（类型词与网关解析器粗类型对齐：string/number/bool/object/array/null）
        content_hash: { type: string, description: 内容哈希（SHA-256，十六进制） }
        change_summary: { type: string, description: 变更说明 }
        sample_count: { type: integer, description: 学习样本总数 }
        valid_sample_count: { type: integer, description: 有效样本数 }
        excluded_sample_count: { type: integer, description: 排除样本数 }
        confidence: { type: number, format: double, description: 置信度（0-1） }
        created_reason:
          type: string
          enum: [manual, learning_threshold]
          description: 创建来源（manual 手工创建；learning_threshold 学习达阈值自动生成）
        created_by:
          type: string
          format: uuid
          nullable: true
          description: 创建人用户 ID（可空）
        created_at: { type: string, format: date-time }
        confirmed_by:
          type: string
          format: uuid
          nullable: true
          description: 确认人用户 ID（可空）
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: 确认为正式版本时间（可空）
        activated_at:
          type: string
          format: date-time
          nullable: true
          description: 最近激活时间（可空）

    ApiSecModelVersionListResponse:
      type: object
      description: 模型版本分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecModelVersion' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecModelCreateRequest:
      type: object
      required: [schema]
      properties:
        schema:
          type: object
          additionalProperties: { type: string }
          minProperties: 1
          description: 字段路径 → 类型词汇映射（必填，不能为空对象）
        change_summary: { type: string, description: 可选变更说明 }

    ApiSecModelVersionResponse:
      type: object
      required: [version, message]
      properties:
        version: { $ref: '#/components/schemas/ApiSecModelVersion' }
        message: { type: string, description: 操作结果提示 }

    ApiSecModelReviewRequest:
      type: object
      description: 可选评审意见（空体视为无评论）
      properties:
        comment: { type: string, description: 评审意见 }

    ApiSecTypeChange:
      type: object
      description: 字段类型变化
      required: [field, from, to]
      properties:
        field: { type: string, description: 字段路径 }
        from: { type: string, description: 原类型 }
        to: { type: string, description: 新类型 }

    ApiSecSchemaDiff:
      type: object
      description: 两版本字段级差异（按字段名排序）
      required: [added, removed, type_changed]
      properties:
        added:
          type: array
          items: { type: string }
          description: 新增字段
        removed:
          type: array
          items: { type: string }
          description: 删除字段
        type_changed:
          type: array
          items: { $ref: '#/components/schemas/ApiSecTypeChange' }
          description: 类型变化字段

    ApiSecModelDiff:
      type: object
      description: 版本差异记录（api_model_diffs；diff 方向为 other_version_id → model_version_id）
      required: [id, model_version_id, other_version_id, diff, created_at]
      properties:
        id: { type: string, format: uuid, description: 差异记录 ID }
        model_version_id: { type: string, format: uuid, description: 目标模型版本 ID }
        other_version_id: { type: string, format: uuid, description: 对比基准版本 ID }
        diff: { $ref: '#/components/schemas/ApiSecSchemaDiff' }
        created_at: { type: string, format: date-time }

    # ---------- 参数模型（apimodels，51.3） ----------
    ApiSecParameter:
      type: object
      description: 参数模型（api_parameter_models；观测/推荐/确认三层约束）
      required:
        - id
        - model_version_id
        - direction
        - location
        - structured_path
        - parameter_name
        - base_type
        - semantic_type
        - required
        - nullable
        - empty_allowed
        - observed_constraints
        - recommended_constraints
        - confirmed_constraints
        - sensitivity_level
        - confidence
        - created_at
      properties:
        id: { type: string, format: uuid, description: 参数 ID }
        model_version_id: { type: string, format: uuid, description: 所属模型版本 ID }
        direction:
          type: string
          enum: [REQUEST, RESPONSE]
          description: 报文方向
        location:
          type: string
          enum: [QUERY, HEADER, BODY, PATH, COOKIE]
          description: 参数位置
        structured_path:
          type: string
          description: 结构化路径（BODY 点路径，如 items[].sku）
        parameter_name: { type: string, description: 参数名（结构化路径末段，去数组标记） }
        base_type:
          type: string
          enum: [string, number, bool, object, array, 'null']
          description: 基础类型（与网关解析器粗类型词表对齐）
        semantic_type: { type: string, description: 语义类型（可空串，如 phone/email） }
        required: { type: boolean, description: 是否必填（缺失产生 OBSERVE 级检测明细） }
        nullable: { type: boolean, description: 是否允许 null }
        empty_allowed: { type: boolean, description: 是否允许空值 }
        observed_constraints:
          type: object
          description: 观测约束（学习期观测，如 min_length/max_length/minimum/maximum/enum；固定格式候选使用 format_candidate 与 format_candidate_ratio，不进入确认约束或自动阻断）
        recommended_constraints:
          type: object
          description: 推荐约束（系统推荐，确认时整体拷贝给 confirmed_constraints）
        confirmed_constraints:
          type: object
          description: 确认约束（人工确认后生效，经发布通道下发网关；确认态以非空为准）
        sensitivity_level: { type: string, description: 敏感级别（如 UNKNOWN / LOW / MEDIUM / HIGH） }
        confidence: { type: number, format: double, description: 置信度（0-1） }
        created_at: { type: string, format: date-time }

    ApiSecParameterListResponse:
      type: object
      description: 参数分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecParameter' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecParameterUpdateRequest:
      type: object
      description: 参数确认约束编辑输入（全量写库：布尔缺省 false，constraints 缺省 {}，sensitivity_level 缺省 UNKNOWN）
      properties:
        required: { type: boolean, description: 是否必填 }
        nullable: { type: boolean, description: 是否允许 null }
        empty_allowed: { type: boolean, description: 是否允许空值 }
        confirmed_constraints:
          type: object
          description: 确认约束（钉死词汇：min_length/max_length/minimum/maximum/enum）
        sensitivity_level: { type: string, description: 敏感级别 }

    ApiSecParameterResponse:
      type: object
      required: [parameter, message]
      properties:
        parameter: { $ref: '#/components/schemas/ApiSecParameter' }
        message: { type: string, description: 操作结果提示 }

    # ---------- 用途分类（apisecurity，51.4） ----------
    ApiSecClassificationItem:
      type: object
      description: 内置分类（api_classifications）
      required: [id, code, name, description, is_builtin, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: 分类编码 }
        name: { type: string, description: 分类名称 }
        description: { type: string, description: 分类说明 }
        is_builtin: { type: boolean, description: 是否内置 }
        created_at: { type: string, format: date-time }

    ApiSecCustomTaxonomy:
      type: object
      description: 自定义分类法条目（api_custom_taxonomies）
      required: [id, dimension, value, description, created_at]
      properties:
        id: { type: string, format: uuid }
        dimension: { type: string, description: 分类维度（1-64 字符） }
        value: { type: string, description: 分类取值（1-128 字符） }
        description: { type: string, description: 说明 }
        created_by:
          type: string
          format: uuid
          nullable: true
          description: 创建人用户 ID（可空）
        created_at: { type: string, format: date-time }

    ApiSecClassificationListResponse:
      type: object
      description: 内置分类与自定义分类法合并视图
      required: [builtin, custom]
      properties:
        builtin:
          type: array
          items: { $ref: '#/components/schemas/ApiSecClassificationItem' }
        custom:
          type: array
          items: { $ref: '#/components/schemas/ApiSecCustomTaxonomy' }

    ApiSecClassificationCreateRequest:
      type: object
      required: [dimension, value]
      properties:
        dimension: { type: string, minLength: 1, maxLength: 64, description: 分类维度 }
        value: { type: string, minLength: 1, maxLength: 128, description: 分类取值 }
        description: { type: string, description: 说明（可选） }

    ApiSecEndpointDimensionInput:
      type: object
      required: [dimension, value]
      properties:
        dimension: { type: string, minLength: 1, maxLength: 64, description: 分类维度（同一请求内不可重复） }
        value: { type: string, minLength: 1, maxLength: 128, description: 分类取值 }

    ApiSecEndpointClassificationRequest:
      type: object
      required: [dimensions]
      properties:
        dimensions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ApiSecEndpointDimensionInput' }
          description: 待覆盖的分类维度列表（非空）

    ApiSecEndpointDimension:
      type: object
      description: 接口当前分类维度（apisecurity 手动分类读取结果，api_classification_dimensions）
      required: [dimension, value, source, confidence]
      properties:
        dimension: { type: string, description: 分类维度 }
        value: { type: string, description: 分类取值 }
        source: { type: string, enum: [AUTO, MANUAL], description: 分类来源 }
        confidence: { type: number, format: double, description: 置信度（手动分类固定为 1） }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 最近更新时间（可空）

    ApiSecEndpointClassificationResponse:
      type: object
      required: [endpoint_id, classification_locked, dimensions]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        classification_locked: { type: boolean, description: 分类锁定标记（手动分类后固定为 true） }
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/ApiSecEndpointDimension' }

    # ---------- 调用图谱 / 拓扑（apisecurity，51.4） ----------
    ApiSecGraphNode:
      type: object
      description: 图谱节点（接口摘要）
      required: [id, endpoint_key, http_method, normalized_path, asset_status, learning_status, hit_count]
      properties:
        id: { type: string, format: uuid, description: 接口 ID }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」） }
        http_method: { type: string, description: HTTP 方法 }
        normalized_path: { type: string, description: 归一化路径模板 }
        application_id:
          type: string
          format: uuid
          nullable: true
          description: 所属站点 ID（未归属时缺省或为 null）
        asset_status:
          type: string
          enum: [DISCOVERED, CONFIRMED, IGNORED, DEPRECATED]
          description: 资产状态
        learning_status:
          type: string
          enum: [NOT_STARTED, LEARNING, PAUSED, LEARNED]
          description: 学习状态
        hit_count: { type: integer, format: int64, description: 累计命中次数 }
        open_findings_count: { type: integer, format: int64, description: 未闭环风险发现数（活动状态 NEW/CONFIRMED/IN_PROGRESS） }

    ApiSecGraphEdge:
      type: object
      description: 调用边（api_call_edges）
      required: [id, caller_fingerprint, target_endpoint_id, call_count, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid, description: 边 ID }
        caller_fingerprint: { type: string, description: 调用方指纹 }
        source_endpoint_id:
          type: string
          format: uuid
          nullable: true
          description: 源接口 ID（可空，外部调用无源接口）
        target_endpoint_id: { type: string, format: uuid, description: 目标接口 ID }
        call_count: { type: integer, format: int64, description: 调用次数 }
        identity_count: { type: integer, format: int64, description: 身份计数（近似下界：每 caller 首见该边计 1，重复经过不累加；迁移 000067） }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    ApiSecGraph:
      type: object
      description: API 调用图谱
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ApiSecGraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/ApiSecGraphEdge' }

    ApiSecTopologyGroup:
      type: object
      description: 按站点分组的接口树节点
      required: [application_name, endpoints]
      properties:
        application_id:
          type: string
          format: uuid
          nullable: true
          description: 站点 ID（未归属组缺省或为 null）
        application_name: { type: string, description: 站点名称（未归属组为「未分组」） }
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/ApiSecGraphNode' }

    ApiSecTopology:
      type: object
      description: API 调用拓扑（站点分组接口树 + 调用边）
      required: [applications, edges]
      properties:
        applications:
          type: array
          items: { $ref: '#/components/schemas/ApiSecTopologyGroup' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/ApiSecGraphEdge' }

    # ---------- 规范导入（apisecurity，51.5） ----------
    ApiSecSpecImportRequest:
      type: object
      description: >-
        两种形式二选一：① 规范文档原文（顶层含 openapi: "3.x" 或 swagger: "2.0" 字段，
        Swagger 2.0 自动转换为 OpenAPI 3）；② 包装形式（顶层无版本声明字段时按包装解析）：
        spec 为文档对象，file_name/name 可选。仅支持 JSON；请求体上限 16MiB。
      properties:
        openapi: { type: string, example: '3.0.3', description: 形式①：OpenAPI 版本声明（须为 3.x） }
        swagger: { type: string, example: '2.0', description: 形式①：Swagger 版本声明（须为 "2.0"） }
        paths: { type: object, description: 形式①：规范 paths 对象（非空） }
        spec: { type: object, description: 形式②：规范文档对象（包装形式时必填） }
        file_name: { type: string, description: 形式②：可选文件名 }
        name: { type: string, description: 形式②：可选规范名称（缺省取文件名/info.title/内容哈希兜底） }

    ApiSecImportSpec:
      type: object
      description: 导入的 API 规范（api_import_specs，同名版本链；列表/详情响应不含 spec_json 大字段）
      required: [id, name, version_no, status, format, file_name, content_hash, endpoint_count, created_at]
      properties:
        id: { type: string, format: uuid, description: 规范版本 ID }
        name: { type: string, description: 规范名称（同名构成版本链） }
        version_no: { type: integer, description: 版本号（同名链内自增） }
        status:
          type: string
          enum: [DRAFT, ACTIVE, HISTORICAL, INVALID, ARCHIVED]
          description: 版本状态（同名唯一 ACTIVE；被新版取代降 HISTORICAL；DRAFT/INVALID/ARCHIVED 为预留）
        parent_id: { type: string, format: uuid, nullable: true, description: 上一版本 ID（首版本为 null） }
        activated_at: { type: string, format: date-time, nullable: true, description: 激活时间（ACTIVE 版本） }
        format:
          type: string
          enum: [openapi3, swagger2]
          description: 规范格式（Swagger 2.0 导入后按 OpenAPI 3 规范化落库）
        file_name: { type: string, description: 文件名（未提供时为空串） }
        content_hash: { type: string, description: 规范化内容哈希（SHA-256，十六进制） }
        spec_json:
          type: object
          description: 规范化后的规范文档（仅导入响应附带；列表/详情不含）
        endpoint_count: { type: integer, description: 解析出的接口数 }
        imported_by:
          type: string
          format: uuid
          nullable: true
          description: 导入人用户 ID（可空）
        created_at: { type: string, format: date-time, description: 导入时间 }

    ApiSecSpecImportResponse:
      type: object
      required: [spec, missing_in_runtime, missing_in_spec, changed, registered_endpoints]
      properties:
        spec: { $ref: '#/components/schemas/ApiSecImportSpec' }
        missing_in_runtime: { type: integer, description: 规范有而运行时无的接口数 }
        missing_in_spec: { type: integer, description: 运行时有而规范无的接口数（潜在 Shadow API） }
        changed: { type: integer, description: 同名跨版本 CHANGED 级变化数（首版本为 0） }
        registered_endpoints: { type: integer, description: 本次幂等登记为候选的规范端点数 }

    ApiSecImportSpecListResponse:
      type: object
      description: 规范分页响应（统一分页结构；items 不含 spec_json）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecImportSpec' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecSpecDiff:
      type: object
      description: 规范与运行时对比差异（api_spec_diffs）
      required: [id, spec_id, diff_type, endpoint_key, detail, created_at]
      properties:
        id: { type: string, format: uuid, description: 差异记录 ID }
        spec_id: { type: string, format: uuid, description: 所属规范 ID }
        diff_type:
          type: string
          enum: [MISSING_IN_RUNTIME, MISSING_IN_SPEC, CHANGED]
          description: 差异类型（规范有而运行时无 / 运行时有而规范无 / 同名跨版本参数、类型或 required 变化）
        endpoint_key: { type: string, description: 接口键（「METHOD 路径」） }
        detail:
          type: object
          description: >-
            差异明细（MISSING_IN_RUNTIME 为 {method, path}；MISSING_IN_SPEC 为 {endpoint_key}；
            CHANGED 为 ApiSecSpecChange 对象）
        created_at: { type: string, format: date-time }

    ApiSecSpecDiffResponse:
      type: object
      required: [spec, diffs]
      properties:
        spec: { $ref: '#/components/schemas/ApiSecImportSpec' }
        diffs:
          type: array
          items: { $ref: '#/components/schemas/ApiSecSpecDiff' }

    ApiSecSpecAuditItem:
      type: object
      description: 规范声明与鉴权安全审计发现；仅含参数名或认证方案名和定位元数据，不含参数值或 API Key 值
      required: [rule_id, severity, endpoint_key, param_in, param_name, message]
      properties:
        rule_id:
          type: string
          enum: [PATH_PARAMETER_MISSING, PATH_PARAMETER_NOT_REQUIRED, PATH_PARAMETER_UNDECLARED, SENSITIVE_QUERY_PARAMETER, SUCCESS_RESPONSE_MISSING, ERROR_RESPONSE_MISSING, SECURITY_SCHEME_UNDEFINED, API_KEY_IN_QUERY]
          description: 确定性审计规则 ID
        severity: { type: string, enum: [HIGH, MEDIUM], description: 严重级别 }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径」） }
        param_in: { type: string, enum: ['', PATH, QUERY], description: 参数位置；API_KEY_IN_QUERY 固定 QUERY，响应声明与 SECURITY_SCHEME_UNDEFINED 固定为空字符串 }
        param_name: { type: string, description: 参数名、缺失的路径占位名或认证方案名；响应声明规则固定为空字符串 }
        message: { type: string, description: 规则命中说明 }

    ApiSecSpecAuditResponse:
      type: object
      required: [spec_id, format, operation_count, issue_count, high_count, medium_count, items, truncated]
      properties:
        spec_id: { type: string, format: uuid, description: 被审计的规范版本 ID }
        format: { type: string, description: 导入时识别的规范格式 }
        operation_count: { type: integer, minimum: 0, description: 重新解析得到的操作数 }
        issue_count: { type: integer, minimum: 0, description: 完整发现总数（不受 items 截断影响） }
        high_count: { type: integer, minimum: 0, description: 完整发现中的 HIGH 数量 }
        medium_count: { type: integer, minimum: 0, description: 完整发现中的 MEDIUM 数量 }
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ApiSecSpecAuditItem' }
          description: 按 endpoint_key、rule_id、param_name 稳定排序的发现；无问题时为空数组
        truncated: { type: boolean, description: 完整发现数是否超过 items 的 500 条上限 }

    # ---------- 风险与运行时（apisecurity，51.6） ----------
    ApiSecFinding:
      type: object
      description: >-
        运行时风险发现（api_runtime_findings）。列表响应仅含基础列；
        subject_type/subject_id/risk_score/risk_level/count/evidence/model_version/policy_version/updated_at
        为 000036 富化物化列，仅详情与处置流转响应返回
      required:
        - id
        - endpoint_key
        - request_id
        - finding_type
        - severity
        - status
        - title
        - detail
        - first_seen_at
        - last_seen_at
        - created_at
      properties:
        id: { type: string, format: uuid, description: 发现 ID }
        endpoint_id:
          type: string
          format: uuid
          nullable: true
          description: 关联接口 ID（接口已删除或未匹配时缺省或为 null）
        endpoint_key: { type: string, description: 关联接口键（LEFT JOIN 带出；未匹配时为空串） }
        request_id: { type: string, description: 首次命中请求 ID（dedup upsert 只保留首次，后续命中仅计数） }
        finding_type:
          type: string
          description: 发现类型（SHADOW / ZOMBIE / DEPRECATED / BOLA / BFLA / SCHEMA_DEVIATION / SENSITIVE_LEAK 等）
        severity:
          type: string
          enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
          description: 严重级别
        status:
          type: string
          enum: [NEW, CONFIRMED, IN_PROGRESS, RESOLVED, FALSE_POSITIVE, IGNORED, ARCHIVED]
          description: 处置状态（七态词表，见迁移 000042；ARCHIVED 为终态）
        title: { type: string, description: 标题 }
        detail: { type: object, description: 首次命中上下文（detector/rule_id 等）；处置后合并 detail.handling 处置记录 }
        subject_type: { type: string, description: 主体类型（如 IDENTITY / IP；无主体信息时为空串） }
        subject_id: { type: string, description: 主体标识（身份指纹或来源指纹，永不落明文） }
        risk_score:
          type: integer
          nullable: true
          description: 风险分（0-100；生产方未评分时缺省或为 null）
        risk_level: { type: string, description: 风险等级词表（与 api_runtime_events risk_level 同源） }
        count: { type: integer, description: 同指纹累计命中次数（dedup 计数） }
        evidence: { type: object, description: 证据（生产方落库时已脱敏：字段名/粗类型词表/约束名） }
        model_version: { type: string, description: 命中时模型版本号 }
        policy_version: { type: string, description: 命中时策略版本号 }
        first_seen_at: { type: string, format: date-time, description: 首次发现时间 }
        last_seen_at: { type: string, format: date-time, description: 最近发现时间 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true, description: 最近处置时间（未处置为 null） }

    ApiSecFindingListResponse:
      type: object
      description: 风险发现分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecFinding' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecViolation:
      type: object
      description: Schema 违例记录（api_schema_violations）
      required:
        - id
        - request_id
        - violation_type
        - field_path
        - expected
        - observed
        - action_taken
        - occurred_at
      properties:
        id: { type: string, format: uuid, description: 违例 ID }
        endpoint_id:
          type: string
          format: uuid
          nullable: true
          description: 关联接口 ID（可空）
        model_version_id:
          type: string
          format: uuid
