          in: query
          required: true
          schema: { type: string, format: uuid }
          description: 应用ID；缺失或非法 UUID 返回 400
        - name: hits_window
          in: query
          required: false
          schema: { type: integer, default: 168, minimum: 1, maximum: 2160 }
          description: 命中统计窗口（小时，1-2160，缺省 168=7 天）；非数字/越界返回 400
      responses:
        '200':
          description: 准入覆盖率报告
          content:
            application/json:
