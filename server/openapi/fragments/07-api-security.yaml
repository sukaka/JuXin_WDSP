          in: query
          required: false
          schema: { type: integer, default: 168, minimum: 1, maximum: 2160 }
          description: 统计窗口（小时，1-2160，缺省 168=7 天）；非数字/越界返回 400
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 每页条数（上限 100）
      responses:
        '200':
