        - name: endpoint_key
          in: query
          required: false
          schema: { type: string, maxLength: 560 }
          description: 接口键精确匹配（超过 560 字符返回 400）
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
          description: 明细分页页码（非正数归一为 1）
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
          description: 明细分页每页条数（非正数归一 20，大于 100 归一 100）
      responses:
        '200':
          description: 看板聚合 + 明细分页组合响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSecCrossBorderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== AI 定时运营任务（apiops，迁移 000062/000063） ====================
  /api-security/ai-ops/task-types:
    get:
      operationId: apiSecAIOpsTaskTypeList
      tags: [api-security]
      summary: AI 运营任务类型词表
      description: >-
        返回内置五种任务类型的词表与说明（API_ASSET_DIGEST 资产变化摘要 / SHADOW_REVIEW Shadow API 运营 /
        WEAKNESS_FOLLOW 弱点整改跟进 / RISK_DIGEST 高风险发现摘要 / SENSITIVE_DIGEST 涉敏概览变化；
        与迁移 000062 CHECK 一致，非自由文本）。任务只产出报告与建议文本，不执行任何业务变更。
        权限：`api_ai.read`
      responses:
        '200':
          description: 任务类型清单（data 为 {items} 包装）
