        '500': { $ref: '#/components/responses/InternalError' }

  /api-security/weaknesses/{id}/retest:
    post:
      operationId: apiSecWeaknessRetest
      tags: [api-security]
      summary: 弱点复测
      description: >-
        复测整改结果：result=PASS → ARCHIVED（复测通过关闭）；result=FAIL → REPRODUCED（复测未通过，
        可重新指派整改）；仅 FIXED 状态可复测，记录 retested_at；result 取值外返回 400。
