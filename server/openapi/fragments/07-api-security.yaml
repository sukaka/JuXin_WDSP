    ApiSecObjectModel:
      type: object
      description: 对象模型（api_object_models；endpoint × object_segment 一行，apiauthz SweepObjectModelsOnce 清扫写入）
      required:
        - id
        - endpoint_id
        - endpoint_key
        - object_segment
        - identifier_type
        - example_hash
        - sample_count
        - first_seen
        - last_seen
        - updated_at
      properties:
        id: { type: string, format: uuid, description: 对象模型行 ID }
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        endpoint_key: { type: string, description: 接口键（LEFT JOIN api_endpoints 带出；端点已删除时为空串） }
        object_segment: { type: string, description: 对象段键（"path:<pos>" 路径占位段 / "query:<参数名>" Query 对象参数） }
        identifier_type: { type: string, description: 标识形态（numeric / uuid / hash / mixed / unknown） }
        example_hash: { type: string, description: 观测值 SHA-256 示例哈希（不落明文） }
        sample_count: { type: integer, format: int64, description: 观测样本计数（每事件每段 +1） }
        first_seen: { type: string, format: date-time, description: 首次观测时间（事件 occurred_at，乱序取小不回头） }
        last_seen: { type: string, format: date-time, description: 末次观测时间（兼任 sweep 水位列） }
        updated_at: { type: string, format: date-time, description: 行最近更新时间 }
        publishable: { type: boolean, description: 发布资格（NG-AZ-02 D5/D7；PATCH 可变更） }
        required_relation: { type: string, enum: ['', OWNER, ANY_OF], description: 要求关系语义；OWNER=旧排他属主，ANY_OF=required_relations 中任一关系；空串=未声明 }
        required_relations: { type: array, items: { type: string, enum: [OWNER, SHARED_WITH] }, description: "仅 ANY_OF 返回的规范化数组 [OWNER,SHARED_WITH]；旧 OWNER 模型省略本字段" }
        owner_exclusive: { type: boolean, description: 排他所有权（VERIFIED_VIOLATION 语义前提；publishable=true 要求为 true，ANY_OF 不放松） }
        on_lease_expired: { type: string, enum: [strict, degraded], description: 租约过期策略（NG-AZ-02 D5；缺省 strict） }
        enforcement: { type: string, enum: [OBSERVE, PROTECT], description: 阻断开关（NG-AZ-03 D3；缺省 OBSERVE——未配置行为与历史版本一致） }
        enforcement_owner: { type: string, maxLength: 128, description: §8.4 业务负责人标识（切换 PROTECT 必填非空；切回 OBSERVE 后保留供审计） }
        evidence_source: { type: string, enum: ['', AUTHORITY_SYNC, MANUAL_CONFIRMED], description: §8.4 证据来源声明（切换 PROTECT 必填；空串=未声明） }
        on_unknown: { type: string, enum: [ALLOW_UNKNOWN], description: §8.4 UNKNOWN 处理方式声明（首批仅 ALLOW_UNKNOWN——UNKNOWN 永不阻断） }

    ApiSecObjectModelPatchRequest:
      type: object
      description: 对象模型发布状态变更（全部字段三分态——缺省不变更；词表外取值 400 不降级猜义。ANY_OF 必须与 required_relations 同请求提供，输入去重并规范化为 [OWNER,SHARED_WITH]；OWNER 不允许非空数组。切换 enforcement=PROTECT 仍须同请求提供 enforcement_owner/evidence_source/on_unknown/confirm_token，既有资格不放松）
      properties:
        publishable: { type: boolean, description: 发布资格（为 true 时 owner_exclusive 必须同批为 true） }
        required_relation: { type: string, enum: [OWNER, ANY_OF, owner, any_of], description: OWNER=旧模型；ANY_OF=对象共享复杂模型（须同请求携带 required_relations） }
        required_relations: { type: array, items: { type: string, enum: [OWNER, SHARED_WITH, owner, shared_with] }, description: "仅与 required_relation=ANY_OF 同请求使用；必须同时含 OWNER/SHARED_WITH，大小写归一、去重并固定为 [OWNER,SHARED_WITH]；OWNER 模型省略或传空数组" }
        owner_exclusive: { type: boolean, description: 排他所有权（ANY_OF/PROTECT 既有资格不放松） }
        on_lease_expired: { type: string, enum: [strict, degraded], description: 租约过期策略（缺省 strict） }
        enforcement: { type: string, enum: [OBSERVE, PROTECT], description: 阻断开关（切换 PROTECT 须同请求提供三要素） }
        enforcement_owner: { type: string, maxLength: 128, description: §8.4 业务负责人标识（PROTECT 必填非空 ≤128） }
        evidence_source: { type: string, enum: [AUTHORITY_SYNC, MANUAL_CONFIRMED], description: §8.4 证据来源声明（PROTECT 必填） }
        on_unknown: { type: string, enum: [ALLOW_UNKNOWN], description: §8.4 UNKNOWN 处理方式声明（PROTECT 必填；首批仅 ALLOW_UNKNOWN） }
        confirm_token: { type: string, description: 业务确认单一次性令牌（NG-AZ-04 D4：切换 PROTECT 必填——经影响评估签发并签署，同一事务内校验+切换+消费；切回 OBSERVE 免） }

    ApiSecObjectModelListResponse:
      type: object
      description: 对象模型分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecObjectModel' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecIdentityProfile:
      type: object
      description: 身份画像（api_identity_profiles；身份指纹 × 端点一行，aggregations 小时级离线聚合写入）
      required: [identity_fingerprint, endpoint_id, auth_type, request_count, first_seen_at, last_seen_at, quality_score]
      properties:
        identity_fingerprint: { type: string, description: 身份指纹（仅凭据派生，不存明文凭据） }
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        endpoint_key: { type: string, description: 接口键（LEFT JOIN api_endpoints 带出；端点已删除时缺省） }
        auth_type: { type: string, description: 认证方式（空串 = 未识别） }
        request_count: { type: integer, format: int64, description: 累计请求数 }
        first_seen_at: { type: string, format: date-time, description: 首次出现时间 }
        last_seen_at: { type: string, format: date-time, description: 最近出现时间 }
        quality_score:
          type: integer
          minimum: 0
          maximum: 100
          description: 身份质量分（综合认证类型 / 请求量 / 存活跨度，越高越像正常稳定身份；SOC 排序用，不阻断）

    ApiSecIdentityProfileListResponse:
      type: object
      description: 身份画像分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecIdentityProfile' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecIdentityRiskIndicators:
      type: object
      description: 威胁识别指标（GB/T 31509 修订稿 5.2.3 威胁频率：数量 / 时间分布 / 严重程度；全部来自 api_runtime_events 真实计数）
      required: [events_total, events_24h, risky_events_total, blocked_events_total, distinct_endpoints, active_days, max_risk_score]
      properties:
        events_total: { type: integer, format: int64, description: 该指纹运行时事件总数 }
        events_24h: { type: integer, format: int64, description: 近 24h 事件数（时间分布密度） }
        risky_events_total: { type: integer, format: int64, description: 高危事件数（risk_level HIGH/CRITICAL） }
        blocked_events_total: { type: integer, format: int64, description: 已被拦截事件数（final_action BLOCK/TEMP_BLOCK，安全措施有效性证据） }
        distinct_endpoints: { type: integer, format: int64, description: 触达端点数 }
        active_days: { type: integer, description: 活跃跨度（首见 → 最近见，天） }
        max_risk_score: { type: integer, description: 历史最高单事件风险分（0-100） }

    ApiSecIdentityRiskAssessment:
      type: object
      description: >-
        身份风险评估（GB/T 31509 修订稿 5.3.3 定性矩阵法：可能性 × 严重程度 → 五级）；
        只产信号用于 SOC 研判，不直接阻断
      required: [level, likelihood, severity, indicators, summary]
      properties:
        level:
          type: string
          enum: [VERY_LOW, LOW, MEDIUM, HIGH, VERY_HIGH]
          description: 风险级别（5×5 矩阵定级）
        likelihood:
          type: integer
          minimum: 1
          maximum: 5
          description: 威胁频率 → 可能性赋值（高危事件分档；24h 密集上调一档、全数拦截消减一档）
        severity:
          type: integer
          minimum: 1
          maximum: 5
          description: 事件严重程度赋值（历史最高单事件风险分五档）
        indicators: { $ref: '#/components/schemas/ApiSecIdentityRiskIndicators' }
        summary: { type: string, description: 中文一句话评估结论 }

    ApiSecIdentityProfileDetailResponse:
      type: object
      description: 身份画像详情（data 即本对象：画像 + 风险评估 + 近期事件）
      required: [profile, risk, recent_events]
      properties:
        profile: { $ref: '#/components/schemas/ApiSecIdentityProfile' }
        risk: { $ref: '#/components/schemas/ApiSecIdentityRiskAssessment' }
        recent_events:
          type: array
          items: { $ref: '#/components/schemas/ApiSecRuntimeEvent' }
          description: 该指纹最近 10 条运行时事件（occurred_at 倒序）

    ApiSecModelMaturity:
      type: object
      description: 单个微模型成熟度评估（summary 为中文一句话，供前端直接展示）
      required: [key, name, stage, metrics, summary]
      properties:
        key:
          type: string
          enum: [parameter, identity, access_env, access_object]
          description: 模型键（参数 / 身份 / 访问·环境维度 / 访问·对象维度）
        name: { type: string, description: 模型中文名 }
        stage:
          type: string
          enum: [LEARNING, CANDIDATE, CONFIRMED, ENFORCING]
          description: 成熟度阶段（ENFORCING 仅参数微模型可达；身份/访问模型只产信号不阻断）
        metrics:
          type: object
          additionalProperties: true
          description: >-
            推导依据指标（真实表计数聚合，各模型键不同：如 parameters_total / with_recommended /
            enforced_formal_constraints、events_24h / identity_coverage_24h、profiles_total /
            endpoint_coverage、object_models_total / endpoints_with_object_models /
            object_endpoint_coverage / resource_signal_events_24h）
        summary: { type: string, description: 中文一句话摘要 }

    ApiSecModelMaturityReport:
      type: object
      description: 四微模型成熟度总览（全部从真实表计数推导，只读无写入口）
      required: [generated_at, models]
      properties:
        generated_at: { type: string, format: date-time, description: 报告生成时间（UTC） }
        models:
          type: array
          items: { $ref: '#/components/schemas/ApiSecModelMaturity' }
          description: 四个微模型成熟度（固定顺序：parameter / identity / access_env / access_object）

    ApiSecSensitiveField:
      type: object
      description: 敏感字段识别结果（api_sensitive_fields）
      required:
        - id
        - endpoint_id
        - endpoint_key
        - direction
        - structured_path
        - data_type
        - confidence
        - detection_source
        - occurrence_count
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid, description: 记录 ID }
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        endpoint_key: { type: string, description: 接口键（METHOD PATH；端点缺失时为空串） }
        direction:
          type: string
          enum: [REQUEST, RESPONSE]
          description: 报文方向
        structured_path: { type: string, description: 结构化字段路径 }
        data_type:
          type: string
          description: 敏感数据类型（phone / id_card / bank_card / email / credential 等）
        confidence:
          type: number
          format: double
          description: 识别置信度（0-1；字段名词表命中 0.8，值级正则验证命中 1.0，重复命中取较大者）
        detection_source:
          type: string
          enum: [AUTO, MANUAL]
          description: 识别来源
        occurrence_count: { type: integer, description: 累计命中次数 }
        first_seen: { type: string, format: date-time, nullable: true, description: 首次发现时间 }
        last_seen: { type: string, format: date-time, nullable: true, description: 最近发现时间 }
        source_detail:
          type: object
          nullable: true
          description: 最近一次命中摘要（location / rule_id / event_id / data_type）
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecSensitiveFieldListResponse:
      type: object
      description: 敏感字段分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecSensitiveField' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecSensitiveFieldBatchDeleteRequest:
      type: object
      description: 敏感字段批量删除请求
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
          description: 待删除记录 ID（1-500 条；含非法 UUID 返回 400）

    ApiSecSensitiveFieldBatchDeleteResponse:
      type: object
      description: 敏感字段批量删除结果
      required: [message, deleted]
      properties:
        message: { type: string, description: 结果描述 }
        deleted: { type: integer, format: int64, description: 实际删除条数（部分 ID 不存在不计错误） }

    # ---------- 防护策略（apisecurity） ----------
    ApiSecPolicyLimits:
      type: object
      description: 网关解析限制
      required: [max_body_parse_bytes, max_body_sample_bytes, max_json_depth, max_field_count]
      properties:
        max_body_parse_bytes: { type: integer, description: 请求体最大解析字节数 }
        max_body_sample_bytes: { type: integer, description: 请求体最大采样字节数 }
        max_json_depth: { type: integer, description: JSON 最大解析深度 }
        max_field_count: { type: integer, description: 单请求最大字段数 }

    ApiSecPolicy:
      type: object
      description: API 动态防护策略视图
      required: [edition, api_dynamic_protection, mode, mode_source, limits]
      properties:
        edition: { type: string, description: 产品形态（版本 edition） }
        api_dynamic_protection: { type: boolean, description: API 动态防护能力开关 }
        mode:
          type: string
          enum: [OFF, OBSERVE, PROTECT]
          description: 生效防护模式
        mode_source:
          type: string
          enum: [env, db, default]
          description: 模式来源（settings 表覆盖 > 环境变量 > 内置默认）
        limits: { $ref: '#/components/schemas/ApiSecPolicyLimits' }

    ApiSecPolicyUpdateRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [OFF, OBSERVE, PROTECT]
          description: 防护模式（自动转大写；其他取值返回 400）

    ApiSecPolicyResponse:
      type: object
      required: [policy, message]
      properties:
        policy: { $ref: '#/components/schemas/ApiSecPolicy' }
        message: { type: string, description: 操作结果提示 }

    ApiSecPolicyPublishResponse:
      type: object
      required: [task_id, status, message]
      properties:
        task_id: { type: string, description: 发布任务 ID }
        status: { type: string, example: SUCCESS, description: 发布最终状态（如 SUCCESS / FAILED） }
        message: { type: string, description: 操作结果提示 }

    # ---------- 参数关系与批量确认（apimodels） ----------
    ApiSecParameterRelation:
      type: object
      description: 参数条件关系（api_parameter_relations；只有 confirmed=true 的关系经发布下发网关参与强制检测）
      required: [id, source_parameter_id, target_parameter_id, relation_type, confidence, condition, confirmed]
      properties:
        id: { type: string, format: uuid, description: 关系 ID }
        model_version_id: { type: string, format: uuid, description: 所属模型版本 ID }
        source_parameter_id: { type: string, format: uuid, description: 源参数 ID }
        target_parameter_id: { type: string, format: uuid, description: 目标参数 ID }
        relation_type: { type: string, enum: [CO_OCCURS, REQUIRES, MUTEX, EXCLUDES, EQUALS, NOT_EQUALS, GREATER_THAN, LESS_THAN, TIME_BEFORE, TIME_AFTER, COUNT_MATCHES, SUM_MATCHES], description: 关系类型 }
        confidence: { type: number, format: double, description: 置信度（0-1，候选默认 0.3） }
        condition: { type: object, description: "关系条件（候选为 {}）" }
        confirmed: { type: boolean, description: 是否已确认（确认后随发布下发网关） }
        confirmed_by: { type: string, format: uuid, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ApiSecParameterRelationResponse:
      type: object
      required: [relation]
      properties:
        relation: { $ref: '#/components/schemas/ApiSecParameterRelation' }
        message: { type: string }

    ApiSecParameterRelationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecParameterRelation' }

    ApiSecParameterConfirmBatchRequest:
      type: object
      description: 批量确认输入；ids 缺省或为空数组时作用于版本内全部带推荐约束的参数
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
          description: 参数 ID 列表（非法 UUID 返回 400）

    ApiSecParameterConfirmBatchResponse:
      type: object
      required: [confirmed, skipped, message]
      properties:
        confirmed: { type: integer, description: 成功确认条数 }
        skipped: { type: integer, description: 跳过条数（推荐为空或参数不存在） }
        message: { type: string, description: 操作结果提示 }

    # ---------- 运行时策略版本（apimodels，api_runtime_policies） ----------
    ApiSecRuntimePolicy:
      type: object
      description: 端点级运行时策略版本（api_runtime_policies；Compiler 编译产物，随整站发布生效）
      required: [id, endpoint_id, endpoint_key, source_model_version_id, runtime_version, compiler_version, content, content_hash, status, created_at]
      properties:
        id: { type: string, format: uuid, description: 策略 ID }
        endpoint_id: { type: string, format: uuid, description: 所属接口 ID }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」，JOIN 带出） }
        source_model_version_id: { type: string, format: uuid, description: 源模型版本 ID（编译溯源） }
        runtime_version: { type: string, example: v3, description: 端点内自增运行时版本号（vN） }
        compiler_version: { type: string, description: 编译器版本 }
        content:
          type: object
          description: 编译产物（CompiledEndpointPolicy 规范序列化：schema/参数 confirmed 约束等）
        content_hash: { type: string, description: 编译内容哈希（sha256 十六进制） }
        status:
          type: string
          enum: [DRAFT, VALIDATED, PUBLISHED, ACTIVE, ROLLED_BACK, FAILED]
          description: 策略状态（DRAFT 编译产生 / VALIDATED 待发布 / ACTIVE 生效中 / ROLLED_BACK 曾生效退出 / FAILED 发布失败）
        error: { type: string, description: 发布失败原因（仅 FAILED 状态非空） }
        created_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time, nullable: true, description: 发布时间（未发布为 null） }
        activated_at: { type: string, format: date-time, nullable: true, description: 生效时间（未生效为 null） }

    ApiSecRuntimePolicyListResponse:
      type: object
      description: 运行时策略分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecRuntimePolicy' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecModelRuntimePolicyListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecRuntimePolicy' }

    ApiSecRuntimePolicyRollbackResponse:
      type: object
      required: [policy, task_id, status, message]
      properties:
        policy: { $ref: '#/components/schemas/ApiSecRuntimePolicy' }
        task_id: { type: string, description: 重触发的整站发布任务 ID }
        status: { type: string, example: SUCCESS, description: 发布最终状态（如 SUCCESS / FAILED） }
        message: { type: string, description: 操作结果提示 }

    # ---------- 风险发现汇总与处置（apisecurity 风险中心，七态状态机见迁移 000042） ----------
    ApiSecRiskSummaryBucket:
      type: object
      description: 风险降噪聚合桶（三视图共用；按视图取用相应维度字段，其余缺省）
      required: [count, hits, max_severity, last_seen_at]
      properties:
        subject_type: { type: string, description: 主体类型（by_subject 视图） }
        subject_id: { type: string, description: 主体标识/身份指纹（by_subject 视图） }
        endpoint_id: { type: string, format: uuid, nullable: true, description: 接口 ID（by_endpoint 视图；未解析为 null） }
        endpoint_key: { type: string, description: 接口键（by_endpoint 视图；端点已删除时为空串） }
        finding_type: { type: string, description: 发现类型（by_finding_type 视图） }
        count: { type: integer, format: int64, description: 聚合的 finding 条目数（dedup 去重后） }
        hits: { type: integer, format: int64, description: 累计命中次数（sum(count)） }
        max_severity: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL], description: 桶内最高严重度 }
        last_seen_at: { type: string, format: date-time, description: 桶内最近命中时间 }

    ApiSecFindingSummary:
      type: object
      description: 风险发现降噪聚合（主体/端点/类型三视图，各按最高严重度+累计命中排序取头部 100 桶）
      required: [by_subject, by_endpoint, by_finding_type]
      properties:
        by_subject:
          type: array
          items: { $ref: '#/components/schemas/ApiSecRiskSummaryBucket' }
          description: 主体视图（subject_type/subject_id 可空：无主体信息的发现聚为匿名桶）
        by_endpoint:
          type: array
          items: { $ref: '#/components/schemas/ApiSecRiskSummaryBucket' }
          description: 端点视图（endpoint_id 可空：端点未解析的发现聚为 null 桶）
        by_finding_type:
          type: array
          items: { $ref: '#/components/schemas/ApiSecRiskSummaryBucket' }
          description: 类型视图

    ApiSecFindingNoteRequest:
      type: object
      description: 仅备注的处置输入（confirm/start/ignore/archive；body 可整体省略）
      properties:
        note: { type: string, maxLength: 512, description: 处置备注（可选，≤512 字符） }

    ApiSecFindingResolveRequest:
      type: object
      description: 解决处置输入（resolution 必填）
      required: [resolution]
      properties:
        resolution: { type: string, maxLength: 512, description: 处置说明（必填，≤512 字符，如整改措施/修复结论） }

    ApiSecFindingFalsePositiveRequest:
      type: object
      description: 误报处置输入（reason 必填）
      required: [reason]
      properties:
        reason: { type: string, maxLength: 512, description: 误报原因（必填，≤512 字符） }

    ApiSecFindingResponse:
      type: object
      required: [finding]
      properties:
        finding: { $ref: '#/components/schemas/ApiSecFinding' }

    ApiSecFindingDetailResponse:
      type: object
      required: [finding, related_request_ids, related_request_note]
      properties:
        finding: { $ref: '#/components/schemas/ApiSecFinding' }
        related_request_ids:
          type: array
          items: { type: string }
          description: 同端点（IDENTITY 主体附带身份指纹）近期运行时事件的 request_id（最多 20 条，occurred_at 倒序）
        related_request_note: { type: string, description: 关联口径说明（近似关联，非精确命中回放） }

    # ---------- 弱点中心（apiweakness，api_weaknesses） ----------
    ApiSecWeakness:
      type: object
      description: API 弱点（api_weaknesses；派生扫描归集，全生命周期流转）
      required: [id, endpoint_key, weakness_code, weakness_name, category, severity, status, evidence, first_seen, last_seen, trigger_count, owner, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: 弱点 ID }
        endpoint_id: { type: string, format: uuid, nullable: true, description: 所属接口 ID（可空，缺省时为 null） }
        endpoint_key: { type: string, description: 接口键（LEFT JOIN 带出；端点已删除时为空串） }
        weakness_code:
          type: string
          enum: [UNAUTHENTICATED_SENSITIVE_API, DEPRECATED_STILL_CALLED, SENSITIVE_IN_QUERY, CREDENTIAL_IN_URL, SENSITIVE_COOKIE, SERVER_INFO_DISCLOSURE, OBJECT_ENUMERATION_RISK, FLOW_SEQUENCE_DEVIATION, FLOW_REPLAY_OR_BURST, FILE_CONTENT_TYPE_MISMATCH, SENSITIVE_FILE_CONTENT, SCHEMA_DRIFT_PERSISTENT]
          description: 弱点码（派生规则标识，可扩展）
        weakness_name: { type: string, description: 弱点展示名 }
        category:
          type: string
          enum: [AUTHN, AUTHZ, LIFECYCLE, SENSITIVE, SCHEMA]
          description: 弱点分类
        severity:
          type: string
          enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
          description: 严重级别
        status:
          type: string
          enum: [NEW, CONFIRMED, TO_FIX, FIXED, REPRODUCED, IGNORED, ARCHIVED]
          description: 生命周期状态
        evidence:
          type: object
          nullable: true
          description: 脱敏证据（仅规则/计数/窗口等摘要，参数值永不落库）
        first_seen: { type: string, format: date-time, description: 首次发现时间 }
        last_seen: { type: string, format: date-time, description: 最近命中时间 }
        trigger_count: { type: integer, description: 累计触发次数 }
        owner: { type: string, description: 整改负责人（未指派为空串） }
        due_date: { type: string, format: date-time, nullable: true, description: 整改期限（可空） }
        fixed_at: { type: string, format: date-time, nullable: true, description: 整改完成时间（可空） }
        retested_at: { type: string, format: date-time, nullable: true, description: 最近复测时间（可空） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecWeaknessAction:
      type: object
      description: 弱点整改/复测历史条目（api_weakness_actions）
      required: [id, weakness_id, action, actor, note, created_at]
      properties:
        id: { type: string, format: uuid }
        weakness_id: { type: string, format: uuid }
        action:
          type: string
          enum: [DERIVED, CONFIRM, ASSIGN, MARK_FIXED, RETEST_PASS, RETEST_FAIL, IGNORE, ARCHIVE, REPRODUCED]
          description: 动作（DERIVED/REPRODUCED 为派生扫描系统写入，actor=system）
        actor: { type: string, description: 操作者用户名（系统动作为 system） }
        note: { type: string, description: 备注 }
        created_at: { type: string, format: date-time }

    ApiSecWeaknessListResponse:
      type: object
      description: 弱点分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecWeakness' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecWeaknessDetailResponse:
      type: object
      required: [weakness, actions]
      properties:
        weakness: { $ref: '#/components/schemas/ApiSecWeakness' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ApiSecWeaknessAction' }
          description: 整改/复测历史（created_at 倒序，最多 100 条）

    ApiSecWeaknessResponse:
      type: object
      required: [weakness]
      properties:
        weakness: { $ref: '#/components/schemas/ApiSecWeakness' }

    ApiSecWeaknessNoteRequest:
      type: object
      description: 仅备注的流转输入（confirm/fixed/ignore/archive；body 可整体省略）
      properties:
        note: { type: string, maxLength: 512, description: 备注（可选，≤512 字符） }

    ApiSecWeaknessAssignRequest:
      type: object
      required: [owner]
      properties:
        owner: { type: string, maxLength: 128, description: 整改负责人（必填，≤128 字符） }
        due_date: { type: string, format: date-time, nullable: true, description: 整改期限（可选） }
        note: { type: string, maxLength: 512, description: 备注（可选） }

    ApiSecWeaknessRetestRequest:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [PASS, FAIL]
          description: 复测结果（PASS 通过关闭 / FAIL 未通过回 REPRODUCED）
        note: { type: string, maxLength: 512, description: 备注（可选） }

    # ---------- 敏感数据管理面（apidata，api_sensitive_data_types / api_masking_rules） ----------
    ApiSecSensitiveDataType:
      type: object
      description: 敏感数据类型（api_sensitive_data_types；分类分级实体，与网关证据标签对齐）
      required: [id, name, description, category, level, data_type, locations, keywords, regex, validator, exclude_fields, status, version, is_builtin, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: 类型 ID }
        name: { type: string, description: 类型名称（唯一；内置类型名称不可改） }
        description: { type: string, description: 描述 }
        category: { type: string, description: 分类（自定义词，如 个人身份/金融账户） }
        level:
          type: string
          enum: [NON_SENSITIVE, GENERAL, SENSITIVE, IMPORTANT, CORE]
          description: 五级敏感等级
        data_type: { type: string, description: 数据类型标签（与网关 evidence.data_type 对齐，如 phone/id_card） }
        locations:
          type: array
          items: { type: string, enum: [query, json, form, xml, header, cookie, path, response_body, file] }
          description: 可能出现位置（小写）
        keywords:
          type: array
          items: { type: string }
          description: 字段名词根
        regex: { type: string, description: 值级正则（空串 = 不做值检测） }
        validator: { type: string, enum: ['', luhn], description: 值校验器（空串 / luhn） }
        exclude_fields:
          type: array
          items: { type: string }
          description: 排除字段名
        status:
          type: string
          enum: [ENABLED, DISABLED]
          description: 启用状态
        version: { type: integer, description: 编辑自增版本号 }
        is_builtin: { type: boolean, description: 是否内置类型（内置禁删、名称不可改） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecSensitiveTypeRequest:
      type: object
      description: 敏感数据类型创建输入（name/data_type 必填；level 缺省 GENERAL、status 缺省 ENABLED）
      required: [name, data_type]
      properties:
        name: { type: string, maxLength: 128, description: 类型名称 }
        description: { type: string, maxLength: 512 }
        category: { type: string, maxLength: 64 }
        level: { type: string, enum: [NON_SENSITIVE, GENERAL, SENSITIVE, IMPORTANT, CORE] }
        data_type: { type: string, maxLength: 64, description: 数据类型标签（与网关证据标签对齐） }
        locations:
          type: array
          items: { type: string, enum: [query, json, form, xml, header, cookie, path, response_body, file] }
        keywords:
          type: array
          items: { type: string }
        regex: { type: string, maxLength: 1024, description: 值级正则（需可编译） }
        validator: { type: string, enum: ['', luhn] }
        exclude_fields:
          type: array
          items: { type: string }
        status: { type: string, enum: [ENABLED, DISABLED] }

    ApiSecSensitiveTypeUpdateRequest:
      type: object
      description: 敏感数据类型编辑输入（全部字段可选，仅更新出现的字段；内置类型 name 不可改）
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 512 }
        category: { type: string, maxLength: 64 }
        level: { type: string, enum: [NON_SENSITIVE, GENERAL, SENSITIVE, IMPORTANT, CORE] }
        data_type: { type: string, maxLength: 64 }
        locations:
          type: array
          items: { type: string, enum: [query, json, form, xml, header, cookie, path, response_body, file] }
        keywords:
          type: array
          items: { type: string }
        regex: { type: string, maxLength: 1024 }
        validator: { type: string, enum: ['', luhn] }
        exclude_fields:
          type: array
          items: { type: string }
        status: { type: string, enum: [ENABLED, DISABLED] }

    ApiSecSensitiveTypeListResponse:
      type: object
      description: 敏感数据类型分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecSensitiveDataType' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecSensitiveTypeExportResponse:
      type: object
      required: [format, version, exported_at, types]
      properties:
        format: { type: string, example: jiuzhang-api-sensitive-data-types, description: 导出文档格式标识 }
        version: { type: integer, example: 1, description: 导出格式版本 }
        exported_at: { type: string, format: date-time, description: 导出时间（UTC） }
        types:
          type: array
          items: { $ref: '#/components/schemas/ApiSecSensitiveDataType' }

    ApiSecSensitiveTypeImportRequest:
      type: object
      required: [types]
      properties:
        types:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ApiSecSensitiveTypeRequest' }
          description: 类型条目（按 name upsert；id/version/is_builtin/时间戳忽略，由服务端重新授予）

    ApiSecSensitiveTypeImportResponse:
      type: object
      required: [created, updated]
      properties:
        created: { type: integer, description: 新建条数 }
        updated: { type: integer, description: 更新条数 }

    ApiSecMaskDecryptRequest:
      type: object
      additionalProperties: false
      required: [ciphertext]
      properties:
        ciphertext:
          type: string
          maxLength: 4096
          pattern: '^enc_[A-Za-z0-9_-]+_[A-Za-z0-9+/]+={0,2}$'
          description: ENCRYPT 密文（enc_<kid>_<base64>；kid 含下划线时按最后一个下划线分隔）

    ApiSecMaskDecryptResponse:
      type: object
      required: [plaintext]
      properties:
        plaintext:
          type: string
          description: 解密后的明文（仅成功响应返回，不写入审计）

    ApiSecMaskingRule:
      type: object
      description: 响应脱敏规则（api_masking_rules；发布通道按列名读取下发网关）
      required: [id, name, enabled, scope, field_path, algorithm, params_json, exclusions_json, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: 规则 ID }
        name: { type: string, description: 规则名称 }
        enabled: { type: boolean, description: 是否启用 }
        scope:
          type: string
          enum: [GLOBAL, APPLICATION, ENDPOINT]
          description: 作用域
        application_id: { type: string, format: uuid, nullable: true, description: 站点 ID（scope=APPLICATION 必填，其余为 null） }
        endpoint_key: { type: string, nullable: true, description: 接口键（scope=ENDPOINT 必填，「METHOD 路径模板」） }
        field_path: { type: string, description: 目标字段路径（与 data_type 至少其一） }
        data_type: { type: string, nullable: true, description: 目标数据类型标签（整类脱敏） }
        algorithm:
          type: string
          enum: [MASK, HASH, REMOVE, ENCRYPT, MAP]
          description: 脱敏算法（MASK 掩码 / HASH 散列 / REMOVE 移除字段 / ENCRYPT 可逆加密 / MAP 显式值映射）
        params_json:
          type: object
          description: 算法参数对象（ENCRYPT 必须且仅含 key_id，MAP 必须且仅含 map_id；均 1-64 位 [A-Za-z0-9_-]，其余算法沿用既有参数）
        exclusions_json:
          type: object
          description: 排除对象（仅 identity/role/ip 键；ip 项为 IP 或 CIDR）
        created_by: { type: string, nullable: true, description: 创建人用户名 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecMaskingRuleRequest:
      type: object
      description: >-
        脱敏规则创建/编辑输入（编辑时仅更新出现的字段；可空字段传空串清除为 NULL）。
        创建默认 enabled=true、scope=GLOBAL、algorithm=MASK；field_path 与 data_type 至少其一；
        作用域一致性：APPLICATION 必须带 application_id，ENDPOINT 必须带 endpoint_key，GLOBAL 两者均不允许。
      properties:
        name: { type: string, maxLength: 128, description: 规则名称（创建必填） }
        enabled: { type: boolean }
        scope: { type: string, enum: [GLOBAL, APPLICATION, ENDPOINT] }
        application_id: { type: string, description: 站点 ID（UUID 或空串清除） }
        endpoint_key: { type: string, maxLength: 560, description: 接口键（或空串清除） }
        field_path: { type: string, maxLength: 512 }
        data_type: { type: string, maxLength: 64, description: 数据类型标签（或空串清除） }
        algorithm: { type: string, enum: [MASK, HASH, REMOVE, ENCRYPT, MAP] }
        params_json: { type: object, description: 算法参数对象（≤8192 字节） }
        exclusions_json: { type: object, description: 排除对象（仅 identity/role/ip 键） }

    ApiSecMaskingRuleListResponse:
      type: object
      description: 脱敏规则分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecMaskingRule' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecSensitiveTypeDistItem:
      type: object
      required: [data_type, field_count, endpoint_count, occurrence_count]
      properties:
        data_type: { type: string, description: 数据类型标签 }
        field_count: { type: integer, format: int64, description: 该类型字段行数 }
        endpoint_count: { type: integer, format: int64, description: 该类型涉敏端点数 }
        occurrence_count: { type: integer, format: int64, description: 该类型累计命中次数 }

    ApiSecSensitiveTrendPoint:
      type: object
      required: [date, event_count, hit_count]
      properties:
        date: { type: string, example: '2026-08-16', description: 日期（YYYY-MM-DD，库会话时区口径） }
        event_count: { type: integer, format: int64, description: 含敏感明细的运行时事件数 }
        hit_count: { type: integer, format: int64, description: 敏感证据条目数 }

    ApiSecSensitiveOverview:
      type: object
      description: 敏感数据态势（api_sensitive_fields + api_runtime_events 聚合）
      required: [sensitive_endpoint_count, sensitive_field_count, type_distribution, trend, days]
      properties:
        sensitive_endpoint_count: { type: integer, format: int64, description: 涉敏 API 数（去重端点） }
        sensitive_field_count: { type: integer, format: int64, description: 敏感字段行数 }
        type_distribution:
          type: array
          items: { $ref: '#/components/schemas/ApiSecSensitiveTypeDistItem' }
          description: 按数据类型分布（字段数降序）
        trend:
          type: array
          items: { $ref: '#/components/schemas/ApiSecSensitiveTrendPoint' }
          description: 近 days 天趋势（日期升序，零值日补齐）
        days: { type: integer, description: 趋势天数 }

    # ---------- 服务资产（apiassets，§14） ----------
    ApiSecServiceAsset:
      type: object
      description: 服务资产（upstreams 主机:端口 视角聚合；应用软删 upstreams 不计）
      required: [server_ip, port, application_count, api_count, traffic_7d, sensitive_api_count, risk_count]
      properties:
        server_ip: { type: string, description: 主机名或 IP（upstreams.normalized_host） }
        port: { type: integer, description: 端口（upstreams.port） }
        application_count: { type: integer, format: int64, description: 承载应用数（去重） }
        api_count: { type: integer, format: int64, description: 归属 API 端点数 }
        traffic_7d: { type: integer, format: int64, description: 近 7 天请求量（traffic buckets 留存窗口聚合） }
        sensitive_api_count: { type: integer, format: int64, description: 含敏感字段的端点数（api_sensitive_fields 去重） }
        risk_count: { type: integer, format: int64, description: 未闭环风险发现数（findings NEW/CONFIRMED/IN_PROGRESS） }

    ApiSecServiceAssetListResponse:
      type: object
      description: 服务资产分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecServiceAsset' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    # ---------- 规范中心增量（apisecurity，W3-C 版本化） ----------
    ApiSecSpecImportUrlRequest:
      type: object
      description: >-
        URL 导入输入：url 必填（≤2048 字符，仅 http/https 且经 SSRF 防护校验）；
        name 可空（缺省依次取 URL 路径末段文件名、文档 info.title、内容哈希兜底）；
        headers 可空（最多 20 个，名 1-128 字符、值 ≤2048 字符，用于带鉴权的规范地址）。
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: 规范文档地址（仅 http/https） }
        name: { type: string, description: 规范名称（可空） }
        headers:
          type: object
          additionalProperties: { type: string }
          description: 拉取时附带的请求头（如 Authorization；最多 20 个）

    ApiSecSpecActivateResponse:
      type: object
      required: [spec]
      properties:
        spec: { $ref: '#/components/schemas/ApiSecImportSpec' }

    ApiSecSpecChange:
      type: object
      description: 规范跨版本 CHANGED 级对比的一条变化
      required: [endpoint_key, change_type]
      properties:
        endpoint_key: { type: string, description: 接口键（「METHOD 路径」） }
        change_type:
          type: string
          enum: [ENDPOINT_ADDED, ENDPOINT_REMOVED, PARAM_ADDED, PARAM_REMOVED, TYPE_CHANGED, REQUIRED_CHANGED]
          description: 变化类型
        param_in: { type: string, description: 参数位置（PATH/QUERY/HEADER/COOKIE/BODY；端点级变化时缺省） }
        param_name: { type: string, description: 参数名（端点级变化时缺省） }
        before: { type: string, description: 旧值（类型名或 "true"/"false"；新增类变化时缺省） }
        after: { type: string, description: 新值（删除类变化时缺省） }

    ApiSecSpecVersionDiffResponse:
      type: object
      required: [base, target, changes]
      properties:
        base:
          type: object
          description: 基准（旧版）规范摘要
          properties:
            id: { type: string, format: uuid }
            name: { type: string, description: 规范名称 }
            version_no: { type: integer, description: 版本号 }
        target:
          type: object
          description: 目标（新版）规范摘要
          properties:
            id: { type: string, format: uuid }
            name: { type: string, description: 规范名称 }
            version_no: { type: integer, description: 版本号 }
        changes:
          type: array
          items: { $ref: '#/components/schemas/ApiSecSpecChange' }
          description: 变化明细（无变化时为空数组）

    # ---------- AUTHZ-01 可信对象关系与 OBSERVE 决策 ----------
    ApiSecAuthzRelationCandidate:
      type: object
      description: 对象授权关系候选；对象引用和历史身份指纹均为不可逆 HMAC 引用
      required: [id, application_id, object_type, object_ref, source, status, source_count, observation_count, confidence_inputs, first_seen, last_seen, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid, nullable: true }
        object_type: { type: string }
        object_ref: { type: string, description: 服务端生成的 HMAC 对象引用 }
        principal_id: { type: string, nullable: true, description: 仅 VERIFIED 身份可写入 }
        tenant_id: { type: string, nullable: true }
        legacy_identity_fingerprint: { type: string, nullable: true, description: 历史迁移指纹；存在时候选不可确认 }
        source: { type: string, enum: [OBSERVED, LEGACY] }
        status: { type: string, enum: [PENDING, REJECTED, FROZEN, CONFIRMED] }
        source_count: { type: integer, format: int64, minimum: 0 }
        observation_count: { type: integer, format: int64, minimum: 0 }
        confidence_inputs:
          type: object
          additionalProperties: true
        evidence_ref: { type: string, nullable: true }
        reject_reason: { type: string, nullable: true }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecAuthzRelationCandidateListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAuthzRelationCandidate' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }

    ApiSecAuthzCandidateConfirmRequest:
      type: object
      required: [relation, reason]
      properties:
        relation: { type: string, enum: [OWNER], description: 首期固定为 OWNER }
        reason: { type: string, minLength: 1, maxLength: 512 }
        valid_until: { type: string, format: date-time, nullable: true }

    ApiSecAuthzCandidateRejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }

    ApiSecAuthzObjectRelation:
      type: object
      description: 已确认的可信对象授权关系
      required: [id, application_id, object_type, object_ref, principal_id, relation, source, status, valid_from, confirmed_by, confirmed_at, reason, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        object_type: { type: string }
        object_ref: { type: string, description: 服务端 HMAC 对象引用 }
        principal_id: { type: string }
        tenant_id: { type: string, nullable: true }
        relation: { type: string, enum: [OWNER, SHARED_WITH], description: OWNER=对象属主；SHARED_WITH=object_ref 对象共享给 principal_id 接收人 }
        source: { type: string, enum: [MANUAL, IMPORT, CREATE_BINDING] }
        status: { type: string, enum: [CONFIRMED, REVOKED, EXPIRED] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time, nullable: true }
        evidence_ref: { type: string, nullable: true }
        confirmed_by: { type: string }
        confirmed_at: { type: string, format: date-time }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecAuthzObjectRelationListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAuthzObjectRelation' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }

    ApiSecAuthzObjectRelationRequest:
      type: object
      required: [application_id, object_type, object_ref, principal_id, relation, reason]
      properties:
        application_id: { type: string, format: uuid }
        object_type: { type: string, minLength: 1, maxLength: 128 }
        object_ref: { type: string, minLength: 1, maxLength: 256, description: 与服务端 HMAC 规则一致的对象引用 }
        principal_id: { type: string, minLength: 1, maxLength: 256 }
        tenant_id: { type: string, nullable: true, maxLength: 256 }
        relation: { type: string, enum: [OWNER, SHARED_WITH], description: OWNER=对象属主；SHARED_WITH=object_ref 对象共享给 principal_id 接收人 }
        source: { type: string, enum: [MANUAL, IMPORT], default: MANUAL, description: SHARED_WITH 仅允许 MANUAL；IMPORT 继续仅支持 OWNER }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time, nullable: true }
        evidence_ref: { type: string, nullable: true, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 512 }

    ApiSecAuthzRelationRevokeRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512, description: 撤销原因 }

    ApiSecAuthzRelationReauthorizeRequest:
      type: object
      required: [reason, valid_from]
      properties:
        valid_from: { type: string, format: date-time, description: 重新授权生效时间 }
        valid_until: { type: string, format: date-time, nullable: true, description: 可选的重新授权失效时间 }
        reason: { type: string, minLength: 1, maxLength: 512, description: 重新授权原因 }

    ApiSecAuthzDecision:
      type: object
      description: 请求级授权决策（NG-AZ-03 起含 VERIFIED_VIOLATION 实断判定；决策值表达判定结论，请求最终动作见 api_runtime_events.final_action——OBSERVE 形态决策不改变放行结果）
      required: [id, decision_id, endpoint_key, policy_version, decision, checks, occurred_at]
      properties:
        id: { type: string, format: uuid }
        decision_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid, nullable: true }
        endpoint_key: { type: string }
        policy_version: { type: string }
        decision: { type: string, enum: [ALLOW, OBSERVE_VIOLATION, UNKNOWN, VERIFIED_VIOLATION] }
        checks:
          type: array
          items: {}
          description: 身份、租户、BOLA、BFLA 的独立检查链
        evidence:
          type: object
          additionalProperties: true
          description: 脱敏证据；仅 evidence_read 权限返回。VERIFIED_VIOLATION 实断行含 authz_enforcement 键（NG-AZ-03 D5，形状见 ApiSecAuthzEnforcementEvidence；随主事件 final_decision 内嵌原样带出，服务端只读透传不解释）
          properties:
            authz_enforcement: { $ref: '#/components/schemas/ApiSecAuthzEnforcementEvidence' }
        occurred_at: { type: string, format: date-time }

    ApiSecAuthzEnforcementEvidence:
      type: object
      description: >-
        VERIFIED_VIOLATION 实断证据（NG-AZ-03 §1.4 冻结形状；随该请求 api_runtime_events
        主事件行 final_decision.authz_enforcement 内嵌，decisions 查询行 evidence 原样带出）——
        含八因子逐项布尔值 + 版本/水位/租约读数 + enforcement_owner/evidence_source，
        可完整回答「为什么这次请求被实断」
      required: [decision, reason_code, enforced, endpoint_key, eligibility, recorded_at]
      properties:
        decision: { type: string, enum: [VERIFIED_VIOLATION], description: 判定结论（恒 VERIFIED_VIOLATION） }
        reason_code: { type: string, description: 违规原因码（AUTHZ-BOLA-001 / AUTHZ-BFLA-001） }
        enforced: { type: boolean, description: 是否实断（PROTECT 端点 true；OBSERVE 形态拟动作记录为 false） }
        endpoint_key: { type: string, description: 端点键 }
        model_version: { type: string, description: 对象模型版本戳 }
        policy_version: { type: string, description: 授权快照策略版本戳 }
        revocation_watermark:
          type: object
          description: 判定时刻管理面向量撤销水位（分量比较语义见 NG-AZ-02）
          properties:
            manual_seq: { type: integer, format: int64, description: 手工撤销通道序号 }
            sources: { type: object, additionalProperties: { type: integer, format: int64 }, description: 逐权威来源水位 }
        principal_source: { type: string, description: 主体来源（JWT_VERIFIED=JWT 信任链 VERIFIED 可信主体） }
        object_ref: { type: string, description: "对象 HMAC 引用（objref: 前缀脱敏形态）" }
        eligibility:
          type: object
          description: 阻断资格八因子逐项布尔值（全真才落 VERIFIED_VIOLATION；任一不真按既有 reason code 落 UNKNOWN/OBSERVE_VIOLATION，绝不阻断）
          properties:
            trusted_identity: { type: boolean, description: 主体可信（JWT VERIFIED 且 principal 非空） }
            model_applicable: { type: boolean, description: 模型适用（恰一模型匹配且 publishable/OWNER/unique/未过期） }
            relation_valid: { type: boolean, description: 关系有效（CONFIRMED 且在 valid_from/valid_until 内） }
            no_conflict: { type: boolean, description: 无 OPEN 冲突 }
            tenant_consistent: { type: boolean, description: 租户范围一致 }
            evidence_fresh: { type: boolean, description: 证据新鲜（lease 未过期、无时钟漂移、水位未回退） }
            other_owner: { type: boolean, description: 违规事实本体（请求主体 ≠ 任一有效 OWNER 且存在有效 OWNER） }
            owner_exclusive: { type: boolean, description: 排他所有权已显式声明 }
        lease_seconds: { type: integer, description: 判定时刻生效租约秒数 }
        applied_at_age_seconds: { type: integer, description: 快照应用时刻距判定的秒数 }
        enforcement_owner: { type: string, maxLength: 128, description: §8.4 业务负责人标识（切换 PROTECT 时声明值） }
        evidence_source: { type: string, enum: [AUTHORITY_SYNC, MANUAL_CONFIRMED], description: §8.4 证据来源声明 }
        recorded_at: { type: string, format: date-time, description: 证据记录时刻 }

    # ---- NG-AZ-04 PROTECT 切换向导（apiauthzwizard） ----
    ApiSecAuthzEnforcementReadinessItem:
      type: object
      description: 端点级实断资格派生行（§1.2；readiness 为服务端唯一事实源，前端只渲染）
      required: [endpoint_id, endpoint_key, object_segment, enforcement, readiness, reasons, checked_at]
      properties:
        endpoint_id: { type: string, format: uuid }
        endpoint_key: { type: string }
        object_segment: { type: string }
        enforcement: { type: string, enum: [OBSERVE, PROTECT] }
        readiness:
          type: string
          enum: [READY, PROTECT_ACTIVE, NOT_PUBLISHABLE, BLOCKED_BY_NO_RELATION, BLOCKED_BY_CONFLICT, BLOCKED_BY_STALE, BLOCKED_BY_NODE]
          description: 六态徽章（PROTECT_ACTIVE 为已 PROTECT 展示态；reasons 全列不真因子原文）
        reasons: { type: array, items: { type: string }, description: 全部不真因子原文（含 UNKNOWN 永不阻断语义注记） }
        checked_at: { type: string, format: date-time, description: 派生时刻 }

    ApiSecAuthzEnforcementReadinessResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAuthzEnforcementReadinessItem' }

    ApiSecAuthzEnforcementImpactRequest:
      type: object
      required: [endpoint_id, window_days]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口 ID }
        window_days: { type: integer, minimum: 1, maximum: 30, description: 评估窗口天数（词表 1~30，词表外 400） }
        object_segment: { type: string, description: 端点多对象模型行时指定（缺省恰一行自动选定；token 绑定粒度=对象模型行） }

    ApiSecAuthzEnforcementImpact:
      type: object
      description: 影响评估结果（§1.3；只读评估不入库）
      required: [endpoint_id, endpoint_key, object_segment, window_days, evaluated_at, observe_violation_count, unknown_total, unknown_by_reason, distinct_principal_count, verified_violation_count, readiness, readiness_reasons]
      properties:
        endpoint_id: { type: string, format: uuid }
        endpoint_key: { type: string }
        object_segment: { type: string }
        window_days: { type: integer }
        evaluated_at: { type: string, format: date-time }
        observe_violation_count: { type: integer, format: int64, description: 近 N 天 OBSERVE_VIOLATION 命中数（切换后将被 403 的请求量近似） }
        unknown_total: { type: integer, format: int64, description: UNKNOWN 决策行数（UNKNOWN 永不阻断） }
        unknown_by_reason:
          type: array
          description: UNKNOWN 分桶（按 checks 展开 reason_code 计数，总和可超 unknown_total）
          items:
            type: object
            properties:
              reason_code: { type: string }
              count: { type: integer, format: int64 }
        distinct_principal_count: { type: integer, format: int64, description: 涉及主体数（VERIFIED 主体指纹 distinct） }
        verified_violation_count: { type: integer, format: int64, description: 已实断数（PROTECT 复评时非零） }
        recent_samples:
          type: array
          description: 最近命中样本 ≤5（非 ALLOW 决策；仅 api_authorization.evidence_read 返回）
          items:
            type: object
            properties:
              occurred_at: { type: string, format: date-time }
              decision: { type: string, enum: [OBSERVE_VIOLATION, UNKNOWN, VERIFIED_VIOLATION] }
              reason_code: { type: string }
        readiness: { $ref: '#/components/schemas/ApiSecAuthzEnforcementReadinessItem/properties/readiness' }
        readiness_reasons: { type: array, items: { type: string } }
        confirm_token: { type: string, format: uuid, description: 一次性签署令牌（仅 api_authorization.manage 调用签发；15 分钟 TTL 绑定端点×对象段） }
        confirm_token_expires_at: { type: string, format: date-time, description: 令牌到期时刻 }

    ApiSecAuthzEnforcementConfirmation:
      type: object
      description: PROTECT 切换业务确认单（§1.4；签发→签署→消费全生命周期，留存不删）
      required: [id, confirm_token, application_id, endpoint_id, object_segment, window_days, impact_snapshot, on_unknown, created_at, token_expires_at]
      properties:
        id: { type: string, format: uuid }
        confirm_token: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid }
        endpoint_key: { type: string }
        object_segment: { type: string }
        window_days: { type: integer }
        impact_snapshot: { type: object, additionalProperties: true, description: 签发时刻影响评估摘要全量 }
        confirm_text: { type: string, description: 冻结确认语义文案（签署时按 v1 模板生成落库） }
        enforcement_owner: { type: string, maxLength: 128, description: 四要素（签署时回填；''=未签署） }
        evidence_source: { type: string, enum: ['', AUTHORITY_SYNC, MANUAL_CONFIRMED] }
        on_unknown: { type: string, enum: [ALLOW_UNKNOWN] }
        confirmed_by_name: { type: string, description: 签署人 }
        created_at: { type: string, format: date-time }
        token_expires_at: { type: string, format: date-time }
        signed_at: { type: string, format: date-time, nullable: true }
        consumed_at: { type: string, format: date-time, nullable: true, description: PATCH 消费时刻（null=未消费） }
        consumed_audit_id: { type: string, description: 消费它的切换请求 request_id（审计按 request_id 反查，溯源闭环） }

    ApiSecAuthzEnforcementConfirmationListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAuthzEnforcementConfirmation' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }

    ApiSecAuthzEnforcementSignRequest:
      type: object
      required: [enforcement_owner, evidence_source, on_unknown]
      properties:
        enforcement_owner: { type: string, maxLength: 128, description: 业务负责人标识（非空 ≤128） }
        evidence_source: { type: string, enum: [AUTHORITY_SYNC, MANUAL_CONFIRMED] }
        on_unknown: { type: string, enum: [ALLOW_UNKNOWN], description: 首批仅 ALLOW_UNKNOWN——UNKNOWN 永不阻断 }

    ApiSecAuthzConflictItem:
      type: object
      description: 授权冲突对象（api_authority_conflicts；D7 语义——冲突不可信，UNKNOWN 不阻断）
      required: [id, application_id, object_type, object_ref, status, first_seen, updated_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        object_type: { type: string }
        tenant_domain: { type: string }
        object_ref: { type: string, description: "对象 HMAC 引用（objref: 前缀脱敏形态）" }
        principals: { type: array, items: {}, description: 涉及主体（脱敏形态） }
        status: { type: string, enum: [OPEN, RESOLVED] }
        first_seen: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecAuthzConflictListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAuthzConflictItem' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }

    # ---- NG-FLOW-01 强流程定义（strongflow） ----
    ApiSecStrongFlowStep:
      type: object
      description: 强流程步骤（§1.1 冻结形状；success_rule 运行期解析属 FLOW-03）
      required: [step_key, endpoint_key, sequence, success_rule, timeout_seconds, retry_semantics, lease_seconds]
      properties:
        step_key: { type: string, maxLength: 128, description: 步骤键（定义内唯一） }
        endpoint_key: { type: string, description: 端点键（须属绑定前缀下本应用已 CONFIRMED 端点，activate 核对） }
        sequence: { type: integer, minimum: 1, description: 流程内单调序号（定义内唯一；首步唯一最小） }
        success_rule: { $ref: '#/components/schemas/ApiSecStrongFlowSuccessRule' }
        timeout_seconds: { type: integer, minimum: 15, maximum: 600, description: 步骤超时秒数（词表外 400 不夹紧猜义） }
        retry_semantics: { type: string, enum: [IDEMPOTENT, NOT_RETRYABLE, REQUIRES_REVIEW], description: 可重试语义 }
        parallel_group: { type: string, maxLength: 128, description: 并行组（同组步骤 sequence 相邻连续；空=串行） }
        lease_seconds: { type: integer, minimum: 15, maximum: 300, description: 步骤预留租约秒数（词表外 400） }
        allows_202: { type: boolean, description: 异步受理（202=已受理待完成，不自动完成） }

    ApiSecStrongFlowSuccessRule:
      type: object
      description: 成功判定式（§1.4 三形态可组合与；白名单键未知键拒收；至少一形态。HTTP 2xx 不是通用成功证据——判定式必须显式配置）
      properties:
        status_codes:
          type: array
          items: { type: integer, minimum: 100, maximum: 599 }
          description: 形态一：响应状态码集合
        body_jsonpath_equals:
          type: object
          description: "形态二：body JSONPath 子集等值（仅点路径 $.a.b 形态）"
          properties:
            path: { type: string, description: "点路径（如 $.status；仅 $.a.b 形态）" }
            value: { description: 等值目标（JSON 标量） }
        graphql_errors_empty: { type: boolean, description: 形态三：GraphQL errors 为空 }

    ApiSecStrongFlowDefinition:
      type: object
      description: 强流程定义（NG-FLOW-01；版本化——编辑产新草稿 version+1、激活即冻结、RETIRED 单向终态）
      required: [id, application_id, name, version, status, binding_path_prefix, instance_key_param, mode, created_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        version: { type: integer, minimum: 1, description: 版本（单调递增；同名草稿 max+1） }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED], description: 状态（同应用同名称同时刻恰一个 ACTIVE） }
        binding_path_prefix: { type: string, description: 端点组前缀（/ 开头纯字面） }
        instance_key_param: { type: string, description: "实例引用来源（query:<参数名> / path:<段序>）" }
        mode: { type: string, enum: [OBSERVE, PROTECT], description: 模式（缺省 OBSERVE——NG-T-C01；UNKNOWN 任何形态恒不阻断） }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, nullable: true }

    ApiSecStrongFlowDefinitionDetail:
      allOf:
        - $ref: '#/components/schemas/ApiSecStrongFlowDefinition'
        - type: object
          properties:
            steps:
              type: array
              items: { $ref: '#/components/schemas/ApiSecStrongFlowStep' }

    ApiSecStrongFlowDefinitionInput:
      type: object
      required: [application_id, name, binding_path_prefix, instance_key_param, steps]
      properties:
        application_id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        binding_path_prefix: { type: string }
        instance_key_param: { type: string }
        mode: { type: string, enum: [OBSERVE, PROTECT], default: OBSERVE }
        steps:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: '#/components/schemas/ApiSecStrongFlowStep' }

    ApiSecStrongFlowDefinitionListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecStrongFlowDefinition' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }

    ApiSecStrongFlowInstance:
      type: object
      description: 强流程实例（NG-FLOW-02；definition_version 实例创建时冻结——NG-T-F06 不换图；status 五态；INDETERMINATE=未知待对账不显示安全通过）
      required: [id, application_id, definition_id, definition_version, instance_key, status, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        definition_id: { type: string, format: uuid }
        definition_name: { type: string, description: 定义名称（LEFT JOIN 带出） }
        definition_version: { type: integer, description: 实例创建时冻结的定义版本 }
        instance_key: { type: string, description: "实例键（sfref: 前缀域隔离 HMAC 脱敏形态）" }
        tenant_ref: { type: string, description: 可信租户引用（脱敏形态） }
        principal_ref: { type: string, description: 可信主体引用（脱敏形态） }
        status: { type: string, enum: [ACTIVE, CONFIRMED, INDETERMINATE, CANCELLED, FAILED] }
        version: { type: integer, description: 乐观锁版本（FLOW-03 resolve 版本冲突承载） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        terminated_at: { type: string, format: date-time, nullable: true }

    ApiSecStrongFlowInstanceListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecStrongFlowInstance' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }

    ApiSecStrongFlowStepEvent:
      type: object
      description: >-
        强流程步骤轨迹条目（api_strong_flow_step_events）。摘要档四字段随读权限可见；
        明细档（fencing_token/reason_code/request_id）仅 evidence_read 带出（键缺席=无权限，
        非无数据）。action 词表含管理面专属 RESOLVE（迁移 000178，KEEP_UNKNOWN 留痕）。
      required: [step_key, action, result, occurred_at]
      properties:
        step_key: { type: string, description: 步骤键（实例级事件为空串） }
        action: { type: string, enum: [RESERVE, COMMIT, RELEASE, EXPIRE, INSTANCE_NEW, INSTANCE_CONFIRMED, INSTANCE_INDETERMINATE, INSTANCE_CANCELLED, INSTANCE_FAILED, RESOLVE] }
        result: { type: string, enum: [OK, CONFLICT, REJECTED, UNKNOWN] }
        occurred_at: { type: string, format: date-time }
        fencing_token: { type: integer, format: int64, description: 预留 fencing 序号（明细档，evidence_read） }
        reason_code: { type: string, description: "原因码（FLOW-RESERVE-001/FENCE-001/IDEMPOTENT-CONFLICT-001/UNKNOWN-001/FLOW-RESOLVE-001 等；明细档）" }
        request_id: { type: string, description: 关联请求 ID（明细档） }

    ApiSecStrongFlowInstanceDetail:
      allOf:
        - $ref: '#/components/schemas/ApiSecStrongFlowInstance'
        - type: object
          required: [status_semantics, status_message, steps]
          properties:
            status_semantics:
              type: string
              enum: [IN_PROGRESS, SUCCEEDED, UNKNOWN_NOT_CONFIRMED, CANCELLED, FAILED]
              description: 状态语义词表（INDETERMINATE=UNKNOWN_NOT_CONFIRMED——未知不显示安全通过，§9.4 红线，不得映射为成功态）
            status_message:
              type: string
              description: "状态语义中文文案（INDETERMINATE 固定「未知，不显示安全通过」逐字不美化）"
            steps:
              type: array
              items: { $ref: '#/components/schemas/ApiSecStrongFlowStepEvent' }

    ApiSecStrongFlowResolveInput:
      type: object
      description: 管理恢复载荷（expected_version 乐观锁与实例 version 比对；终态实例拒绝重复恢复 409）
      required: [action, reason, expected_version]
      properties:
        action: { type: string, enum: [CONFIRM_SUCCEEDED, CONFIRM_NOT_EXECUTED, KEEP_UNKNOWN], description: "CONFIRM_SUCCEEDED→CONFIRMED / CONFIRM_NOT_EXECUTED→FAILED / KEEP_UNKNOWN 不推进" }
        reason: { type: string, minLength: 1, maxLength: 512, description: 对账理由（必填非空，HIGH 审计全值在册） }
        expected_version: { type: integer, minimum: 1, description: 乐观锁版本（与实例 version 精确比对，不匹配 409） }

    ApiSecAuthzDecisionListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAuthzDecision' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }

    ApiSecAuthzCoverage:
      type: object
      description: 按应用聚合的对象授权覆盖率与原始计数；比例范围均为 0..1
      required: [pending_candidates, confirmed_relations, decisions, unknown_decisions, observe_violations, verified_identity_rate, model_coverage_rate, confirmed_relation_rate, unknown_rate]
      properties:
        application_id: { type: string, format: uuid, nullable: true }
        pending_candidates: { type: integer, format: int64, minimum: 0 }
        confirmed_relations: { type: integer, format: int64, minimum: 0 }
        decisions: { type: integer, format: int64, minimum: 0 }
        unknown_decisions: { type: integer, format: int64, minimum: 0 }
        observe_violations: { type: integer, format: int64, minimum: 0 }
        verified_identity_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        model_coverage_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        confirmed_relation_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        unknown_rate: { type: number, format: double, minimum: 0, maximum: 1 }

    # ---------- 授权基线（apiauthz） ----------
    ApiSecRoleBaseline:
      type: object
      description: 角色功能级基线（api_role_baselines，BFLA 防护基线，确认后随发布通道下发网关）
      required: [id, endpoint_id, role, method, action, allowed, source, confidence, confirmed, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: 基线 ID }
        endpoint_id: { type: string, format: uuid, description: 所属接口资产 ID }
        role: { type: string, description: 角色码（≤64，字母数字下划线点短横） }
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
          description: HTTP 方法（大写）
        action: { type: string, description: 业务动作码（大写归一，≤64） }
        allowed: { type: boolean, description: 是否允许该角色执行此动作 }
        source:
          type: string
          enum: [MANUAL, SPEC, OBSERVED, IMPORTED]
          description: 基线来源（人工登记/规格导入/观测学习/批量导入）
        confidence: { type: number, format: double, minimum: 0, maximum: 1, description: 置信度 0..1 }
        confirmed: { type: boolean, description: 人工确认标记（false=候选，true=正式基线） }
        created_by: { type: string, nullable: true, description: 创建人用户名 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecRoleBaselineRequest:
      type: object
      description: >-
        角色基线创建/编辑输入（编辑时仅更新请求中出现的字段）。创建必填 endpoint_id/role/method/action；
        默认 source=MANUAL、confidence=0、allowed=false；endpoint_id 创建后不可改，
        confirmed 只能经确认接口变更。
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口资产 ID（创建必填） }
        role: { type: string, maxLength: 64, description: 角色码（创建必填；字母数字下划线点短横） }
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
          description: HTTP 方法（自动转大写）
        action: { type: string, maxLength: 64, description: 业务动作码（自动转大写） }
        allowed: { type: boolean, description: 是否允许（缺省 false） }
        source:
          type: string
          enum: [MANUAL, SPEC, OBSERVED, IMPORTED]
          description: 基线来源（缺省 MANUAL）
        confidence: { type: number, format: double, minimum: 0, maximum: 1, description: 置信度（缺省 0） }

    ApiSecRoleBaselineConfirmRequest:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean, description: true=确认为正式基线；false=撤回确认回到候选 }

    ApiSecRoleBaselineListResponse:
      type: object
      description: 角色基线分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecRoleBaseline' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecObjectOwnership:
      type: object
      description: 对象权属基线（api_object_ownership，BOLA 判定基线；由权属清扫任务生产，只读）
      required: [id, endpoint_id, identity_fingerprint, object_type, object_id, first_seen, last_seen, access_count]
      properties:
        id: { type: string, format: uuid, description: 权属记录 ID }
        endpoint_id: { type: string, format: uuid, description: 所属接口资产 ID }
        identity_fingerprint: { type: string, description: 身份指纹 }
        object_type: { type: string, description: 对象类型 }
        object_id: { type: string, description: 对象 ID }
        first_seen: { type: string, format: date-time, description: 首次观测时间 }
        last_seen: { type: string, format: date-time, description: 最近访问时间 }
        access_count: { type: integer, format: int64, description: 累计访问次数 }

    ApiSecOwnershipListResponse:
      type: object
      description: 对象权属分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecObjectOwnership' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecFieldPermission:
      type: object
      description: >-
        字段权限（api_field_permissions，Mass Assignment / 字段越权管控，随发布通道下发网关）。
        role/tenant 为可空列：NULL = 默认行，非空 = 角色/租户覆盖行。
      required: [id, endpoint_id, field_path, direction, attribute, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: 字段权限 ID }
        endpoint_id: { type: string, format: uuid, description: 所属接口资产 ID }
        field_path: { type: string, description: 字段路径（≤512） }
        direction:
          type: string
          enum: [REQUEST, RESPONSE]
          description: 字段方向（请求侧防 Mass Assignment / 响应侧防越权读取）
        attribute:
          type: string
          enum: [READABLE, WRITABLE, READ_ONLY, ADMIN_WRITABLE, SERVER_GENERATED, SENSITIVE, FORBIDDEN]
          description: >-
            字段属性（READ_ONLY 写入即 Mass Assignment 嫌疑；ADMIN_WRITABLE 仅管理员可写；
            SERVER_GENERATED 客户端提供即可疑；SENSITIVE 读取需额外管控；FORBIDDEN 出现即违规）
        role: { type: string, nullable: true, description: 角色覆盖（NULL=默认行） }
        tenant: { type: string, nullable: true, description: 租户覆盖（NULL=默认行） }
        created_by: { type: string, nullable: true, description: 创建人用户名 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecFieldPermissionRequest:
      type: object
      description: >-
        字段权限创建/编辑输入（编辑时仅更新请求中出现的字段）。创建必填
        endpoint_id/field_path/direction/attribute；endpoint_id 创建后不可改；
        role/tenant 可空，显式传空串清除为 NULL（回到默认行语义）。
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口资产 ID（创建必填） }
        field_path: { type: string, maxLength: 512, description: 字段路径（创建必填） }
        direction:
          type: string
          enum: [REQUEST, RESPONSE]
          description: 字段方向（自动转大写）
        attribute:
          type: string
          enum: [READABLE, WRITABLE, READ_ONLY, ADMIN_WRITABLE, SERVER_GENERATED, SENSITIVE, FORBIDDEN]
          description: 字段属性（自动转大写）
        role: { type: string, maxLength: 64, description: 角色码（或空串清除为默认行） }
        tenant: { type: string, maxLength: 64, description: 租户码（或空串清除为默认行） }

    ApiSecFieldPermissionListResponse:
      type: object
      description: 字段权限分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecFieldPermission' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecAuthzEvaluateEvidence:
      type: object
      description: BOLA 评估证据（各信号计数，供研判溯源）
      required: [own_match, object_owner_count, identity_object_count, identity_event_count, endpoint_ownership_rows]
      properties:
        own_match: { type: boolean, description: （身份,对象）权属记录存在 }
        object_owner_count: { type: integer, description: 该对象在本端点的权属记录数 }
        identity_object_count: { type: integer, description: 该身份在本端点的权属对象数 }
        identity_event_count: { type: integer, description: 该身份在本端点的历史运行时事件数 }
        endpoint_ownership_rows: { type: integer, description: 本端点权属记录总数 }

    ApiSecAuthzEvaluateResult:
      type: object
      description: BOLA 五档评估结果（判定阶梯见接口描述）
      required: [endpoint_id, identity, object_id, verdict, allowed, confidence, evidence, comment, evaluated_at]
      properties:
        endpoint_id: { type: string, format: uuid, description: 接口资产 ID }
        identity: { type: string, description: 评估身份（空串 = 匿名身份） }
        object_id: { type: string, description: 被访问对象 ID }
        verdict:
          type: string
          enum: [POLICY_CONFIRMED, HIGH_CONFIDENCE, LIKELY, POSSIBLE, INSUFFICIENT_EVIDENCE]
          description: 五档结论
        allowed:
          type: boolean
          nullable: true
          description: 倾向判定；INSUFFICIENT_EVIDENCE 时为 null（无法判定）
        confidence: { type: number, format: double, minimum: 0, maximum: 1, description: 结论置信度 0..1（档位固定值） }
        evidence: { $ref: '#/components/schemas/ApiSecAuthzEvaluateEvidence' }
        comment: { type: string, description: 中文结论说明 }
        evaluated_at: { type: string, format: date-time, description: 评估时间（UTC） }

    # ---------- 响应 Schema 学习（apimodels，P0-06，迁移 000051） ----------
    ApiSecApplicationValueDimension:
      type: object
      required: [name, average_score, max]
      properties:
        name: { type: string, description: 既有接口评分维度名 }
        average_score: { type: number, format: double, description: 该维度在已评分接口上的平均分 }
        max: { type: integer, description: 该维度原始满分 }

    ApiSecApplicationAssetValue:
      type: object
      required: [application_id, level, average_score, max_score, max_total, endpoint_count, scored_count, unscored_count, level_distribution, dimensions, generated_at]
      properties:
        application_id: { type: string, format: uuid }
        level: { type: string, enum: ['', LOW, MEDIUM, HIGH, CRITICAL], description: 已评分接口平均分映射等级；无评分数据时为空 }
        average_score: { type: number, format: double, description: 已评分接口的平均分（保留两位小数） }
        max_score: { type: integer, description: 已评分接口的最高分 }
        max_total: { type: integer, description: 既有接口评分模型的理论满分 }
        endpoint_count: { type: integer, format: int64, description: 应用下非忽略接口数 }
        scored_count: { type: integer, format: int64, description: 已有评分明细的非忽略接口数 }
        unscored_count: { type: integer, format: int64, description: 尚无评分明细的非忽略接口数 }
        level_distribution:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: 已评分接口的等级分布
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/ApiSecApplicationValueDimension' }
        generated_at: { type: string, format: date-time }

    ApiSecResponseSchema:
      type: object
      description: 端点响应结构学习结果（api_response_schemas 运行时学习行，一 端点×状态码 一行；只含字段路径与类型标签，不落值）
      required: [id, endpoint_key, status_code, fields, truncated, content_hash, sample_count, first_seen, last_seen, updated_at]
      properties:
        id: { type: string, format: uuid, description: 学习行 ID }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」） }
        status_code: { type: integer, description: 响应状态码 }
        fields:
          type: object
          additionalProperties: { type: string }
          description: 一级字段路径 → 类型标签（如 user.id → number）
        content_type: { type: string, description: 最近观测的响应 Content-Type（可空省略） }
        truncated: { type: boolean, description: 观测曾超网关捕获护栏被截断 }
        content_hash: { type: string, description: schema_json 规范化内容哈希（sha256 hex） }
        sample_count: { type: integer, format: int64, description: 合并的运行时学习样本数 }
        first_seen: { type: string, format: date-time, description: 首次观测时间 }
        last_seen: { type: string, format: date-time, description: 最近观测时间 }
        updated_at: { type: string, format: date-time, description: 行更新时间 }

    ApiSecResponseSchemaListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecResponseSchema' }
          description: 运行时学习行（按状态码升序；版本快照行不返回）

    # ---------- API 主动扫描（apiscan，P1-07，迁移 000053/000054/000056） ----------
    ApiScanTarget:
      type: object
      description: 扫描目标（api_scan_targets；靶标仅来自已纳管应用）
      required: [id, application_id, name, base_url, allowed_paths, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: 目标 ID }
        application_id: { type: string, format: uuid, description: 所属已纳管应用 ID }
        name: { type: string, description: 目标名称（≤128 字符） }
        base_url: { type: string, description: 探测请求根地址（http/https；主机须落在授权 allowlist 内） }
        allowed_paths:
          type: array
          items: { type: string }
          description: 允许探测的路径白名单（逐一作为具体路径探测；空 = 不探测任何路径）
        status: { type: string, enum: [ENABLED, DISABLED], description: 目标状态 }
        created_by: { type: string, format: uuid, description: 建标人用户 ID（与授权人分离） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiScanTargetCreateRequest:
      type: object
      required: [application_id, name, base_url]
      properties:
        application_id: { type: string, format: uuid, description: 已纳管应用 ID（必填，外键校验失败返回 400） }
        name: { type: string, maxLength: 128, description: 目标名称（必填） }
        base_url: { type: string, description: 探测根地址（必填，合法 http/https） }
        allowed_paths:
          type: array
          items: { type: string }
          description: 允许探测路径（可选，≤64 条，每项以 / 开头且 ≤512 字符）

    ApiScanTargetUpdateRequest:
      type: object
      required: [name, base_url, status]
      properties:
        name: { type: string, maxLength: 128, description: 目标名称 }
        base_url: { type: string, description: 探测根地址（合法 http/https） }
        allowed_paths:
          type: array
          items: { type: string }
          description: 允许探测路径（≤64 条，每项以 / 开头且 ≤512 字符）
        status: { type: string, enum: [ENABLED, DISABLED], description: 目标状态（自动转大写） }

    ApiScanTargetResponse:
      type: object
      properties:
        target: { $ref: '#/components/schemas/ApiScanTarget' }

    ApiScanTargetListResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApiScanTarget' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }

    ApiScanAuthorizeRequest:
      type: object
      required: [expires_at]
      properties:
        allowlist:
          type: array
          items: { type: string }
          description: 允许出包的域名/IP 白名单（≤64 条，每项 1~255 字符；空 = 仅 base_url 主机自身）
        window_start: { type: string, format: date-time, description: 允许扫描时间窗起点（可选；须早于 window_end） }
        window_end: { type: string, format: date-time, description: 允许扫描时间窗终点（可选） }
        max_qps: { type: integer, minimum: 1, maximum: 100, default: 5, description: 速率上限（执行侧限速硬约束） }
        max_concurrency: { type: integer, minimum: 1, maximum: 16, default: 1, description: 单任务并发上限 }
        test_profile: { type: string, description: 授权探针集画像（逗号分隔探针集词表；空 = 全部内置探针集） }
        expires_at: { type: string, format: date-time, description: 授权过期时间（必填且须为未来时间；过期自动失效） }

    ApiScanAuthorization:
      type: object
      description: 扫描授权单（api_scan_authorizations；生效状态由 expires_at/revoked_at/time_window 派生，无独立状态列）
      required: [id, target_id, authorized_by, allowlist, time_window, max_qps, max_concurrency, test_profile, expires_at, created_at]
      properties:
        id: { type: string, format: uuid, description: 授权单 ID }
        target_id: { type: string, format: uuid, description: 目标 ID }
        authorized_by: { type: string, format: uuid, description: 授权人用户 ID（与建标人分离） }
        allowlist: { type: array, items: { type: string }, description: 允许出包的域名/IP 白名单 }
        time_window:
          type: object
          description: 允许扫描时间窗（缺省端不限制）
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        max_qps: { type: integer, description: 速率上限 }
        max_concurrency: { type: integer, description: 单任务并发上限 }
        test_profile: { type: string, description: 授权探针集画像（逗号分隔） }
        expires_at: { type: string, format: date-time, description: 过期时间 }
        revoked_at: { type: string, format: date-time, description: 撤销时间（未撤销省略） }
        created_at: { type: string, format: date-time }

    ApiScanAuthorizationResponse:
      type: object
      properties:
        authorization: { $ref: '#/components/schemas/ApiScanAuthorization' }

    ApiScanAuthorizationListResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApiScanAuthorization' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }

    ApiScanRevokeResponse:
      type: object
      description: 撤销/紧急停止结果
      properties:
        authorization: { $ref: '#/components/schemas/ApiScanAuthorization' }
        stopped_jobs: { type: integer, format: int64, description: 联动停止的在跑任务数 }

    ApiScanJobCreateRequest:
      type: object
      required: [target_id, authorization_id]
      properties:
        target_id: { type: string, format: uuid, description: 扫描目标 ID }
        authorization_id: { type: string, format: uuid, description: 授权单 ID（须属于该目标且有效） }
        probe_set: { type: string, description: 逗号分隔探针集（可选，须为授权 test_profile 子集；空 = 授权画像全集） }

    ApiScanJobProgress:
      type: object
      description: 任务执行进度（progress JSONB；失败原因落 last_error，不静默吞错）
      properties:
        total: { type: integer, description: 解析出的待探测端点数 }
        done: { type: integer, description: 已完成端点数 }
        requests: { type: integer, description: 已发出请求数 }
        findings: { type: integer, description: 已产出发现数 }
        errors: { type: integer, description: 探针执行错误数（单点错误不阻断任务） }
        last_error: { type: string, description: 最近失败原因（可选） }

    ApiScanJob:
      type: object
      description: 扫描任务（api_scan_jobs）
      required: [id, target_id, authorization_id, probe_set, status, progress, created_at]
      properties:
        id: { type: string, format: uuid, description: 任务 ID }
        target_id: { type: string, format: uuid, description: 目标 ID }
        authorization_id: { type: string, format: uuid, description: 授权单 ID }
        probe_set: { type: string, description: 逗号分隔探针集 }
        status: { type: string, enum: [PENDING, RUNNING, PAUSED, STOPPED, COMPLETED, FAILED], description: 任务状态 }
        progress: { $ref: '#/components/schemas/ApiScanJobProgress' }
        started_at: { type: string, format: date-time, description: 启动时间（可选） }
        finished_at: { type: string, format: date-time, description: 结束时间（可选） }
        created_by: { type: string, format: uuid, description: 发起人用户 ID（可选） }
        created_at: { type: string, format: date-time }

    ApiScanJobResponse:
      type: object
      properties:
        job: { $ref: '#/components/schemas/ApiScanJob' }

    ApiScanJobListResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApiScanJob' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }

    ApiScanFinding:
      type: object
      description: 扫描发现（api_scan_findings；样本均已脱敏截断，凭据头值 [redacted]，敏感探针不落响应原文）
      required: [id, job_id, engine, template, endpoint_key, category, severity, confidence, evidence, request_sample, response_sample, status, created_at]
      properties:
        id: { type: string, format: uuid, description: 发现 ID }
        job_id: { type: string, format: uuid, description: 来源任务 ID }
        engine: { type: string, description: 产出引擎（builtin = 内置探针引擎） }
        template:
          type: string
          enum: [AUTH_REQUIRED, DEPRECATED_ALIVE, SENSITIVE_EXPOSURE, SCHEMA_CONFORM, BOLA_COMPARE, METHOD_ENUM]
          description: 探针集（未认证访问判定/下线存活/敏感暴露/Schema 符合/水平越权对比/方法枚举）
        endpoint_key: { type: string, description: 命中端点（「METHOD /path」归一键） }
        category: { type: string, enum: [AUTHN, AUTHZ, LIFECYCLE, SENSITIVE, SCHEMA], description: 发现分类 }
        severity: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL], description: 严重级别 }
        confidence: { type: number, format: double, minimum: 0, maximum: 1, description: 探针判定置信度 0..1 }
        evidence: { type: object, description: 脱敏证据（判定规则/状态码/命中字段名/响应哈希，不落原始数据） }
        request_sample: { type: string, description: 脱敏截断请求样本 }
        response_sample: { type: string, description: 脱敏截断响应样本（敏感探针为空） }
        status: { type: string, enum: [NEW, CONFIRMED, FALSE_POSITIVE, RETIRED], description: 发现状态 }
        weakness_id: { type: string, format: uuid, description: 确认时关联的弱点 ID（可选） }
        created_at: { type: string, format: date-time }

    ApiScanFindingResponse:
      type: object
      properties:
        finding: { $ref: '#/components/schemas/ApiScanFinding' }

    ApiScanFindingListResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ApiScanFinding' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }

    ApiScanFindingConfirmRequest:
      type: object
      properties:
        weakness_id: { type: string, format: uuid, description: 关联的弱点中心弱点 ID（可选；关联后方可复测） }

    ApiScanRetestRequest:
      type: object
      properties:
        note: { type: string, maxLength: 512, description: 复测备注（可选，缺省自动生成） }

    ApiScanRetestResponse:
      type: object
      description: 定向复测结果（已回写弱点中心状态机）
      properties:
        result: { type: string, enum: [PASS, FAIL], description: 复测结论（未复现 PASS / 复现 FAIL） }
        reproduced: { type: boolean, description: 原探针是否复现 }
        weakness_id: { type: string, format: uuid, description: 回写的弱点 ID }

    # ---------- 文件资产（apifiles） ----------
    ApiSecFileComplianceRule:
      type: object
      description: 文件合规规则（api_file_compliance_rules；enabled 规则经发布下发网关双相位执行）
      required: [id, direction, match_type, match_value, action, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [UPLOAD, DOWNLOAD], description: 传输方向 }
        match_type: { type: string, enum: [EXT, MIME, FILENAME_REGEX], description: 匹配方式 }
        match_value: { type: string, description: 匹配值（EXT 小写剥前导点 / MIME type/subtype / RE2） }
        action: { type: string, enum: [OBSERVE, BLOCK], description: 动作（BLOCK 在 PROTECT 阻断） }
        reason: { type: string, description: 规则原因说明 }
        enabled: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecFileComplianceRuleRequest:
      type: object
      required: [direction, match_type, match_value, action]
      properties:
        direction: { type: string, enum: [UPLOAD, DOWNLOAD] }
        match_type: { type: string, enum: [EXT, MIME, FILENAME_REGEX] }
        match_value: { type: string, minLength: 1, maxLength: 256 }
        action: { type: string, enum: [OBSERVE, BLOCK] }
        reason: { type: string, maxLength: 512 }
        enabled: { type: boolean, default: true }

    ApiSecFileComplianceRulePatchRequest:
      type: object
      description: 部分更新（指针字段合并后整体校验）
      properties:
        match_type: { type: string, enum: [EXT, MIME, FILENAME_REGEX] }
        match_value: { type: string, minLength: 1, maxLength: 256 }
        action: { type: string, enum: [OBSERVE, BLOCK] }
        reason: { type: string, maxLength: 512 }
        enabled: { type: boolean }

    ApiSecFileComplianceRuleResponse:
      type: object
      required: [rule]
      properties:
        rule: { $ref: '#/components/schemas/ApiSecFileComplianceRule' }
        message: { type: string }

    ApiSecFileComplianceRuleListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecFileComplianceRule' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }

    ApiSecFileSignatureVerifyResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean, description: 签名是否有效（HMAC 复算一致且未过期、kid 匹配） }
        kid: { type: string, description: token 携带的 kid }
        signed_at: { type: string, format: date-time, nullable: true, description: token 时间戳 }
        identity_fp_prefix: { type: string, description: 身份指纹前缀（验证通过且提供指纹时回显） }
        reason: { type: string, description: 验证不过原因（伪造/kid 不符/过期/格式非法） }

    ApiSecFileSignatureKeyResponse:
      type: object
      properties:
        kid: { type: string, description: 当前签名密钥标识（不含密钥本体） }

    ApiSecFileAsset:
      type: object
      description: 文件传输资产（api_file_assets；UPLOAD=请求侧 multipart 上传，DOWNLOAD=响应侧下载）
      required:
        - id
        - endpoint_key
        - direction
        - filename
        - extension
        - mime
        - size_bytes
        - identity_fingerprint
        - client_ip_masked
        - sensitive_types
        - first_seen
        - last_seen
        - transfer_count
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid, description: 文件资产 ID }
        endpoint_id:
          type: string
          format: uuid
          nullable: true
          description: 归属接口 ID（未归属为 null）
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」） }
        direction: { type: string, enum: [UPLOAD, DOWNLOAD], description: 传输方向 }
        filename: { type: string, description: 文件名 }
        extension: { type: string, description: 扩展名（小写） }
        mime: { type: string, description: MIME 类型（主类型小写无参数） }
        size_bytes: { type: integer, format: int64, description: 文件大小（字节） }
        sha256:
          type: string
          nullable: true
          description: 完整观测内容 SHA-256（截断/流式观测为 null；可由文件关联查询检索）
        identity_fingerprint: { type: string, description: 身份指纹（匿名流量为空串） }
        client_ip_masked: { type: string, description: 客户端 IP（掩码口径，与落库一致） }
        sensitive_types:
          type: array
          items: { type: string }
          description: 命中的敏感数据类型（空数组 = 非敏感文件）
        first_seen: { type: string, format: date-time, description: 首次观测时间 }
        last_seen: { type: string, format: date-time, description: 最近观测时间 }
        transfer_count: { type: integer, description: 累计传输次数 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecFileAssetListResponse:
      type: object
      description: 文件资产分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecFileAsset' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecFileLineage:
      type: object
      description: 同一完整内容指纹的文件传输关联；仅实际观测，不推断所有权或业务来源
      required: [sha256, days, total, upload_assets, download_assets, truncated, items]
      properties:
        sha256: { type: string, description: 完整内容 SHA-256 小写 hex }
        days: { type: integer, description: 实际查询时间窗天数 }
        total: { type: integer, format: int64, description: 匹配的真实资产总数 }
        upload_assets: { type: integer, format: int64, description: 本次返回的上传资产数 }
        download_assets: { type: integer, format: int64, description: 本次返回的下载资产数 }
        truncated: { type: boolean, description: 结果超过 100 条时为 true，不把部分结果描述为完整关联 }
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecFileAsset' }

    ApiSecFileLineageResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ApiSecFileLineage' }

    ApiSecFileAssetStatsSummary:
      type: object
      description: 文件统计汇总（上传/下载计数含资产数与传输次数双口径）
      required: [upload_assets, download_assets, upload_transfers, download_transfers, sensitive_file_count]
      properties:
        upload_assets: { type: integer, format: int64, description: 上传方向不同文件资产数 }
        download_assets: { type: integer, format: int64, description: 下载方向不同文件资产数 }
        upload_transfers: { type: integer, format: int64, description: 上传传输次数（transfer_count 求和，近似口径） }
        download_transfers: { type: integer, format: int64, description: 下载传输次数 }
        sensitive_file_count: { type: integer, format: int64, description: 敏感文件数（sensitive_types 非空的资产数） }

    ApiSecFileTopStat:
      type: object
      description: File TOP 项（按传输次数聚合；同名文件跨身份/端点归并）
      required: [filename, direction, transfers, identities]
      properties:
        filename: { type: string, description: 文件名 }
        direction: { type: string, enum: [UPLOAD, DOWNLOAD], description: 传输方向 }
        transfers: { type: integer, format: int64, description: 传输次数 }
        identities: { type: integer, format: int64, description: 涉及身份数（匿名计 1 个空串口径） }

    ApiSecFileIPTopStat:
      type: object
      description: IP TOP 项（掩码口径）
      required: [client_ip_masked, transfers, files]
      properties:
        client_ip_masked: { type: string, description: 客户端 IP（掩码） }
        transfers: { type: integer, format: int64, description: 传输次数 }
        files: { type: integer, format: int64, description: 涉及不同文件资产数 }

    ApiSecFileAccountTopStat:
      type: object
      description: Account TOP 项（身份指纹维度）
      required: [identity_fingerprint, transfers, files]
      properties:
        identity_fingerprint: { type: string, description: 身份指纹（空串 = 匿名） }
        transfers: { type: integer, format: int64, description: 传输次数 }
        files: { type: integer, format: int64, description: 涉及不同文件资产数 }

    ApiSecFileAPITopStat:
      type: object
      description: API TOP 项（端点维度）
      required: [endpoint_key, transfers, files]
      properties:
        endpoint_key: { type: string, description: 接口键 }
        transfers: { type: integer, format: int64, description: 传输次数 }
        files: { type: integer, format: int64, description: 涉及不同文件资产数 }

    ApiSecFileAssetStats:
      type: object
      description: §106 文件统计（窗口按 last_seen 口径，与列表明细同窗口；各 TOP 榜单上限 10）
      required: [days, summary, top_files, top_ips, top_accounts, top_apis]
      properties:
        days: { type: integer, description: 实际统计窗口天数 }
        summary: { $ref: '#/components/schemas/ApiSecFileAssetStatsSummary' }
        top_files:
          type: array
          items: { $ref: '#/components/schemas/ApiSecFileTopStat' }
          description: File TOP10
        top_ips:
          type: array
          items: { $ref: '#/components/schemas/ApiSecFileIPTopStat' }
          description: IP TOP10
        top_accounts:
          type: array
          items: { $ref: '#/components/schemas/ApiSecFileAccountTopStat' }
          description: Account TOP10
        top_apis:
          type: array
          items: { $ref: '#/components/schemas/ApiSecFileAPITopStat' }
          description: API TOP10

    # ---------- 数据出境看板（apigeo） ----------
    ApiSecCrossBorderEvent:
      type: object
      description: 跨境观察记录（api_cross_border_events；OUT=涉敏数据流向境外客户端，IN=境外客户端提交涉敏数据）
      required:
        - id
        - occurred_at
        - client_ip
        - country
        - endpoint_key
        - identity_fingerprint
        - data_types
        - direction
        - risk_level
        - source_event_id
        - created_at
      properties:
        id: { type: string, format: uuid, description: 记录 ID }
        occurred_at: { type: string, format: date-time, description: 发生时间 }
        client_ip: { type: string, description: 客户端 IP（netip 归一化 + 掩码纪律） }
        country: { type: string, description: 国家/地区（ISO 3166-1 alpha-2） }
        asn:
          type: integer
          format: int64
          nullable: true
          description: ASN（预留：当前数据源无 ASN，恒为 null）
        endpoint_key: { type: string, description: 接口键 }
        identity_fingerprint: { type: string, description: 身份指纹（匿名流量为空串） }
        data_types:
          type: array
          items: { type: string }
          description: 涉敏数据类型
        direction: { type: string, enum: [OUT, IN], description: 方向（出境/入境） }
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: 风险等级（由涉敏类型级别推导：CORE/IMPORTANT→HIGH，SENSITIVE 或字典外类型→MEDIUM，其余→LOW）
        source_event_id: { type: string, format: uuid, description: 来源运行时事件 ID }
        created_at: { type: string, format: date-time }

    ApiSecCrossBorderEventPage:
      type: object
      description: 跨境明细分页（统一分页结构，与看板同窗口）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecCrossBorderEvent' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecCrossBorderSummary:
      type: object
      description: 窗口内跨境汇总
      required: [total_events, country_count, endpoint_count, high_risk_count]
      properties:
        total_events: { type: integer, format: int64, description: 事件总量 }
        country_count: { type: integer, format: int64, description: 涉及境外国家/地区数 }
        endpoint_count: { type: integer, format: int64, description: 涉及端点数 }
        high_risk_count: { type: integer, format: int64, description: 高风险事件数 }

    ApiSecCrossBorderCountryStat:
      type: object
      description: 国家/地区聚合项（data_types 由 country×type 明细归并）
      required: [country, event_count, endpoint_count, data_types]
      properties:
        country: { type: string, description: 国家/地区码 }
        event_count: { type: integer, format: int64, description: 事件数 }
        endpoint_count: { type: integer, format: int64, description: 涉及端点数 }
        data_types:
          type: array
          items: { type: string }
          description: 涉及涉敏类型

    ApiSecCrossBorderCountryTypeStat:
      type: object
      description: 国家/地区×敏感类型聚合项（一事件多类型时每类型各计一次）
      required: [country, data_type, event_count]
      properties:
        country: { type: string, description: 国家/地区码 }
        data_type: { type: string, description: 涉敏数据类型 }
        event_count: { type: integer, format: int64, description: 事件数 }

    ApiSecCrossBorderEndpointStat:
      type: object
      description: 端点聚合项（上限 50）
      required: [endpoint_key, event_count, country_count]
      properties:
        endpoint_key: { type: string, description: 接口键 }
        event_count: { type: integer, format: int64, description: 事件数 }
        country_count: { type: integer, format: int64, description: 该端点涉及的境外国家/地区数 }

    ApiSecCrossBorderTrendPoint:
      type: object
      description: 单日跨境趋势点
      required: [date, event_count]
      properties:
        date: { type: string, description: 日期（YYYY-MM-DD，库会话时区 CURRENT_DATE 口径） }
        event_count: { type: integer, format: int64, description: 事件数 }

    ApiSecCrossBorderDashboard:
      type: object
      description: 跨境看板聚合
      required: [days, summary, by_country, by_country_type, by_endpoint, trend]
      properties:
        days: { type: integer, description: 实际统计窗口天数 }
        summary: { $ref: '#/components/schemas/ApiSecCrossBorderSummary' }
        by_country:
          type: array
          items: { $ref: '#/components/schemas/ApiSecCrossBorderCountryStat' }
          description: 按国家/地区聚合
        by_country_type:
          type: array
          items: { $ref: '#/components/schemas/ApiSecCrossBorderCountryTypeStat' }
          description: 按国家/地区×敏感类型聚合
        by_endpoint:
          type: array
          items: { $ref: '#/components/schemas/ApiSecCrossBorderEndpointStat' }
          description: 按端点聚合
        trend:
          type: array
          items: { $ref: '#/components/schemas/ApiSecCrossBorderTrendPoint' }
          description: 按天趋势

    ApiSecCrossBorderResponse:
      type: object
      description: 数据出境看板 + 明细分页组合响应
      required: [geo_enabled, home_regions, dashboard, events]
      properties:
        geo_enabled: { type: boolean, description: GeoIP 数据源是否可用（false 时看板可能为历史数据） }
        home_regions:
          type: array
          items: { type: string }
          description: 当前本土地区判定基准（国家/地区码列表）
        dashboard: { $ref: '#/components/schemas/ApiSecCrossBorderDashboard' }
        events: { $ref: '#/components/schemas/ApiSecCrossBorderEventPage' }

    # ---------- 态势总览与按天趋势（W9-P101） ----------
    ApiSecPostureOverview:
      type: object
      description: 态势顶部核心指标（口径逐字段注明）
      required:
        - generated_at
        - traffic_24h
        - protected_24h
        - assets_total
        - assets_new_24h
        - shadow_open
        - zombie_total
        - deprecated_total
        - sensitive_endpoints
        - high_risk_assets
        - unauthenticated_endpoints
        - models_pending
        - schema_deviations_24h
      properties:
        generated_at: { type: string, format: date-time, description: 指标生成时间（UTC） }
        traffic_24h:
          type: integer
          format: int64
          description: 近 24h API 访问量（api_endpoint_traffic_buckets 端点×5分钟桶求和；桶留存 7 天）
        protected_24h:
          type: integer
          format: int64
          description: 近 24h 防护量（api_runtime_events 中 final_action ∈ BLOCK/TEMP_BLOCK/RATE_LIMIT/MASK_RESPONSE 的事件数；观察性动作不计入）
        assets_total: { type: integer, format: int64, description: 资产总数（api_endpoints 全量，含 IGNORED） }
        assets_new_24h: { type: integer, format: int64, description: 近 24h 新增 API（created_at 口径） }
        shadow_open: { type: integer, format: int64, description: 未闭环 Shadow 发现数（status ∈ NEW/CONFIRMED/IN_PROGRESS） }
        zombie_total: { type: integer, format: int64, description: Zombie 资产数（asset_status=ZOMBIE） }
        deprecated_total: { type: integer, format: int64, description: 已下线资产数（asset_status=DEPRECATED） }
        sensitive_endpoints: { type: integer, format: int64, description: 涉敏 API 数（api_sensitive_fields 去重端点，请求/响应双向合并） }
        high_risk_assets: { type: integer, format: int64, description: 高风险 API 数（asset_value ∈ HIGH/CRITICAL；未评分不计） }
        unauthenticated_endpoints:
          type: integer
          format: int64
          description: 无认证 API 数（从未观测到带认证类型身份画像的端点；画像来自离线聚合）
        models_pending: { type: integer, format: int64, description: 待确认模型版本数（status ∈ CANDIDATE/IN_REVIEW） }
        schema_deviations_24h: { type: integer, format: int64, description: 近 24h 运行时 Schema 偏离数（api_schema_violations） }

    ApiSecPostureTrendPoint:
      type: object
      description: 单日态势趋势点（UTC 日界）
      required: [date, traffic, protected, risk, new_endpoints, schema_deviations, sensitive_hits]
      properties:
        date: { type: string, description: 日期（YYYY-MM-DD，UTC） }
        traffic: { type: integer, format: int64, description: 访问量（流量桶当日求和；留存 7 天，更早日期如实为 0） }
        protected: { type: integer, format: int64, description: 防护量（处置动作事件当日计数） }
        risk: { type: integer, format: int64, description: 风险（findings 当日新增，created_at 口径） }
        new_endpoints: { type: integer, format: int64, description: 新增 API（端点当日新建） }
        schema_deviations: { type: integer, format: int64, description: Schema 偏离（违例当日发生） }
        sensitive_hits: { type: integer, format: int64, description: 敏感数据命中（details_json 含 detector=sensitive_data 明细的事件当日计数） }

    ApiSecPostureTrends:
      type: object
      description: 按天桶趋势（服务端补零为连续 days 天点列，含今天）
      required: [days, points]
      properties:
        days: { type: integer, description: 实际窗口天数 }
        points:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureTrendPoint' }
          description: 趋势点列（时间升序）

    # ---------- AI 定时运营任务（apiops） ----------
    ApiSecAIOpsTaskType:
      type: object
      description: 任务类型展示元数据
      required: [task_type, name, description]
      properties:
        task_type:
          type: string
          enum: [API_ASSET_DIGEST, SHADOW_REVIEW, WEAKNESS_FOLLOW, RISK_DIGEST, SENSITIVE_DIGEST]
          description: 任务类型
        name: { type: string, description: 中文名称 }
        description: { type: string, description: 任务说明 }

    ApiSecAIOpsTaskTypeListResponse:
      type: object
      description: 任务类型词表响应（{items} 包装）
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAIOpsTaskType' }

    ApiSecAIOpsTaskConfig:
      type: object
      description: 任务入参（config 白名单键；未知键拒绝，零值/缺省取默认值，越界拒绝返回 400）
      properties:
        window_hours: { type: integer, minimum: 1, maximum: 720, default: 24, description: 统计窗口（小时），缺省 24 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20, description: 清单条数上限，缺省 20 }
        due_within_days: { type: integer, minimum: 0, maximum: 30, default: 3, description: 临近到期窗口（天，仅 WEAKNESS_FOLLOW 使用），缺省 3 }

    ApiSecAIOpsSchedule:
      type: object
      description: AI 运营定时计划（api_ai_schedules）
      required:
        - id
        - task_type
        - name
        - cron_expr
        - enabled
        - config
        - next_run_at
        - last_run_at
        - last_status
        - last_error
        - consecutive_failures
        - circuit_opened_at
        - circuit_reason
        - created_by
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid, description: 计划 ID }
        task_type:
          type: string
          enum: [API_ASSET_DIGEST, SHADOW_REVIEW, WEAKNESS_FOLLOW, RISK_DIGEST, SENSITIVE_DIGEST]
          description: 任务类型（内置五种，创建后不可变）
        name: { type: string, description: 计划名称（不超过 128 字符） }
        cron_expr: { type: string, description: cron 表达式（五段「分 时 日 月 周」或宏） }
        enabled: { type: boolean, description: 是否启用 }
        config: { $ref: '#/components/schemas/ApiSecAIOpsTaskConfig' }
        next_run_at:
          type: string
          format: date-time
          nullable: true
          description: 下次到期时间（启用时按 cron 重算；停用为 null）
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: 最近执行时间（从未执行为 null）
        last_status: { type: string, description: 最近执行状态（RUNNING/SUCCESS/FAILED；从未执行为空串） }
        last_error: { type: string, description: 最近失败原因（无为空串） }
        consecutive_failures:
          type: integer
          description: 连续失败计数（成功清零；达 api_ai_ops.circuit_threshold 阈值自动熔断停用）
        circuit_opened_at:
          type: string
          format: date-time
          nullable: true
          description: 熔断触发时间（未熔断为 null；手动启用后复位为 null）
        circuit_reason:
          type: string
          description: 熔断原因（连续失败次数与最近错误摘要；未熔断为空串）
        created_by:
          type: string
          format: uuid
          nullable: true
          description: 创建人用户 ID（可空）
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecAIOpsScheduleRequest:
      type: object
      description: 计划创建/更新请求体（未知字段拒绝；更新时 task_type 须与原值一致、enabled 被忽略）
      required: [task_type, name, cron_expr]
      properties:
        task_type:
          type: string
          enum: [API_ASSET_DIGEST, SHADOW_REVIEW, WEAKNESS_FOLLOW, RISK_DIGEST, SENSITIVE_DIGEST]
          description: 任务类型（自动转大写；更新时不可变）
        name: { type: string, maxLength: 128, description: 计划名称（必填，不超过 128 字符） }
        cron_expr: { type: string, description: cron 表达式（必填且可解析） }
        enabled: { type: boolean, description: 创建时可指定（缺省 false，为 true 时按 cron 计算 next_run_at）；更新时忽略此字段 }
        config: { $ref: '#/components/schemas/ApiSecAIOpsTaskConfig' }

    ApiSecAIOpsScheduleResponse:
      type: object
      description: 单计划响应（{schedule} 包装）
      required: [schedule]
      properties:
        schedule: { $ref: '#/components/schemas/ApiSecAIOpsSchedule' }

    ApiSecAIOpsScheduleListResponse:
      type: object
      description: 计划分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAIOpsSchedule' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecAIOpsScheduleDeleteResponse:
      type: object
      description: '删除结果（{deleted: true}）'
      required: [deleted]
      properties:
        deleted: { type: boolean, description: 是否已删除 }

    ApiSecAIOpsRun:
      type: object
      description: 执行记录（api_ai_schedule_runs，每次触发一行，含手动立即执行）
      required: [id, schedule_id, started_at, finished_at, status, summary, report, created_at]
      properties:
        id: { type: string, format: uuid, description: 执行记录 ID }
        schedule_id: { type: string, format: uuid, description: 所属计划 ID }
        started_at: { type: string, format: date-time, description: 开始时间 }
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: 结束时间（执行中为 null）
        status: { type: string, enum: [RUNNING, SUCCESS, FAILED], description: 执行状态 }
        summary: { type: string, description: 中文摘要（模板化生成，可经 LLM 润色、失败回退模板） }
        report:
          type: object
          description: 结构化报告（任务类型对应的确定性查询结果）
        created_at: { type: string, format: date-time }

    ApiSecAIOpsRunResponse:
      type: object
      description: 单执行记录响应（{run} 包装）
      required: [run]
      properties:
        run: { $ref: '#/components/schemas/ApiSecAIOpsRun' }

    ApiSecAIOpsRunListResponse:
      type: object
      description: 执行记录分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAIOpsRun' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    # ---------- 态势访问维度（apisecurity，W10-SEC） ----------
    ApiSecPostureSourceIP:
      type: object
      description: 客户端 IP 计数项（IP 已脱敏展示）
      required: [client_ip, count]
      properties:
        client_ip: { type: string, description: 客户端 IP（脱敏） }
        count: { type: integer, format: int64, description: 窗口内事件数 }

    ApiSecPostureGeoScope:
      type: object
      description: 地域归属分桶计数（HOME/FOREIGN/INTERNAL/UNKNOWN 四桶零补齐）
      required: [scope, count]
      properties:
        scope: { type: string, enum: [HOME, FOREIGN, INTERNAL, UNKNOWN], description: 归属分桶 }
        count: { type: integer, format: int64, description: 窗口内事件数 }

    ApiSecPostureSourceCountry:
      type: object
      description: 国家码计数项（ISO 3166-1 alpha-2，仅 GeoIP 可用时有数据）
      required: [country, count]
      properties:
        country: { type: string, description: 国家码 }
        count: { type: integer, format: int64, description: 窗口内事件数 }

    ApiSecPostureSourceIdentity:
      type: object
      description: 身份指纹计数项（指纹截断展示；指纹本身即不可逆 HMAC）
      required: [fingerprint, count]
      properties:
        fingerprint: { type: string, description: 身份指纹（截断） }
        count: { type: integer, format: int64, description: 窗口内事件数 }

    ApiSecPostureSourceAuthType:
      type: object
      description: 认证类型分布项（auth_type 空串 = 匿名流量）
      required: [auth_type, count]
      properties:
        auth_type: { type: string, description: 认证方式（bearer_or_basic/api_key/cookie_session，空串 = 匿名） }
        count: { type: integer, format: int64, description: 窗口内事件数 }

    ApiSecPostureSources:
      type: object
      description: 访问来源聚合（GET /posture/sources 出参）
      required: [days, geo_enabled, geo_truncated, top_client_ips, geo_scopes, top_countries, top_identities, auth_types]
      properties:
        days: { type: integer, description: 实际统计窗口天数 }
        geo_enabled: { type: boolean, description: GeoIP 数据源是否可用（false 时 geo_scopes/top_countries 为空） }
        geo_truncated: { type: boolean, description: distinct 客户端 IP 超上限时截断标注（仅 geo_enabled 时有意义） }
        top_client_ips:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureSourceIP' }
        geo_scopes:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureGeoScope' }
        top_countries:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureSourceCountry' }
        top_identities:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureSourceIdentity' }
        auth_types:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureSourceAuthType' }

    ApiSecPostureTargetTraffic:
      type: object
      description: API Top 项（窗口请求量口径）
      required: [endpoint_id, endpoint_key, request_count]
      properties:
        endpoint_id: { type: string, format: uuid }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」） }
        request_count: { type: integer, format: int64, description: 窗口请求量 }

    ApiSecPostureTargetFindings:
      type: object
      description: API Top 项（窗口风险发现口径）
      required: [endpoint_id, endpoint_key, findings_count]
      properties:
        endpoint_id: { type: string, format: uuid }
        endpoint_key: { type: string, description: 接口键 }
        findings_count: { type: integer, format: int64, description: 窗口内风险发现数 }

    ApiSecPostureTargetApplication:
      type: object
      description: 应用访问量 Top 项（application_id 空 = 未分组端点聚合）
      required: [application_name, request_count]
      properties:
        application_id: { type: string, format: uuid, description: 应用 ID（未分组时缺省） }
        application_name: { type: string, description: 应用名称（空串 = 未分组，由前端标注） }
        request_count: { type: integer, format: int64, description: 窗口请求量 }

    ApiSecPostureTargetSensitive:
      type: object
      description: 涉敏 API Top 项（按窗口访问量降序）
      required: [endpoint_id, endpoint_key, request_count, sensitive_fields]
      properties:
        endpoint_id: { type: string, format: uuid }
        endpoint_key: { type: string, description: 接口键 }
        request_count: { type: integer, format: int64, description: 窗口请求量（无访问量如实为 0） }
        sensitive_fields: { type: integer, format: int64, description: 敏感字段数 }

    ApiSecPostureTargetHighRisk:
      type: object
      description: 高风险 API Top 项（asset_value ∈ HIGH/CRITICAL，按窗口访问量降序）
      required: [endpoint_id, endpoint_key, asset_value, request_count]
      properties:
        endpoint_id: { type: string, format: uuid }
        endpoint_key: { type: string, description: 接口键 }
        asset_value: { type: string, enum: [HIGH, CRITICAL], description: 资产价值等级 }
        request_count: { type: integer, format: int64, description: 窗口请求量（无访问量如实为 0） }

    ApiSecPostureTargets:
      type: object
      description: 访问目标排名（GET /posture/targets 出参）
      required: [days, top_by_traffic, top_by_findings, top_applications, top_sensitive, top_high_risk]
      properties:
        days: { type: integer, description: 实际统计窗口天数 }
        top_by_traffic:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureTargetTraffic' }
        top_by_findings:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureTargetFindings' }
        top_applications:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureTargetApplication' }
        top_sensitive:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureTargetSensitive' }
        top_high_risk:
          type: array
          items: { $ref: '#/components/schemas/ApiSecPostureTargetHighRisk' }

    # ---------- 网关节点版本校验（apinodes，W12 + W18-SYNC 同步登记） ----------
    ApiSecGatewayNode:
      type: object
      description: 网关节点视图行（api_gateway_nodes；事件遥测聚合 + 心跳活性维护，000074 叠加配置面同步登记与结果列，非节点注册协议）
      required: [id, node_name, first_seen_at, last_seen_at, last_policy_version, last_model_version, event_count, status, admin_addr, sync_enabled, last_sync_at, last_sync_result, last_sync_error, last_sync_version_id, version_consistent, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: 节点行 ID }
        node_name: { type: string, description: 节点名（事件 gateway_node 字段） }
        first_seen_at: { type: string, format: date-time, description: 首次观测时间 }
        last_seen_at: { type: string, format: date-time, description: 最近活性时间（业务事件与心跳取新；状态判定基准） }
        last_policy_version: { type: string, description: 策略版本（心跳上报优先，否则最新业务事件版本；空串 = 旧版网关未上报） }
        last_model_version: { type: string, description: 最新业务事件模型版本（空串 = 未上报） }
        event_count: { type: integer, format: int64, description: 业务事件总数（心跳不计数） }
        status:
          type: string
          enum: [ACTIVE, STALE, SILENT]
          description: 节点状态（ACTIVE 5 分钟内 / STALE 5 分钟~1 小时 / SILENT 超 1 小时）
        admin_addr: { type: string, description: 节点 Caddy Admin 通道标识（空串 = 未登记，不参与扇出） }
        sync_enabled: { type: boolean, description: 是否参与发布扇出 }
        last_sync_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次同步尝试时间（null = 从未同步）
        last_sync_result:
          type: string
          enum: ['', SUCCESS, FAILED, HASH_MISMATCH]
          description: 最近一次同步结果（空串 = 从未同步）
        last_sync_error: { type: string, description: 最近一次同步失败原因（已截断脱敏；空串 = 无错误） }
        last_sync_version_id:
          type: string
          format: uuid
          nullable: true
          description: 最近一次同步尝试的配置版本 ID（null = 从未同步）
        version_consistent:
          type: boolean
          nullable: true
          description: 策略版本是否与活跃多数派一致（null = 未参与判定：SILENT 离线或未上报版本）
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecNodeSyncUpdateRequest:
      type: object
      description: 节点同步登记编辑入参（PATCH /nodes/{id}；两字段均可选，至少提供一项，均未提供返回 400）
      properties:
        admin_addr:
          type: string
          maxLength: 255
          description: >-
            节点 Caddy Admin 通道标识：unix socket 绝对路径 / unix:///path / http(s)://host[:port]
            （仅内网管理面地址，主机名逐一解析校验；拒绝 userinfo/非根路径/查询/片段）；
            空串 = 清除登记
        sync_enabled:
          type: boolean
          description: 是否参与发布扇出（默认 false，登记 admin_addr 后须显式开启）

    ApiSecNodeListResponse:
      type: object
      description: 节点列表响应（总体一致性口径与 /nodes/consistency 一致）
      required: [items, total, consistent, evaluated_nodes]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecGatewayNode' }
        total: { type: integer, description: 节点总数 }
        consistent: { type: boolean, description: 总体一致性标记（参与判定节点版本去重 ≤ 1） }
        evaluated_nodes: { type: integer, description: 参与判定节点数（0 = 无版本数据可比） }

    ApiSecNodeVersionGroup:
      type: object
      description: 版本分组（活跃节点按 last_policy_version 分组；空串 = 未上报组如实单列）
      required: [policy_version, node_count, nodes]
      properties:
        policy_version: { type: string, description: 策略版本（空串 = 旧版网关未上报） }
        node_count: { type: integer, description: 组内节点数 }
        nodes:
          type: array
          items: { type: string }
          description: 组内节点名（字典序）

    ApiSecNodeConsistencyReport:
      type: object
      description: 节点版本一致性报告（GET /nodes/consistency 出参）
      required: [consistent, evaluated_nodes, dominant_version, groups, silent_nodes, generated_at]
      properties:
        consistent:
          type: boolean
          description: 所有参与判定节点版本是否一致（参与节点为 0 时如实为 true，以 evaluated_nodes=0 呈现）
        evaluated_nodes: { type: integer, description: 参与判定节点数（非 SILENT 且已上报版本） }
        dominant_version: { type: string, description: 多数派版本（无参与节点时为空串） }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ApiSecNodeVersionGroup' }
        silent_nodes:
          type: array
          items: { type: string }
          description: SILENT 离线节点名（不参与判定，如实列出）
        generated_at: { type: string, format: date-time, description: 报告生成时间 }

    # ---------- LLM 输入输出保护策略（apillm WP3-A） ----------
    ApiSecLLMSecurityPolicy:
      type: object
      required: [id, application_id, name, mode, prompt_injection_enabled, input_content_enabled, pii_detection_enabled, output_content_enabled, output_pii_enabled, blocked_topics, max_prompt_bytes, max_output_tokens, enabled, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        name: { type: string, maxLength: 128 }
        mode: { type: string, enum: [OBSERVE, PROTECT] }
        prompt_injection_enabled: { type: boolean }
        input_content_enabled: { type: boolean, description: 输入有害内容高置信规则检测；既有策略迁移默认关闭 }
        pii_detection_enabled: { type: boolean }
        output_content_enabled: { type: boolean, description: 输出有害内容规则检测；既有策略迁移默认关闭 }
        output_pii_enabled: { type: boolean, description: 输出 PII 检测；既有策略迁移默认关闭 }
        blocked_topics:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 64 }
        max_prompt_bytes: { type: integer, description: 0=不限制；其他取值 512～4194304 }
        max_output_tokens: { type: integer, minimum: 0, maximum: 1000000, description: 单次请求声明的输出 Token 上限，0=不限制；检查 max_tokens/max_completion_tokens/max_output_tokens，不是实际消耗量 }
        enabled: { type: boolean }
        version: { type: integer, format: int64 }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecLLMSecurityPolicyInput:
      type: object
      properties:
        application_id: { type: string, format: uuid, description: 新建必填；编辑时不可改应用 }
        name: { type: string, maxLength: 128 }
        mode: { type: string, enum: [OBSERVE, PROTECT] }
        prompt_injection_enabled: { type: boolean }
        input_content_enabled: { type: boolean, description: 输入有害内容高置信规则检测；既有策略迁移默认关闭 }
        pii_detection_enabled: { type: boolean }
        output_content_enabled: { type: boolean, description: 输出有害内容规则检测；既有策略迁移默认关闭 }
        output_pii_enabled: { type: boolean, description: 输出 PII 检测；既有策略迁移默认关闭 }
        blocked_topics:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 64 }
        max_prompt_bytes: { type: integer }
        max_output_tokens: { type: integer, minimum: 0, maximum: 1000000, description: 单次请求声明的输出 Token 上限，0=不限制 }
        enabled: { type: boolean }

    ApiSecLLMSecurityPolicyListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecLLMSecurityPolicy' }
        total: { type: integer, format: int64 }

    ApiSecLLMSecurityPolicyVersion:
      type: object
      required: [id, policy_id, version, policy_snapshot, created_at]
      properties:
        id: { type: string, format: uuid }
        policy_id: { type: string, format: uuid }
        version: { type: integer, format: int64 }
        policy_snapshot: { $ref: '#/components/schemas/ApiSecLLMSecurityPolicy' }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    ApiSecLLMSecurityPolicyVersionListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecLLMSecurityPolicyVersion' }
        total: { type: integer, format: int64 }

    # ---------- LLM API 观测（apillm，P2-04） ----------
    ApiSecLLMObservation:
      type: object
      description: LLM 观测行（api_llm_observations；不落 prompt 原文）
      required: [id, occurred_at, endpoint_key, model, identity_fingerprint, prompt_len_bucket, total_tokens, stream, mcp_method, findings, created_at]
      properties:
        id: { type: string, format: uuid, description: 观测 ID（request_id 派生 UUID 幂等） }
        occurred_at: { type: string, format: date-time, description: 发生时间 }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」） }
        model: { type: string, description: 模型名（请求/响应声明；空串 = 未声明） }
        identity_fingerprint: { type: string, description: 身份指纹（匿名流量为空串） }
        prompt_len_bucket: { type: string, description: prompt 长度分桶（不落原文） }
        total_tokens: { type: integer, description: usage.total_tokens（0 = 流式/缺失未采集到） }
        stream: { type: boolean, description: 是否流式（SSE）调用 }
        mcp_method: { type: string, description: MCP JSON-RPC 方法名（空 = 非 MCP 端点或响应对象） }
        findings:
          type: array
          items: { type: object }
          description: llm.* 检测明细（证据只含规则名/序号/工具名，不含原文与参数值）
        created_at: { type: string, format: date-time }

    ApiSecLLMObservationListResponse:
      type: object
      description: LLM 观测分页响应（统一分页结构）
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecLLMObservation' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, format: int64, description: 总条数 }

    ApiSecLLMStatsSummary:
      type: object
      description: LLM 观测汇总
      required: [observations, with_findings, total_tokens, stream_calls, distinct_models]
      properties:
        observations: { type: integer, format: int64, description: 窗口内观测总数 }
        with_findings: { type: integer, format: int64, description: findings 非空的观测数（涉敏/异常命中口径） }
        total_tokens: { type: integer, format: int64, description: token 用量合计（缺失为 0 的行自然不计） }
        stream_calls: { type: integer, format: int64, description: 流式调用数 }
        distinct_models: { type: integer, format: int64, description: 涉及不同模型数（含空串一组，口径如实） }

    ApiSecLLMModelStat:
      type: object
      description: 模型分布项（按观测数聚合 Top10；空串 = 未声明模型单列一组）
      required: [model, observations, total_tokens, findings]
      properties:
        model: { type: string, description: 模型名 }
        observations: { type: integer, format: int64, description: 观测数 }
        total_tokens: { type: integer, format: int64, description: token 用量合计 }
        findings: { type: integer, format: int64, description: 该模型观测携带的 findings 条数 }

    ApiSecLLMTokenTrendPoint:
      type: object
      description: token 用量趋势点（按天聚合）
      required: [day, observations, total_tokens]
      properties:
        day: { type: string, description: 日期（YYYY-MM-DD） }
        observations: { type: integer, format: int64, description: 当日观测数 }
        total_tokens: { type: integer, format: int64, description: 当日 token 用量 }

    ApiSecLLMFindingRuleStat:
      type: object
      description: 命中规则分布项（findings 按 rule_id 计数）
      required: [rule_id, count]
      properties:
        rule_id: { type: string, description: 规则 ID（llm.*） }
        count: { type: integer, format: int64, description: 命中次数 }

    ApiSecLLMStats:
      type: object
      description: LLM 观测统计（GET /llm/stats 出参；窗口按 occurred_at 口径）
      required: [days, summary, by_model, token_trend, findings_by_rule]
      properties:
        days: { type: integer, description: 实际统计窗口天数 }
        summary: { $ref: '#/components/schemas/ApiSecLLMStatsSummary' }
        by_model:
          type: array
          items: { $ref: '#/components/schemas/ApiSecLLMModelStat' }
        token_trend:
          type: array
          items: { $ref: '#/components/schemas/ApiSecLLMTokenTrendPoint' }
        findings_by_rule:
          type: array
          items: { $ref: '#/components/schemas/ApiSecLLMFindingRuleStat' }

    # ---------- gRPC 描述符集（apigrpcdesc） ----------
    ApiGrpcMethodSummary:
      type: object
      description: gRPC 方法摘要
      properties:
        name: { type: string, description: 方法名 }
        input_type: { type: string, description: '入参全限定类型名（前导点，如 .pkg.Req）' }
        output_type: { type: string, description: 出参全限定类型名（前导点） }
        client_streaming: { type: boolean, description: 是否客户端流式 }
        server_streaming: { type: boolean, description: 是否服务端流式 }

    ApiGrpcServiceSummary:
      type: object
      description: gRPC 服务摘要（service 为 package.Service 全名，无包名时为裸服务名）
      properties:
        service: { type: string, description: 服务全名 }
        methods:
          type: array
          items: { $ref: '#/components/schemas/ApiGrpcMethodSummary' }

    ApiGrpcDescriptor:
      type: object
      description: gRPC 描述符集（api_grpc_descriptors；接口出参不携带 content 字节）
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 描述符集名称（唯一） }
        size_bytes: { type: integer, description: 文件大小（bytes） }
        content_hash: { type: string, description: 内容 sha256 哈希 }
        services:
          type: array
          items: { $ref: '#/components/schemas/ApiGrpcServiceSummary' }
          description: 服务/方法摘要
        status: { type: string, enum: [ENABLED], description: 状态（上传即 ENABLED，删除即下线） }
        created_by: { type: string, description: 上传人用户名 }
        created_at: { type: string, format: date-time }

    ApiGrpcDescriptorListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiGrpcDescriptor' }
        total: { type: integer, description: 总数（不分页） }

    ApiGrpcBinding:
      type: object
      description: gRPC 描述符 per-app 绑定（api_grpc_bindings，NG-GRPC G1 批次 B1；空绑定=全局可见，绑定应用只用绑定集）
      required: [id, application_id, service, descriptor_name, mode, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        service: { type: string, description: "gRPC 服务全名（pkg.Service 点路径形态，全小写段）" }
        descriptor_name: { type: string, description: 引用的描述符集名（api_grpc_descriptors.name） }
        mode: { type: string, enum: [OBSERVE, PROTECT], description: 深检处置（OBSERVE 只记录 / PROTECT 协议化执行（grpc-status trailers）） }
        version: { type: integer, description: 乐观锁版本（写操作携带比对） }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiGrpcBindingInput:
      type: object
      required: [application_id, service, descriptor_name]
      properties:
        application_id: { type: string, format: uuid }
        service: { type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$', maxLength: 256 }
        descriptor_name: { type: string, maxLength: 128 }
        mode: { type: string, enum: [OBSERVE, PROTECT], default: OBSERVE }

    ApiGrpcBindingUpdateInput:
      type: object
      required: [descriptor_name, version]
      properties:
        descriptor_name: { type: string, maxLength: 128 }
        mode: { type: string, enum: [OBSERVE, PROTECT] }
        version: { type: integer, minimum: 1, description: 乐观锁版本（与绑定行 version 精确比对，不匹配 409） }

    ApiGrpcBindingListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiGrpcBinding' }
        total: { type: integer, description: 总数（不分页） }

    ApiGrpcUndocumentedService:
      type: object
      description: 未登记 gRPC 服务（流量观测到但未覆盖描述符；按应用+服务分桶）
      required: [application_id, service, methods]
      properties:
        application_id: { type: string, format: uuid }
        service: { type: string }
        methods:
          type: array
          items: { type: string }
          description: 未登记方法名清单

    ApiGrpcUndocumentedServiceListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiGrpcUndocumentedService' }
        total: { type: integer, description: 总数（不分页） }

    ApiMcpToolCatalog:
      type: object
      description: MCP 工具目录（mcp_tool_catalogs，NG-MCP G1 批次 B1；服务身份维度；发布通道只下发 ENABLED 目录的 APPROVED 工具行）
      required: [id, name, service_identity, protocol_version, source, status, catalog_hash, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 128, description: 目录名（全局唯一） }
        service_identity: { type: string, maxLength: 256, description: 服务身份（如 mcp://pay.example.com） }
        protocol_version: { type: string, description: "MCP 协议版本（缺省 2025-11-25）" }
        source: { type: string, enum: [MANUAL_IMPORT], description: 来源（G1 仅显式导入） }
        status: { type: string, enum: [ENABLED, DISABLED], description: 启停（DISABLED 不下发） }
        catalog_hash: { type: string, description: "发布集摘要（mcp-catalog-sha256:v1:+64 hex；APPROVED 工具 tool_hash 排序拼接 sha256）" }
        version: { type: integer, description: 乐观锁版本（写操作携带比对） }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiMcpToolCatalogSummary:
      allOf:
        - $ref: '#/components/schemas/ApiMcpToolCatalog'
        - type: object
          description: 目录列表行（含审核统计）
          properties:
            tool_count: { type: integer }
            approved_count: { type: integer }
            pending_count: { type: integer }
            rejected_count: { type: integer }

    ApiMcpArgConstraint:
      type: object
      description: 参数范围约束（G1 两种确定性形态）
      required: [field, kind]
      properties:
        field: { type: string, maxLength: 128, description: 参数字段点路径（如 path/url） }
        kind: { type: string, enum: [path_prefix, domain_suffix] }
        allow:
          type: array
          items: { type: string, maxLength: 512 }
          description: 允许前缀/后缀集合（非空）

    ApiMcpTool:
      type: object
      description: MCP 目录工具行（tool_hash 审批绑定不可变摘要；发布只下发 APPROVED）
      required: [id, catalog_id, tool_name, tool_version, description_digest, tool_hash, risk_level, data_classification, approval_required, max_calls_per_minute, review_status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        catalog_id: { type: string, format: uuid }
        tool_name: { type: string, maxLength: 128 }
        tool_version: { type: string, maxLength: 128 }
        description_digest: { type: string, description: 规范化描述全文 sha256（hex） }
        description_preview: { type: string, maxLength: 512, description: 描述截断预览（仅管理面展示，永不为证据） }
        input_schema: { type: object, nullable: true, description: 输入 JSON Schema（可空） }
        output_schema: { type: object, nullable: true, description: 输出 JSON Schema（可空） }
        input_schema_digest: { type: string }
        output_schema_digest: { type: string }
        tool_hash: { type: string, pattern: '^mcp-tool-sha256:v1:[0-9a-f]{64}$', description: 五元组（名称/版本/规范化描述全文/双 schema）域分隔 sha256 }
        capability_tags: { type: array, items: { type: string } }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH], description: 导入缺省 HIGH（未定级按高风险对待） }
        data_classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, UNKNOWN], description: 导入缺省 UNKNOWN }
        allowed_principals: { type: array, items: { type: string }, description: 空=该维度不约束，非空逐维 AND }
        allowed_roles: { type: array, items: { type: string } }
        allowed_tenants: { type: array, items: { type: string } }
        approval_required: { type: boolean, description: 数据前向兼容字段（G1 语义=默认拒绝同 HIGH） }
        max_calls_per_minute: { type: integer, minimum: 0, description: 0=不限 }
        arg_constraints:
          type: array
          items: { $ref: '#/components/schemas/ApiMcpArgConstraint' }
        review_status: { type: string, enum: [PENDING_REVIEW, APPROVED, REJECTED], description: 导入与语义变更恒落 PENDING_REVIEW }
        reviewed_by: { type: string }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiMcpToolInput:
      type: object
      required: [tool_name]
      properties:
        tool_name: { type: string, maxLength: 128 }
        tool_version: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 65536, description: 规范化描述全文（入 tool_hash） }
        input_schema: { type: object, nullable: true }
        output_schema: { type: object, nullable: true }
        capability_tags: { type: array, items: { type: string } }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH], default: HIGH }
        data_classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, UNKNOWN], default: UNKNOWN }
        allowed_principals: { type: array, items: { type: string } }
        allowed_roles: { type: array, items: { type: string } }
        allowed_tenants: { type: array, items: { type: string } }
        approval_required: { type: boolean, default: false }
        max_calls_per_minute: { type: integer, minimum: 0, default: 0 }
        arg_constraints:
          type: array
          items: { $ref: '#/components/schemas/ApiMcpArgConstraint' }

    ApiMcpToolCatalogInput:
      type: object
      required: [name, service_identity, tools]
      properties:
        name: { type: string, maxLength: 128 }
        service_identity: { type: string, maxLength: 256 }
        protocol_version: { type: string, maxLength: 32, default: '2025-11-25' }
        tools:
          type: array
          items: { $ref: '#/components/schemas/ApiMcpToolInput' }
          description: 工具集整体提交（整体替换语义；空数组=空目录合法）
        version: { type: integer, minimum: 1, description: PUT 乐观锁必填（POST 忽略） }

    ApiMcpToolReviewInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [APPROVED, REJECTED] }
        risk_level: { type: string, enum: [LOW, MEDIUM, HIGH] }
        data_classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, UNKNOWN] }
        allowed_principals: { type: array, items: { type: string } }
        allowed_roles: { type: array, items: { type: string } }
        allowed_tenants: { type: array, items: { type: string } }
        approval_required: { type: boolean }
        max_calls_per_minute: { type: integer, minimum: 0 }

    ApiMcpToolCatalogDetailResponse:
      type: object
      properties:
        catalog: { $ref: '#/components/schemas/ApiMcpToolCatalog' }
        tools:
          type: array
          items: { $ref: '#/components/schemas/ApiMcpTool' }

    ApiMcpToolCatalogListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiMcpToolCatalogSummary' }
        total: { type: integer, description: 总数（不分页） }

    ApiMcpBinding:
      type: object
      description: MCP 目录 per-app 绑定（mcp_catalog_bindings；绑定驱动识别；空绑定=网关 MCP 管控零行为）
      required: [id, application_id, endpoint_path, catalog_id, catalog_name, mode, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        endpoint_path: { type: string, maxLength: 1024, description: "MCP 端点精确路径（/ 开头，大小写敏感）" }
        catalog_id: { type: string, format: uuid }
        catalog_name: { type: string, description: 目录名（JOIN 带出） }
        mode: { type: string, enum: [OBSERVE, PROTECT], description: OBSERVE 只记录 / PROTECT 协议化执行（JSON-RPC 错误对象） }
        version: { type: integer, description: 乐观锁版本（写操作携带比对） }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiMcpBindingInput:
      type: object
      required: [application_id, endpoint_path, catalog_id]
      properties:
        application_id: { type: string, format: uuid }
        endpoint_path: { type: string, pattern: '^/', maxLength: 1024 }
        catalog_id: { type: string, format: uuid }
        mode: { type: string, enum: [OBSERVE, PROTECT], default: OBSERVE }

    ApiMcpBindingUpdateInput:
      type: object
      required: [catalog_id, version]
      properties:
        catalog_id: { type: string, format: uuid }
        mode: { type: string, enum: [OBSERVE, PROTECT] }
        version: { type: integer, minimum: 1, description: 乐观锁版本（与绑定行 version 精确比对，不匹配 409） }

    ApiMcpBindingListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiMcpBinding' }
        total: { type: integer, description: 总数（不分页） }

    # ---------- 机器身份登记（apimachineid，NG-ID g1 批次 B1） ----------
    ApiMachineIdentity:
      type: object
      description: 机器身份（machine_identities，NG-ID g1 批次 B1；HTTP Message Signatures 可信身份登记；发布通道只下发 ENABLED 身份）
      required: [id, identity_name, status, bot_challenge_exempt, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        identity_name: { type: string, maxLength: 128, description: 身份名（全局唯一） }
        tenant_id: { type: string, maxLength: 128, nullable: true, description: 租户范围（null=跨租户共享身份） }
        principal_binding: { type: string, maxLength: 128, nullable: true, description: 绑定 JWT VerifiedPrincipalID 指纹值（声明即强制一致） }
        status: { type: string, enum: [ENABLED, DISABLED], description: 启停（DISABLED 不下发不参与验证） }
        bot_challenge_exempt: { type: boolean, description: Bot 精确豁免前提之一（缺省 false） }
        version: { type: integer, description: 乐观锁版本（写操作携带比对） }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiMachineIdentitySummary:
      allOf:
        - $ref: '#/components/schemas/ApiMachineIdentity'
        - type: object
          description: 身份列表行（含键状态摘要）
          properties:
            key_count: { type: integer }
            active_keys: { type: integer }
            retired_keys: { type: integer }
            revoked_keys: { type: integer }

    ApiMachineIdentityKey:
      type: object
      description: 机器身份公钥（machine_identity_keys；ACTIVE/RETIRED/REVOKED 状态机+重叠窗口+revoked_seq 水位溯源；指纹管理面现算不落库）
      required: [id, identity_id, kid, alg, public_key_pem, key_fingerprint, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        identity_id: { type: string, format: uuid }
        kid: { type: string, maxLength: 128, description: 键标识（身份内唯一；签名 keyid 登记册精确查找） }
        alg: { type: string, enum: [ed25519, ecdsa-p256-sha256, rsa-pss-sha512], description: 算法词表（hmac-sha256/rsa-v1_5-sha256 排除） }
        public_key_pem: { type: string, description: 公钥 PEM（公钥非秘密，明文存储合法） }
        key_fingerprint: { type: string, description: 公钥指纹（sha256 前 16 hex，管理面现算——管理面与事件稳定引用） }
        status: { type: string, enum: [ACTIVE, RETIRED, REVOKED], description: ACTIVE 可签发可验证 / RETIRED 重叠窗口内仅验证 / REVOKED 立即拒验 }
        not_before: { type: string, format: date-time, nullable: true }
        not_after: { type: string, format: date-time, nullable: true }
        retire_overlap_until: { type: string, format: date-time, nullable: true, description: RETIRED 重叠窗口终点（窗口外旧键拒验） }
        revoked_seq: { type: integer, format: int64, nullable: true, description: 撤销时水位值（溯源；未撤销为 null） }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiMachineIdentityInput:
      type: object
      required: [identity_name]
      properties:
        identity_name: { type: string, maxLength: 128 }
        tenant_id: { type: string, maxLength: 128, nullable: true }
        principal_binding: { type: string, maxLength: 128, nullable: true }
        status: { type: string, enum: [ENABLED, DISABLED], default: ENABLED }
        bot_challenge_exempt: { type: boolean, default: false }
        version: { type: integer, minimum: 1, description: PUT 乐观锁必填（POST 忽略） }

    ApiMachineIdentityKeyInput:
      type: object
      required: [kid, alg, public_key_pem]
      properties:
        kid: { type: string, maxLength: 128 }
        alg: { type: string, enum: [ed25519, ecdsa-p256-sha256, rsa-pss-sha512], description: 声明算法（与 PEM 实际键型一致性核对——不符 400） }
        public_key_pem: { type: string, maxLength: 8192, description: 公钥 PEM（PKIX PUBLIC KEY 或 RSA PUBLIC KEY 块，恰一个公钥块） }
        not_before: { type: string, format: date-time, nullable: true }
        not_after: { type: string, format: date-time, nullable: true }
        overlap_hours: { type: integer, minimum: 1, maximum: 168, nullable: true, description: 仅 rotate 消费：重叠窗口小时数（缺省 24，上限 168） }

    ApiMachineIdentityResponse:
      type: object
      properties:
        identity: { $ref: '#/components/schemas/ApiMachineIdentity' }

    ApiMachineIdentityDetailResponse:
      type: object
      properties:
        identity: { $ref: '#/components/schemas/ApiMachineIdentity' }
        keys:
          type: array
          items: { $ref: '#/components/schemas/ApiMachineIdentityKey' }

    ApiMachineIdentityListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiMachineIdentitySummary' }
        total: { type: integer, description: 总数（不分页） }
        revocation_watermark: { type: integer, format: int64, description: 撤销水位（machine_identity_revocation_watermark 单行 seq，随列表响应带出） }

    ApiMachineIdentityRotateResponse:
      type: object
      description: 轮换结果（同一事务原子：新键 ACTIVE+旧键 RETIRED+重叠窗口）
      properties:
        key: { $ref: '#/components/schemas/ApiMachineIdentityKey' }
        retired_key: { $ref: '#/components/schemas/ApiMachineIdentityKey' }

    ApiMachineIdentityBinding:
      type: object
      description: 机器身份 per-app 绑定（machine_identity_bindings；绑定驱动识别；绑定不引用身份——登记册全局生效；空绑定=网关机器身份评估零行为）
      required: [id, application_id, path_exact, path_prefix, mode, proof_required, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        path_exact: { type: string, description: 精确路径（与 path_prefix 二选一，缺省一侧为空串） }
        path_prefix: { type: string, description: 路径前缀（jwt selector 同形） }
        mode: { type: string, enum: [OBSERVE, PROTECT], description: OBSERVE 只记录 / PROTECT 验签失败与违规模态协议化执行 }
        proof_required: { type: boolean, description: true=绑定命中且未签名请求拒绝 401；false=未签名按普通流量继续既有防护 }
        version: { type: integer, description: 乐观锁版本（写操作携带比对） }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiMachineIdentityBindingInput:
      type: object
      required: [application_id]
      properties:
        application_id: { type: string, format: uuid }
        path_exact: { type: string, pattern: '^/', maxLength: 512, description: 与 path_prefix 必须且仅须提供一个 }
        path_prefix: { type: string, pattern: '^/', maxLength: 512 }
        mode: { type: string, enum: [OBSERVE, PROTECT], default: OBSERVE }
        proof_required: { type: boolean, default: false }

    ApiMachineIdentityBindingUpdateInput:
      type: object
      required: [version]
      properties:
        mode: { type: string, enum: [OBSERVE, PROTECT] }
        proof_required: { type: boolean }
        version: { type: integer, minimum: 1, description: 乐观锁版本（与绑定行 version 精确比对，不匹配 409） }

    ApiMachineIdentityBindingListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiMachineIdentityBinding' }
        total: { type: integer, description: 总数（不分页） }

    # ---------- 业务流程基线（apiflows，阶段8 §44） ----------
    ApiFlowStep:
      type: object
      description: 流程步骤（api_flow_baseline_steps；endpoint_key 由 api_endpoints 关联带出）
      required: [step_id, endpoint_id, sequence]
      properties:
        id: { type: string, format: uuid, description: 步骤行 ID（仅出参） }
        step_id: { type: string, maxLength: 128, description: 步骤标识（同一流程内唯一） }
        endpoint_id: { type: string, format: uuid, description: 绑定端点（api_endpoints.id） }
        endpoint_key: { type: string, description: 端点键（仅出参；METHOD + 空格 + 路径模板） }
        sequence: { type: integer, description: 流程内单调序号（逆序判定基准） }
        predecessors:
          type: array
          items: { type: string }
          description: 期望前置步骤 step_id 列表（AND 语义；空 = 无前置约束）
        terminal: { type: boolean, description: 是否流程终点（描述性字段） }
        state_from: { type: string, maxLength: 64, description: 要求的对象前置状态（空 = 不参与状态机判定） }
        state_to: { type: string, maxLength: 64, description: 步骤完成后的对象状态（空 = 不推进状态记录） }
        max_per_window: { type: integer, minimum: 0, default: 0, description: 步骤级短窗调用上限（>0 启用 rapid_batch 步骤级判定；0 = 不判定，向后兼容） }
        rate_window_seconds: { type: integer, minimum: 0, maximum: 600, default: 0, description: 步骤级短窗秒数（>0 覆盖缺省 60s；上限 600s = 会话 TTL） }
        cancels_flow: { type: boolean, default: false, description: 取消语义声明（true = 本步骤执行后流程视为已取消；post_cancel_operation 判定的唯一来源） }

    ApiFlowBaseline:
      type: object
      description: 业务流程基线（api_flow_baselines；含步骤明细）
      properties:
        id: { type: string, format: uuid }
        flow_id: { type: string, maxLength: 128, description: 流程标识（全局唯一，发布契约键） }
        name: { type: string, description: 展示名 }
        description: { type: string }
        enabled: { type: boolean, description: 仅启用行进入发布载荷 }
        version: { type: integer, description: 乐观锁版本戳（编辑 +1） }
        max_per_window: { type: integer, minimum: 0, default: 0, description: 流程级短窗调用上限（任意步骤合计；>0 启用 rapid_batch 流程级判定；0 = 不判定） }
        rate_window_seconds: { type: integer, minimum: 0, maximum: 600, default: 0, description: 流程级短窗秒数（>0 覆盖缺省 60s；上限 600s = 会话 TTL） }
        steps:
          type: array
          items: { $ref: '#/components/schemas/ApiFlowStep' }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiFlowBaselineSummary:
      type: object
      description: 流程基线列表行（不含步骤明细，带步骤数）
      properties:
        id: { type: string, format: uuid }
        flow_id: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        version: { type: integer }
        step_count: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiFlowBaselineListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiFlowBaselineSummary' }
        total: { type: integer, description: 总数（不分页） }

    ApiFlowBaselineUpsertRequest:
      type: object
      description: 流程基线创建/整体替换请求（校验口径与网关 detectors.ValidateFlowBaselines 一致）
      required: [flow_id, steps]
      properties:
        flow_id: { type: string, maxLength: 128, description: 流程标识（唯一；冲突 409） }
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 1024 }
        enabled: { type: boolean, description: 缺省 true }
        max_per_window: { type: integer, minimum: 0, default: 0, description: 流程级短窗调用上限（0 = 不判定） }
        rate_window_seconds: { type: integer, minimum: 0, maximum: 600, default: 0, description: 流程级短窗秒数（0 = 缺省 60s；上限 600s = 会话 TTL） }
        steps:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: '#/components/schemas/ApiFlowStep' }
        expected_version: { type: integer, description: 乐观锁版本（仅 PUT 必填；冲突 409） }

    # ---------- 已吊销凭据（apirevokedcreds，§35，迁移 000156） ----------
    ApiRevokedCredential:
      type: object
      description: 已吊销凭据（api_revoked_credentials；指纹级，无凭据明文）
      properties:
        id: { type: string, format: uuid }
        credential_type: { type: string, enum: [auth, key, sess], description: 凭据来源上下文（与网关身份指纹前缀一致：auth=Authorization / key=X-API-Key / sess=Cookie） }
        fingerprint: { type: string, pattern: '^[0-9a-f]{32}$', description: 加盐 HMAC-SHA256 截断 16 字节 hex（32 位，不含前缀） }
        reason: { type: string, description: 吊销原因 }
        revoked_by: { type: string, description: 吊销人（服务端取自登录主体） }
        effective_from: { type: string, format: date-time, description: 生效时间 }
        effective_until: { type: string, format: date-time, nullable: true, description: 到期时间（空 = 永久吊销） }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiRevokedCredentialListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiRevokedCredential' }
        total: { type: integer, description: 总数（不分页） }

    ApiRevokedCredentialCreateRequest:
      type: object
      description: 登记吊销凭据请求（指纹校验与迁移 000156 CHECK 同口径）
      required: [credential_type, fingerprint, reason]
      properties:
        credential_type: { type: string, enum: [auth, key, sess] }
        fingerprint: { type: string, pattern: '^[0-9a-f]{32}$', description: 32 位 hex 加盐指纹（大小写不敏感，入库归一为小写） }
        reason: { type: string, maxLength: 512, description: 吊销原因（必填） }
        effective_from: { type: string, format: date-time, description: 生效时间（缺省当前时间） }
        effective_until: { type: string, format: date-time, nullable: true, description: 到期时间（空 = 永久吊销；须晚于 effective_from） }

    ApiRevokedCredentialUpdateRequest:
      type: object
      description: 调整吊销凭据请求（仅原因与生效窗口可变；吊销对象身份不可变更）
      required: [reason, effective_from]
      properties:
        reason: { type: string, maxLength: 512 }
        effective_from: { type: string, format: date-time }
        effective_until: { type: string, format: date-time, nullable: true, description: 空 = 永久吊销；须晚于 effective_from }

    # ---------- 统一执行覆盖（coverage；NG-COV-02 查询侧） ----------
    ApiSecCoverageAggRow:
      type: object
      description: 覆盖聚合行（coverage_minute_agg 维度键 + 五态计数；E=full+partial+skipped+error，not_applicable 另计不进 E；E=0 时 no_applicable_traffic=true 且比率为 0，绝不显示 100%）
      properties:
        application_id: { type: string, description: 应用标识（网关上报原样维度键） }
        endpoint_key: { type: string, description: 接口键（「METHOD 路径模板」；维度超限归拢时为 other） }
        detector: { type: string, description: 命名空间检测器（维度超限归拢时为 other） }
        phase: { type: string, enum: [request, response] }
        policy_version: { type: string }
        node_id: { type: string }
        minute: { type: string, format: date-time, description: 分钟桶起点（UTC） }
        full: { type: integer, format: int64 }
        partial: { type: integer, format: int64 }
        skipped: { type: integer, format: int64 }
        error: { type: integer, format: int64 }
        not_applicable: { type: integer, format: int64, description: 另计，不进 E }
        e: { type: integer, format: int64, description: 有效集合 FULL+PARTIAL+SKIPPED+ERROR }
        full_rate: { type: number, format: double, description: 完整检查率 FULL/E（E=0 时为 0） }
        effective_rate: { type: number, format: double, description: 有效执行率 (FULL+PARTIAL)/E（E=0 时为 0） }
        no_applicable_traffic: { type: boolean, description: E=0（无适用流量）时 true，绝不显示 100% }

    ApiSecCoverageAggResponse:
      type: object
      description: agg 视图响应 data
      properties:
        view: { type: string, enum: [agg] }
        window_minutes: { type: integer, description: 实际生效窗口（夹紧/归一后） }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        data_incomplete: { type: boolean, description: 窗口内节点最新 cov_ingest 快照 agg_overflow>0 或 agg_invalid>0 时 true（统计输入不完整如实披露） }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ApiSecCoverageAggRow' }

    ApiSecCoverageStageCount:
      type: object
      description: 单阶段计数（阶段集合与顺序跨仓冻结：gateway coverage_counters.go covStageOrder）
      properties:
        stage: { type: string, enum: [total, rejected_manual_ban, rejected_ip_blacklist, rejected_auto_ban, rejected_l7_acl, rejected_cc, rejected_license_quota, intercepted_bot, intercepted_waf, reached_api_pipeline, reached_upstream] }
        count: { type: integer, format: int64 }

    ApiSecCoverageNodeStages:
      type: object
      description: 单节点最新一份阶段计数
      properties:
        node_id: { type: string }
        captured_at: { type: string, format: date-time }
        counts:
          type: array
          items: { $ref: '#/components/schemas/ApiSecCoverageStageCount' }

    ApiSecCoverageStagesResponse:
      type: object
      description: stages 视图响应 data（缺失阶段补零保序输出；空数据 nodes 为空数组）
      properties:
        view: { type: string, enum: [stages] }
        window_minutes: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ApiSecCoverageNodeStages' }

    # ---------- 无副作用模拟（validations；NG-COV-03） ----------
    ApiSecValidationFindingMatch:
      type: object
      description: 脱敏 Finding 命中（结构化字段；禁止携带 evidence 原文——服务端拒绝）
      required: [detector]
      properties:
        detector: { type: string, maxLength: 256, description: 命名空间检测器（必填，如 api_schema） }
        rule_id: { type: string, maxLength: 256 }
        category: { type: string, maxLength: 256 }
        severity: { type: string, maxLength: 256 }
        message: { type: string, maxLength: 256 }
        score_delta: { type: integer, description: 决策分增量（正分参与阻断判定） }
        confidence: { type: number, format: double }
        model_version: { type: string, maxLength: 256 }
        policy_version: { type: string, maxLength: 256 }

    ApiSecValidationExceptionRef:
      type: object
      description: 受限例外引用（命中后证据保留、仅取消执法贡献）
      properties:
        exception_id: { type: string, maxLength: 256 }
        version: { type: integer }
        detector_id: { type: string, maxLength: 256 }
        rule_id: { type: string, maxLength: 256 }
        model_version: { type: string, maxLength: 256 }

    ApiSecValidationFindingBatch:
      type: object
      description: 一批脱敏 Finding 输入（matches 为空且 missing_reason 非空 → CANNOT_REPRODUCE；两者皆空 → EVIDENCE_INSUFFICIENT）
      required: [input_id]
      properties:
        input_id: { type: string, maxLength: 256, description: 输入标识（必填） }
        matches:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ApiSecValidationFindingMatch' }
        exceptions:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ApiSecValidationExceptionRef' }
        missing_reason: { type: string, maxLength: 256, description: 缺原始输入原因（协议不可复现/证据缺失） }

    ApiSecValidationCreateRequest:
      type: object
      description: 创建模拟报告请求（脱敏输入；上限违反返回 400）
      required: [batches]
      properties:
        batches:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ApiSecValidationFindingBatch' }

    ApiSecValidationVerdict:
      type: object
      description: 单条输入的模拟结论（would_block 为模拟判定，非已执行）
      properties:
        input_id: { type: string }
        status: { type: string, enum: [EVALUATED, CANNOT_REPRODUCE, EVIDENCE_INSUFFICIENT] }
        candidate_action: { type: string, description: 决策前候选（与最终动作分离） }
        final_action: { type: string }
        would_block: { type: boolean, description: 若启用将阻断（模拟判定，非已执行） }
        exception_hit: { type: boolean, description: 命中受限例外（证据保留） }
        notes: { type: string }

    ApiSecValidationReport:
      type: object
      description: 模拟报告（策略/语料/输入摘要绑定；STALE 读出时求值；模拟不是 PROTECT 实测，不能单独满足上线条件）
      properties:
        id: { type: string, format: uuid }
        policy_digest: { type: string, description: 创建时策略摘要（发布链当前生效版本 configuration_hash） }
        corpus_digest: { type: string, description: 语料摘要（输入集合结构化摘要） }
        inputs_digest: { type: string, description: 输入内容摘要（Finding 内容规范化摘要） }
        status: { type: string, enum: [COMPLETED, STALE], description: 创建时恒 COMPLETED；读出时与当前摘要不一致即 STALE（不回写数据库） }
        verdicts:
          type: array
          items: { $ref: '#/components/schemas/ApiSecValidationVerdict' }
        resource_note: { type: string }
        created_at: { type: string, format: date-time }

    ApiSecValidationListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecValidationReport' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }

    # ---------- GraphQL 成本预算策略（apigql；NG-GQL-03） ----------
    ApiSecGraphQLLimits:
      type: object
      description: 解析硬边界覆盖（零值字段 = 网关引擎默认：64KiB/深度20/节点10000/alias100/fragment展开1000）
      properties:
        max_doc_bytes: { type: integer, minimum: 0, maximum: 67108864, description: 文档字节硬上限（≤64MiB） }
        max_depth: { type: integer, minimum: 0, description: 选择集嵌套深度 }
        max_nodes: { type: integer, minimum: 0, description: 展开前选择集节点预算 }
        max_aliases: { type: integer, minimum: 0, description: alias 数上限 }
        max_fragment_exp: { type: integer, minimum: 0, description: 单 fragment 展开次数预算 }

    ApiSecGraphQLFieldWeight:
      type: object
      description: 字段级权重覆盖（base 与列表批准上界；0 = 用默认）
      properties:
        weight: { type: integer, format: int64, minimum: 0 }
        list_bound: { type: integer, format: int64, minimum: 0 }

    ApiSecGraphQLWeights:
      type: object
      description: 权重三层覆盖（Type.field > *.field > 默认/内省特判；Schema 缺失全走默认）
      properties:
        default_field_weight: { type: integer, format: int64, minimum: 0, description: 默认字段基价（0→1） }
        default_list_bound: { type: integer, format: int64, minimum: 0, description: 默认列表批准上界（0→100） }
        introspection_weight: { type: integer, format: int64, minimum: 0, description: 内省字段特判权重（0→50） }
        fields:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ApiSecGraphQLFieldWeight' }
          description: 字段路径覆盖（键形如 Query.users 或 *.field，≤128 字符，≤4096 条）

    ApiSecGraphQLBudget:
      type: object
      description: 单请求与时间窗预算（0 值走引擎默认：5000/60s/100000/匿名20000）
      properties:
        per_request_budget: { type: integer, format: int64, minimum: 0, description: 单请求结构预算 }
        window_seconds: { type: integer, format: int64, minimum: 0, description: 时间窗长度（秒） }
        window_budget: { type: integer, format: int64, minimum: 0, description: 主体/租户窗口预算 }
        anonymous_budget: { type: integer, format: int64, minimum: 0, description: 匿名独立桶预算 }

    ApiSecGraphQLPolicy:
      type: object
      description: GraphQL 成本预算策略（与发布 payload 同构；enabled=false 即关闭）
      properties:
        enabled: { type: boolean }
        limits: { $ref: '#/components/schemas/ApiSecGraphQLLimits' }
        weights: { $ref: '#/components/schemas/ApiSecGraphQLWeights' }
        budget: { $ref: '#/components/schemas/ApiSecGraphQLBudget' }
        trusted_doc_digests:
          type: array
          maxItems: 1024
          items: { type: string, pattern: '^[0-9a-f]{32}$' }
          description: 可信文档摘要白名单（gqlast.DigestDocument 规范化 sha256 前 16 字节 hex；APQ 摘要不自动可信）

    ApiSecGraphQLPolicyView:
      type: object
      description: 策略视图（无策略行时 enabled=false、version=0 的默认视图，非 404）
      allOf:
        - $ref: '#/components/schemas/ApiSecGraphQLPolicy'
        - type: object
          properties:
            application_id: { type: string, format: uuid }
            version: { type: integer, description: 单调版本（PUT +1） }
            updated_at: { type: string }
            updated_by: { type: string }

    # ---------- 权威关系接入（apiauthzauthority；NG-AZ-01） ----------
    ApiSecAuthzAuthorityScopes:
      type: object
      description: 来源范围授权（空数组 = 不限该维度；校验链第 2 步白名单）
      properties:
        tenant_domains:
          type: array
          items: { type: string, maxLength: 128 }
        object_types:
          type: array
          items: { type: string, maxLength: 128 }

    ApiSecAuthzAuthorityKey:
      type: object
      description: 来源验签公钥（Ed25519 32 字节 hex；三把钥匙不混用；RETIRED 键仅轮换窗口内验签）
      properties:
        key_id: { type: string, maxLength: 64 }
        public_key_hex: { type: string, pattern: '^[0-9a-f]{64}$' }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        retired_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ApiSecAuthzAuthoritySource:
      type: object
      description: 权威关系来源
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 128 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        scopes: { $ref: '#/components/schemas/ApiSecAuthzAuthorityScopes' }
        max_event_age_seconds: { type: integer, format: int64, nullable: true, description: 可空=不限（仅轮换窗口与陈旧判定用默认 24h） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, description: 乐观锁版本（PATCH 须回传） }

    ApiSecAuthzAuthorityDetail:
      allOf:
        - $ref: '#/components/schemas/ApiSecAuthzAuthoritySource'
        - type: object
          properties:
            keys:
              type: array
              items: { $ref: '#/components/schemas/ApiSecAuthzAuthorityKey' }

    ApiSecAuthzAuthorityCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        scopes: { $ref: '#/components/schemas/ApiSecAuthzAuthorityScopes' }
        max_event_age_seconds: { type: integer, format: int64, nullable: true }
        keys:
          type: array
          maxItems: 16
          items:
            type: object
            required: [key_id, public_key_hex]
            properties:
              key_id: { type: string, maxLength: 64 }
              public_key_hex: { type: string, pattern: '^[0-9a-f]{64}$' }

    ApiSecAuthzAuthorityPatchRequest:
      type: object
      required: [version]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }
        scopes: { $ref: '#/components/schemas/ApiSecAuthzAuthorityScopes' }
        max_event_age_seconds: { type: integer, format: int64, nullable: true }
        add_keys:
          type: array
          maxItems: 16
          items:
            type: object
            required: [key_id, public_key_hex]
            properties:
              key_id: { type: string, maxLength: 64 }
              public_key_hex: { type: string, pattern: '^[0-9a-f]{64}$' }
        retire_keys:
          type: array
          items: { type: string, maxLength: 64 }
        version: { type: integer }

    ApiSecAuthzAuthorityEvent:
      type: object
      description: 权威变更事件（source_signature 为对其余字段规范化字节（键序字典序紧凑 JSON）的 Ed25519 签名 hex）
      required: [source_id, event_id, key_id, sequence, object_type, tenant_domain, principal_ref, object_ref, relation, change_type, valid_from, issued_at, source_signature]
      properties:
        source_id: { type: string }
        event_id: { type: string, maxLength: 128 }
        key_id: { type: string, maxLength: 64 }
        sequence: { type: integer, format: int64, minimum: 1 }
        object_type: { type: string, maxLength: 128 }
        tenant_domain: { type: string, maxLength: 128 }
        principal_ref: { type: string, maxLength: 128, description: HMAC 域隔离主体引用（非明文身份） }
        object_ref: { type: string, maxLength: 160, description: "objref: 前缀 HMAC 引用形态" }
        relation: { type: string, enum: [OWNER], description: 首批唯一排他关系词（共享/委托/组继承不支持拒收） }
        change_type: { type: string, enum: [GRANT, REVOKE] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time, description: 可空=不限（必须晚于 valid_from） }
        issued_at: { type: string, format: date-time }
        source_signature: { type: string, pattern: '^[0-9a-f]{128}$' }

    ApiSecAuthzAuthorityImportRequest:
      type: object
      required: [batch_id, source_id, mode, key_id, items, batch_signature]
      properties:
        batch_id: { type: string, maxLength: 64 }
        source_id: { type: string, description: 须与路径来源一致 }
        mode: { type: string, enum: [snapshot, delta] }
        key_id: { type: string, maxLength: 64, description: 批次签名验签公钥 }
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/ApiSecAuthzAuthorityEvent' }
        batch_signature: { type: string, pattern: '^[0-9a-f]{128}$', description: 对批次规范化字节的 Ed25519 签名 hex }

    ApiSecAuthzAuthorityBatchCounts:
      type: object
      properties:
        applied: { type: integer }
        skipped_duplicate: { type: integer, description: event_id 已消费跳过计数 }
        skipped_stale: { type: integer }
        grants: { type: integer }
        revokes: { type: integer }
        conflicts: { type: integer, description: 冲突拒绝的 GRANT 数（不落关系行只记冲突） }

    ApiSecAuthzAuthorityBatch:
      type: object
      description: 导入批次记录（REJECTED 批次同样留痕）
      properties:
        id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        mode: { type: string, enum: [snapshot, delta] }
        status: { type: string, enum: [APPLIED, REJECTED] }
        counts: { $ref: '#/components/schemas/ApiSecAuthzAuthorityBatchCounts' }
        error: { type: string, description: 拒绝原因（校验链步骤 + 逐条明细） }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    ApiSecAuthzAuthorityWatermark:
      type: object
      properties:
        last_sequence: { type: integer, format: int64 }
        last_event_id: { type: string }
        revocation_watermark: { type: integer, format: int64, description: 单调不下降 }
        gap_from: { type: integer, format: int64, nullable: true, description: 非空即 AUTHZ_SOURCE_GAP（补齐自动消除） }
        updated_at: { type: string, format: date-time }

    ApiSecAuthzAuthorityConflict:
      type: object
      description: 冲突状态（同对象两个不同 principal 的有效 OWNER；不按最后到达者覆盖）
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        object_type: { type: string }
        tenant_domain: { type: string }
        object_ref: { type: string }
        principals:
          type: array
          items: { type: string }
        status: { type: string, enum: [OPEN, RESOLVED] }
        first_seen: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiSecAuthzAuthorityStatus:
      type: object
      properties:
        source: { $ref: '#/components/schemas/ApiSecAuthzAuthoritySource' }
        watermark: { $ref: '#/components/schemas/ApiSecAuthzAuthorityWatermark' }
        gap_status: { type: string, enum: [NO_DATA, OK, AUTHZ_SOURCE_GAP] }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAuthzAuthorityConflict' }
        batches:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAuthzAuthorityBatch' }

    # ---------- 节点授权 ACK（NG-AZ-02，apiauthzacks） ----------
    ApiSecAuthzVectorWatermark:
      type: object
      description: >-
        向量撤销水位（NG-AZ-02 §1.1）：管理面撤销水位是向量而非标量（各权威来源
        sequence 编号空间互相独立）。比较语义：A≥B ⇔ A.manual_seq ≥ B.manual_seq
        且 A.sources 对 B.sources 的每个键都有不小于的值（缺失键视为 0）。
      properties:
        manual_seq: { type: integer, format: int64, description: 管理面手工撤销通道单调序号（api_authz_manual_revocation_seq 单行） }
        sources:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: 各权威来源 revocation_watermark 逐来源快照（键为来源 UUID 字符串）
    ApiSecAuthzNodeAck:
      type: object
      description: 单节点授权 ACK 视图行（api_gateway_nodes LEFT JOIN api_node_authz_acks + ack_state 派生）
      properties:
        node_name: { type: string, description: 网关节点标识 }
        status: { type: string, enum: [ACTIVE, STALE, SILENT], description: 节点活性（api_gateway_nodes） }
        authz_policy_version: { type: string, description: 授权快照策略版本戳（区别于全局策略版本）；空串 = 未上报 }
        authz_watermark:
          $ref: '#/components/schemas/ApiSecAuthzVectorWatermark'
          nullable: true
          description: 节点当前应用授权快照的向量水位；null = 未上报/未 ACK
        authz_applied_at: { type: string, format: date-time, nullable: true, description: 节点应用该授权快照的时刻；null = 未应用过 }
        last_ack_at: { type: string, format: date-time, nullable: true, description: 管理面最近收拍时刻（非节点自报时间）；null = 从未 ACK }
        staleness_seconds: { type: integer, format: int64, nullable: true, description: 视图生成时刻 − authz_applied_at（可为负：节点时钟超前）；null = 未应用过授权快照（不参与最大陈旧窗口） }
        lease_seconds: { type: integer, format: int64, nullable: true, description: 授权租约秒数；null = 未配置租约（不启用租约约束，无过期一说） }
        ack_state:
          type: string
          enum: [FRESH, STALE_WITHIN_LEASE, STALE_EXPIRED, NEVER_ACKED, CLOCK_SKEW]
          description: >-
            五态派生（优先级自上而下）：NEVER_ACKED（无 ACK 行）→
            CLOCK_SKEW（|时钟漂移|>上限，默认 60s，authz.clock_skew_max_seconds
            覆盖夹紧 10~300s）→ STALE_EXPIRED（staleness>lease）→
            STALE_WITHIN_LEASE（staleness≤lease 或无租约但水位落后管理面）→
            FRESH（水位≥管理面向量水位且 staleness≤lease）
    ApiSecAuthzNodeAckView:
      type: object
      description: 全节点授权 ACK 视图（node-acks 出参；统一信封 data 载荷）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiSecAuthzNodeAck' }
        max_staleness_seconds: { type: integer, format: int64, nullable: true, description: 全节点最大陈旧窗口（参与节点 staleness_seconds 最大值）；null = 无参与节点（均从未应用授权快照），不伪造 0 }
        management_watermark: { $ref: '#/components/schemas/ApiSecAuthzVectorWatermark' }
        generated_at: { type: string, format: date-time, description: 视图生成时刻（staleness 计算基准，管理面时钟） }
