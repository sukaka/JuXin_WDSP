          description: 流转后的簇
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiNoiseCluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 当前簇状态不允许该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: AI 降噪模块未装配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ai/noise/clusters/{id}/resolve:
    post:
      operationId: aiNoiseClusterResolve
      tags: [ai-noise]
      summary: 解决降噪簇
      description: 簇状态流转 ACTIVE/SUPPRESSED → RESOLVED（仅改簇状态，不触碰事件处置/封禁/例外）；当前状态不允许时返回 409。写操作记录 AI 审计。权限：`ai.noise_reduction.use`。降噪模块未装配时返回 503。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 簇 ID
      responses:
        '200':
          description: 流转后的簇
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiNoiseCluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 当前簇状态不允许该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: AI 降噪模块未装配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ai/noise/clusters/{id}/draft-rule:
    post:
      operationId: aiNoiseClusterDraftRule
      tags: [ai-noise]
      summary: 从降噪簇生成自定义规则草稿
      description: |-
        基于簇的归一化 URI 生成自定义规则草稿（闭环：事件→聚类→草稿→人工审核）。
        产出为 DISABLED 状态的自定义规则（规则 ID 自动分配，号段 7100000-7199999）+ ai_recommendations 记录，AI 不自动启用/发布。
        簇缺少可用 URI 模式（空或 "/"）时返回 400；自定义规则 ID 段已满返回 409。写操作记录 AI 审计。
        权限：`ai.draft.custom_rule`。降噪模块或工具注册表未装配时返回 503。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 簇 ID
      responses:
        '200':
          description: 规则草稿已生成（默认停用）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiNoiseDraftRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 自定义规则 ID 段已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: AI 降噪模块/工具注册表未装配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ai/noise/stats:
    get:
      operationId: aiNoiseStatsGet
      tags: [ai-noise]
      summary: 降噪面板统计
      description: 降噪面板统计（活跃簇数/折叠事件总数/疑似误报簇数/已抑制簇数）。权限：`ai.noise_reduction.use`。降噪模块未装配时返回 503。
      responses:
        '200':
          description: 统计数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiNoiseStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: AI 降噪模块未装配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ai/noise/sweeps:
    get:
      operationId: aiNoiseSweepList
      tags: [ai-noise]
      summary: 降噪扫描历史
      description: 降噪扫描运行记录分页列表（按开始时间倒序）。权限：`ai.noise_reduction.use`。降噪模块未装配时返回 503。
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页条数
      responses:
        '200':
          description: 扫描历史分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiNoiseSweepRunListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: AI 降噪模块未装配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: aiNoiseSweepTrigger
      tags: [ai-noise]
      summary: 手动触发降噪扫描
      description: 同步执行一次降噪扫描并返回统计（事件聚类按指纹幂等，重复扫描不重复计数）。写操作记录 AI 审计。权限：`ai.noise_reduction.manage`。降噪扫描器未装配时返回 503。
      responses:
        '200':
          description: 本次扫描统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiNoiseSweepResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: AI 降噪扫描器未装配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ai/noise/settings:
    get:
      operationId: aiNoiseSettingsGet
      tags: [ai-noise]
      summary: 读取降噪设置
      description: 读取降噪生效配置（含默认值回退）。权限：`ai.noise_reduction.manage`。系统设置服务未装配时返回 503。
      responses:
        '200':
          description: 降噪生效配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiNoiseSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 系统设置服务未装配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: aiNoiseSettingsUpdate
      tags: [ai-noise]
      summary: 更新降噪设置
      description: 部分更新降噪设置（仅更新请求中出现的字段；先校验全部取值再落库，非法值 400 不产生部分写入）。写操作记录 AI 审计。权限：`ai.noise_reduction.manage`。系统设置服务未装配时返回 503。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiNoiseSettingsUpdateRequest'
      responses:
        '200':
          description: 更新后的生效配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiNoiseSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 系统设置服务未装配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    AiSession:
      type: object
      description: AI 会话
      properties:
        id: { type: string, format: uuid, description: 会话 ID }
        title: { type: string, description: 会话标题 }
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
          description: 会话状态（ARCHIVED 后不可继续对话）
        context_token_count: { type: integer, description: 当前上下文 Token 估算数 }
    AiSessionListResponse:
      type: object
      description: 会话分页响应
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiSession' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, description: 总条数 }
    AiSessionCreateRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200, description: 会话标题（可选，缺省「新会话」） }
    AiSessionUpdateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200, description: 新会话标题（必填，去空白后不能为空） }
    AiSessionResponse:
      type: object
      properties:
        session: { $ref: '#/components/schemas/AiSession' }
    AiSessionMessage:
      type: object
      description: 会话消息
      properties:
        id: { type: string, format: uuid, description: 消息 ID }
        role:
          type: string
          enum: [user, assistant]
          description: 消息角色
        content: { type: string, description: '消息内容（assistant 回复含 [Ex] 证据引用标记）' }
        created_at: { type: string, format: date-time, description: 创建时间 }
    AiSessionMessageListResponse:
      type: object
      description: 消息列表响应（非分页，正序）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiSessionMessage' }
    AiSessionMessageSendRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 4000, description: 消息内容（必填，去空白后不能为空，最长 4000 字） }
        task_type:
          type: string
          description: 预留字段；任务类型由服务端意图分类判定，不采信前端声明
    AiSessionMessageFeedbackRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          enum: [1, -1]
          description: 1=有用，-1=无用
        feedback_type:
          type: string
          enum: [GENERAL, WRONG_FACT, MISSING_EVIDENCE, HALLUCINATION, OTHER]
          default: GENERAL
          description: 反馈类型（缺省 GENERAL）
        comment: { type: string, description: 反馈备注（服务端截断至 500 字） }
    AiSessionStepEvent:
      type: object
      description: |-
        流式步骤事件。SSE 场景为每行 `data:` 后的 JSON；一次性分析场景为 steps 数组元素。
        done 事件 payload 含 task_id / message_id / finish_reason（finish_reason=stop 正常结束，cancelled 用户停止）；
        plan 事件 payload 为 AiAnalyzePlan。
      properties:
        type:
          type: string
          enum: [plan, agent_start, tool, agent_done, composing, answer, evidence, error, done, compressed]
          description: 事件类型
        text: { type: string, description: 展示文本 }
        payload: { type: object, nullable: true, description: 附加载荷（结构随 type 而定） }
    AiTask:
      type: object
      description: AI 任务记录（一次编排执行）
      properties:
        id: { type: string, format: uuid, description: 任务 ID }
        session_id: { type: string, format: uuid, description: 所属会话 ID }
        session_title: { type: string, description: 所属会话标题 }
        task_type: { type: string, description: 任务类型（取值见 AiAnalyzePlan.task_type） }
        status:
          type: string
          enum: [RUNNING, SUCCESS, PARTIAL_SUCCESS, FAILED, CANCELLED]
          description: 任务状态
        risk_level:
          type: string
          enum: [LOW, MEDIUM]
          description: 风险等级
        plan_summary: { type: string, description: 任务计划摘要 }
        started_at: { type: string, format: date-time, nullable: true, description: 开始时间 }
        finished_at: { type: string, format: date-time, nullable: true, description: 结束时间 }
        failure_code: { type: string, description: 失败代码（无失败为空串） }
        failure_message: { type: string, description: 失败信息（无失败为空串） }
        created_at: { type: string, format: date-time, description: 创建时间 }
    AiTaskListResponse:
      type: object
      description: 任务分页响应
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiTask' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, description: 总条数 }
    AiTaskResponse:
      type: object
      properties:
        task: { $ref: '#/components/schemas/AiTask' }
    AiAnalyzeRequest:
      type: object
      description: 一次性分析请求（各端点按需取用字段，必需组合见各端点 description）
      properties:
        event_id: { type: string, description: 安全事件 ID（须为 UUID，最长 64 字符） }
        rule_id: { type: integer, description: 规则 ID（>0 生效） }
        ip: { type: string, description: 客户端 IP（须为合法 IP 地址） }
        question: { type: string, maxLength: 1000, description: 自由文本问题/关注点（最长 1000 字） }
        period: { type: string, maxLength: 50, description: 统计周期描述（如「近7天」，最长 50 字符） }
    AiAnalyzePlan:
      type: object
      description: 任务计划摘要（plan 事件 payload / 分析结果 plan 字段）
      properties:
        task_type:
          type: string
          enum: [EVENT_ANALYSIS, FALSE_POSITIVE_ANALYSIS, RULE_EXPLANATION, ATTACK_PROFILE, ATTACK_CHAIN, ROOT_CAUSE_ANALYSIS, LOG_QUERY, STATISTICS_QUERY, POLICY_RECOMMENDATION, WHAT_IF_ANALYSIS, REPORT_SUMMARY, GENERAL_SECURITY_QA]
          description: 意图分类任务类型
        agents:
          type: array
          nullable: true
          items: { type: string }
          description: 调度的 Agent code 列表（如 security_event / waf_policy；问候类为 null）
        risk_level:
          type: string
          enum: [LOW, MEDIUM]
          description: 风险等级
        summary: { type: string, description: 计划摘要（含调度信息） }
    AiAnalyzeEvidenceItem:
      type: object
      description: 证据引用项（回答中 [Ex] 编号对应）
      properties:
        id: { type: string, description: 引用编号（E1..En） }
        source: { type: string, description: 来源（Tool code / 查询描述） }
        summary: { type: string, description: 一句话摘要 }
        detail: { nullable: true, description: 结构化明细 }
    AiAnalyzeResponse:
      type: object
      description: 一次性分析结果（非流式，同步返回）
      properties:
        task_id: { type: string, format: uuid, description: 任务 ID }
        answer: { type: string, description: 最终回答（含证据引用块） }
        plan: { $ref: '#/components/schemas/AiAnalyzePlan' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/AiSessionStepEvent' }
          description: 执行过程事件快照（最多 100 条）
        evidence:
          type: array
          items: { $ref: '#/components/schemas/AiAnalyzeEvidenceItem' }
    AiDraft:
      type: object
      description: AI 草稿/推荐（ai_recommendations；始终 DRAFT 语义，不直接生效）
      properties:
        id: { type: string, format: uuid, description: 草稿 ID }
        task_id: { type: string, format: uuid, nullable: true, description: 来源任务 ID }
        recommendation_type:
          type: string
          enum: [EXCEPTION, BLACKLIST, CC_POLICY, CUSTOM_RULE, POLICY_CHANGE, REPORT_SUMMARY, NOISE_REDUCTION]
          description: 草稿类型（NOISE_REDUCTION 由降噪模块产生，不作为列表过滤值）
        target_type: { type: string, description: 目标对象类型 }
        target_id: { type: string, description: 目标对象标识 }
        summary: { type: string, description: 草稿摘要 }
        evidence_references:
          type: array
          nullable: true
          items: { type: string }
          description: 证据引用列表
        risk_level: { type: string, description: 风险等级 }
        status:
          type: string
          enum: [DRAFT, PENDING_REVIEW, ACCEPTED, REJECTED, EXPIRED]
          description: 草稿状态
        draft_reference: { type: string, description: 草稿指向的业务记录引用 }
        created_by_ai: { type: boolean, description: 是否由 AI 创建 }
        reviewed_by: { type: string, format: uuid, nullable: true, description: 审核人 ID }
        reviewed_at: { type: string, format: date-time, nullable: true, description: 审核时间 }
        created_at: { type: string, format: date-time, description: 创建时间 }
    AiDraftListResponse:
      type: object
      description: 草稿分页响应
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiDraft' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, description: 总条数 }
    AiDraftResponse:
      type: object
      properties:
        draft: { $ref: '#/components/schemas/AiDraft' }
    AiDraftCreateByToolResponse:
      type: object
      properties:
        result: { description: Tool 执行输出（结构随草稿类型而定，通常含草稿/业务记录标识） }
        tool_ref: { type: string, description: Tool 引用标识（审计追溯用） }
    AiEvalCase:
      type: object
      description: 评估用例
      required: [question]
      properties:
        question: { type: string, maxLength: 1000, description: 用例问题（必填，最长 1000 字符） }
        expected_contains: { type: string, description: 期望回答包含的子串（大小写不敏感；为空视为通过） }
    AiEvalSet:
      type: object
      description: 评估集
      properties:
        id: { type: string, format: uuid, description: 评估集 ID }
        code: { type: string, description: 评估集编码（唯一） }
        name: { type: string, description: 评估集名称 }
        description: { type: string, description: 描述 }
        cases:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/AiEvalCase' }
        created_at: { type: string, format: date-time, description: 创建时间 }
    AiEvalSetListResponse:
      type: object
      description: 评估集列表响应（非分页，最多 200 条）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiEvalSet' }
    AiEvalSetCreateRequest:
      type: object
      required: [code, name, cases]
      properties:
        code: { type: string, maxLength: 50, description: 评估集编码（必填，唯一，≤50 字符） }
        name: { type: string, maxLength: 100, description: 评估集名称（必填，≤100 字符） }
        description: { type: string, description: 描述（服务端截断至 500 字符） }
        cases:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/AiEvalCase' }
          description: 测试用例（1-50 条）
    AiEvalRun:
      type: object
      description: 评估运行记录
      properties:
        id: { type: string, format: uuid, description: 运行 ID }
        evaluation_set_id: { type: string, format: uuid, description: 评估集 ID }
        set_code: { type: string, description: 评估集编码 }
        status: { type: string, description: 运行状态（如 SUCCESS） }
        score: { type: number, nullable: true, description: 得分（0-100，保留两位小数） }
        details:
          type: object
          nullable: true
          description: 运行明细（含 total/passed/truncated/cases 数组，cases 元素含 question/expected_contains/passed/answer_excerpt/error）
        started_at: { type: string, format: date-time, description: 开始时间 }
        finished_at: { type: string, format: date-time, nullable: true, description: 结束时间 }
    AiEvalRunListResponse:
      type: object
      description: 评估运行分页响应
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiEvalRun' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, description: 总条数 }
    AiEvalRunRequest:
      type: object
      required: [evaluation_set_id]
      properties:
        evaluation_set_id: { type: string, format: uuid, description: 评估集 ID }
    AiEvalRunResult:
      type: object
      properties:
        id: { type: string, format: uuid, description: 运行 ID }
        evaluation_set_id: { type: string, format: uuid, description: 评估集 ID }
        status: { type: string, description: 运行状态（SUCCESS） }
        score: { type: number, description: 得分（0-100，保留两位小数） }
        total: { type: integer, description: 实际执行用例数（≤20，超出截断） }
        passed: { type: integer, description: 通过用例数 }
        truncated: { type: boolean, description: 用例数超 20 被截断时为 true }
    AiEvalRunExecuteResponse:
      type: object
      properties:
        run: { $ref: '#/components/schemas/AiEvalRunResult' }
    AiNoiseCluster:
      type: object
      description: AI 降噪簇（同源指纹事件聚合）
      properties:
        id: { type: string, format: uuid, description: 簇 ID }
        source:
          type: string
          enum: [WAF, API]
          description: 事件来源（WAF 安全事件 / API 运行时事件）
        fingerprint_hash: { type: string, description: 聚类指纹哈希 }
        application_id: { type: string, format: uuid, nullable: true, description: 关联应用 ID }
        host: { type: string, description: 目标 Host }
        normalized_uri: { type: string, description: 归一化 URI }
        rule_id: { type: integer, nullable: true, description: 命中规则 ID（API 来源为 null） }
        detector_code: { type: string, description: 检测器编码（API 来源） }
        client_ip: { type: string, description: 客户端 IP }
        event_count: { type: integer, description: 折叠事件数 }
        first_seen: { type: string, format: date-time, description: 首次出现时间 }
        last_seen: { type: string, format: date-time, description: 最近出现时间 }
        status:
          type: string
          enum: [ACTIVE, SUPPRESSED, RESOLVED]
          description: 簇状态
        ai_verdict:
          type: string
          enum: [TRUE_POSITIVE, LIKELY_FALSE_POSITIVE, UNKNOWN]
          description: AI 误报判定
        ai_confidence: { type: number, nullable: true, description: AI 判定置信度（0-1） }
        ai_summary: { type: string, description: AI 判定摘要 }
        created_at: { type: string, format: date-time, description: 创建时间 }
        updated_at: { type: string, format: date-time, description: 更新时间 }
    AiNoiseClusterListResponse:
      type: object
      description: 降噪簇分页响应
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiNoiseCluster' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, description: 总条数 }
    AiNoiseClusterEvent:
      type: object
      description: 簇内事件关联
      properties:
        event_id: { type: string, format: uuid, description: 事件 ID }
        source:
          type: string
          enum: [WAF, API]
          description: 事件来源
        is_representative: { type: boolean, description: 是否为代表事件 }
        created_at: { type: string, format: date-time, description: 关联时间 }
    AiNoiseClusterDetailResponse:
      type: object
      properties:
        cluster: { $ref: '#/components/schemas/AiNoiseCluster' }
        events:
          type: array
          items: { $ref: '#/components/schemas/AiNoiseClusterEvent' }
          description: 簇内事件（最多 20 条，代表事件在前）
    AiNoiseStats:
      type: object
      description: 降噪面板统计
      properties:
        active_clusters: { type: integer, description: 活跃簇数 }
        folded_events: { type: integer, description: 活跃簇折叠的事件总数 }
        likely_false_positive_clusters: { type: integer, description: 疑似误报的活跃簇数 }
        suppressed_clusters: { type: integer, description: 已抑制簇数 }
    AiNoiseSweepResult:
      type: object
      description: 手动触发扫描的同步返回
      properties:
        started_at: { type: string, format: date-time, description: 开始时间 }
        finished_at: { type: string, format: date-time, description: 结束时间 }
        scanned_events: { type: integer, description: 扫描事件数 }
        new_clusters: { type: integer, description: 新建簇数 }
        updated_clusters: { type: integer, description: 更新簇数 }
        llm_calls: { type: integer, description: LLM 调用次数 }
        tokens_used: { type: integer, description: 消耗 Token 数（估算） }
        recommendations: { type: integer, description: 生成的降噪推荐数 }
        status:
          type: string
          enum: [SUCCESS, FAILED, PARTIAL]
          description: 扫描状态
        error: { type: string, description: 错误信息（无错误时缺省） }
    AiNoiseSweepRun:
      type: object
      description: 降噪扫描运行记录
      properties:
        id: { type: string, format: uuid, description: 运行 ID }
        started_at: { type: string, format: date-time, description: 开始时间 }
        finished_at: { type: string, format: date-time, nullable: true, description: 结束时间 }
        scanned_events: { type: integer, description: 扫描事件数 }
        new_clusters: { type: integer, description: 新建簇数 }
        updated_clusters: { type: integer, description: 更新簇数 }
        llm_calls: { type: integer, description: LLM 调用次数 }
        tokens_used: { type: integer, description: 消耗 Token 数（估算） }
        status:
          type: string
          enum: [SUCCESS, FAILED, PARTIAL]
          description: 扫描状态
        error: { type: string, description: 错误信息（无错误为空串） }
    AiNoiseSweepRunListResponse:
      type: object
      description: 扫描历史分页响应
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiNoiseSweepRun' }
        page: { type: integer, description: 当前页码 }
        page_size: { type: integer, description: 每页条数 }
        total: { type: integer, description: 总条数 }
    AiNoiseSettings:
      type: object
      description: 降噪设置（生效值，含默认回退）
      properties:
        enabled: { type: boolean, description: 降噪总开关 }
        interval_seconds: { type: integer, minimum: 30, maximum: 86400, description: 后台扫描间隔（秒，30-86400） }
        sweep_window_minutes: { type: integer, minimum: 1, maximum: 1440, description: 单次扫描回溯窗口（分钟，1-1440） }
        min_events_threshold: { type: integer, minimum: 1, maximum: 100000, description: 簇进入 LLM 误报评分的最小事件数阈值（1-100000） }
        llm_verdict_enabled: { type: boolean, description: LLM 误报评分开关 }
    AiNoiseSettingsUpdateRequest:
      type: object
      description: 降噪设置更新（仅出现的字段被更新）
      properties:
        enabled: { type: boolean, description: 降噪总开关 }
        interval_seconds: { type: integer, minimum: 30, maximum: 86400, description: 后台扫描间隔（秒，30-86400） }
        sweep_window_minutes: { type: integer, minimum: 1, maximum: 1440, description: 单次扫描回溯窗口（分钟，1-1440） }
        min_events_threshold: { type: integer, minimum: 1, maximum: 100000, description: 簇最小事件数阈值（1-100000） }
        llm_verdict_enabled: { type: boolean, description: LLM 误报评分开关 }
    AiNoiseDraftRuleResponse:
      type: object
      properties:
        message: { type: string, description: 提示信息（草稿默认停用，需人工审核启用） }
        rule_id: { type: integer, description: 分配的自定义规则 ID（7100000-7199999） }
        draft: { description: 草稿 Tool 执行输出（含 DISABLED 自定义规则与 ai_recommendations 记录信息） }
