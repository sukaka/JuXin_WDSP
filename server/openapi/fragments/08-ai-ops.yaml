  /ai/drafts/{id}:
    get:
      operationId: aiDraftGet
      tags: [ai-drafts]
      summary: AI 草稿详情
      description: 获取单个草稿详情。权限：任一 `ai.draft.exception` / `ai.draft.blacklist` / `ai.draft.cc_policy` / `ai.draft.custom_rule`。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 草稿 ID
      responses:
        '200':
          description: 草稿详情
          content:
