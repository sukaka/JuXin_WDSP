# AI 安全运营域：会话与消息、任务记录、一次性分析、草稿与推荐、质量评估、AI 自动降噪。
# 路由源：server/internal/aihandlers/handler.go 第 72-108 行与第 166-181 行。
# 说明：成功响应 schema 描述统一信封 {code,message,data,request_id} 中的 data 载荷。
paths:
  /ai/sessions:
    get:
      operationId: aiSessionList
      tags: [ai-assistant]
      summary: AI 会话列表
      description: 当前登录用户的 AI 会话分页列表（按更新时间倒序，默认不含已归档）。权限：`ai.sessions.read_own`（仅本人会话，属主隔离）。
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页条数（超过 100 按 20 处理）
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
          description: 是否包含已归档会话（true/1/yes 视为真）
      responses:
        '200':
          description: 会话分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: aiSessionCreate
      tags: [ai-assistant]
      summary: 创建 AI 会话
      description: 创建一个新会话（title 可选，缺省为「新会话」，最长 200 字；允许空请求体）。权限：`ai.chat.use`。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSessionCreateRequest'
      responses:
        '200':
          description: 创建成功，返回新会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/sessions/{id}:
    get:
      operationId: aiSessionGet
      tags: [ai-assistant]
      summary: AI 会话详情
      description: 获取单个会话详情。权限：`ai.sessions.read_own`；非属主一律返回 404（不泄露存在性）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: aiSessionRename
      tags: [ai-assistant]
      summary: 重命名 AI 会话
      description: 重命名会话（title 必填，最长 200 字）。权限：`ai.chat.use`；非属主一律返回 404。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSessionUpdateRequest'
      responses:
        '200':
          description: 会话已重命名
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: aiSessionDelete
      tags: [ai-assistant]
      summary: 删除 AI 会话
      description: 删除会话（消息与任务级联删除；删除前自动停止正在运行的任务）。权限：`ai.sessions.delete_own`；非属主一律返回 404。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID
      responses:
        '200':
          description: 会话已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/sessions/{id}/archive:
    post:
      operationId: aiSessionArchive
      tags: [ai-assistant]
      summary: 归档 AI 会话
      description: 归档会话（归档后不可继续对话，发送消息将返回 409）。权限：`ai.chat.use`；非属主一律返回 404。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID
      responses:
        '200':
          description: 会话已归档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/sessions/{id}/messages:
    get:
      operationId: aiMessageList
      tags: [ai-assistant]
      summary: 会话消息列表
      description: 返回会话最近 N 条消息（按时间正序）。权限：`ai.sessions.read_own`；非属主一律返回 404。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
          description: 返回条数（默认 50，最大 100；越界值由服务端重置）
      responses:
        '200':
          description: 消息列表（正序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSessionMessageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: aiMessageSend
      tags: [ai-assistant]
      summary: 发送消息（SSE 流式）
      description: |-
        发送用户消息并执行一轮 AI 编排分析。成功时响应为 SSE 流式输出（`Content-Type: text/event-stream`），
        每个事件为一行 `data: {"type":...,"text":...,"payload":...}`，事件序列通常为
        plan → agent_start/agent_done/tool → composing → answer → done（done 的 payload 含 task_id/message_id/finish_reason），
        中途可能出现 compressed（上下文自动压缩）或 error 事件。
        请求校验失败（400/404/409/429）发生在流开始前，按统一错误信封返回一次性 JSON。
        限流：AI 用量配额超限返回 429；同一会话同时只运行一个任务，新任务会取消旧任务。
        权限：`ai.chat.use`；非属主一律返回 404。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSessionMessageSendRequest'
      responses:
        '200':
          description: 'SSE 事件流（text/event-stream，逐行 `data: {json}`）'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AiSessionStepEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话已归档，无法继续对话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: AI 用量配额超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/sessions/{id}/stop:
    post:
      operationId: aiMessageStop
      tags: [ai-assistant]
      summary: 停止会话当前任务
      description: 向会话正在运行的任务发送停止信号（无运行中任务时返回 409）。权限：`ai.chat.use`；非属主一律返回 404。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID
      responses:
        '200':
          description: 已发送停止信号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 当前会话没有正在运行的分析任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/sessions/{id}/retry:
    post:
      operationId: aiMessageRetry
      tags: [ai-assistant]
      summary: 重试最后一问（SSE 流式）
      description: 取会话最后一条用户消息重新执行（不重复落库用户消息），响应为 SSE 流式输出（同发送消息）；会话中没有用户消息时返回 409。权限：`ai.chat.use`；非属主一律返回 404。限流：配额超限返回 429（流开始前 JSON 错误）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID
      responses:
        '200':
          description: SSE 事件流（text/event-stream）
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AiSessionStepEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话中没有可重试的用户消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: AI 用量配额超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/sessions/{id}/continue:
    post:
      operationId: aiMessageContinue
      tags: [ai-assistant]
      summary: 继续输出（SSE 流式）
      description: 最后一条助手回复中断时以「请继续」续跑，响应为 SSE 流式输出（同发送消息）；仅当最后一条消息为 assistant 角色时可用，否则 409。权限：`ai.chat.use`；非属主一律返回 404。限流：配额超限返回 429（流开始前 JSON 错误）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 会话 ID
      responses:
        '200':
          description: SSE 事件流（text/event-stream）
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AiSessionStepEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 仅最后一条助手回复后可继续输出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: AI 用量配额超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/messages/{id}/feedback:
    post:
      operationId: aiMessageFeedback
      tags: [ai-assistant]
      summary: 消息反馈（点赞/点踩）
      description: 对助手消息提交反馈（comment 服务端截断至 500 字）。权限：`ai.chat.use`；消息所属会话非本人时返回 404。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 消息 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSessionMessageFeedbackRequest'
      responses:
        '200':
          description: 反馈已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/tasks:
    get:
      operationId: aiTaskList
      tags: [ai-assistant]
      summary: AI 任务记录列表
      description: 当前登录用户的 AI 编排任务分页列表（按创建时间倒序）。权限：`ai.sessions.read_own`（仅本人，经会话归属过滤）。
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: 页码
        - name: page_size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: 每页条数
        - name: status
          in: query
          schema: { type: string, enum: [RUNNING, SUCCESS, PARTIAL_SUCCESS, FAILED, CANCELLED] }
          description: 按任务状态过滤
        - name: task_type
          in: query
          schema: { type: string }
          description: 按任务类型过滤（如 EVENT_ANALYSIS，取值见 AiAnalyzePlan.task_type）
      responses:
        '200':
          description: 任务分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTaskListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/tasks/{id}:
    get:
      operationId: aiTaskGet
      tags: [ai-assistant]
      summary: AI 任务记录详情
      description: 获取单个任务记录。权限：`ai.sessions.read_own`；非属主一律返回 404。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 任务 ID
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/analyze/event:
    post:
      operationId: aiAnalyzeEvent
      tags: [ai-analysis]
      summary: 安全事件 AI 分析
      description: |-
        触发一次性安全事件分析（同步执行、非流式；单次最长约 120 秒，服务端放宽本请求写期限至 10 分钟）。
        分析在一次性会话中执行，用完即删，不出现在会话列表；响应一次性返回 answer/plan/steps/evidence。
        请求需满足：event_id（须为 UUID）与 question 至少提供一个，event_id 优先。
        限流：AI 用量配额超限返回 429。权限：`ai.event_analysis.use`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnalyzeRequest'
      responses:
        '200':
          description: 分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnalyzeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: AI 用量配额超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/analyze/false-positive:
    post:
      operationId: aiAnalyzeFalsePositive
      tags: [ai-analysis]
      summary: 误报 AI 研判
      description: |-
        触发一次性误报研判（同步执行、非流式，行为同 /ai/analyze/event）。
        请求需满足：event_id（须为 UUID）与 rule_id（>0）至少提供一个，可同时提供。
        限流：AI 用量配额超限返回 429。权限：`ai.false_positive_analysis.use`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnalyzeRequest'
      responses:
        '200':
          description: 分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnalyzeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: AI 用量配额超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/analyze/attack-profile:
    post:
      operationId: aiAnalyzeAttackProfile
      tags: [ai-analysis]
      summary: 攻击画像分析
      description: |-
        触发一次性攻击画像分析（同步执行、非流式，行为同 /ai/analyze/event）。
        请求需满足：ip（须为合法 IP 地址）与 question 至少提供一个，ip 优先。
        限流：AI 用量配额超限返回 429。权限：`ai.attack_profile.use`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnalyzeRequest'
      responses:
        '200':
          description: 分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnalyzeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: AI 用量配额超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/analyze/attack-chain:
    post:
      operationId: aiAnalyzeAttackChain
      tags: [ai-analysis]
      summary: 攻击链关联分析
      description: |-
        触发一次性攻击链关联分析（同步执行、非流式，行为同 /ai/analyze/event）。
        请求需满足：ip（须为合法 IP 地址）与 event_id（须为 UUID）至少提供一个，ip 优先。
        限流：AI 用量配额超限返回 429。权限：`ai.attack_chain.use`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnalyzeRequest'
      responses:
        '200':
          description: 分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnalyzeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: AI 用量配额超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /ai/analyze/policy-recommendation:
    post:
      operationId: aiAnalyzePolicyRecommendation
      tags: [ai-analysis]
      summary: 策略优化建议
      description: |-
        基于最近事件与误报统计生成 WAF 策略优化建议（同步执行、非流式，行为同 /ai/analyze/event；
        不会建议直接关闭高风险规则）。question 可选，用于指定关注点；允许空请求体。
        限流：AI 用量配额超限返回 429。权限：`ai.policy_recommendation.use`。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnalyzeRequest'
      responses:
        '200':
          description: 分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnalyzeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: AI 用量配额超限
          content:
