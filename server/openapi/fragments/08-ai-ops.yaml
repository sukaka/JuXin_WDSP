          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: aiDraftCreateByTool
      tags: [ai-drafts]
      summary: 通过 Tool 创建草稿
      description: |-
        以草稿类型 slug 为路径段调用对应草稿 Tool 创建草稿（Go 路由注册为 `/ai/drafts/{type}`）。
        请求体为对应 Tool 的输入 JSON（最大 32KB，允许空体等价 {}），字段由 Tool 的 input schema 定义并做完整校验。
        创建产物始终为 DRAFT，绝不直接发布/生效。权限：任一 `ai.draft.exception` / `ai.draft.blacklist` / `ai.draft.cc_policy` / `ai.draft.custom_rule`；
        Tool 内部还会按类型校验对应权限点，校验失败返回 400/403。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, enum: [exception, blacklist, cc-policy, custom-rule] }
          description: 草稿类型 slug（分别映射 draft.exception.create / draft.blacklist.create / draft.cc_policy.create / draft.custom_rule.create 工具）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: 对应草稿 Tool 的输入参数（如例外草稿的路径/规则、黑名单的 IP 等）
