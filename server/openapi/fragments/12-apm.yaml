        - { name: language, in: query, required: false, schema: { type: string, enum: [java, go, dotnet, nodejs, python, php] }, description: 按语言过滤 }
        - { name: keyword, in: query, required: false, schema: { type: string }, description: 服务名/实例 ID 模糊匹配 }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid }, description: 按绑定应用过滤 }
