# 域片段：APM 业务性能监控（阶段1 无 Agent 查询 + 阶段2 上半 Agent 控制面 + 阶段2 下半 ClickHouse 数据面
# + 阶段3 第一批 SQL/异常/依赖聚合查询 + 阶段3 第二批运行时指标 metrics 信号查询
# + 阶段4 深度诊断会话控制面 + P1-01 A2 availability 数据质量自述/correlation 关联判定
# + trace-search application_id 应用约束 + sql/exceptions trace_id 级精确定位）
# 路由来源：server/internal/apm/handler.go RegisterRoutes（查询）、agents_handler.go
# RegisterAgentAdminRoutes（管理，会话+RBAC）、agentapi_handler.go RegisterAgentDataRoutes
#（Agent 面机器端点，无会话链，一次性令牌 / CA 证书 PoP 签名认证）、
# diagnostics_handler.go RegisterDiagnosticRoutes（深度诊断，会话+RBAC）；
# 开关 APM_ENABLED 关闭时本组统一 503 降级。
# 数据源：应用级复用既有聚合指标 http_requests_total / http_request_duration_ms（直方图）/
# waf_blocks_total / waf_observes_total；端点级用 http_endpoint_requests_total /
# http_endpoint_duration_ms（labels app/endpoint/status_class/action），仅
# logging.access_log_enabled 开启时产出（关闭时端点级榜单/列表为空，能力如实降级）。
# 通用约定：全部 GET；start_time/end_time 为 RFC3339（缺省最近 1 小时，窗口上限 31 天；
# 窗口 ≤6h 读分钟聚合表，否则读小时聚合表，trend 粒度随之为分钟/小时桶）；错误率口径
# 统一为 5xx 占比；分位数由 metrics.DurationBucketsMs 直方图线性插值估算。
# 成功响应统一信封：{code, message, data, request_id}，下列 200 响应的 schema 均为该信封，data 为各业务负载。

paths:
  /apm/settings:
    get:
      operationId: apmSettingsGet
      tags: [APM]
      summary: 读取 APM 运行设置
      description: 读取 APM 总开关、配置来源和 ClickHouse 连接状态；不会回显 ClickHouse DSN。该接口不受 APM 总开关门控。权限：`system_settings.read`。
      responses:
        '200':
          description: APM 设置生效状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApmSettingsState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: apmSettingsUpdate
      tags: [APM]
      summary: 更新 APM 运行设置
      description: 字段缺省表示保持不变；clickhouse_dsn 为空串时清除数据库覆盖并回退环境配置，非空时校验后通过敏感设置通道保存。更新后立即重建 ClickHouse 连接且审计不记录 DSN 明文。权限：`system_settings.update`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                clickhouse_dsn: { type: string, maxLength: 4096, writeOnly: true, description: ClickHouse DSN；空串清除界面覆盖 }
      responses:
        '200':
          description: 更新后的 APM 设置生效状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApmSettingsState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /apm/overview:
    get:
      operationId: apmOverview
      tags: [APM]
      summary: APM 概览（应用级 RED + 趋势 + 榜单）
      description: 无 Agent 模式（data_source=agentless）业务性能概览：窗口内请求总量、5xx/4xx 错误量、WAF 阻断量、错误率（5xx 占比）、p50/p95/p99 耗时估算、趋势桶序列与慢应用/错误应用/慢端点榜单。top_slow_endpoints 与 unclassified_requests 依赖端点级聚合（logging.access_log_enabled 开启才有数据，关闭时返回空数组/0，access_log_enabled 字段如实标识）。响应恒含 availability 数据质量自述（网关侧 PG 聚合口径；access_log 关闭时 reason_codes 含 ACCESS_LOG_DISABLED 且 partial=true）。权限：`apm.overview.read`
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口起点（RFC3339；缺省为 end_time 前 1 小时） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口终点（RFC3339；缺省为当前时间） }
      responses:
        '200':
          description: APM 概览数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmOverviewData' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /apm/services:
    get:
      operationId: apmServiceList
      tags: [APM]
      summary: APM 服务（应用）列表
      description: applications 表分页 LEFT JOIN 窗口聚合指标（无流量的应用如实返回零值与 last_seen_at=null），并关联 apm_agents/apm_services 回填 Agent 覆盖（agents_online/agents_total/observation_mode；心跳超 APM_AGENT_OFFLINE_MINUTES 判离线，REVOKED 不计）。支持 keyword 按应用名称/code 模糊匹配。响应恒含 availability 数据质量自述（窗口内有应用登记行即 READY，observed_sources 仅在确有流量观测时含 GATEWAY 且 last_collected_at 取各行 last_seen_at 最大值；无登记行为 EMPTY+NO_MATCH）。权限：`apm.services.read`
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口起点（RFC3339；缺省为 end_time 前 1 小时） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口终点（RFC3339；缺省为当前时间） }
        - { name: keyword, in: query, required: false, schema: { type: string }, description: 关键字（应用名称或 code 模糊匹配） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码（默认 1） }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: 每页条数（默认 20，最大 100） }
      responses:
        '200':
          description: 服务分页列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmServiceListResponse' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /apm/services/{id}:
    get:
      operationId: apmServiceDetail
      tags: [APM]
      summary: APM 服务详情
      description: 单应用窗口 RED 详情：请求总量、错误率、p50/p95/p99、趋势、状态码类别分布、动作分布（allow/observe/block，app 级派生口径 allow=requests−block−observe）、慢端点榜单（access_log 关闭时为空数组）。响应恒含 availability 数据质量自述。应用不存在返回 404。权限：`apm.services.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用 ID }
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口起点（RFC3339；缺省为 end_time 前 1 小时） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口终点（RFC3339；缺省为当前时间） }
      responses:
        '200':
          description: 服务详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmServiceDetailData' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /apm/endpoints:
    get:
      operationId: apmEndpointList
      tags: [APM]
      summary: APM 端点列表
      description: 端点级 RED 列表（窗口内聚合后排序分页）。__OTHER__（Top-N 之外尾端点合并桶）与 __UNCLASSIFIED__（endpoint_key 缺失治理桶）原样返回，前端负责标注。access_log 关闭时 list 为空数组且 access_log_enabled=false（端点级数据未开启，availability.reason_codes 含 ACCESS_LOG_DISABLED）。响应恒含 availability 数据质量自述。权限：`apm.services.read`
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口起点（RFC3339；缺省为 end_time 前 1 小时） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口终点（RFC3339；缺省为当前时间） }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid }, description: 按应用过滤（应用 ID；指向不存在/已删除应用时返回空页） }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [p95, requests, error_rate], default: p95 }, description: 排序键（降序；默认 p95） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码（默认 1） }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: 每页条数（默认 20，最大 100） }
      responses:
        '200':
          description: 端点分页对象（扩展 access_log_enabled 字段）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmEndpointListResponse' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------- 阶段2 下半：ClickHouse 数据面（OTel trace 检索与瀑布） ----------

  /apm/trace-search:
    get:
      operationId: apmTraceSearch
      tags: [APM]
      summary: APM trace 检索（ClickHouse OTel 数据面）
      description: OTel trace 聚合检索（查询 apm.otel_traces 原始表，schema 以 deployment/apm/clickhouse/001_otel_traces.sql 为准）。强制时间窗（缺省最近 1 小时，上限 24 小时——原始表扫描必须限窗）与分页上限（page_size ≤100，超限夹紧）。trace_id 为 32 位十六进制精确直达（与 request_id 同给时 trace_id 优先）；request_id 先经 access_logs 解析 trace_id 集合再查 ClickHouse。application_id 按应用约束检索（经 apm_services 服务名集合下推 CH 与 access_logs 解析；非法 UUID 或应用不存在/已删除返回 400，不静默忽略约束；应用无映射 OTel 服务时返回如实空页 + message 说明）。耗时口径 duration_ms = trace 墙钟耗时（max(span 结束) − min(span 开始)）；根 span 取 ParentSpanId 为空且 SpanKind=Server 中耗时最长者，无 Server 根退化为任一无父根，仍无则如实返回空串。响应恒含 availability 数据质量自述（query_state/reason_codes/observed_sources/水位字段）；request_id 检索追加 correlation 关联判定（state ∈ MATCHED/AMBIGUOUS/PENDING/NOT_FOUND/NOT_EXPECTED/UNKNOWN，一对多候选全列不任取第一条；trace_id 直达不经解析链不携带）。ClickHouse 未配置（APM_CLICKHOUSE_DSN 为空）或查询失败时返回空页 + data_source=agentless + message 提示，不返回 500（遥测故障不影响管理面）。权限：`apm.traces.read`
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口起点（RFC3339；缺省为 end_time 前 1 小时，窗口上限 24 小时） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口终点（RFC3339；缺省为当前时间） }
        - { name: service, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 服务名精确匹配（OTel service.name） }
        - { name: trace_id, in: query, required: false, schema: { type: string, pattern: '^[0-9a-fA-F]{32}$' }, description: 32 位十六进制 trace ID 直达（非法返回 400；与 request_id 同给时优先） }
        - { name: request_id, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 请求 ID（先经 access_logs 解析关联 trace_id 集合再查 ClickHouse；响应追加 correlation 关联判定） }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid }, description: 按应用约束检索（非法 UUID 或应用不存在/已删除返回 400；应用无映射 OTel 服务时返回如实空页） }
        - { name: min_duration_ms, in: query, required: false, schema: { type: number, minimum: 0 }, description: 最小墙钟耗时过滤（毫秒，非负数值） }
        - { name: error, in: query, required: false, schema: { type: boolean }, description: 仅含 Error span 的 trace（true/false） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码（默认 1） }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: 每页条数（默认 20，最大 100） }
      responses:
        '200':
          description: trace 检索分页结果（CH 未配置/不可用时为空页 + agentless 提示）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmTraceSearchData' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /apm/traces/{trace_id}:
    get:
      operationId: apmTraceView
      tags: [APM]
      summary: APM trace 检索（访问记录 + 关联安全事件 + OTel 瀑布）
      description: 按 trace_id（32 位十六进制，非法返回 400）检索 access_logs（迁移 000088 新增列），再按命中记录的 request_id 关联 security_events（仅回传必要安全字段子集，不含请求/响应头体留痕，遵循既有写入侧脱敏口径）。接入 ClickHouse 数据面后追加 otel_spans 瀑布（span 属性仅透传白名单键，db.statement/url.query/头体留痕类键严禁放出；单 trace 上限 1000 span，超出截断并置 truncated=true；CH 侧强制时间窗——入参窗口优先，缺省对齐原始表最长 TTL 层 14 天）。data_source 如实标识 agentless/otel/mixed；无 OTel span、缺根 span 或被截断时 partial=true。响应恒含 availability 数据质量自述（网关腿/OTel 腿按本次真实结果逐腿判定）与 correlation 关联判定（trace_id 直达口径，state ∈ MATCHED/NOT_EXPECTED/PENDING/NOT_FOUND/UNKNOWN；阻断动作 BLOCK 证据 → NOT_EXPECTED）。可选 start_time/end_time 限窗（需同时提供，上限 31 天；缺省不限时间——trace_id 为 128 位随机精确匹配键，走部分索引点查，单侧结果上限 100 条）。ClickHouse 未配置/不可用时降级为纯 agentless 数据，不返回 500。均无命中时 access_logs/security_events/otel_spans 返回空数组而非 404。权限：`apm.traces.read`
      parameters:
        - { name: trace_id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{32}$' }, description: 32 位十六进制 trace ID }
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口起点（RFC3339；与 end_time 需同时提供） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口终点（RFC3339；与 start_time 需同时提供） }
      responses:
        '200':
          description: trace 视图（无命中时为空数组）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmTraceView' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------- 阶段3 第一批：SQL 指纹聚合 / 异常指纹 / 服务依赖（ClickHouse 数据面） ----------

  /apm/sql:
    get:
      operationId: apmSqlFingerprintList
      tags: [APM]
      summary: APM SQL 指纹聚合列表
      description: SQL 指纹聚合（只出指纹不出原始 statement——设计 §11.1 首期只存指纹）。数据源优先 002 分钟聚合表 apm.apm_sql_minutes（calls/error_count/avg_ms）；p95_ms/namespace/operation/sample_trace_ids 由 apm.otel_traces 同窗派生（p95 为 quantile(0.95) 估算，示例 trace 去重上限 3），两侧以 db_system + hex(MD5(db.statement)) 指纹等值关联。trace_id 参数切换 trace 级精确定位（仅从该 trace 的 Client DB span 派生指纹，match_mode=trace_exact）；缺省窗口聚合模式 match_mode=window_aggregate（match_note 如实标注"同时间窗候选，非特定请求定位"）。响应恒含 availability 数据质量自述。强制时间窗（缺省最近 1 小时，上限 24 小时）与分页上限（page_size ≤100，超限夹紧）；sort 白名单 calls/avg_ms/p95_ms（默认 p95_ms 倒序）。ClickHouse 未配置（APM_CLICKHOUSE_DSN 为空）或查询失败时返回空页 + data_source=agentless + message 提示，不返回 500（遥测故障不影响管理面）。权限：`apm.sql.read`（迁移 000090）
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口起点（RFC3339；缺省为 end_time 前 1 小时，窗口上限 24 小时） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口终点（RFC3339；缺省为当前时间） }
        - { name: service, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 服务名精确匹配（OTel service.name） }
        - { name: db_system, in: query, required: false, schema: { type: string, maxLength: 64 }, description: 数据库系统精确匹配（OTel db.system，如 postgresql/mysql/redis） }
        - { name: trace_id, in: query, required: false, schema: { type: string, pattern: '^[0-9a-fA-F]{32}$' }, description: 32 位十六进制 trace ID（切换 trace 级精确定位；非法返回 400） }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [calls, avg_ms, p95_ms], default: p95_ms }, description: 排序键（降序；默认 p95_ms） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码（默认 1） }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: 每页条数（默认 20，最大 100） }
      responses:
        '200':
          description: SQL 指纹聚合分页结果（CH 未配置/不可用时为空页 + agentless 提示）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
