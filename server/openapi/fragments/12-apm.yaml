        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /apm/exceptions:
    get:
      operationId: apmExceptionList
      tags: [APM]
      summary: APM 异常指纹聚合列表
      description: 异常指纹聚合（数据源为 002 异常指纹表 apm.apm_exception_fingerprints，由 otel_traces 的 exception 事件物化聚合；不存/不出堆栈原文）。count 为 exception 事件数（一个 span 可携带多个 exception 事件）；first_seen_at/last_seen_at 为分钟聚合桶粒度（±1 分钟）；affected_services 去重上限 16，sample_trace_ids 去重上限 3。trace_id 参数切换 trace 级精确定位（直读该 trace 的 exception 事件，结果在 trace_exceptions 且 list 为空数组；exception_message/stacktrace 为应用上报原文经凭据形态掩码 + rune 上限截断后的纯文本，截断时对应 *_truncated=true；fingerprint 与聚合表同式可对照）；缺省窗口聚合模式 match_mode=window_aggregate。响应恒含 availability 数据质量自述。强制时间窗（缺省最近 1 小时，上限 24 小时）与分页上限（page_size ≤100，超限夹紧）；按事件数倒序分页。ClickHouse 未配置或查询失败时返回空页 + data_source=agentless + message 提示，不返回 500。权限：`apm.traces.read`
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口起点（RFC3339；缺省为 end_time 前 1 小时，窗口上限 24 小时） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口终点（RFC3339；缺省为当前时间） }
        - { name: service, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 服务名精确匹配（OTel service.name） }
        - { name: trace_id, in: query, required: false, schema: { type: string, pattern: '^[0-9a-fA-F]{32}$' }, description: 32 位十六进制 trace ID（切换 trace 级精确定位；非法返回 400） }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 }, description: 页码（默认 1） }
        - { name: page_size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: 每页条数（默认 20，最大 100） }
      responses:
        '200':
          description: 异常指纹聚合分页结果（CH 未配置/不可用时为空页 + agentless 提示）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmExceptionData' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /apm/dependencies:
    get:
      operationId: apmDependencyEdges
      tags: [APM]
      summary: APM 服务依赖边列表
      description: 服务依赖边（002 无依赖聚合表，从 apm.otel_traces 的 CLIENT/PRODUCER span 单视角派生：ServiceName → peer.service / db.system[/namespace] / messaging.system[/destination] / server.address；无对端 SERVER span 配对，note 如实标注"基于客户端 span 派生"；未标注 peer.service 的 HTTP 调用按 server.address 归类为 external）。强制时间窗（缺省最近 1 小时，上限 24 小时）；单页上限 500 条边，超限截断并在 note 标注。ClickHouse 未配置或查询失败时返回空边列表 + data_source=agentless + note 说明，不返回 500。权限：`apm.services.read`
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口起点（RFC3339；缺省为 end_time 前 1 小时，窗口上限 24 小时） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口终点（RFC3339；缺省为当前时间） }
        - { name: service, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 源端服务名精确匹配（OTel service.name） }
      responses:
        '200':
          description: 依赖边列表（CH 未配置/不可用时为空边列表 + agentless 说明）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmDependenciesData' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /apm/runtime:
    get:
      operationId: apmRuntimeMetrics
      tags: [APM]
      summary: APM 服务实例运行时指标
      description: 服务实例运行时指标（metrics 信号，ClickHouse 数据面 apm.otel_metrics_gauge/sum/histogram 三类表，schema 见 deployment/apm/clickhouse/003_metrics.sql；直方图按 Sum/Count 折算均值）。实例 = service.name + service.instance.id（Agent 未上报实例 ID 时为空串，如实返回）；service/instance_id 均可选，不填列窗口内全部实例（上限 20，超限截断并在 note 标注）。每实例指标 ≤20 个（按指标名升序截取）、每指标 points ≤200（按窗口等分降采样，桶内均值、同名多序列按桶求和合并）。指标集按语言/Agent 上报原样返回，不同语言不强行统一（设计 §10.3）；description 尾部附来源 instrumentation scope 与折算口径说明。强制时间窗（缺省最近 1 小时，上限 24 小时）。ClickHouse 未配置（APM_CLICKHOUSE_DSN 为空）或查询失败时返回空实例列表 + data_source=agentless + note 提示，不返回 500（遥测故障不影响管理面）。权限：`apm.runtime.read`（迁移 000091）
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口起点（RFC3339；缺省为 end_time 前 1 小时，窗口上限 24 小时） }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 窗口终点（RFC3339；缺省为当前时间） }
        - { name: service, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 服务名精确匹配（OTel service.name） }
        - { name: instance_id, in: query, required: false, schema: { type: string, maxLength: 128 }, description: 实例 ID 精确匹配（OTel resource service.instance.id） }
      responses:
        '200':
          description: 运行时指标数据（CH 未配置/不可用时 instances 为空 + agentless 提示）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmRuntimeData' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------- SLO 目标管理（迁移 000092；读 apm.overview.read、写 apm.settings.manage） ----------

  /apm/slos:
    get:
      operationId: apmSLOList
      tags: [APM]
      summary: APM SLO 列表（定义 + 当前窗口实时评估）
      description: 全部 SLO 定义及其实时评估结果（不分页）。评估口径：availability 只把 5xx 计为失败（v1，4xx 不计），current_value = 1 − 5xx/总请求数；latency_p95 的 current_value 为窗口内耗时直方图合并后线性插值估算的 P95 毫秒值。错误预算：availability 预算 = 1 − target，remaining = (预算 − 实际 5xx 违约率)/预算；latency_p95 以 P95 相对阈值余量表达，remaining = (target − p95)/target；统一夹紧 [−1,1]。状态机：remaining < 0 为 BREACHED（availability 即窗口达标率 < target；latency 即 P95 > 阈值），预算消耗 >80%（remaining < 0.2）为 AT_RISK，否则 OK。窗口内无数据时 current_value=null、状态保持 OK、note 说明（无失败证据不误报）。窗口聚合源固定为 metric_hour_aggregates 小时表（7d/30d 窗口不扫分钟表）。权限：`apm.overview.read`
      responses:
        '200':
          description: SLO 列表（含实时评估）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmSLOListResponse' }
                  request_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: apmSLOCreate
      tags: [APM]
      summary: 创建 APM SLO
      description: 创建 SLO 定义（service 为应用编码，对应聚合指标 app 标签；同一服务同一指标同一窗口唯一，重复定义返回 409）。校验：name ≤128 字符非空、service ≤128 字符非空、availability 的 target ∈ (0,1)、latency_p95 的 target 为毫秒正数（≤600000）、window ∈ {7d,30d}。创建即评估一次，响应为含评估结果的完整列表项。权限：`apm.settings.manage`（中风险操作审计）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApmSLOUpsertRequest' }
      responses:
        '200':
          description: 创建成功（含创建即时评估结果）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmSLOItem' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /apm/slos/{id}:
    get:
      operationId: apmSLODetail
      tags: [APM]
      summary: APM SLO 详情（含达标率趋势）
      description: 单条 SLO 定义 + 当前窗口实时评估（口径同列表）+ trend 达标率趋势（7d 窗口按小时桶、30d 窗口按天桶；零流量桶达标率计 1——无失败证据）。SLO 不存在返回 404。权限：`apm.overview.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: SLO ID }
      responses:
        '200':
          description: SLO 详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmSLODetail' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: apmSLOUpdate
      tags: [APM]
      summary: 全量更新 APM SLO
      description: 全量更新 SLO 定义（字段与校验同创建；SLO 不存在返回 404；目标组合与他人定义撞唯一约束返回 409）。更新后重新评估一次，响应为含评估结果的完整列表项。权限：`apm.settings.manage`（中风险操作审计，含变更前后摘要）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: SLO ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApmSLOUpsertRequest' }
      responses:
        '200':
          description: 更新成功（含更新后评估结果）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data: { $ref: '#/components/schemas/ApmSLOItem' }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: apmSLODelete
      tags: [APM]
      summary: 删除 APM SLO
      description: 删除 SLO 定义（不存在返回 404）；其未关闭的 APM_SLO_BREACH 告警在下一轮周期评估（每分钟）自动恢复收口。权限：`apm.settings.manage`（中风险操作审计）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: SLO ID }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string, example: 操作成功 }
                  data:
                    type: object
                    properties:
                      message: { type: string, example: SLO 已删除 }
                  request_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------- 阶段2 上半：Agent 控制面管理接口（会话 + RBAC；变更写高风险审计） ----------

  /apm/agents/enrollment-tokens:
