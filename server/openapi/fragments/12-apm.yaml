      description: Agent 登记列表（状态/语言/版本/心跳/证书到期）。status 为展示态——OFFLINE 由查询侧按心跳超时推导（不落库，阈值见 APM_AGENT_OFFLINE_MINUTES，默认 10 分钟）。支持 status/language/keyword/application_id 过滤。权限：`apm.agents.manage`（纯查询不审计）
