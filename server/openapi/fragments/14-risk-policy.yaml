# 片段：身份风险处置策略（WDSP AI 自动化渗透防护增强 阶段3，服务端）
# 路由源：server/internal/app/app.go「身份风险处置策略」注册段
# 数据源：security_risk_policy 表 GLOBAL 单行（迁移 000101 种子；权限种子 000102）
# 路径说明：设计文档（docs/WDSP_AI_PENTEST_PROTECTION_ENHANCEMENT.md #25.5）写作
# /security/risk-policies 复数形式；本项目单行全局策略惯例采用单数
# /security/risk-policy（与 /security/behavior-policy 对称，GLOBAL 单行语义，无 {id} 路径参数）。
paths:
  # ==================== 风险策略 ====================
  /security/risk-policy:
    get:
      operationId: riskPolicyGet
      tags: [risk-policy]
      summary: 读取风险策略
      description: 读取身份风险处置全局策略（GLOBAL 单行，含乐观锁 version；随网关发布下发 risk_policy 段——信号窗口内身份风险分达 rate_limit_threshold 限速、达 block_threshold 阻断）。权限：`risk_policy.read`
      responses:
        '200':
          description: 风险策略全字段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskPolicyDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: riskPolicyUpdate
      tags: [risk-policy]
      summary: 全量更新风险策略
      description: 全量更新全局风险策略（version 乐观锁，冲突返回 409；mode 限定 OBSERVE/PROTECT、block/rate_limit 阈值 1-100 且限速阈值必须小于阻断阈值、rate_limit_rps 1-100000、signal_window_seconds 1-604800、scores 键为大写信号类型格式且值 0-100、risk_levels 恰为 medium/high/critical 三键且严格递增）。成功后记录审计（OBSERVE→PROTECT 升级为高风险，其余中风险）并触发网关配置发布（risk_policy 段热生效；enabled=false 时网关风险处置零行为；OBSERVE 模式仅观测，事件 action_taken=would_block/would_rate_limit）。权限：`risk_policy.edit`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiskPolicyUpdateRequest' }
      responses:
        '200':
          description: 更新成功，返回更新后的策略（version+1）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskPolicyDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 策略已被其他人修改（version 乐观锁冲突），需刷新后重试 }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  schemas:
    # ==================== 风险策略 ====================
    RiskPolicy:
      type: object
      description: 身份风险处置全局策略（GLOBAL 单行；随网关发布下发 risk_policy 段）
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [GLOBAL], description: 作用域（当前仅 GLOBAL 单行） }
        enabled: { type: boolean, description: 总开关（false 时下发 enabled:false，网关风险处置零行为） }
        mode: { type: string, enum: [OBSERVE, PROTECT], description: 执行模式（OBSERVE 仅观测 / PROTECT 实际处置；默认 OBSERVE） }
        version: { type: integer, description: 乐观锁版本号（随发布下发，网关事件回报 policy_version 溯源） }
        block_threshold: { type: integer, minimum: 1, maximum: 100, description: 阻断风险分阈值（默认 80；PROTECT 模式达阈阻断） }
        rate_limit_threshold: { type: integer, minimum: 1, maximum: 100, description: 限速风险分阈值（默认 40；须小于 block_threshold） }
        rate_limit_rps: { type: integer, minimum: 1, maximum: 100000, description: 限速速率（RPS，默认 10） }
        signal_window_seconds: { type: integer, minimum: 1, maximum: 604800, description: 信号汇总窗口（秒，默认 86400） }
        scores:
          type: object
          description: 各信号类型分值覆盖（键为大写 SNAKE_CASE 信号类型，值 0-100；未覆盖信号按网关内置分值）
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
        risk_levels:
          type: object
          description: 风险等级阈值（恰为 medium/high/critical 三键，值 0-100 且严格递增；默认 {medium:20, high:40, critical:70}）
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
        updated_by: { type: string, description: 最近更新人用户名 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RiskPolicyDetailResponse:
      type: object
      properties:
        policy: { $ref: '#/components/schemas/RiskPolicy' }

    RiskPolicyUpdateRequest:
      type: object
      required: [enabled, mode, version, block_threshold, rate_limit_threshold, rate_limit_rps, signal_window_seconds]
      description: 风险策略全量更新请求（version 为乐观锁预期值；scope 可选、不可变，若提供须与当前值一致；id/updated_by/updated_at 为只读字段，请求体不承接）
      properties:
        scope: { type: string, enum: [GLOBAL], description: 作用域（不可变，若提供须与当前值一致） }
        enabled: { type: boolean, description: 总开关 }
        mode: { type: string, enum: [OBSERVE, PROTECT], description: 执行模式 }
        version: { type: integer, description: 乐观锁版本号（与当前版本不一致返回 409） }
        block_threshold: { type: integer, minimum: 1, maximum: 100 }
        rate_limit_threshold: { type: integer, minimum: 1, maximum: 100, description: 须小于 block_threshold }
        rate_limit_rps: { type: integer, minimum: 1, maximum: 100000 }
        signal_window_seconds: { type: integer, minimum: 1, maximum: 604800 }
        scores:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          description: 各信号类型分值覆盖（键为大写 SNAKE_CASE 信号类型）
        risk_levels:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          description: 风险等级阈值（恰为 medium/high/critical 三键且严格递增）
