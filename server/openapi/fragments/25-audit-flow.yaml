paths:
  /access-logs/flow:
    get:
      operationId: accessLogFlow
      tags: [access-logs]
      summary: 真实请求审计流向图
      description: 权限：access_logs.read。按请求去重统计来源、身份、应用、API、请求与响应敏感字段；字段命中数独立保留。默认最近24小时，最长31天；每类节点Top N（1至20，默认8），其余进入真实数量“其他”桶。不返回字段原值，不读取PCAP。
      parameters:
        - { name: start_time, in: query, required: false, schema: { type: string, format: date-time }, description: 起始时间，左闭区间 }
        - { name: end_time, in: query, required: false, schema: { type: string, format: date-time }, description: 结束时间，右开区间 }
        - { name: domain, in: query, required: false, schema: { type: string, maxLength: 255 } }
        - { name: client_ip, in: query, required: false, schema: { type: string }, description: 来源IP精确匹配 }
        - { name: method, in: query, required: false, schema: { type: string, maxLength: 16 } }
        - { name: uri, in: query, required: false, schema: { type: string, maxLength: 2048 } }
        - { name: status, in: query, required: false, schema: { type: integer, minimum: 100, maximum: 599 } }
        - { name: waf_action, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: request_id, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: application_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: trace_id, in: query, required: false, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
        - { name: identity_fingerprint, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: rule_id, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: endpoint_key, in: query, required: false, schema: { type: string, maxLength: 600 } }
        - { name: field_path, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: data_type, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [REQUEST, RESPONSE] } }
        - { name: request_ids, in: query, required: false, schema: { type: string, maxLength: 6500 }, description: 精确下钻的逗号分隔请求ID，最多100个 }
        - { name: node_limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 8 }, description: 每种节点类型保留的Top N数量 }
      responses:
        '200':
          description: 审计节点和边，集合与访问日志筛选一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestAuditFlow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  schemas:
    RequestAuditFlow:
      type: object
      required: [nodes, edges, request_count, sensitive_request_count, start_time, end_time, truncated, data_source]
      properties:
        nodes: { type: array, items: { $ref: '#/components/schemas/RequestAuditFlowNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/RequestAuditFlowEdge' } }
        request_count: { type: integer, description: 筛选集合内去重请求数 }
        sensitive_request_count: { type: integer, description: 含至少一个真实敏感字段证据的去重请求数 }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        truncated: { type: boolean, description: 存在TopN合并或达到有界扫描上限 }
        data_source: { type: string, enum: ['access_logs+api_runtime_events'] }
    RequestAuditFlowNode:
      type: object
      required: [id, name, kind, request_count, field_hits, verified, other, filters, drill_exact]
      properties:
        id: { type: string }
        name: { type: string, description: 节点名或字段path+类型；不含字段原值 }
        kind: { type: string, enum: [SOURCE, ACCOUNT, REQUEST_FIELD, APPLICATION, API, RESPONSE_FIELD] }
        request_count: { type: integer, description: 节点覆盖的去重请求数 }
        field_hits: { type: integer, format: int64, description: 字段节点命中数，与请求数不同 }
        verified: { type: boolean, description: ACCOUNT节点是否带真实JWT VERIFIED信号 }
        other: { type: boolean, description: 是否为TopN聚合的其他桶 }
        aggregated_nodes: { type: integer, description: 其他桶合并的真实节点数 }
        filters: { type: object, additionalProperties: { type: string }, description: 下钻筛选条件 }
        request_ids: { type: array, items: { type: string }, description: 最多100个精确下钻请求ID；更大集合省略 }
        drill_exact: { type: boolean, description: request_ids是否能精确还原节点集合；false时按filters下钻 }
    RequestAuditFlowEdge:
      type: object
      required: [id, source_id, target_id, request_count, field_hits, filters, drill_exact]
      properties:
        id: { type: string }
        source_id: { type: string }
        target_id: { type: string }
        request_count: { type: integer, description: 边覆盖的去重请求数 }
        field_hits: { type: integer, format: int64, description: 与字段节点直接相连的命中数 }
        filters: { type: object, additionalProperties: { type: string } }
        request_ids: { type: array, items: { type: string }, description: 最多100个精确下钻请求ID；更大集合省略 }
        drill_exact: { type: boolean, description: 是否能精确还原边对应的请求集合 }
