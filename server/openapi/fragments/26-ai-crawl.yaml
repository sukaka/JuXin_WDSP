# 片段：AI 爬虫治理、Web Bot Auth（RFC 9421）爬虫公钥目录与离线 AI 迷宫诱捕（Phase 9A-2）
# 路由源：server/internal/app/app.go（/ai-crawl/directories*、/applications/{id}/ai-crawl-policy）
# 数据源：ai_crawler_directories、ai_crawl_policies、ai_crawl_policy_versions（迁移 000245；
# 权限种子：ai_crawl.read 授予 SECURITY_ADMIN/AUDIT_ADMIN，ai_crawl.manage 授予 SECURITY_ADMIN）。
# 发布：草稿保存不自动发布，经既有 gateway-config 发布通道下发 ai_crawl_policy 段；
# AI 迷宫 HMAC 密钥存储于加密系统设置（gateway_runtime:ai_crawl_labyrinth_key），绝不经 REST 返回。
paths:
  # ==================== Web Bot Auth 爬虫公钥目录 ====================
  /ai-crawl/directories:
    get:
      operationId: aiCrawlDirectoriesList
      tags: [ai-crawl]
      summary: 列出爬虫公钥目录
      description: 列出内置及自定义的 Web Bot Auth（RFC 9421）爬虫公钥目录。仅含公钥 PEM，不含私钥材料。权限：`ai_crawl.read`
      responses:
        '200':
          description: 爬虫目录列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCrawlerDirectoryListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: aiCrawlDirectoriesCreate
      tags: [ai-crawl]
      summary: 新增爬虫公钥目录
      description: 新增自定义 Web Bot Auth 爬虫公钥目录。公钥仅允许 Ed25519 或 ECDSA P-256 的 PKIX PUBLIC KEY PEM（拒绝私钥）；非空 directory_url 强制 HTTPS 与 SSRF 校验。权限：`ai_crawl.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiCrawlerDirectoryRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCrawlerDirectoryDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ai-crawl/directories/{id}:
    put:
      operationId: aiCrawlDirectoriesUpdate
      tags: [ai-crawl]
      summary: 更新爬虫公钥目录
      description: 更新爬虫公钥目录的元数据、公钥集合或启用状态（内置目录不可修改 slug）。权限：`ai_crawl.manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目录 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiCrawlerDirectoryRequest' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCrawlerDirectoryDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: aiCrawlDirectoriesDelete
      tags: [ai-crawl]
      summary: 删除爬虫公钥目录
      description: 删除自定义爬虫公钥目录（内置目录不可删除，仅支持禁用）。权限：`ai_crawl.manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目录 ID }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ai-crawl/directories/import:
    post:
      operationId: aiCrawlDirectoriesImport
      tags: [ai-crawl]
      summary: 离线 JSON 包批量导入爬虫目录
      description: 面向离线/内网环境按 slug 幂等导入爬虫公钥目录包（事务原子校验并 upsert，拒绝私钥及非法 SSRF 地址）。权限：`ai_crawl.manage`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiCrawlerDirectoryImportRequest' }
      responses:
        '200':
          description: 导入成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCrawlerDirectoryImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ai-crawl/directories/{id}/sync:
    post:
      operationId: aiCrawlDirectoriesSync
      tags: [ai-crawl]
      summary: 手动同步远程爬虫公钥目录
      description: 经 outboundhttp SSRF 防护客户端以 HTTPS 拉取 RFC 9421 /.well-known/http-message-signatures-directory JWK 公钥集并转换为 PKIX PEM 落库（禁重定向、5s 超时、拨号 DNS 复检、拒绝私钥参数）。权限：`ai_crawl.manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 目录 ID }
      responses:
        '200':
          description: 同步成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCrawlerDirectorySyncResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================== 应用级 AI 爬虫治理策略 ====================
  /applications/{id}/ai-crawl-policy:
    get:
      operationId: aiCrawlPolicyGet
      tags: [ai-crawl]
      summary: 读取应用 AI 爬虫治理策略
      description: 读取应用 AI 爬虫治理与离线 AI 迷宫诱捕策略草稿及发布状态摘要（无记录返回默认 OFF 策略 version=0；不含迷宫 HMAC 密钥）。权限：`ai_crawl.read`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用 ID }
      responses:
        '200':
          description: 策略草稿与状态摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCrawlPolicyGetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: aiCrawlPolicyUpdate
      tags: [ai-crawl]
      summary: 保存应用 AI 爬虫治理策略草稿
      description: 校验并保存应用 AI 爬虫治理策略草稿（expected_version 乐观锁冲突返回 409；reason 必填并记录不可变版本与操作审计；启用 AI 迷宫时自动确保加密 HMAC 签名密钥就绪；保存草稿后经既有 gateway-config 发布通道下发）。权限：`ai_crawl.manage`
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用 ID }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiCrawlPolicyUpdateRequest' }
      responses:
        '200':
          description: 草稿保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiCrawlPolicyDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  schemas:
    AiCrawlerKey:
      type: object
      required: [kid, alg, public_key_pem]
      properties:
        kid: { type: string, maxLength: 256 }
        alg: { type: string, enum: [ed25519, ecdsa-p256-sha256] }
        public_key_pem: { type: string, description: PKIX PUBLIC KEY PEM（仅公钥） }

    AiCrawlerDirectory:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        category: { type: string, enum: [SEARCH_ENGINE, AI_TRAINING, AI_ASSISTANT, AI_AGENT, UNKNOWN_BOT] }
        signature_agent: { type: string, maxLength: 512 }
        directory_url: { type: string, maxLength: 1024 }
        keys:
          type: array
          items: { $ref: '#/components/schemas/AiCrawlerKey' }
        is_builtin: { type: boolean }
        enabled: { type: boolean }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiCrawlerDirectoryRequest:
      type: object
      required: [slug, name, category]
      properties:
        slug: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        category: { type: string, enum: [SEARCH_ENGINE, AI_TRAINING, AI_ASSISTANT, AI_AGENT, UNKNOWN_BOT] }
        signature_agent: { type: string, maxLength: 512 }
        directory_url: { type: string, maxLength: 1024 }
        keys:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/AiCrawlerKey' }
        enabled: { type: boolean }

    AiCrawlerDirectoryListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AiCrawlerDirectory' }

    AiCrawlerDirectoryDetailResponse:
      type: object
      properties:
        directory: { $ref: '#/components/schemas/AiCrawlerDirectory' }

    AiCrawlerDirectoryImportRequest:
      type: object
      required: [directories]
      properties:
        directories:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: '#/components/schemas/AiCrawlerDirectoryRequest' }

    AiCrawlerDirectoryImportResponse:
      type: object
      properties:
        imported: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AiCrawlerDirectory' }

    AiCrawlerDirectorySyncResponse:
      type: object
      properties:
        directory: { $ref: '#/components/schemas/AiCrawlerDirectory' }
        keys_count: { type: integer }

    AiCrawlHTTP402Config:
      type: object
      properties:
        message: { type: string, maxLength: 512 }
        price_hint: { type: string, maxLength: 128 }
        contact_url: { type: string, maxLength: 512 }
        receipt_header: { type: string, maxLength: 64 }

    AiCrawlRule:
      type: object
      required: [id, name, action, priority]
      properties:
        id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        category: { type: string, enum: [SEARCH_ENGINE, AI_TRAINING, AI_ASSISTANT, AI_AGENT, UNKNOWN_BOT] }
        agent_id: { type: string, maxLength: 256 }
        ua_patterns:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 256 }
        require_verified_sig: { type: boolean }
        action: { type: string, enum: [ALLOW, RATE_LIMIT, CHALLENGE, TARPIT, HTTP_402, BLOCK] }
        exempt_bot_challenge: { type: boolean }
        rate_limit_rpm: { type: integer, minimum: 0, maximum: 1000000 }
        priority: { type: integer, minimum: 0, maximum: 10000 }

    AiCrawlPolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        schema_version: { type: integer, enum: [1] }
        mode: { type: string, enum: [OFF, OBSERVE, PROTECT] }
        version: { type: integer }
        default_ai_action: { type: string, enum: [ALLOW, RATE_LIMIT, CHALLENGE, TARPIT, HTTP_402, BLOCK] }
        content_signal: { type: string, maxLength: 512 }
        verify_web_bot_auth: { type: boolean }
        labyrinth_enabled: { type: boolean }
        labyrinth_inject_links: { type: boolean }
        labyrinth_max_depth: { type: integer, minimum: 1, maximum: 16 }
        labyrinth_max_concurrency: { type: integer, minimum: 1, maximum: 4096 }
        labyrinth_delay_ms: { type: integer, minimum: 0, maximum: 5000 }
        http_402: { $ref: '#/components/schemas/AiCrawlHTTP402Config' }
        rules:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/AiCrawlRule' }
        updated_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiCrawlStatusSummary:
      type: object
      properties:
        state: { type: string, enum: [NOT_CONFIGURED, DRAFT_PENDING, PUBLISHED] }
        draft_version: { type: integer }
        published_version: { type: integer }

    AiCrawlPolicyGetResponse:
      type: object
      properties:
        policy: { $ref: '#/components/schemas/AiCrawlPolicy' }
        summary: { $ref: '#/components/schemas/AiCrawlStatusSummary' }

    AiCrawlPolicyDetailResponse:
      type: object
      properties:
        policy: { $ref: '#/components/schemas/AiCrawlPolicy' }

    AiCrawlPolicyUpdateRequest:
      type: object
      required: [mode, expected_version, reason]
      properties:
        mode: { type: string, enum: [OFF, OBSERVE, PROTECT] }
        expected_version: { type: integer, minimum: 0 }
        default_ai_action: { type: string, enum: [ALLOW, RATE_LIMIT, CHALLENGE, TARPIT, HTTP_402, BLOCK] }
        content_signal: { type: string, maxLength: 512 }
        verify_web_bot_auth: { type: boolean }
        labyrinth_enabled: { type: boolean }
        labyrinth_inject_links: { type: boolean }
        labyrinth_max_depth: { type: integer, minimum: 1, maximum: 16 }
        labyrinth_max_concurrency: { type: integer, minimum: 1, maximum: 4096 }
        labyrinth_delay_ms: { type: integer, minimum: 0, maximum: 5000 }
        http_402: { $ref: '#/components/schemas/AiCrawlHTTP402Config' }
        rules:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/AiCrawlRule' }
        reason: { type: string, minLength: 1, maxLength: 500 }
