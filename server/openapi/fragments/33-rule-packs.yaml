paths:
  /rule-packs/current:
    get:
      operationId: rulePackCurrent
      tags:
        - waf-rules
      summary: 查询当前生效的离线规则包与节点对齐状态
      description: |
        返回当前存储模式（VERSIONED / LEGACY_FLAT）、激活规则包档案、CRS 版本、最近执行任务及 HA 节点版本对齐态。
        权限：`waf_rules.read`
      responses:
        '200':
          description: 当前规则包状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePackCurrentStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /rule-packs:
    get:
      operationId: rulePackList
      tags:
        - waf-rules
      summary: 分页查询离线规则包历史记录
      description: |
        按创建时间倒序分页返回全部已登记离线规则包与内置基线快照，附带 `can_rollback` 字段标识是否可回滚。
        权限：`waf_rules.read`
      parameters:
        - name: page
          in: query
          required: false
          description: 页码（从 1 开始，默认 1）
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          description: 每页条数（默认 20，最大 100）
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 规则包分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePackListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /rule-packs/{id}:
    get:
      operationId: rulePackGet
      tags:
        - waf-rules
      summary: 查询单个离线规则包详情与预检报告
      description: |
        返回规则包完整 `manifest_json` 与上传阶段生成的 `preview_report`（规则增删改统计、重点 CVE、客户例外/覆盖影响预警及节点预检结果）。
        权限：`waf_rules.read`
      parameters:
        - name: id
          in: path
          required: true
          description: 规则包 UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 规则包详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePackItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rule-packs/upload:
    post:
      operationId: rulePackUpload
      tags:
        - waf-rules
      summary: 上传纯离线规则包并立即执行验签与预检
      description: |
        流式接收 `.tar.gz` 规则包（上限 64 MiB，单端点超时 2 分钟，最大并发 2），依次执行内嵌 Ed25519 验签、文件完整性核验、版本防降级、Coraza 静态安全门禁、规则差异与客户例外/覆盖影响预览。
        本接口**零现网副作用**，仅在验证全部通过后登记为 `VERIFIED` 等待确认生效。记录操作审计（风险：中）。
        权限：`waf_rules.pack.manage`
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 签名后的离线规则包文件（jiuzhang-wdsp-rulepack-YYYYMMDD.N.tar.gz）
      responses:
        '200':
          description: 验签与预检通过的规则包档案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePackItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 版本号降级或冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 文件超过 64 MiB 上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 并发上传达到上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /rule-packs/{id}/apply:
    post:
      operationId: rulePackApply
      tags:
        - waf-rules
      summary: 确认一键应用已验证的离线规则包
      description: |
        异步执行规则包生效流水线：主节点隔离解包 → HA 备节点独立验签落盘 → 网关配置发布校验与冒烟（失败自动保持旧版）→ 原子切换 current 相对软链与 mirrorcap 边车 → 自动同步 waf_rules 元数据与旧快照清理。
        记录高风险操作审计。权限：`waf_rules.pack.manage`
      parameters:
        - name: id
          in: path
          required: true
          description: 已通过校验（VERIFIED）的规则包 UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePackApplyRequest'
      responses:
        '202':
          description: 已受理并启动执行任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePackJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 存在活跃规则包任务、系统升级任务或脑裂状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /rule-packs/{id}/rollback:
    post:
      operationId: rulePackRollback
      tags:
        - waf-rules
      summary: 一键回滚至指定历史规则包版本
      description: |
        将网关规则与规则库元数据原子回滚到保留的历史规则包快照（或内置基线），同样经过网关校验、冒烟与自动元数据同步。
        记录高风险操作审计。权限：`waf_rules.pack.manage`
      parameters:
        - name: id
          in: path
          required: true
          description: 目标历史规则包 UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulePackApplyRequest'
      responses:
        '202':
          description: 已受理并启动回滚任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePackJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 快照不可用或存在并发任务冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /rule-packs/jobs/{job_id}:
    get:
      operationId: rulePackJobGet
      tags:
        - waf-rules
      summary: 查询规则包应用或回滚任务进度
      description: |
        返回任务当前阶段、进度百分比、关联的配置发布任务 ID、自动规则同步报告与 HA 逐节点执行明细。
        权限：`waf_rules.read`
      parameters:
        - name: job_id
          in: path
          required: true
          description: 执行任务 UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 执行任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePackJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /rule-packs/nodes/{node_id}/retry-sync:
    post:
      operationId: rulePackNodeRetrySync
      tags:
        - waf-rules
      summary: 为 HA 备节点补发当前生效规则包并重同步配置
      description: |
        当备节点离线恢复导致版本漂移时，先向备节点补发当前生效的离线规则包并完成独立验签落盘，再重同步网关配置与软链。
        记录操作审计（风险：中）。权限：`waf_rules.pack.manage`
      parameters:
        - name: node_id
          in: path
          required: true
          description: 目标备节点 UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 补发并重同步成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 单机模式或未启用 HA 协同代理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    RulePackApplyRequest:
      type: object
      properties:
        allow_degraded_ha:
          type: boolean
          default: false
          description: 是否允许在 HA 备节点不可达时降级仅主节点生效（默认 false = fail-closed）
        degraded_reason:
          type: string
          maxLength: 500
          description: 开启降级模式时必填的应急说明

    RulePackNodePrecheckStatus:
      type: object
      properties:
        node_id:
          type: string
          format: uuid
          nullable: true
        node_name:
          type: string
        role:
          type: string
          enum:
            - PRIMARY
            - STANDBY
        reachable:
          type: boolean
        rulepack_ready:
          type: boolean
        current_version:
          type: string
        aligned:
          type: boolean
        error:
          type: string

    RulePackItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rulepack_version:
          type: string
          description: 规则包版本号（如 20261201.1 或 builtin-1.19.1）
        crs_version:
          type: string
        min_system_version:
          type: string
        coraza_compat:
          type: string
        is_builtin:
          type: boolean
        file_name:
          type: string
        file_size:
          type: integer
          format: int64
        file_sha256:
          type: string
        manifest_sha256:
          type: string
        manifest_json:
          type: object
        preview_report:
          type: object
        status:
          type: string
          enum:
            - VERIFIED
            - REJECTED
            - APPLIED
            - SUPERSEDED
            - ROLLED_BACK
        reject_reason:
          type: string
        uploaded_by:
          type: string
          format: uuid
          nullable: true
        uploaded_at:
          type: string
          format: date-time
        applied_by:
          type: string
          format: uuid
          nullable: true
        applied_at:
          type: string
          format: date-time
          nullable: true
        can_rollback:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RulePackListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RulePackItem'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64

    RulePackNodeState:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
          nullable: true
        node_name:
          type: string
        role:
          type: string
          enum:
            - PRIMARY
            - STANDBY
        stage_status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
            - SKIPPED
        load_status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
            - SKIPPED
        activate_status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
            - SKIPPED
        error_code:
          type: string
        error_message:
          type: string
        updated_at:
          type: string
          format: date-time

    RulePackJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_type:
          type: string
          enum:
            - APPLY
            - ROLLBACK
        target_pack_id:
          type: string
          format: uuid
        target_version:
          type: string
        previous_pack_id:
          type: string
          format: uuid
          nullable: true
        previous_version:
          type: string
        publish_task_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - PENDING
            - STAGING_LOCAL
            - STAGING_STANDBY
            - PUBLISHING
            - ACTIVATING
            - SYNCING_METADATA
            - SUCCESS
            - ROLLING_BACK
            - ROLLED_BACK
            - FAILED
        current_step:
          type: string
        progress:
          type: integer
        allow_degraded_ha:
          type: boolean
        degraded_reason:
          type: string
        sync_report:
          type: object
        failure_code:
          type: string
        failure_message:
          type: string
        requested_by:
          type: string
          format: uuid
          nullable: true
        request_id:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        node_states:
          type: array
          items:
            $ref: '#/components/schemas/RulePackNodeState'

    RulePackCurrentStatusResponse:
      type: object
      properties:
        storage_mode:
          type: string
          enum:
            - VERSIONED
            - LEGACY_FLAT
        writable:
          type: boolean
        retention:
          type: integer
        active_pack:
          $ref: '#/components/schemas/RulePackItem'
          nullable: true
        active_version:
          type: string
        active_crs_version:
          type: string
        gateway_rules_base_path:
          type: string
        latest_job:
          $ref: '#/components/schemas/RulePackJob'
          nullable: true
        ha_sync_enabled:
          type: boolean
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/RulePackNodePrecheckStatus'
        drift_detected:
          type: boolean
