  /api-security/graph:
    get:
      summary: API调用图谱
      description: 返回端点节点与调用边（节点为端点，边为调用关系）。需要权限 api_graph.read
      tags: [api-security]
      operationId: getApiGraph
      responses:
        '200':
          description: 调用图谱（nodes + edges）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items: { $ref: '#/components/schemas/ApiGraphNode' }
                      edges:
                        type: array
                        items: { $ref: '#/components/schemas/ApiGraphEdge' }
                  request_id: { type: string, format: uuid }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/topology:
    get:
      summary: API拓扑视图
      description: 按应用分组的端点拓扑与调用边。需要权限 api_graph.read
      tags: [api-security]
      operationId: getApiTopology
      responses:
        '200':
          description: 拓扑视图（applications + edges）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      applications:
                        type: array
                        items: { $ref: '#/components/schemas/ApiTopologyGroup' }
                      edges:
                        type: array
                        items: { $ref: '#/components/schemas/ApiGraphEdge' }
                  request_id: { type: string, format: uuid }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/specs/import:
    post:
      summary: 导入OpenAPI规范
      description: 导入 OpenAPI 3 JSON 文档（仅支持 JSON，请求体上限 16MiB），与运行时端点对比生成差异记录。需要权限 api_spec.import
      tags: [api-security]
      operationId: importApiSpec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'OpenAPI 3 JSON 文档原文，或包装形式 {"spec": {...}, "file_name": "..."}'
              properties:
                spec: { type: object, description: OpenAPI 3 文档（包装形式时必填） }
                file_name: { type: string, description: 可选文件名 }
      responses:
        '200':
          description: 导入结果（含差异计数）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      spec: { $ref: '#/components/schemas/ApiImportSpec' }
                      missing_in_runtime: { type: integer, description: 规范有而运行时无的端点数 }
                      missing_in_spec: { type: integer, description: 运行时有而规范无的端点数 }
                  request_id: { type: string, format: uuid }
        '400': { description: 仅支持 JSON 格式的 OpenAPI 3 文档（非 JSON/缺少 openapi 3.x 声明/缺少 paths/请求体超限） }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/specs:
    get:
      summary: 已导入规范分页列表
      description: 分页列出已导入的 API 规范。需要权限 api_spec.read
      tags: [api-security]
      operationId: listApiSpecs
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 分页规范列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ApiImportSpecPage' }
                  request_id: { type: string, format: uuid }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/specs/{id}/diff:
    get:
      summary: 规范差异明细
      description: 返回指定导入规范与运行时端点的差异明细。需要权限 api_spec.read
      tags: [api-security]
      operationId: getApiSpecDiff
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 规范与差异明细
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      spec: { $ref: '#/components/schemas/ApiImportSpec' }
                      diffs:
                        type: array
                        items: { $ref: '#/components/schemas/ApiSpecDiff' }
                  request_id: { type: string, format: uuid }
        '400': { description: 无效的规范ID }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 规范不存在 }

  /api-security/findings:
    get:
      summary: 风险发现分页列表
      description: 按类型/严重级别/状态过滤运行时风险发现。需要权限 api_runtime.read
      tags: [api-security]
      operationId: listApiFindings
      parameters:
        - { name: finding_type, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 分页风险发现列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ApiFindingPage' }
                  request_id: { type: string, format: uuid }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/violations:
    get:
      summary: Schema违例分页列表
      description: 按端点/违例类型过滤 Schema 违例记录。需要权限 api_runtime.read
      tags: [api-security]
      operationId: listApiViolations
      parameters:
        - { name: endpoint_id, in: query, schema: { type: string, format: uuid } }
        - { name: violation_type, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 分页违例列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ApiViolationPage' }
                  request_id: { type: string, format: uuid }
        '400': { description: 无效的端点ID }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/posture:
    get:
      summary: API安全态势总览
      description: 端点资产/学习覆盖/模型冻结/开放风险的整体态势指标。需要权限 api_runtime.read
      tags: [api-security]
      operationId: getApiPosture
      responses:
        '200':
          description: 安全态势指标
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ApiPosture' }
                  request_id: { type: string, format: uuid }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/runtime/statistics:
    get:
      summary: 运行时事件统计
      description: 运行时事件总量、final_action/risk_level 分布与 Top10 端点。需要权限 api_runtime.read
      tags: [api-security]
      operationId: getApiRuntimeStatistics
      responses:
        '200':
          description: 运行时统计
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ApiRuntimeStatistics' }
                  request_id: { type: string, format: uuid }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/runtime/events:
    get:
      summary: 运行时事件分页列表
      description: 按端点键/最终动作过滤运行时事件。需要权限 api_runtime.read
      tags: [api-security]
      operationId: listApiRuntimeEvents
      parameters:
        - { name: endpoint_key, in: query, schema: { type: string } }
        - { name: final_action, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 分页运行时事件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ApiRuntimeEventPage' }
                  request_id: { type: string, format: uuid }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/sensitive-fields:
    get:
      summary: 敏感字段分页列表
      description: 按端点/方向/数据类型过滤敏感字段识别结果（api_sensitive_fields）。需要权限 api_runtime.read
      tags: [api-security]
      operationId: listApiSensitiveFields
      parameters:
        - { name: endpoint_id, in: query, schema: { type: string, format: uuid } }
        - { name: direction, in: query, schema: { type: string, enum: [REQUEST, RESPONSE] } }
        - { name: data_type, in: query, schema: { type: string }, description: 如 phone / id_card / bank_card / email / credential }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 分页敏感字段列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ApiSensitiveFieldPage' }
                  request_id: { type: string, format: uuid }
        '400': { description: 无效的端点ID或direction取值 }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/policy:
    get:
      summary: API动态防护策略视图
      description: 返回产品形态、能力开关、生效防护模式与来源（settings表覆盖 > 环境变量 > 内置默认）及解析限制。需要权限 api_policy.read
      tags: [api-security]
      operationId: getApiPolicy
      responses:
        '200':
          description: 防护策略视图
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ApiPolicy' }
                  request_id: { type: string, format: uuid }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
    put:
      summary: 更新API动态防护模式
      description: 覆盖写入 settings 表 api_protection.mode（仅接受 OFF/OBSERVE/PROTECT），发布后生效。需要权限 api_policy.edit
      tags: [api-security]
      operationId: updateApiPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [OFF, OBSERVE, PROTECT] }
      responses:
        '200':
          description: 更新后的防护策略视图
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      policy: { $ref: '#/components/schemas/ApiPolicy' }
                      message: { type: string }
                  request_id: { type: string, format: uuid }
        '400': { description: 无效的防护模式 }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '503': { description: 设置服务未配置 }

  /api-security/policy/publish:
    post:
      summary: 发布API动态防护策略
      description: 触发一次配置发布（同步等待最终状态），使防护模式下发网关。需要权限 api_policy.publish
      tags: [api-security]
      operationId: publishApiPolicy
      responses:
        '200':
          description: 发布任务结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      task_id: { type: string, format: uuid }
                      status: { type: string, example: SUCCESS }
                      message: { type: string }
                  request_id: { type: string, format: uuid }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '503': { description: 发布能力未配置 }

  /applications/{id}/header-config:
    get:
      summary: 查询应用头合规与代理配置
      description: 返回应用已存储的头合规与代理配置；未配置时返回默认对象且 configured=false、version=0（默认行为等价于既有静态头版本）。需要权限 applications.read
      tags: [applications]
      operationId: getAppHeaderConfig
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用ID }
      responses:
        '200':
          description: 头合规配置（data 含 config / configured / version / updated_at）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      config: { $ref: '#/components/schemas/AppHeaderConfig' }
                      configured: { type: boolean, description: 是否已存储配置（false 时 config 为默认对象） }
                      version: { type: integer, description: 乐观锁版本（未配置时为 0） }
                      updated_at: { type: string, format: date-time }
                  request_id: { type: string, format: uuid }
        '400': { description: 无效的应用ID }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
    put:
      summary: 保存应用头合规与代理配置
      description: 全量 upsert（body 为完整配置 + version）。version=0 表示首次创建（已存在报 409）；version>0 按乐观锁更新（记录不存在或版本不匹配报 409）。需要权限 applications.update
      tags: [applications]
      operationId: putAppHeaderConfig
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用ID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AppHeaderConfig'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, description: 乐观锁版本（0=创建） }
      responses:
        '200':
          description: 保存成功（data 含 config / configured=true / 新 version）
        '400': { description: 校验失败（action/x_frame_options/csp_mode/hsts_max_age/自定义规则非法） }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 应用不存在 }
        '409': { description: 版本冲突（配置已被其他人修改） }

  /applications/{id}/path-routes:
    get:
      summary: 应用路径转发分页列表
      description: 按 priority 升序、path_prefix 字典序返回应用全部路径转发规则。需要权限 applications.read
      tags: [applications]
      operationId: listAppPathRoutes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用ID }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 分页路径转发列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AppPathRouteRecord' }
                      page: { type: integer }
                      page_size: { type: integer }
                      total: { type: integer }
                  request_id: { type: string, format: uuid }
        '400': { description: 无效的应用ID }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
    post:
      summary: 创建应用路径转发
      description: 新增路径前缀 → 指定源站的转发规则（缺省 scheme=http、status=ENABLED、priority=100）。需要权限 applications.update
      tags: [applications]
      operationId: createAppPathRoute
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用ID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path_prefix, upstream_host, upstream_port]
              properties:
                path_prefix: { type: string, description: "以 / 开头，不含 ?、#、.." }
                upstream_scheme: { type: string, enum: [http, https], default: http }
                upstream_host: { type: string }
                upstream_port: { type: integer, minimum: 1, maximum: 65535 }
                strip_prefix: { type: boolean, default: false, description: true=剥离前缀转发 }
                priority: { type: integer, default: 100, description: 数值小者优先；同优先级长前缀优先 }
                status: { type: string, enum: [ENABLED, DISABLED], default: ENABLED }
                description: { type: string, maxLength: 255 }
      responses:
        '200':
          description: 创建成功（data.route 为完整记录）
        '400': { description: 校验失败（路径前缀/端口/scheme/status 非法） }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 应用不存在 }
        '409': { description: 相同路径前缀与源站的规则已存在 }

  /applications/{id}/path-routes/{rid}:
    patch:
      summary: 更新应用路径转发
      description: 全量替换路径转发规则 + version 乐观锁（body 携带当前 version）。需要权限 applications.update
      tags: [applications]
      operationId: updateAppPathRoute
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用ID }
        - { name: rid, in: path, required: true, schema: { type: string, format: uuid }, description: 路径转发ID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path_prefix, upstream_host, upstream_port, version]
              properties:
                path_prefix: { type: string, description: "以 / 开头，不含 ?、#、.." }
                upstream_scheme: { type: string, enum: [http, https], default: http }
                upstream_host: { type: string }
                upstream_port: { type: integer, minimum: 1, maximum: 65535 }
                strip_prefix: { type: boolean, default: false }
                priority: { type: integer, default: 100 }
                status: { type: string, enum: [ENABLED, DISABLED], default: ENABLED }
                description: { type: string, maxLength: 255 }
                version: { type: integer, description: 乐观锁版本 }
      responses:
        '200':
          description: 更新成功（data.route 为新版本记录）
        '400': { description: 校验失败 }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 路径转发不存在 }
        '409': { description: 版本冲突或相同路径前缀与源站的规则已存在 }
    delete:
      summary: 删除应用路径转发
      description: 删除指定路径转发规则。需要权限 applications.update
      tags: [applications]
      operationId: deleteAppPathRoute
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: 应用ID }
        - { name: rid, in: path, required: true, schema: { type: string, format: uuid }, description: 路径转发ID }
      responses:
        '200':
          description: 删除成功
        '400': { description: 无效的应用ID或路径转发ID }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 路径转发不存在 }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jiuzhang_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

  schemas:
    ApiResponse:
      type: object
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: {}
        request_id: { type: string, format: uuid }

    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: PERMISSION_DENIED }
        message: { type: string }
        details: {}
        request_id: { type: string, format: uuid }

    AppHeaderRule:
      type: object
      required: [name, method]
      properties:
        name: { type: string, description: HTTP 头字段名（RFC 7230 token） }
        method: { type: string, enum: [set, add, delete], description: delete 时 value 必须为空 }
        value: { type: string }

    AppHeaderConfig:
      type: object
      description: 应用级 HTTP 头合规与代理配置（字段与 app_header_configs 表一致）。下划线请求头由网关内核（Caddy 2.11+，GHSA-f59h-q822-g45g）入口强制丢弃，始终生效、不可配置。
      properties:
        server_action: { type: string, enum: [keep, hide, replace] }
        server_value: { type: string, maxLength: 255 }
        x_author_action: { type: string, enum: [keep, hide, replace] }
        x_author_value: { type: string, maxLength: 255 }
        x_powered_by_action: { type: string, enum: [keep, hide, replace] }
        x_powered_by_value: { type: string, maxLength: 255 }
        x_frame_options: { type: string, enum: [default, inherit, deny, sameorigin, allow_from], description: allow_from 必须带 x_frame_options_url }
        x_frame_options_url: { type: string, maxLength: 512 }
        x_xss_protection: { type: boolean }
        vary_user_agent: { type: boolean }
        hsts_enabled: { type: boolean }
        hsts_max_age: { type: integer, minimum: 1 }
        csp_mode: { type: string, enum: [off, preset, custom], description: custom 必须带 csp_value }
        csp_value: { type: string }
        response_buffering: { type: boolean, description: 响应缓冲（flush_interval=-1） }
        xff_overwrite: { type: boolean, description: X-Forwarded-For 上一跳覆盖 }
        host_strip_port: { type: boolean, description: Host 不包含端口 }
        accept_encoding_off: { type: boolean, description: 关闭压缩协商 }
        redirect_port_rewrite: { type: boolean, description: 302 Location 端口改写为接入端口 }
        custom_request_rules:
          type: array
          items: { $ref: '#/components/schemas/AppHeaderRule' }
        custom_response_rules:
          type: array
          items: { $ref: '#/components/schemas/AppHeaderRule' }

    AppPathRouteRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        path_prefix: { type: string, example: /api }
        upstream_scheme: { type: string, enum: [http, https] }
        upstream_host: { type: string }
        upstream_port: { type: integer }
        strip_prefix: { type: boolean }
        priority: { type: integer }
        status: { type: string, enum: [ENABLED, DISABLED] }
        description: { type: string }
        created_by: { type: string, format: uuid, description: 可空 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }

    ApiEndpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        application_id: { type: string, format: uuid, description: 所属应用（可空） }
        application_name: { type: string, description: 所属应用名称（列表带出，未归属为空） }
        domain_id: { type: string, format: uuid, description: 所属域名（可空） }
        http_method: { type: string, example: GET }
        normalized_path: { type: string, example: '/api/users/{id}' }
        raw_path_example: { type: string }
        directory_path: { type: string, example: '/test/php', description: 目录（normalized_path 去掉最后一段） }
        endpoint_key: { type: string, example: 'GET /api/users/{id}' }
        api_confidence: { type: number, format: double }
        asset_status: { type: string, enum: [DISCOVERED, CONFIRMED, IGNORED, DEPRECATED] }
        protocol_type: { type: string }
        learning_status: { type: string, enum: [NOT_STARTED, LEARNING, PAUSED, LEARNED] }
        current_model_version_id: { type: string, format: uuid, description: 当前激活模型版本（可空） }
        classification_locked: { type: boolean }
        is_api: { type: boolean }
        hit_count: { type: integer, format: int64 }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time, description: 确认时间（可空） }
        asset: { $ref: '#/components/schemas/ApiAsset' }

    ApiAsset:
      type: object
      properties:
        endpoint_id: { type: string, format: uuid }
