        exposure: { type: string, enum: [INTERNAL, PARTNER, PUBLIC] }
        data_classification: { type: string }
        owner: { type: string }
        tags:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApiClassificationDimension:
      type: object
      properties:
        endpoint_id: { type: string, format: uuid }
        dimension: { type: string, example: PURPOSE }
        value: { type: string, example: AUTH }
        source: { type: string, enum: [AUTO, MANUAL] }
        confidence: { type: number, format: double }

    ApiEndpointClassification:
      type: object
      properties:
