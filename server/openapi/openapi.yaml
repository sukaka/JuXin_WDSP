        request_schema_id: { type: string, format: uuid, description: 请求 Schema（可空） }
        response_schema_set_id: { type: string, format: uuid, description: 响应 Schema 集（可空） }
        status: { type: string, enum: [CANDIDATE, IN_REVIEW, FORMAL, REJECTED, SUPERSEDED, ARCHIVED] }
        schema:
          type: object
          additionalProperties: { type: string }
          description: 字段名到类型的映射
        content_hash: { type: string }
        change_summary: { type: string }
        sample_count: { type: integer }
        valid_sample_count: { type: integer }
        excluded_sample_count: { type: integer }
        confidence: { type: number, format: double }
        created_reason: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        confirmed_by: { type: string, format: uuid }
        confirmed_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }

    ApiSchemaDiff:
      type: object
      properties:
        added:
          type: array
          items: { type: string }
        removed:
          type: array
          items: { type: string }
        type_changed:
          type: array
          items:
            type: object
            properties:
