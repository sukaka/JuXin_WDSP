        value: { type: string }
        source: { type: string, enum: [AUTO, MANUAL] }
        confidence: { type: number, format: double }
        updated_at: { type: string, format: date-time }

    ApiLearningJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        endpoint_id: { type: string, format: uuid }
