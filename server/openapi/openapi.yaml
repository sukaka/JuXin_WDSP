                    type: object
                    properties:
                      job: { $ref: '#/components/schemas/ApiLearningJob' }
                      message: { type: string }
                  request_id: { type: string, format: uuid }
        '400': { description: 无效的端点ID或样本目标越界 }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 端点不存在 }
        '409': { description: 该端点已有运行中的学习任务 }

