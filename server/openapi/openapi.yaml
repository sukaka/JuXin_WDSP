      tags: [api-security]
      operationId: startEndpointLearning
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sample_target:
                  type: integer
                  minimum: 10
                  maximum: 100000
                  description: 有效样本目标（缺省 100）；0 或越界返回 400
      responses:
        '200':
          description: 学习任务已启动
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
