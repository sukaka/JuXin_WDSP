openapi: 3.0.3
info:
  title: 九章WEB应用智能防护系统 V2.0 管理API
  description: |
    九章管理后端 RESTful API（阶段2：身份认证、三权权限与系统基础）。
    认证方式：HttpOnly Cookie（jiuzhang_session）+ CSRF Token（X-CSRF-Token 头）。
  version: 2.0.0-stage2
  contact:
    name: 聚信得仁

servers:
  - url: /api/v1
    description: 管理API基础路径

tags:
  - name: auth
    description: 身份认证
  - name: users
    description: 用户管理
  - name: roles
    description: 角色权限
  - name: login-logs
    description: 登录日志
  - name: audits
    description: 操作审计
  - name: system-settings
    description: 系统设置
  - name: profile
    description: 个人中心
  - name: api-security
    description: API动态防护（阶段8/WDSP：端点资产、模型版本、参数、分类图谱、规范导入、风险与运行时）
  - name: applications
    description: Web应用管理（含应用级 HTTP 头合规与代理配置、路径粒度转发）

paths:
  /health:
    get:
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务及依赖状态

  /auth/captcha:
    get:
      summary: 获取图形验证码
      tags: [auth]
      security: []
      responses:
        '200':
          description: 验证码ID与图片（data:image/png;base64）

  /auth/login:
    post:
      summary: 用户登录
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, captcha_id, captcha_code]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                captcha_id: { type: string }
                captcha_code: { type: string }
      responses:
        '200':
          description: 登录成功（Set-Cookie 下发会话，data 含 csrf_token）
        '401':
          description: 用户名或密码错误（统一提示）
        '400':
          description: 验证码错误

  /auth/logout:
    post:
      summary: 退出登录
      tags: [auth]
      responses:
        '200':
          description: 已退出

  /auth/me:
    get:
      summary: 当前登录用户信息
      tags: [auth]
      responses:
        '200':
          description: 用户信息 + csrf_token
        '401':
          description: 未登录

  /auth/change-password:
    post:
      summary: 修改密码
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '200':
          description: 修改成功（需重新登录）

  /auth/sessions:
    get:
      summary: 当前用户会话列表
      tags: [auth]
      responses:
        '200':
          description: 会话摘要列表

  /auth/sessions/{id}:
    delete:
      summary: 结束指定会话
      tags: [auth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 会话已结束

  /users:
    get:
      summary: 用户列表
      tags: [users]
      parameters:
        - { name: username, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: role_code, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 分页用户列表
    post:
      summary: 创建用户（返回一次性临时密码）
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, role_code]
              properties:
                username: { type: string }
                display_name: { type: string }
                role_code: { type: string, enum: [SYSTEM_ADMIN, SECURITY_ADMIN, AUDIT_ADMIN] }
      responses:
        '200':
          description: 创建成功（data.temporary_password 仅显示一次）

  /users/{id}:
    get:
      summary: 用户详情
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 用户信息 }
        '404': { description: 用户不存在 }
    put:
      summary: 修改用户（乐观锁 version）
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 修改成功 }
        '409': { description: 版本冲突 }
    delete:
      summary: 删除用户（逻辑删除）
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已删除 }

  /users/{id}/enable:
    post: { summary: 启用用户, tags: [users], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /users/{id}/disable:
    post: { summary: 停用用户, tags: [users], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /users/{id}/unlock:
    post: { summary: 解锁用户, tags: [users], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /users/{id}/reset-password:
    post: { summary: 重置密码（返回临时密码）, tags: [users], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /users/{id}/sessions:
    delete: { summary: 强制用户下线, tags: [users], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }

  /roles:
    get:
      summary: 角色列表
      tags: [roles]
      responses:
        '200': { description: 角色列表 }

  /roles/{id}:
    get:
      summary: 角色详情（含权限）
      tags: [roles]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 角色与权限 }

  /permissions:
    get:
      summary: 权限清单
      tags: [roles]
      responses:
        '200': { description: 权限清单 }

  /login-logs:
    get:
      summary: 登录日志查询
      tags: [login-logs]
      responses:
        '200': { description: 分页登录日志 }

  /login-logs/export:
    get:
      summary: 导出登录日志（CSV）
      tags: [login-logs]
      responses:
        '200': { description: CSV 文件, content: { text/csv: {} } }

  /audits:
    get:
      summary: 操作审计查询
      tags: [audits]
      responses:
        '200': { description: 分页操作审计 }

  /audits/{id}:
    get:
      summary: 审计详情
      tags: [audits]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 审计详情 }

  /audits/export:
    get:
      summary: 导出审计（CSV）
      tags: [audits]
      responses:
        '200': { description: CSV 文件, content: { text/csv: {} } }

  /audits/verify-chain:
    post:
      summary: 校验审计哈希链
      tags: [audits]
      responses:
        '200': { description: '校验结果 {valid, mismatch_count}' }

  /system-settings:
    get:
      summary: 系统设置列表
      tags: [system-settings]
      parameters:
        - { name: group, in: query, schema: { type: string, enum: [password, login, session, display] } }
      responses:
        '200': { description: 设置列表（敏感值脱敏） }
    put:
      summary: 更新系统设置（乐观锁 version）
      tags: [system-settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setting_group, setting_key, setting_value, version]
              properties:
                setting_group: { type: string }
                setting_key: { type: string }
                setting_value: {}
                version: { type: integer }
      responses:
        '200': { description: 更新成功 }
        '409': { description: 版本冲突 }

  /profile:
    get:
      summary: 个人资料
      tags: [profile]
      responses:
        '200': { description: 个人资料与权限 }
    put:
      summary: 修改个人资料（显示名）
      tags: [profile]
      responses:
        '200': { description: 修改成功 }

  /profile/login-logs:
    get:
      summary: 我的登录记录
      tags: [profile]
      responses:
        '200': { description: 分页登录记录 }

  /api-security/endpoints:
    get:
      summary: API端点分页列表
      description: 按资产状态/学习状态/关键字/站点/目录过滤已发现的 API 端点。需要权限 api_asset.read
      tags: [api-security]
      operationId: listApiEndpoints
      parameters:
        - { name: asset_status, in: query, schema: { type: string, enum: [DISCOVERED, CONFIRMED, IGNORED, DEPRECATED] } }
        - { name: learning_status, in: query, schema: { type: string, enum: [NOT_STARTED, LEARNING, PAUSED, LEARNED] } }
        - { name: keyword, in: query, schema: { type: string }, description: 路径关键字（模糊匹配 normalized_path） }
        - { name: application_id, in: query, schema: { type: string, format: uuid }, description: 按站点（应用）过滤 }
        - { name: unassigned, in: query, schema: { type: boolean }, description: true 时仅查未归属端点（application_id 为空） }
        - { name: directory_path, in: query, schema: { type: string }, description: 目录前缀过滤（含子目录，如 /test 命中 /test 与 /test/php） }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 分页端点列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/ApiEndpointPage' }
                  request_id: { type: string, format: uuid }
        '400': { description: 参数错误（无效的 application_id） }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/endpoints/site-summary:
    get:
      summary: 站点端点计数汇总
      description: 返回各站点（应用）的端点计数与未归属端点计数，供站点列表角标。需要权限 api_asset.read
      tags: [api-security]
      operationId: apiEndpointSiteSummary
      responses:
        '200':
          description: 站点计数列表与未归属计数
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            application_id: { type: string, format: uuid }
                            application_name: { type: string }
                            endpoint_count: { type: integer }
                      unassigned: { type: integer, description: 未归属端点数 }
                  request_id: { type: string, format: uuid }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/endpoints/directory-tree:
    get:
      summary: 目录聚合端点计数
      description: 按目录（normalized_path 去掉最后一段）聚合端点计数，扁平返回由前端组装目录树。需要权限 api_asset.read
      tags: [api-security]
      operationId: apiEndpointDirectoryTree
      parameters:
        - { name: application_id, in: query, schema: { type: string, format: uuid }, description: 指定站点（缺省为全部站点） }
        - { name: unassigned, in: query, schema: { type: boolean }, description: true 时仅统计未归属端点 }
      responses:
        '200':
          description: 目录计数列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            directory_path: { type: string, example: /test/php }
                            endpoint_count: { type: integer }
                  request_id: { type: string, format: uuid }
        '400': { description: 参数错误（无效的 application_id） }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/endpoints/confirm:
    post:
      summary: 批量确认端点
      description: 批量将端点确认为资产（asset_status=CONFIRMED），单次最多 100 个，逐项返回失败原因。需要权限 api_asset.confirm
      tags: [api-security]
      operationId: confirmApiEndpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
      responses:
        '200':
          description: 批量确认结果（含逐项失败明细）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      confirmed: { type: integer }
                      confirmed_ids:
                        type: array
                        items: { type: string, format: uuid }
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            reason: { type: string }
                  request_id: { type: string, format: uuid }
        '400': { description: 参数错误（ids 为空或超过 100 个） }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }

  /api-security/endpoints/{id}:
    get:
      summary: API端点详情
      description: 返回端点及 api_assets 业务维度扩展（asset 字段，无记录时为空）。需要权限 api_asset.read
      tags: [api-security]
      operationId: getApiEndpoint
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 端点详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      endpoint: { $ref: '#/components/schemas/ApiEndpoint' }
                  request_id: { type: string, format: uuid }
        '400': { description: 无效的端点ID }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 端点不存在 }
    patch:
      summary: 更新端点资产信息
      description: 全量替换端点的 purpose/exposure/owner/tags（至少提交一个字段）。需要权限 api_asset.edit
      tags: [api-security]
      operationId: updateApiEndpoint
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: { type: string, maxLength: 128 }
                exposure: { type: string, enum: [INTERNAL, PARTNER, PUBLIC] }
                owner: { type: string, maxLength: 128 }
                tags:
                  type: array
                  items: { type: string, maxLength: 64 }
                  maxItems: 32
      responses:
        '200':
          description: 资产信息已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      endpoint: { $ref: '#/components/schemas/ApiEndpoint' }
                      message: { type: string }
                  request_id: { type: string, format: uuid }
        '400': { description: 参数错误（请求体为空或字段校验失败） }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 端点不存在 }

  /api-security/endpoints/{id}/merge:
    post:
      summary: 合并端点
      description: 将 other_id 端点并入当前端点（命中数累加、历史端点键归档、删除 other）。需要权限 api_asset.merge
      tags: [api-security]
      operationId: mergeApiEndpoint
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [other_id]
              properties:
                other_id: { type: string, format: uuid }
      responses:
        '200':
          description: 端点已合并（返回合并后的端点）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      endpoint: { $ref: '#/components/schemas/ApiEndpoint' }
                      message: { type: string }
                  request_id: { type: string, format: uuid }
        '400': { description: 参数错误（other_id 为空或合并到自身） }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 端点或待合并端点不存在 }

  /api-security/endpoints/{id}/split:
    post:
      summary: 拆分端点
      description: 按给定路径从当前端点拆分出新端点（路径自动归一化，单次最多 50 个）。需要权限 api_asset.split
      tags: [api-security]
      operationId: splitApiEndpoint
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 50
      responses:
        '200':
          description: 端点已拆分（返回新创建的端点列表）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      endpoints:
                        type: array
                        items: { $ref: '#/components/schemas/ApiEndpoint' }
                      message: { type: string }
                  request_id: { type: string, format: uuid }
        '400': { description: 参数错误（拆分路径为空或超过 50 个） }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 端点不存在 }
        '409': { description: 拆分目标路径与现有端点冲突 }

  /api-security/endpoints/{id}/ignore:
    post:
      summary: 忽略端点
      description: 将端点资产状态置为 IGNORED。需要权限 api_asset.ignore
      tags: [api-security]
      operationId: ignoreApiEndpoint
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 端点已忽略
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      endpoint: { $ref: '#/components/schemas/ApiEndpoint' }
                      message: { type: string }
                  request_id: { type: string, format: uuid }
        '400': { description: 无效的端点ID }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 端点不存在 }

  /api-security/endpoints/{id}/classify:
    post:
      summary: 自动分类端点
      description: 按路径/方法启发式自动分类，写入分类维度（source=AUTO）。需要权限 api_asset.edit
      tags: [api-security]
      operationId: classifyApiEndpoint
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 自动分类完成（返回分类维度）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      dimensions:
                        type: array
                        items: { $ref: '#/components/schemas/ApiClassificationDimension' }
                      message: { type: string }
                  request_id: { type: string, format: uuid }
        '400': { description: 无效的端点ID }
        '401': { description: 未登录或会话失效 }
        '403': { description: 无权限 }
        '404': { description: 端点不存在 }
        '409': { description: 分类已锁定，请先解锁后再执行自动分类 }

  /api-security/endpoints/{id}/classification:
    put:
      summary: 手动设置端点分类
      description: 手动覆盖端点分类维度（source=MANUAL）并锁定 classification_locked。需要权限 api_classification.manage
      tags: [api-security]
      operationId: putEndpointClassification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dimensions]
              properties:
                dimensions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [dimension, value]
                    properties:
                      dimension: { type: string, minLength: 1, maxLength: 64 }
