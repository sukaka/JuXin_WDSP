openapi: 3.0.3
info:
  title: 九章WEB应用智能防护系统 V2.0 管理API
  description: |
    九章管理后端 RESTful API（阶段2：身份认证、三权权限与系统基础）。
    认证方式：HttpOnly Cookie（jiuzhang_session）+ CSRF Token（X-CSRF-Token 头）。
  version: 2.0.0-stage2
  contact:
    name: 聚信得仁

servers:
  - url: /api/v1
    description: 管理API基础路径

tags:
  - name: auth
    description: 身份认证
  - name: users
    description: 用户管理
  - name: roles
    description: 角色权限
  - name: login-logs
    description: 登录日志
  - name: audits
    description: 操作审计
  - name: system-settings
    description: 系统设置
  - name: profile
    description: 个人中心

paths:
  /health:
    get:
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务及依赖状态

  /auth/captcha:
    get:
      summary: 获取图形验证码
      tags: [auth]
      security: []
      responses:
        '200':
          description: 验证码ID与图片（data:image/png;base64）

  /auth/login:
    post:
      summary: 用户登录
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, captcha_id, captcha_code]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                captcha_id: { type: string }
                captcha_code: { type: string }
      responses:
        '200':
          description: 登录成功（Set-Cookie 下发会话，data 含 csrf_token）
        '401':
          description: 用户名或密码错误（统一提示）
        '400':
          description: 验证码错误

  /auth/logout:
    post:
      summary: 退出登录
      tags: [auth]
      responses:
        '200':
          description: 已退出

  /auth/me:
    get:
      summary: 当前登录用户信息
      tags: [auth]
      responses:
        '200':
          description: 用户信息 + csrf_token
        '401':
          description: 未登录

  /auth/change-password:
    post:
      summary: 修改密码
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '200':
          description: 修改成功（需重新登录）

  /auth/sessions:
    get:
      summary: 当前用户会话列表
      tags: [auth]
      responses:
        '200':
          description: 会话摘要列表

  /auth/sessions/{id}:
    delete:
      summary: 结束指定会话
      tags: [auth]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 会话已结束

  /users:
    get:
      summary: 用户列表
      tags: [users]
      parameters:
        - { name: username, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: role_code, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 分页用户列表
    post:
      summary: 创建用户（返回一次性临时密码）
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, role_code]
              properties:
                username: { type: string }
                display_name: { type: string }
                role_code: { type: string, enum: [SYSTEM_ADMIN, SECURITY_ADMIN, AUDIT_ADMIN] }
      responses:
        '200':
          description: 创建成功（data.temporary_password 仅显示一次）

  /users/{id}:
    get:
      summary: 用户详情
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 用户信息 }
        '404': { description: 用户不存在 }
    put:
      summary: 修改用户（乐观锁 version）
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 修改成功 }
        '409': { description: 版本冲突 }
    delete:
      summary: 删除用户（逻辑删除）
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 已删除 }

  /users/{id}/enable:
    post: { summary: 启用用户, tags: [users], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /users/{id}/disable:
    post: { summary: 停用用户, tags: [users], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /users/{id}/unlock:
    post: { summary: 解锁用户, tags: [users], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /users/{id}/reset-password:
    post: { summary: 重置密码（返回临时密码）, tags: [users], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /users/{id}/sessions:
    delete: { summary: 强制用户下线, tags: [users], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }

  /roles:
    get:
      summary: 角色列表
      tags: [roles]
      responses:
        '200': { description: 角色列表 }

  /roles/{id}:
    get:
      summary: 角色详情（含权限）
      tags: [roles]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 角色与权限 }

  /permissions:
    get:
      summary: 权限清单
      tags: [roles]
      responses:
        '200': { description: 权限清单 }

  /login-logs:
    get:
      summary: 登录日志查询
      tags: [login-logs]
      responses:
        '200': { description: 分页登录日志 }

  /login-logs/export:
    get:
      summary: 导出登录日志（CSV）
      tags: [login-logs]
      responses:
        '200': { description: CSV 文件, content: { text/csv: {} } }

  /audits:
    get:
      summary: 操作审计查询
      tags: [audits]
      responses:
        '200': { description: 分页操作审计 }

  /audits/{id}:
    get:
      summary: 审计详情
      tags: [audits]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 审计详情 }

  /audits/export:
    get:
      summary: 导出审计（CSV）
      tags: [audits]
      responses:
        '200': { description: CSV 文件, content: { text/csv: {} } }

  /audits/verify-chain:
    post:
      summary: 校验审计哈希链
      tags: [audits]
      responses:
        '200': { description: 校验结果 {valid, mismatch_count} }

  /system-settings:
    get:
      summary: 系统设置列表
      tags: [system-settings]
      parameters:
        - { name: group, in: query, schema: { type: string, enum: [password, login, session, display] } }
      responses:
        '200': { description: 设置列表（敏感值脱敏） }
    put:
      summary: 更新系统设置（乐观锁 version）
      tags: [system-settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setting_group, setting_key, setting_value, version]
              properties:
                setting_group: { type: string }
                setting_key: { type: string }
                setting_value: {}
                version: { type: integer }
      responses:
        '200': { description: 更新成功 }
        '409': { description: 版本冲突 }

  /profile:
    get:
      summary: 个人资料
      tags: [profile]
      responses:
        '200': { description: 个人资料与权限 }
    put:
      summary: 修改个人资料（显示名）
      tags: [profile]
      responses:
        '200': { description: 修改成功 }

  /profile/login-logs:
    get:
      summary: 我的登录记录
      tags: [profile]
      responses:
        '200': { description: 分页登录记录 }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jiuzhang_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

  schemas:
    ApiResponse:
      type: object
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string }
        data: {}
        request_id: { type: string, format: uuid }

    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: PERMISSION_DENIED }
        message: { type: string }
        details: {}
        request_id: { type: string, format: uuid }

security:
  - cookieAuth: []
  - csrfToken: []
