    border: 1px solid #2c3a52;
    border-radius: 6px;
    padding: 16px 18px;
    font-size: 13px;
    margin-bottom: 26px;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    word-break: break-all;
  }
  .meta-label { color: #7c8aa5; flex-shrink: 0; padding-right: 16px; }
  .meta-value { color: #c3cede; font-family: "SF Mono", Menlo, Consolas, monospace; }
  .contact {
    font-size: 13px;
    color: #8fa0bb;
    line-height: 1.7;
    border-top: 1px solid #2c3a52;
    padding-top: 18px;
  }
  .brand {
    margin-top: 24px;
    font-size: 12px;
    color: #5a6a86;
    text-align: center;
    letter-spacing: 2px;
