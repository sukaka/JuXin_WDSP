# 可选：若压测源站希望使用 Nginx 提供纯静态 10G 线速大文件下载，可将此配置放到 Nginx conf.d。
# 注意：带请求体的 POST/Multipart 压测强烈建议使用同目录 origin/main.go（保证完整读取 body，避免早退 RST）。
# 使用前先生成静态文件：
#   mkdir -p /var/www/wdsp-bench/static
#   dd if=/dev/zero bs=256 count=1 | tr '\0' 'A' > /var/www/wdsp-bench/static/256b.txt
#   dd if=/dev/zero bs=16384 count=1 | tr '\0' 'C' > /var/www/wdsp-bench/static/16k.bin
#   dd if=/dev/zero bs=65536 count=1 | tr '\0' 'D' > /var/www/wdsp-bench/static/64k.bin

server {
    listen 18090 reuseport backlog=65535;
    server_name _;

    access_log off;
    error_log /var/log/nginx/wdsp-bench-error.log crit;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120s;
    keepalive_requests 100000;
    open_file_cache max=1024 inactive=60s;

    root /var/www/wdsp-bench;

    location /static/ {
        add_header X-Wdsp-Bench-Origin "nginx-static" always;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
