# P1-01 A1 演示专用 Collector（对照配置：显式不采样证据）
# 适配版本：otel/opentelemetry-collector-contrib:0.154.0
#
# 与 demo-keep-all.yaml 的唯一差异：tail_sampling 的 baseline 策略从
# probabilistic 100 改为 probabilistic 0——正常 trace 确定性不被保留
# （错误/慢(≥2s)/WAF 高风险三条优先策略不变，仍全保留）。
#
# 用途（任务书 §3.2 场景「数据面异常-停采样」与 §4.3 reason NOT_SAMPLED_CONFIRMED）：
#   1. 切到本配置（DEMO_COLLECTOR_CONFIG=demo-sampled.yaml，仅重建本 run 的 collector）；
#   2. 发送正常流量；
#   3. verify 核对三件事实：collector receiver 已接收 span（accepted 计数增长）、
#      exporter 未发出对应 span（sent 计数不增 / tail_sampling 决策计数为不采样）、
#      ClickHouse 中查不到该 trace——三者齐备才构成「有证据的不采样」，
#      否则只能如实报 UNKNOWN/NO_MATCH。
#
# 偏离说明：产品基线为 5%（central-gateway.yaml baseline-5pct）；演示取 0% 是为了
# 让「不采样」在少量请求下确定性发生，不是产品默认值的变更。
# 其余段落（脱敏清单、批处理、exporter、背压）与 demo-keep-all.yaml 逐行一致，
# 修改时必须同步两份文件。

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317    # compose 内网明文；不发布宿主机端口
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # 二层脱敏（与 central-gateway.yaml 同步清单）：源头已删的禁止字段在此重复删除兜底
  attributes/forbidden:
    actions:
      - {key: authorization, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.proxy-authorization, action: delete}
      - {key: cookie, action: delete}
      - {key: http.request.header.cookie, action: delete}
      - {key: set-cookie, action: delete}
      - {key: http.response.header.set-cookie, action: delete}
      - {key: http.request.header.x-api-key, action: delete}
      - {key: api_key, action: delete}
      - {key: jwt, action: delete}
      - {key: client_cert.private_key, action: delete}
      - {key: http.request.body, action: delete}
      - {key: http.response.body, action: delete}
      - {key: messaging.message.body, action: delete}
      - {key: db.statement.bind_values, action: delete}
      - {key: db.connection_string, action: delete}
      - {key: url.query, action: delete}
      - {key: http.target, action: delete}
      - {key: process.command_line, action: delete}
      - {key: process.command_args, action: delete}
      - {key: process.environment_variable, action: delete}

  # 二层正则脱敏（与 central-gateway.yaml 同步模式清单）
  redaction:
    allow_all_keys: true
    blocked_values:
      - (?i)bearer\s+[a-z0-9\-._~+/]+=*          # Bearer/JWT 形态令牌
      - \b1[3-9]\d{9}\b                          # 手机号（中国大陆号段）
      - \b\d{17}[\dXx]\b                         # 身份证号
      - \b\d{16,19}\b                            # 银行卡号（连号）
      - (?i)(password|passwd|pwd|secret|token)\s*[:=]\s*\S+   # key=value 形态秘密
    summary: silent

  # 尾采样（对照形态）：错误/慢/WAF 高风险全留，正常基线 0%（确定性不采样）。
  tail_sampling:
    decision_wait: 5s
    num_traces: 50000
    expected_new_traces_per_sec: 200
    policies:
      - name: errors-keep-all
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: slow-keep-all              # 慢阈值 2000ms，与产品口径一致
        type: latency
        latency: {threshold_ms: 2000}
      - name: waf-high-risk              # 与产品一致；演示业务不写该属性（自然不命中）
        type: string_attribute
        string_attribute: {key: jiuzhang.waf_action, values: [BLOCK]}
      - name: baseline-0pct              # 对照形态：正常流量确定性不保留（证据见文件头）
        type: probabilistic
        probabilistic: {sampling_percentage: 0}

  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  # 写入演示专用 ClickHouse（schema 引用 deployment/apm/clickhouse；create_schema: false）
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: apm
    traces_table_name: otel_traces
    create_schema: false
    async_insert: true
    username: ${env:CLICKHOUSE_APM_WRITER_USER}
    password: ${env:CLICKHOUSE_APM_WRITER_PASSWORD}
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133   # compose 仅映射到回环；run.sh 外部探测

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/forbidden, redaction, tail_sampling, batch]
      exporters: [clickhouse]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0   # 自监控（compose 仅映射到回环；采样决策证据来源）
                port: 8888
    logs:
      level: info
