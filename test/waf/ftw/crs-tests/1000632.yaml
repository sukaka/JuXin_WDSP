---
meta:
  author: "JiuZhang CUSTOM_PACK"
  description: "Java serialization magic in escaped hex/unicode form (1000632)"
rule_id: 1000632
tests:
  - test_id: 1
    desc: "escaped \\xac\\xed text inside form value"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'blob={"blob":"\xac\xed\x00\x05sr"}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000632]
  - test_id: 2
    desc: "escaped \\u00ac\\u00ed text inside form value"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'blob={"blob":"\u00ac\u00ed\u0000\u0005"}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000632]
