---
meta:
  author: "JiuZhang CUSTOM_PACK"
  description: "ysoserial.net gadget chain type names (1000637)"
rule_id: 1000637
tests:
  - test_id: 1
    desc: "ActivitySurrogateSelector gadget in query arg"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/get?type=ActivitySurrogateSelector"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000637]
  - test_id: 2
    desc: "TextFormattingRunProperties gadget in body"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "gadget=TextFormattingRunProperties"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000637]
