---
meta:
  author: "JiuZhang CUSTOM_PACK"
  description: "phpggc gadget namespace in serialized object (1000642)"
rule_id: 1000642
tests:
  - test_id: 1
    desc: "Monolog gadget namespace serialized form in body"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'd=O:29:"Monolog\Handler\BufferHandler":1:{}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000642]
  - test_id: 2
    desc: "GuzzleHttp gadget namespace serialized form in query arg"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/get?d=O:31:%22GuzzleHttp%5CHandler%5CProxy%22:1:%7B%7D"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000642]
