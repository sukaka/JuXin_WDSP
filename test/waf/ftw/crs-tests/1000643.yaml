---
meta:
  author: "JiuZhang CUSTOM_PACK"
  description: "fastjson @type key with unicode escape obfuscation (1000643)"
rule_id: 1000643
tests:
  - test_id: 1
    desc: "\\u0040type escaped key in form value"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'j={"\u0040type":"com.example.Demo","name":"x"}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000643]
  - test_id: 2
    desc: "@\\u0074ype escaped key in form value"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'j={"@\u0074ype":"com.example.Demo"}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000643]
  - test_id: 3
    desc: "plain @type without escape must not trigger"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'j={"@type":"com.example.Demo"}'
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [1000643]
