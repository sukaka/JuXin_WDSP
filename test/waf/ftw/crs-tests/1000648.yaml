---
meta:
  author: "JiuZhang CUSTOM_PACK"
  description: "fastjson @type key mixed-case variant (1000648)"
rule_id: 1000648
tests:
  - test_id: 1
    desc: "@Type mixed-case key in form value"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'j={"@Type":"com.sun.rowset.JdbcRowSetImpl"}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000648]
  - test_id: 2
    desc: "@Type as form parameter name"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "@Type=com.example.Demo"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1000648]
  - test_id: 3
    desc: "all-lowercase @type key must not trigger (covered by 1000924)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'j={"@type":"com.example.Demo"}'
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [1000648]
