---
meta:
  author: "JiuZhang"
  description: X-Filename 头双扩展名伪装（图片在前，如 evil.jpg.aspx，自建规则 1001303）
rule_id: 1001303
tests:
  - test_id: 1
    desc: "X-Filename 头 photo.jpg.aspx"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: "application/octet-stream"
            X-Filename: "photo.jpg.aspx"
          method: POST
          port: 80
          uri: "/upload"
          data: "x=1"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001303]
  - test_id: 2
    desc: "X-Filename 头 avatar.png.war"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: "application/octet-stream"
            X-Filename: "avatar.png.war"
          method: POST
          port: 80
          uri: "/upload"
          data: "x=1"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001303]
