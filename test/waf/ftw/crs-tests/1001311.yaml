---
meta:
  author: "JiuZhang"
  description: 脚本+压缩双扩展名检测（evil.php.gz / shell.jsp.bz2 等，自建规则 1001311）
rule_id: 1001311
tests:
  - test_id: 1
    desc: "multipart 文件名 evil.php.gz"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: "multipart/form-data; boundary=jzb311"
          method: POST
          port: 80
          uri: "/upload"
          data: "--jzb311\r\nContent-Disposition: form-data; name=\"file\"; filename=\"evil.php.gz\"\r\nContent-Type: application/gzip\r\n\r\nx\r\n--jzb311--\r\n"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001311]
  - test_id: 2
    desc: "X-Filename 头 shell.jsp.bz2（urlencoded 通道规避 CRS 920420 内容类型策略）"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: "application/x-www-form-urlencoded"
            X-Filename: "shell.jsp.bz2"
          method: POST
          port: 80
          uri: "/upload"
          data: "x=1"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001311]
