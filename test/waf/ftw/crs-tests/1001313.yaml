---
meta:
  author: "JiuZhang"
  description: RAR 内容含脚本文件名检测（Rar! 魔数后窗口内出现脚本扩展名，自建规则 1001313）
rule_id: 1001313
tests:
  - test_id: 1
    desc: "urlencoded 提交 RAR 魔数后文件名区域含 cmd.jsp"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: "application/x-www-form-urlencoded"
          method: POST
          port: 80
          uri: "/upload"
          data: "file=Rar!%1a%07aaaaaaaacmd.jsp"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001313]
  - test_id: 2
    desc: "urlencoded 提交 RAR 魔数后文件名区域含 shell.aspx"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: "application/x-www-form-urlencoded"
          method: POST
          port: 80
          uri: "/upload"
          data: "file=Rar!%1a%07bbbbbbbbshell.aspx"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001313]
