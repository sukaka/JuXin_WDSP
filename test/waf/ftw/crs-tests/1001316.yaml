---
meta:
  author: "JiuZhang"
  description: multipart Content-Type 头重复 boundary 参数检测（自建规则 1001316）
rule_id: 1001316
tests:
  - test_id: 1
    desc: "同一 Content-Type 头出现两个 boundary 参数"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: "multipart/form-data; boundary=aaaa; boundary=bbbb"
          method: POST
          port: 80
          uri: "/upload"
          data: "--aaaa\r\nContent-Disposition: form-data; name=\"x\"\r\n\r\n1\r\n--aaaa--\r\n"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001316]
