---
meta:
  author: "JiuZhang Security Team"
  description: "JSP Runtime exec whitespace variant in scriptlet"
rule_id: 1001401
tests:
  - test_id: 1
    desc: "JSP Runtime exec whitespace variant in scriptlet"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% String c = request.getParameter("c"); Runtime . getRuntime() . exec(c); %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001401]
