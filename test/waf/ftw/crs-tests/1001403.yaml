---
meta:
  author: "JiuZhang Security Team"
  description: "JSP reflective defineClass access (memory shell)"
rule_id: 1001403
tests:
  - test_id: 1
    desc: "JSP reflective defineClass access (memory shell)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% java.lang.reflect.Method m = ClassLoader.class.getDeclaredMethod("defineClass", String.class); %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001403]
