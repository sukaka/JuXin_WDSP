---
meta:
  author: "JiuZhang Security Team"
  description: "JSP java.io file write bound to request parameter"
rule_id: 1001409
tests:
  - test_id: 1
    desc: "JSP java.io file write bound to request parameter"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% java.io.FileOutputStream f = new java.io.FileOutputStream(request.getParameter("p")); %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001409]
  - test_id: 2
    desc: "JSP java.io file write bound to request parameter"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% String p = request.getParameter("t"); java.io.FileWriter w = new java.io.FileWriter(p); %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001409]
