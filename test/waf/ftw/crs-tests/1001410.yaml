---
meta:
  author: "JiuZhang Security Team"
  description: "JSP base64 bytecode with defineClass (memory shell loader)"
rule_id: 1001410
tests:
  - test_id: 1
    desc: "JSP base64 bytecode with defineClass (memory shell loader)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% byte[] b = new sun.misc.BASE64Decoder().decodeBuffer(d); defineClass(n, b, 0, b.length); %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001410]
  - test_id: 2
    desc: "JSP base64 bytecode with defineClass (memory shell loader)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% defineClass(n, b, 0, l); byte[] b2 = java.util.Base64.getDecoder().decode(s); %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001410]
