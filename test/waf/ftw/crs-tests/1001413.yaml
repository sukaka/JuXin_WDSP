---
meta:
  author: "JiuZhang Security Team"
  description: "ASP FileSystemObject file write pattern"
rule_id: 1001413
tests:
  - test_id: 1
    desc: "ASP FileSystemObject file write pattern"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% Set fso = CreateObject("Scripting.FileSystemObject") : fso.CreateTextFile(p) %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001413]
