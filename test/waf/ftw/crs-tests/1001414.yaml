---
meta:
  author: "JiuZhang Security Team"
  description: "ASP execute/ExecuteGlobal bound to request.form/querystring"
rule_id: 1001414
tests:
  - test_id: 1
    desc: "ASP execute/ExecuteGlobal bound to request.form/querystring"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% execute request.form("c") %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001414]
  - test_id: 2
    desc: "ASP execute/ExecuteGlobal bound to request.form/querystring"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% ExecuteGlobal request("c") %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001414]
