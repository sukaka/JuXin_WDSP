---
meta:
  author: "JiuZhang Security Team"
  description: "ASPX Process.Start on shell binary or request"
rule_id: 1001416
tests:
  - test_id: 1
    desc: "ASPX Process.Start on shell binary or request"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% System.Diagnostics.Process.Start("cmd.exe", "/c whoami"); %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001416]
  - test_id: 2
    desc: "ASPX Process.Start on shell binary or request"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% Process.Start(Request["c"]); %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001416]
