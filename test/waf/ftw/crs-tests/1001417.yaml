---
meta:
  author: "JiuZhang Security Team"
  description: "ASPX ProcessStartInfo FileName/Arguments shell assignment"
rule_id: 1001417
tests:
  - test_id: 1
    desc: "ASPX ProcessStartInfo FileName/Arguments shell assignment"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% psi.FileName = "powershell.exe"; %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001417]
  - test_id: 2
    desc: "ASPX ProcessStartInfo FileName/Arguments shell assignment"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% psi.Arguments = "/c whoami"; %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001417]
