---
meta:
  author: "JiuZhang Security Team"
  description: "ASPX Assembly.Load on base64/request input (memory shell)"
rule_id: 1001419
tests:
  - test_id: 1
    desc: "ASPX Assembly.Load on base64/request input (memory shell)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=<% Assembly.Load(Convert.FromBase64String(Request["d"])); %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001419]
