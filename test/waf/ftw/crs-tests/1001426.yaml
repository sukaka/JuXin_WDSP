---
meta:
  author: "JiuZhang Security Team"
  description: "Python subprocess bound to web request"
rule_id: 1001426
tests:
  - test_id: 1
    desc: "Python subprocess bound to web request"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=import subprocess; subprocess.Popen(request.form["c"], shell=True)'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001426]
