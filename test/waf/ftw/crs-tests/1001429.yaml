---
meta:
  author: "JiuZhang Security Team"
  description: "Cross-language eval on request object (one-liner)"
rule_id: 1001429
tests:
  - test_id: 1
    desc: "Cross-language eval on request object (one-liner)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=var x = eval(req.body.code);'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001429]
  - test_id: 2
    desc: "Cross-language eval on request object (one-liner)"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=eval(Request["c"])'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001429]
