---
meta:
  author: "JiuZhang Security Team"
  description: "Node.js child_process exec bound to request input"
rule_id: 1001430
tests:
  - test_id: 1
    desc: "Node.js child_process exec bound to request input"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=var cp = require("child_process"); cp.exec(req.query.c);'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001430]
  - test_id: 2
    desc: "Node.js child_process exec bound to request input"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'file=require("child_process").spawn(req.body.c);'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001430]
