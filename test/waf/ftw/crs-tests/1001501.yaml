---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF 伪协议 jar/netdoc/corbaname/iiopname 锚定检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001501
tests:
  - test_id: 1
    desc: "jar:// 伪协议出现在参数值开头"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/get?u=jar://evil.example/payload.jar!/"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001501]
