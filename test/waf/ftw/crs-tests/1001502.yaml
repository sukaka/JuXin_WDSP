---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF file:// 带主机形态检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001502
tests:
  - test_id: 1
    desc: "JSON 请求体中 file://host/share 形态"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/json
          method: POST
          port: 80
          uri: "/post"
          data: '{"fetch":"mirror file://evil.internal/share/passwd"}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001502]
