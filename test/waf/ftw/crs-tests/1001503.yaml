---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF CORBA 命名协议 corbaname/iiopname 非锚定检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001503
tests:
  - test_id: 1
    desc: "JSON 请求体中 corbaname:// 协议"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/json
          method: POST
          port: 80
          uri: "/post"
          data: '{"target":"via corbaname://evil.example/NameService"}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001503]
