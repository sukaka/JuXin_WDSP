---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF 协议相对 URL（//内网地址）检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001504
tests:
  - test_id: 1
    desc: "参数值为 //127.0.0.1/ 协议相对 URL"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/get?url=//127.0.0.1/admin"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001504]
