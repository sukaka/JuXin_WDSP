---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF 十进制整数 IP 主机检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001505
tests:
  - test_id: 1
    desc: "http://3232235521/ 即 192.168.0.1 的十进制混淆"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/get?url=http://3232235521/"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001505]
