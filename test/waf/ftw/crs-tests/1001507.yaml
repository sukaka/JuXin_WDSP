---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF 分点十六进制 IP 检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001507
tests:
  - test_id: 1
    desc: "http://0xa9.0xfe.0xa9.0xfe/ 即 169.254.169.254 的分点十六进制"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/get?url=http://0xa9.0xfe.0xa9.0xfe/"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001507]
