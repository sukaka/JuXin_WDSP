---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF 十六进制+点分混合回环写法检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001508
tests:
  - test_id: 1
    desc: "http://0x7f.1/ 即 127.0.0.1 的混合省略写法"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/get?url=http://0x7f.1/"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001508]
