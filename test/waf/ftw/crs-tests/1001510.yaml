---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF 内网短格式省略写法检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001510
tests:
  - test_id: 1
    desc: "http://192.168.1/ 三段短格式内网地址"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/get?url=http://192.168.1/"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001510]
