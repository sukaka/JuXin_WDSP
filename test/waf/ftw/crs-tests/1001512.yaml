---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF 全展开 IPv6 回环检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001512
tests:
  - test_id: 1
    desc: "http://[0:0:0:0:0:0:0:1]/ 全展开 IPv6 回环"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/get?url=http://[0:0:0:0:0:0:0:1]/"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001512]
