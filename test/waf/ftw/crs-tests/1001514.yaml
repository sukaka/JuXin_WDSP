---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF IPv4 映射 IPv6 元数据地址检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001514
tests:
  - test_id: 1
    desc: "http://[::ffff:a9fe:a9fe]/ 即 169.254.169.254 的 IPv6 映射写法"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/get?url=http://[::ffff:a9fe:a9fe]/latest/meta-data"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001514]
