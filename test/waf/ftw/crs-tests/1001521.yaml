---
meta:
  author: "JiuZhang WAF Team"
  description: "SSRF 明文嵌套 URL 重定向链检测（CUSTOM_PACK ssrf-protocols）"
rule_id: 1001521
tests:
  - test_id: 1
    desc: "redirect 参数值中嵌套第二个 https://"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "redirect=https://safe.example/cb?next=https://evil.internal/x"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001521]
