---
meta:
  author: "JiuZhang WAF Team"
  description: XXE payload embedded in SVG document (CUSTOM_PACK)
rule_id: 1001604
tests:
  - test_id: 1
    desc: "DOCTYPE svg with external ENTITY declaration"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Content-Type: image/svg+xml
          method: POST
          port: 80
          uri: "/post"
          data: '<!DOCTYPE svg [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><svg/>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001604]
