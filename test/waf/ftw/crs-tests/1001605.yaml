---
meta:
  author: "JiuZhang WAF Team"
  description: XInclude href to local wrapper file/php/expect (CUSTOM_PACK)
rule_id: 1001605
tests:
  - test_id: 1
    desc: "xi:include href pointing to file:///etc/passwd"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/xml
          method: POST
          port: 80
          uri: "/post"
          data: '<root xmlns:xi="http://www.w3.org/2001/XInclude"><xi:include href="file:///etc/passwd"/></root>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001605]
