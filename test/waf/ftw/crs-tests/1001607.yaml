---
meta:
  author: "JiuZhang WAF Team"
  description: DOCTYPE embedded inside SOAP Envelope/Body (CUSTOM_PACK)
rule_id: 1001607
tests:
  - test_id: 1
    desc: "SOAP envelope whose body carries a DOCTYPE declaration"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/xml
          method: POST
          port: 80
          uri: "/post"
          data: '<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"><soapenv:Body><!DOCTYPE foo [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><m/></soapenv:Body></soapenv:Envelope>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001607]
