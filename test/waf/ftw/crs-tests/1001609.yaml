---
meta:
  author: "JiuZhang WAF Team"
  description: XXE external entity with exotic URI scheme (CUSTOM_PACK)
rule_id: 1001609
tests:
  - test_id: 1
    desc: "SYSTEM entity using netdoc: scheme"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/xml
          method: POST
          port: 80
          uri: "/post"
          data: '<!DOCTYPE r [<!ENTITY xxe SYSTEM "netdoc:///etc/passwd">]><r/>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001609]
