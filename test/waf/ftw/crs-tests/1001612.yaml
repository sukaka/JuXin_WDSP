tests:
  - test_id: 1
    desc: "php://filter with convert.iconv chain"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "file=php://filter/convert.iconv.utf-8.utf-16/resource=/etc/passwd"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001612]
