---
meta:
  author: "JiuZhang WAF Team"
  description: data:// wrapper with base64 payload, generic MIME (CUSTOM_PACK)
rule_id: 1001613
tests:
  - test_id: 1
    desc: "data:// with empty MIME and base64 payload"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "x=data://;base64,PD9waHAgcGhwaW5mbygpOw=="
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001613]
