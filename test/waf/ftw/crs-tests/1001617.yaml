---
meta:
  author: "JiuZhang WAF Team"
  description: Windows drive path to sensitive system file (CUSTOM_PACK)
rule_id: 1001617
tests:
  - test_id: 1
    desc: "c:\\windows\\system32\\config with backslashes"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "x=c%3a%5cwindows%5csystem32%5cconfig"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001617]
