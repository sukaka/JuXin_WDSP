---
meta:
  author: "JiuZhang WAF Team"
  description: IIS metabase/applicationHost.config read attempt (CUSTOM_PACK)
rule_id: 1001618
tests:
  - test_id: 1
    desc: "Traversal to IIS MetaBase.xml"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "x=..%5c..%5cwindows%5csystem32%5cinetsrv%5cmetabase.xml"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001618]
