---
meta:
  author: "JiuZhang WAF Team"
  description: Linux /proc extended sensitive entry read (CUSTOM_PACK)
rule_id: 1001619
tests:
  - test_id: 1
    desc: "/proc/self/maps read attempt"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "x=/proc/self/maps"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001619]
