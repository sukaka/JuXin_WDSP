---
meta:
  author: "JiuZhang WAF Team"
  description: file:// scheme read of local sensitive path (CUSTOM_PACK)
rule_id: 1001620
tests:
  - test_id: 1
    desc: "file:///etc/passwd in parameter"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "x=file:///etc/passwd"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001620]
