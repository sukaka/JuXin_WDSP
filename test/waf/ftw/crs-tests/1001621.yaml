---
meta:
  author: "JiuZhang WAF Team"
  description: Extended /etc sensitive file read, keys/sudoers/backups (CUSTOM_PACK)
rule_id: 1001621
tests:
  - test_id: 1
    desc: "/etc/sudoers read attempt"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "x=/etc/sudoers"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001621]
