    desc: "boot.ini bare filename with boundaries"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "note=please%20read%20boot.ini%20now"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001622]
