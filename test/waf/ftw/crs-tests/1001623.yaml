meta:
  author: "JiuZhang WAF Team"
  description: Half-double-encoded traversal, %%32%65 style (CUSTOM_PACK)
rule_id: 1001623
tests:
  - test_id: 1
    desc: "%%32%65%%32%65 mixed double encoding in URI"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
          method: GET
          port: 80
          uri: "/get?f=%%32%65%%32%65/etc"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001623]
