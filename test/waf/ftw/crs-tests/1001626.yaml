---
meta:
  author: "JiuZhang WAF Team"
  description: JSON unicode-escape path traversal (CUSTOM_PACK)
rule_id: 1001626
tests:
  - test_id: 1
    desc: ".. escape sequence inside JSON body"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/json
          method: POST
          port: 80
          uri: "/post"
          data: '{"f":"\u002e\u002e\u002fetc/passwd"}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001626]
