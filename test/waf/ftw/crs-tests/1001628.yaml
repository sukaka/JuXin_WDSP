---
meta:
  author: "JiuZhang WAF Team"
  description: Null-byte truncation before static extension (CUSTOM_PACK)
rule_id: 1001628
tests:
  - test_id: 1
    desc: "shell.php%00.jpg truncation form in raw body"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: "f=shell.php%00.jpg"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001628]
