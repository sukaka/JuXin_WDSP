---
meta:
  author: "JiuZhang"
  description: "CUSTOM_PACK 1001701: MySQL versioned inline comment with arbitrary content"
rule_id: 1001701
tests:
  - test_id: 1
    desc: "Versioned inline comment marker /*!12345 in parameter"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "JiuZhang CUSTOM_PACK test agent"
            Accept: "*/*"
          method: POST
          port: 80
          uri: "/post"
          data: "var=1' /*!12345 user()*/"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001701]
