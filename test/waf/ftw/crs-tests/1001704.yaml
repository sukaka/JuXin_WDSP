    desc: "update/**/xml comment-split error-based injection"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "JiuZhang CUSTOM_PACK test agent"
            Accept: "*/*"
          method: POST
          port: 80
          uri: "/post"
          data: "var=1' and update/**/xml(1,concat(0x7e,user()),1)-- -"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001704]
