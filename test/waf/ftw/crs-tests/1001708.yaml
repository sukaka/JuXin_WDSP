            Host: shop.example.com
            User-Agent: "JiuZhang CUSTOM_PACK test agent"
            Accept: "*/*"
          method: GET
          port: 80
          uri: "/get?id=1%bf%27"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001708]
