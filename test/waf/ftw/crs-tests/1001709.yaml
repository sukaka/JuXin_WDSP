    desc: "sleep/**/(5) comment between function name and parenthesis"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "JiuZhang CUSTOM_PACK test agent"
            Accept: "*/*"
          method: POST
          port: 80
          uri: "/post"
          data: "var=1' and sleep/**/(5)-- -"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001709]
