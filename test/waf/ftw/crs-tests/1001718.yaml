---
meta:
  author: "JiuZhang"
  description: "CUSTOM_PACK 1001718: ANSI-C octal / printf octal command execution"
rule_id: 1001718
tests:
  - test_id: 1
    desc: "printf octal escape piped to shell"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "JiuZhang CUSTOM_PACK test agent"
            Accept: "*/*"
          method: POST
          port: 80
          uri: "/post"
          data: "var=printf '\\143\\141\\164'|sh"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001718]
