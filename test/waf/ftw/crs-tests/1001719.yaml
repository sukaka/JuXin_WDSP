---
meta:
  author: "JiuZhang"
  description: "CUSTOM_PACK 1001719: base64 decode piped to shell"
rule_id: 1001719
tests:
  - test_id: 1
    desc: "base64 -d | sh decode-and-execute chain"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "JiuZhang CUSTOM_PACK test agent"
            Accept: "*/*"
          method: POST
          port: 80
          uri: "/post"
          data: "var=echo aGVsbG8=|base64 -d|sh"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001719]
