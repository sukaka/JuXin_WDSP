---
meta:
  author: "JiuZhang"
  description: "CUSTOM_PACK 1001720: reverse file read via tac/rev"
rule_id: 1001720
tests:
  - test_id: 1
    desc: "tac /etc/passwd reverse read"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "JiuZhang CUSTOM_PACK test agent"
            Accept: "*/*"
          method: POST
          port: 80
          uri: "/post"
          data: "var=tac /etc/passwd"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001720]
