---
meta:
  author: "JiuZhang"
  description: "CUSTOM_PACK 1001721: brace expansion echo piped to decoder"
rule_id: 1001721
tests:
  - test_id: 1
    desc: "{echo,aGVsbG8=}|base64 -d brace decode chain"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "JiuZhang CUSTOM_PACK test agent"
            Accept: "*/*"
          method: POST
          port: 80
          uri: "/post"
          data: "var={echo,aGVsbG8=}|base64 -d"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001721]
