---
meta:
  author: "JiuZhang"
  description: "CUSTOM_PACK 1001722: HTML template tag injection"
rule_id: 1001722
tests:
  - test_id: 1
    desc: "<template shadowrootmode> declarative shadow DOM injection"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "JiuZhang CUSTOM_PACK test agent"
            Accept: "*/*"
          method: POST
          port: 80
          uri: "/post"
          data: "var=<template shadowrootmode=open><img src=x onerror=alert(1)></template>"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001722]
