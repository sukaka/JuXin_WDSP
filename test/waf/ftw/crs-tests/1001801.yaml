---
meta:
  author: "JiuZhang WAF Team"
  description: Freemarker ?api builtin reflection access (CUSTOM_PACK ssti-injection)
rule_id: 1001801
tests:
  - test_id: 1
    desc: "Freemarker ?api builtin method invocation"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'var=${"freemarker.template.utility.Execute"?api.newInstance()}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001801]
  - test_id: 2
    desc: "Benign URL value containing ?api= must not match"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: "var=https://example.com/monitor?api=v2&format=json"
          version: HTTP/1.1
        output:
          log:
            no_expect_ids: [1001801]
