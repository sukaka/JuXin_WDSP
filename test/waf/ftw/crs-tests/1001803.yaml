---
meta:
  author: "JiuZhang WAF Team"
  description: Velocity ClassTool reflection helper (CUSTOM_PACK ssti-injection)
rule_id: 1001803
tests:
  - test_id: 1
    desc: "Velocity $class.type ClassTool access in #set"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'var=#set($x=$class.type.forName("java.lang.Runtime"))'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001803]
