---
meta:
  author: "JiuZhang WAF Team"
  description: SpEL new java.io/nio/net instantiation (CUSTOM_PACK ssti-injection)
rule_id: 1001805
tests:
  - test_id: 1
    desc: "SpEL new java.io.File / java.util.Scanner file read"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'var=${new java.util.Scanner(new java.io.File("/etc/passwd"))}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001805]
