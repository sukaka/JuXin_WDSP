---
meta:
  author: "JiuZhang WAF Team"
  description: Mako <%! %> module-level code block (CUSTOM_PACK ssti-injection)
rule_id: 1001809
tests:
  - test_id: 1
    desc: "Mako module-level block with import os and os.system"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'var=<%! import os; os.system("id"); %>'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001809]
