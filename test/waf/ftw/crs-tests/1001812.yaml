---
meta:
  author: "JiuZhang WAF Team"
  description: Groovy quoted string execute()/getText() (CUSTOM_PACK ssti-injection)
rule_id: 1001812
tests:
  - test_id: 1
    desc: "Groovy GString quoted string execute()"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: 'var=${"id".execute()}'
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001812]
