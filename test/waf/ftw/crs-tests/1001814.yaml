---
meta:
  author: "JiuZhang WAF Team"
  description: EL injection implicit object access ${...} (CUSTOM_PACK ssti-injection)
rule_id: 1001814
tests:
  - test_id: 1
    desc: "Jakarta EL ${pageContext...} implicit object"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: "var=${pageContext.request.session.id}"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001814]
  - test_id: 2
    desc: "JSF EL ${facesContext...} implicit object"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: "var=${facesContext.externalContext.response}"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001814]
