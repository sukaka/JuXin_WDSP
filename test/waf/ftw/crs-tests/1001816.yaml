---
meta:
  author: "JiuZhang WAF Team"
  description: SSTI string-multiplication probe ${7*'7'} / *{7*'7'} (CUSTOM_PACK ssti-injection)
rule_id: 1001816
tests:
  - test_id: 1
    desc: "Freemarker/EL string multiplication probe ${7*'7'}"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: "var=${7*'7'}"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001816]
  - test_id: 2
    desc: "Thymeleaf selection string multiplication probe *{7*'7'}"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: POST
          port: 80
          uri: "/post"
          data: "var=*{7*'7'}"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001816]
