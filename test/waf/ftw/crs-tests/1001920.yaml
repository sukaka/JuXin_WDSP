    desc: "WordPress wp-login.php probe"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: shop.example.com
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/wp-login.php"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001920]
  - test_id: 2
    desc: "WordPress /wp-admin/ probe"
