---
meta:
  author: "JiuZhang WAF Team"
  description: CUSTOM_PACK unauth-access tests (self-developed)
rule_id: 1001921
tests:
  - test_id: 1
    desc: "Joomla administrator path probe"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/administrator/"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001921]
  - test_id: 2
    desc: "Joomla administrator index.php probe"
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: "OWASP CRS test agent"
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          method: GET
          port: 80
          uri: "/administrator/index.php"
          version: HTTP/1.1
        output:
          log:
            expect_ids: [1001921]
