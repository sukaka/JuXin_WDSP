# P1-03 G2 取证用 Nginx 配置：TLS 终止 + mirror 到本机 mirrorsrc 适配器（Unix Socket）。
# __MIRROR_TOKEN__ 由 run.sh 现场替换（随机令牌，不落证据外的任何地方）。
user  nginx;
worker_processes  1;

error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log /dev/stdout;

    # 业务源站（同容器 loopback，harness origin）
    upstream business_backend { server 127.0.0.1:18081; }

    server {
        listen 8443 ssl;
        server_name mirror-e2e.local;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        # 伪造来源头覆盖：真实客户端地址由 Nginx 自行写入（客户端伪造值被覆盖），
        # 适配器侧仍不采信任何外部头做身份/拓扑判定
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # 默认：仅元数据镜像（不预读正文；子请求不含正文）
        location / {
            set $wdsp_mirror_target $request_uri;
            set $wdsp_orig_cl $http_content_length;
            mirror /__wdsp_mirror;
            proxy_pass http://business_backend;
        }

        # 按路径显式开启正文镜像（mirror_request_body 会预读正文，
        # 影响上传/流式业务时延——本配置即其真实影响取证）
        location /api/ {
            set $wdsp_mirror_target $request_uri;
            mirror /__wdsp_mirror_body;
            mirror_request_body on;
            client_max_body_size 64m;
            proxy_pass http://business_backend;
        }

        location /upload {
            set $wdsp_mirror_target $request_uri;
            mirror /__wdsp_mirror_body;
            mirror_request_body on;
            client_max_body_size 64m;
            proxy_pass http://business_backend;
        }

        # 元数据镜像出口（无正文：显式清空 Content-Length，防止接收端
        # 按继承的头等待不存在的正文）
        location = /__wdsp_mirror {
            internal;
            proxy_pass http://unix:/run/wdsp/mirror.sock:$wdsp_mirror_target;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-WDSP-Mirror-Instance "__MIRROR_TOKEN__";
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";
            # 原始正文大小经可信控制头传递（子请求 CL 已清空；适配器剥离不入记录）
            proxy_set_header X-WDSP-Original-Body-Size $wdsp_orig_cl;
        }

        # 正文镜像出口（保留子请求正文与其 Content-Length）
        # 正文镜像出口：保留子请求正文及其 Content-Length。
        # 注意：client_max_body_size 在 mirror 子请求进入本 internal location 时
        # 重新生效（默认 1m 会拒大正文子请求——见 G2 取证 nginx.log），必须对齐
        location = /__wdsp_mirror_body {
            internal;
            client_max_body_size 64m;
            proxy_pass http://unix:/run/wdsp/mirror.sock:$wdsp_mirror_target;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-WDSP-Mirror-Instance "__MIRROR_TOKEN__";
        }
    }
}
