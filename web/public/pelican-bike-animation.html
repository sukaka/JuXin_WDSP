<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3c86d" />
    <title>鹈鹕的海风骑行</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #243647;
        --cream: #fff8df;
        --sun: #f4b942;
        --coral: #ef6f51;
        --sea: #56aeb0;
        --deep-sea: #2d7180;
        --road: #596471;
        --speed: 1;
        --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
        color: var(--ink);
        background: #f3c86d;
        font-family: Palatino, "Book Antiqua", Georgia, serif;
      }

      button {
        font: inherit;
      }

      .page {
        position: relative;
        min-height: 100svh;
        isolation: isolate;
      }

      .masthead {
        position: absolute;
        z-index: 3;
        top: clamp(1.4rem, 4vw, 3rem);
        left: clamp(1.25rem, 5vw, 5rem);
        pointer-events: none;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0 0 0.45rem;
        color: #6f402b;
        font-family: "Trebuchet MS", sans-serif;
        font-size: clamp(0.66rem, 1.1vw, 0.82rem);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 2.1rem;
        height: 2px;
        content: "";
        background: currentColor;
      }

      h1 {
        max-width: 8ch;
        margin: 0;
        color: #243647;
        font-size: clamp(2.3rem, 6vw, 5.7rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.055em;
        text-wrap: balance;
      }

      .subtitle {
        max-width: 27rem;
        margin: 1rem 0 0 2.7rem;
        color: #6f402b;
        font-family: "Trebuchet MS", sans-serif;
        font-size: clamp(0.78rem, 1.25vw, 1rem);
        line-height: 1.6;
      }

      .controls {
        position: absolute;
        z-index: 4;
        top: clamp(1.25rem, 4vw, 2.5rem);
        right: clamp(1rem, 4vw, 3rem);
        display: flex;
        gap: 0.55rem;
      }

      .control {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.7rem 1rem;
        border: 1.5px solid color-mix(in oklch, var(--ink) 75%, transparent);
        border-radius: 999px;
        color: var(--ink);
        background: color-mix(in oklch, var(--cream) 88%, transparent);
        box-shadow: 0 4px 0 color-mix(in oklch, var(--ink) 22%, transparent);
        cursor: pointer;
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        transition:
          transform 180ms var(--ease-out-quint),
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .control:hover {
        background: var(--cream);
        transform: translateY(-2px);
        box-shadow: 0 6px 0 color-mix(in oklch, var(--ink) 22%, transparent);
      }

      .control:active {
        transform: translateY(2px) scale(0.97);
        box-shadow: 0 2px 0 color-mix(in oklch, var(--ink) 22%, transparent);
      }

      .control:focus-visible {
        outline: 3px solid var(--coral);
        outline-offset: 3px;
      }

      .control svg {
        width: 0.9rem;
        height: 0.9rem;
        fill: currentColor;
      }

      .stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100svh;
      }

      .paper-noise {
        pointer-events: none;
        position: absolute;
        z-index: 2;
        inset: 0;
        opacity: 0.16;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
        mix-blend-mode: multiply;
      }

      .cloud-far {
        animation: cloud-drift calc(32s / var(--speed)) linear infinite;
      }

      .cloud-near {
        animation: cloud-drift calc(22s / var(--speed)) linear infinite reverse;
      }

      .sun-rays {
        transform-origin: 913px 151px;
        animation: sun-spin calc(30s / var(--speed)) linear infinite;
      }

      .waves-a {
        animation: wave-slide calc(5s / var(--speed)) linear infinite;
      }

      .waves-b {
        animation: wave-slide calc(7s / var(--speed)) linear infinite reverse;
      }

      .road-lines,
      .grass-streaks {
        animation: road-run calc(1.35s / var(--speed)) linear infinite;
      }

      .rider {
        transform-origin: 650px 475px;
        animation: rider-bob calc(0.68s / var(--speed)) ease-in-out infinite;
      }

      .scarf-end {
        transform-origin: 557px 275px;
        animation: scarf-wave calc(0.68s / var(--speed)) ease-in-out infinite alternate;
      }

      .tail-feathers {
        transform-origin: 558px 404px;
        animation: tail-flick calc(1.36s / var(--speed)) ease-in-out infinite;
      }

      .beak-tip {
        transform-origin: 719px 289px;
        animation: beak-chat calc(2.72s / var(--speed)) ease-in-out infinite;
      }

      .wheel,
      .crank {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin calc(1.1s / var(--speed)) linear infinite;
      }

      .leg-front {
        transform-origin: 648px 407px;
        animation: pedal-front calc(1.1s / var(--speed)) ease-in-out infinite;
      }

      .leg-back {
        transform-origin: 633px 411px;
        animation: pedal-back calc(1.1s / var(--speed)) ease-in-out infinite;
      }

      .wing {
        transform-origin: 650px 349px;
        animation: wing-steer calc(2.2s / var(--speed)) ease-in-out infinite;
      }

      .shadow {
        transform-origin: center;
        animation: shadow-pulse calc(0.68s / var(--speed)) ease-in-out infinite;
      }

      .music-note {
        opacity: 0;
        animation: note-float calc(3.3s / var(--speed)) var(--ease-out-quint) infinite;
      }

      .music-note:nth-of-type(2) {
        animation-delay: calc(-1.65s / var(--speed));
      }

      @keyframes cloud-drift {
        from { transform: translateX(-110px); }
        to { transform: translateX(160px); }
      }

      @keyframes sun-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes wave-slide {
        from { transform: translateX(-24px); }
        to { transform: translateX(24px); }
      }

      @keyframes road-run {
        from { transform: translateX(0); }
        to { transform: translateX(-240px); }
      }

      @keyframes rider-bob {
        0%, 100% { transform: translateY(0) rotate(-0.15deg); }
        50% { transform: translateY(6px) rotate(0.3deg); }
      }

      @keyframes scarf-wave {
        from { transform: rotate(-4deg) skewX(-2deg); }
        to { transform: rotate(9deg) skewX(5deg); }
      }

      @keyframes tail-flick {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(5deg); }
      }

      @keyframes beak-chat {
        0%, 78%, 100% { transform: rotate(0); }
        84%, 94% { transform: rotate(4deg); }
        89% { transform: rotate(1deg); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pedal-front {
        0%, 100% { transform: rotate(14deg); }
        50% { transform: rotate(-20deg); }
      }

      @keyframes pedal-back {
        0%, 100% { transform: rotate(-18deg); }
        50% { transform: rotate(16deg); }
      }

      @keyframes wing-steer {
        0%, 100% { transform: rotate(-1deg); }
        50% { transform: rotate(2deg); }
      }

      @keyframes shadow-pulse {
        0%, 100% { transform: scaleX(1); opacity: 0.22; }
        50% { transform: scaleX(0.94); opacity: 0.17; }
      }

      @keyframes note-float {
        0% { transform: translate(0, 0) rotate(-8deg); opacity: 0; }
        15% { opacity: 0.7; }
        70% { opacity: 0.55; }
        100% { transform: translate(-36px, -72px) rotate(11deg); opacity: 0; }
      }

      .is-paused * {
        animation-play-state: paused !important;
      }

      .is-paused .pause-icon {
        display: none;
      }

      .play-icon {
        display: none;
      }

      .is-paused .play-icon {
        display: block;
      }

      @media (max-width: 700px) {
        .masthead {
          top: 1.1rem;
        }

        .subtitle {
          display: none;
        }

        .controls {
          top: auto;
          right: 50%;
          bottom: 1.15rem;
          transform: translateX(50%);
        }

        .stage {
          min-width: 860px;
          left: 50%;
          transform: translateX(-50%);
        }

        .control {
          background: var(--cream);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }

        .controls {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-labelledby="page-title">
      <header class="masthead">
        <p class="eyebrow">Coastal Cycle Club · No. 07</p>
        <h1 id="page-title">鹈鹕的<br />海风骑行</h1>
        <p class="subtitle">长嘴装着晚霞，车铃摇醒海风。今天也要沿着浪花，慢慢骑到世界尽头。</p>

        <!-- foreground tufts -->
        <g fill="none" stroke="#334e48" stroke-width="7" stroke-linecap="round" opacity="0.85">
          <path d="M74 711q0-44-21-75m20 75q8-51 39-82m-38 82q-13-27-42-38M1085 726q0-48 26-83m-27 83q-10-55-39-83m40 83q17-34 47-51" />
        </g>
      </svg>
      <div class="paper-noise" aria-hidden="true"></div>
    </main>

    <script>
      const body = document.body;
      const toggle = document.querySelector('#toggle-motion');
      const toggleLabel = toggle.querySelector('span');
      const speedControl = document.querySelector('#speed-control');
      const speedLabel = speedControl.querySelector('span:last-child');
      const speeds = [
        { label: '悠闲', value: 0.72 },
        { label: '巡航', value: 1 },
        { label: '追风', value: 1.45 },
      ];
      let speedIndex = 0;

      document.documentElement.style.setProperty('--speed', speeds[speedIndex].value);

      toggle.addEventListener('click', () => {
        const paused = body.classList.toggle('is-paused');
        toggle.setAttribute('aria-pressed', String(paused));
        toggleLabel.textContent = paused ? '继续' : '暂停';
      });

      speedControl.addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        const next = speeds[speedIndex];
        document.documentElement.style.setProperty('--speed', next.value);
        speedLabel.textContent = next.label;
        speedControl.setAttribute('aria-label', `动画速度：${next.label}，点击切换`);
      });
    </script>
  </body>
</html>
